 [{"label": "LII Wex — strict liability", "url": "https://www.law.cornell.edu/wex/strict_liability"}]}, {"id": "product-liability", "hw": "product liability", "ipa": "ˈprɑː.dʌkt ˌlaɪ.əˈbɪl.ə.t̬i", "stress": "**prod**·uct li·a·**bil**·i·ty", "stars": 2, "gloss": "제조물책임", "diff": "결함 있는 제품으로 다친 사람이 제조업자·판매업자에게 묻는 책임입니다. 결함은 제조상 결함(manufacturing defect), 설계상 결함(design defect), 표시상 결함(warning defect) 셋으로 나눕니다. 한국 제조물 책임법도 같은 세 유형을 정의하고 있어 대응이 비교적 잘 됩니다.", "examples": {"easy": {"en": "She filed a product liability suit.", "ko": "그녀는 제조물책임 소송을 냈다."}, "practice": {"en": "The company faces hundreds of products liability claims over its airbags.", "ko": "그 회사는 에어백 문제로 제조물책임 청구 수백 건을 안고 있다."}}, "grammar": {"axis": "G2", "title": "product liability / products liability — 둘 다 쓴다", "wrong": "a products liabilities case", "right": "a product liability case / a products liability case", "note": "명사가 다른 명사를 꾸밀 때는 보통 단수형(product)이지만, 미국 법률 용어로는 products liability도 굳어져 있습니다. 뒤의 liability는 어느 쪽이든 단수."}, "collocations": ["product liability claim / suit", "design defect", "failure to warn (경고 의무 위반)", "product recall (리콜)"], "links": [{"label": "LII Wex — products liability", "url": "https://www.law.cornell.edu/wex/products_liability"}]}, {"id": "comparative-negligence", "hw": "comparative negligence · contributory negligence", "ipa": "kəmˈper.ə.t̬ɪv ˈneɡ.lə.dʒəns · kənˈtrɪb.jə.tɔːr.i ˈneɡ.lə.dʒəns", "stress": "com·**par**·a·tive **neg**·li·gence · con·**trib**·u·to·ry **neg**·li·gence", "stars": 2, "gloss": "비교과실 · 기여과실", "diff": "피해자에게도 잘못이 있을 때의 처리 방식입니다. 기여과실(contributory negligence)은 옛 원칙으로, 피해자에게 조금이라도 과실이 있으면 배상을 한 푼도 못 받게 합니다. 비교과실(comparative negligence)은 과실 비율만큼 배상액을 줄입니다. 다만 다수 주가 채택한 수정 비교과실(modified comparative negligence)에서는 원고 과실이 50% 또는 51% 이상이면 배상을 받지 못합니다(LII Wex). 지금은 다수 법역이 비교과실로 옮겼고, 기여과실을 유지하는 곳은 메릴랜드·버지니아·앨라배마·노스캐롤라이나 등 소수입니다(LII Wex). 한국 민법의 과실상계(제763조, 제396조 준용)는 비교과실에 가깝습니다.", "examples": {"easy": {"en": "Both drivers were partly at fault.", "ko": "두 운전자 모두 일부 과실이 있었다."}, "practice": {"en": "Under comparative negligence, her award was reduced by 30 percent.", "ko": "비교과실 원칙에 따라 그녀의 배상액은 30퍼센트 감액되었다."}}, "grammar": {"axis": "G4", "title": "줄어든 '폭'은 by, 줄어든 '결과'는 to", "wrong": "The award was reduced to 30 percent. (30% 감액이라는 뜻으로)", "right": "The award was reduced by 30 percent.", "note": "reduce by 30 percent는 30%를 깎는다는 뜻, reduce to 30 percent는 30%만 남긴다는 뜻입니다. 숫자는 같아도 결과가 정반대입니다."}, "collocations": ["be at fault (과실이 있다)", "reduce damages by", "percentage of fault", "pure / modified comparative negligence"], "links": [{"label": "LII Wex — comparative negligence", "url": "https://www.law.cornell.edu/wex/comparative_negligence"}, {"label": "LII Wex — contributory negligence", "url": "https://www.law.cornell.edu/wex/contributory_negligence"}]}, {"id": "compensatory-damages", "hw": "compensatory damages", "ipa": "kəmˈpen.səˌtɔːr.i ˈdæm.ɪ.dʒɪz", "stress": "com·**pen**·sa·to·ry **dam**·a·ges", "stars": 2, "gloss": "전보배상(실제 손해를 메우는 배상)", "diff": "피해자를 사고 전 상태로 돌려놓는 것이 목적인 배상입니다. 치료비·일실수입 같은 재산적 손해(economic damages)와 정신적 손해(non-economic damages, 이 장의 pain and suffering)를 모두 포함합니다. damages 자체는 4장 표제어입니다(→ 4장).", "examples": {"easy": {"en": "The jury awarded compensatory damages.", "ko": "배심은 전보배상을 인정했다."}, "practice": {"en": "Compensatory damages covered her medical bills and lost wages.", "ko": "전보배상에는 그녀의 치료비와 일실수입이 포함되었다."}, "source": {"en": "intended to redress the concrete loss that the plaintiff has suffered by reason of the defendant's wrongful conduct", "ko": "피고의 위법한 행위로 원고가 입은 구체적 손실을 회복시키려는 것", "cite": "State Farm Mut. Automobile Ins. Co. v. Campbell, 538 U.S. 408, 416 (2003)", "url": "https://www.law.cornell.edu/supremecourt/text/538/408", "glossary": {"redress": "바로잡다, 회복시키다", "concrete loss": "구체적 손실", "by reason of": "~ 때문에(because of의 격식체)"}}}, "grammar": {"axis": "G3", "title": "damage(손해)와 damages(배상금)", "wrong": "The court awarded a compensatory damage.", "right": "The court awarded compensatory damages.", "note": "'배상금'은 언제나 복수형 damages이고 a를 붙이지 않습니다. 단수 damage는 '손상·피해'라는 불가산 명사입니다(The storm caused damage)."}, "collocations": ["award compensatory damages", "economic / non-economic damages", "lost wages (일실수입)", "medical expenses"], "links": [{"label": "LII Wex — compensatory damages", "url": "https://www.law.cornell.edu/wex/compensatory_damages"}]}, {"id": "punitive-damages", "hw": "punitive damages", "ipa": "ˈpjuː.nə.t̬ɪv ˈdæm.ɪ.dʒɪz", "stress": "**pu**·ni·tive **dam**·a·ges", "stars": 3, "uk": "exemplary damages (잉글랜드에서 더 흔한 표현)", "gloss": "징벌적 손해배상", "pron_tip": "첫 음절 pu-는 /pjuː/로, '퓨'에 가깝게 시작합니다. punish의 /pʌ/와 다릅니다.", "diff": "손해를 메우는 것이 아니라 가해자를 벌하고 같은 행위를 막는 것이 목적입니다. 미국 연방대법원은 배상액이 지나치면 적법절차 조항(Due Process Clause) 위반이라고 봅니다. 한국에는 일반 제도로서의 징벌적 손해배상이 없고, 제조물 책임법·특허법 등 개별 법률이 손해의 몇 배까지 배상하게 하는 규정을 두고 있을 뿐입니다(→ 「한국이라면?」).", "examples": {"easy": {"en": "The jury added punitive damages.", "ko": "배심은 징벌적 손해배상을 덧붙였다."}, "practice": {"en": "Punitive damages were awarded because the company hid the defect for years.", "ko": "회사가 결함을 수년간 숨겼기 때문에 징벌적 손해배상이 인정되었다."}, "source": {"en": "in practice, few awards exceeding a single-digit ratio between punitive and compensatory damages, to a significant degree, will satisfy due process", "ko": "실제로 징벌적 배상과 전보배상 사이의 비율이 한 자릿수를 상당한 정도로 넘는 배상 판결 가운데 적법절차를 충족하는 것은 거의 없을 것이다", "cite": "State Farm Mut. Automobile Ins. Co. v. Campbell, 538 U.S. 408, 425 (2003)", "url": "https://www.law.cornell.edu/supremecourt/text/538/408", "glossary": {"single-digit ratio": "한 자릿수 비율(10배 미만)", "to a significant degree": "상당한 정도로", "due process": "적법절차"}}}, "box": "State Farm 사건에서 유타주 배심은 전보배상 260만 달러에 징벌적 배상 1억 4,500만 달러를 평결했습니다. 연방대법원은 전보배상 100만 달러에 대한 145배는 지나치다며 파기했습니다. 다만 법원은 '넘으면 안 되는 고정 비율은 없다'고 함께 말했으므로, '9배까지만 된다'는 규칙으로 읽으면 틀립니다.", "pitfalls": ["'징벌적'이라는 말 때문에 형벌로 오해하기 — 민사 배상이고 피해자에게 지급된다", "single-digit ratio를 '9배 상한'이라는 확정 규칙으로 소개하기"], "grammar": {"axis": "G2", "title": "damages는 복수 — 동사도 복수", "wrong": "Punitive damages was awarded.", "right": "Punitive damages were awarded.", "note": "damages는 형태도 뜻도 복수로 취급하므로 동사는 were·are. 금액 하나를 말할 때는 a punitive damages award처럼 award를 단수 명사로 씁니다."}, "collocations": ["award punitive damages", "a punitive damages award", "punitive-to-compensatory ratio", "seek punitive damages"], "links": [{"label": "LII Wex — punitive damages", "url": "https://www.law.cornell.edu/wex/punitive_damages"}, {"label": "Oyez — State Farm v. Campbell", "url": "https://www.oyez.org/cases/2002/01-1289"}]}, {"id": "pain-and-suffering", "hw": "pain and suffering", "ipa": "peɪn ən ˈsʌf.ɚ.ɪŋ", "stress": "**pain** and **suf**·fer·ing", "stars": 2, "gloss": "정신적·육체적 고통(에 대한 손해), 위자료에 가까운 항목", "diff": "사고로 겪은 육체적 통증과 불안·생활의 즐거움 상실 같은 정신적 고통을 돈으로 환산한 손해입니다. 한국의 위자료(민법 제751조)와 기능이 비슷합니다. 다만 미국의 배심재판에서는 배심이 이 액수를 정합니다.", "examples": {"easy": {"en": "She sued for pain and suffering.", "ko": "그녀는 육체적·정신적 고통에 대한 배상을 청구했다."}, "practice": {"en": "The jury awarded $200,000 for pain and suffering.", "ko": "배심은 고통에 대한 배상으로 20만 달러를 인정했다."}}, "grammar": {"axis": "G3", "title": "한 덩어리 불가산 표현", "wrong": "a pain and suffering / pains and sufferings", "right": "damages for pain and suffering", "note": "손해 항목 이름으로 굳은 표현이라 관사도 복수형도 붙이지 않습니다. 앞에 for를 써서 award ... for pain and suffering이라고 합니다."}, "collocations": ["damages for pain and suffering", "emotional distress (정신적 고통)", "loss of enjoyment of life", "damages cap (배상 상한)"], "links": [{"label": "LII Wex — pain and suffering", "url": "https://www.law.cornell.edu/wex/pain_and_suffering"}]}, {"id": "defamation", "hw": "defamation · libel · slander", "ipa": "ˌdef.əˈmeɪ.ʃən · ˈlaɪ.bəl · ˈslæn.dɚ", "stress": "def·a·**ma**·tion · **li**·bel · **slan**·der", "stars": 2, "gloss": "명예훼손 · 문서(서면) 명예훼손 · 구두 명예훼손", "diff": "defamation이 상위 개념이고, 글·방송처럼 남는 형태면 libel, 말로 하면 slander입니다. 한국에서 명예훼손은 형법상 범죄(제307조)이기도 해서 형사 절차로도 다툴 수 있지만, 미국에서는 민사 불법행위 소송이 주된 무대입니다. 공인이 원고면 '현실적 악의(actual malice)'까지 증명해야 합니다.", "examples": {"easy": {"en": "He sued the newspaper for libel.", "ko": "그는 신문사를 상대로 문서 명예훼손 소송을 걸었다."}, "practice": {"en": "To win, a public official must prove actual malice.", "ko": "이기려면 공직자인 원고는 현실적 악의를 증명해야 한다."}, "source": {"en": "with knowledge that it was false or with reckless disregard of whether it was false or not", "ko": "그것이 허위임을 알았거나, 허위인지 아닌지를 무모하게 무시하고", "cite": "New York Times Co. v. Sullivan, 376 U.S. 254, 279–280 (1964)", "url": "https://www.law.cornell.edu/supremecourt/text/376/254", "glossary": {"reckless disregard": "무모한 무시(미필적 고의에 가까운 개념)", "actual malice": "현실적 악의 — 일상어 '악의'와 뜻이 다르다"}}}, "pitfalls": ["libel과 liable(책임 있는)을 혼동하기 — 발음이 비슷하다", "actual malice를 '실제 악의·증오'로 옮기기 — 허위성의 인식 또는 무모한 무시를 뜻한다"], "grammar": {"axis": "G4", "title": "sue A for + 소송 원인", "wrong": "He sued the newspaper by libel.", "right": "He sued the newspaper for libel.", "note": "sue A for B에서 B는 금액(for $1 million)도, 소송 원인(for libel, for negligence)도 됩니다. 3장의 sue A for B와 같은 틀입니다."}, "collocations": ["sue for defamation / libel", "defamatory statement", "public figure (공적 인물)", "actual malice"], "links": [{"label": "LII Wex — defamation", "url": "https://www.law.cornell.edu/wex/defamation"}, {"label": "LII Wex — libel", "url": "https://www.law.cornell.edu/wex/libel"}, {"label": "LII Wex — slander", "url": "https://www.law.cornell.edu/wex/slander"}]}, {"id": "invasion-of-privacy", "hw": "invasion of privacy", "ipa": "ɪnˈveɪ.ʒən əv ˈpraɪ.və.si", "stress": "in·**va**·sion of **pri**·va·cy", "stars": 1, "gloss": "사생활 침해", "pron_tip": "privacy의 첫 음절은 미국식으로 /praɪ/('프라이')입니다. 영국식은 /ˈprɪv.ə.si/로 /prɪ/가 흔합니다.", "diff": "미국 불법행위법은 사생활 침해를 여러 소송 원인으로 나눕니다. 사적 영역에 대한 침입(intrusion on seclusion), 사적 사실의 공개(public disclosure of private facts), 왜곡된 인상 부여(false light), 성명·초상의 무단 이용(appropriation)입니다(LII Wex). 한국은 인격권 침해라는 큰 틀에서 민법 제750조·제751조로 다룹니다.", "examples": {"easy": {"en": "Hidden cameras are an invasion of privacy.", "ko": "몰래카메라는 사생활 침해다."}, "practice": {"en": "The actor sued the magazine for invasion of privacy after it published his medical records.", "ko": "그 배우는 잡지가 자신의 진료 기록을 싣자 사생활 침해로 소송을 걸었다."}}, "grammar": {"axis": "G1", "title": "an invasion of privacy — privacy에는 관사 없음", "wrong": "an invasion of the privacy / a privacy", "right": "an invasion of privacy", "note": "'침해 한 건'은 셀 수 있어 an invasion이지만, 추상명사 privacy는 관사 없이 씁니다. 특정인의 것이면 his privacy."}, "collocations": ["sue for invasion of privacy", "right to privacy", "reasonable expectation of privacy", "false light"], "links": [{"label": "LII Wex — invasion of privacy", "url": "https://www.law.cornell.edu/wex/invasion_of_privacy"}]}, {"id": "nuisance", "hw": "nuisance", "ipa": "ˈnuː.səns", "stress": "**nui**·sance", "stars": 1, "false_friend": true, "gloss": "생활방해(소음·악취 등으로 남의 토지 이용을 방해하는 것)", "pron_tip": "ui는 /uː/ 하나로 읽습니다. 'nu-sance' 두 음절.", "diff": "일상어로는 '귀찮은 존재'입니다. 법에서는 이웃의 토지 사용·향유를 상당히, 그리고 부당하게 방해하는 것을 가리킵니다. 개인이 입는 private nuisance와 공중 전체가 입는 public nuisance로 나눕니다. 한국 민법 제217조의 '생활방해'(매연·음향·진동 등)와 겹치지만, 한국은 이를 상린관계(물권) 규정으로 두고 있어 체계상 위치가 다릅니다.", "examples": {"easy": {"en": "The loud factory was a nuisance.", "ko": "시끄러운 공장은 생활방해였다."}, "practice": {"en": "The neighbors sued the pig farm for nuisance because of the smell.", "ko": "이웃들은 악취를 이유로 양돈장을 생활방해로 제소했다."}}, "grammar": {"axis": "G1", "title": "일상 뜻이든 법률 뜻이든 a nuisance", "wrong": "The factory was nuisance.", "right": "The factory was a nuisance. / a private nuisance", "note": "보어로 쓸 때는 셀 수 있는 명사라 a를 붙입니다. 소송 원인 이름으로 쓸 때는 sue for nuisance처럼 관사 없이 씁니다."}, "collocations": ["private / public nuisance", "sue for nuisance", "abate a nuisance (생활방해를 제거하다)", "nuisance suit (괴롭히기 소송 — 별개 뜻)"], "links": [{"label": "LII Wex — nuisance", "url": "https://www.law.cornell.edu/wex/nuisance"}]}, {"id": "trespass", "hw": "trespass", "ipa": "ˈtres.pæs", "stress": "**tres**·pass", "stars": 1, "false_friend": true, "gloss": "(토지) 무단침입 · 무단침입하다", "diff": "허락 없이 남의 토지에 들어가는 것만으로 성립하는 불법행위입니다. 손해가 없어도 책임이 인정된다는 점이 과실 불법행위와 다릅니다. 동산에 대한 침해는 trespass to chattels라고 합니다. 형사상 무단침입(criminal trespass)도 따로 있어서, 한국의 주거침입죄와는 범위가 꼭 같지 않습니다.", "examples": {"easy": {"en": "No trespassing.", "ko": "무단출입 금지."}, "practice": {"en": "The hunters trespassed on the farmer's land.", "ko": "사냥꾼들이 농부의 땅에 무단으로 들어갔다."}}, "pitfalls": ["주기도문의 'forgive us our trespasses'(우리 죄를 사하여 주시고)처럼 옛 영어에서는 '죄'라는 뜻 — 법률 문장에서는 무단침입"], "grammar": {"axis": "G4", "title": "trespass on / onto + 장소", "wrong": "They trespassed the land.", "right": "They trespassed on the land.", "note": "동사 trespass는 대상 앞에 on(또는 onto, upon)을 씁니다. 명사로는 trespass to land, trespass to chattels."}, "collocations": ["trespass on land", "trespass to chattels (동산 침해)", "No Trespassing (표지판)", "trespasser"], "links": [{"label": "LII Wex — trespass", "url": "https://www.law.cornell.edu/wex/trespass"}]}, {"id": "vicarious-liability", "hw": "vicarious liability · respondeat superior", "ipa": "vɪˈker.i.əs ˌlaɪ.əˈbɪl.ə.t̬i · rɪˈspɑːn.di.æt səˈpɪr.i.ɚ", "stress": "vi·**car**·i·ous li·a·**bil**·i·ty · re·**spon**·de·at su·**pe**·ri·or", "stars": 2, "pron_tip": "respondeat superior는 Cambridge에 표제어가 없어 보조 사전 Wiktionary 표기 /ɹɪˈspɒn.di.æt suːˈpɪəɹ.i.ə(ɹ)/의 음절·강세를 따르고 모음은 미국식으로 적었습니다. 라틴어 구라 법조인마다 읽는 법이 조금씩 다릅니다.", "gloss": "대위책임(남의 행위에 대해 지는 책임) · 사용자책임 원칙", "diff": "고용인이 업무 범위(scope of employment) 안에서 저지른 불법행위를 사용자가 책임지는 원칙입니다(respondeat superior, '윗사람이 답하라'). 영미에서는 사용자가 자신은 감독을 잘했다고 증명해도 면책되지 않는 일종의 엄격책임입니다. 한국 민법 제756조 제1항 단서는 사용자가 선임·감독에 상당한 주의를 했음을 증명하면 면책된다고 정하므로 구조가 다릅니다.", "examples": {"easy": {"en": "The company was held liable for its driver.", "ko": "회사는 소속 운전기사의 행위에 대해 책임을 졌다."}, "practice": {"en": "The hospital was held vicariously liable for the nurse's mistake.", "ko": "병원은 간호사의 실수에 대해 사용자로서 책임을 졌다."}}, "grammar": {"axis": "G7", "title": "be held liable — 책임은 수동태로 '지워진다'", "wrong": "The hospital held liable for the mistake.", "right": "The hospital was held liable for the mistake.", "note": "법원이 책임을 인정하는 것이므로 be held liable(수동). 능동으로 쓰면 The court held the hospital liable."}, "collocations": ["be held vicariously liable", "scope of employment", "respondeat superior", "independent contractor (독립 계약자 — 원칙적으로 대위책임 없음)"], "links": [{"label": "LII Wex — vicarious liability", "url": "https://www.law.cornell.edu/wex/vicarious_liability"}, {"label": "LII Wex — respondeat superior", "url": "https://www.law.cornell.edu/wex/respondeat_superior"}]}, {"id": "intentional-tort", "hw": "intentional tort", "ipa": "ɪnˈten.ʃən.əl tɔːrt", "stress": "in·**ten**·tion·al **tort**", "stars": 1, "gloss": "고의 불법행위", "diff": "폭행(battery), 폭행의 위협(assault), 불법감금(false imprisonment)처럼 고의로 저지르는 불법행위의 묶음입니다. 같은 행위가 범죄도 되지만, 불법행위 소송은 피해자가 직접 내는 민사소송이라 증명 기준이 더 낮습니다. 영미의 battery는 '몸에 해로운 또는 불쾌한 접촉'이고, assault는 접촉이 임박했다는 두려움을 주는 것이라 한국어 '폭행'과 경계가 다릅니다.", "examples": {"easy": {"en": "Battery is an intentional tort.", "ko": "폭행(battery)은 고의 불법행위다."}, "practice": {"en": "Assault and battery are intentional torts as well as crimes.", "ko": "assault와 battery는 범죄이면서 고의 불법행위이기도 하다."}}, "grammar": {"axis": "G2", "title": "A and B are + 복수명사", "wrong": "Assault and battery are intentional tort.", "right": "Assault and battery are intentional torts.", "note": "여기서는 assault와 battery라는 서로 다른 두 불법행위 유형을 세므로 보어도 torts입니다. 보어가 늘 복수인 것은 아닙니다(A and B are a team). 한국어는 '고의 불법행위이다'로 복수 표시가 없어 자주 빠뜨립니다."}, "collocations": ["assault and battery", "false imprisonment (불법감금)", "intentional infliction of emotional distress (IIED)"], "links": [{"label": "LII Wex — intentional tort", "url": "https://www.law.cornell.edu/wex/intentional_tort"}, {"label": "LII Wex — battery", "url": "https://www.law.cornell.edu/wex/battery"}, {"label": "LII Wex — assault", "url": "https://www.law.cornell.edu/wex/assault"}]}, {"id": "medical-malpractice", "hw": "medical malpractice", "ipa": "ˈmed.ɪ.kəl ˌmælˈpræk.tɪs", "stress": "**med**·i·cal mal·**prac**·tice", "stars": 2, "gloss": "의료과오(의료과실)", "diff": "의사가 그 분야에서 통상 요구되는 주의 기준(standard of care)에 못 미쳐 환자에게 손해를 입힌 경우입니다. 구조는 negligence와 같고, 주의 기준을 증명하려면 대개 전문가 증인(expert witness)이 필요합니다. malpractice는 변호사·회계사의 직무상 과오에도 씁니다(legal malpractice).", "examples": {"easy": {"en": "She sued the surgeon for malpractice.", "ko": "그녀는 의료과오를 이유로 외과의사에게 소송을 걸었다."}, "practice": {"en": "The expert testified that the doctor failed to meet the standard of care.", "ko": "전문가 증인은 그 의사가 주의 기준에 미치지 못했다고 증언했다."}}, "grammar": {"axis": "G3", "title": "malpractice는 셀 수 없는 명사", "wrong": "The doctor committed a malpractice.", "right": "The doctor committed malpractice. / a malpractice suit", "note": "malpractice에는 a를 붙이지 않습니다. 셀 수 있게 말하려면 뒤에 명사를 붙여 a malpractice claim·a malpractice suit."}, "collocations": ["medical malpractice suit", "malpractice insurance", "standard of care", "legal malpractice (변호사 과오)"], "links": [{"label": "LII Wex — malpractice", "url": "https://www.law.cornell.edu/wex/malpractice"}]}], "corners": {"false_friend": {"title": "nuisance는 귀찮은 사람이 아니다", "body": ["일상에서 nuisance는 '성가신 사람·물건'입니다. 법정에서 nuisance는 소음·악취·진동으로 이웃의 토지 이용을 방해하는 불법행위, 곧 생활방해입니다. 'The pig farm is a nuisance'는 '양돈장이 귀찮다'가 아니라 '양돈장이 생활방해에 해당한다'는 주장일 수 있습니다.", "damages도 같은 함정입니다. '손상들'이 아니라 '배상금'입니다(→ 4장). 이 장의 가짜 친구를 모으면 이렇습니다."], "table": [["nuisance", "귀찮은 존재", "생활방해"], ["damages", "손상(들)", "손해배상금(→ 4장)"], ["trespass", "죄(옛 영어·기도문)", "무단침입"], ["battery", "건전지", "폭행(해롭거나 불쾌한 신체 접촉)"], ["malice", "증오·악의", "(actual malice) 허위의 인식 또는 무모한 무시"]], "tip": "외우는 요령: 문장에 sue·liable·plaintiff가 함께 나오면 일상 뜻을 의심하세요."}, "drama": {"title": "Erin Brockovich (2000)", "facts": ["2000년 미국 영화. 감독 스티븐 소더버그, 주연 줄리아 로버츠. 로버츠는 이 영화로 아카데미 여우주연상을 받았습니다.", "캘리포니아주 힝클리(Hinkley) 주민들이 전력회사 PG&E를 상대로 낸 지하수 오염(6가 크롬) 소송이 실화입니다.", "실제 사건은 중재(arbitration)를 거쳐 1996년 3억 3,300만 달러에 화해로 끝났습니다(Wikipedia — Hinkley groundwater contamination)."], "watch": "법률 사무소 직원인 주인공이 주민들의 진료 기록을 모아 '오염과 질병 사이의 인과관계'를 세워 가는 과정이 곧 이 장의 causation입니다. 회사가 위험을 알고도 숨겼다는 사실이 드러나는 대목에서 punitive damages가 왜 무서운지 실감 납니다. 영화 속에서도 사건은 배심 재판이 아니라 구속력 있는 중재(binding arbitration)로 가고, 그러려면 주민 대다수의 동의가 필요하다는 대목이 나옵니다.", "terms": ["toxic tort (유해물질 불법행위)", "causation", "punitive damages", "arbitration", "settlement"], "links": [{"label": "Wikipedia — Erin Brockovich (film)", "url": "https://en.wikipedia.org/wiki/Erin_Brockovich_(film)"}, {"label": "Wikipedia — Hinkley groundwater contamination", "url": "https://en.wikipedia.org/wiki/Hinkley_groundwater_contamination"}, {"label": "평론 — Picturing Justice(USF 로스쿨 후원 법·대중문화 온라인 저널), Michael Asimow(UCLA 로스쿨 교수), 「And Now for the Heroic Paralegal — Erin Brockovich」", "url": "https://cap-press.com/sites/pj/brockovich-asimow.htm"}, {"label": "평론 — ABA Journal, Richard Brust(편집자)·법률가 12인 심사단, 「The 25 Greatest Legal Movies」(2008) 9위", "url": "https://www.abajournal.com/magazine/article/the_25_greatest_legal_movies"}, {"label": "원사건 — 캘리포니아주 라혼탄 지역수질관리위원회(Lahontan Water Board), PG&E Hinkley Chromium Cleanup 공식 기록", "url": "https://www.waterboards.ca.gov/lahontan/water_issues/projects/pge/"}]}, "quote": {"text": "The risk reasonably to be perceived defines the duty to be obeyed, and risk imports relation; it is risk to another or to others within the range of apprehension", "ko": "합리적으로 인식될 수 있는 위험이 지켜야 할 의무를 정한다. 그리고 위험은 관계를 전제한다. 그것은 예견 범위 안에 있는 타인에 대한 위험이다.", "case": "Palsgraf v. Long Island R.R. Co., 248 N.Y. 339, 344 (1928)", "decided": "1928. 5. 29. 선고 (뉴욕주 최고법원 Court of Appeals)", "gloss": {"perceive": "인식하다", "imports": "(뜻을) 담다, 전제하다", "range of apprehension": "예견(우려)의 범위"}, "why": "역무원이 열차에 뛰어오르는 승객을 밀다가 승객이 들고 있던 꾸러미가 떨어졌고, 그 안의 폭죽이 터졌습니다. 폭발의 충격으로 승강장 반대편 끝의 저울이 넘어지면서 그 옆에 서 있던 팔스그라프 부인이 다쳤습니다. 카도조 대법원장은 역무원에게 잘못이 있더라도 멀리 있던 부인에게는 위험이 예견되지 않았으므로 철도회사가 그녀에게 의무를 위반한 것이 아니라고 보았습니다. '과실은 누구에 대한 과실인가'라는 질문을 이 한 문장이 던졌습니다.", "links": [{"label": "NY Courts — Palsgraf 판결 원문(뉴욕주 법원 공식 사이트)", "url": "https://www.nycourts.gov/reporter/archives/palsgraf_lirr.htm"}, {"label": "Wikipedia — Palsgraf v. Long Island Railroad Co.", "url": "https://en.wikipedia.org/wiki/Palsgraf_v._Long_Island_Railroad_Co."}]}, "korea": {"title": "징벌적 손해배상, 한국에는?", "us": "미국에서는 주법에 따라 악의적인 불법행위에 징벌적 손해배상을 인정하고(인정 요건과 상한은 주마다 다릅니다), 연방대법원은 그 액수가 지나치면 적법절차 위반으로 봅니다(State Farm v. Campbell).", "kr": "한국 불법행위의 기본 조문은 민법 제750조('고의 또는 과실로 인한 위법행위로 타인에게 손해를 가한 자는 그 손해를 배상할 책임이 있다')이고, 정신적 손해는 제751조가 정합니다. 둘 다 실제 손해를 메우는 전보배상입니다. 징벌적 성격의 배상은 개별 법률에만 있습니다. 예컨대 제조물 책임법 제3조 제2항은 결함을 알면서도 조치하지 않아 생명·신체에 중대한 손해를 입힌 제조업자에게 손해의 3배 이내의 배상을, 특허법 제128조 제8항은 고의적 침해에 손해의 5배 이내의 배상을 정합니다.", "say": "Korean tort law is based on compensation. Punitive damages are not generally available, but some statutes allow courts to award up to three or five times the actual damages.", "say_ko": "한국 불법행위법은 전보배상을 기본으로 합니다. 징벌적 손해배상은 일반적으로 인정되지 않지만, 일부 법률은 법원이 실제 손해의 3배나 5배까지 배상을 명할 수 있게 합니다."}}, "quiz": [{"q": "과실(negligence) 불법행위의 첫 관문으로, '피고가 원고에게 지고 있던 의무'를 뜻하는 말은?", "options": ["duty of care", "burden of proof", "standard of review", "due process"], "answer": 0, "why": "negligence는 duty·breach·causation·damages 네 요소로 따집니다. burden of proof는 증명책임, standard of review는 상소심의 심사기준입니다."}, {"q": "손해를 메우는 것이 아니라 가해자를 벌하고 억지하려고 인정하는 배상은?", "options": ["compensatory damages", "punitive damages", "nominal damages"], "answer": 1, "why": "compensatory damages는 실제 손실을 회복시키는 배상, nominal damages는 권리 침해만 인정하는 명목상 배상입니다."}, {"q": "'The pig farm is a nuisance.'를 법정에서 들었다면 가장 알맞은 뜻은?", "options": ["양돈장은 귀찮은 존재다.", "양돈장은 생활방해에 해당한다.", "양돈장은 무단침입했다."], "answer": 1, "why": "법률 영어에서 nuisance는 이웃의 토지 이용을 방해하는 불법행위(생활방해)입니다. 무단침입은 trespass."}, {"q": "문법: 빈칸에 맞는 것은? — The accident was caused by ____.", "options": ["a negligence", "negligence", "negligences"], "answer": 1, "why": "negligence는 셀 수 없는 명사라 a도 복수형도 쓰지 않습니다. 사람을 말할 때는 형용사로 The driver was negligent.", "grammar": "G3"}, {"q": "번역해 보세요: The driver owed a duty of care to the pedestrian.", "options": ["운전자는 보행자에게 빚을 지고 있었다.", "운전자는 보행자에게 주의의무를 지고 있었다.", "운전자는 보행자를 돌볼 책임을 맡겼다."], "answer": 1, "why": "owe a duty of care to A = A에게 주의의무를 지다. owe는 '빚지다'만이 아니라 의무를 '지다'에도 씁니다."}]}, {"chapter": {"num": 10, "title": "재산법", "subtitle": "땅과 집과 담보", "title_en": "Property — Land, Homes, and Security", "lead": "영미 재산법은 소유권을 하나의 덩어리가 아니라 여러 권리의 묶음(bundle of rights)으로 봅니다. 땅을 쓸 권리, 빌려줄 권리, 팔 권리, 담보로 잡힐 권리가 따로 떨어져 다른 사람에게 갈 수 있습니다. 재산법은 대부분 주(州)법이라 연방 조문은 적습니다. 이 장은 그 묶음을 부르는 말과 담보의 말을 모았습니다.", "can_say": [{"en": "She holds title to the house, but the bank holds a mortgage on it.", "ko": "그 집의 소유권은 그녀에게 있지만, 은행이 그 집에 저당권을 가지고 있습니다."}, {"en": "The tenant signed a two-year lease with the landlord.", "ko": "임차인은 임대인과 2년 임대차 계약을 맺었습니다."}, {"en": "The government cannot take private property for public use without just compensation.", "ko": "정부는 정당한 보상 없이 사유재산을 공공의 용도로 수용할 수 없습니다."}]}, "entries": [{"id": "property", "hw": "property", "ipa": "ˈprɑː.pɚ.t̬i", "stress": "**prop**·er·ty", "stars": 3, "gloss": "재산, 재산권 · (셀 때) 부동산 한 필지·건물 · 재산법(과목명)", "diff": "한국 민법은 물건(물권의 객체)과 권리를 나누어 말하지만, 영미에서 property는 물건 자체와 그 물건에 대한 권리 묶음을 함께 가리킵니다. 로스쿨 1학년 과목명도 Property입니다.", "examples": {"easy": {"en": "This land is private property.", "ko": "이 땅은 사유지다."}, "practice": {"en": "The couple bought a property in Boston and rented it out.", "ko": "그 부부는 보스턴에 부동산 한 채를 사서 세를 놓았다."}, "source": {"en": "nor be deprived of life, liberty, or property, without due process of law", "ko": "적법절차에 의하지 아니하고는 생명, 자유 또는 재산을 박탈당하지 아니한다", "cite": "U.S. Const. amend. V", "url": "https://www.law.cornell.edu/constitution/fifth_amendment", "glossary": {"deprive A of B": "A에게서 B를 빼앗다", "due process of law": "적법절차"}}}, "grammar": {"axis": "G3", "title": "property — 셀 때와 안 셀 때", "wrong": "All her property are in Seoul.", "right": "All her property is in Seoul. / She owns two properties in Seoul.", "note": "'재산' 전체를 말할 때는 불가산(관사 없음, 단수 취급). 부동산 한 건 한 건을 셀 때만 a property, two properties."}, "collocations": ["private property (사유재산)", "intellectual property (→ 18장)", "property rights", "own / inherit property"], "links": [{"label": "LII Wex — property", "url": "https://www.law.cornell.edu/wex/property"}]}, {"id": "real-property", "hw": "real property · personal property", "ipa": "ˈriː.əl ˈprɑː.pɚ.t̬i · ˈpɝː.sən.əl ˈprɑː.pɚ.t̬i", "stress": "**re**·al **prop**·er·ty · **per**·son·al **prop**·er·ty", "stars": 3, "gloss": "부동산 · 부동산 외의 재산(동산과 무형 재산권)", "diff": "real은 '진짜'가 아니라 옛 영국법에서 물건(res) 자체를 되찾는 소송(real action)에서 온 말입니다. 부동산 매매·중개 업계에서는 real estate를 더 씁니다. personal property는 '개인 재산'이 아니라 부동산이 아닌 재산 전부로, 움직일 수 있는 물건(동산)뿐 아니라 채권·주식 같은 무형 재산권도 들어갑니다. 그래서 한국 민법의 '동산'과 1:1로 맞지 않습니다.", "examples": {"easy": {"en": "A car is personal property.", "ko": "자동차는 동산이다."}, "practice": {"en": "The estate includes real property in two states and some personal property.", "ko": "상속재산에는 두 주에 있는 부동산과 약간의 동산이 들어 있다."}, "source": {"en": "If the real or personal property is within the district, the court—instead of ordering a conveyance—may enter a judgment divesting any party's title and vesting it in others.", "ko": "부동산이나 동산이 그 관할구역 안에 있으면, 법원은 양도를 명하는 대신 당사자의 소유권을 박탈하여 다른 사람에게 귀속시키는 판결을 할 수 있다.", "cite": "Fed. R. Civ. P. 70(b)", "url": "https://www.law.cornell.edu/rules/frcp/rule_70", "glossary": {"conveyance": "양도(소유권 이전)", "divest / vest": "(권리를) 박탈하다 / 귀속시키다"}}}, "grammar": {"axis": "G1", "title": "일반론에는 관사 없이", "wrong": "The real property includes land and buildings.", "right": "Real property includes land and buildings.", "note": "'부동산이란 무엇인가'처럼 종류 전체를 말할 때는 무관사. 특정 사건의 그 땅을 가리킬 때만 the property."}, "pitfalls": ["personal property를 '개인 소유물'로 옮기기 — 법률 문맥에서는 부동산 외 재산(유형물은 대개 '동산')", "real property를 '실물 재산'으로 옮기기"], "collocations": ["real estate (부동산 거래·업계 용어)", "tangible / intangible personal property (유형 동산 / 무형 재산)"], "links": [{"label": "LII Wex — real property", "url": "https://www.law.cornell.edu/wex/real_property"}, {"label": "LII Wex — personal property", "url": "https://www.law.cornell.edu/wex/personal_property"}]}, {"id": "title", "hw": "title", "ipa": "ˈtaɪ.t̬əl", "stress": "**ti**·tle", "stars": 3, "false_friend": true, "gloss": "소유권, 권원(소유를 정당화하는 근거)", "diff": "일상어로는 '제목·직함'입니다. 재산법의 title은 '그 물건이 내 것이라는 법적 근거'로, 한국어 '소유권'과 '권원'의 중간쯤에 있습니다. 한국에서는 등기가 법률행위로 인한 부동산 물권변동의 효력요건이지만(민법 제186조), 등기에 공신력은 인정되지 않습니다(대법원 2022. 8. 25. 선고 2018다205209 전원합의체 판결). 미국은 등기 대신 증서를 공적 장부에 기록(recording)하는 제도를 두고, 권원을 조사하는 title search와 이를 보증하는 title insurance로 거래 안전을 보완합니다.", "examples": {"easy": {"en": "Who holds title to this house?", "ko": "이 집의 소유권은 누구에게 있나요?"}, "practice": {"en": "The buyer's lawyer found a defect in the seller's title.", "ko": "매수인 측 변호사가 매도인의 권원에서 하자를 발견했다."}, "source": {"en": "the provisions of this article with regard to rights and obligations apply whether title to collateral is in the secured party or the debtor", "ko": "권리와 의무에 관한 이 편의 규정은 담보물의 소유권이 담보권자에게 있든 채무자에게 있든 적용된다", "cite": "UCC § 9-202", "url": "https://www.law.cornell.edu/ucc/9/9-202", "glossary": {"collateral": "담보물", "secured party": "담보권자"}}}, "box": "UCC 제9편은 '소유권이 누구에게 있느냐'로 담보 문제를 풀지 않겠다고 선언합니다(§ 9-202). 할부판매에서 판매자가 소유권을 유보하든, 구매자가 소유하고 담보를 설정하든 같은 규칙으로 다룬다는 뜻입니다.", "grammar": {"axis": "G1", "title": "hold title to — 관사 없이, 전치사는 to", "wrong": "She holds the title of the land.", "right": "She holds title to the land.", "note": "'소유권을 가지다'는 관사 없이 hold title. 대상은 of가 아니라 to로 받습니다. hold title to는 무관사가 통상적이지만, 특정한 권원을 가리키면 the title도 씁니다(the seller's title). 자동차 등록증처럼 서류 한 장을 말할 때도 a/the title."}, "collocations": ["hold title to", "transfer title", "clear title / good title (하자 없는 권원)", "title search · title insurance"], "links": [{"label": "LII Wex — title", "url": "https://www.law.cornell.edu/wex/title"}]}, {"id": "deed", "hw": "deed", "ipa": "diːd", "stress": "**deed**", "stars": 2, "false_friend": true, "gloss": "(부동산) 양도증서", "diff": "일상어·성경 영어에서는 '행위'(good deeds, 선행)입니다. 재산법에서는 부동산 소유권을 넘기는 서면을 말합니다. 한국 부동산 매매계약서와 다르게 deed는 계약이 아니라 이전 그 자체를 실행하는 문서입니다.", "examples": {"easy": {"en": "Both sellers signed the deed.", "ko": "매도인 두 사람 모두 양도증서에 서명했다."}, "practice": {"en": "The deed was delivered to the buyer at closing.", "ko": "양도증서는 잔금 결제(closing) 때 매수인에게 교부되었다."}, "source": {"en": "If a judgment requires a party to convey land, to deliver a deed or other document, or to perform any other specific act and the party fails to comply within the time specified, the court may order the act to be done", "ko": "판결이 당사자에게 토지 양도, 양도증서 기타 문서의 교부, 그 밖의 특정 행위를 명하였는데 당사자가 정해진 기간 안에 따르지 않으면, 법원은 그 행위를 하도록 명할 수 있다", "cite": "Fed. R. Civ. P. 70(a)", "url": "https://www.law.cornell.edu/rules/frcp/rule_70", "glossary": {"convey": "(소유권을) 양도하다", "comply": "따르다, 이행하다"}}}, "grammar": {"axis": "G6", "title": "deed와 짝을 이루는 동사", "wrong": "They made the deed in the registry office.", "right": "They executed the deed and recorded it at the county office.", "note": "증서를 '작성·서명하다'는 execute, '교부하다'는 deliver, '등록하다'는 record. make a deed는 어색합니다."}, "collocations": ["execute a deed", "deliver a deed", "record a deed", "warranty deed / quitclaim deed (보증 양도증서 / 권리포기 양도증서)"], "links": [{"label": "LII Wex — deed", "url": "https://www.law.cornell.edu/wex/deed"}]}, {"id": "fee-simple", "hw": "fee simple", "ipa": "fiː ˈsɪm.pəl", "stress": "**fee** **sim**·ple", "stars": 2, "gloss": "단순부동산권 — 기한 없이 처분·상속할 수 있는 가장 완전한 소유권", "diff": "fee는 '수수료'가 아니라 중세 봉건법의 봉토(fief)에서 온 말입니다. 영미에서는 땅 자체가 아니라 땅에 대한 '권리(estate)'를 소유한다고 보고, 그 가운데 가장 큰 것이 fee simple입니다. 한국 민법의 소유권과 기능은 거의 같지만 개념 구조가 다릅니다.", "examples": {"easy": {"en": "He owns the farm in fee simple.", "ko": "그는 그 농장을 완전한 소유권으로 가지고 있다."}, "practice": {"en": "The seller conveyed the lot in fee simple, free of all liens.", "ko": "매도인은 그 필지를 모든 담보 부담이 없는 완전한 소유권으로 양도했다."}}, "grammar": {"axis": "G1", "title": "in fee simple — 관사 없는 관용구", "wrong": "She owns the house in a fee simple.", "right": "She owns the house in fee simple.", "note": "권리의 형태를 말하는 in fee simple, in trust 같은 표현은 관사를 붙이지 않습니다. 명사로 쓸 때는 a fee simple도 가능합니다."}, "collocations": ["own in fee simple", "fee simple absolute (조건 없는 단순부동산권)", "fee simple determinable (정한 사유가 생기면 자동으로 끝나는 단순부동산권 — 조건 위반 뒤 설정자가 재취득권을 행사해야 끝나는 fee simple subject to condition subsequent와 구별)"], "links": [{"label": "LII Wex — fee simple", "url": "https://www.law.cornell.edu/wex/fee_simple"}]}, {"id": "life-estate", "hw": "life estate", "ipa": "laɪf ɪˈsteɪt", "stress": "**life** es·**tate**", "stars": 1, "gloss": "생애부동산권 — 어떤 사람이 살아 있는 동안만 존속하는 권리", "diff": "존속 기간은 보통 생애권자(life tenant) 자신의 생애로 재지만, 다른 사람의 생애로 재기도 합니다. 기준이 된 사람이 죽으면 권리는 미리 정해진 사람(remainderman)에게 넘어가거나, 정한 사람이 없으면 설정자에게 돌아갑니다(reversion). 한국 민법에는 같은 물권이 없습니다. 가장 가까운 것은 종신 기간을 정한 지상권·전세권이나 유언에 붙인 부담이지만 구조가 다릅니다.", "examples": {"easy": {"en": "Grandma has a life estate in the house.", "ko": "할머니는 그 집에 생애부동산권을 가지고 있다."}, "practice": {"en": "The will gave his wife a life estate, with the remainder to their children.", "ko": "유언은 아내에게 생애부동산권을 주고, 잔여권은 자녀들에게 주었다."}}, "grammar": {"axis": "G4", "title": "권리의 대상은 in, '평생'은 for life", "wrong": "She has a life estate on the house.", "right": "She has a life estate in the house. / She can live there for life.", "note": "부동산에 대한 권리(estate·interest)는 in으로 받습니다(an interest in land). '평생 동안'은 관사 없이 for life."}, "collocations": ["life tenant (생애권자)", "remainder / remainderman (잔여권 / 잔여권자)", "an interest in land"], "links": [{"label": "LII Wex — life estate", "url": "https://www.law.cornell.edu/wex/life_estate"}]}, {"id": "landlord", "hw": "landlord · tenant · lease", "ipa": "ˈlænd.lɔːrd · ˈten.ənt · liːs", "stress": "**land**·lord · **ten**·ant · **lease**", "stars": 3, "gloss": "임대인 · 임차인 · 임대차(계약), 임대하다·임차하다", "diff": "landlord는 땅 주인만이 아니라 아파트·사무실을 빌려주는 사람 모두를 가리킵니다. 여성이면 landlady라고도 하지만 법률 문서는 성별 없이 landlord를 씁니다. lease는 동사로 '빌려주다'와 '빌리다'를 모두 뜻하므로 to/from으로 방향을 표시합니다.", "examples": {"easy": {"en": "The tenant pays rent every month.", "ko": "임차인은 매달 차임을 낸다."}, "practice": {"en": "The landlord refused to return the deposit when the lease ended.", "ko": "임대인은 임대차가 끝났을 때 보증금 반환을 거부했다."}, "source": {"en": "Except by court order, a landlord (or another person with paramount title) may not … evict a servicemember", "ko": "법원의 명령에 의하지 아니하고는, 임대인(또는 우선하는 권원을 가진 그 밖의 사람)은 … 군인을 퇴거시킬 수 없다", "cite": "50 U.S.C. § 3951(a)(1)(A)", "url": "https://www.law.cornell.edu/uscode/text/50/3951", "glossary": {"paramount title": "우선하는(더 강한) 권원", "evict": "(임차인을) 퇴거시키다", "servicemember": "현역 군인"}}}, "box": "임대차법은 주법이 중심이지만, 연방 「군인민사구제법(Servicemembers Civil Relief Act)」은 복무 기간 중인 군인과 그 부양가족을 법원 명령 없이 내보내지 못하게 합니다. 다만 보호 대상은 주로 주거용으로 쓰는 집이고, 월 차임이 법정 상한(2003년 기준 2,400달러에 매년 주택가격 상승률을 반영) 이하인 경우에 한합니다(§ 3951(a)(1)(A), (a)(2)). 연방법이 임대차에 직접 들어오는 드문 예입니다.", "grammar": {"axis": "G4", "title": "lease to / lease from", "wrong": "She leased the apartment to the owner. (임차인이 말할 때)", "right": "The owner leased the apartment to her. / She leased the apartment from the owner.", "note": "같은 동사 lease가 방향에 따라 반대 뜻이 됩니다. 빌려주면 to, 빌리면 from. rent도 똑같이 씁니다."}, "collocations": ["sign a lease with", "lease A to B / lease A from B", "evict a tenant", "security deposit (보증금)"], "links": [{"label": "LII Wex — landlord", "url": "https://www.law.cornell.edu/wex/landlord"}, {"label": "LII Wex — tenant", "url": "https://www.law.cornell.edu/wex/tenant"}, {"label": "LII Wex — lease", "url": "https://www.law.cornell.edu/wex/lease"}]}, {"id": "easement", "hw": "easement", "ipa": "ˈiːz.mənt", "stress": "**ease**·ment", "stars": 2, "gloss": "지역권(남의 땅을 일정한 목적으로 쓸 권리 — 통행권 등)", "diff": "한국 민법의 지역권은 '요역지'의 편익을 위한 권리입니다. 미국 easement는 이웃 땅을 위한 것(appurtenant)뿐 아니라 특정인이나 전력회사를 위한 것(in gross)도 있어 범위가 더 넓습니다.", "examples": {"easy": {"en": "We have an easement across his field.", "ko": "우리는 그의 밭을 가로지르는 통행권이 있다."}, "practice": {"en": "The utility company holds an easement to run power lines over the lot.", "ko": "전력회사는 그 필지 위로 송전선을 지나가게 할 지역권을 가지고 있다."}}, "grammar": {"axis": "G6", "title": "easement는 grant·hold와 짝", "wrong": "The owner gave a permission of easement.", "right": "The owner granted an easement to her neighbor.", "note": "지역권을 '설정해 주다'는 grant, '가지다'는 hold. 가산명사라 an easement입니다."}, "collocations": ["grant an easement", "hold an easement", "right-of-way easement (통행 지역권)", "easement by necessity (필요에 의한 지역권)"], "links": [{"label": "LII Wex — easement", "url": "https://www.law.cornell.edu/wex/easement"}]}, {"id": "adverse-possession", "hw": "adverse possession", "ipa": "ædˈvɝːs pəˈzeʃ.ən", "stress": "ad·**verse** pos·**ses**·sion", "stars": 2, "gloss": "(부동산) 취득시효 — 남의 땅을 일정 기간 점유해 소유권을 얻는 것", "diff": "요건은 보통 점유가 실제로(actual), 공공연하게(open and notorious), 배타적으로(exclusive), 소유자의 뜻에 반하여(hostile), 계속(continuous) 이어져야 한다는 것입니다. 기간은 주마다 다릅니다. 한국 민법 제245조 제1항은 20년간 소유의 의사로 평온·공연하게 점유한 자가 '등기함으로써' 소유권을 취득한다고 정합니다.", "examples": {"easy": {"en": "He claimed the strip by adverse possession.", "ko": "그는 취득시효로 그 띠 모양 땅의 소유권을 주장했다."}, "practice": {"en": "The neighbor had used the land openly for more than twenty years.", "ko": "이웃은 20년 넘게 그 땅을 공공연하게 사용해 왔다."}}, "grammar": {"axis": "G3", "title": "possession은 셀 수 없다", "wrong": "He acquired the land by an adverse possession.", "right": "He acquired the land by adverse possession.", "note": "'점유'라는 상태를 말하는 possession은 불가산이라 관사를 붙이지 않습니다. 다만 '소지품'이라는 뜻일 때는 possessions(복수)."}, "pitfalls": ["adverse를 '불리한'으로만 옮기기 — 여기서는 '소유자에게 대항하는, 적대적인'", "'take possession of'(점유를 취득하다)를 '소유하다'로 옮기기"], "collocations": ["acquire title by adverse possession", "take possession of", "open and notorious (공공연한)", "hostile possession"], "links": [{"label": "LII Wex — adverse possession", "url": "https://www.law.cornell.edu/wex/adverse_possession"}]}, {"id": "joint-tenancy", "hw": "joint tenancy · tenancy in common", "ipa": "dʒɔɪnt ˈten.ən.si · ˈten.ən.si ɪn ˈkɑː.mən", "stress": "**joint** **ten**·an·cy · **ten**·an·cy in **com**·mon", "stars": 2, "false_friend": true, "gloss": "생존자 취득권이 붙은 공동소유 · (보통의) 공유", "diff": "여기서 tenancy는 임차가 아니라 '보유(holding)'입니다. joint tenancy는 공유자 한 사람이 죽으면 그 몫이 상속인이 아니라 남은 공유자에게 넘어갑니다(right of survivorship). tenancy in common은 각자 몫을 따로 상속시킬 수 있어 한국 민법의 공유와 가깝습니다. 한국의 합유와 1:1로 대응하지는 않습니다.", "examples": {"easy": {"en": "The couple owns the house as joint tenants.", "ko": "그 부부는 생존자 취득권부 공동소유자로 집을 소유한다."}, "practice": {"en": "Each of the tenants in common may sell her share without the others' consent.", "ko": "공유자는 각자 다른 공유자의 동의 없이 자기 지분을 팔 수 있다."}}, "grammar": {"axis": "G2", "title": "each of the + 복수명사, 동사는 단수", "wrong": "Each of the tenant own a half share.", "right": "Each of the tenants owns a half share.", "note": "each of 뒤 명사는 복수(tenants), 동사는 each에 맞춰 단수(owns). one of the parties와 같은 원리입니다."}, "collocations": ["right of survivorship (생존자 취득권)", "joint tenants / tenants in common", "partition (공유물 분할)"], "links": [{"label": "LII Wex — joint tenancy", "url": "https://www.law.cornell.edu/wex/joint_tenancy"}, {"label": "LII Wex — tenancy in common", "url": "https://www.law.cornell.edu/wex/tenancy_in_common"}]}, {"id": "recording-act", "hw": "recording act", "ipa": "rɪˈkɔːr.dɪŋ ækt", "stress": "re·**cord**·ing **act**", "stars": 2, "gloss": "(부동산) 공시·기록법 — 양도증서를 공적 기록에 올리지 않으면 뒤의 매수인에게 대항하지 못하게 하는 주법", "diff": "'등기법'으로 옮기기 쉽지만 다릅니다. 미국에서 deed를 기록(record)하지 않아도 매도인과 매수인 사이에서는 소유권이 넘어갑니다. 기록은 제3자에게 대항하기 위한 것입니다. 한국은 등기해야 물권변동의 효력이 생깁니다(민법 제186조). 유형(race·notice·race-notice)은 주마다 다릅니다.", "examples": {"easy": {"en": "Record your deed right away.", "ko": "양도증서를 바로 기록하세요."}, "practice": {"en": "Under the state's race statute, the second buyer won because her deed was recorded first.", "ko": "그 주의 선기록 우선주의(race) 법에 따라, 두 번째 매수인은 자기 양도증서가 먼저 기록되었으므로 이겼다."}}, "grammar": {"axis": "G7", "title": "증서는 '기록된다' — 수동태", "wrong": "The deed recorded in the county office.", "right": "The deed was recorded in the county office.", "note": "증서가 스스로 기록하지 않으므로 be recorded. 법률 절차의 결과는 수동태로 말하는 일이 많습니다."}, "pitfalls": ["recording act를 '녹음법'으로 옮기기", "recording을 한국식 '등기(성립요건)'로 단정하기 — 대항요건에 가깝다"], "collocations": ["record a deed", "race / notice / race-notice statute", "recorder of deeds (기록 담당 공무원)"], "links": [{"label": "LII Wex — recording act", "url": "https://www.law.cornell.edu/wex/recording_act"}, {"label": "LII Wex — race-notice statute", "url": "https://www.law.cornell.edu/wex/race-notice_statute"}]}, {"id": "bona-fide-purchaser", "hw": "bona fide purchaser", "ipa": "ˌboʊ.nə ˈfaɪ.di ˈpɝː.tʃə.sɚ", "stress": "bo·na **fi**·de **pur**·chas·er", "stars": 2, "gloss": "선의의 매수인 — 대가를 치르고 앞선 권리를 모른 채 산 사람", "diff": "줄여서 BFP. 정식으로는 bona fide purchaser for value without notice(앞선 권리를 알지 못하고 대가를 지급한 매수인)입니다. 기록법은 대개 이런 매수인을 보호합니다. bona fide라는 라틴어 자체는 17장에서 다룹니다.", "examples": {"easy": {"en": "She was a bona fide purchaser.", "ko": "그녀는 선의의 매수인이었다."}, "practice": {"en": "Under a notice statute, a bona fide purchaser for value takes the land free of the unrecorded deed.", "ko": "선의 우선주의(notice) 법 아래서는 대가를 지급한 선의의 매수인이 기록되지 않은 양도증서의 부담 없이 그 땅을 취득한다."}}, "grammar": {"axis": "G4", "title": "for value · without notice of", "wrong": "a purchaser by value with no notice about the prior deed", "right": "a purchaser for value without notice of the prior deed", "note": "'대가를 치르고'는 for value, '~을 알지 못하고'는 without notice of. 정형 문구라 그대로 외웁니다."}, "pron_tip": "fide는 두 음절 /ˈfaɪ.di/입니다(Cambridge US). 한 음절 /faɪd/로 줄여 읽는 사람도 있습니다.", "pitfalls": ["bona fide purchaser를 '진실한 구매자'로 옮기기 — 핵심은 앞선 권리를 몰랐다(without notice)는 점"], "collocations": ["bona fide purchaser for value", "without notice", "take free of (부담 없이 취득하다)", "→ 17장 bona fide"], "links": [{"label": "LII Wex — bona fide purchaser", "url": "https://www.law.cornell.edu/wex/bona_fide_purchaser"}]}, {"id": "mortgage", "hw": "mortgage · mortgagor · mortgagee", "ipa": "ˈmɔːr.ɡɪdʒ · ˌmɔːr.ɡɪˈdʒɔːr · ˌmɔːr.ɡɪˈdʒiː", "stress": "**mort**·gage · mort·ga·**gor** · mort·ga·**gee**", "stars": 3, "gloss": "저당권, 주택담보대출 · 저당권설정자(채무자) · 저당권자(은행 등)", "pron_tip": "철자에 t가 있지만 소리 나지 않습니다. /ˈmɔːr.ɡɪdʒ/로 읽습니다. mortgagor는 끝 음절 -gor에 강세를 줍니다. Cambridge에 mortgagor 표제어는 있으나 발음 표기가 없어, 같은 사전의 mortgagee US 표기 /ˌmɔːr.ɡɪˈdʒiː/에 맞춰 적었습니다.", "diff": "일상 영어에서 mortgage는 '주택담보대출' 그 자체를 말하는 경우가 많습니다(pay off the mortgage). -or는 설정하는 쪽(집주인), -ee는 받는 쪽(은행)입니다. 돈을 빌려주는 은행이 -ee라서 헷갈리기 쉽습니다.", "examples": {"easy": {"en": "They took out a mortgage to buy the house.", "ko": "그들은 집을 사려고 주택담보대출을 받았다."}, "practice": {"en": "The bank holds a first mortgage on the property.", "ko": "은행이 그 부동산에 1순위 저당권을 가지고 있다."}, "source": {"en": "a consensual interest in real property, including fixtures … which secures payment or performance of an obligation", "ko": "(저당권이란) 정착물을 포함한 부동산에 대한 합의에 의한 권리로서 … 채무의 지급이나 이행을 담보하는 것", "cite": "UCC § 9-102(a)(55)", "url": "https://www.law.cornell.edu/ucc/9/9-102", "glossary": {"consensual": "합의에 의한(약정)", "fixtures": "정착물(건물에 붙어 부동산이 된 물건)", "secure": "담보하다"}}}, "grammar": {"axis": "G4", "title": "a mortgage on the house", "wrong": "The bank has a mortgage of the house.", "right": "The bank has a mortgage on the house.", "note": "부동산 위에 걸린 담보권은 on으로 받습니다. lien도 같습니다(a lien on the car)."}, "pitfalls": ["mortgagor를 '대출해 준 쪽'으로 오해하기 — 대출을 받고 저당을 설정하는 쪽이다"], "collocations": ["take out a mortgage", "pay off the mortgage", "first / second mortgage (1순위·2순위)", "mortgage payment"], "links": [{"label": "LII Wex — mortgage", "url": "https://www.law.cornell.edu/wex/mortgage"}, {"label": "LII Wex — mortgagor", "url": "https://www.law.cornell.edu/wex/mortgagor"}, {"label": "LII Wex — mortgagee", "url": "https://www.law.cornell.edu/wex/mortgagee"}]}, {"id": "foreclosure", "hw": "foreclosure", "ipa": "fɔːrˈkloʊ.ʒɚ", "stress": "fore·**clo**·sure", "stars": 2, "gloss": "(저당권의) 실행 — 채무를 갚지 못한 담보 부동산을 팔아 회수하는 절차", "diff": "법원을 거치는 방식(judicial foreclosure)과 계약상 매각권으로 법원 밖에서 파는 방식(nonjudicial foreclosure)이 있고, 어느 쪽을 허용하는지는 주마다 다릅니다. 한국의 담보권 실행 경매와 기능이 같지만, 법원 밖 매각이 가능한 점이 다릅니다.", "examples": {"easy": {"en": "Their home went into foreclosure.", "ko": "그들의 집이 담보권 실행 절차에 들어갔다."}, "practice": {"en": "The bank foreclosed on the house after six missed payments.", "ko": "은행은 여섯 번 상환이 밀리자 그 집에 대해 담보권을 실행했다."}}, "grammar": {"axis": "G5", "title": "foreclose on — 구동사", "wrong": "The bank foreclosed the borrower.", "right": "The bank foreclosed on the house.", "note": "일상·실무 영어에서는 foreclose on + 부동산(또는 채무자)으로 씁니다. 법조문에서는 foreclose a mortgage(저당권을 실행하다)처럼 타동사로도 씁니다."}, "collocations": ["foreclose on", "go into foreclosure", "foreclosure sale (실행 매각)", "judicial / nonjudicial foreclosure"], "links": [{"label": "LII Wex — foreclosure", "url": "https://www.law.cornell.edu/wex/foreclosure"}]}, {"id": "lien", "hw": "lien", "ipa": "ˈliː.ən", "stress": "**li**·en", "stars": 2, "gloss": "(법정·약정) 담보권, 우선특권 — 채무가 갚아질 때까지 재산에 걸리는 부담", "pron_tip": "Cambridge US는 두 음절 /ˈliː.ən/으로 적습니다. lean과 같은 한 음절 /liːn/으로도 읽습니다. 프랑스어에서 온 말이라 ie를 /aɪ/로 읽지 않습니다.", "diff": "한국의 유치권·우선특권·저당권을 아우르는 넓은 말입니다. 공사대금을 못 받은 시공업자의 mechanic's lien, 세금 체납에 걸리는 tax lien처럼 법률로 생기는 것이 많습니다. '유치권'으로만 옮기면 좁습니다.", "examples": {"easy": {"en": "The IRS put a lien on his house.", "ko": "국세청이 그의 집에 조세 우선권을 설정했다."}, "practice": {"en": "The contractor filed a mechanic's lien for the unpaid work.", "ko": "시공업자는 받지 못한 공사대금에 대해 공사 우선특권을 등록했다."}, "source": {"en": "a right, other than an ownership interest, in real property. The term includes mortgages and other liens on real property.", "ko": "(부담이란) 부동산에 대한 소유권 이외의 권리를 말한다. 이 용어에는 저당권과 그 밖의 부동산 담보권이 포함된다.", "cite": "UCC § 9-102(a)(32)", "url": "https://www.law.cornell.edu/ucc/9/9-102", "glossary": {"encumbrance": "(부동산의) 부담", "ownership interest": "소유권"}}}, "grammar": {"axis": "G6", "title": "lien은 put·file·place와 짝", "wrong": "The city made a lien to his house.", "right": "The city placed a lien on his house.", "note": "담보권을 '걸다'는 put/place, 등록 서류를 내는 것은 file. 대상은 on으로 받습니다."}, "collocations": ["put / place a lien on", "file a lien", "tax lien", "mechanic's lien (공사 우선특권)"], "links": [{"label": "LII Wex — lien", "url": "https://www.law.cornell.edu/wex/lien"}]}, {"id": "security-interest", "hw": "security interest · collateral", "ipa": "səˈkjʊr.ə.t̬i ˈɪn.trɪst · kəˈlæt̬.ɚ.əl", "stress": "se·**cu**·ri·ty **in**·terest · col·**lat**·er·al", "stars": 2, "gloss": "(주로 동산의) 담보권 · 담보물", "diff": "UCC 제9편(Secured Transactions)은 동산·채권 담보를 하나의 security interest로 통일했습니다. 한국은 질권·양도담보·동산채권담보법상 담보권이 따로 있습니다. 담보권자가 도산 절차에서 얼마나 보호되는지는 13장에서 이어집니다.", "examples": {"easy": {"en": "He used his car as collateral.", "ko": "그는 자기 차를 담보로 썼다."}, "practice": {"en": "The lender took a security interest in all of the company's inventory.", "ko": "대주는 회사 재고 전부에 담보권을 취득했다."}, "source": {"en": "A security interest attaches to collateral when it becomes enforceable against the debtor with respect to the collateral", "ko": "담보권은 담보물에 관하여 채무자에게 집행할 수 있게 된 때에 담보물에 붙는다", "cite": "UCC § 9-203(a)", "url": "https://www.law.cornell.edu/ucc/9/9-203", "glossary": {"attach": "(담보권이) 성립하다, 붙다", "enforceable against": "~에게 행사(집행)할 수 있는"}}}, "grammar": {"axis": "G3", "title": "collateral은 불가산 — as collateral", "wrong": "He offered his car as a collateral.", "right": "He offered his car as collateral.", "note": "'담보물'을 통틀어 말하는 collateral은 보통 관사 없이 씁니다. 담보권은 a security interest in A(전치사 in)."}, "collocations": ["a security interest in", "as collateral", "secured party / debtor (담보권자 / 채무자)", "security agreement (담보 약정)"], "links": [{"label": "LII Wex — security interest", "url": "https://www.law.cornell.edu/wex/security_interest"}, {"label": "LII Wex — collateral", "url": "https://www.law.cornell.edu/wex/collateral"}]}, {"id": "perfection", "hw": "perfection", "ipa": "pɚˈfek.ʃən", "stress": "per·**fec**·tion", "stars": 1, "false_friend": true, "gloss": "(담보권의) 대항요건 구비 — 제3자에게 우선권을 주장할 수 있게 하는 절차", "diff": "일상어로는 '완벽'입니다. UCC에서는 담보권이 성립(attach)한 뒤 공시(대개 financing statement 등록)까지 마쳐 제3자에게 대항할 수 있게 된 상태를 말합니다. 한국의 동산·채권 담보등기를 마친 상태와 기능이 비슷합니다. 다만 미국은 등록 외에 점유나 지배(control)로도 대항요건을 갖출 수 있습니다(§ 9-313, § 9-314).", "examples": {"easy": {"en": "The bank perfected its security interest.", "ko": "은행은 담보권의 대항요건을 갖췄다."}, "practice": {"en": "Perfection usually requires filing a financing statement.", "ko": "대항요건을 갖추려면 보통 담보 공시서류(financing statement)를 등록해야 한다."}, "source": {"en": "a security interest is perfected if it has attached and all of the applicable requirements for perfection in Sections 9-310 through 9-316 have been satisfied", "ko": "담보권은 성립하였고 제9-310조부터 제9-316조까지의 대항요건 중 해당하는 것을 모두 갖춘 때에 대항력을 갖춘다", "cite": "UCC § 9-308(a)", "url": "https://www.law.cornell.edu/ucc/9/9-308", "glossary": {"perfected": "대항요건을 갖춘", "attached": "성립한(→ security interest)"}}}, "grammar": {"axis": "G7", "title": "담보권은 '갖춰진다' — be perfected", "wrong": "The security interest perfected last year.", "right": "The security interest was perfected last year.", "note": "perfect는 타동사(담보권자가 perfect하다). 담보권을 주어로 쓰면 수동태 be perfected."}, "pitfalls": ["perfected security interest를 '완벽한 담보권'으로 옮기기", "attachment(성립)와 perfection(대항요건)을 같은 말로 보기"], "collocations": ["perfect a security interest", "perfected / unperfected", "financing statement (담보 공시서류)"], "links": [{"label": "LII Wex — perfection", "url": "https://www.law.cornell.edu/wex/perfection"}, {"label": "LII — UCC § 9-313 (점유에 의한 perfection)", "url": "https://www.law.cornell.edu/ucc/9/9-313"}, {"label": "LII — UCC § 9-314 (지배에 의한 perfection)", "url": "https://www.law.cornell.edu/ucc/9/9-314"}]}, {"id": "covenant", "hw": "covenant", "ipa": "ˈkʌv.ən.ənt", "stress": "**cov**·e·nant", "stars": 1, "gloss": "(부동산에 붙는) 약정, 부담 — 토지 이용을 제한하거나 의무를 지우는 약속", "diff": "성경에서는 '언약'입니다. 재산법에서는 '담장을 2m 넘게 짓지 않는다'처럼 토지에 붙어 다음 소유자에게까지 따라가는 약정을 말합니다. 한국 민법에는 이렇게 승계되는 약정 물권이 일반적으로 인정되지 않아 1:1 대응어가 없습니다. 계약서의 일반 약정 조항도 covenant라고 부릅니다(→ 8장).", "examples": {"easy": {"en": "The covenant bans fences over six feet.", "ko": "그 약정은 6피트가 넘는 울타리를 금지한다."}, "practice": {"en": "The restrictive covenant runs with the land and binds every later owner.", "ko": "그 제한 약정은 토지에 따라붙어 이후 모든 소유자를 구속한다."}}, "grammar": {"axis": "G5", "title": "run with the land — 구동사", "wrong": "The covenant goes with the owner.", "right": "The covenant runs with the land.", "note": "run with the land는 '토지에 따라붙어 승계된다'는 정형 표현입니다. 사람이 아니라 땅(the land)과 함께 갑니다."}, "collocations": ["restrictive covenant (제한 약정)", "run with the land", "breach a covenant", "covenants, conditions, and restrictions (CC&Rs)"], "links": [{"label": "LII Wex — covenant", "url": "https://www.law.cornell.edu/wex/covenant"}]}, {"id": "zoning", "hw": "zoning", "ipa": "ˈzoʊ.nɪŋ", "stress": "**zon**·ing", "stars": 1, "gloss": "용도지역 규제 — 지역마다 건물의 용도·높이·밀도를 정하는 지방정부의 규제", "diff": "미국에서는 주로 시·카운티 같은 지방정부가 조례(zoning ordinance)로 정합니다. 한국의 「국토의 계획 및 이용에 관한 법률」상 용도지역과 기능이 비슷합니다. 연방대법원은 Village of Euclid v. Ambler Realty Co., 272 U.S. 365 (1926)에서 용도지역제를 합헌으로 보았고, 그래서 주거·상업·공업을 나누는 전통적 방식을 Euclidean zoning이라고 부릅니다.", "examples": {"easy": {"en": "Zoning rules ban shops on this street.", "ko": "용도지역 규제 때문에 이 거리에는 상점을 낼 수 없다."}, "practice": {"en": "The owner asked the board for a variance from the zoning ordinance.", "ko": "소유자는 위원회에 용도지역 조례의 예외 허가를 신청했다."}}, "grammar": {"axis": "G3", "title": "zoning은 셀 수 없다", "wrong": "The city adopted a new zonings.", "right": "The city adopted new zoning rules.", "note": "제도 전체를 가리키는 zoning은 불가산. 셀 때는 zoning rules, a zoning ordinance처럼 뒤에 셀 수 있는 명사를 붙입니다."}, "collocations": ["zoning ordinance (용도지역 조례)", "zoning board", "variance (예외 허가)", "rezone (용도를 변경하다)"], "links": [{"label": "LII Wex — zoning", "url": "https://www.law.cornell.edu/wex/zoning"}]}, {"id": "eminent-domain", "hw": "eminent domain · taking", "ipa": "ˈem.ə.nənt doʊˈmeɪn · ˈteɪ.kɪŋ", "stress": "**em**·i·nent do·**main** · **tak**·ing", "stars": 2, "pron_tip": "Cambridge에 taking 표제어는 있으나 발음 표기가 없습니다. take /teɪk/에 -ing가 붙은 규칙형이고, 보조 사전 Wiktionary 표기 /ˈteɪkɪŋ/와 같습니다.", "gloss": "공용수용권 · 수용(재산권의 박탈 또는 그에 준하는 제한)", "diff": "eminent domain은 정부가 사유재산을 강제로 취득하는 권한이고, 그 권한을 행사한 결과가 taking입니다. 수정헌법 제5조는 공공의 용도(public use)와 정당한 보상(just compensation)을 요구합니다. 규제가 지나치면 땅을 가져가지 않아도 taking이 될 수 있다는 이론(regulatory taking)은 이 장의 「명판결 명문장」에서 봅니다. 헌법 전반은 15장.", "examples": {"easy": {"en": "The state took her land by eminent domain.", "ko": "주 정부는 공용수용으로 그녀의 땅을 가져갔다."}, "practice": {"en": "The owners argued that the new rule was a taking without just compensation.", "ko": "소유자들은 새 규제가 정당한 보상 없는 수용이라고 주장했다."}, "source": {"en": "nor shall private property be taken for public use, without just compensation", "ko": "정당한 보상 없이 사유재산을 공공의 용도로 수용당하지 아니한다", "cite": "U.S. Const. amend. V", "url": "https://www.law.cornell.edu/constitution/fifth_amendment", "glossary": {"just compensation": "정당한 보상", "public use": "공공의 용도"}}}, "box": "Kelo v. City of New London, 545 U.S. 469 (2005)에서 연방대법원은 5 대 4로, 도시가 경제개발 계획을 위해 개인 주택을 수용해 민간 개발사에 넘기는 것도 public use에 해당한다고 보았습니다. 판결 뒤 여러 주가 수용을 제한하는 법을 만들었습니다.", "grammar": {"axis": "G1", "title": "a taking — 동명사인데 관사가 붙는다", "wrong": "The regulation was taking of her land.", "right": "The regulation was a taking of her land.", "note": "법률 용어 taking은 '수용 한 건'을 가리키는 가산명사입니다. a taking, the takings at issue처럼 관사와 복수형을 씁니다. eminent domain은 권한의 이름이라 관사 없이 by eminent domain."}, "collocations": ["by eminent domain", "Takings Clause (수용 조항)", "just compensation", "regulatory taking (규제적 수용)", "condemnation (수용 절차)"], "links": [{"label": "LII Wex — eminent domain", "url": "https://www.law.cornell.edu/wex/eminent_domain"}, {"label": "LII Wex — takings", "url": "https://www.law.cornell.edu/wex/takings"}, {"label": "LII — Kelo v. City of New London 판결 원문", "url": "https://www.law.cornell.edu/supremecourt/text/04-108"}]}, {"id": "landlord-tenant-law", "hw": "landlord-tenant law", "ipa": "ˈlænd.lɔːrd ˈten.ənt lɑː", "stress": "**land**·lord-**ten**·ant **law**", "stars": 1, "gloss": "임대차법(주로 주거용 임대차를 규율하는 주법·지방 조례의 총칭)", "diff": "하나의 법전이 아니라 주법·판례·지방 조례를 묶어 부르는 말입니다. 많은 주가 판례나 법률로 '주거 적합성 묵시 보증(implied warranty of habitability)'을 인정해, 임대인이 사람이 살 수 있는 상태를 유지할 의무를 집니다. 한국의 주택임대차보호법처럼 전국 단일 특별법이 있는 구조는 아닙니다.", "examples": {"easy": {"en": "Landlord-tenant laws vary from state to state.", "ko": "임대차법은 주마다 다르다."}, "practice": {"en": "Under the city's rules, the landlord must give 30 days' notice before a rent increase.", "ko": "시 조례에 따르면 임대인은 차임 인상 30일 전에 통지해야 한다."}}, "grammar": {"axis": "G2", "title": "주마다 다른 '법들' — laws + 복수 동사", "wrong": "Landlord-tenant law vary by state.", "right": "Landlord-tenant laws vary by state. / Landlord-tenant law varies by state.", "note": "분야 이름(law, 단수)으로 쓰면 동사도 단수(varies), 개별 법률들(laws)로 쓰면 복수(vary). 주어와 동사의 수를 맞춥니다."}, "collocations": ["implied warranty of habitability (주거 적합성 묵시 보증)", "eviction (퇴거)", "rent control / rent stabilization (차임 규제)"], "links": [{"label": "LII Wex — landlord-tenant law", "url": "https://www.law.cornell.edu/wex/landlord-tenant_law"}]}, {"id": "condominium", "hw": "condominium · co-op", "ipa": "ˌkɑːn.dəˈmɪn.i.əm · ˈkoʊˌɑːp", "stress": "con·do·**min**·i·um · **co**-op", "stars": 1, "pron_tip": "co-op은 Cambridge US 표기 /ˈkoʊˌɑːp/대로 첫 음절에 강세, 둘째 음절에 제2강세를 둡니다. '쿠프'처럼 한 음절로 줄이지 않습니다.", "gloss": "구분소유 건물(의 한 호실) · 협동조합 주택", "diff": "condominium(줄여서 condo)은 각 호실을 따로 소유하고 복도·지붕 같은 공용 부분은 지분으로 공유합니다. 한국 「집합건물의 소유 및 관리에 관한 법률」의 구분소유와 가깝습니다. co-op은 건물을 소유한 법인의 주식을 사고, 그 대가로 특정 호실을 쓸 장기 임차권(proprietary lease)을 받습니다. 집을 '소유'하는 것이 아니어서 한국에는 대응하는 제도가 없습니다.", "examples": {"easy": {"en": "They bought a condo near the park.", "ko": "그들은 공원 근처의 콘도(구분소유 아파트) 한 채를 샀다."}, "practice": {"en": "One of the units in the co-op was sold after the board approved the buyer.", "ko": "조합 이사회가 매수인을 승인한 뒤 협동조합 주택의 한 호실이 팔렸다."}}, "grammar": {"axis": "G2", "title": "one of the units — 복수명사, 단수 동사", "wrong": "One of the unit were sold.", "right": "One of the units was sold.", "note": "one of 뒤는 복수(units), 동사는 주어 one에 맞춰 단수(was)."}, "pitfalls": ["condo를 한국의 휴양 '콘도'로 이해하기 — 미국에서는 보통 구분소유 아파트", "co-op 입주자를 owner로만 옮기기 — 법적으로는 주주이자 임차인"], "collocations": ["condo association / HOA (관리단)", "common elements (공용 부분)", "co-op board", "proprietary lease"], "links": [{"label": "LII Wex — condominium", "url": "https://www.law.cornell.edu/wex/condominium"}]}], "corners": {"false_friend": {"title": "title은 제목이 아니다", "body": ["부동산 거래 서류에 title이 나오면 책 제목이 아니라 '소유권, 권원'입니다. clear title은 '분명한 제목'이 아니라 하자 없는 권원이고, title company는 출판사가 아니라 권원 조사·보험 회사입니다.", "이 장에는 이런 단어가 유난히 많습니다. 땅과 담보를 다루는 말이 중세 영국법에서 그대로 내려왔기 때문입니다."], "table": [["title", "제목, 직함", "소유권, 권원"], ["deed", "행위(good deeds)", "양도증서"], ["tenancy", "세 들어 사는 것", "(공동소유에서) 보유 — joint tenancy"], ["perfection", "완벽", "(담보권의) 대항요건 구비"], ["fee", "수수료", "봉토에서 온 소유권(fee simple)"], ["covenant", "(성경의) 언약", "토지에 붙는 약정"]], "tip": "외우는 요령: 문장에 land·property·deed·mortgage가 함께 나오면 일상 뜻을 의심하세요."}, "drama": {"title": "Little Pink House (2017)", "facts": ["2017년 미국·캐나다 영화. 각본·감독 코트니 발라커(Courtney Balaker), 주연 캐서린 키너·진 트리플혼.", "제프 베네딕트(Jeff Benedict)의 논픽션 『Little Pink House』가 원작이고, 이 장에 나오는 Kelo v. City of New London (2005) 사건이 실화입니다.", "주인공은 코네티컷주 뉴런던의 구급대원 수제트 켈로(Susette Kelo)로, 시가 공용수용으로 자기 집을 민간 개발에 넘기려 하자 소송을 냅니다."], "watch": "eminent domain과 just compensation이 일상 대화에 어떻게 섞이는지 들어 보세요. 시가 '보상은 한다'고 말해도 주인공이 받아들이지 않는 이유가 바로 public use 요건입니다. 결말은 연방대법원 패소라는 실제 결과를 따릅니다.", "terms": ["eminent domain", "taking", "just compensation", "public use", "property"], "links": [{"label": "Wikipedia — Little Pink House", "url": "https://en.wikipedia.org/wiki/Little_Pink_House"}, {"label": "YouTube — 공식 예고편 (Little Pink House Movie)", "url": "https://www.youtube.com/watch?v=6GPWNNiTJ9g"}]}, "quote": {"text": "The general rule at least is that while property may be regulated to a certain extent, if regulation goes too far it will be recognized as a taking.", "ko": "일반 원칙은 적어도 이렇다. 재산권은 어느 정도까지는 규제될 수 있지만, 규제가 지나치면 수용으로 인정될 것이다.", "case": "Pennsylvania Coal Co. v. Mahon, 260 U.S. 393, 415 (1922)", "decided": "1922. 12. 11. 선고", "gloss": {"to a certain extent": "어느 정도까지는", "go too far": "도를 넘다", "be recognized as": "~으로 인정되다"}, "why": "홈스(Oliver Wendell Holmes Jr.) 대법관이 쓴 법정의견입니다. 탄광 회사의 지하 채굴권을 사실상 없애는 주법이 문제였습니다. 정부가 땅을 가져가지 않아도 규제가 지나치면 보상이 필요한 수용이 될 수 있다는 '규제적 수용(regulatory taking)' 이론이 이 한 문장에서 시작됐습니다. '얼마나 지나쳐야 하는가'를 두고는 지금도 다툼이 이어집니다. 그 판단 요소는 Penn Central (1978) 판결이 정리했습니다.", "links": [{"label": "LII — Pennsylvania Coal Co. v. Mahon 판결 원문", "url": "https://www.law.cornell.edu/supremecourt/text/260/393"}]}, "korea": {"title": "등기하지 않으면 내 땅이 아니다?", "us": "미국에서는 양도증서(deed)를 교부하면 매도인과 매수인 사이에서 소유권이 넘어갑니다. 공적 기록(recording)은 뒤에 산 사람 같은 제3자에게 대항하기 위한 것이고, 그 규칙(race·notice·race-notice)은 주마다 다릅니다.", "kr": "한국 민법 제186조는 '부동산에 관한 법률행위로 인한 물권의 득실변경은 등기하여야 그 효력이 생긴다'고 정합니다(성립요건주의). 등기 전에는 매수인이 대금을 다 치렀어도 소유자가 아닙니다. 점유취득시효도 마찬가지로, 제245조 제1항은 20년 점유자가 '등기함으로써' 소유권을 취득한다고 합니다.", "say": "In a sale of land in Korea, ownership does not pass until the transfer is registered. In many U.S. states, recording only protects the buyer against later purchasers.", "say_ko": "한국에서 토지를 사고팔면 이전등기를 마쳐야 소유권이 넘어갑니다. 미국의 많은 주에서 기록(recording)은 뒤의 매수인에 대해 매수인을 보호할 뿐입니다."}}, "quiz": [{"q": "부동산 거래에서 'clear title'의 뜻은?", "options": ["분명한 제목", "하자 없는 소유권(권원)", "등기 완료 증명서", "명확한 직함"], "answer": 1, "why": "재산법의 title은 '소유권, 권원'. clear title은 다른 사람의 권리 주장이나 부담이 없는 권원입니다."}, {"q": "주택담보대출을 받고 집에 저당권을 설정한 사람(집주인)은?", "options": ["mortgagee", "mortgagor", "landlord"], "answer": 1, "why": "-or는 저당권을 설정하는 쪽(채무자), -ee는 저당권을 받는 쪽(은행)입니다. landlord는 임대인."}, {"q": "'joint tenancy'에서 tenancy의 뜻은?", "options": ["임차", "(공동소유에서의) 보유", "세입자 모임"], "answer": 1, "why": "joint tenancy는 생존자 취득권이 붙은 공동소유입니다. 임대차와 관계없습니다."}, {"q": "문법: 빈칸에 맞는 것은? — He inherited ____ from his father.", "options": ["a property of land", "property", "properties of money"], "answer": 1, "why": "'재산'을 통틀어 말하는 property는 불가산이라 관사 없이 씁니다. 부동산을 한 건씩 셀 때만 a property, two properties.", "grammar": "G3"}, {"q": "번역해 보세요: The bank foreclosed on the house.", "options": ["은행이 그 집을 폐쇄했다.", "은행이 그 집에 대해 담보권을 실행했다.", "은행이 그 집의 대출을 연장했다."], "answer": 1, "why": "foreclose on은 '담보권을 실행하다'. close(닫다)에 끌려 '폐쇄'로 옮기지 않습니다."}]}, {"chapter": {"num": 11, "title": "가족법과 상속", "subtitle": "", "title_en": "Family Law and Inheritance", "lead": "미국에서 혼인·이혼·양육·상속은 원칙적으로 주법의 영역입니다. 연방법은 주와 주 사이의 다툼(양육권 판결의 효력, 양육비 집행)에 개입하고, 연방대법원은 헌법 문제가 걸릴 때 등장합니다. 이 장은 가정법원과 검인법원에서 오가는 말을 다룹니다.", "can_say": [{"en": "The court awarded joint custody of the children to both parents.", "ko": "법원은 자녀에 대한 공동양육권을 부모 양쪽에게 인정했습니다."}, {"en": "He died without a will, so his estate passed to his heirs.", "ko": "그는 유언 없이 사망하여 그의 유산은 상속인들에게 넘어갔습니다."}, {"en": "Every state now allows no-fault divorce.", "ko": "이제는 모든 주가 무책주의 이혼을 허용합니다."}]}, "entries": [{"id": "family-law", "hw": "family law · family court", "ipa": "ˈfæm.əl.i lɑː · ˈfæm.əl.i kɔːrt", "stress": "**fam**·i·ly **law** · **fam**·i·ly **court**", "stars": 3, "gloss": "가족법 · 가정법원(가사 사건을 맡는 주 법원 또는 그 부서)", "diff": "미국에는 연방 가정법원이 없습니다. 혼인·이혼·양육은 주법 문제여서 주 법원이 맡고, 이름도 family court, domestic relations court, probate and family court 등 주마다 다릅니다. 한국 가정법원처럼 전국에 같은 체계가 있다고 보면 안 됩니다.", "examples": {"easy": {"en": "She practices family law in Ohio.", "ko": "그녀는 오하이오주에서 가족법 사건을 다루는 변호사다."}, "practice": {"en": "The divorce case was transferred to family court.", "ko": "그 이혼 사건은 가정법원으로 이송되었다."}, "source": {"en": "the domestic relations of husband and wife, parent and child, belongs to the laws of the States and not to the laws of the United States", "ko": "남편과 아내, 부모와 자식의 가족관계는 연방법이 아니라 주법에 속한다", "cite": "Ankenbrandt v. Richards, 504 U.S. 689 (1992) (In re Burrus, 136 U.S. 586 (1890) 인용)", "url": "https://www.law.cornell.edu/supct/html/91-367.ZO.html", "glossary": {"domestic relations": "가족관계(가사) — 가족법의 옛 이름"}}}, "box": "주적 상이(diversity of citizenship)를 근거로 한 연방 관할에서는 연방법원이 이혼·부양료·양육권 판결을 내리지 않는다는 원칙을 '가사 예외(domestic relations exception)'라고 부릅니다. Ankenbrandt 판결은 이 예외를 주적 상이 관할 법률의 해석으로 설명하면서 그런 판결을 구하는 사건으로 좁혔고, 그래서 가족 사이의 불법행위 소송은 연방법원도 다룰 수 있습니다.", "grammar": {"axis": "G1", "title": "법 분야 이름에는 관사를 붙이지 않는다", "wrong": "She practices the family law.", "right": "She practices family law.", "note": "분야로서의 law는 무관사로 씁니다(contract law, criminal law). 법원은 in family court처럼 관사 없이 쓰기도 하고, 특정 법원을 가리키면 the family court입니다."}, "collocations": ["practice family law", "in family court", "domestic relations court", "family law attorney"], "links": [{"label": "LII Wex — family law", "url": "https://www.law.cornell.edu/wex/family_law"}, {"label": "LII Wex — family court", "url": "https://www.law.cornell.edu/wex/family_court"}]}, {"id": "marriage", "hw": "marriage · spouse", "ipa": "ˈmer.ɪdʒ · spaʊs", "stress": "**mar**·riage · **spouse**", "stars": 3, "gloss": "혼인 · 배우자", "examples": {"easy": {"en": "His spouse came to the hearing.", "ko": "그의 배우자가 심리에 나왔다."}, "practice": {"en": "Both spouses must sign the settlement agreement.", "ko": "배우자 두 사람 모두 합의서에 서명해야 한다."}, "source": {"en": "Ohio law does not permit Obergefell to be listed as the surviving spouse on Arthur's death certificate.", "ko": "오하이오주 법은 오버거펠이 아서의 사망진단서에 생존 배우자로 기재되는 것을 허용하지 않는다.", "cite": "Obergefell v. Hodges, 576 U.S. 644 (2015)", "url": "https://www.law.cornell.edu/supremecourt/text/14-556", "glossary": {"surviving spouse": "생존 배우자(먼저 사망한 사람의 배우자)", "death certificate": "사망진단서"}}}, "box": "Obergefell 판결(2015)은 동성 커플의 혼인할 권리를 수정헌법 제14조가 보장한다고 판단했습니다. 원고 오버거펠은 먼저 세상을 떠난 배우자의 사망진단서에 자신이 배우자로 적히기를 원했습니다. 이 장의 「명판결 명문장」이 이 판결의 마지막 단락입니다.", "grammar": {"axis": "G2", "title": "spouse는 셀 수 있다 — both spouses", "wrong": "Both spouse must sign.", "right": "Both spouses must sign.", "note": "both 뒤에는 복수명사. 성별을 가리지 않는 말이라 법률 문서에서 husband/wife 대신 씁니다. marriage도 셀 수 있어 a second marriage라고 합니다."}, "collocations": ["surviving spouse (생존 배우자)", "former spouse / ex-spouse", "same-sex marriage", "marriage license (혼인허가증)"], "links": [{"label": "LII Wex — marriage", "url": "https://www.law.cornell.edu/wex/marriage"}]}, {"id": "divorce", "hw": "divorce · no-fault divorce", "ipa": "dɪˈvɔːrs · ˌnoʊˈfɑːlt dɪˈvɔːrs", "stress": "di·**vorce** · no-**fault** di·**vorce**", "stars": 3, "gloss": "이혼 · 무책주의(파탄주의) 이혼", "diff": "no-fault divorce는 상대방의 잘못을 증명하지 않고 '혼인이 회복할 수 없이 깨졌다'는 것만으로 하는 이혼입니다. LII Wex에 따르면 지금은 모든 주가 이를 인정하고, 잘못(fault)을 이유로 한 이혼을 아예 없앤 주도 많습니다. 한국 재판상 이혼은 유책주의를 원칙으로 합니다(→ 「한국이라면?」).", "examples": {"easy": {"en": "They got divorced last year.", "ko": "그들은 작년에 이혼했다."}, "practice": {"en": "She filed for divorce, citing irreconcilable differences.", "ko": "그녀는 화해할 수 없는 불화를 이유로 이혼을 청구했다."}, "source": {"en": "the domestic relations exception encompasses only cases involving the issuance of a divorce, alimony, or child custody decree", "ko": "가사 예외는 이혼, 이혼 후 부양료, 자녀 양육권에 관한 판결을 내리는 사건에만 미친다", "cite": "Ankenbrandt v. Richards, 504 U.S. 689 (1992)", "url": "https://www.law.cornell.edu/supct/html/91-367.ZO.html", "glossary": {"decree": "판결 — 가사 사건 판결은 흔히 decree라고 부른다", "encompass": "포함하다, 미치다"}}}, "grammar": {"axis": "G4", "title": "divorce는 상대를 바로 목적어로 받는다", "wrong": "She divorced with her husband.", "right": "She divorced her husband. / She got divorced from her husband.", "note": "동사 divorce 뒤에는 전치사가 없습니다. '~와 이혼하다'의 '와'를 with로 옮기지 마세요. 이혼을 청구하는 것은 file for divorce."}, "collocations": ["file for divorce", "get divorced", "grounds for divorce (이혼 사유)", "irreconcilable differences (화해할 수 없는 불화)"], "links": [{"label": "LII Wex — divorce", "url": "https://www.law.cornell.edu/wex/divorce"}, {"label": "LII Wex — no-fault divorce", "url": "https://www.law.cornell.edu/wex/no-fault_divorce"}]}, {"id": "prenuptial-agreement", "hw": "prenuptial agreement", "ipa": "ˌpriːˈnʌp.ʃəl əˈɡriː.mənt", "stress": "pre·**nup**·tial a·**gree**·ment", "stars": 2, "gloss": "혼전계약(혼인 전에 이혼·사망 때의 재산 문제를 정해 두는 계약)", "diff": "한국 민법에도 부부재산약정(제829조)이 있습니다. 혼인 성립 전에 맺어야 하고, 혼인 성립까지 등기하지 않으면 제3자에게 대항하지 못하며, 혼인 중에는 법원 허가 없이 바꾸지 못합니다. 미국 혼전계약의 요건과 효력은 주마다 다르고 이혼 소송에서 자주 다퉈집니다.", "examples": {"easy": {"en": "They signed a prenup.", "ko": "그들은 혼전계약서에 서명했다."}, "practice": {"en": "The wife argues that the prenuptial agreement is invalid because she signed it without a lawyer.", "ko": "아내는 변호사 없이 서명했으므로 혼전계약이 무효라고 주장한다."}}, "grammar": {"axis": "G6", "title": "계약은 sign / enter into", "wrong": "They made a contract of prenup.", "right": "They signed a prenuptial agreement. / They entered into a prenup.", "note": "계약을 '맺다'는 enter into(→ 8장). 일상에서는 줄여서 prenup이라 하고, 혼인 뒤에 맺는 것은 postnuptial agreement(postnup)."}, "collocations": ["sign a prenup", "enter into a prenuptial agreement", "enforce / challenge a prenup", "postnuptial agreement"], "links": [{"label": "LII Wex — prenuptial agreement", "url": "https://www.law.cornell.edu/wex/prenuptial_agreement"}]}, {"id": "alimony", "hw": "alimony · spousal support", "ipa": "ˈæl.ə.moʊ.ni · ˈspaʊ.zəl səˈpɔːrt", "stress": "**al**·i·mo·ny · **spou**·sal sup·**port**", "stars": 2, "uk": "maintenance (잉글랜드)", "gloss": "배우자 부양료(이혼·별거 등에 따라 한쪽 배우자가 다른 쪽에 주는 돈 — 정기금 또는 일시금)", "diff": "한국에는 이혼 후 부양료라는 독립된 제도가 없고, 재산분할(민법 제839조의2)과 위자료가 그 기능 일부를 나눠 맡습니다. alimony를 '위자료'로 옮기면 틀립니다. 위자료는 정신적 손해배상이고 alimony는 부양입니다.", "examples": {"easy": {"en": "He pays alimony every month.", "ko": "그는 매달 이혼 후 부양료를 낸다."}, "practice": {"en": "The court ordered spousal support for five years.", "ko": "법원은 5년 동안 배우자 부양료를 지급하라고 명했다."}}, "grammar": {"axis": "G3", "title": "alimony는 셀 수 없다", "wrong": "He pays an alimony. / alimonies", "right": "He pays alimony. / He pays $2,000 a month in alimony.", "note": "돈의 흐름을 말하는 불가산명사입니다. 금액은 '$… in alimony'로 붙입니다. child support도 같습니다."}, "collocations": ["pay / receive alimony", "award spousal support", "temporary alimony", "modify alimony"], "pitfalls": ["alimony를 '위자료'로 옮기는 실수 — 위자료에 가까운 말은 damages for emotional distress입니다."], "links": [{"label": "LII Wex — alimony", "url": "https://www.law.cornell.edu/wex/alimony"}, {"label": "LII Wex — spousal support", "url": "https://www.law.cornell.edu/wex/spousal_support"}]}, {"id": "community-property", "hw": "community property · equitable distribution", "ipa": "kəˈmjuː.nə.t̬i ˈprɑː.pɚ.t̬i · ˈek.wɪ.t̬ə.bəl ˌdɪs.trɪˈbjuː.ʃən", "stress": "com·**mu**·ni·ty **prop**·er·ty · **eq**·ui·ta·ble dis·tri·**bu**·tion", "stars": 2, "gloss": "부부공동재산제 · (이혼 때 혼인 중 재산의) 형평분배", "diff": "혼인 중 얻은 재산을 이혼할 때 어떻게 나누는지는 주마다 다릅니다. 캘리포니아처럼 혼인 중 재산을 부부가 똑같이 갖는다고 보는 주(community property state)가 있고, 여러 요소를 따져 공평하게 나누는 주(equitable distribution)가 있습니다. 후자의 '공평'은 반드시 반반이 아닙니다.", "examples": {"easy": {"en": "California is a community property state.", "ko": "캘리포니아는 부부공동재산제를 따르는 주다."}, "practice": {"en": "Under equitable distribution, the judge gave the wife 60 percent of the marital property.", "ko": "형평분배 원칙에 따라 판사는 혼인 중 재산의 60퍼센트를 아내 몫으로 정했다."}}, "grammar": {"axis": "G1", "title": "a community property state — 명사가 형용사 노릇", "wrong": "California is community property state.", "right": "California is a community property state.", "note": "community property는 state를 꾸밀 뿐이고, 핵심 명사 state가 셀 수 있으므로 a가 필요합니다. 제도 자체를 말할 때는 무관사(under community property)."}, "collocations": ["community property state", "separate property (특유재산)", "marital property (혼인 중 재산)", "divide the marital estate"], "links": [{"label": "LII Wex — community property", "url": "https://www.law.cornell.edu/wex/community_property"}, {"label": "LII Wex — equitable distribution", "url": "https://www.law.cornell.edu/wex/equitable_distribution"}]}, {"id": "custody", "hw": "child custody · joint custody", "ipa": "tʃaɪld ˈkʌs.tə.di · dʒɔɪnt ˈkʌs.tə.di", "stress": "**child** **cus**·to·dy · **joint** **cus**·to·dy", "stars": 3, "false_friend": true, "gloss": "(자녀) 양육권 · 공동양육(권)", "diff": "custody는 형사에서는 '구금'입니다(→ 6장). 가족법의 custody는 다시 둘로 나뉩니다. 아이가 누구와 사는가(physical custody)와 교육·의료 같은 중요한 결정을 누가 하는가(legal custody)입니다. 한국의 친권·양육권 구분과 비슷하지만 1:1로 겹치지는 않습니다.", "examples": {"easy": {"en": "The mother got custody of the kids.", "ko": "어머니가 아이들의 양육권을 얻었다."}, "practice": {"en": "The judge awarded joint legal custody to both parents and primary physical custody to the father.", "ko": "판사는 공동 법적 양육권을 부모 모두에게, 주된 신상 양육권을 아버지에게 인정했다."}, "source": {"en": "the fundamental right of parents to make decisions concerning the care, custody, and control of their children", "ko": "자녀의 보살핌, 양육, 통제에 관하여 결정을 내릴 부모의 기본권", "cite": "Troxel v. Granville, 530 U.S. 57 (2000) (상대다수의견)", "url": "https://www.law.cornell.edu/supct/html/99-138.ZO.html", "glossary": {"fundamental right": "기본권(헌법이 특히 두텁게 보호하는 권리)", "care, custody, and control": "양육권의 내용을 묶어 부르는 판례 관용구"}}}, "box": "Troxel 사건에서 조부모는 손녀들을 정기적으로 만나게 해 달라고 청구했고, 워싱턴주 법은 '누구든' 면접교섭을 청구할 수 있게 했습니다. 연방대법원은 그 법을 이 사건에 적용하는 것이 부모의 결정권을 침해한다고 보았습니다.", "grammar": {"axis": "G4", "title": "custody of 아이 / custody to 부모", "wrong": "The court gave the custody for the children to the mother.", "right": "The court awarded custody of the children to the mother.", "note": "누구에 '대한' 양육권은 of, 누구'에게' 주는지는 to. 상태를 말할 때는 in the custody of(~의 보호 아래)."}, "collocations": ["award custody to", "custody of the children", "sole / joint custody", "custody battle (양육권 다툼)"], "links": [{"label": "LII Wex — child custody", "url": "https://www.law.cornell.edu/wex/child_custody"}, {"label": "LII Wex — joint custody", "url": "https://www.law.cornell.edu/wex/joint_custody"}]}, {"id": "visitation", "hw": "visitation · parenting time", "ipa": "ˌvɪz.əˈteɪ.ʃən · ˈper.ən.t̬ɪŋ taɪm", "stress": "vis·i·**ta**·tion · **par**·ent·ing **time**", "stars": 2, "gloss": "면접교섭(양육하지 않는 부모가 자녀를 만나는 것)", "diff": "'방문'이라는 어감을 피해 parenting time이라는 말을 쓰는 주도 있습니다. 한국 민법의 면접교섭권과 대응합니다. 한국도 부모 한쪽이 사망했거나 질병·외국 거주 등으로 면접교섭을 할 수 없을 때는 조부모 같은 직계존속이 면접교섭을 청구할 수 있지만(민법 제837조의2 제2항), 미국에서는 조부모 등 제3자의 면접교섭(third-party visitation)이 더 넓게 다퉈집니다(→ custody의 Troxel 사건).", "examples": {"easy": {"en": "The father has visitation every weekend.", "ko": "아버지는 주말마다 면접교섭을 한다."}, "practice": {"en": "The grandparents petitioned for visitation with their grandchildren.", "ko": "조부모는 손주들과의 면접교섭을 청구했다."}, "source": {"en": "a person, including a parent or grandparent, who claims a right to custody or visitation of a child", "ko": "부모나 조부모를 포함하여, 자녀에 대한 양육권이나 면접교섭권을 주장하는 사람", "cite": "28 U.S.C. § 1738A(b)(2) (contestant의 정의)", "url": "https://www.law.cornell.edu/uscode/text/28/1738A", "glossary": {"contestant": "(양육권 분쟁의) 다툼 당사자"}}}, "grammar": {"axis": "G4", "title": "visitation with 사람", "wrong": "visitation to his son", "right": "visitation with his son / visitation rights", "note": "만나는 상대는 with로 받습니다. parenting time도 같습니다(parenting time with the children)."}, "collocations": ["visitation rights", "supervised visitation (감독부 면접교섭)", "visitation schedule", "parenting time with"], "links": [{"label": "LII Wex — visitation", "url": "https://www.law.cornell.edu/wex/visitation"}]}, {"id": "child-support", "hw": "child support", "ipa": "tʃaɪld səˈpɔːrt", "stress": "**child** sup·**port**", "stars": 3, "gloss": "양육비", "diff": "양육비 금액은 주마다 정한 산정 기준표(guidelines)로 계산합니다. 연방법은 주가 양육비를 실제로 받아 낼 수단, 곧 급여에서 바로 떼는 소득 원천징수 같은 절차를 갖추도록 요구합니다(42 U.S.C. § 666).", "examples": {"easy": {"en": "He stopped paying child support.", "ko": "그는 양육비를 더 이상 내지 않았다."}, "practice": {"en": "The court ordered the father to pay $800 a month in child support.", "ko": "법원은 아버지에게 매달 800달러의 양육비를 지급하라고 명했다."}, "source": {"en": "withholding as a means of collecting child support is available if arrearages occur", "ko": "체납이 생기면 양육비를 받아 내는 수단으로 원천징수를 쓸 수 있도록", "cite": "42 U.S.C. § 666(a)(8)(A)", "url": "https://www.law.cornell.edu/uscode/text/42/666", "glossary": {"withholding": "(급여에서의) 원천징수", "arrearages": "체납액, 밀린 돈"}}}, "grammar": {"axis": "G6", "title": "child support는 pay와 짝을 이룬다", "wrong": "He gives child supports.", "right": "He pays child support.", "note": "양육비를 '주다'는 pay. 셀 수 없는 명사라 s를 붙이지 않습니다. 밀린 양육비는 back child support 또는 child support arrears."}, "collocations": ["pay child support", "child support order", "child support guidelines", "fall behind on child support"], "links": [{"label": "LII Wex — child support", "url": "https://www.law.cornell.edu/wex/child_support"}]}, {"id": "best-interests", "hw": "best interests of the child", "ipa": "best ˈɪn.trɪsts əv ðə tʃaɪld", "stress": "**best** **in**·ter·ests of the **child**", "stars": 3, "gloss": "자녀의 최선의 이익(양육권·면접교섭 판단의 기준)", "examples": {"easy": {"en": "The judge must consider the child's best interests.", "ko": "판사는 자녀의 최선의 이익을 고려해야 한다."}, "practice": {"en": "It is in the best interests of the child to stay in her current school.", "ko": "지금 다니는 학교에 계속 다니는 것이 자녀의 최선의 이익에 맞는다."}, "source": {"en": "it is in the best interest of the child that a court of such State assume jurisdiction", "ko": "그 주의 법원이 관할권을 행사하는 것이 자녀의 최선의 이익에 맞는 경우", "cite": "28 U.S.C. § 1738A(c)(2)(B)(ii)", "url": "https://www.law.cornell.edu/uscode/text/28/1738A", "glossary": {"assume jurisdiction": "관할권을 행사하다(맡다)"}}}, "box": "28 U.S.C. § 1738A(양육권 판결의 주 간 효력)는 한 주의 양육권 판결을 다른 주가 존중하도록 정합니다. 부모 한쪽이 아이를 데리고 다른 주로 가서 새 판결을 받아 내는 일을 막으려는 법입니다.", "grammar": {"axis": "G2", "title": "best interests — 보통 복수", "wrong": "in the best interest of the children's (소유격 중복)", "right": "in the best interests of the child", "note": "관용구는 주로 복수 interests로 씁니다. 다만 위 조문처럼 단수 best interest로 쓰는 법령도 있으니, 인용할 때는 원문 그대로 둡니다."}, "collocations": ["in the best interests of the child", "best-interests standard", "act in the child's best interests"], "links": [{"label": "LII Wex — best interests of the child", "url": "https://www.law.cornell.edu/wex/best_interests_of_the_child"}]}, {"id": "adoption", "hw": "adoption", "ipa": "əˈdɑːp.ʃən", "stress": "a·**dop**·tion", "stars": 2, "gloss": "입양 · (동사 adopt) 입양하다", "examples": {"easy": {"en": "She was adopted at age two.", "ko": "그녀는 두 살 때 입양되었다."}, "practice": {"en": "The court granted the adoption after a home study.", "ko": "법원은 가정조사를 거쳐 입양을 허가했다."}}, "grammar": {"axis": "G7", "title": "입양된 사람이 주어면 수동태", "wrong": "She adopted by a couple in Texas.", "right": "She was adopted by a couple in Texas.", "note": "주어가 입양'된' 사람이면 was adopted. adopted는 형용사로도 써서 an adopted child(입양아)라고 합니다."}, "collocations": ["adopt a child", "grant an adoption", "adoptive parents (양부모)", "birth parents (친생부모)"], "links": [{"label": "LII Wex — adoption", "url": "https://www.law.cornell.edu/wex/adoption"}]}, {"id": "guardian", "hw": "guardian · guardianship", "ipa": "ˈɡɑːr.di.ən · ˈɡɑːr.di.ən.ʃɪp", "stress": "**guard**·i·an · **guard**·i·an·ship", "stars": 2, "gloss": "후견인 · 후견", "diff": "미성년자뿐 아니라 판단 능력이 떨어진 성인에게도 법원이 후견인을 선임합니다. 소송에서 미성년자의 이익만을 대변하도록 따로 선임하는 사람은 guardian ad litem(소송 후견인)입니다.", "examples": {"easy": {"en": "Her aunt became her guardian.", "ko": "이모가 그녀의 후견인이 되었다."}, "practice": {"en": "The court appointed a guardian for the elderly man.", "ko": "법원은 그 노인에게 후견인을 선임했다."}}, "grammar": {"axis": "G4", "title": "guardian of / appoint a guardian for", "wrong": "She is a guardian to the child's property.", "right": "She is the guardian of the child. / The court appointed a guardian for him.", "note": "'누구의' 후견인은 of, 법원이 '누구를 위해' 선임하면 for."}, "collocations": ["appoint a guardian", "legal guardian", "guardian ad litem", "under guardianship"], "links": [{"label": "LII Wex — guardian", "url": "https://www.law.cornell.edu/wex/guardian"}, {"label": "LII Wex — guardianship", "url": "https://www.law.cornell.edu/wex/guardianship"}]}, {"id": "restraining-order", "hw": "restraining order · protective order", "ipa": "rɪˈstreɪ.nɪŋ ˈɔːr.dɚ · prəˈtek.tɪv ˈɔːr.dɚ", "stress": "re·**strain**·ing **or**·der · pro·**tec**·tive **or**·der", "stars": 2, "gloss": "접근금지명령 · 보호명령", "diff": "가정폭력 사건에서 법원이 가해자에게 피해자 근처에 가지 말라고 명하는 것입니다. 민사소송에서 protective order는 증거개시 자료를 보호하는 명령이라는 전혀 다른 뜻도 있어 문맥을 봐야 합니다.", "examples": {"easy": {"en": "She got a restraining order against him.", "ko": "그녀는 그를 상대로 접근금지명령을 받았다."}, "practice": {"en": "The judge issued a protective order requiring him to stay 500 feet away.", "ko": "판사는 그에게 500피트 이내로 접근하지 말라는 보호명령을 내렸다."}}, "grammar": {"axis": "G6", "title": "명령은 issue / get / violate", "wrong": "The judge made a restraining order.", "right": "The judge issued a restraining order. / He violated the order.", "note": "법원이 명령을 '내리다'는 issue 또는 grant, 신청인이 '받다'는 get·obtain, 어기는 것은 violate. 상대방은 against로 받습니다."}, "collocations": ["issue / obtain a restraining order", "against him", "violate a protective order", "temporary restraining order (TRO)"], "links": [{"label": "LII Wex — restraining order", "url": "https://www.law.cornell.edu/wex/restraining_order"}]}, {"id": "paternity", "hw": "paternity", "ipa": "pəˈtɝː.nə.t̬i", "stress": "pa·**ter**·ni·ty", "stars": 1, "gloss": "부성(父性), 친자관계 — 누가 아버지인가", "examples": {"easy": {"en": "A DNA test proved paternity.", "ko": "DNA 검사로 친자관계가 증명되었다."}, "practice": {"en": "The state filed a paternity action to collect child support.", "ko": "주 정부는 양육비를 받아 내려고 친자관계 확인 소송을 제기했다."}, "source": {"en": "Expedited administrative and judicial procedures (including the procedures specified in subsection (c)) for establishing paternity and for establishing, modifying, and enforcing support obligations.", "ko": "친자관계를 확정하고, 부양의무를 정하고 변경하고 집행하기 위한 신속한 행정·사법 절차(제(c)항의 절차를 포함한다)", "cite": "42 U.S.C. § 666(a)(2)", "url": "https://www.law.cornell.edu/uscode/text/42/666", "glossary": {"expedited": "신속한, 간이한", "establish paternity": "친자관계를 확정하다"}}}, "grammar": {"axis": "G6", "title": "paternity는 establish와 짝을 이룬다", "wrong": "They made paternity clear.", "right": "They established paternity.", "note": "친자관계를 '확정하다'는 establish. 부정하는 것은 disestablish 또는 contest paternity. maternity(모성)도 같은 짝을 씁니다."}, "collocations": ["establish paternity", "paternity test", "paternity action / suit", "acknowledgment of paternity (인지)"]}, {"id": "estate", "hw": "estate", "ipa": "ɪˈsteɪt", "stress": "es·**tate**", "stars": 3, "false_friend": true, "gloss": "(사망자의) 유산, 상속재산", "diff": "일상에서는 '넓은 사유지'를 떠올리고, real estate는 '부동산'입니다. 재산법에서 estate는 토지에 대한 권리의 종류를 뜻하기도 합니다(fee simple, life estate → 10장). 상속 문맥에서는 사망자가 남긴 재산과 빚 전체, 곧 상속재산입니다.", "examples": {"easy": {"en": "Her estate went to charity.", "ko": "그녀의 유산은 자선단체로 갔다."}, "practice": {"en": "The estate owes $40,000 in taxes, which must be paid before any distribution.", "ko": "상속재산에는 4만 달러의 세금 채무가 있고, 분배 전에 이를 먼저 내야 한다."}, "source": {"en": "the probate exception reserves to state probate courts the probate or annulment of a will and the administration of a decedent's estate", "ko": "검인 예외에 따라 유언의 검인이나 무효 선언, 그리고 사망자의 상속재산 관리는 주 검인법원의 몫으로 남는다", "cite": "Marshall v. Marshall, 547 U.S. 293 (2006)", "url": "https://www.law.cornell.edu/supct/html/04-1544.ZO.html", "glossary": {"decedent": "사망자(피상속인)", "annulment": "무효 선언", "administration": "(상속재산의) 관리·정리"}}}, "box": "Marshall 사건의 당사자는 애나 니콜 스미스라는 이름으로 알려진 비키 린 마셜과, 세상을 떠난 남편의 아들 피어스입니다. 연방대법원은 연방법원이 유언 검인과 상속재산 관리 자체만 할 수 없을 뿐, 상속을 둘러싼 다른 청구(이 사건에서는 증여를 방해했다는 불법행위 청구)는 판단할 수 있다고 했습니다.", "grammar": {"axis": "G1", "title": "특정인의 유산은 the / 소유격", "wrong": "Estate of the deceased was divided.", "right": "The estate was divided among the heirs. / his estate", "note": "특정 사망자의 유산은 이미 정해진 것이므로 the나 소유격을 붙입니다. 사건명에서는 Estate of Smith(스미스의 상속재산)처럼 관사 없이 씁니다."}, "collocations": ["administer an estate", "probate estate", "estate tax (상속세)", "estate planning (상속 설계)"], "links": [{"label": "LII Wex — estate", "url": "https://www.law.cornell.edu/wex/estate"}]}, {"id": "will", "hw": "will · testator", "ipa": "wɪl · ˈtes.teɪ.t̬ɚ", "stress": "**will** · **tes**·ta·tor", "stars": 3, "pron_tip": "Cambridge에 testator 표제어는 있으나 발음 표기가 없어, 보조 사전 Wiktionary의 미국식(GA) 표기 /ˈtɛˌsteɪ.tɚ/를 따라 첫 음절에 강세를 두었습니다. 둘째 음절에 강세를 두는 /tɛsˈteɪ.tɚ/도 같은 사전에 함께 실려 있습니다.", "false_friend": true, "gloss": "유언(장) · 유언자", "diff": "조동사 will(~할 것이다)과 같은 철자입니다. 명사로 a will, the will이면 유언장입니다. 유언의 방식(자필·증인 수 등)은 주마다 다릅니다.", "examples": {"easy": {"en": "She made a will last year.", "ko": "그녀는 작년에 유언장을 작성했다."}, "practice": {"en": "The testator signed the will in front of two witnesses.", "ko": "유언자는 증인 두 명 앞에서 유언장에 서명했다."}, "source": {"en": "The testator could then revive the old will or execute a new one.", "ko": "그러면 유언자는 옛 유언을 되살리거나 새 유언을 작성할 수 있었다.", "cite": "Sveen v. Melin, No. 16-1432 (U.S. June 11, 2018)", "url": "https://www.law.cornell.edu/supremecourt/text/16-1432", "glossary": {"execute": "(유언장·계약서를) 작성·서명하여 완성하다 — '처형하다'가 아니다", "revive": "되살리다"}}}, "box": "Sveen 사건은 이혼하면 전 배우자를 생명보험 수익자 지정에서 자동으로 지우는 미네소타주 법이 문제였습니다. 연방대법원은 이 법을 이혼 전에 맺은 보험계약에 적용해도 헌법상 계약 조항에 반하지 않는다고 판단했습니다.", "grammar": {"axis": "G1", "title": "die without a will — a를 빼지 않는다", "wrong": "He died without will.", "right": "He died without a will.", "note": "유언장은 셀 수 있는 명사라 하나도 없다고 말할 때도 a가 필요합니다. 처음 언급 a will, 그 유언장 the will."}, "collocations": ["make / write a will", "execute a will", "contest a will (유언의 효력을 다투다)", "last will and testament"], "pitfalls": ["execute a will을 '유언을 집행하다'로 옮기는 실수 — 작성(서명)하는 것입니다. 집행은 administer the e
