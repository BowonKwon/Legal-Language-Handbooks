보통 증인이 답하기 전에 하고, 답이 이미 나왔으면 바로 삭제를 신청합니다(motion to strike). 시기를 놓치면 그 증거에 대한 다툼을 상소심에서 주장하기 어려워집니다(Rule 103(a)). 한국 형사소송법 제296조의 증거조사에 대한 이의신청과 기능이 비슷하고, 한국도 이유를 간결하게 밝혀 즉시 해야 합니다(형사소송규칙 제137조). 다른 점은 형식입니다 — 미국 법정에서는 'Objection!'에 짧은 사유를 붙여 말합니다.", "examples": {"easy": {"en": "Objection, Your Honor!", "ko": "이의 있습니다, 재판장님!"}, "practice": {"en": "Objection, Your Honor. Calls for speculation.", "ko": "이의 있습니다, 재판장님. 추측을 구하는 질문입니다."}, "source": {"en": "timely objects or moves to strike; and (B) states the specific ground, unless it was apparent from the context", "ko": "(A) 적시에 이의하거나 (증언의) 삭제를 신청하고, (B) 문맥상 명백하지 않은 한 구체적 사유를 밝힌 경우", "cite": "Fed. R. Evid. 103(a)(1) — 상소심에서 증거 채택의 잘못을 다투기 위한 요건", "url": "https://www.law.cornell.edu/rules/fre/rule_103", "glossary": {"timely": "적시에, 늦지 않게", "move to strike": "(이미 나온 답변을) 기록에서 삭제해 달라고 신청하다", "ground": "사유, 근거"}}}, "box": "실제 법정에서는 Objection 뒤에 사유를 한두 단어로만 붙입니다. 'Objection, hearsay.' 'Objection, leading.' 'Objection, relevance.' 'Objection, calls for speculation.' 판사는 대개 그 자리에서 sustained나 overruled 한마디로 답합니다(→ 다음 항목).", "grammar": {"axis": "G4", "title": "object to + 명사 / -ing", "wrong": "I object the question. / We object to admit the letter.", "right": "I object to the question. / We object to admitting the letter.", "note": "object는 to와 짝입니다. 여기서 to는 전치사라 뒤에 동사원형이 아니라 명사나 -ing가 옵니다. 명사도 objection to the question."}, "collocations": ["Objection, hearsay.", "Objection, leading.", "Objection, relevance.", "Objection, calls for speculation.", "Objection, asked and answered. (이미 답한 질문)", "Objection, argumentative. (논쟁적 질문)", "Objection, lack of foundation. (기초 사실 부족)", "raise / make an objection", "withdraw an objection"], "links": [{"label": "LII Wex — objection", "url": "https://www.law.cornell.edu/wex/objection"}]}, {"id": "sustained-overruled", "hw": "sustained · overruled", "ipa": "səˈsteɪnd · ˌoʊ.vɚˈruːld", "stress": "sus·**tained** · o·ver·**ruled**", "stars": 3, "gloss": "(이의를) 받아들입니다 · (이의를) 받아들이지 않습니다", "diff": "판사가 이의에 답하는 두 마디입니다. sustained면 질문을 거두거나 바꿔야 하고 증인은 답하지 않습니다. overruled면 증인이 답합니다. 상소심이 선례를 폐기할 때도 overrule을 쓰므로(→ 15장) 문맥으로 구별합니다.", "examples": {"easy": {"en": "Objection sustained.", "ko": "이의를 받아들입니다."}, "practice": {"en": "\"Objection, hearsay.\" \"Overruled. The witness may answer.\"", "ko": "\"이의 있습니다, 전문증거입니다.\" \"이의를 기각합니다. 증인은 답하십시오.\""}, "source": {"en": "The trial court overruled the objection, relying on the presumption of possession created by the New York statute.", "ko": "1심 법원은 뉴욕주 법률이 정한 소지 추정에 근거하여 그 이의를 받아들이지 않았다.", "cite": "County Court of Ulster County v. Allen, 442 U.S. 140 (1979)", "url": "https://www.law.cornell.edu/supremecourt/text/442/140", "glossary": {"presumption": "추정", "possession": "소지"}}}, "box": "sustain의 기본 뜻은 '떠받치다'입니다. 이의를 떠받치면 인용(sustained), 이의를 넘어서 다스리면(over-rule) 기각(overruled). 판사가 화면에서 이 두 말만 반복하는 장면이 많아, 법정 드라마를 볼 때 가장 먼저 귀에 들어오는 말이기도 합니다.", "pitfalls": ["sustained를 '유지되었다'로 옮겨 원심 판결이 유지된 것으로 오해하기 — 증인신문 중이라면 '이의 인용'", "overruled를 '파기'로 옮기기 — 이의 장면에서는 '이의 기각'"], "grammar": {"axis": "G7", "title": "판사의 한 마디는 과거분사", "wrong": "Sustain! / Objection is sustain.", "right": "Sustained. / The objection is sustained.", "note": "'(그 이의는) 받아들여졌다'는 수동의 뜻이라 과거분사 sustained, overruled를 씁니다. 판결문에서는 능동으로 The court overruled the objection."}, "collocations": ["Objection sustained.", "Objection overruled.", "sustain / overrule an objection", "The witness may answer.", "The jury will disregard the answer. (배심원은 그 답변을 고려하지 마십시오)"], "links": [{"label": "LII Wex — sustain", "url": "https://www.law.cornell.edu/wex/sustain"}, {"label": "LII Wex — overrule", "url": "https://www.law.cornell.edu/wex/overrule"}]}, {"id": "hearsay", "hw": "hearsay", "ipa": "ˈhɪr.seɪ", "stress": "**hear**·say", "stars": 3, "gloss": "전문증거(법정 밖에서 한 말을 그 내용이 참이라는 증거로 쓰는 것)", "diff": "'들은 말(hear + say)'이라는 이름과 달리, 핵심은 '법정 밖 진술을 그 내용의 진실을 증명하려고 쓰는가'입니다. 미국은 Rule 802로 원칙적으로 막고 803·804·807에 많은 예외를 둡니다. 한국 형사소송법 제310조의2도 같은 구조입니다(→ 「한국이라면?」).", "examples": {"easy": {"en": "That's hearsay, Your Honor.", "ko": "그건 전문증거입니다, 재판장님."}, "practice": {"en": "The witness can't tell us what her brother told her. That's hearsay.", "ko": "증인은 오빠가 자기에게 한 말을 여기서 전할 수 없습니다. 그건 전문증거입니다."}, "source": {"en": "\"Hearsay\" means a statement that: (1) the declarant does not make while testifying at the current trial or hearing; and (2) a party offers in evidence to prove the truth of the matter asserted in the statement.", "ko": "'전문증거'란 다음에 해당하는 진술을 말한다. (1) 진술자가 현재의 재판이나 심리에서 증언하면서 한 것이 아니고, (2) 당사자가 그 진술에서 주장된 사항이 진실임을 증명하기 위하여 증거로 제출하는 것.", "cite": "Fed. R. Evid. 801(c)", "url": "https://www.law.cornell.edu/rules/fre/rule_801", "glossary": {"declarant": "원진술자", "the truth of the matter asserted": "진술된 내용의 진실성"}}}, "box": "같은 말이라도 쓰는 목적이 다르면 전문증거가 아닙니다. 누군가 '불이야!'라고 외쳤다는 증언을 '실제로 불이 났다'는 증명에 쓰면 전문증거지만, '피고인이 그 외침을 듣고 위험을 알았다'는 증명에 쓰면 전문증거가 아닙니다.", "grammar": {"axis": "G3", "title": "hearsay도 셀 수 없다", "wrong": "That is a hearsay. / two hearsays", "right": "That is hearsay. / two hearsay statements", "note": "evidence처럼 불가산입니다. 낱개로 셀 때는 a hearsay statement처럼 셀 수 있는 명사 앞에 형용사로 씁니다."}, "collocations": ["Objection, hearsay.", "hearsay exception (전문법칙의 예외)", "double hearsay (재전문)", "the rule against hearsay"], "links": [{"label": "LII Wex — hearsay", "url": "https://www.law.cornell.edu/wex/hearsay"}]}, {"id": "relevant", "hw": "relevant · relevance", "ipa": "ˈrel.ə.vənt · ˈrel.ə.vəns", "stress": "**rel**·e·vant · **rel**·e·vance", "stars": 2, "gloss": "관련성 있는 · 관련성", "pron_tip": "강세는 첫 음절 rel-입니다. 반대말 irrelevant는 둘째 음절 -rel-에 강세가 옵니다.", "examples": {"easy": {"en": "His past is not relevant.", "ko": "그의 과거는 관련이 없다."}, "practice": {"en": "Objection, relevance. The weather last year has nothing to do with this accident.", "ko": "이의 있습니다, 관련성 없습니다. 작년 날씨는 이 사고와 아무 관계가 없습니다."}, "source": {"en": "The court may exclude relevant evidence if its probative value is substantially outweighed by a danger of one or more of the following: unfair prejudice", "ko": "법원은 관련성 있는 증거라도 그 증명력이 다음 중 하나 이상의 위험보다 현저히 작으면 배제할 수 있다. 부당한 편견 …", "cite": "Fed. R. Evid. 403", "url": "https://www.law.cornell.edu/rules/fre/rule_403", "glossary": {"probative value": "증명력", "substantially outweighed": "(저울질해서) 현저히 압도되는", "unfair prejudice": "부당한 편견(유죄 쪽으로 감정이 쏠리게 하는 것)"}}}, "box": "관련성(Rule 401)은 문턱이 낮습니다. 대신 Rule 403이 거름망 역할을 합니다. 끔찍한 사진처럼 관련은 있어도 배심원의 감정만 흔드는 증거는 여기서 걸러집니다. 변호사들은 이것을 그냥 '403 objection'이라고 부릅니다.", "grammar": {"axis": "G4", "title": "relevant to — 무엇에 관련되는가", "wrong": "This is relevant with the case.", "right": "This is relevant to the case.", "note": "relevant는 to와 짝입니다. 명사도 the relevance of this evidence to the claim."}, "collocations": ["relevant to the issue", "Objection, relevance.", "irrelevant (관련 없는)", "probative value (증명력)"], "links": [{"label": "LII Wex — relevant evidence", "url": "https://www.law.cornell.edu/wex/relevant_evidence"}]}, {"id": "admissible", "hw": "admissible · inadmissible", "ipa": "ədˈmɪs.ə.bəl · ˌɪn.ədˈmɪs.ə.bəl", "stress": "ad·**mis**·si·ble · in·ad·**mis**·si·ble", "stars": 3, "gloss": "증거능력 있는 · 증거능력 없는", "diff": "한국 형사소송법의 '증거능력'과 가장 가까운 말입니다. 다만 미국에서는 배심원에게 보여 줄 수 있는가의 문제라서, 증거능력과 증명력의 구별이 한국보다 더 날카롭게 법정 운영에 드러납니다.", "examples": {"easy": {"en": "The letter is inadmissible.", "ko": "그 편지는 증거능력이 없다."}, "practice": {"en": "The judge let the video in but kept the police report out.", "ko": "판사는 동영상은 증거로 받아들였지만 경찰 보고서는 받아들이지 않았다."}, "source": {"en": "Relevant evidence is admissible unless any of the following provides otherwise: the United States Constitution; a federal statute; these rules; or other rules prescribed by the Supreme Court. Irrelevant evidence is not admissible.", "ko": "관련성 있는 증거는 미국 헌법, 연방 법률, 이 규칙 또는 연방대법원이 정한 다른 규칙에 달리 정함이 없는 한 증거능력이 있다. 관련성 없는 증거는 증거능력이 없다.", "cite": "Fed. R. Evid. 402", "url": "https://www.law.cornell.edu/rules/fre/rule_402", "glossary": {"prescribe": "(규칙으로) 정하다"}}}, "grammar": {"axis": "G5", "title": "let in / keep out — 채택과 배제의 구어", "wrong": "The judge let the video enter.", "right": "The judge let the video in. / The judge kept the report out.", "note": "기사나 회화에서는 admit / exclude 대신 let in, keep out을 자주 씁니다. come in(증거로 들어오다)도 같은 계열: The document comes in."}, "collocations": ["admissible evidence", "admit into evidence", "exclude evidence", "let in / keep out", "rule on admissibility (증거능력을 판단하다)"], "links": [{"label": "LII Wex — admissible evidence", "url": "https://www.law.cornell.edu/wex/admissible_evidence"}]}, {"id": "burden-of-proof", "hw": "burden of proof", "ipa": "ˈbɝː.dən əv ˈpruːf", "stress": "**bur**·den of **proof**", "stars": 3, "gloss": "증명책임", "diff": "미국에서는 이것을 둘로 나눕니다. 증거를 내놓을 책임(burden of production)과 사실인정자를 설득할 책임(burden of persuasion)입니다. 한국의 '주관적 증명책임'과 '객관적 증명책임' 구별과 비슷하지만 용어와 운용이 꼭 같지는 않습니다.", "examples": {"easy": {"en": "The burden is on the plaintiff.", "ko": "증명책임은 원고에게 있다."}, "practice": {"en": "In a criminal case, the government bears the burden of proof from start to finish.", "ko": "형사사건에서는 처음부터 끝까지 검사(정부) 측이 증명책임을 진다."}, "source": {"en": "But this rule does not shift the burden of persuasion, which remains on the party who had it originally.", "ko": "그러나 이 규칙은 설득책임을 옮기지 않으며, 설득책임은 원래 그것을 진 당사자에게 그대로 남는다.", "cite": "Fed. R. Evid. 301 — 민사사건의 추정", "url": "https://www.law.cornell.edu/rules/fre/rule_301", "glossary": {"shift": "옮기다, 전환하다", "burden of persuasion": "설득책임(객관적 증명책임에 가깝다)"}}}, "grammar": {"axis": "G1", "title": "the burden of proof — 정관사와 함께", "wrong": "Plaintiff has burden of proof.", "right": "The plaintiff has the burden of proof.", "note": "사건마다 하나로 정해진 책임이므로 the를 붙입니다. 누구에게 있는지는 on: The burden is on the prosecution."}, "collocations": ["bear / carry the burden of proof", "meet the burden (증명책임을 다하다)", "shift the burden (책임을 전환하다)", "burden of production / persuasion"], "links": [{"label": "LII Wex — burden of proof", "url": "https://www.law.cornell.edu/wex/burden_of_proof"}]}, {"id": "preponderance", "hw": "preponderance of the evidence", "ipa": "prɪˈpɑːn.dɚ.əns əv ðə ˈev.ə.dəns", "stress": "pre·**pon**·der·ance of the **ev**·i·dence", "stars": 2, "gloss": "증거의 우월(민사의 증명 기준 — 그럴 가능성이 더 높음)", "pron_tip": "강세는 둘째 음절 -pon-. 네 음절(pre·pon·der·ance)이고 pon 하나만 세게 읽으면 됩니다.", "diff": "'50%를 넘는다(more likely than not)'로 흔히 설명됩니다. 한국 판례가 민사 증명도로 말하는 '고도의 개연성'과는 표현부터 다르므로, 둘을 같은 기준이라고 단정해 옮기지 않습니다.", "examples": {"easy": {"en": "It is more likely than not.", "ko": "그럴 가능성이 그렇지 않을 가능성보다 크다."}, "practice": {"en": "The plaintiff must prove each element by a preponderance of the evidence.", "ko": "원고는 각 요건을 증거의 우월로 증명해야 한다."}, "source": {"en": "Since society has a minimal concern with the outcome of such private suits, plaintiff's burden of proof is a mere preponderance of the evidence.", "ko": "사회는 그러한 사인 간 소송의 결과에 최소한의 관심만 가지므로, 원고의 증명책임은 단순한 증거의 우월에 그친다.", "cite": "Addington v. Texas, 441 U.S. 418 (1979)", "url": "https://www.law.cornell.edu/supremecourt/text/441/418", "glossary": {"minimal concern": "최소한의 관심", "mere": "단순한, ~에 불과한"}}}, "grammar": {"axis": "G4", "title": "by a preponderance of the evidence", "wrong": "prove with preponderance of evidence", "right": "prove by a preponderance of the evidence", "note": "증명 기준 앞에는 by를 씁니다. 관용적으로 a preponderance, the evidence로 관사가 둘 다 붙습니다. prove beyond a reasonable doubt(→ 7장)와 짝으로 외우세요."}, "collocations": ["by a preponderance of the evidence", "more likely than not", "standard of proof (증명 기준)"], "links": [{"label": "LII Wex — preponderance of the evidence", "url": "https://www.law.cornell.edu/wex/preponderance_of_the_evidence"}]}, {"id": "clear-and-convincing", "hw": "clear and convincing evidence", "ipa": "klɪr ən kənˈvɪn.sɪŋ ˈev.ə.dəns", "stress": "**clear** and con·**vinc**·ing **ev**·i·dence", "stars": 1, "gloss": "명백하고 설득력 있는 증거(민사의 높은 증명 기준)", "diff": "민사의 '증거의 우월'과 형사의 '합리적 의심의 여지 없는 증명' 사이에 있는 중간 기준입니다. 강제입원, 친권 상실, 사기 주장처럼 걸린 이익이 큰 민사 쟁점에 씁니다.", "examples": {"easy": {"en": "This standard is higher.", "ko": "이 기준이 더 높다."}, "practice": {"en": "Fraud must be shown by clear and convincing evidence in many states.", "ko": "여러 주에서 사기는 명백하고 설득력 있는 증거로 증명해야 한다."}, "source": {"en": "The intermediate standard, which usually employs some combination of the words \"clear,\" \"cogent,\" \"unequivocal,\" and \"convincing,\" is less commonly used", "ko": "중간 기준은 보통 '명백한', '유력한', '모호하지 않은', '설득력 있는'이라는 말을 섞어 쓰며, 덜 자주 쓰인다", "cite": "Addington v. Texas, 441 U.S. 418 (1979)", "url": "https://www.law.cornell.edu/supremecourt/text/441/418", "glossary": {"intermediate": "중간의", "cogent": "유력한, 설득력 있는", "unequivocal": "모호하지 않은"}}}, "box": "Addington 판결은 세 기준을 한 문단에 나란히 세웁니다. 민사 일반은 증거의 우월, 형사는 합리적 의심, 그 사이가 이 중간 기준입니다. 그리고 정신병원 강제입원에는 중간 기준이 필요하다고 판단했습니다.", "grammar": {"axis": "G3", "title": "기준 이름에도 evidence는 불가산", "wrong": "a clear and convincing evidence", "right": "clear and convincing evidence / by clear and convincing evidence", "note": "형용사가 붙어도 evidence는 여전히 셀 수 없습니다. a를 붙이지 않습니다."}, "collocations": ["by clear and convincing evidence", "heightened standard of proof (가중된 증명 기준)"], "links": [{"label": "LII Wex — clear and convincing evidence", "url": "https://www.law.cornell.edu/wex/clear_and_convincing_evidence"}]}, {"id": "expert-witness", "hw": "expert witness", "ipa": "ˌek.spɝːt ˈwɪt.nəs", "stress": "ex·pert **wit**·ness", "stars": 2, "gloss": "전문가 증인, 감정증인", "diff": "한국 민사소송의 감정인은 대개 법원이 지정하지만, 미국의 expert witness는 보통 각 당사자가 고르고 보수를 줍니다. 그래서 반대신문에서 '얼마를 받았느냐'는 질문이 단골로 나옵니다.", "examples": {"easy": {"en": "Both sides hired experts.", "ko": "양측 모두 전문가를 고용했다."}, "practice": {"en": "One of the experts admitted that she had never examined the machine.", "ko": "전문가 중 한 명은 그 기계를 직접 살펴본 적이 없다고 인정했다."}, "source": {"en": "A witness who is qualified as an expert by knowledge, skill, experience, training, or education may testify in the form of an opinion or otherwise if the proponent demonstrates to the court that it is more likely than not that", "ko": "지식, 기술, 경험, 훈련 또는 교육에 의하여 전문가의 자격을 갖춘 증인은, 그 증인을 신청한 당사자가 다음 요건이 충족될 가능성이 그렇지 않을 가능성보다 높다는 점을 법원에 증명하는 경우에, 의견의 형태 등으로 증언할 수 있다 …", "cite": "Fed. R. Evid. 702", "url": "https://www.law.cornell.edu/rules/fre/rule_702", "glossary": {"qualified as an expert": "전문가로 인정된", "in the form of an opinion": "의견의 형태로"}}}, "box": "일반 증인은 직접 아는 사항에 관해 증언하고(Rule 602), 의견을 말하더라도 자기 지각에 기초하고 증언 이해나 쟁점 판단에 도움이 되며 전문지식에 기대지 않는 의견이어야 합니다(Rule 701). 전문가는 전문지식에 기초한 의견을 말할 수 있습니다. 그 대신 Rule 702는 (a) 전문지식이 사실인정에 도움이 될 것, (b) 충분한 사실·자료, (c) 믿을 만한 원리·방법, (d) 그 방법을 사건에 믿을 만하게 적용했을 것을 요구하고, 판사가 문지기(gatekeeper)가 되어 이를 먼저 거릅니다. 자격(qualified)과 신뢰성 심사는 별개의 관문입니다. 이 문지기 역할을 정한 판결이 Daubert(1993)입니다.", "grammar": {"axis": "G2", "title": "one of the experts — 뒤는 복수, 동사는 단수", "wrong": "One of the expert were wrong.", "right": "One of the experts was wrong.", "note": "one of 뒤 명사는 복수(experts), 주어는 one이므로 동사는 단수(was). 3장 party에서 본 규칙의 반복입니다."}, "collocations": ["qualify as an expert", "expert testimony", "expert report (감정서)", "retain an expert (전문가를 선임하다)"], "links": [{"label": "LII Wex — expert witness", "url": "https://www.law.cornell.edu/wex/expert_witness"}]}, {"id": "privilege", "hw": "privilege", "ipa": "ˈprɪv.əl.ɪdʒ", "stress": "**priv**·i·lege", "stars": 2, "false_friend": true, "gloss": "(증언·증거 제출) 거부특권", "pron_tip": "가운데 i는 거의 들리지 않아 /ˈprɪv.əl.ɪdʒ/ 세 음절입니다. 끝은 '리지'가 아니라 /lɪdʒ/.", "diff": "일상어로는 '특권·특혜'입니다. 증거법에서는 진실을 밝히는 데 도움이 되더라도 다른 가치(신뢰 관계, 사생활)를 위해 증언이나 자료 제출을 거부할 수 있는 권리를 말합니다. 연방법원에서는 원칙적으로 조문보다 판례(common law)가 그 범위를 정합니다. 다만 민사사건에서 주법이 판단 규범을 정하는 청구·항변에는 주법상 특권이 적용됩니다(Rule 501 단서).", "examples": {"easy": {"en": "She claimed privilege.", "ko": "그녀는 증언거부특권을 주장했다."}, "practice": {"en": "The doctor refused to answer, asserting the physician-patient privilege under state law.", "ko": "의사는 주법상의 의사-환자 특권을 내세워 답변을 거부했다."}, "source": {"en": "The common law — as interpreted by United States courts in the light of reason and experience — governs a claim of privilege … But in a civil case, state law governs privilege regarding a claim or defense for which state law supplies the rule of decision.", "ko": "특권의 주장은 미국 법원이 이성과 경험에 비추어 해석한 보통법이 규율한다 … 그러나 민사사건에서 주법이 판단 규범을 제공하는 청구나 항변에 관한 특권은 주법이 규율한다.", "cite": "Fed. R. Evid. 501", "url": "https://www.law.cornell.edu/rules/fre/rule_501", "glossary": {"in the light of": "~에 비추어", "governs": "규율하다"}}}, "grammar": {"axis": "G6", "title": "assert / invoke / waive a privilege", "wrong": "He used his privilege and didn't answer.", "right": "He invoked the privilege and refused to answer.", "note": "특권은 '주장하다' assert·invoke·claim, '포기하다' waive와 짝을 이룹니다. use를 쓰면 법률 문장으로 어색합니다."}, "collocations": ["assert / invoke a privilege", "waive a privilege (특권을 포기하다)", "privileged communication", "privilege log (특권 대상 목록)", "spousal privilege (배우자 특권)"], "links": [{"label": "LII Wex — privilege", "url": "https://www.law.cornell.edu/wex/privilege"}]}, {"id": "attorney-client-privilege", "hw": "attorney-client privilege", "ipa": "əˈtɝː.ni ˈklaɪ.ənt ˈprɪv.əl.ɪdʒ", "stress": "at·**tor**·ney-**cli**·ent **priv**·i·lege", "stars": 2, "gloss": "변호사-의뢰인 특권(변호사와 의뢰인의 비밀 대화를 공개하지 않을 권리)", "diff": "보호받는 것은 법률 자문을 위한 비밀 대화입니다. 자문에 꼭 필요한 사람(통역인 등)이 아닌 제3자가 함께 있었거나, 범죄·사기를 저지르려는 상담이었다면 보호받지 못합니다. 법률과 무관한 순수한 경영 자문도 보호 대상이 아닙니다. 소송 준비 자료를 보호하는 work-product protection과는 별개의 제도입니다.", "examples": {"easy": {"en": "Those e-mails are privileged.", "ko": "그 이메일들은 특권 대상이다."}, "practice": {"en": "Confidential communications in which the CEO sought legal advice from the company's lawyers are protected by the attorney-client privilege.", "ko": "CEO가 회사 변호사들에게 법률 자문을 구한 비밀 대화는 변호사-의뢰인 특권으로 보호된다."}, "source": {"en": "\"attorney-client privilege\" means the protection that applicable law provides for confidential attorney-client communications", "ko": "'변호사-의뢰인 특권'이란 적용 법률이 변호사와 의뢰인 사이의 비밀 의사소통에 부여하는 보호를 말한다", "cite": "Fed. R. Evid. 502(g)(1)", "url": "https://www.law.cornell.edu/rules/fre/rule_502", "glossary": {"confidential": "비밀의", "communications": "의사소통(대화·서신·이메일 등)"}}}, "grammar": {"axis": "G2", "title": "communications — 대화들은 복수", "wrong": "confidential communication between attorney and clients", "right": "confidential communications between attorneys and clients", "note": "여러 차례의 대화·서신을 묶어 말할 때는 communications(복수)가 표준입니다. 일반론으로 말할 때는 attorneys and clients처럼 둘 다 복수."}, "collocations": ["protected by the attorney-client privilege", "waive the privilege", "privileged and confidential (이메일 머리말 문구)", "work product (소송 준비 자료)"], "links": [{"label": "LII Wex — attorney-client privilege", "url": "https://www.law.cornell.edu/wex/attorney-client_privilege"}]}, {"id": "perjury", "hw": "perjury", "ipa": "ˈpɝː.dʒɚ.i", "stress": "**per**·ju·ry", "stars": 2, "gloss": "위증(죄)", "diff": "미국 연방법상 위증은 법정 증언에 한정되지 않습니다. 선서 진술서(affidavit)나 '위증의 벌을 감수한다(under penalty of perjury)'고 서명한 서면에 거짓을 적어도 성립합니다. 한국 형법의 위증죄(법률에 의하여 선서한 증인의 허위 진술)보다 범위가 넓습니다.", "examples": {"easy": {"en": "Knowingly lying under oath about an important fact is perjury.", "ko": "선서하고 중요한 사실에 관해 일부러 거짓말하는 것은 위증이다."}, "practice": {"en": "The witness was later charged with perjury for lying about the meeting.", "ko": "그 증인은 회의에 관해 거짓말한 일로 나중에 위증 혐의로 기소되었다."}, "source": {"en": "is guilty of perjury and shall, except as otherwise expressly provided by law, be fined under this title or imprisoned not more than five years, or both.", "ko": "위증죄를 범한 것이며, 법률에 달리 명시한 경우를 제외하고 이 편에 따른 벌금 또는 5년 이하의 징역에 처하거나 이를 병과한다.", "cite": "18 U.S.C. § 1621", "url": "https://www.law.cornell.edu/uscode/text/18/1621", "glossary": {"be fined": "벌금형에 처해지다", "not more than five years": "5년 이하(→ 3장 no more than)"}}}, "grammar": {"axis": "G6", "title": "commit perjury", "wrong": "He did perjury. / He made a perjury.", "right": "He committed perjury.", "note": "범죄는 commit과 짝입니다(commit fraud, commit a crime). perjury는 불가산이라 a도 붙이지 않습니다."}, "collocations": ["commit perjury", "under penalty of perjury (위증의 벌을 감수하고)", "be charged with perjury", "suborn perjury (위증을 교사하다)"], "links": [{"label": "LII Wex — perjury", "url": "https://www.law.cornell.edu/wex/perjury"}]}, {"id": "impeach", "hw": "impeach · impeachment", "ipa": "ɪmˈpiːtʃ · ɪmˈpiːtʃ.mənt", "stress": "im·**peach** · im·**peach**·ment", "stars": 2, "false_friend": true, "gloss": "(증인의) 신빙성을 탄핵하다 · 신빙성 탄핵", "diff": "뉴스에서는 대통령 탄핵으로 익숙하지만, 법정에서 impeach the witness는 '증인의 말을 믿기 어렵게 만들다'입니다. 앞뒤가 다른 진술, 편견, 시력 같은 지각 능력의 한계를 보여 주는 것이 전형적인 방법입니다. 한국 형사소송법의 탄핵증거(제318조의2)와 같은 계열의 말입니다.", "examples": {"easy": {"en": "The lawyer impeached the witness.", "ko": "변호사는 증인의 신빙성을 탄핵했다."}, "practice": {"en": "The witness was impeached with a prior inconsistent statement from her deposition.", "ko": "증인은 증언녹취 때 했던, 지금과 다른 진술로 신빙성이 탄핵되었다."}, "source": {"en": "Any party, including the party that called the witness, may attack the witness's credibility.", "ko": "증인을 신청한 당사자를 포함하여 어느 당사자든 그 증인의 신빙성을 공격할 수 있다.", "cite": "Fed. R. Evid. 607", "url": "https://www.law.cornell.edu/rules/fre/rule_607", "glossary": {"attack": "(신빙성을) 공격하다 — impeach의 쉬운 말", "the party that called the witness": "그 증인을 신청한 당사자"}}}, "box": "Rule 607의 제목은 'Who May Impeach a Witness'입니다. 예전 보통법은 자기가 부른 증인을 스스로 탄핵하지 못하게 했는데, 이 조문이 그 제한을 없앴습니다.", "grammar": {"axis": "G7", "title": "be impeached with — 수동태로 자주 쓴다", "wrong": "The witness impeached by his own letter.", "right": "The witness was impeached with his own letter.", "note": "신빙성이 '깎인' 쪽은 증인이므로 was impeached. 무엇으로 탄핵했는지는 with(또는 by)로 잇습니다."}, "collocations": ["impeach a witness", "prior inconsistent statement (앞서 한 모순된 진술)", "impeachment evidence (탄핵증거)", "rehabilitate a witness (신빙성을 회복시키다)"], "links": [{"label": "LII Wex — impeach", "url": "https://www.law.cornell.edu/wex/impeach"}]}, {"id": "credibility", "hw": "credibility · credible", "ipa": "ˌkred.əˈbɪl.ə.t̬i · ˈkred.ə.bəl", "stress": "cred·i·**bil**·i·ty · **cred**·i·ble", "stars": 2, "gloss": "신빙성 · 믿을 만한", "pron_tip": "명사는 강세가 셋째 음절 -bil-로 옮겨 갑니다. 형용사 credible은 첫 음절 cred-.", "diff": "미국 배심재판에서 증인의 신빙성에 관한 최종 판단은 배심원 몫입니다. 판사는 보통 배심원 설시(jury instructions)로 판단 기준을 설명합니다. 연방 판사는 증거에 관한 의견을 말할 수도 있지만, 사실 판단은 모두 배심원에게 맡겨져 있음을 분명히 해야 한다는 한계가 있습니다(Quercia v. United States, 1933).", "examples": {"easy": {"en": "The jury found her credible.", "ko": "배심원은 그녀가 믿을 만하다고 보았다."}, "practice": {"en": "Phone records backed up his testimony and boosted his credibility.", "ko": "통화 기록이 그의 증언을 뒷받침해 신빙성을 높였다."}, "source": {"en": "A witness's credibility may be attacked or supported by testimony about the witness's reputation for having a character for truthfulness or untruthfulness, or by testimony in the form of an opinion about that character. But evidence of truthful character is admissible only after the witness's character for truthfulness has been attacked.", "ko": "증인의 신빙성은 그 증인이 진실한 성품인지 아닌지에 관한 평판을 내용으로 하는 증언이나 그 성품에 관한 의견 형태의 증언으로 공격하거나 뒷받침할 수 있다. 다만 진실한 성품에 관한 증거는 그 증인의 진실성에 관한 성품이 공격받은 뒤에만 증거능력이 있다.", "cite": "Fed. R. Evid. 608(a)", "url": "https://www.law.cornell.edu/rules/fre/rule_608", "glossary": {"reputation": "평판", "character for truthfulness": "진실성에 관한 성품"}}}, "grammar": {"axis": "G5", "title": "back up — 뒷받침하다", "wrong": "The records backed up it.", "right": "The records backed it up. / The records backed up his testimony. / The records backed his testimony up.", "note": "주장·증언을 '뒷받침하다'는 구동사 back up이 가장 흔합니다(back 혼자도 '지지하다'로 쓰입니다). 목적어가 명사면 앞뒤 어디든 되지만, 대명사면 반드시 가운데: back it up. 격식체로는 corroborate."}, "collocations": ["back up a claim", "attack / support credibility", "credibility of a witness", "corroborate (보강하다)", "credibility contest (진술 대 진술 사건)"], "links": [{"label": "LII Wex — credibility", "url": "https://www.law.cornell.edu/wex/credibility"}]}, {"id": "stipulate", "hw": "stipulate · stipulation", "ipa": "ˈstɪp.jə.leɪt · ˌstɪp.jəˈleɪ.ʃən", "stress": "**stip**·u·late · stip·u·**la**·tion", "stars": 1, "gloss": "(사실을) 다툼 없는 것으로 합의하다 · 그 합의", "diff": "양쪽이 증명 없이 인정하기로 합의한 사실입니다. 한국의 '다툼 없는 사실'이나 자백과 기능이 비슷하지만, 미국에서는 양쪽 변호사가 서면이나 법정 발언으로 명시적으로 합의한다는 점이 다릅니다.", "examples": {"easy": {"en": "Both sides stipulated to the date.", "ko": "양측은 날짜를 다투지 않기로 합의했다."}, "practice": {"en": "The parties stipulate that the contract was signed on May 1.", "ko": "당사자들은 계약이 5월 1일에 서명되었다는 사실을 다투지 않기로 합의한다."}, "source": {"en": "The Assistant United States Attorney refused to join in a stipulation, insisting on his right to prove his case his own way", "ko": "연방 검사보는 자기 방식대로 사건을 증명할 권리를 내세우며 사실 합의에 응하기를 거부했다", "cite": "Old Chief v. United States, 519 U.S. 172 (1997)", "url": "https://www.law.cornell.edu/supct/html/95-6556.ZO.html", "glossary": {"Assistant United States Attorney": "연방 검사보", "join in": "~에 동참하다"}}}, "box": "Old Chief 사건에서 피고인은 '전과가 있다'는 사실만 인정하겠다고 했고, 검사는 전과의 구체적 내용을 배심원에게 보이겠다고 맞섰습니다. 연방대법원은 Rule 403에 비추어 이 경우 피고인의 인정 제안을 받아들였어야 한다고 판단했습니다.", "grammar": {"axis": "G4", "title": "stipulate to + 명사 / stipulate that + 절", "wrong": "They stipulated the date to.", "right": "They stipulated to the date. / They stipulated that the date was May 1.", "note": "명사가 오면 to를 붙이는 쓰임이 미국 법정에서 흔하고, 문장이 오면 that절. 계약서의 stipulate는 '명시적으로 정하다'(The contract stipulates that ...)."}, "collocations": ["stipulate to a fact", "enter into a stipulation", "stipulated facts", "stipulated judgment (합의에 따른 판결)"], "links": [{"label": "LII Wex — stipulation", "url": "https://www.law.cornell.edu/wex/stipulation"}]}, {"id": "chain-of-custody", "hw": "chain of custody", "ipa": "tʃeɪn əv ˈkʌs.tə.di", "stress": "**chain** of **cus**·to·dy", "stars": 1, "gloss": "증거 보관 연속성(증거물이 누구 손을 거쳐 왔는지의 기록)", "diff": "압수부터 법정 제출까지 증거물을 누가, 언제, 어떻게 보관했는지가 끊김 없이 기록되어야 '그 물건이 바로 그 물건'이라고 말할 수 있습니다. 한국 실무의 디지털 증거 '동일성·무결성' 논의와 겹치는 개념입니다. custody 자체의 뜻(구금·양육권)은 6장에서 다룹니다.", "examples": {"easy": {"en": "The chain of custody was broken.", "ko": "증거 보관의 연속성이 끊겼다."}, "practice": {"en": "The officer handed the bag over to the lab and signed the custody log.", "ko": "경찰관은 봉투를 감정실에 넘기고 보관 기록부에 서명했다."}}, "grammar": {"axis": "G5", "title": "hand over — 넘겨주다", "wrong": "He handed the evidence to over the lab.", "right": "He handed the evidence over to the lab. / He handed over the evidence.", "note": "목적어가 명사면 hand over the bag, hand the bag over 둘 다 됩니다. 대명사면 반드시 가운데: hand it over."}, "collocations": ["break the chain of custody", "establish the chain of custody", "custody log (보관 기록부)", "tamper with evidence (증거를 조작하다)"]}, {"id": "no-further-questions", "hw": "No further questions.", "ipa": "noʊ ˈfɝː.ðɚ ˈkwes.tʃənz", "stress": "no **fur**·ther **ques**·tions", "stars": 2, "gloss": "더 이상 질문 없습니다(신문을 마치겠습니다)", "diff": "신문을 끝내는 정해진 말입니다. 보통 'No further questions, Your Honor.'라고 판사를 향해 말하고, 판사는 상대방에게 'Cross-examination?'이나 'Any redirect?'로 차례를 넘깁니다.", "examples": {"easy": {"en": "No further questions, Your Honor.", "ko": "더 이상 질문 없습니다, 재판장님."}, "practice": {"en": "\"Nothing further.\" \"Thank you. The witness may step down.\"", "ko": "\"이상입니다.\" \"감사합니다. 증인은 내려가셔도 됩니다.\""}}, "grammar": {"axis": "G2", "title": "questions는 복수", "wrong": "No further question.", "right": "No further questions. / I have no further questions.", "note": "no 뒤의 셀 수 있는 명사는 보통 복수입니다(no questions, no problems). 줄여서 Nothing further라고도 합니다."}, "collocations": ["Nothing further.", "The witness may step down. (증인은 내려가도 됩니다)", "Your witness. (이제 그쪽 신문 차례입니다)", "I pass the witness."]}], "corners": {"false_friend": {"title": "impeach는 대통령에게만 쓰는 말이 아니다", "body": ["impeach를 들으면 대통령 탄핵이 먼저 떠오릅니다. 그런데 미국 법정에서 하루에도 몇 번씩 나오는 impeach는 '증인의 신빙성을 깎아내리다'입니다. 'The defense impeached the witness.'를 '변호인이 증인을 탄핵 소추했다'로 옮기면 완전히 틀립니다.", "이 장에서 일상 뜻과 법정 뜻이 갈리는 말을 모아 보면 이렇습니다."], "table": [["impeach", "(대통령을) 탄핵하다", "(증인의) 신빙성을 탄핵하다"], ["privilege", "특권, 특혜", "증언·제출 거부특권"], ["exhibit", "전시품, 전시회", "증거물(호증)"], ["sustain", "지속하다, (부상을) 입다", "(이의를) 받아들이다"], ["leading", "앞서가는, 선두의", "유도하는(leading question)"], ["stipulate", "(조건으로) 명시하다", "다툼 없는 사실로 합의하다"]], "tip": "증인(witness)이 같은 문장에 있으면 impeach는 거의 언제나 '신빙성 탄핵'입니다."}, "drama": {"title": "My Cousin Vinny (1992)", "facts": ["1992년 미국 영화. 감독 조너선 린, 각본 데일 로너, 주연 조 페시·마리사 토메이. 20세기 폭스 배급.", "뉴욕 대학생 두 명이 앨라배마를 지나다 살인 누명을 쓰고, 막 변호사시험에 붙어 재판 경험이 없는 사촌 비니가 변호를 맡습니다.", "마리사 토메이는 이 영화로 아카데미 여우조연상을 받았습니다. 형사절차와 증거법, 재판 전략을 정확하게 그렸다는 평을 법률가들에게서 받아 왔습니다."], "watch": "증인신문의 교과서입니다. 비니는 반대신문에서 목격 증인들을 차례로 무너뜨립니다. 한 증인에게는 그리츠(grits)를 끓이는 데 걸리는 시간을 물어 그가 말한 시간대가 맞지 않음을 보여 주고, 다른 증인들에게는 시야를 가린 물건과 시력을 물어 범인을 알아볼 수 있었는지 의심하게 만듭니다. 이것이 impeach입니다. 후반에는 자동차 정비 집안 출신인 약혼자 모나 리사 비토가 전문가 증인(expert witness)으로 나서서, 사진 속 타이어 자국은 피고인들의 1964년형 뷰익 스카이라크가 아니라 1963년형 폰티액 템페스트만 낼 수 있다고 증언합니다. 판사가 그녀를 전문가로 인정하기 전에 상대방이 자격을 따져 묻는 장면은 연방증거규칙 Rule 702가 말하는 '전문가 자격' 문제를 이해하는 데 도움이 됩니다. 다만 영화 속 법정은 앨라배마 주 법원이라 연방 규칙이 그대로 적용되는 장면은 아닙니다.", "terms": ["cross-examination", "impeach", "credibility", "expert witness", "Objection! / sustained / overruled"], "links": [{"label": "Wikipedia — My Cousin Vinny", "url": "https://en.wikipedia.org/wiki/My_Cousin_Vinny"}, {"label": "YouTube — 공식 예고편 (20th Century Studios)", "url": "https://www.youtube.com/watch?v=hITJLnyH9Fc"}]}, "quote": {"text": "Dispensing with confrontation because testimony is obviously reliable is akin to dispensing with jury trial because a defendant is obviously guilty.", "ko": "증언이 명백히 믿을 만하다는 이유로 대면을 생략하는 것은, 피고인이 명백히 유죄라는 이유로 배심재판을 생략하는 것과 같다.", "case": "Crawford v. Washington, 541 U.S. 36 (2004)", "decided": "2004. 3. 8. 선고", "gloss": {"dispense with": "~을 생략하다, 없이 지내다", "confrontation": "대면(피고인이 불리한 증인과 마주하고 반대신문할 기회)", "akin to": "~와 같은, ~와 닮은"}, "why": "아내를 강간하려 했다는 남자를 찌른 크로퍼드 사건에서, 아내는 주법상 배우자 특권 때문에 법정에 나오지 않았고 검찰은 그녀가 경찰에서 한 녹음 진술을 틀었습니다. 연방대법원(스캘리아 대법관 집필)은 법원이 보기에 믿을 만하면 된다던 종전 기준(Ohio v. Roberts)을 버리고, 법정 밖 '증언적' 진술은 반대신문 기회가 없었다면 쓸 수 없다고 판단했습니다. 전문법칙의 예외에 해당해도 헌법상 대면권이라는 벽이 따로 있다는 뜻입니다. 이 장의 hearsay·privilege·cross-examination이 이 한 사건에 다 모여 있습니다.", "links": [{"label": "LII — Crawford 판결 원문", "url": "https://www.law.cornell.edu/supct/html/02-9410.ZO.html"}, {"label": "Oyez — 구두변론 녹음", "url": "https://www.oyez.org/cases/2003/02-9410"}]}, "korea": {"title": "전문법칙과 증인신문, 한국은?", "us": "미국 연방증거규칙은 법정 밖 진술을 그 내용의 진실을 증명하는 데 쓰는 것을 원칙적으로 막고(Rule 802), 주신문에서는 증언을 끌어내는 데 필요한 경우가 아니면 유도신문을 하지 못하게 합니다(Rule 611(c)).", "kr": "한국 형사소송법 제310조의2도 '공판준비 또는 공판기일 외에서의 타인의 진술을 내용으로 하는 진술'은 제311조부터 제316조까지 정한 경우가 아니면 증거로 할 수 없다고 정합니다. 증인신문은 신청한 쪽이 먼저, 상대방이 다음에 묻는 교호신문이 원칙이고(제161조의2 제1항), 형사소송규칙 제75조 제2항은 주신문에서 유도신문을 원칙적으로 금지합니다. 구조는 닮았지만 미국은 이의를 법정에서 즉석으로 외치는 반면, 한국은 증거조사에 대한 이의신청(제296조)이 법원의 결정으로 이어지는 절차로 정해져 있습니다. 또 한국에는 배심원 앞에서 증거를 걸러야 하는 미국식 사정이 없어(국민참여재판 제외), 법정 풍경이 훨씬 조용합니다.", "say": "Korea also has a hearsay rule. Under the Criminal Procedure Act, out-of-court statements are generally not admissible unless an exception applies, and leading questions are generally not allowed on direct examination.", "say_ko": "한국에도 전문법칙이 있습니다. 형사소송법상 법정 밖 진술은 예외에 해당하지 않으면 원칙적으로 증거능력이 없고, 주신문에서는 유도신문이 원칙적으로 허용되지 않습니다."}}, "quiz": [{"q": "증인이 질문에 답하기 전에 상대방 변호사가 이의를 제기했다. 판사가 'Sustained.'라고 했다면?", "options": ["증인은 답해야 한다", "질문을 거두거나 바꿔야 한다", "재판이 연기된다"], "answer": 1, "why": "sustained는 이의를 받아들인다는 뜻이라 증인은 답하지 않습니다. overruled면 증인이 답합니다."}, {"q": "'The defense impeached the witness.'의 뜻은?", "options": ["변호인이 증인을 탄핵 소추했다", "변호인이 증인의 신빙성을 깎아내렸다", "변호인이 증인을 소환했다"], "answer": 1, "why": "법정의 impeach는 증인의 신빙성 탄핵입니다. 대통령 탄핵과는 다른 장면입니다."}, {"q": "다음 중 주신문(direct examination)에서 원칙적으로 허용되지 않는 것은?", "options": ["open question", "leading question", "follow-up question"], "answer": 1, "why": "Rule 611(c)은 주신문에서 유도신문을 원칙적으로 금지하고, 반대신문에서는 허용합니다."}, {"q": "문법: 빈칸에 맞는 것은? — The police found three ____ at the scene.", "options": ["evidences", "pieces of evidence", "evidence pieces"], "answer": 1, "why": "evidence는 셀 수 없는 명사라 -s를 붙이지 않습니다. 셀 때는 pieces of evidence.", "grammar": "G3"}, {"q": "번역해 보세요: That's hearsay, so it is inadmissible.", "options": ["그건 소문이니 믿을 수 없다.", "그건 전문증거이므로 증거능력이 없다.", "그건 들은 이야기라 관련성이 없다."], "answer": 1, "why": "hearsay는 전문증거, inadmissible은 증거능력이 없다는 뜻입니다. 관련성(relevance)은 별개의 문제입니다."}]}, {"chapter": {"num": 6, "title": "형사 ①", "subtitle": "수사 — 경찰과 검찰", "title_en": "Criminal Procedure I — Police and Prosecutors", "lead": "미국 형사사건은 경찰의 체포와 수색에서 시작해, 검사가 무엇으로 기소할지 정하는 단계로 넘어갑니다. 중범죄는 대배심의 기소(indictment)를 거치는 것이 연방 헌법의 요구이고, 그 사이 피의자에게는 진술거부권과 변호인의 조력을 받을 권리가 따라붙습니다. 이 장은 체포 현장부터 기소장이 나오기까지의 말을 다룹니다.", "can_say": [{"en": "The suspect was arrested for robbery and read his Miranda rights.", "ko": "피의자는 강도 혐의로 체포되었고 미란다 권리를 고지받았습니다."}, {"en": "The police got a search warrant based on probable cause.", "ko": "경찰은 상당한 이유를 근거로 수색영장을 발부받았습니다."}, {"en": "A grand jury indicted him, and he was charged with fraud.", "ko": "대배심이 그를 기소했고, 그는 사기 혐의로 기소되었습니다."}]}, "entries": [{"id": "police-officer", "hw": "police officer · detective", "ipa": "pəˈliːs ˌɑː.fɪ.sɚ · dɪˈtek.tɪv", "stress": "po·**lice** **of**·fi·cer · de·**tec**·tive", "stars": 2, "gloss": "경찰관 · 형사(사복 수사관)", "pron_tip": "police는 둘째 음절 -lice-에 강세가 옵니다. 첫 음절을 세게 읽으면 알아듣기 어렵습니다.", "diff": "detective는 계급이자 직무 이름입니다. 제복 순찰 경찰(patrol officer)이 현장에 먼저 가고, 사건이 넘어가면 사복 차림의 detective가 수사를 맡습니다. 미국에는 전국 단일 경찰이 없고 시·카운티·주·연방(FBI 등) 경찰이 따로 있습니다.", "examples": {"easy": {"en": "The police are here.", "ko": "경찰이 왔다."}, "practice": {"en": "Two detectives interviewed the witness at the station.", "ko": "형사 두 명이 경찰서에서 목격자를 면담했다."}}, "grammar": {"axis": "G2", "title": "the police는 복수 취급", "wrong": "The police is investigating the case.", "right": "The police are investigating the case.", "note": "police는 경찰 조직 전체를 뜻하는 집합명사로, 늘 복수 동사를 씁니다. 한 사람은 a police officer."}, "collocations": ["call the police", "police station (경찰서)", "homicide detective (강력계 형사)", "plainclothes officer (사복 경찰)"]}, {"id": "suspect", "hw": "suspect", "ipa": "ˈsʌs.pekt · səˈspekt", "stress": "**sus**·pect (명사) · sus·**pect** (동사)", "stars": 3, "gloss": "피의자, 용의자 · 의심하다", "pron_tip": "명사는 앞 음절, 동사는 뒤 음절에 강세가 옵니다. record·object·conduct도 같은 규칙입니다.", "diff": "한국은 수사 대상이 되면 '피의자', 기소되면 '피고인'으로 지위가 바뀝니다. 영어 suspect는 법적 지위라기보다 '의심받는 사람'이라는 일상어에 가깝고, 기소 뒤에는 defendant 또는 the accused라고 부릅니다.", "examples": {"easy": {"en": "The police caught a suspect.", "ko": "경찰이 용의자 한 명을 잡았다."}, "practice": {"en": "The suspect was released because the officers lacked probable cause.", "ko": "경찰관들에게 상당한 이유가 없어 피의자는 풀려났다."}, "source": {"en": "give rise to probable cause to believe that the suspect has committed a crime", "ko": "피의자가 범죄를 저질렀다고 믿을 만한 상당한 이유가 생기다", "cite": "Terry v. Ohio, 392 U.S. 1 (1968)", "url": "https://www.law.cornell.edu/supremecourt/text/392/1", "glossary": {"give rise to": "~을 낳다, 생기게 하다", "probable cause": "상당한 이유(→ 이 장)"}}}, "grammar": {"axis": "G1", "title": "처음은 a suspect, 그다음은 the suspect", "wrong": "Police caught suspect. Suspect was 25 years old.", "right": "Police caught a suspect. The suspect was 25 years old.", "note": "처음 등장하는 용의자는 a, 이미 말한 그 사람은 the. 셀 수 있는 명사를 관사 없이 홀로 두지 않습니다."}, "collocations": ["prime suspect (유력 용의자)", "suspect A of B (A에게 B 혐의를 두다)", "the accused (피고인)"], "links": [{"label": "LII Wex — suspect", "url": "https://www.law.cornell.edu/wex/suspect"}]}, {"id": "investigate", "hw": "investigate · investigation", "ipa": "ɪnˈves.tə.ɡeɪt · ɪnˌves.təˈɡeɪ.ʃən", "stress": "in·**ves**·ti·gate · in·ves·ti·**ga**·tion", "stars": 3, "gloss": "수사하다 · 수사", "pron_tip": "동사는 -ves-, 명사는 -ga-에 주강세가 옵니다. -tion 바로 앞 음절에 강세가 오는 규칙입니다.", "examples": {"easy": {"en": "The FBI is investigating the fire.", "ko": "FBI가 그 화재를 수사하고 있다."}, "practice": {"en": "The mayor is under investigation for bribery.", "ko": "시장은 뇌물 혐의로 수사를 받고 있다."}, "source": {"en": "he considered it his duty as a police officer to investigate further", "ko": "그는 더 수사하는 것이 경찰관으로서 자기 의무라고 생각했다", "cite": "Terry v. Ohio, 392 U.S. 1 (1968) — 경찰관 증언을 요약한 사실관계 부분", "url": "https://www.law.cornell.edu/supremecourt/text/392/1"}}, "grammar": {"axis": "G4", "title": "under investigation · investigation into", "wrong": "He is in investigation. / an investigation about the fire", "right": "He is under investigation. / an investigation into the fire", "note": "'수사를 받는 중'은 under investigation. 명사 뒤 '~에 대한 수사'는 into를 많이 씁니다. 동사 investigate는 전치사 없이 목적어를 받습니다."}, "collocations": ["launch / open an investigation", "criminal investigation", "investigate a crime"], "links": [{"label": "LII Wex — investigation", "url": "https://www.law.cornell.edu/wex/investigation"}]}, {"id": "arrest", "hw": "arrest", "ipa": "əˈrest", "stress": "ar·**rest**", "stars": 3, "gloss": "체포 · 체포하다", "diff": "미국 연방에서 체포된 사람은 '불필요한 지체 없이' 치안판사(magistrate judge) 앞에 데려가야 합니다(Fed. R. Crim. P. 5(a)). 한국 형사소송법은 '체포한 때부터 48시간 이내'에 구속영장을 청구하라고 숫자로 정하지만(제200조의2 제5항), 이 규칙에는 그런 숫자가 없고 판례가 기준을 채웁니다.", "examples": {"easy": {"en": "He was arrested last night.", "ko": "그는 어젯밤 체포되었다."}, "practice": {"en": "Officers arrested the driver for drunk driving at 2 a.m.", "ko": "경찰관들은 새벽 2시에 그 운전자를 음주운전 혐의로 체포했다."}, "source": {"en": "A person making an arrest within the United States must take the defendant without unnecessary delay before a magistrate judge", "ko": "미국 안에서 체포를 한 사람은 피의자를 불필요한 지체 없이 치안판사 앞에 데려가야 한다", "cite": "Fed. R. Crim. P. 5(a)(1)(A)", "url": "https://www.law.cornell.edu/rules/frcrmp/rule_5", "glossary": {"magistrate judge": "치안판사(연방지방법원의 보조 판사)", "without unnecessary delay": "불필요한 지체 없이"}}}, "grammar": {"axis": "G4", "title": "arrested for · under arrest", "wrong": "He was arrested because of theft. / You are in arrest.", "right": "He was arrested for theft. / You are under arrest.", "note": "혐의는 for로 붙입니다. '당신을 체포합니다'는 You're under arrest — under는 '~의 상태 아래'라는 뜻입니다."}, "collocations": ["make an arrest", "place A under arrest", "resist arrest (체포에 저항하다)", "arrest A for B"], "links": [{"label": "LII Wex — arrest", "url": "https://www.law.cornell.edu/wex/arrest"}]}, {"id": "warrant", "hw": "warrant · arrest warrant · search warrant", "ipa": "ˈwɔːr.ənt", "stress": "**war**·rant", "stars": 3, "gloss": "영장 · 체포영장 · 수색영장", "pron_tip": "war-는 '워'에 가깝게 읽습니다. ward·warm처럼 w 뒤의 a는 /ɔː/ 소리가 납니다.", "examples": {"easy": {"en": "The police have a warrant.", "ko": "경찰에게 영장이 있다."}, "practice": {"en": "The judge issued a search warrant for the suspect's apartment.", "ko": "판사는 피의자의 아파트에 대한 수색영장을 발부했다."}, "source": {"en": "the judge must issue an arrest warrant to an officer authorized to execute it", "ko": "판사는 그 집행 권한이 있는 경찰관에게 체포영장을 발부하여야 한다", "cite": "Fed. R. Crim. P. 4(a)", "url": "https://www.law.cornell.edu/rules/frcrmp/rule_4", "glossary": {"issue": "발부하다", "execute": "집행하다"}}}, "grammar": {"axis": "G1", "title": "a warrant — 관사를 빼지 않는다", "wrong": "The judge issued warrant for his arrest.", "right": "The judge issued a warrant for his arrest. / They searched the house without a warrant.", "note": "warrant는 셀 수 있는 명사라 단수일 때 a가 필요합니다. 옛 판결문에는 without warrant처럼 관사 없는 관용 표현도 보이지만(Carroll v. United States, 1925), 지금 쓰는 문장에서는 without a warrant가 안전합니다. 한 단어로 굳은 warrantless search(영장 없는 수색)도 함께 알아 두세요."}, "collocations": ["issue a warrant", "execute a warrant", "get / obtain a warrant", "warrantless search"], "links": [{"label": "LII Wex — arrest warrant", "url": "https://www.law.cornell.edu/wex/arrest_warrant"}, {"label": "LII Wex — search warrant", "url": "https://www.law.cornell.edu/wex/search_warrant"}]}, {"id": "probable-cause", "hw": "probable cause", "ipa": "ˌprɑː.bə.bəl ˈkɑːz", "stress": "prob·a·ble **cause**", "stars": 3, "gloss": "상당한 이유(영장·체포의 요건)", "diff": "'개연성 있는 원인'으로 직역하면 뜻이 통하지 않습니다. 범죄가 있었고 그 사람이 저질렀다고 믿을 만한 합리적 근거를 말하며, 수정헌법 제4조가 영장 발부의 요건으로 정합니다. 한국 형사소송법의 '죄를 범하였다고 의심할 만한 상당한 이유'와 기능이 비슷하지만, 미국 판례가 쌓은 기준과 같다고 보면 안 됩니다.", "examples": {"easy": {"en": "There was no probable cause.", "ko": "상당한 이유가 없었다."}, "practice": {"en": "The affidavit did not establish probable cause, so the warrant was invalid.", "ko": "선서진술서가 상당한 이유를 소명하지 못해 영장은 무효였다."}, "source": {"en": "no warrants shall issue, but upon probable cause, supported by oath or affirmation", "ko": "선서나 확약으로 뒷받침된 상당한 이유에 근거하지 않고는 어떠한 영장도 발부되어서는 안 된다", "cite": "U.S. Const. amend. IV", "url": "https://www.law.cornell.edu/constitution/fourth_amendment", "glossary": {"issue": "(영장이) 발부되다 — 자동사", "affirmation": "확약(종교적 이유로 선서를 대신하는 엄숙한 진술)"}}}, "grammar": {"axis": "G3", "title": "probable cause에는 a를 붙이지 않는다", "wrong": "The officer had a probable cause.", "right": "The officer had probable cause.", "note": "법적 기준의 이름이라 셀 수 없는 명사처럼 씁니다. reasonable suspicion(합리적 의심)도 같은 방식으로 씁니다."}, "collocations": ["establish probable cause", "lack probable cause", "probable cause hearing", "reasonable suspicion (더 낮은 기준)"], "links": [{"label": "LII Wex — probable cause", "url": "https://www.law.cornell.edu/wex/probable_cause"}]}, {"id": "search-and-seizure", "hw": "search and seizure", "ipa": "sɝːtʃ ənd ˈsiː.ʒɚ", "stress": "**search** and **sei**·zure", "stars": 2, "gloss": "압수·수색", "pron_tip": "seizure의 -zure는 /ʒɚ/ — measure의 -sure와 같은 소리입니다.", "diff": "영어는 '수색(search) → 압수(seizure)' 순서로, 한국어는 '압수·수색' 순서로 말합니다. seizure는 물건뿐 아니라 사람을 붙잡아 두는 것(체포·정지)도 포함하는 넓은 말입니다.", "examples": {"easy": {"en": "The search took three hours.", "ko": "수색은 세 시간이 걸렸다."}, "practice": {"en": "The defense argues that the search and seizure violated the Fourth Amendment.", "ko": "변호인은 그 압수·수색이 수정헌법 제4조에 위반된다고 주장한다."}, "source": {"en": "The right of the people to be secure in their persons, houses, papers, and effects, against unreasonable searches and seizures, shall not be violated", "ko": "부당한 수색과 압수로부터 신체, 주거, 서류, 소유물의 안전을 보장받는 국민의 권리는 침해되어서는 안 된다", "cite": "U.S. Const. amend. IV", "url": "https://www.law.cornell.edu/constitution/fourth_amendment", "glossary": {"effects": "소유물, 동산 — '효과'가 아니다", "be secure in": "~에 관하여 안전을 보장받다"}}}, "grammar": {"axis": "G2", "title": "조문에서는 복수 searches and seizures", "wrong": "against unreasonable search and seizures", "right": "against unreasonable searches and seizures", "note": "개별 행위를 셀 때는 둘 다 복수로 맞춥니다. 제도 이름으로 말할 때만 관사 없는 단수 search and seizure를 씁니다."}, "collocations": ["unreasonable search", "seize evidence", "search incident to arrest (체포에 수반한 수색)"], "links": [{"label": "LII Wex — search and seizure", "url": "https://www.law.cornell.edu/wex/search_and_seizure"}]}, {"id": "miranda", "hw": "Miranda warnings · Miranda rights", "ipa": "məˈræn.də ˈwɔːr.nɪŋz · məˈræn.də raɪts", "stress": "Mi·**ran**·da **warn**·ings · Mi·**ran**·da **rights**", "stars": 3, "gloss": "미란다 고지 · 미란다 권리", "diff": "Miranda v. Arizona(1966)에서 나온 말입니다. 구금 상태에서 신문하기 전에 진술거부권, 진술이 불리하게 쓰일 수 있다는 점, 변호인 조력권을 알려야 하고, 고지 없이 받은 진술은 원칙적으로 증거로 쓰지 못합니다. 한국 형사소송법 제244조의3의 진술거부권 고지와 목적이 같습니다.", "examples": {"easy": {"en": "Did they read him his rights?", "ko": "그에게 권리를 고지했나요?"}, "practice": {"en": "The officer read the suspect his Miranda rights before questioning him.", "ko": "경찰관은 신문 전에 피의자에게 미란다 권리를 고지했다."}, "source": {"en": "if he is indigent a lawyer will be appointed to represent him", "ko": "그가 가난하면 그를 대리할 변호인이 선임될 것이다", "cite": "Miranda v. Arizona, 384 U.S. 436 (1966)", "url": "https://www.law.cornell.edu/supremecourt/text/384/436", "glossary": {"indigent": "빈곤한(변호사 비용을 낼 수 없는)", "appoint": "(국가가) 선임하다"}}}, "grammar": {"axis": "G7", "title": "read A his rights — 수동태는 was read his rights", "wrong": "He was read the rights to him.", "right": "The officer read him his rights. / He was read his rights.", "note": "read는 목적어 둘(사람 + 권리)을 받습니다. 사람을 주어로 올린 수동태가 기사에 자주 나옵니다. 구어 동사 Mirandize(미란다 고지를 하다)도 있습니다."}, "collocations": ["read A his/her rights", "waive Miranda rights", "Miranda violation", "be Mirandized"], "links": [{"label": "LII Wex — Miranda warning", "url": "https://www.law.cornell.edu/wex/miranda_warning"}]}, {"id": "right-to-remain-silent", "hw": "right to remain silent", "ipa": "raɪt tə rɪˈmeɪn ˈsaɪ.lənt", "stress": "**right** to re·**main** **si**·lent", "stars": 3, "gloss": "진술거부권(묵비권)", "diff": "헌법 조문에는 'remain silent'라는 말이 없습니다. 수정헌법 제5조는 '자기에게 불리한 증인이 되도록 강요받지 않는다'고 정할 뿐이고, '묵비권' 표현은 Miranda 고지문에서 굳었습니다. 그래서 진술을 거부하는 것을 plead the Fifth(제5조를 내세우다)라고도 합니다.", "examples": {"easy": {"en": "You have the right to remain silent.", "ko": "당신은 진술을 거부할 권리가 있습니다."}, "practice": {"en": "The witness invoked her right to remain silent and refused to answer.", "ko": "증인은 진술거부권을 행사하며 답변을 거부했다."}, "source": {"en": "nor shall be compelled in any criminal case to be a witness against himself", "ko": "누구든지 형사사건에서 자기에게 불리한 증인이 되도록 강요받지 아니한다", "cite": "U.S. Const. amend. V", "url": "https://www.law.cornell.edu/constitution/fifth_amendment", "glossary": {"compel": "강제하다", "a witness against himself": "자기에게 불리한 증인"}}}, "grammar": {"axis": "G4", "title": "the right to + 동사원형", "wrong": "the right of remaining silent", "right": "the right to remain silent / the right to counsel", "note": "right 뒤 '~할 권리'는 to로 잇습니다. 동사면 to + 원형(remain), 명사면 to + 명사(counsel)."}, "collocations": ["invoke / waive the right to remain silent", "plead the Fifth", "privilege against self-incrimination (자기부죄거부특권)"], "links": [{"label": "LII Wex — Miranda warning", "url": "https://www.law.cornell.edu/wex/miranda_warning"}]}, {"id": "custody", "hw": "custody · in custody", "ipa": "ˈkʌs.tə.di", "stress": "**cus**·to·dy", "stars": 2, "false_friend": true, "gloss": "구금, 신병 확보 · 구금된 상태로", "diff": "가족법에서는 같은 단어가 '양육권'입니다(→ 11장 child custody). Miranda 고지가 필요한 custody인지는 수갑을 찼는지가 아니라, 전체 상황에 비추어 정식 체포 또는 그에 준하는 정도로 행동의 자유가 제한되었는지로 판단합니다. 그 상태에서의 신문이 Miranda 고지의 대상입니다. 떠날 자유가 없다는 것만으로는 부족해서, 교통 단속으로 잠시 차를 세운 것만으로는 custody가 되지 않는다고 본 판결이 있습니다(Berkemer v. McCarty, 1984).", "examples": {"easy": {"en": "The man is in custody.", "ko": "그 남자는 구금되어 있다."}, "practice": {"en": "Police took two teenagers into custody after the robbery.", "ko": "경찰은 강도 사건 뒤 10대 두 명의 신병을 확보했다."}, "source": {"en": "after a person has been taken into custody or otherwise deprived of his freedom of action in any significant way", "ko": "사람이 구금되거나 그 밖에 어떤 중대한 방식으로든 행동의 자유를 박탈당한 뒤에", "cite": "Miranda v. Arizona, 384 U.S. 436 (1966) — custodial interrogation의 정의", "url": "https://www.law.cornell.edu/supremecourt/text/384/436", "glossary": {"deprive A of B": "A에게서 B를 빼앗다"}}}, "grammar": {"axis": "G4", "title": "in custody(상태) · into custody(이동)", "wrong": "Police took him in custody.", "right": "Police took him into custody. / He is in custody.", "note": "'구금하다'는 take into custody — 안으로 들어가는 움직임이라 into. 구금되어 있는 상태는 in custody."}, "collocations": ["take A into custody", "remain in custody", "custodial interrogation (구금 상태의 신문)", "child custody (양육권 → 11장)"], "links": [{"label": "LII Wex — custody", "url": "https://www.law.cornell.edu/wex/custody"}]}, {"id": "interrogation", "hw": "interrogation", "ipa": "ɪnˌter.əˈɡeɪ.ʃən", "stress": "in·ter·ro·**ga**·tion", "stars": 2, "gloss": "(피의자) 신문", "diff": "일상에서는 question(질문하다)이나 interview를 더 많이 씁니다. interrogation은 경찰이 피의자를 추궁하는 장면의 무거운 말이고, 민사 증거개시의 서면 질문 interrogatories(→ 3장)와는 다른 제도입니다.", "examples": {"easy": {"en": "The interrogation lasted all night.", "ko": "신문은 밤새 이어졌다."}, "practice": {"en": "He was questioned for six hours without a lawyer.", "ko": "그는 변호인 없이 6시간 동안 신문을 받았다."}, "source": {"en": "the prosecution may not use statements, whether exculpatory or inculpatory, stemming from custodial interrogation of the defendant unless it demonstrates the use of procedural safeguards effective to secure the privilege against self-incrimination", "ko": "검찰은, 자기부죄거부특권을 보장하는 데 효과적인 절차적 보호장치를 썼음을 증명하지 않는 한, 피고인에 대한 구금 상태의 신문에서 나온 진술을 — 유리한 것이든 불리한 것이든 — 사용할 수 없다", "cite": "Miranda v. Arizona, 384 U.S. 436 (1966)", "url": "https://www.law.cornell.edu/supremecourt/text/384/436", "glossary": {"exculpatory / inculpatory": "무죄를 뒷받침하는 / 유죄를 뒷받침하는", "stem from": "~에서 나오다", "the prosecution": "검찰(소추 측)"}}}, "grammar": {"axis": "G7", "title": "신문을 받다 = be questioned", "wrong": "He received questioning for six hours.", "right": "He was questioned for six hours.", "note": "'~을 받다'를 receive로 옮기지 말고 수동태로 씁니다. be interrogated, be interviewed도 같은 방식입니다."}, "collocations": ["custodial interrogation", "interrogation room (신문실)", "question a suspect"], "links": [{"label": "LII Wex — interrogation", "url": "https://www.law.cornell.edu/wex/interrogation"}]}, {"id": "booking", "hw": "booking", "ipa": "ˈbʊk.ɪŋ", "stress": "**book**·ing", "stars": 1, "false_friend": true, "gloss": "(체포 후) 입감 등록 절차", "diff": "호텔 '예약'이 아니라, 체포된 사람의 이름·혐의를 경찰 기록부(옛날의 장부 book)에 올리고 지문과 사진을 찍는 절차입니다. 한국에는 같은 이름의 절차가 따로 없습니다.", "examples": {"easy": {"en": "Booking took about an hour.", "ko": "입감 등록에 한 시간쯤 걸렸다."}, "practice": {"en": "She was booked into the county jail on a theft charge.", "ko": "그녀는 절도 혐의로 카운티 구치소에 입감 등록되었다."}}, "grammar": {"axis": "G7", "title": "be booked into jail", "wrong": "She booked into the jail.", "right": "She was booked into the county jail.", "note": "등록을 하는 쪽은 경찰이므로 체포된 사람은 수동태로 말합니다. She booked는 '그녀가 예약했다'로 읽힙니다."}, "collocations": ["be booked on a charge", "booking photo (= mugshot)", "fingerprinting (지문 채취)"], "links": [{"label": "LII Wex — booking", "url": "https://www.law.cornell.edu/wex/booking"}]}, {"id": "mugshot", "hw": "mugshot", "ipa": "ˈmʌɡ.ʃɑːt", "stress": "**mug**·shot", "stars": 1, "gloss": "(입감 때 찍는) 피의자 얼굴 사진", "diff": "mug는 속어로 '얼굴'입니다. 미국에서는 주에 따라 공개 기록으로 다뤄 언론에 실리기도 하지만, 한국은 「특정중대범죄 피의자 등 신상정보 공개에 관한 법률」이 정한 요건을 갖춘 때에만 피의자 얼굴을 공개합니다.", "examples": {"easy": {"en": "His mugshot was on the news.", "ko": "그의 입감 사진이 뉴스에 나왔다."}, "practice": {"en": "The sheriff's office took a mugshot and fingerprints.", "ko": "보안관 사무소는 얼굴 사진을 찍고 지문을 채취했다."}}, "grammar": {"axis": "G6", "title": "사진은 take와 짝", "wrong": "They did a mugshot.", "right": "They took a mugshot.", "note": "사진을 '찍다'는 take a photo / take a mugshot. make·do는 쓰지 않습니다."}, "collocations": ["take a mugshot", "mugshot / booking photo", "release a mugshot"]}, {"id": "bail", "hw": "bail · bond", "ipa": "beɪl · bɑːnd", "stress": "**bail** · **bond**", "stars": 3, "gloss": "보석(보석금) · 보석 보증(증서)", "diff": "한국 보석은 구속된 피고인이 기소 뒤에 청구하는 제도입니다. 미국에서는 체포 직후 첫 출석(initial appearance) 때부터 석방 조건을 정하고, 연방법은 돈을 걸지 않는 서약 석방(personal recognizance)을 첫 번째 선택지로 꼽습니다. 보석금을 대신 내주는 보증업자(bail bondsman)가 있는 것도 미국 풍경입니다.", "examples": {"easy": {"en": "The judge set bail at $10,000.", "ko": "판사는 보석금을 1만 달러로 정했다."}, "practice": {"en": "He was released on bail but must wear an ankle monitor.", "ko": "그는 보석으로 풀려났지만 발목 전자장치를 차야 한다."}, "source": {"en": "released on personal recognizance or upon execution of an unsecured appearance bond", "ko": "서약에 의하여, 또는 담보 없는 출석 보증서를 작성하는 조건으로 석방된다", "cite": "18 U.S.C. § 3142(a)(1)", "url": "https://www.law.cornell.edu/uscode/text/18/3142", "glossary": {"personal recognizance": "본인 서약(돈을 걸지 않는 석방)", "unsecured appearance bond": "담보 없는 출석 보증서 — 불출석하면 그때 돈을 물기로 약속"}}}, "pitfalls": ["bail(보석)을 bale(건초 더미)로 듣기 — 발음이 같다", "bail을 명사로만 알기 — '보석금을 내고 빼내다'는 bail A out, 동사로도 쓴다"], "grammar": {"axis": "G4", "title": "released on bail · held without bail", "wrong": "He was released by bail.", "right": "He was released on bail. / He is being held without bail.", "note": "'보석으로 풀려나다'는 on bail. 보석 없이 붙잡아 두는 것은 held without bail. 금액은 set bail at $10,000처럼 at으로 붙입니다."}, "collocations": ["set bail", "post / make bail (보석금을 내다)", "be denied bail", "bail bondsman", "pretrial release"], "links": [{"label": "LII Wex — bail", "url": "https://www.law.cornell.edu/wex/bail"}]}, {"id": "prosecutor", "hw": "prosecutor", "ipa": "ˈprɑː.sə.kjuː.t̬ɚ", "stress": "**pros**·e·cu·tor", "stars": 3, "gloss": "검사", "diff": "미국에서 현장 수사는 경찰·FBI가 맡고, 검사는 기소와 공판을 중심으로 일합니다. 주의 지방검사장(district attorney)은 주민 선거로 뽑는 선출직인 경우가 있어 한국과 위상이 다릅니다. 법정에서 검찰 측 전체는 the prosecution 또는 the government(연방), the People(일부 주)이라고 부릅니다. 한국에서는 2026. 10. 2. 시행 공소청법에 따라 검찰청이 공소청으로 재편되었습니다. 대법원·고등법원·지방법원(가정법원)에 대응해 각각 공소청·광역공소청·지방공소청을 두므로(공소청법 제2조, 제3조 제1항), 종전의 대검찰청·고등검찰청·지방검찰청 자리입니다. 검사·검찰총장이라는 이름은 헌법에 있는 명칭이라 그대로 남았습니다(헌법 제12조 제3항, 제89조 제16호, 공소청법 제6조).", "examples": {"easy": {"en": "The prosecutor asked for ten years.", "ko": "검사는 10년을 구형했다."}, "practice": {"en": "The prosecution called its first witness, a police detective.", "ko": "검찰은 첫 증인으로 형사 한 명을 신청했다."}, "source": {"en": "But, while he may strike hard blows, he is not at liberty to strike foul ones.", "ko": "검사는 강하게 칠 수는 있으나, 반칙으로 칠 자유는 없다.", "cite": "Berger v. United States, 295 U.S. 78, 88 (1935)", "url": "https://www.law.cornell.edu/supremecourt/text/295/78", "glossary": {"strike a blow": "타격을 가하다", "foul": "반칙의, 부당한", "be at liberty to": "~할 자유가 있다"}}}, "box": "Berger 판결은 검사를 '어느 한 당사자의 대리인이 아니라 주권자의 대리인'으로 묘사하고, 검사의 목적은 사건에서 이기는 것이 아니라 정의가 실현되게 하는 것이라고 말합니다. 검사의 객관의무를 설명할 때 자주 인용되는 대목입니다.", "grammar": {"axis": "G1", "title": "the prosecution — 검찰 측 전체", "wrong": "Prosecution called a witness.", "right": "The prosecution called a witness.", "note": "법정의 한쪽 편을 가리키는 the prosecution, the defense에는 the를 붙입니다. 사람 한 명은 a prosecutor."}, "collocations": ["the prosecution", "federal prosecutor", "prosecute A for B", "prosecutorial discretion (기소재량)"], "links": [{"label": "LII Wex — prosecutor", "url": "https://www.law.cornell.edu/wex/prosecutor"}]}, {"id": "district-attorney", "hw": "district attorney (DA)", "ipa": "ˈdɪs.trɪkt əˈtɝː.ni", "stress": "**dis**·trict at·**tor**·ney", "stars": 2, "gloss": "(주의) 지방검사장, 지방검찰", "diff": "카운티나 지역 단위로 주(州) 범죄를 기소하는 검찰의 장입니다. 이름은 주마다 달라 state's attorney, county prosecutor라고도 부릅니다. 그 밑의 검사들은 assistant district attorney(ADA)입니다. 연방 범죄는 U.S. Attorney가 맡습니다.", "examples": {"easy": {"en": "The DA dropped the charges.", "ko": "지방검사장은 공소를 취하했다."}, "practice": {"en": "The district attorney's office declined to prosecute the case.", "ko": "지방검찰청은 그 사건을 기소하지 않기로 했다."}}, "grammar": {"axis": "G2", "title": "attorneys는 규칙 복수 — attorneys general은 예외", "wrong": "Two district attorney", "right": "Two district attorneys / two attorneys general", "note": "district attorney의 복수는 끝에 s. 반면 attorney general(법무장관)은 명사가 앞에 있어 격식 문서에서는 attorneys general을 씁니다. attorney generals도 사전에 실려 있지만 법률 문서에서 권장되는 형태는 attorneys general입니다."}, "collocations": ["district attorney's office", "assistant district attorney (ADA)", "drop the charges"]}, {"id": "us-attorney", "hw": "U.S. Attorney", "ipa": "ˌjuːˈes əˈtɝː.ni", "stress": "**U**.**S**. At·**tor**·ney", "stars": 1, "gloss": "연방검사장", "diff": "연방 관할구(judicial district)마다 한 명씩 대통령이 상원의 동의를 얻어 임명합니다(28 U.S.C. § 541). 이름이 비슷한 Attorney General은 법무부 장관이고, U.S. Attorney는 그 아래 각 관할구 연방검찰청의 장입니다.", "examples": {"easy": {"en": "The U.S. Attorney held a press conference.", "ko": "연방검사장이 기자회견을 열었다."}, "practice": {"en": "The U.S. Attorney's Office charged three people with wire fraud.", "ko": "연방검찰청은 세 명을 전신 사기 혐의로 기소했다."}, "source": {"en": "each United States attorney, within his district, shall— (1) prosecute for all offenses against the United States", "ko": "각 연방검사장은 그 관할구 안에서 다음 각 호의 직무를 수행한다 — (1) 미국에 대한 모든 범죄를 기소한다", "cite": "28 U.S.C. § 547", "url": "https://www.law.cornell.edu/uscode/text/28/547", "glossary": {"offenses against the United States": "연방 범죄"}}}, "grammar": {"axis": "G1", "title": "the United States — 나라 이름의 the", "wrong": "offenses against United States", "right": "offenses against the United States", "note": "the United States, the United Kingdom처럼 states·kingdom 같은 보통명사가 들어간 나라 이름에는 the가 붙습니다. Korea, France에는 붙이지 않습니다."}, "collocations": ["U.S. Attorney's Office", "Assistant U.S. Attorney (AUSA)", "Attorney General (법무부 장관)"], "links": [{"label": "LII Wex — United States Attorney", "url": "https://www.law.cornell.edu/wex/united_states_attorney"}]}, {"id": "charge", "hw": "charge · be charged with", "ipa": "tʃɑːrdʒ", "stress": "**charge**", "stars": 3, "gloss": "혐의, 공소사실 · ~로 기소되다", "diff": "charge는 경찰 단계의 '혐의'와 검찰 단계의 '기소'를 모두 가리켜, 한국어로는 문맥에 따라 '혐의를 받다'와 '기소되다'로 갈라 옮겨야 합니다. 한 사건에 혐의가 여럿이면 charges, 기소장 안의 각 죄목은 count라고 합니다.", "examples": {"easy": {"en": "He was charged with theft.", "ko": "그는 절도 혐의로 기소되었다."}, "practice": {"en": "Prosecutors dropped two of the five charges against her.", "ko": "검찰은 그녀에 대한 혐의 다섯 개 중 두 개를 철회했다."}, "source": {"en": "a plain, concise, and definite written statement of the essential facts constituting the offense charged", "ko": "기소된 범죄를 구성하는 핵심 사실을 평이하고 간결하며 명확하게 적은 서면", "cite": "Fed. R. Crim. P. 7(c)(1) — 기소장의 요건", "url": "https://www.law.cornell.edu/rules/frcrmp/rule_7", "glossary": {"constitute": "구성하다", "the offense charged": "기소된 범죄(공소사실)"}}}, "grammar": {"axis": "G7", "title": "be charged with — 전치사는 with", "wrong": "He was charged for murder. / He charged with murder.", "right": "He was charged with murder.", "note": "'~혐의로 기소되다'는 수동태 + with. 같은 뜻의 be accused of는 of를 씁니다. 체포는 arrested for(→ arrest)."}, "collocations": ["be charged with", "face charges", "drop the charges", "press charges (피해자가 고소하다)", "count (죄목)"], "links": [{"label": "LII Wex — charge", "url": "https://www.law.cornell.edu/wex/charge"}]}, {"id": "indictment", "hw": "indictment · indict", "ipa": "ɪnˈdaɪt̬.mənt · ɪnˈdaɪt", "stress": "in·**dict**·ment · in·**dict**", "stars": 3, "gloss": "(대배심의) 기소, 기소장 · 기소하다", "pron_tip": "c는 소리 나지 않습니다. indict는 invite와 운이 맞는 /ɪnˈdaɪt/입니다. '인딕트'로 읽으면 다른 단어로 들립니다.", "diff": "indictment는 대배심(grand jury)이 기소를 의결해 나온 기소장입니다. 검사가 혼자 내는 기소장은 information이라 해서 이름이 다릅니다(→ information). 한국어로는 둘 다 '기소'라서 영어로 옮길 때 누가 기소했는지 확인해야 합니다.", "examples": {"easy": {"en": "The grand jury indicted him.", "ko": "대배심이 그를 기소했다."}, "practice": {"en": "She was indicted on three counts of bank fraud.", "ko": "그녀는 은행 사기 세 개 죄목으로 기소되었다."}, "source": {"en": "An offense (other than criminal contempt) must be prosecuted by an indictment if it is punishable", "ko": "범죄(형사상 법정모욕은 제외)는 다음 형에 해당하면 대배심 기소로 소추하여야 한다", "cite": "Fed. R. Crim. P. 7(a)(1) — 이어서 (A) 사형 (B) 1년을 넘는 구금형", "url": "https://www.law.cornell.edu/rules/frcrmp/rule_7", "glossary": {"criminal contempt": "형사상 법정모욕", "punishable": "(형으로) 처벌할 수 있는"}}}, "grammar": {"axis": "G7", "title": "be indicted on ~ counts", "wrong": "She indicted on three counts.", "right": "She was indicted on three counts of fraud.", "note": "기소를 당하는 사람은 수동태. 죄목 수는 on으로 붙입니다(be indicted on two counts of ~). 의결하는 주체를 밝히면 by a grand jury."}, "collocations": ["return an indictment (대배심이 기소장을 내다)", "be indicted on charges of", "unseal an indictment (기소장을 공개하다)"], "links": [{"label": "LII Wex — indictment", "url": "https://www.law.cornell.edu/wex/indictment"}]}, {"id": "grand-jury", "hw": "grand jury", "ipa": "ˌɡrænd ˈdʒʊr.i", "stress": "**grand** **ju**·ry", "stars": 2, "gloss": "대배심(기소 여부를 정하는 시민 배심)", "diff": "유무죄를 정하는 배심(petit jury, trial jury)과 다른 기구입니다. 연방 대배심은 16~23명이고 12명 이상이 찬성해야 기소합니다(Fed. R. Crim. P. 6(a)(1), 6(f)). 비공개로 열리고 피의자 측 변호인은 들어가지 못합니다. 한국에는 이런 제도가 없습니다(→ 「한국이라면?」).", "examples": {"easy": {"en": "The grand jury met in secret.", "ko": "대배심은 비공개로 열렸다."}, "practice": {"en": "The grand jury has heard testimony from twelve witnesses.", "ko": "대배심은 증인 12명의 증언을 들었다."}, "source": {"en": "No person shall be held to answer for a capital, or otherwise infamous crime, unless on a presentment or indictment of a grand jury", "ko": "누구든지 대배심의 고발이나 기소에 의하지 아니하고는 사형에 해당하는 죄나 그 밖의 중죄(infamous crime)에 대하여 답변할 책임을 지지 아니한다", "cite": "U.S. Const. amend. V", "url": "https://www.law.cornell.edu/constitution/fifth_amendment", "glossary": {"be held to answer": "(형사) 책임을 지게 되다, 재판에 회부되다", "capital": "사형에 해당하는", "infamous crime": "중죄 — 도덕적 비난이 아니라 형벌로 정해지는 말. 교도소 구금이나 중노동에 처할 수 있는 범죄를 뜻하며, 연방에서는 1년 넘는 구금형 범죄가 여기에 해당한다(Fed. R. Crim. P. 7 위원회 주석)", "presentment": "대배심의 직권 고발"}}}, "box": "이 조항은 연방 사건에만 적용됩니다. 연방대법원은 대배심 기소 요건을 주(州)에 강제하지 않았기 때문에, 주마다 대배심을 쓰는 곳과 검사의 information으로 기소하는 곳이 갈립니다.", "grammar": {"axis": "G2", "title": "jury는 집합명사 — 미국은 단수 동사", "wrong": "The grand jury have heard the testimony. (미국 문서에서)", "right": "The grand jury has heard the testimony.", "note": "jury·committee 같은 집합명사는 미국 영어에서 보통 단수 동사를 씁니다(영국은 복수도 씀). 배심원 한 사람은 a juror, 여러 명은 jurors."}, "collocations": ["convene a grand jury", "grand jury subpoena", "grand juror", "petit jury (공판 배심)"], "links": [{"label": "LII Wex — grand jury", "url": "https://www.law.cornell.edu/wex/grand_jury"}]}, {"id": "information", "hw": "information", "ipa": "ˌɪn.fɚˈmeɪ.ʃən", "stress": "in·for·**ma**·tion", "stars": 2, "false_friend": true, "gloss": "(검사의) 정식 기소장", "diff": "대배심을 거치지 않고 검사가 직접 법원에 내는 기소장입니다. 연방에서는 1년을 넘는 구금형에 해당하는 범죄라도 피고인이 법정에서 대배심 기소를 받을 권리를 포기하면 information으로 기소할 수 있습니다(Fed. R. Crim. P. 7(b)). 「가짜 친구」 코너에서 자세히 봅니다.", "examples": {"easy": {"en": "The prosecutor filed an information.", "ko": "검사가 기소장을 냈다."}, "practice": {"en": "He waived indictment, and the government proceeded by information.", "ko": "그가 대배심 기소를 포기해서, 검찰은 검사 기소장으로 절차를 진행했다."}, "source": {"en": "An offense punishable by imprisonment for more than one year may be prosecuted by information if the defendant", "ko": "1년을 넘는 구금형에 해당하는 범죄도, 피고인이 (공개 법정에서 대배심 기소를 받을 권리를 포기하면) 검사 기소장으로 소추할 수 있다", "cite": "Fed. R. Crim. P. 7(b)", "url": "https://www.law.cornell.edu/rules/frcrmp/rule_7", "glossary": {"waive": "(권리를) 포기하다", "by information": "검사 기소장으로"}}}, "grammar": {"axis": "G3", "title": "'정보'는 셀 수 없지만 '기소장'은 셀 수 있다", "wrong": "I need an information. (정보)", "right": "I need some information. (정보) / The prosecutor filed an information. (기소장)", "note": "일상의 information은 불가산이라 a를 붙이지 않습니다. 기소장이라는 서면 한 통을 가리킬 때만 an information, 복수 informations가 됩니다."}, "collocations": ["file an information", "proceed by information", "waive indictment"], "links": [{"label": "LII Wex — information", "url": "https://www.law.cornell.edu/wex/information"}]}, {"id": "complaint-criminal", "hw": "complaint (criminal)", "ipa": "kəmˈpleɪnt", "stress": "com·**plaint**", "stars": 1, "false_friend": true, "gloss": "(형사) 범죄 소명서, 고발장", "diff": "민사 complaint는 소장입니다(→ 3장). 연방 형사에서 complaint는 범죄사실을 적고 선서한 서면으로, 주로 수사기관이 치안판사에게 내어 체포영장을 받는 데 씁니다. 피해자가 수사를 구하는 한국 '고소장'과는 쓰임이 다르므로, 번역할 때 누가 누구에게 낸 서면인지 확인합니다.", "examples": {"easy": {"en": "An agent signed the complaint.", "ko": "수사관이 범죄 소명서에 서명했다."}, "practice": {"en": "The FBI agent swore to the complaint before a magistrate judge.", "ko": "FBI 수사관은 치안판사 앞에서 범죄 소명서의 내용이 사실이라고 선서했다."}, "source": {"en": "The complaint is a written statement of the essential facts constituting the offense charged.", "ko": "complaint는 문제 된 범죄를 구성하는 핵심 사실을 적은 서면이다.", "cite": "Fed. R. Crim. P. 3", "url": "https://www.law.cornell.edu/rules/frcrmp/rule_3"}}, "grammar": {"axis": "G4", "title": "swear to a complaint · file a complaint against", "wrong": "The agent swore the complaint.", "right": "The agent swore to the complaint.", "note": "'~이 사실이라고 선서하다'는 swear to + 서면. 상대방을 밝힐 때는 a complaint against A."}, "collocations": ["criminal complaint", "swear to a complaint", "complaint and affidavit"], "links": [{"label": "LII Wex — criminal complaint", "url": "https://www.law.cornell.edu/wex/criminal_complaint"}]}, {"id": "exclusionary-rule", "hw": "exclusionary rule", "ipa": "ɪksˈkluː.ʒən.er.i ruːl", "stress": "ex·**clu**·sion·ar·y **rule**", "stars": 2, "gloss": "위법수집증거 배제법칙", "diff": "위법한 압수·수색으로 얻은 증거를 재판에서 쓰지 못하게 하는 원칙입니다. 연방 사건에는 1914년 Weeks 판결로, 주 사건에는 1961년 Mapp v. Ohio로 적용되었습니다. 한국은 2007년 형사소송법 개정으로 제308조의2에 명문화했습니다.", "examples": {"easy": {"en": "The judge excluded the evidence.", "ko": "판사는 그 증거를 배제했다."}, "practice": {"en": "The drugs were suppressed because the search was unlawful.", "ko": "수색이 위법해서 그 마약은 증거에서 배제되었다."}, "source": {"en": "all evidence obtained by searches and seizures in violation of the Constitution is, by that same authority, inadmissible in a state court", "ko": "헌법에 위반한 압수·수색으로 얻은 모든 증거는, 같은 헌법의 권위에 의하여, 주 법원에서도 증거능력이 없다", "cite": "Mapp v. Ohio, 367 U.S. 643, 655 (1961)", "url": "https://www.law.cornell.edu/supremecourt/text/367/643", "glossary": {"inadmissible": "증거능력이 없는(→ 5장)", "by that same authority": "같은 (헌법의) 권위에 의하여"}}}, "grammar": {"axis": "G7", "title": "증거는 suppressed · excluded 된다", "wrong": "The evidence suppressed.", "right": "The evidence was suppressed.", "note": "증거를 배제하는 것은 법원이므로 증거를 주어로 하면 수동태입니다. 피고인 측 신청은 motion to suppress(증거배제 신청)."}, "collocations": ["motion to suppress", "suppress evidence", "good-faith exception (선의의 예외)"], "links": [{"label": "LII Wex — exclusionary rule", "url": "https://www.law.cornell.edu/wex/exclusionary_rule"}]}, {"id": "fruit-of-the-poisonous-tree", "hw": "fruit of the poisonous tree", "ipa": "fruːt əv ðə ˈpɔɪ.zən.əs triː", "stress": "**fruit** of the **poi**·son·ous **tree**", "stars": 2, "gloss": "독수독과(毒樹毒果)", "diff": "위법한 수사(독 있는 나무)에서 파생해 얻은 증거(열매)도 배제한다는 원칙입니다. 표현은 Nardone v. United States(1939)에서 처음 쓰였습니다. 위법과 무관한 독립된 출처가 있거나 인과관계가 희석되면 배제하지 않는 예외가 있습니다.", "examples": {"easy": {"en": "The gun was fruit of the poisonous tree.", "ko": "그 총은 독수독과였다."}, "practice": {"en": "The judge threw out the confession and everything found because of it.", "ko": "판사는 자백과 그 자백 때문에 발견된 모든 증거를 배제했다."}, "source": {"en": "to prove that a substantial portion of the case against him was a fruit of the poisonous tree", "ko": "그에게 불리한 검찰 측 입증의 상당 부분이 독 있는 나무의 열매임을 증명하다", "cite": "Nardone v. United States, 308 U.S. 338, 341 (1939)", "url": "https://www.law.cornell.edu/supremecourt/text/308/338", "glossary": {"a substantial portion of": "~의 상당 부분", "the case against him": "그에게 불리한 (검찰의) 증거·주장"}}}, "grammar": {"axis": "G5", "title": "throw out — 증거를 '내치다'", "wrong": "The judge threw away the confession.", "right": "The judge threw out the confession.", "note": "법원이 증거나 사건을 배제·기각하는 것은 throw out입니다. throw away는 쓰레기를 버리는 말입니다(→ 3장 motion to dismiss)."}, "collocations": ["fruit of the poisonous tree doctrine", "independent source (독립된 출처)", "inevitable discovery (불가피한 발견)"], "links": [{"label": "LII Wex — fruit of the poisonous tree", "url": "https://www.law.cornell.edu/wex/fruit_of_the_poisonous_tree"}]}, {"id": "plea-bargain", "hw": "plea bargain", "ipa": "ˈpliː ˌbɑːr.ɡɪn", "stress": "**plea** bar·gain", "stars": 3, "gloss": "유죄협상(답변거래)", "diff": "피고인이 유죄를 인정하는 대신 검사가 죄목을 줄이거나 가벼운 형을 구형하기로 합의하는 것입니다. 연방 규칙은 판사가 협상에 끼지 못하게 막습니다(Rule 11(c)(1)). 한국에는 일반적인 유죄협상 제도가 없습니다. 유죄 답변 자체는 7장, 그 장의 명문장(Lafler v. Cooper)에서 다시 봅니다.", "examples": {"easy": {"en": "He took a plea deal.", "ko": "그는 유죄협상을 받아들였다."}, "practice": {"en": "The defendant struck a plea bargain and pleaded guilty to a lesser charge.", "ko": "피고인은 유죄협상을 맺고 더 가벼운 혐의에 대해 유죄를 인정했다."}, "source": {"en": "may discuss and reach a plea agreement. The court must not participate in these discussions.", "ko": "(검사와 피고인 측 변호인은) 협의하여 답변 합의에 이를 수 있다. 법원은 이 협의에 참여해서는 안 된다.", "cite": "Fed. R. Crim. P. 11(c)(1)", "url": "https://www.law.cornell.edu/rules/frcrmp/rule_11", "glossary": {"plea agreement": "답변 합의(plea bargain의 정식 명칭)", "participate in": "~에 참여하다"}}}, "box": "미국 연방대법원은 2012년 Missouri v. Frye에서 '연방 유죄판결의 97%, 주 유죄판결의 94%가 유죄 답변으로 나온다'고 적었습니다. 근거는 법무부 통계(연방 2009 회계연도, 주 2006년 중죄 사건)입니다. 재판(trial)까지 가는 형사사건이 드물다는 말은 이 숫자에서 나옵니다.", "grammar": {"axis": "G6", "title": "strike / reach a plea bargain", "wrong": "He struck a plea bargaining with the prosecutor.", "right": "He struck a plea bargain with the prosecutor. / They reached a plea agreement.", "note": "합의 한 건은 plea bargain, 협상하는 과정은 plea bargaining(불가산이라 a를 붙이지 않음)입니다. 합의를 '맺다'는 make a plea bargain도 쓰지만 strike a deal, reach an agreement가 대표 짝입니다. 구어로는 take a plea (deal)."}, "collocations": ["strike a plea bargain", "take a plea deal", "plea agreement", "plead guilty to a lesser charge (→ 7장)"], "links": [{"label": "LII Wex — plea bargain", "url": "https://www.law.cornell.edu/wex/plea_bargain"}]}, {"id": "defense-attorney", "hw": "defense attorney · public defender", "ipa": "dɪˈfens əˈtɝː.ni · ˌpʌb.lɪk dɪˈfen.dɚ", "stress": "de·**fense** at·**tor**·ney · **pub**·lic de·**fend**·er", "stars": 2, "uk": "defence (영국 철자)", "gloss": "(형사) 변호인 · 국선전담 변호인(공설변호인)", "diff": "public defender는 국가·카운티가 운영하는 공설변호인 사무소에 소속된 상근 변호사입니다. 한국의 국선전담변호사와 비슷하지만, 미국은 별도 기관(public defender's office)이 사건을 맡는다는 점이 다릅니다. 연방에서는 변호인을 구할 수 없는 피고인에게 첫 출석부터 상소까지 변호인을 선정해 줍니다.", "examples": {"easy": {"en": "She asked for a public defender.", "ko": "그녀는 국선변호인을 요청했다."}, "practice": {"en": "The defendant was represented by a public defender at the hearing.", "ko": "피고인은 심리기일에 국선변호인의 변호를 받았다."}, "source": {"en": "A defendant who is unable to obtain counsel is entitled to have counsel appointed to represent the defendant at every stage of the proceeding from initial appearance through appeal", "ko": "변호인을 구할 수 없는 피고인은 첫 출석부터 상소에 이르기까지 절차의 모든 단계에서 자신을 대리할 변호인을 선정받을 권리가 있다", "cite": "Fed. R. Crim. P. 44(a)", "url": "https://www.law.cornell.edu/rules/frcrmp/rule_44", "glossary": {"be entitled to": "~할 권리가 있다", "initial appearance": "(체포 후) 첫 출석", "through": "~까지(포함)"}}}, "grammar": {"axis": "G7", "title": "be represented by — 변호를 받다", "wrong": "He received defense from a public defender.", "right": "He was represented by a public defender.", "note": "'~의 변호를 받다'는 represent의 수동태로 씁니다. 능동은 A public defender represented him."}, "collocations": ["defense counsel", "be represented by", "court-appointed counsel (법원이 선정한 변호인)", "public defender's office"], "links": [{"label": "LII Wex — public defender", "url": "https://www.law.cornell.edu/wex/public_defender"}, {"label": "LII Wex — defense attorney", "url": "https://www.law.cornell.edu/wex/defense_attorney"}]}], "corners": {"false_friend": {"title": "information은 '정보'가 아니다", "body": ["information은 셀 수 없는 명사 '정보'로 배웁니다. 그런데 형사 법정에서 an information은 검사가 대배심을 거치지 않고 직접 내는 기소장 한 통입니다. 셀 수 있으니 복수 informations도 있습니다.", "그래서 'The government filed an information'을 '정부가 정보를 제출했다'로 옮기면 뜻이 완전히 틀립니다. 대배심이 낸 기소장은 indictment, 검사가 낸 기소장은 information — 짝으로 외우세요.", "같은 장의 가짜 친구를 모아 보면 이렇습니다."], "table": [["information", "정보", "검사 기소장"], ["charge", "요금, 충전", "혐의, 공소사실"], ["booking", "예약", "입감 등록 절차"], ["custody", "보관, 보호", "구금 (가족법에서는 양육권)"], ["complaint", "불평", "(형사) 범죄 소명서 · (민사) 소장"], ["bond", "채권, 유대", "보석 보증(증서)"], ["warrant", "보증하다(동사)", "영장"]], "tip": "외우는 요령: 앞에 an이 붙은 information이 보이면 기소장입니다. '정보'에는 an이 붙지 않습니다."}, "drama": {"title": "Law & Order (1990~)", "facts": ["딕 울프(Dick Wolf)가 만든 미국 NBC 드라마. 1990년 9월 13일 첫 방송, 2010년 5월 24일 20시즌으로 끝났다가 2022년에 21시즌으로 부활했습니다.", "뉴욕시를 배경으로, 매회 전반부는 뉴욕 경찰(NYPD) 형사들의 수사와 피의자 체포, 후반부는 맨해튼 지방검찰청의 기소와 재판을 다루는 두 부분 구성입니다.", "매회 오프닝 내레이션이 경찰과 지방검사(district attorneys)를 '형사사법의 두 집단'으로 소개하고 'These are their stories.'로 끝납니다."], "watch": "이 장의 흐름이 한 회에 그대로 들어 있습니다. 전반부에서 형사(detective)가 용의자(suspect)를 쫓아 영장(warrant)을 받고 체포(arrest)하며 미란다 권리를 고지하고, 후반부에서 검사가 기소(charge)와 유죄협상(plea bargain)을 저울질합니다. 뉴욕주 사건이라 법정에서 검찰을 the People이라고 부르는 것도 들어 보세요.", "terms": ["detective", "suspect", "arrest / You're under arrest", "warrant", "Miranda rights", "district attorney (DA, ADA)", "plea bargain", "the People"], "links": [{"label": "Wikipedia — Law & Order", "url": "https://en.wikipedia.org/wiki/Law_%26_Order"}, {"label": "YouTube — 공식 클립: Best of Ben Stone, 1시즌 (Law & Order — NBC 공식 채널)", "url": "https://www.youtube.com/watch?v=lqLSlQY-8w8"}]}, "quote": {"text": "Prior to any questioning, the person must be warned that he has a right to remain silent, that any statement he does make may be used as evidence against him, and that he has a right to the presence of an attorney, either retained or appointed.", "ko": "신문하기 전에, 그 사람에게 진술을 거부할 권리가 있다는 것, 그가 하는 어떤 진술도 그에게 불리한 증거로 쓰일 수 있다는 것, 그리고 사선이든 국선이든 변호인의 참여를 요구할 권리가 있다는 것을 고지해야 한다.", "case": "Miranda v. Arizona, 384 U.S. 436, 444 (1966)", "decided": "1966. 6. 13. 선고", "gloss": {"prior to": "~ 전에(before의 격식체)", "retained or appointed": "스스로 선임한(사선) 또는 선정된(국선)", "the presence of an attorney": "변호인의 참여(동석)"}, "why": "애리조나주 피닉스에서 체포된 어니스토 미란다는 경찰서 신문실에서 두 시간 동안 신문을 받고 자백서에 서명했지만, 변호인 참여권을 고지받지 못했습니다. 주 법원은 그 자백으로 납치·강간죄 유죄를 선고했고, 연방대법원은 5대 4로 그 자백을 증거로 쓸 수 없다고 했습니다. 이 한 문장이 'You have the right to remain silent …'로 시작하는 경찰 고지문의 원형이 되었습니다.", "links": [{"label": "LII — Miranda 판결 원문", "url": "https://www.law.cornell.edu/supremecourt/text/384/436"}, {"label": "Oyez — 사건 개요·구두변론", "url": "https://www.oyez.org/cases/1965/759"}]}, "korea": {"title": "대배심이 없다면?", "us": "미국 연방에서는 사형에 해당하는 범죄는 반드시, 1년을 넘는 구금형에 해당하는 범죄는 피고인이 법정에서 포기하지 않는 한, 16~23명의 시민으로 이루어진 대배심이 기소 여부를 정합니다(수정헌법 제5조, Fed. R. Crim. P. 6·7(a)·7(b)). 시민이 기소의 문지기 역할을 하는 셈입니다.", "kr": "한국에는 대배심이 없습니다. 형사소송법 제246조는 '공소는 검사가 제기하여 수행한다'고 정해 기소 권한을 검사에게 맡기고(기소독점주의), 제247조는 '검사는 「형법」 제51조의 사항을 참작하여 공소를 제기하지 아니할 수 있다'고 정해 기소 여부를 검사의 재량에 둡니다(기소편의주의). 검사의 불기소를 다투는 길로는 법원에 내는 재정신청(제260조)이 있습니다. 예외로 경미한 사건의 즉결심판은 관할경찰서장 또는 관할해양경찰서장이 법원에 청구합니다(즉결심판에 관한 절차법 제3조 제1항).", "say": "Korea has no grand jury. As a rule, criminal charges are brought by prosecutors, with summary trials for petty offenses as an exception, and prosecutors have discretion not to prosecute even when the evidence is sufficient.", "say_ko": "한국에는 대배심이 없습니다. 기소는 원칙적으로 검사가 하고(경미한 사건의 즉결심판은 예외), 검사는 증거가 충분해도 기소하지 않을 재량이 있습니다."}}, "quiz": [{"q": "검사가 대배심을 거치지 않고 직접 내는 기소장은?", "options": ["indictment", "information", "subpoena", "warrant"], "answer": 1, "why": "indictment는 대배심이 낸 기소장, subpoena는 증인 소환장(→ 3장), warrant는 영장입니다. 이때 information은 셀 수 있어 an information이라고 씁니다."}, {"q": "수정헌법 제4조가 영장 발부의 요건으로 정한 것은?", "options": ["reasonable doubt", "probable cause", "due process"], "answer": 1, "why": "no warrants shall issue, but upon probable cause — 상당한 이유가 없으면 영장을 발부하지 못합니다. beyond a reasonable doubt는 유죄 인정의 기준입니다(→ 7장)."}, {"q": "'He is in custody.'의 뜻은?", "options": ["그는 양육권을 가지고 있다.", "그는 구금되어 있다.", "그는 세관을 통과했다."], "answer": 1, "why": "형사에서 custody는 구금. 양육권은 child custody(→ 11장), 세관은 customs입니다."}, {"q": "문법: 빈칸에 맞는 것은? — He was charged ____ fraud.", "options": ["for", "of", "with"], "answer": 2, "why": "be charged with + 혐의. 체포는 be arrested for, 비난·고발은 be accused of로 전치사가 다릅니다.", "grammar": "G4"}, {"q": "번역해 보세요: The suspect was released on bail.", "options": ["피의자는 보석으로 풀려났다.", "피의자는 보석 청구가 기각되었다.", "피의자는 보석금을 몰수당했다."], "answer": 0, "why": "released on bail = 보석으로 석방되다. 보석이 기각되는 것은 be denied bail입니다. was released는 수동태."}]}, {"chapter": {"num": 7, "title": "형사 ②", "subtitle": "재판과 양형", "title_en": "Criminal Procedure II — Trial and Sentencing", "lead": "기소된 피고인은 먼저 법정에서 유죄인지 아닌지 답합니다. 연방대법원은 2012년 판결에서 미국 연방 유죄 판결의 97%가 유죄 답변(guilty plea)의 결과라고 적었습니다(→ 「명판결 명문장」). 재판까지 가면 검사는 '합리적 의심의 여지 없이' 증명해야 합니다. 이 장은 답변부터 평결, 그리고 형을 정하는 양형까지의 말을 다룹니다.", "can_say": [{"en": "The defendant pleaded not guilty at the arraignment.", "ko": "피고인은 기소인부절차에서 무죄라고 답변했습니다."}, {"en": "The prosecution must prove guilt beyond a reasonable doubt.", "ko": "검찰은 합리적 의심의 여지 없이 유죄를 증명해야 합니다."}, {"en": "One of the defendants was sentenced to five years in prison.", "ko": "피고인 중 한 명은 징역 5년을 선고받았습니다."}]}, "entries": [{"id": "arraignment", "hw": "arraignment · arraign", "ipa": "əˈreɪn.mənt · əˈreɪn", "stress": "ar·**raign**·ment · ar·**raign**", "stars": 2, "gloss": "기소인부절차(피고인에게 공소사실을 알리고 유죄 여부 답변을 받는 첫 기일) · 기소인부절차에 회부하다", "pron_tip": "g는 소리 나지 않습니다. reign(통치)과 같은 소리 /reɪn/이 가운데 들어 있습니다.", "diff": "한국 형사재판의 첫 공판기일에서 공소사실 인부를 묻는 것과 비슷하지만, 미국에서는 여기서 유죄라고 답하면 배심재판 없이 곧바로 양형 단계로 넘어갑니다. 한국에는 이렇게 재판을 생략하는 제도가 없습니다.", "examples": {"easy": {"en": "The arraignment is set for Monday.", "ko": "기소인부절차는 월요일로 잡혀 있다."}, "practice": {"en": "At the arraignment, the judge read the charges and asked how the defendant pleaded.", "ko": "기소인부절차에서 판사는 공소사실을 읽고 피고인에게 어떻게 답변하는지 물었다."}, "source": {"en": "An arraignment must be conducted in open court and must consist of: (1) ensuring that the defendant has a copy of the indictment or information;", "ko": "기소인부절차는 공개 법정에서 진행되어야 하고, 다음으로 이루어져야 한다. (1) 피고인이 대배심 기소장 또는 정식 기소장 사본을 가지고 있는지 확인하는 것 …", "cite": "Fed. R. Crim. P. 10(a)", "url": "https://www.law.cornell.edu/rules/frcrmp/rule_10", "glossary": {"open court": "공개 법정", "indictment / information": "대배심 기소장 / 검사의 정식 기소장(→ 6장)"}}}, "grammar": {"axis": "G1", "title": "정해진 그 기일에는 the", "wrong": "At arraignment of this case, he pleaded not guilty.", "right": "At the arraignment, he pleaded not guilty.", "note": "특정 사건의 그 기일을 가리키면 the. 절차 이름 일반을 말할 때는 관사 없이 'at arraignment'라고도 씁니다."}, "collocations": ["be arraigned on charges of …", "arraignment hearing", "waive arraignment (출석을 면제받다)"], "links": [{"label": "LII Wex — arraignment", "url": "https://www.law.cornell.edu/wex/arraignment"}]}, {"id": "plead", "hw": "plead guilty · plead not guilty", "ipa": "pliːd ˈɡɪl.ti · pliːd nɑːt ˈɡɪl.ti", "stress": "plead **guil**·ty · plead **not** **guil**·ty", "stars": 3, "gloss": "유죄라고 답변하다 · 무죄라고 답변하다", "pron_tip": "과거형은 pleaded가 표준이고, 미국 구어에서는 pled /pled/도 씁니다.", "diff": "guilty plea는 '자백'과 다릅니다. 한국에서는 자백해도 증거조사를 거쳐 판결하지만, 미국에서 유죄 답변이 받아들여지면 재판 없이 양형으로 갑니다.", "examples": {"easy": {"en": "He pleaded not guilty.", "ko": "그는 무죄라고 답변했다."}, "practice": {"en": "Under the plea agreement, she will plead guilty to one count of fraud.", "ko": "유죄협상 합의에 따라 그녀는 사기 1개 죄목에 대해 유죄를 인정할 것이다."}, "source": {"en": "A defendant may plead not guilty, guilty, or (with the court's consent) nolo contendere.", "ko": "피고인은 무죄, 유죄 또는 (법원의 동의를 받아) 불항쟁 답변을 할 수 있다.", "cite": "Fed. R. Crim. P. 11(a)(1)", "url": "https://www.law.cornell.edu/rules/frcrmp/rule_11", "glossary": {"consent": "동의", "nolo contendere": "불항쟁 답변(→ 이 장 no contest)"}}}, "box": "판사는 유죄 답변을 그냥 받지 않습니다. 피고인에게 직접 배심재판을 받을 권리 등을 알리고 이해했는지 확인하며(Rule 11(b)(1)), 답변을 뒷받침할 사실의 근거(factual basis)가 있는지도 따집니다(Rule 11(b)(3)).", "grammar": {"axis": "G4", "title": "plead guilty to + 죄명", "wrong": "She pleaded guilty for fraud.", "right": "She pleaded guilty to fraud.", "note": "무엇에 대해 유죄를 인정하는지는 to로 잇습니다. 명사로는 a guilty plea, enter a plea of guilty."}, "collocations": ["plead guilty to", "enter a plea", "withdraw a guilty plea", "plea agreement / plea deal (→ 6장 plea bargain)"], "links": [{"label": "LII Wex — plea", "url": "https://www.law.cornell.edu/wex/plea"}]}, {"id": "no-contest", "hw": "no contest (nolo contendere)", "ipa": "noʊ ˈkɑːn.test · ˌnoʊ.loʊ kənˈten.də.ri", "stress": "no **con**·test · no·lo con·**ten**·de·re", "stars": 1, "pron_tip": "nolo contendere는 발음 사전(Cambridge US) 미수록이라 미국 법조 관행 발음으로 적었습니다.", "gloss": "불항쟁 답변(유죄를 인정하지도 다투지도 않는다는 답변)", "diff": "형사에서는 유죄 답변처럼 처리되어 형을 받지만, 같은 사건의 민사소송에서 그 답변을 피고인에게 불리한 증거로 쓸 수 없다는 점이 다릅니다(Fed. R. Evid. 410(a)(2)). 한국에는 대응하는 제도가 없습니다.", "examples": {"easy": {"en": "She pleaded no contest.", "ko": "그녀는 불항쟁 답변을 했다."}, "practice": {"en": "The court must decide whether to accept a plea of nolo contendere.", "ko": "법원은 불항쟁 답변을 받아들일지 결정해야 한다."}, "source": {"en": "Before accepting a plea of nolo contendere, the court must consider the parties' views and the public interest in the effective administration of justice.", "ko": "불항쟁 답변을 받아들이기 전에 법원은 당사자들의 의견과 효율적인 사법 운영이라는 공익을 고려하여야 한다.", "cite": "Fed. R. Crim. P. 11(a)(3)", "url": "https://www.law.cornell.edu/rules/frcrmp/rule_11", "glossary": {"administration of justice": "사법 운영"}}}, "grammar": {"axis": "G6", "title": "plea는 enter와 짝을 이룬다", "wrong": "He made a plea of no contest.", "right": "He entered a plea of no contest.", "note": "답변을 '하다'는 enter a plea. 동사로 쓰면 plead no contest."}, "collocations": ["enter a plea of no contest", "plead nolo contendere"], "links": [{"label": "LII Wex — nolo contendere", "url": "https://www.law.cornell.edu/wex/nolo_contendere"}]}, {"id": "presumption-of-innocence", "hw": "presumption of innocence", "ipa": "prɪˌzʌmp.ʃən əv ˈɪn.ə.səns", "stress": "pre·sump·tion of **in**·no·cence", "stars": 3, "gloss": "무죄추정", "examples": {"easy": {"en": "Everyone is presumed innocent.", "ko": "모든 사람은 무죄로 추정된다."}, "practice": {"en": "The defendant is presumed innocent until proven guilty beyond a reasonable doubt.", "ko": "피고인은 합리적 의심의 여지 없이 유죄가 증명될 때까지 무죄로 추정된다."}, "source": {"en": "The principle that there is a presumption of innocence in favor of the accused is the undoubted law, axiomatic and elementary, and its enforcement lies at the foundation of the administration of our criminal law.", "ko": "피고인에게 유리한 무죄추정이 있다는 원칙은 의심할 바 없는 법이고 자명하고 기본적인 것이며, 그 실현은 우리 형사법 운영의 기초를 이룬다.", "cite": "Coffin v. United States, 156 U.S. 432 (1895)", "url": "https://www.law.cornell.edu/supremecourt/text/156/432", "glossary": {"the accused": "피고인", "axiomatic": "자명한"}}}, "box": "미국 헌법 조문에는 '무죄추정'이라는 말이 나오지 않습니다. 연방대법원은 Coffin(1895)에서 이를 형사법의 기초 원칙으로 선언했고, In re Winship(1970)은 합리적 의심 기준이 이 원칙에 '구체적 실질'을 준다고 했습니다. 한국은 헌법 제27조 제4항에 명문 규정이 있습니다.", "grammar": {"axis": "G7", "title": "be presumed innocent — 수동태 관용구", "wrong": "He presumes innocent.", "right": "He is presumed innocent.", "note": "추정하는 주체는 법이므로 수동태로 말합니다. until proven guilty도 줄인 수동(until he is proven guilty)입니다."}, "collocations": ["presumed innocent until proven guilty", "overcome the presumption", "the presumption of innocence"], "links": [{"label": "LII Wex — presumption of innocence", "url": "https://www.law.cornell.edu/wex/presumption_of_innocence"}]}, {"id": "beyond-a-reasonable-doubt", "hw": "beyond
