state, 집행하는 사람은 executor."], "links": [{"label": "LII Wex — will", "url": "https://www.law.cornell.edu/wex/will"}, {"label": "LII Wex — testator", "url": "https://www.law.cornell.edu/wex/testator"}]}, {"id": "probate", "hw": "probate", "ipa": "ˈproʊ.beɪt", "stress": "**pro**·bate", "stars": 2, "false_friend": true, "gloss": "검인(유언의 효력 확인) 및 상속재산 정리 절차", "diff": "법원이 유언장이 유효한지 확인하고, 채무를 갚고, 남은 재산을 나누는 절차 전체를 가리킵니다. 한국 민법의 검인(제1091조)은 유언증서·녹음을 보관하거나 발견한 사람이 유언자 사망 뒤 법원에 제출해 받는 절차로, 공정증서·구수증서 유언에는 적용되지 않습니다. 재산 정리까지 아우르는 probate보다 범위가 훨씬 좁습니다. 비슷한 철자의 probation(보호관찰, → 7장)과 혼동하지 마세요.", "examples": {"easy": {"en": "The will is in probate now.", "ko": "그 유언은 지금 검인 절차 중이다."}, "practice": {"en": "Assets held in a living trust do not go through probate.", "ko": "생전신탁에 넣어 둔 재산은 검인 절차를 거치지 않는다."}}, "grammar": {"axis": "G5", "title": "go through probate / avoid probate", "wrong": "The house passed the probate.", "right": "The house went through probate.", "note": "절차 이름이라 무관사로 씁니다. '거치다'는 go through, '피하다'는 avoid. 동사로도 써서 probate a will(유언을 검인받다)."}, "collocations": ["go through probate", "avoid probate", "probate court (검인법원)", "probate a will"], "links": [{"label": "LII Wex — probate", "url": "https://www.law.cornell.edu/wex/probate"}]}, {"id": "executor", "hw": "executor · administrator", "ipa": "ɪɡˈzek.jə.t̬ɚ · ədˈmɪn.ə.streɪ.t̬ɚ", "stress": "ex·**ec**·u·tor · ad·**min**·is·tra·tor", "stars": 2, "gloss": "유언집행자 · (유언이 없을 때 법원이 선임하는) 상속재산 관리인", "diff": "유언장에서 지명한 사람이 executor, 유언이 없거나 지명된 사람이 없어 법원이 선임한 사람이 administrator입니다. 둘을 함께 personal representative라고도 부릅니다.", "examples": {"easy": {"en": "He named his sister as executor.", "ko": "그는 누나를 유언집행자로 지명했다."}, "practice": {"en": "The court appointed an administrator because there was no will.", "ko": "유언이 없었기 때문에 법원이 상속재산 관리인을 선임했다."}, "source": {"en": "commenced suit in Federal District Court against an executor and resident heirs to determine the Custodian's asserted rights regarding a decedent's estate", "ko": "사망자의 상속재산에 관하여 (외국인재산)관리관이 주장하는 권리를 확정하기 위해 유언집행자와 미국 거주 상속인들을 상대로 연방지방법원에 소를 제기했다", "cite": "Marshall v. Marshall, 547 U.S. 293 (2006) (Markham v. Allen 사건 설명)", "url": "https://www.law.cornell.edu/supct/html/04-1544.ZO.html", "glossary": {"commence suit": "소를 제기하다", "resident heirs": "(미국에) 거주하는 상속인들"}}}, "grammar": {"axis": "G4", "title": "executor of the will / named as executor in the will", "wrong": "the executor for his will", "right": "the executor of his will / named as executor in the will", "note": "'~의' 집행자는 of. 유언장 '안에서' 지명되었다는 것은 in. named as executor처럼 역할 명사 앞의 관사는 흔히 생략합니다."}, "collocations": ["executor of the estate", "appoint an administrator", "personal representative", "letters testamentary (유언집행자 선임장)"], "links": [{"label": "LII Wex — executor", "url": "https://www.law.cornell.edu/wex/executor"}, {"label": "LII Wex — administrator", "url": "https://www.law.cornell.edu/wex/administrator"}]}, {"id": "intestate", "hw": "intestate · intestacy", "ipa": "ɪnˈtes.teɪt · ɪnˈtes.tə.si", "stress": "in·**tes**·tate · in·**tes**·ta·cy", "stars": 2, "gloss": "유언 없이 (사망한) · 무유언 상속", "diff": "유언 없이 사망하면 주법이 정한 순서(intestate succession)에 따라 재산이 넘어갑니다. 한국 민법의 법정상속에 해당하지만, 상속 순위와 몫은 주마다 다릅니다.", "examples": {"easy": {"en": "He died intestate.", "ko": "그는 유언 없이 사망했다."}, "practice": {"en": "Under the intestacy laws, the estate passes to the surviving spouse and children.", "ko": "무유언 상속법에 따라 상속재산은 생존 배우자와 자녀에게 넘어간다."}, "source": {"en": "the laws of intestate succession (generally prioritizing children and current spouses) would control the estate's distribution", "ko": "무유언 상속에 관한 법(대체로 자녀와 현재 배우자를 앞세운다)이 상속재산의 분배를 정하게 된다", "cite": "Sveen v. Melin, No. 16-1432 (U.S. June 11, 2018)", "url": "https://www.law.cornell.edu/supremecourt/text/16-1432", "glossary": {"intestate succession": "무유언 상속(법정상속)", "prioritize": "우선시하다"}}}, "grammar": {"axis": "G6", "title": "die intestate — 동사 뒤 형용사", "wrong": "He died with intestate. / He was dead intestate.", "right": "He died intestate.", "note": "intestate는 die 바로 뒤에 붙는 형용사입니다(die young과 같은 구조). 명사형 intestacy는 '무유언 상태·무유언 상속'."}, "collocations": ["die intestate", "intestate succession", "intestacy laws / statutes", "partial intestacy"], "links": [{"label": "LII Wex — intestate", "url": "https://www.law.cornell.edu/wex/intestate"}, {"label": "LII Wex — intestacy", "url": "https://www.law.cornell.edu/wex/intestacy"}]}, {"id": "heir", "hw": "heir · beneficiary", "ipa": "er · ˌben.əˈfɪʃ.i.er.i", "stress": "**heir** · ben·e·**fi**·ci·ar·y", "stars": 3, "gloss": "(법정) 상속인 · (유언·신탁·보험의) 수익자", "pron_tip": "heir의 h는 소리 나지 않아 air와 똑같이 들립니다. heiress, heirloom도 마찬가지입니다.", "diff": "heir는 유언이 없을 때 법에 따라 상속받는 사람이고, beneficiary는 유언장·신탁·보험계약에서 받을 사람으로 지명된 사람입니다. 한국어로는 둘 다 '상속인'으로 옮기기 쉬워 구별해야 합니다.", "examples": {"easy": {"en": "He is an heir to a fortune.", "ko": "그는 막대한 재산의 상속인이다."}, "practice": {"en": "Her daughter is the sole beneficiary under the will, so the other heirs receive nothing.", "ko": "유언상 딸이 유일한 수익자이므로 다른 상속인들은 아무것도 받지 못한다."}, "source": {"en": "federal courts have jurisdiction to entertain suits to determine the rights of creditors, legatees, heirs, and other claimants against a decedent's estate", "ko": "연방법원은 사망자의 상속재산에 대한 채권자, 수유자, 상속인, 그 밖의 청구권자의 권리를 확정하는 소송을 심리할 관할권이 있다", "cite": "Marshall v. Marshall, 547 U.S. 293 (2006) (Markham v. Allen 인용)", "url": "https://www.law.cornell.edu/supct/html/04-1544.ZO.html", "glossary": {"legatee": "수유자(유언으로 재산을 받는 사람)", "entertain suits": "소송을 심리하다", "claimant": "청구권자"}}}, "grammar": {"axis": "G1", "title": "an heir — 철자가 아니라 소리를 본다", "wrong": "He is a heir.", "right": "He is an heir. / an honest judge / an hour", "note": "a와 an은 첫 '소리'로 고릅니다. h가 소리 나지 않으면 모음으로 시작하므로 an. 반대로 a university, a one-time payment는 소리가 자음이라 a."}, "collocations": ["heir to the throne / fortune", "rightful heir", "named beneficiary", "designate a beneficiary"], "links": [{"label": "LII Wex — heir", "url": "https://www.law.cornell.edu/wex/heir"}, {"label": "LII Wex — beneficiary", "url": "https://www.law.cornell.edu/wex/beneficiary"}]}, {"id": "trust", "hw": "trust · trustee · settlor", "ipa": "trʌst · ˌtrʌsˈtiː · ˈset.lɚ", "stress": "**trust** · trus·**tee** · **set**·tlor", "stars": 3, "pron_tip": "Cambridge에 settlor 표제어는 있으나 발음 표기가 없어, 보조 사전 Wiktionary의 미국식(GA) 표기 /ˈsɛt.lɚ/와 대조해 적었습니다. settler(정착민)와 소리가 같습니다.", "false_friend": true, "gloss": "신탁 · 수탁자 · 위탁자(신탁을 설정한 사람)", "diff": "일상어 trust는 '신뢰'입니다. 신탁은 위탁자(settlor)가 재산을 수탁자(trustee)에게 넘기고, 수탁자가 수익자(beneficiary)를 위해 관리하는 구조입니다. 미국에서는 검인 절차를 피하는 상속 수단으로 생전신탁(living trust)을 널리 씁니다. 도산의 trustee(관재인)와는 다른 역할입니다(→ 13장).", "examples": {"easy": {"en": "Her parents set up a trust for her.", "ko": "부모는 그녀를 위해 신탁을 설정했다."}, "practice": {"en": "The trustee must manage the trust assets solely in the interest of the beneficiaries.", "ko": "수탁자는 오로지 수익자들의 이익을 위해 신탁재산을 관리해야 한다."}, "source": {"en": "In its simplest form, a trust is created when one person (a \"settlor\" or \"grantor\") transfers property to a third party (a \"trustee\") to administer for the benefit of another (a \"beneficiary\").", "ko": "가장 단순한 형태로 말하면, 신탁은 한 사람(위탁자)이 재산을 제3자(수탁자)에게 이전하여 다른 사람(수익자)의 이익을 위해 관리하게 할 때 성립한다.", "cite": "North Carolina Dept. of Revenue v. Kimberley Rice Kaestner 1992 Family Trust, No. 18-457 (U.S. June 21, 2019)", "url": "https://www.law.cornell.edu/supremecourt/text/18-457", "glossary": {"grantor": "위탁자(settlor와 같은 뜻)", "for the benefit of": "~의 이익을 위하여"}}}, "grammar": {"axis": "G4", "title": "in trust for / for the benefit of", "wrong": "The house is held in trust to her children.", "right": "The house is held in trust for her children.", "note": "'~를 위하여' 신탁으로 보유하는 것은 in trust for. 격식체로는 for the benefit of. trustee는 끝 음절에 강세가 옵니다. 다만 -ee로 끝나는 말이 모두 그렇지는 않으니(employee는 Cambridge US 대표 표기가 /ɪmˈplɔɪ.iː/) 사전에서 하나씩 확인합니다."}, "collocations": ["set up / establish a trust", "hold in trust for", "living trust (생전신탁)", "breach of trust (신탁 위반)"], "links": [{"label": "LII Wex — trust", "url": "https://www.law.cornell.edu/wex/trust"}, {"label": "LII Wex — trustee", "url": "https://www.law.cornell.edu/wex/trustee"}, {"label": "LII Wex — settlor", "url": "https://www.law.cornell.edu/wex/settlor"}]}, {"id": "power-of-attorney", "hw": "power of attorney", "ipa": "ˈpaʊ.ɚ əv əˈtɝː.ni", "stress": "**pow**·er of at·**tor**·ney", "stars": 2, "false_friend": true, "gloss": "(대리권을 주는) 위임장, 대리권 수여", "diff": "여기서 attorney는 변호사가 아니라 '대리인'입니다. 위임을 받는 사람을 attorney in fact라고 부르고, 변호사(attorney at law)일 필요가 없습니다. 본인이 판단 능력을 잃은 뒤에도 효력이 남게 만든 것을 durable power of attorney라고 합니다.", "examples": {"easy": {"en": "She gave her son power of attorney.", "ko": "그녀는 아들에게 대리권을 주었다."}, "practice": {"en": "My father signed a durable power of attorney before his surgery.", "ko": "아버지는 수술 전에 지속적 대리권 위임장에 서명했다."}}, "grammar": {"axis": "G2", "title": "복수는 powers of attorney", "wrong": "two power of attorneys", "right": "two powers of attorney", "note": "핵심 명사는 power이므로 복수 s는 power에 붙습니다. attorney general → attorneys general, mother-in-law → mothers-in-law와 같은 원리."}, "collocations": ["grant / give power of attorney", "durable power of attorney", "attorney in fact (임의대리인)", "revoke a power of attorney"], "pitfalls": ["power of attorney를 '변호사의 권한'으로 옮기는 실수. 의뢰인이 변호사를 선임할 때 맺는 engagement letter·retainer agreement는 업무 범위와 보수를 정하는 위임계약 문서로, 대리권을 주는 power of attorney와 기능이 다릅니다. 소송대리권을 어떤 문서로 증명하는지는 관할마다 다릅니다."], "links": [{"label": "LII Wex — power of attorney", "url": "https://www.law.cornell.edu/wex/power_of_attorney"}]}, {"id": "inheritance", "hw": "inheritance · inherit", "ipa": "ɪnˈher.ɪ.təns · ɪnˈher.ɪt", "stress": "in·**her**·i·tance · in·**her**·it", "stars": 2, "gloss": "상속(받은 재산) · 상속받다", "examples": {"easy": {"en": "She inherited the house from her aunt.", "ko": "그녀는 고모에게서 그 집을 상속받았다."}, "practice": {"en": "In his will, he left the farm to his two nephews.", "ko": "그는 유언으로 농장을 두 조카에게 남겼다."}, "source": {"en": "taxation; inheritance and property rights; rules of intestate succession", "ko": "조세, 상속권과 재산권, 무유언 상속의 규칙", "cite": "Obergefell v. Hodges, 576 U.S. 644 (2015) (혼인에 따르는 법적 효과를 나열한 부분)", "url": "https://www.law.cornell.edu/supremecourt/text/14-556"}}, "grammar": {"axis": "G4", "title": "inherit A from B · leave A to B", "wrong": "She inherited the house by her aunt. / He inherited the farm to his nephews.", "right": "She inherited the house from her aunt. / He left the farm to his nephews.", "note": "받는 쪽에서는 inherit … from(~에게서), 주는 쪽에서는 leave … to(~에게). 한국어 '~에게'에 끌려 inherit to라고 쓰지 않도록 합니다. left the farm for his nephews는 틀린 문장은 아니지만 '조카들을 위해 남겨 두었다'는 수혜의 뜻으로 읽힙니다. 유언으로 받을 사람을 분명히 하는 정형구는 leave A to B입니다(Cambridge: He left all his money to his nieces)."}, "collocations": ["inherit from", "leave property to", "receive an inheritance", "inheritance tax (상속세 — 미국 연방은 estate tax)"], "links": [{"label": "LII Wex — inheritance", "url": "https://www.law.cornell.edu/wex/inheritance"}]}, {"id": "elective-share", "hw": "elective share", "ipa": "ɪˈlek.tɪv ʃer", "stress": "e·**lec**·tive **share**", "stars": 1, "gloss": "배우자 선택분(유언과 관계없이 생존 배우자가 고를 수 있는 몫)", "diff": "유언으로 배우자를 상속에서 빼더라도 생존 배우자는 유언 대신 법정 몫을 선택할 수 있습니다. LII Wex에 따르면 전통적으로 그 몫은 상속재산의 3분의 1이고, 부부공동재산제가 아닌 주에서 둡니다. 생존 배우자를 보호하는 제도라는 점에서, 직계비속·직계존속에게도 인정되는 한국 유류분과 다릅니다(→ 「한국이라면?」).", "examples": {"easy": {"en": "The widow took her elective share.", "ko": "미망인은 배우자 선택분을 택했다."}, "practice": {"en": "Although the will left everything to his children, his wife elected against the will and claimed one-third of the estate.", "ko": "유언은 전 재산을 자녀들에게 남겼지만, 아내는 유언 대신 선택분을 택해 상속재산의 3분의 1을 청구했다."}}, "grammar": {"axis": "G4", "title": "elect against the will", "wrong": "She elected opposite to the will.", "right": "She elected against the will.", "note": "against는 '반대하여'뿐 아니라 '~에 맞서 (대신) 선택하다'의 뜻으로 이 관용구에 쓰입니다. 그래서 elective share를 election against the will이라고도 부릅니다."}, "collocations": ["claim / take the elective share", "elect against the will", "surviving spouse", "forced share"], "links": [{"label": "LII Wex — elective share", "url": "https://www.law.cornell.edu/wex/elective_share"}]}], "corners": {"false_friend": {"title": "will은 미래가 아니다", "body": ["'He left no will.'을 '그는 의지를 남기지 않았다'로 읽으면 사건이 사라집니다. 상속 문맥의 will은 유언장입니다. 이 장에는 이렇게 아는 단어가 다른 뜻으로 쓰이는 경우가 유난히 많습니다.", "custody는 6장에서는 '구금', 이 장에서는 '양육권'입니다. 같은 판결문에 둘 다 나올 수 있으니(아동 학대로 체포된 부모의 양육권 박탈 등) 주어가 경찰인지 법원·부모인지로 가려 읽습니다."], "table": [["will", "~할 것이다 / 의지", "유언(장)"], ["custody", "보관", "양육권(형사에서는 구금 → 6장)"], ["estate", "넓은 사유지", "(사망자의) 상속재산"], ["trust", "신뢰", "신탁"], ["execute", "실행하다, 처형하다", "(유언장을) 작성·서명하다"], ["probate", "(probation과 혼동)", "검인·상속재산 정리 절차"], ["power of attorney", "변호사의 권한?", "대리권 위임(장)"]], "tip": "외우는 요령: 문장에 died·decedent·testator가 보이면 will·estate·execute를 상속 뜻으로 먼저 읽어 보세요."}, "drama": {"title": "Kramer vs. Kramer (1979)", "facts": ["1979년 미국 영화. 감독·각본 로버트 벤턴, 주연 더스틴 호프먼·메릴 스트립. 에이버리 코먼의 1977년 소설이 원작입니다.", "제52회 아카데미 시상식에서 작품상·감독상·남우주연상(호프먼)·여우조연상(스트립)·각색상을 받았습니다.", "이혼한 부부가 어린 아들의 양육권을 두고 법정에서 다투는 이야기입니다."], "watch": "아버지 테드가 이혼 전문 변호사를 찾아가자, 변호사는 아이가 어리면 법원이 대개 어머니에게 양육권을 준다고 경고합니다. 양육권 심리(custody hearing)에서는 테드의 실직이 그에게 불리한 사정으로 쓰입니다. 개봉 당시 법조계에서는 아이의 의사를 묻지 않고 공동양육(joint custody)도 검토하지 않는 법정 장면이 이미 시대에 뒤졌다는 비판이 나왔습니다. 그 비판 자체가 이후 미국 가족법이 걸어온 방향, 곧 '자녀의 최선의 이익' 기준과 공동양육을 보여 줍니다.", "terms": ["custody hearing", "award custody to", "joint custody", "divorce attorney", "appeal"], "links": [{"label": "Wikipedia — Kramer vs. Kramer", "url": "https://en.wikipedia.org/wiki/Kramer_vs._Kramer"}, {"label": "YouTube — 호주 배급사 공식 예고편 (Umbrella Entertainment)", "url": "https://www.youtube.com/watch?v=OXw67SqTtNg"}]}, "quote": {"text": "No union is more profound than marriage, for it embodies the highest ideals of love, fidelity, devotion, sacrifice, and family.", "ko": "혼인보다 더 깊은 결합은 없다. 혼인은 사랑, 신의, 헌신, 희생, 그리고 가족이라는 가장 높은 이상을 담고 있기 때문이다.", "case": "Obergefell v. Hodges, 576 U.S. 644 (2015)", "decided": "2015. 6. 26. 선고", "gloss": {"union": "결합", "profound": "깊은, 심오한", "embody": "구현하다, 담다", "fidelity": "(배우자에 대한) 정절, 신의"}, "why": "케네디 대법관이 쓴 법정의견(5 대 4)의 마지막 단락 첫 문장입니다. 동성 커플의 혼인할 권리를 인정한 판결이 혼인을 깎아내리는 것이 아니라 오히려 혼인을 높이 평가하기 때문에 나온 결론이라는 점을 이 문장으로 보여 줍니다.", "links": [{"label": "LII — Obergefell 판결 원문", "url": "https://www.law.cornell.edu/supremecourt/text/14-556"}, {"label": "Oyez — 구두변론 녹음", "url": "https://www.oyez.org/cases/2014/14-556"}]}, "korea": {"title": "잘못한 쪽도 이혼을 청구할 수 있을까?", "us": "미국은 모든 주가 무책주의 이혼(no-fault divorce) 사유를 인정합니다(2010년 뉴욕주가 마지막으로 도입, Wikipedia — No-fault divorce). LII Wex는 두 유형을 함께 두는 주가 있다고 설명합니다. 혼인이 회복할 수 없이 깨졌거나 일정 기간 별거했다는 것만으로 이혼할 수 있습니다. 다만 일부 주는 간통·유기·학대 같은 유책 이혼 사유도 함께 두고 있고(예: 사우스캐롤라이나 법전 § 20-3-10은 네 가지 유책 사유와 1년 별거를 나란히 규정), 별거 기간 같은 요건도 주마다 다릅니다. 상속에서는 부부공동재산제가 아닌 주들이 생존 배우자에게 elective share를 보장합니다.", "kr": "한국 민법 제840조는 부정행위·악의의 유기 등 재판상 이혼 사유를 정하고, 대법원은 혼인 파탄에 책임 있는 배우자의 이혼청구를 원칙적으로 받아들이지 않습니다(대법원 2015. 9. 15. 선고 2013므568 전원합의체 판결 — 예외는 인정). 상속에서는 유류분이 직계비속·배우자에게 법정상속분의 2분의 1, 직계존속에게 3분의 1로 보장됩니다(제1112조). 형제자매의 유류분은 헌법재판소가 2024. 4. 25. 위헌으로 결정(2020헌가4 등)한 뒤 2024. 9. 20. 개정으로 삭제되었습니다. 이어 2026. 3. 17. 개정 민법(법률 제21454호, 공포한 날 시행)은 세 가지를 바꿨습니다. 피상속인을 특별히 부양하거나 재산 유지·증가에 특별히 기여한 데 대한 보상으로 한 증여·유증은 기여에 상응하는 범위에서 특별수익으로 보지 않습니다(제1008조 단서 — 제1118조가 이 조를 유류분에 준용). 상속권 상실 선고(제1004조의2)는 직계존속에 한정하지 않고 상속인이 될 사람 전반으로 넓혔습니다. 유류분이 부족하면 재산 반환 대신 부족한 한도의 가액 지급을 청구하고 청구한 날부터 이자를 더하게 했습니다(제1115조 제1항).", "say": "In Korea, a spouse who caused the breakdown of the marriage generally cannot obtain a divorce through the courts. Korea also guarantees children a minimum share of the estate, called yuryubun.", "say_ko": "한국에서는 혼인 파탄에 책임 있는 배우자는 원칙적으로 재판으로 이혼할 수 없습니다. 또 한국은 자녀에게 상속재산의 최소 몫, 곧 유류분을 보장합니다."}}, "quiz": [{"q": "법정에서 'custody of the children'의 뜻은?", "options": ["아이들의 구금", "아이들에 대한 양육권", "아이들의 보관"], "answer": 1, "why": "가족법에서 custody는 양육권. 형사에서 in custody는 '구금 중'입니다(→ 6장)."}, {"q": "유언 없이 사망한 사람의 상태를 가리키는 말은?", "options": ["testate", "intestate", "probate", "estate"], "answer": 1, "why": "intestate = 유언 없이. 유언을 남기고 죽은 것은 testate, probate는 검인 절차, estate는 상속재산입니다."}, {"q": "유언장에서 지명되어 유언을 집행하는 사람은?", "options": ["executor", "testator", "settlor"], "answer": 0, "why": "testator는 유언자, settlor는 신탁의 위탁자. 법원이 선임하는 관리인은 administrator입니다."}, {"q": "문법: 빈칸에 맞는 것은? — In his will, he left the house ____ his daughter.", "options": ["with", "to", "from"], "answer": 1, "why": "주는 쪽은 leave A to B(~에게 남기다), 받는 쪽은 inherit A from B(~에게서 상속받다). left the house with his daughter는 '딸에게 맡겨 두었다'는 뜻이 되고, from은 방향이 반대입니다.", "grammar": "G4"}, {"q": "번역해 보세요: The court awarded joint custody to both parents.", "options": ["법원은 부모 양쪽에게 공동양육권을 인정했다.", "법원은 부모 양쪽을 공동으로 구금했다.", "법원은 부모에게 양육비를 함께 내라고 명했다."], "answer": 0, "why": "award A to B = B에게 A를 인정하다. 양육비는 child support입니다."}]}, {"chapter": {"num": 12, "title": "회사·상사", "subtitle": "", "title_en": "Corporations and Business Law", "lead": "미국에는 일반 회사를 설립하는 연방 회사법이 없습니다(국법은행처럼 연방법으로 설립하는 예외는 있습니다). 일반 회사는 각 주의 법으로 설립되므로, 이 장의 회사법 원문 예문은 델라웨어주 일반회사법에서 가져왔습니다. 반면 증권 시장은 연방법(증권법·증권거래법)과 증권거래위원회(SEC)가 규율합니다. 이 장은 회사 안의 말(주주·이사회·신인의무)과 시장의 말(증권·내부자거래)을 함께 다룹니다.", "can_say": [{"en": "The directors owe a fiduciary duty to the corporation and its shareholders.", "ko": "이사는 회사와 주주에게 신인의무를 집니다."}, {"en": "She holds 500 shares of stock in the company.", "ko": "그녀는 그 회사 주식 500주를 갖고 있습니다."}, {"en": "The SEC charged three executives with insider trading.", "ko": "SEC는 임원 세 명을 내부자거래 혐의로 제소했습니다."}]}, "entries": [{"id": "corporation", "hw": "corporation · company", "ipa": "ˌkɔːr.pəˈreɪ.ʃən · ˈkʌm.pə.ni", "stress": "cor·po·**ra**·tion · **com**·pa·ny", "stars": 3, "uk": "company (영국 회사법의 기본 용어. 미국 corporation에 해당하는 것은 company limited by shares)", "gloss": "회사(법인)", "diff": "미국 법률 문장에서 회사법상 '법인 회사'를 정확히 가리키는 말은 corporation입니다. company는 일상어로 넓게 쓰여 조합이나 LLC까지 포함할 수 있습니다. 미국의 일반 회사 설립과 내부관계는 주법이 정합니다. 연방법으로 설립되는 국법은행(national banking association, 12 U.S.C. § 21) 같은 예외가 있을 뿐입니다.", "examples": {"easy": {"en": "Acme is a Delaware corporation.", "ko": "애크미는 델라웨어주 회사다."}, "practice": {"en": "The corporation is liable for its own debts, not the shareholders.", "ko": "회사의 채무는 주주가 아니라 회사 자신이 진다."}, "source": {"en": "It is a general principle of corporate law that a parent corporation (so-called because of control through ownership of another corporation's stock) is not liable for the acts of its subsidiaries.", "ko": "모회사(다른 회사의 주식을 보유해 지배하므로 그렇게 부른다)는 자회사의 행위에 책임을 지지 않는다는 것이 회사법의 일반 원칙이다.", "cite": "United States v. Bestfoods, 524 U.S. 51, 61 (1998)", "url": "https://www.law.cornell.edu/supremecourt/text/524/51", "glossary": {"parent corporation": "모회사", "subsidiary": "자회사"}}}, "grammar": {"axis": "G1", "title": "a Delaware corporation — 주 이름이 앞에 와도 a", "wrong": "Acme is Delaware corporation.", "right": "Acme is a Delaware corporation.", "note": "소장 첫머리의 당사자 표시 문형입니다. Delaware는 형용사처럼 corporation을 꾸밀 뿐이라 관사 a가 그대로 필요합니다. 회사를 받는 대명사는 it·its."}, "collocations": ["a Delaware corporation", "parent corporation / subsidiary", "publicly traded company (상장회사)", "close corporation (폐쇄회사)"], "links": [{"label": "LII Wex — corporation", "url": "https://www.law.cornell.edu/wex/corporation"}]}, {"id": "incorporate", "hw": "incorporate", "ipa": "ɪnˈkɔːr.pɚ.eɪt", "stress": "in·**cor**·po·rate", "stars": 2, "gloss": "(회사를) 설립하다, 법인으로 만들다", "pron_tip": "강세는 둘째 음절 -cor-. 명사 incorporation은 넷째 음절 -ra-로 옮겨 갑니다.", "examples": {"easy": {"en": "They incorporated the business last year.", "ko": "그들은 작년에 그 사업을 법인으로 만들었다."}, "practice": {"en": "The company is incorporated in Delaware but has its headquarters in California.", "ko": "그 회사는 델라웨어주에서 설립되었지만 본사는 캘리포니아에 있다."}, "source": {"en": "Any person, partnership, association or corporation, singly or jointly with others, and without regard to such person's or entity's residence, domicile or state of incorporation, may incorporate or organize a corporation under this chapter", "ko": "개인, 조합, 단체 또는 회사는 단독으로든 다른 사람과 함께든, 그 거소·주소나 설립지와 관계없이 이 장에 따라 회사를 설립할 수 있다", "cite": "Del. Code tit. 8, § 101(a) (델라웨어 일반회사법)", "url": "https://delcode.delaware.gov/title8/c001/sc01/index.html", "glossary": {"state of incorporation": "설립 준거 주(설립지)", "domicile": "주소"}}}, "box": "설립 신청인이 어디에 살든 델라웨어 회사를 만들 수 있다는 조문입니다. 그래서 미국에서는 본사가 있는 주와 설립 준거 주가 다른 회사가 많고, 회사의 내부 문제(이사의 의무 등)는 설립 준거 주의 법으로 판단합니다(internal affairs doctrine).", "grammar": {"axis": "G4", "title": "incorporated in / under the laws of", "wrong": "incorporated at Delaware", "right": "incorporated in Delaware / incorporated under the laws of Delaware", "note": "장소는 in, 준거법은 under. 계약서·소장의 당사자 표시에 그대로 나오는 짝입니다."}, "collocations": ["incorporated in Delaware", "state of incorporation", "certificate of incorporation (설립증서)"], "links": [{"label": "LII Wex — incorporate", "url": "https://www.law.cornell.edu/wex/incorporate"}]}, {"id": "shareholder", "hw": "shareholder · stockholder", "ipa": "ˈʃerˌhoʊl.dɚ · ˈstɑːkˌhoʊl.dɚ", "stress": "**share**·hold·er · **stock**·hold·er", "stars": 3, "gloss": "주주", "diff": "두 말은 같은 뜻입니다. 델라웨어 일반회사법은 stockholder를, 연방규칙과 다른 주 법은 shareholder를 주로 씁니다.", "examples": {"easy": {"en": "One of the shareholders voted no.", "ko": "주주 중 한 명이 반대표를 던졌다."}, "practice": {"en": "The shareholders elect the directors at the annual meeting.", "ko": "주주들은 정기총회에서 이사를 선임한다."}, "source": {"en": "an annual meeting of stockholders shall be held for the election of directors on a date and at a time designated by or in the manner provided in the bylaws", "ko": "이사 선임을 위한 정기 주주총회는 부속정관이 정하거나 그에 따라 정한 날짜와 시각에 열어야 한다", "cite": "Del. Code tit. 8, § 211(b)", "url": "https://delcode.delaware.gov/title8/c001/sc07/index.html", "glossary": {"annual meeting": "정기총회", "bylaws": "부속정관(→ 이 장)"}}}, "grammar": {"axis": "G2", "title": "one of the shareholders", "wrong": "One of the shareholder voted no.", "right": "One of the shareholders voted no.", "note": "'여럿 중 하나'는 one of + 복수명사. 주주 전체를 말할 때도 the shareholders(복수)입니다."}, "collocations": ["controlling shareholder (지배주주)", "minority shareholder (소수주주)", "shareholder meeting / annual meeting", "shareholder vote"], "links": [{"label": "LII Wex — shareholder", "url": "https://www.law.cornell.edu/wex/shareholder"}]}, {"id": "share-stock", "hw": "share · stock · equity", "ipa": "ʃer · stɑːk · ˈek.wə.t̬i", "stress": "**share** · **stock** · **eq**·ui·ty", "stars": 3, "false_friend": true, "gloss": "주식 · (집합적) 주식 · 지분", "diff": "share는 한 주 한 주를 세는 말이고, stock은 회사 주식 전체 또는 소유한 주식 묶음을 가리킵니다. equity는 회사에 대한 소유 지분(자기자본)입니다. 1장의 equity(형평법)와 철자가 같지만 다른 뜻입니다(→ 1장).", "examples": {"easy": {"en": "She owns 100 shares of Apple stock.", "ko": "그녀는 애플 주식 100주를 갖고 있다."}, "practice": {"en": "The founders hold 60 percent of the equity, and investors hold the rest.", "ko": "창업자들이 지분 60퍼센트를 갖고 나머지는 투자자들이 갖는다."}, "source": {"en": "The shares of a corporation shall be represented by certificates, provided that the board of directors of the corporation may provide by resolution or resolutions that some or all of any or all classes or series of its stock shall be uncertificated shares.", "ko": "회사의 주식은 주권으로 표창한다. 다만 이사회는 결의로 그 주식의 일부 또는 전부를 주권 없는 주식으로 정할 수 있다.", "cite": "Del. Code tit. 8, § 158", "url": "https://delcode.delaware.gov/title8/c001/sc05/index.html", "glossary": {"certificate": "주권(주식 증서)", "uncertificated shares": "주권 없는 주식(전자 등록 주식)", "class / series": "주식의 종류 / 그 안의 계열"}}}, "grammar": {"axis": "G2", "title": "shares는 세고, stock은 묶음으로", "wrong": "She owns 100 stocks of Apple.", "right": "She owns 100 shares of Apple stock.", "note": "몇 주인지 셀 때는 shares. stock은 보통 단수로 '주식 일반'을 말하고, stocks라고 하면 '여러 회사의 주식(종목)'이 됩니다. 소유는 hold / own shares."}, "collocations": ["hold / own shares", "issue shares (주식을 발행하다)", "common stock / preferred stock (보통주 / 우선주)", "equity financing (지분 투자 유치)"], "links": [{"label": "LII Wex — share", "url": "https://www.law.cornell.edu/wex/share"}, {"label": "LII Wex — stock", "url": "https://www.law.cornell.edu/wex/stock"}]}, {"id": "board-of-directors", "hw": "board of directors", "ipa": "bɔːrd əv daɪˈrek.tɚz", "stress": "**board** of di·**rec**·tors", "stars": 3, "gloss": "이사회", "pron_tip": "director의 첫 음절은 /daɪ/와 /dɪ/ 둘 다 씁니다.", "examples": {"easy": {"en": "The board approved the plan.", "ko": "이사회가 그 계획을 승인했다."}, "practice": {"en": "She has sat on the board of a bank for ten years.", "ko": "그녀는 10년째 한 은행의 이사로 있다."}, "source": {"en": "The business and affairs of every corporation organized under this chapter shall be managed by or under the direction of a board of directors, except as may be otherwise provided in this chapter or in its certificate of incorporation.", "ko": "이 장에 따라 설립된 모든 회사의 업무는 이사회가 또는 이사회의 지휘 아래 경영한다. 다만 이 장이나 설립증서에 달리 정한 경우는 그러하지 아니하다.", "cite": "Del. Code tit. 8, § 141(a)", "url": "https://delcode.delaware.gov/title8/c001/sc04/index.html", "glossary": {"business and affairs": "업무", "under the direction of": "~의 지휘 아래", "certificate of incorporation": "설립증서(정관에 해당)"}}}, "box": "미국 회사법의 출발점이 되는 조문입니다. 회사를 경영하는 것은 주주가 아니라 이사회입니다. 주주는 이사를 뽑고 바꾸며 합병 같은 기본적인 거래를 승인하지만(합병계약의 주주총회 승인, § 251(c)), 일상의 경영 판단은 이사회에 맡겨집니다(→ business judgment rule).", "grammar": {"axis": "G1", "title": "특정 회사의 이사회는 the board", "wrong": "Board approved the plan.", "right": "The board approved the plan.", "note": "이미 정해진 그 회사의 이사회이므로 the. 신문 제목에서는 관사를 빼기도 하지만 문장에서는 붙입니다."}, "collocations": ["sit on / serve on the board", "board meeting", "independent director (사외이사)", "chairman of the board (이사회 의장)"], "links": [{"label": "LII Wex — board of directors", "url": "https://www.law.cornell.edu/wex/board_of_directors"}]}, {"id": "officer", "hw": "officer (CEO · CFO)", "ipa": "ˈɑː.fɪ.sɚ", "stress": "**of**·fi·cer", "stars": 2, "false_friend": true, "gloss": "(회사의) 임원, 집행임원", "diff": "일상어로는 '경찰관'(police officer, → 6장)이나 '장교'를 먼저 떠올립니다. 회사에서는 이사회가 뽑아 일상 업무를 맡기는 사람, 곧 CEO(최고경영자)·CFO(최고재무책임자)·secretary 등을 가리킵니다. 이사(director)와는 다른 자리이고, 한 사람이 둘을 겸할 수 있습니다.", "examples": {"easy": {"en": "The CEO stepped down last week.", "ko": "CEO가 지난주 물러났다."}, "practice": {"en": "The board appointed a new chief financial officer.", "ko": "이사회는 새 최고재무책임자를 선임했다."}, "source": {"en": "Every corporation organized under this chapter shall have such officers with such titles and duties as shall be stated in the bylaws or in a resolution of the board of directors", "ko": "이 장에 따라 설립된 모든 회사는 부속정관이나 이사회 결의에서 정한 직함과 직무를 가진 임원을 둔다", "cite": "Del. Code tit. 8, § 142(a)", "url": "https://delcode.delaware.gov/title8/c001/sc04/index.html"}}, "grammar": {"axis": "G5", "title": "step down — 물러나다", "wrong": "The CEO stepped out from the company.", "right": "The CEO stepped down. / stepped down as CEO", "note": "자진 사임은 step down (as + 직함). 떠밀려 나가면 be ousted, 교체하면 replace."}, "collocations": ["chief executive officer (CEO)", "chief financial officer (CFO)", "directors and officers (D&O)", "step down as CEO"], "links": [{"label": "LII Wex — officer", "url": "https://www.law.cornell.edu/wex/officer"}]}, {"id": "fiduciary-duty", "hw": "fiduciary duty", "ipa": "fɪˈduː.ʃi.er.i ˈduː.t̬i", "stress": "fi·**du**·ci·ar·y **du**·ty", "stars": 3, "gloss": "신인의무(信認義務)", "pron_tip": "강세는 둘째 음절 -du-. ci는 /ʃi/로 읽습니다.", "diff": "남의 재산이나 이익을 맡은 사람(fiduciary)이 지는 무거운 의무입니다. 수탁자·이사·대리인·변호사가 대표적입니다. 한국 법에는 이를 한 단어로 묶는 개념이 없어 '신인의무'라는 번역어를 쓰고, 내용은 충실의무와 선관주의의무로 나누어 설명합니다(→ duty of loyalty / duty of care).", "examples": {"easy": {"en": "Directors owe a fiduciary duty to the company.", "ko": "이사는 회사에 신인의무를 진다."}, "practice": {"en": "The plaintiffs allege that the directors breached their fiduciary duties by approving the sale.", "ko": "원고들은 이사들이 매각을 승인함으로써 신인의무를 위반했다고 주장한다."}, "source": {"en": "Many forms of conduct permissible in a workaday world for those acting at arm's length, are forbidden to those bound by fiduciary ties.", "ko": "대등한 거래 관계에 있는 사람들에게는 일상 세계에서 허용되는 여러 행동도, 신인 관계로 묶인 사람에게는 금지된다.", "cite": "Meinhard v. Salmon, 249 N.Y. 458, 464 (1928)", "url": "https://www.nycourts.gov/reporter/archives/meinhard_salmon.htm", "glossary": {"workaday world": "평범한 일상 세계", "at arm's length": "대등한 당사자로서(서로 이해가 대립하는 거래 관계)", "fiduciary ties": "신인 관계"}}}, "grammar": {"axis": "G6", "title": "owe a fiduciary duty to", "wrong": "Directors have a fiduciary duty for the company.", "right": "Directors owe a fiduciary duty to the company.", "note": "의무를 '지다'는 owe, 상대는 to. 위반은 breach a fiduciary duty, 명사는 breach of fiduciary duty."}, "collocations": ["owe a fiduciary duty to", "breach of fiduciary duty", "fiduciary relationship", "fiduciary (명사: 신인의무자)"], "links": [{"label": "LII Wex — fiduciary duty", "url": "https://www.law.cornell.edu/wex/fiduciary_duty"}]}, {"id": "duty-of-loyalty", "hw": "duty of loyalty · duty of care", "ipa": "ˈduː.t̬i əv ˈlɔɪ.əl.t̬i · ˈduː.t̬i əv ker", "stress": "**du**·ty of **loy**·al·ty · **du**·ty of **care**", "stars": 2, "gloss": "충실의무 · 주의의무(선관주의의무)", "diff": "duty of loyalty는 회사보다 자기 이익을 앞세우지 말라는 의무(자기거래·회사기회 유용 금지), duty of care는 충분한 정보를 바탕으로 신중하게 판단하라는 의무입니다. 델라웨어에서는 정관으로 duty of care 위반의 금전배상 책임은 면제할 수 있지만 duty of loyalty 위반은 면제할 수 없습니다(§ 102(b)(7)). 불법행위의 duty of care(→ 9장)와 말은 같지만 맥락이 다릅니다.", "examples": {"easy": {"en": "He breached his duty of loyalty.", "ko": "그는 충실의무를 위반했다."}, "practice": {"en": "The director took a business opportunity that belonged to the corporation, in breach of the duty of loyalty.", "ko": "그 이사는 충실의무를 위반하여 회사에 속한 사업 기회를 가로챘다."}, "source": {"en": "A provision eliminating or limiting the personal liability of a director or officer to the corporation or its stockholders for monetary damages for breach of fiduciary duty as a director or officer, provided that such provision shall not eliminate or limit the liability of … A director or officer for any breach of the director's or officer's duty of loyalty to the corporation or its stockholders", "ko": "신인의무 위반으로 인한 이사·임원의 회사 또는 주주에 대한 금전배상 책임을 면제하거나 제한하는 규정. 다만 그 규정은 다음 책임을 면제하거나 제한하지 못한다. … 회사 또는 주주에 대한 충실의무 위반으로 인한 이사·임원의 책임", "cite": "Del. Code tit. 8, § 102(b)(7) — 설립증서에 넣을 수 있는 책임 면제 조항", "url": "https://delcode.delaware.gov/title8/c001/sc01/index.html", "glossary": {"eliminate or limit": "면제하거나 제한하다", "monetary damages": "금전배상"}}}, "grammar": {"axis": "G4", "title": "duty of loyalty to — 의무의 상대는 to", "wrong": "duty of loyalty for the corporation", "right": "duty of loyalty to the corporation and its stockholders", "note": "'누구에 대한' 의무는 to. '위반하여'는 in breach of. duty to는 의무의 상대, liability to는 책임의 상대, liability for는 책임의 사유(liability for breach of duty)입니다. owe는 owe a duty to A와 owe A a duty 둘 다 씁니다."}, "collocations": ["breach the duty of loyalty", "in breach of", "self-dealing (자기거래)", "corporate opportunity (회사 기회)"], "links": [{"label": "LII Wex — duty of loyalty", "url": "https://www.law.cornell.edu/wex/duty_of_loyalty"}, {"label": "LII Wex — duty of care", "url": "https://www.law.cornell.edu/wex/duty_of_care"}]}, {"id": "business-judgment-rule", "hw": "business judgment rule", "ipa": "ˈbɪz.nɪs ˈdʒʌdʒ.mənt ruːl", "stress": "**busi**·ness **judg**·ment **rule**", "stars": 3, "gloss": "경영판단원칙", "pron_tip": "business는 두 음절 /ˈbɪz.nɪs/입니다. 가운데 i를 읽지 않습니다.", "diff": "이사의 결정이 결과적으로 손해를 냈어도, 정보를 갖추고 선의로 회사에 최선이라고 믿고 내린 판단이면 법원은 그 내용을 다시 심사하지 않는다는 추정입니다. 원고가 이 추정을 깨야 합니다. 한국 판례도 같은 이름의 법리를 쓰지만, 이를 정한 조문은 없습니다.", "examples": {"easy": {"en": "The court applied the business judgment rule.", "ko": "법원은 경영판단원칙을 적용했다."}, "practice": {"en": "Under the business judgment rule, courts do not second-guess good-faith decisions by directors.", "ko": "경영판단원칙에 따라 법원은 이사들이 선의로 내린 결정을 사후에 다시 따지지 않는다."}, "source": {"en": "The business judgment rule is a \"presumption that in making a business decision the directors of a corporation acted on an informed basis, in good faith and in the honest belief that the action taken was in the best interests of the company.\"", "ko": "경영판단원칙이란 \"경영상 결정을 할 때 회사의 이사들은 충분한 정보에 기초하여, 선의로, 그리고 그 행위가 회사에 최선의 이익이 된다는 정직한 믿음으로 행동했다는 추정\"이다.", "cite": "Unocal Corp. v. Mesa Petroleum Co., 493 A.2d 946, 954 (Del. 1985) (Aronson v. Lewis, 473 A.2d 805, 812 (Del. 1984) 인용)", "url": "https://static.case.law/a2d/493/html/0946-01.html", "glossary": {"presumption": "추정", "on an informed basis": "충분한 정보에 기초하여", "in good faith": "선의로", "honest belief": "정직한 믿음"}}}, "box": "따옴표 안은 Aronson v. Lewis (1984)가 내린 정의를 이듬해 Unocal 판결이 그대로 옮긴 것입니다(Aronson 판례집 디지털본은 스캔 판독 오류가 있어 Unocal의 인용으로 실었습니다). 델라웨어 대법원의 이 문장은 지금도 경영판단원칙의 정의로 가장 많이 인용됩니다. 다만 Aronson 판결 가운데 대표소송의 제소청구 면제(demand futility) 기준을 다룬 부분은 델라웨어 대법원이 Rales 기준과 합쳐 이사별로 묻는 3단계 통합 기준(universal test)으로 다시 정리했습니다. Aronson을 폐기하지는 않았지만, 제소청구 면제를 다룰 때는 이 통합 기준을 씁니다(United Food v. Zuckerberg, 2021).", "grammar": {"axis": "G1", "title": "이름 붙은 법리에는 the", "wrong": "Court applied business judgment rule.", "right": "The court applied the business judgment rule.", "note": "특정 법리·원칙 이름은 하나뿐이므로 the를 붙입니다(the parol evidence rule, the hearsay rule). 법원도 그 사건의 법원이면 the court."}, "collocations": ["apply the business judgment rule", "rebut the presumption (추정을 깨다)", "second-guess (사후에 이러쿵저러쿵하다)", "protected by the business judgment rule"], "links": [{"label": "LII Wex — business judgment rule", "url": "https://www.law.cornell.edu/wex/business_judgment_rule"}, {"label": "United Food & Commercial Workers Union v. Zuckerberg (Del. 2021) 원문(PDF)", "url": "https://courts.delaware.gov/Opinions/Download.aspx?id=324700"}]}, {"id": "piercing-the-veil", "hw": "piercing the corporate veil", "ipa": "ˈpɪr.sɪŋ ðə ˈkɔːr.pɚ.ət veɪl", "stress": "**pierc**·ing the **cor**·po·rate **veil**", "stars": 2, "gloss": "법인격 부인(회사의 베일을 벗기기)", "diff": "회사(또는 모회사)가 회사 형식을 사기 등에 남용하면, 법원이 '베일'을 걷어 주주에게 직접 책임을 지웁니다. 한국 대법원도 법인격 부인론을 인정하지만 요건 표현은 다르므로, 두 제도를 그대로 같다고 하지 않는 편이 안전합니다.", "examples": {"easy": {"en": "The court pierced the corporate veil.", "ko": "법원은 법인격을 부인했다."}, "practice": {"en": "The creditors asked the court to pierce the veil and hold the owner personally liable.", "ko": "채권자들은 법인격을 부인하고 소유주에게 개인 책임을 지워 달라고 법원에 청구했다."}, "source": {"en": "the corporate veil may be pierced and the shareholder held liable for the corporation's conduct when, inter alia, the corporate form would otherwise be misused to accomplish certain wrongful purposes, most notably fraud", "ko": "법인격을 부인하지 않으면 회사 형식이 일정한 부정한 목적, 특히 사기를 이루는 데 남용될 경우 등에는 법인격을 부인하고 주주에게 회사의 행위에 대한 책임을 지울 수 있다", "cite": "United States v. Bestfoods, 524 U.S. 51, 62 (1998)", "url": "https://www.law.cornell.edu/supremecourt/text/524/51", "glossary": {"inter alia": "그 밖에도, 여러 사항 가운데(라틴어 → 17장)", "most notably": "특히", "corporate form": "회사라는 법 형식"}}}, "grammar": {"axis": "G6", "title": "pierce the veil — 짝 동사는 pierce", "wrong": "The court removed the corporate veil.", "right": "The court pierced the corporate veil.", "note": "veil(베일)과 짝을 이루는 동사는 pierce(꿰뚫다). 영국에서는 lift the veil도 씁니다."}, "collocations": ["pierce the corporate veil", "veil piercing (명사)", "alter ego (분신 — 법인격 부인 법리의 다른 이름)", "hold A personally liable"], "links": [{"label": "LII Wex — piercing the corporate veil", "url": "https://www.law.cornell.edu/wex/piercing_the_corporate_veil"}]}, {"id": "derivative-suit", "hw": "derivative suit", "ipa": "dɪˈrɪv.ə.t̬ɪv suːt", "stress": "de·**riv**·a·tive **suit**", "stars": 2, "gloss": "(주주) 대표소송", "diff": "회사가 이사를 상대로 소를 내지 않을 때 주주가 회사를 대신해 내는 소송입니다. 이겨도 배상금은 회사로 갑니다. 한국 상법 제403조의 주주대표소송과 구조가 같고(→ 「한국이라면?」), 여러 주주를 대표하는 class action(→ 3장)과는 다릅니다.", "examples": {"easy": {"en": "A shareholder filed a derivative suit.", "ko": "한 주주가 대표소송을 냈다."}, "practice": {"en": "The shareholders brought a derivative suit on behalf of the company against its former CEO.", "ko": "주주들은 회사를 위하여 전 CEO를 상대로 대표소송을 제기했다."}, "source": {"en": "This rule applies when one or more shareholders or members of a corporation or an unincorporated association bring a derivative action to enforce a right that the corporation or association may properly assert but has failed to enforce.", "ko": "이 규칙은 회사나 법인 아닌 단체의 주주 또는 구성원 1인 이상이, 그 회사나 단체가 정당하게 행사할 수 있는데도 행사하지 않은 권리를 실현하기 위하여 대표소송을 제기하는 경우에 적용한다.", "cite": "Fed. R. Civ. P. 23.1(a)", "url": "https://www.law.cornell.edu/rules/frcp/rule_23.1", "glossary": {"unincorporated association": "법인 아닌 단체", "enforce a right": "권리를 실현하다"}}}, "grammar": {"axis": "G6", "title": "bring a derivative suit", "wrong": "The shareholders made a derivative suit.", "right": "The shareholders brought a derivative suit.", "note": "소송은 bring 또는 file과 짝을 이룹니다(→ 3장 action). 회사를 '위하여'는 on behalf of the company."}, "collocations": ["bring a derivative suit / action", "on behalf of the corporation", "demand on the board (이사회에 대한 제소 청구)", "demand futility (제소 청구 면제)"], "links": [{"label": "LII Wex — derivative action", "url": "https://www.law.cornell.edu/wex/derivative_action"}]}, {"id": "merger", "hw": "merger · acquisition (M&A)", "ipa": "ˈmɝː.dʒɚ · ˌæk.wəˈzɪʃ.ən", "stress": "**mer**·ger · ac·qui·**si**·tion", "stars": 3, "gloss": "합병 · 인수", "diff": "merger는 두 회사가 법적으로 하나가 되는 것(합병), acquisition은 한 회사가 다른 회사의 주식이나 자산을 사들여 지배하는 것(인수)입니다. 인수된 회사는 자회사로 남을 수 있습니다.", "examples": {"easy": {"en": "The two banks announced a merger.", "ko": "두 은행이 합병을 발표했다."}, "practice": {"en": "The company acquired its rival, which became a wholly owned subsidiary.", "ko": "그 회사는 경쟁사를 인수했고, 경쟁사는 완전자회사가 되었다."}, "source": {"en": "Any 2 or more corporations of this State may merge into a single surviving corporation, which may be any 1 of the constituent corporations or may consolidate into a new resulting corporation formed by the consolidation", "ko": "이 주의 회사 둘 이상은 하나의 존속회사로 합병할 수 있고(존속회사는 합병당사회사 중 하나여도 된다), 또는 신설합병으로 새 회사를 세울 수 있다", "cite": "Del. Code tit. 8, § 251(a)", "url": "https://delcode.delaware.gov/title8/c001/sc09/index.html", "glossary": {"surviving corporation": "존속회사", "constituent corporations": "합병당사회사", "consolidate": "신설합병하다"}}}, "grammar": {"axis": "G4", "title": "merge with / merge into", "wrong": "A merged to B.", "right": "A merged with B. / A merged into B.", "note": "with는 대등하게 합친다는 느낌, into는 A가 B 속으로 흡수되어 사라진다는 뜻입니다. 인수는 acquire B (타동사, 전치사 없음)."}, "collocations": ["merge with / into", "acquire a company", "mergers and acquisitions (M&A)", "hostile takeover (적대적 인수)"], "links": [{"label": "LII Wex — merger", "url": "https://www.law.cornell.edu/wex/merger"}, {"label": "LII Wex — acquisition", "url": "https://www.law.cornell.edu/wex/acquisition"}]}, {"id": "due-diligence", "hw": "due diligence", "ipa": "duː ˈdɪl.ə.dʒəns", "stress": "**due** **dil**·i·gence", "stars": 2, "gloss": "실사(기업 인수 전 조사), 상당한 주의", "diff": "M&A에서는 인수 전에 대상 회사의 재무·계약·소송 등을 조사하는 절차(실사)를 가리킵니다. 증권법에서는 공시 서류의 허위 기재에 대해 '상당한 주의를 다했다'는 항변(due diligence defense)으로도 쓰입니다.", "examples": {"easy": {"en": "We need more time for due diligence.", "ko": "실사에 시간이 더 필요하다."}, "practice": {"en": "The buyer's lawyers conducted due diligence on the target for six weeks.", "ko": "매수인 측 변호사들은 6주 동안 인수 대상 회사를 실사했다."}}, "grammar": {"axis": "G6", "title": "conduct / perform due diligence", "wrong": "We made due diligence. / a due diligence", "right": "We conducted due diligence on the target.", "note": "짝 동사는 conduct·perform·do. 셀 수 없는 명사처럼 써서 a를 붙이지 않습니다. 대상은 on."}, "collocations": ["conduct due diligence on", "due diligence report", "due diligence defense"], "links": [{"label": "LII Wex — due diligence", "url": "https://www.law.cornell.edu/wex/due_diligence"}]}, {"id": "tender-offer", "hw": "tender offer", "ipa": "ˈten.dɚ ˈɑː.fɚ", "stress": "**ten**·der **of**·fer", "stars": 1, "false_friend": true, "gloss": "공개매수", "diff": "tender는 형용사로 '부드러운'이지만 동사로는 '(정식으로) 내놓다, 제공하다'입니다. tender offer는 주주들에게 정해진 가격에 주식을 내놓으라고(tender) 공개적으로 청하는 매수 제안입니다. 적대적 인수에 자주 쓰입니다.", "examples": {"easy": {"en": "They made a tender offer for the company.", "ko": "그들은 그 회사에 대해 공개매수를 했다."}, "practice": {"en": "Shareholders who tender their shares will receive $40 per share in cash.", "ko": "주식을 응모하는 주주는 주당 현금 40달러를 받는다."}, "source": {"en": "to engage in any fraudulent, deceptive, or manipulative acts or practices, in connection with any tender offer or request or invitation for tenders", "ko": "공개매수 또는 응모의 요청·권유와 관련하여 사기적·기만적·조작적 행위를 하는 것(은 위법하다)", "cite": "15 U.S.C. § 78n(e) (증권거래법 제14조(e))", "url": "https://www.law.cornell.edu/uscode/text/15/78n", "glossary": {"manipulative": "시세 조종적인", "invitation for tenders": "응모 권유"}}}, "grammar": {"axis": "G6", "title": "make / launch a tender offer", "wrong": "They did a tender offer.", "right": "They made (launched) a tender offer for the company.", "note": "제안을 '하다'는 make, 시작하다는 launch. 대상 회사는 for. 주주가 응하는 것은 tender one's shares."}, "collocations": ["make / launch a tender offer", "tender one's shares (응모하다)", "hostile tender offer"], "links": [{"label": "LII Wex — tender offer", "url": "https://www.law.cornell.edu/wex/tender_offer"}]}, {"id": "securities", "hw": "securities", "ipa": "səˈkjʊr.ə.t̬iz", "pron_tip": "Cambridge의 securities 항목에는 미국식 표기가 없어, 단수 security의 Cambridge US 표기 /səˈkjʊr.ə.t̬i/에 복수 어미 -z를 붙여 적었습니다. 첫 모음을 /sɪ/로 읽는 사람도 있습니다.", "stress": "se·**cur**·i·ties", "stars": 3, "false_friend": true, "gloss": "증권(주식·사채 등)", "diff": "security는 일상어로 '보안·안전'입니다. 복수형 securities, 또는 a security로 쓰면 주식·사채 같은 '증권'입니다. 미국 증권법의 '증권' 정의는 아주 넓어서, 수익을 기대하고 남의 사업에 돈을 맡기는 투자계약(investment contract)까지 들어갑니다.", "examples": {"easy": {"en": "Stocks and bonds are securities.", "ko": "주식과 채권은 증권이다."}, "practice": {"en": "The company sold securities to the public without registering them with the SEC.", "ko": "그 회사는 SEC에 등록하지 않고 일반 투자자에게 증권을 팔았다."}, "source": {"en": "… means any note, stock, treasury stock, … bond, debenture, evidence of indebtedness …", "ko": "(\"증권\"이란) 어음, 주식, 자기주식, … 채권, 사채, 채무증서 … 를 말한다", "cite": "15 U.S.C. § 77b(a)(1) (1933년 증권법의 \"security\" 정의)", "url": "https://www.law.cornell.edu/uscode/text/15/77b", "glossary": {"treasury stock": "자기주식", "debenture": "무담보 사채", "evidence of indebtedness": "채무증서"}}}, "grammar": {"axis": "G2", "title": "증권은 a security / securities", "wrong": "The company sold a securities.", "right": "The company sold securities. / Each note is a security.", "note": "'증권'은 셀 수 있는 명사라 하나면 a security, 여럿이면 securities. 관사 없이 단수 security라고 하면 '보안'으로 읽힙니다."}, "collocations": ["securities law", "issue / sell securities", "register securities with the SEC", "securities exchange (증권거래소)"], "links": [{"label": "LII Wex — security", "url": "https://www.law.cornell.edu/wex/security"}]}, {"id": "sec", "hw": "SEC (Securities and Exchange Commission)", "ipa": "ˌes.iːˈsiː", "stress": "S·E·**C**", "stars": 2, "gloss": "(미국) 증권거래위원회", "pron_tip": "한 단어 '섹'으로 읽지 않고 S-E-C 세 글자를 따로 읽습니다. 강세는 마지막 C. Cambridge에는 이 약칭의 발음 표기가 없어(같은 철자의 sec /sek/는 다른 낱말), 글자 이름 S /es/·E /iː/·C /siː/를 이어 적고 머리글자 약어의 관행대로 끝 글자에 강세를 두었습니다.", "diff": "연방 독립 행정기관으로, 증권 규칙을 만들고 위반을 조사해 민사 제소나 행정 제재를 합니다. 형사 기소는 법무부(DOJ)가 합니다. 한국의 금융위원회·증권선물위원회·금융감독원 기능이 한곳에 모인 모습에 가깝지만 1:1로 대응하지는 않습니다.", "examples": {"easy": {"en": "The SEC opened an investigation.", "ko": "SEC가 조사에 착수했다."}, "practice": {"en": "The company settled with the SEC and agreed to pay a $10 million penalty.", "ko": "회사는 SEC와 합의하고 1,000만 달러의 과징금을 내기로 했다."}, "source": {"en": "There is hereby established a Securities and Exchange Commission … to be composed of five commissioners to be appointed by the President by and with the advice and consent of the Senate", "ko": "이에 증권거래위원회를 설치한다. 위원회는 대통령이 상원의 권고와 동의를 얻어 임명하는 위원 5명으로 구성한다", "cite": "15 U.S.C. § 78d(a)", "url": "https://www.law.cornell.edu/uscode/text/15/78d", "glossary": {"hereby": "이로써, 이에", "advice and consent": "(상원의) 권고와 동의"}}}, "grammar": {"axis": "G1", "title": "기관 약칭에는 the", "wrong": "SEC opened an investigation.", "right": "The SEC opened an investigation.", "note": "글자를 하나씩 읽는 기관 약칭은 the를 붙입니다(the SEC, the FBI, the DOJ). 한 단어처럼 읽는 약칭은 관사 없이 씁니다(NASA, NATO)."}, "collocations": ["file with the SEC", "SEC enforcement action", "settle with the SEC", "SEC filing (공시 서류)"], "links": [{"label": "LII Wex — Securities and Exchange Commission (SEC)", "url": "https://www.law.cornell.edu/wex/securities_and_exchange_commission_(sec)"}]}, {"id": "insider-trading", "hw": "insider trading", "ipa": "ɪnˈsaɪ.dɚ ˈtreɪ.dɪŋ", "stress": "in·**sid**·er **trad**·ing", "stars": 2, "gloss": "내부자거래", "diff": "미국에는 내부자거래를 정면으로 정의한 연방 조문이 없습니다. 법원은 증권거래법 § 10(b)와 SEC 규칙 10b-5의 사기 금지 조항을 해석해, 신인의무를 진 사람이 미공개 중요정보로 거래하는 것을 '사기'로 보았습니다. 정보를 받은 사람(tippee)의 책임은 Dirks v. SEC(1983)와 Salman v. United States(2016)가 다룹니다. 한국은 자본시장법이 미공개중요정보 이용행위를 직접 금지합니다.", "examples": {"easy": {"en": "He went to prison for insider trading.", "ko": "그는 내부자거래로 징역형을 살았다."}, "practice": {"en": "She traded on inside information before the merger was announced.", "ko": "그녀는 합병 발표 전에 내부 정보를 이용해 거래했다."}, "source": {"en": "an insider is liable under the Rule for inside trading only where he fails to disclose material nonpublic information before trading on it and thus makes secret profits", "ko": "내부자는 미공개 중요정보를 공개하지 않은 채 그 정보로 거래하여 몰래 이익을 얻은 경우에만 이 규칙에 따라 내부자거래 책임을 진다", "cite": "Dirks v. SEC, 463 U.S. 646 (1983) (판결 요지)", "url": "https://www.law.cornell.edu/supremecourt/text/463/646", "glossary": {"material nonpublic information": "미공개 중요정보", "disclose or abstain": "(내부자의 원칙) 공개하든지, 거래를 삼가든지"}}}, "grammar": {"axis": "G4", "title": "trade on information", "wrong": "She traded with inside information.", "right": "She traded on inside information.", "note": "'정보에 기초해(이용해) 거래하다'는 trade on. act on advice(조언에 따라 행동하다)와 같은 on입니다."}, "collocations": ["trade on inside information", "material nonpublic information (MNPI)", "tipper / tippee (정보 제공자 / 수령자)", "be charged with insider trading"], "links": [{"label": "LII Wex — insider trading", "url": "https://www.law.cornell.edu/wex/insider_trading"}]}, {"id": "securities-fraud", "hw": "securities fraud", "ipa": "səˈkjʊr.ə.t̬iz frɑːd", "pron_tip": "securities는 단수 security의 Cambridge US 표기 /səˈkjʊr.ə.t̬i/에서 복수형을 만들었습니다(→ securities).", "stress": "se·**cur**·i·ties **fraud**", "stars": 2, "gloss": "증권사기", "diff": "증권 매매와 관련한 허위 기재·중요사실 누락·기망 행위 전반을 말합니다. 같은 조문(규칙 10b-5)으로 SEC의 민사 제소, 법무부의 형사 기소, 투자자의 민사소송(대개 집단소송)이 모두 가능합니다. 무엇이 '중요한(material)' 사실인지는 Basic Inc. v. Levinson(1988)이 기준을 세웠습니다.", "examples": {"easy": {"en": "The CEO was charged with securities fraud.", "ko": "CEO는 증권사기 혐의로 기소되었다."}, "practice": {"en": "Investors claim the company lied about its sales and filed a securities fraud class action.", "ko": "투자자들은 회사가 매출을 속였다며 증권사기 집단소송을 냈다."}, "source": {"en": "To employ any device, scheme, or artifice to defraud … in connection with the purchase or sale of any security", "ko": "증권의 매수 또는 매도와 관련하여 사기를 위한 수단·계획·책략을 사용하는 것(은 위법하다)", "cite": "17 C.F.R. § 240.10b-5(a) (SEC 규칙 10b-5)", "url": "https://www.law.cornell.edu/cfr/text/17/240.10b-5", "glossary": {"artifice": "책략", "defraud": "속여 빼앗다", "in connection with": "~와 관련하여"}}}, "grammar": {"axis": "G7", "title": "be charged with — 혐의는 with", "wrong": "The CEO was charged for securities fraud.", "right": "The CEO was charged with securities fraud.", "note": "형사 혐의를 받다는 be charged with + 죄명(→ 6장). fraud는 죄명으로 쓸 때 관사 없이 씁니다."}, "collocations": ["be charged with securities fraud", "Rule 10b-5", "securities fraud class action", "material misstatement (중요사항 허위 기재)"], "links": [{"label": "LII Wex — securities fraud", "url": "https://www.law.cornell.edu/wex/securities_fraud"}]}, {"id": "llc", "hw": "limited liability · LLC", "ipa": "ˈlɪm.ɪ.t̬ɪd ˌlaɪ.əˈbɪl.ə.t̬i · ˌel.elˈsiː", "stress": "**lim**·it·ed li·a·**bil**·i·ty · L·L·**C**", "stars": 2, "gloss": "유한책임 · 유한책임회사", "diff": "limited liability는 출자자가 출자한 만큼만 위험을 지고 회사 빚을 개인 재산으로 갚지 않는다는 원칙입니다. LLC(limited liability company)는 이 유한책임에 조합처럼 유연한 운영과 세제상 이점을 더한 미국식 기업 형태입니다. 한국 상법에도 유한책임회사(2012년 도입)가 있지만 쓰임새와 규율이 같지 않습니다.", "examples": {"easy": {"en": "They formed an LLC for the restaurant.", "ko": "그들은 식당을 위해 LLC를 세웠다."}, "practice": {"en": "Because of limited liability, the members are not personally liable for the LLC's debts.", "ko": "유한책임 때문에 사원들은 LLC의 채무에 대해 개인적으로 책임지지 않는다."}, "source": {"en": "no member or manager of a limited liability company shall be obligated personally for any such debt, obligation or liability of the limited liability company solely by reason of being a member or acting as a manager of the limited liability company", "ko": "유한책임회사의 사원이나 업무집행자는 사원이라는 이유 또는 업무집행자로 행동했다는 이유만으로 회사의 채무·의무·책임을 개인적으로 지지 아니한다", "cite": "Del. Code tit. 6, § 18-303(a) (델라웨어 유한책임회사법)", "url": "https://delcode.delaware.gov/title6/c018/sc03/index.html", "glossary": {"member": "(LLC의) 사원·출자자", "manager": "업무집행자", "solely by reason of": "오로지 ~라는 이유로"}}}, "grammar": {"axis": "G1", "title": "an LLC — 철자가 아니라 소리로 a/an", "wrong": "a LLC", "right": "an LLC", "note": "L은 /el/처럼 모음 소리로 시작하므로 an. an SEC filing, an FBI agent도 같은 원리이고, a U.S. company는 /juː/ 자음 소리라 a입니다."}, "collocations": ["form an LLC", "limited liability company agreement (운영계약)", "member / manager", "personally liable"], "links": [{"label": "LII Wex — limited liability company (LLC)", "url": "https://www.law.cornell.edu/wex/limited_liability_company_(llc)"}, {"label": "LII Wex — limited liability", "url": "https://www.law.cornell.edu/wex/limited_liability"}]}, {"id": "partnership", "hw": "partnership", "ipa": "ˈpɑːrt.nɚ.ʃɪp", "stress": "**part**·ner·ship", "stars": 1, "gloss": "조합, 파트너십", "diff": "둘 이상이 이익을 목적으로 함께 사업하는 형태입니다. 일반 조합원(general partner)은 조합 채무에 무한책임을 집니다. 한국 민법의 조합과 비슷하지만, 미국 대형 로펌의 '파트너'처럼 경영자 겸 지분권자를 가리키는 말로도 쓰입니다.", "examples": {"easy": {"en": "The two lawyers formed a partnership.", "ko": "두 변호사가 동업 관계를 맺었다."}, "practice": {"en": "Each general partner is personally liable for the debts of the partnership.", "ko": "일반 조합원 각자는 조합 채무에 대해 개인적으로 책임을 진다."}}, "grammar": {"axis": "G6", "title": "form / enter into a partnership", "wrong": "They made a partnership.", "right": "They formed (entered into) a partnership.", "note": "단체를 '만들다'는 form(form a company, form an LLC). 계약으로 맺는다는 느낌이면 enter into(→ 8장)."}, "collocations": ["form a partnership", "general partner / limited partner", "limited partnership (LP, 합자조합)", "partner at a law firm"], "links": [{"label": "LII Wex — partnership", "url": "https://www.law.cornell.edu/wex/partnership"}]}, {"id": "agency", "hw": "agency · principal · agent", "ipa": "ˈeɪ.dʒən.si · ˈprɪn.sə.pəl · ˈeɪ.dʒənt", "stress": "**a**·gen·cy · **prin**·ci·pal · **a**·gent", "stars": 2, "false_friend": true, "gloss": "대리 · 본인 · 대리인", "diff": "agency는 일상어로 '대행사'나 '정부 기관'(administrative agency)이지만, 회사법에서는 본인(principal)과 대리인(agent)의 관계, 곧 '대리'입니다. 회사는 사람을 통해서만 움직이므로 임원·직원의 행위가 회사를 구속하는지가 대리 법리로 정해집니다. 미국 대리법은 주로 판례법(Restatement로 정리)입니다.", "examples": {"easy": {"en": "The agent signed for the principal.", "ko": "대리인이 본인을 대신해 서명했다."}, "practice": {"en": "An officer who signs a contract acts as an agent of the corporation.", "ko": "계약에 서명하는 임원은 회사의 대리인으로서 행동한다."}}, "grammar": {"axis": "G4", "title": "agent of / act on behalf of", "wrong": "an agent to the corporation", "right": "an agent of the corporation / act on behalf of the principal", "note": "누구의 대리인인지는 of. '~을 위하여, ~을 대신하여'는 on behalf of(→ 3장 class action)."}, "collocations": ["act on behalf of", "actual / apparent authority (실제 / 표현대리권)", "principal-agent problem (대리인 문제)", "vicarious liability (사용자책임)"], "links": [{"label": "LII Wex — agency", "url": "https://www.law.cornell.edu/wex/agency"}]}, {"id": "bylaws", "hw": "bylaws · articles of incorporation", "ipa": "ˈbaɪ.lɑːz · ˈɑːr.t̬ɪ.kəlz əv ɪnˌkɔːr.pəˈreɪ.ʃən", "stress": "**by**·laws · **ar**·ti·cles of in·cor·po·**ra**·tion", "stars": 1, "gloss": "부속정관(내부 규칙) · 기본정관(설립증서)", "diff": "미국 회사에는 정관에 해당하는 문서가 둘입니다. 주 정부에 내는 articles of incorporation(델라웨어에서는 certificate of incorporation)이 회사의 기본 사항을 정하고, bylaws는 이사회·총회 운영 같은 내부 규칙을 정합니다. 한국 정관 하나가 두 문서로 나뉜 셈이라 '정관'으로만 옮기면 어느 쪽인지 흐려집니다.", "examples": {"easy": {"en": "The bylaws set the meeting rules.", "ko": "부속정관이 회의 규칙을 정한다."}, "practice": {"en": "The board amended the bylaws to allow virtual shareholder meetings.", "ko": "이사회는 화상 주주총회를 허용하도록 부속정관을 개정했다."}, "source": {"en": "The original or other bylaws of a corporation may be adopted, amended or repealed by the incorporators … After a corporation other than a nonstock corporation has received any payment for any of its stock, the power to adopt, amend or repeal bylaws shall be in the stockholders entitled to vote.", "ko": "회사의 최초 또는 그 밖의 부속정관은 발기인이 채택·개정·폐지할 수 있다 … 비주식회사가 아닌 회사가 주식 대금을 한 번이라도 받은 뒤에는, 부속정관을 채택·개정·폐지할 권한은 의결권 있는 주주에게 있다.", "cite": "Del. Code tit. 8, § 109(a)", "url": "https://delcode.delaware.gov/title8/c001/sc01/index.html", "glossary": {"incorporators": "발기인(설립 신청인)", "repeal": "폐지하다", "생략 부분": "설립증서에 이름이 오른 최초 이사, 주식 대금을 받기 전의 이사회도 같은 권한을 가진다는 부분. 같은 항은 설립증서로 이사회에도 이 권한을 줄 수 있다고 정하고(예문의 이사회 개정이 그 경우), 그래도 주주의 권한은 남는다고 덧붙인다"}}}, "grammar": {"axis": "G2", "title": "bylaws는 복수로", "wrong": "The bylaws provides that ...", "right": "The bylaws provide that ...", "note": "규칙 묶음 전체를 가리키는 bylaws는 복수형이므로 동사도 복수(provide). 조항 하나를 말할 때는 단수 a bylaw / the bylaw provides도 맞습니다."}, "collocations": ["adopt / amend the bylaws", "the bylaws provide that ...", "file the articles of incorporation", "certificate of incorporation (델라웨어 용어)"], "links": [{"label": "LII Wex — bylaws", "url": "https://www.law.cornell.edu/wex/bylaws"}, {"label": "LII Wex — articles of incorporation", "url": "https://www.law.cornell.edu/wex/articles_of_incorporation"}]}, {"id": "minutes", "hw": "minutes", "ipa": "ˈmɪn.əts", "stress": "**min**·utes", "stars": 1, "false_friend": true, "gloss": "의사록", "pron_tip": "'분(分)'의 복수 minutes와 철자·발음이 같습니다. 형용사 minute(아주 작은)은 /maɪˈnuːt/로 다르게 읽습니다.", "diff": "시간 단위 '분'이 아니라 이사회·주주총회에서 무엇을 논의하고 결의했는지 적은 공식 기록입니다. 소송에서 이사들이 정보를 충분히 검토했는지(→ business judgment rule) 따질 때 핵심 증거가 됩니다.", "examples": {"easy": {"en": "Please take the minutes today.", "ko": "오늘 의사록을 맡아 주세요."}, "practice": {"en": "The minutes of the board meeting show that the directors discussed the offer for two hours.", "ko": "이사회 의사록을 보면 이사들은 그 제안을 두 시간 동안 논의했다."}, "source": {"en": "One of the officers shall have the duty to record the proceedings of the meetings of the stockholders and directors in a book to be kept for that purpose.", "ko": "임원 중 1인은 주주총회와 이사회의 의사를 그 목적으로 비치하는 장부에 기록할 의무를 진다.", "cite": "Del. Code tit. 8, § 142(a) — 의사록 작성 의무", "url": "https://delcode.delaware.gov/title8/c001/sc04/index.html", "glossary": {"proceedings": "의사(議事), 진행 경과"}}}, "grammar": {"axis": "G2", "title": "의사록은 늘 복수형 minutes", "wrong": "the minute of the meeting", "right": "the minutes of the meeting", "note": "의사록 한 건이어도 minutes(복수형)로 씁니다. 작성하다는 take / keep the minutes, 승인하다는 approve the minutes."}, "collocations": ["take / keep the minutes", "approve the minutes", "minutes of the board meeting"], "links": [{"label": "LII Wex — minutes", "url": "https://www.law.cornell.edu/wex/minutes"}]}], "corners": {"false_friend": {"title": "securities는 보안이 아니다", "body": ["security는 공항 검색대의 '보안'입니다. 그런데 증권 기사에서 securities가 나오면 주식·사채 같은 '증권'이고, Securities and Exchange Commission은 '보안교환위원회'가 아니라 증권거래위원회입니다.", "회사·상사 영역의 가짜 친구를 모아 보면 이렇습니다."], "table": [["securities", "보안(security)", "증권"], ["officer", "경찰관, 장교", "(회사의) 임원"], ["tender", "부드러운", "(주식을) 내놓다 — tender offer 공개매수"], ["minutes", "분(分)", "의사록"], ["equity", "공평함 · 형평법(→ 1장)", "지분, 자기자본"], ["agency", "대행사, 정부 기관", "대리(본인·대리인 관계)"]], "tip": "외우는 요령: 문장에 shareholders·board·SEC가 함께 나오면 일상 뜻을 의심하세요."}, "drama": {"title": "Wall Street (1987)", "facts": ["1987년 미국 영화. 감독 올리버 스톤, 주연 마이클 더글러스·찰리 신. 20세기 폭스 배급.", "젊은 증권중개인 버드 폭스가 전설적인 투자자 고든 게코에게 접근하려고 내부 정보를 건네면서 이야기가 시작됩니다.", "마이클 더글러스는 고든 게코 역으로 아카데미 남우주연상을 받았습니다."], "watch": "이 장의 시장 쪽 표제어가 거의 다 나옵니다. 게코가 '탐욕은 좋은 것'이라는 연설을 하는 무대는 정기 주주총회이고, 버드는 내부 정보로 거래를 거듭하다 SEC의 추적을 받아 체포됩니다. 마지막에 버드가 몸에 녹음기를 숨기고 게코를 만나는 장면은 수사 협조(→ 6장)가 어떻게 이루어지는지도 보여 줍니다.", "terms": ["insider trading", "inside information", "SEC", "shareholders' meeting", "takeover / tender offer", "securities fraud"], "links": [{"label": "Wikipedia — Wall Street (1987 film)", "url": "https://en.wikipedia.org/wiki/Wall_Street_(1987_film)"}, {"label": "YouTube — 공식 예고편 (20th Century Studios)", "url": "https://www.youtube.com/watch?v=2KqKHuPa2J8"}]}, "quote": {"text": "Not honesty alone, but the punctilio of an honor the most sensitive, is then the standard of behavior.", "ko": "그때 행동의 기준은 정직함만이 아니라, 가장 예민한 명예의 세심한 격식이다.", "case": "Meinhard v. Salmon, 249 N.Y. 458, 464 (1928)", "decided": "1928. 12. 31. 선고 (뉴욕주 최고법원 Court of Appeals, 4 대 3)", "gloss": {"punctilio": "격식의 세세한 점, 꼼꼼한 예절", "an honor the most sensitive": "가장 예민한 명예(형용사가 뒤에서 꾸미는 옛 문체)", "standard of behavior": "행동 기준"}, "why": "샐먼은 뉴욕 맨해튼의 호텔 건물을 20년 동안 빌려 상가·사무실로 고쳐 운영했고, 마인하드는 그 자금의 절반을 댄 동업자였습니다. 임대차가 끝나 갈 무렵 건물주가 이웃 땅까지 묶은 훨씬 큰 새 임대 사업을 샐먼에게 제안했고, 샐먼은 마인하드에게 알리지 않고 혼자 계약했습니다. 카도조 대법원장은 동업자 사이의 신인의무는 시장의 도덕보다 엄격하다며 샐먼이 그 기회를 나누어야 한다고 판단했습니다. 이 문장은 지금도 신인의무의 높이를 말할 때 가장 먼저 인용됩니다. 앤드루스 판사 등 3명은 반대했습니다.", "links": [{"label": "NY Courts — Meinhard v. Salmon 판결 원문(뉴욕주 법원 공식 사이트)", "url": "https://www.nycourts.gov/reporter/archives/meinhard_salmon.htm"}, {"label": "Wikipedia — Meinhard v. Salmon", "url": "https://en.wikipedia.org/wiki/Meinhard_v._Salmon"}]}, "korea": {"title": "이사는 누구를 위해 일하나?", "us": "델라웨어에서 이사는 회사와 주주(the corporation and its stockholders)에게 신인의무를 집니다. 정관으로 주의의무 위반의 금전배상 책임은 면제할 수 있어도 충실의무 위반 책임은 면제할 수 없습니다(Del. Code tit. 8, § 102(b)(7)).", "kr": "상법 제382조의3은 오랫동안 이사가 '회사를 위하여' 직무를 충실하게 수행해야 한다고만 정했습니다. 2025년 개정으로 현행 조문은 '회사 및 주주를 위하여'라고 정하고, 제2항에서 총주주의 이익을 보호하고 전체 주주의 이익을 공평하게 대우하라고 덧붙였습니다. 경영판단원칙은 조문이 아니라 판례로 인정됩니다. 주주가 회사를 대신해 이사의 책임을 묻는 대표소송은 상법 제403조가 정합니다. 발행주식 총수의 100분의 1 이상을 가진 주주가 먼저 회사에 제소를 청구하고, 회사가 30일 안에 소를 내지 않으면 직접 소를 낼 수 있습니다.", "say": "Since a 2025 amendment, Korea's Commercial Act provides that directors must perform their duties for the company and its shareholders.", "say_ko": "2025년 개정 이후 한국 상법은 이사가 회사와 주주를 위하여 직무를 수행해야 한다고 정하고 있습니다."}}, "quiz": [{"q": "회사를 경영하는 권한이 원칙적으로 있는 기관은? (델라웨어 일반회사법 § 141(a))", "options": ["the shareholders", "the board of directors", "the SEC", "the officers' union"], "answer": 1, "why": "회사의 업무는 이사회가 또는 이사회의 지휘 아래 경영합니다. 주주는 이사 선임과 합병 승인 같은 권한을 갖지만 일상 경영은 하지 않고, SEC는 증권 시장의 감독기관입니다."}, {"q": "주주가 회사를 대신해 이사를 상대로 내는 소송은?", "options": ["class action", "derivative suit", "tender offer"], "answer": 1, "why": "derivative suit(대표소송)는 회사의 권리를 주주가 대신 행사하고, 이기면 배상금이 회사로 갑니다. class action은 여러 사람을 대표해 자기들의 권리를 주장하는 집단소송입니다."}, {"q": "'The SEC filed a complaint about the company's securities.'에서 securities의 뜻은?", "options": ["보안 장치", "증권", "담보"], "answer": 1, "why": "security는 일상어로 '보안'이지만 복수형 securities는 주식·사채 같은 '증권'입니다."}, {"q": "문법: 빈칸에 맞는 것은? — She owns 100 ____ of the company's stock.", "options": ["stock", "stocks", "shares"], "answer": 2, "why": "몇 주인지 셀 때는 shares. stock은 주식 일반을 가리키는 묶음 명사로 쓰고, stocks는 '여러 종목'이라는 뜻이 됩니다.", "grammar": "G2"}, {"q": "번역해 보세요: The directors owe a fiduciary duty to the shareholders.", "options": ["이사들은 주주들에게 돈을 빌렸다.", "이사들은 주주들에게 신인의무를 진다.", "이사들은 주주들에게 신탁을 맡겼다."], "answer": 1, "why": "owe a duty to A = A에게 의무를 지다. owe는 '빚지다'만이 아니라 의무를 '지다'에도 씁니다(→ 9장 owe a duty of care)."}]}, {"chapter": {"num": 13, "title": "도산", "subtitle": "Chapter 11은 파산이 아니다", "title_en": "Bankruptcy — Chapter 11 Is Not the End", "lead": "미국에서 bankruptcy는 회사 문을 닫는 절차만 가리키지 않습니다. 연방파산법(Bankruptcy Code)의 장(Chapter) 번호가 곧 절차 이름이 되어, Chapter 7은 청산, Chapter 11은 주로 재건, Chapter 13은 개인의 채무 조정을 뜻합니다. 그래서 'Chapter 11을 신청했다'는 뉴스는 대개 문을 닫았다는 소식이 아니라 영업을 이어 가며 빚을 정리하려 한다는 소식입니다(Chapter 11 안에서 청산계획을 세우는 경우도 있습니다). 이 장은 신청서 접수부터 면책까지의 말을 다룹니다.", "can_say": [{"en": "The company filed for Chapter 11 last month.", "ko": "그 회사는 지난달 Chapter 11(회생)을 신청했습니다."}, {"en": "Chapter 11 is usually used to reorganize a business, not to liquidate it.", "ko": "Chapter 11은 보통 청산이 아니라 사업 재건에 쓰입니다."}, {"en": "Once the petition is filed, the automatic stay generally stops creditors from collecting prepetition debts.", "ko": "신청서가 접수되면 자동정지에 따라 채권자는 원칙적으로 신청 전 채권의 추심을 멈춰야 합니다."}]}, "entries": [{"id": "insolvency", "hw": "insolvency · insolvent", "ipa": "ɪnˈsɑːl.vən.si · ɪnˈsɑːl.vənt", "stress": "in·**sol**·ven·cy · in·**sol**·vent", "stars": 3, "gloss": "도산 상태(지급불능·부채초과) · 그런 상태인", "diff": "insolvency는 재무 '상태'를 가리키고, bankruptcy는 법원에서 밟는 '절차'를 가리킵니다. 일상·사전적 뜻은 빚을 갚을 돈이 없는 상태(지급불능, Cambridge)지만, 연방파산법의 정의는 부채 총액이 재산의 공정가치를 넘는 상태, 곧 부채초과입니다(11 U.S.C. § 101(32)(A)). 둘은 같지 않습니다. 재산은 많아도 현금이 없어 못 갚는 회사가 있고, 그 반대도 있습니다. 도산 상태여도 파산 신청을 하지 않을 수 있고, 도산 상태가 아니어도 Chapter 11을 신청할 수 있습니다. 영국과 국제 문서에서는 절차 전체를 insolvency라고 부르는 일이 많습니다.", "uk": "insolvency (영국에서는 도산 절차 전체를 가리키는 말로도 씀)", "examples": {"easy": {"en": "The company is insolvent.", "ko": "그 회사는 빚을 갚을 수 없는 상태다."}, "practice": {"en": "By March, the firm's debts exceeded its assets, and it was clearly insolvent.", "ko": "3월이 되자 그 회사의 부채가 자산을 넘어 명백한 부채초과 상태가 되었다."}, "source": {"en": "the debtor is presumed to have been insolvent on and during the 90 days immediately preceding the date of the filing of the petition.", "ko": "채무자는 신청일 직전 90일 동안 부채초과 상태(insolvent — § 101(32)의 정의)였던 것으로 추정된다.", "cite": "11 U.S.C. § 547(f) — 편파행위 부인(→ preference)에서의 추정", "url": "https://www.law.cornell.edu/uscode/text/11/547", "glossary": {"presume": "추정하다", "immediately preceding": "바로 앞의, 직전의"}}}, "grammar": {"axis": "G3", "title": "insolvency는 상태 — 셀 수 없다", "wrong": "The company fell into an insolvency.", "right": "The company fell into insolvency. / The company became insolvent.", "note": "상태를 말하는 insolvency에는 a를 붙이지 않습니다. 형용사 insolvent를 쓰면 문장이 더 자연스럽습니다."}, "collocations": ["become insolvent", "on the brink of insolvency (도산 직전)", "balance-sheet insolvency (부채초과)", "cash-flow insolvency (지급불능)"], "links": [{"label": "LII Wex — insolvency", "url": "https://www.law.cornell.edu/wex/insolvency"}]}, {"id": "bankruptcy", "hw": "bankruptcy", "ipa": "ˈbæŋ.krəpt.si", "stress": "**bank**·rupt·cy", "stars": 3, "false_friend": true, "gloss": "도산(절차), 파산", "diff": "한국어 '파산'은 청산형 절차(파산절차)만 가리킵니다. 미국 bankruptcy는 청산(Chapter 7)과 재건(Chapter 11)·개인 채무조정(Chapter 13)을 모두 포함하는 연방 도산절차 전체의 이름입니다. 그래서 'Chapter 11 bankruptcy'를 '파산'으로 옮기면 뜻이 뒤집힙니다.", "pron_tip": "p는 거의 들리지 않습니다. bank-rupt-cy 세 음절이고 강세는 첫 음절.", "examples": {"easy": {"en": "The airline filed for bankruptcy.", "ko": "그 항공사는 도산 절차를 신청했다."}, "practice": {"en": "The retailer went bankrupt after two years of falling sales.", "ko": "그 소매업체는 2년 동안 매출이 줄어든 끝에 도산했다."}, "source": {"en": "the district courts shall have original and exclusive jurisdiction of all cases under title 11.", "ko": "연방지방법원은 제11편에 따른 모든 사건에 관하여 제1심 전속관할을 가진다.", "cite": "28 U.S.C. § 1334(a)", "url": "https://www.law.cornell.edu/uscode/text/28/1334", "glossary": {"original jurisdiction": "제1심 관할", "exclusive": "전속적인", "title 11": "연방법전 제11편 — 곧 연방파산법"}}}, "box": "도산은 연방 사건입니다. 주 법원이 아니라 연방법원이 맡고, 실제 심리는 연방지방법원에 딸린 파산법원(bankruptcy court)이 합니다. 미국 헌법 제1조 제8항이 의회에 '파산에 관한 통일적인 법률'을 만들 권한을 준 것이 그 출발점입니다.", "grammar": {"axis": "G5", "title": "go bankrupt — bankrupt는 자동사가 아니다", "wrong": "The company bankrupted. / The company went to bankrupt.", "right": "The company went bankrupt. / The company filed for bankruptcy.", "note": "'도산하다'는 go bankrupt(bankrupt는 형용사). bankrupt를 자동사로 쓰지 않습니다(타동사 bankrupt A는 'A를 도산시키다'). '도산을 신청하다'는 file for bankruptcy가 기본형이고, 미국에서는 for 없이 file bankruptcy라고도 합니다(연방법원 안내문: Individuals can file bankruptcy without a lawyer)."}, "collocations": ["file for bankruptcy", "go bankrupt", "bankruptcy court", "bankruptcy protection"], "links": [{"label": "LII Wex — bankruptcy", "url": "https://www.law.cornell.edu/wex/bankruptcy"}]}, {"id": "bankruptcy-code", "hw": "Bankruptcy Code", "ipa": "ˈbæŋ.krəpt.si koʊd", "stress": "**bank**·rupt·cy **code**", "stars": 2, "gloss": "연방파산법(미국 연방법전 제11편, 11 U.S.C.)", "diff": "1978년 제정된 연방법으로, 연방법전(U.S. Code) 제11편(Title 11)에 실려 있습니다. 이 편의 장(chapter) 번호가 그대로 절차 이름이 되었습니다. 제7·9·11·12·13·15장이 개별 절차이고, 제1·3·5장은 주로 제7·11·12·13장 절차에 공통으로 적용됩니다. 제9장(지방자치단체)과 제15장(국제도산)에는 따로 정한 적용 규칙이 있습니다(§ 103).", "examples": {"easy": {"en": "Read the Bankruptcy Code first.", "ko": "연방파산법부터 읽어 보세요."}, "practice": {"en": "Under the Bankruptcy Code, an individual debtor may choose between Chapter 7 and Chapter 13.", "ko": "연방파산법상 개인 채무자는 Chapter 7과 Chapter 13 중에서 고를 수 있다."}}, "grammar": {"axis": "G1", "title": "법률 이름에는 the", "wrong": "Under Bankruptcy Code, ...", "right": "Under the Bankruptcy Code, ...", "note": "the Bankruptcy Code, the Constitution처럼 특정 법전 이름에는 the를 붙입니다. 다만 'Title 11', 'Chapter 11'처럼 번호로 부를 때는 관사를 쓰지 않습니다."}, "collocations": ["under the Bankruptcy Code", "Title 11 of the United States Code", "section 362 of the Code"], "links": [{"label": "LII — 11 U.S.C. (연방파산법 전체 목차)", "url": "https://www.law.cornell.edu/uscode/text/11"}]}, {"id": "debtor", "hw": "debtor · creditor", "ipa": "ˈdet̬.ɚ · ˈkred.ɪ.t̬ɚ", "stress": "**debt**·or · **cred**·i·tor", "stars": 3, "gloss": "채무자 · 채권자", "pron_tip": "debtor·debt의 b는 소리 나지 않습니다. /ˈdet̬.ɚ/ — doubt의 b와 같은 경우입니다.", "examples": {"easy": {"en": "The debtor owes money to three banks.", "ko": "채무자는 은행 세 곳에 돈을 빚지고 있다."}, "practice": {"en": "One of the creditors objected to the sale of the factory.", "ko": "채권자 중 한 명이 공장 매각에 이의를 제기했다."}, "source": {"en": "means person or municipality concerning which a case under this title has been commenced.", "ko": "(채무자란) 이 편에 따른 사건이 개시된 사람 또는 지방자치단체를 말한다.", "cite": "11 U.S.C. § 101(13) — 'debtor'의 정의", "url": "https://www.law.cornell.edu/uscode/text/11/101", "glossary": {"municipality": "지방자치단체(Chapter 9 절차의 채무자)", "person": "자연인뿐 아니라 법인·조합을 포함"}}}, "box": "연방파산법에서 debtor는 '빚진 사람' 일반이 아니라 '사건이 개시된 사람'입니다. 신청 전에는 채무자가 아니라는 뜻이어서, 한국법의 '채무자'와 범위가 다릅니다.", "grammar": {"axis": "G2", "title": "one of the creditors — 복수로 받는다", "wrong": "One of the creditor objected.", "right": "One of the creditors objected.", "note": "채권자는 보통 여럿이므로 the creditors. one of 뒤는 반드시 복수명사입니다."}, "collocations": ["debtor and creditors", "creditors' committee (채권자위원회)", "owe a debt to"], "links": [{"label": "LII Wex — debtor", "url": "https://www.law.cornell.edu/wex/debtor"}, {"label": "LII Wex — creditor", "url": "https://www.law.cornell.edu/wex/creditor"}]}, {"id": "petition", "hw": "petition", "ipa": "pəˈtɪʃ.ən", "stress": "pe·**ti**·tion", "stars": 3, "false_friend": true, "gloss": "(도산절차 개시) 신청(서)", "diff": "일상어로는 '청원', 서명운동의 '청원서'입니다. 도산에서 petition은 절차를 여는 신청서이고, 이를 접수하는 순간 절차가 개시됩니다. 채무자가 내면 voluntary petition(자발적 신청), 채권자가 내면 involuntary petition(채권자 신청)입니다.", "examples": {"easy": {"en": "She filed a petition yesterday.", "ko": "그녀는 어제 신청서를 냈다."}, "practice": {"en": "The company filed a petition under Chapter 11 with the bankruptcy court in Delaware.", "ko": "회사는 델라웨어주 파산법원에 Chapter 11 신청서를 냈다."}, "source": {"en": "A voluntary case under a chapter of this title is commenced by the filing with the bankruptcy court of a petition under such chapter by an entity that may be a debtor under such chapter.", "ko": "이 편의 어느 장에 따른 자발적 사건은 그 장의 채무자가 될 수 있는 주체가 그 장에 따른 신청서를 파산법원에 제출함으로써 개시된다.", "cite": "11 U.S.C. § 301(a)", "url": "https://www.law.cornell.edu/uscode/text/11/301", "glossary": {"voluntary case": "자발적 사건(채무자 스스로 신청한 사건)", "entity": "주체(개인·법인·정부 포함)"}}}, "box": "한국 회생절차는 신청 뒤 법원의 개시결정이 있어야 시작됩니다. 미국 자발적 사건은 신청서 접수 자체가 '구제명령(order for relief)'이 되어(§ 301(b)), 따로 개시결정을 기다리지 않습니다.", "grammar": {"axis": "G4", "title": "file a petition under A with B", "wrong": "file a petition to the court by Chapter 11", "right": "file a petition under Chapter 11 with the court", "note": "근거 조문·장은 under, 제출처는 with. '법원에 내다'의 '에'를 to로 옮기기 쉽지만 with가 맞습니다."}, "collocations": ["file a petition", "voluntary / involuntary petition", "petition date (신청일)"], "links": [{"label": "LII Wex — petition", "url": "https://www.law.cornell.edu/wex/petition"}]}, {"id": "chapter-7", "hw": "Chapter 7", "ipa": "ˈtʃæp.tɚ ˈsev.ən", "stress": "**chap**·ter **sev**·en", "stars": 3, "gloss": "청산형 도산절차(연방파산법 제7장)", "diff": "관재인(trustee)이 채무자의 재산을 팔아 채권자에게 나눠 주는 절차입니다. 한국의 파산절차와 가깝습니다. 개인 채무자는 대부분의 빚을 면책받고, 회사는 면책 없이 정리됩니다(§ 727(a)(1) — 면책은 개인만).", "examples": {"easy": {"en": "He filed for Chapter 7.", "ko": "그는 Chapter 7(청산형 절차)을 신청했다."}, "practice": {"en": "In a Chapter 7 case, the trustee sells the debtor's assets and pays the creditors.", "ko": "Chapter 7 사건에서는 관재인이 채무자의 자산을 팔아 채권자들에게 변제한다."}, "source": {"en": "collect and reduce to money the property of the estate for which such trustee serves", "ko": "(관재인은) 자신이 맡은 재단의 재산을 모아 금전으로 환가하여야 한다", "cite": "11 U.S.C. § 704(a)(1) — Chapter 7 관재인의 의무", "url": "https://www.law.cornell.edu/uscode/text/11/704", "glossary": {"reduce to money": "금전으로 바꾸다, 환가하다", "estate": "(도산)재단"}}}, "grammar": {"axis": "G1", "title": "Chapter 7에는 관사가 없다 — 단, a Chapter 7 case", "wrong": "He filed for the Chapter 7.", "right": "He filed for Chapter 7. / It is a Chapter 7 case.", "note": "번호가 붙은 이름은 관사 없이 씁니다. Chapter 7이 형용사처럼 명사를 꾸밀 때는 그 명사에 관사를 붙입니다(a Chapter 7 case)."}, "collocations": ["file for Chapter 7", "a Chapter 7 trustee", "convert to Chapter 7 (Chapter 7으로 전환하다)"], "links": [{"label": "LII Wex — Chapter 7 bankruptcy", "url": "https://www.law.cornell.edu/wex/chapter_7_bankruptcy"}, {"label": "U.S. Courts — Chapter 7 Bankruptcy Basics", "url": "https://www.uscourts.gov/court-programs/bankruptcy/bankruptcy-basics/chapter-7-bankruptcy-basics"}]}, {"id": "chapter-11", "hw": "Chapter 11", "ipa": "ˈtʃæp.tɚ əˈlev.ən", "stress": "**chap**·ter e·**lev**·en", "stars": 3, "false_friend": true, "gloss": "재건형 도산절차(연방파산법 제11장)", "diff": "회사가 문을 닫지 않고 영업을 계속하면서 빚을 조정하는 데 주로 쓰는 절차입니다. 다만 Chapter 11 안에서 청산계획(liquidating plan)을 세우는 것도 허용됩니다(U.S. Courts — Chapter 11 Basics). 한국의 회생절차와 기능이 가깝지만, 원칙적으로 관리인을 따로 두지 않고 기존 경영진이 회사를 계속 운영한다는 점(→ debtor in possession)이 다릅니다. 개인도 신청할 수 있습니다.", "examples": {"easy": {"en": "The airline is in Chapter 11.", "ko": "그 항공사는 Chapter 11 절차를 밟고 있다."}, "practice": {"en": "The company emerged from Chapter 11 after eighteen months with a new board.", "ko": "그 회사는 18개월 만에 새 이사회를 꾸려 Chapter 11 절차를 마쳤다."}, "source": {"en": "Confirmation of the plan is not likely to be followed by the liquidation, or the need for further financial reorganization, of the debtor or any successor to the debtor under the plan, unless such liquidation or reorganization is proposed in the plan.", "ko": "계획을 인가하더라도 그 뒤에 채무자나 계획상 그 승계인의 청산 또는 추가적인 재무 구조조정이 필요하게 될 가능성이 크지 않을 것. 다만 그 청산이나 구조조정이 계획에 정해져 있는 경우는 그러하지 아니하다.", "cite": "11 U.S.C. § 1129(a)(11) — 인가 요건 중 '수행 가능성(feasibility)'", "url": "https://www.law.cornell.edu/uscode/text/11/1129", "glossary": {"liquidation": "청산", "reorganization": "재건, 구조조정", "be followed by": "뒤이어 ~가 오다", "unless … proposed in the plan": "계획 자체가 청산을 정한 경우(청산계획)는 이 요건의 예외"}}}, "box": "뉴스의 'filed for Chapter 11 bankruptcy protection'은 대개 '회생을 신청했다'로 옮기는 편이 정확합니다. 2008년 9월 리먼 브러더스가 낸 것도 Chapter 11 신청이었습니다(→ 「법정 드라마로 배우기」).", "grammar": {"axis": "G4", "title": "in / into / out of / from Chapter 11", "wrong": "The company emerged out Chapter 11 a year later.", "right": "The company went into Chapter 11 and emerged from Chapter 11 a year later.", "note": "절차에 들어가면 go into, 진행 중이면 in, 마치고 나오면 emerge from. 절차를 '장소'처럼 다루는 전치사입니다. escaped Chapter 11은 문법은 맞지만 '절차를 피했다(신청하지 않고 넘겼다)'는 다른 뜻입니다."}, "collocations": ["file for Chapter 11", "be in Chapter 11", "emerge from Chapter 11", "Chapter 11 bankruptcy protection"], "links": [{"label": "LII Wex — Chapter 11 bankruptcy", "url": "https://www.law.cornell.edu/wex/chapter_11_bankruptcy"}, {"label": "U.S. Courts — Chapter 11 Bankruptcy Basics", "url": "https://www.uscourts.gov/court-programs/bankruptcy/bankruptcy-basics/chapter-11-bankruptcy-basics"}]}, {"id": "chapter-13", "hw": "Chapter 13", "ipa": "ˈtʃæp.tɚ θɝːˈtiːn", "stress": "**chap**·ter thir·**teen**", "stars": 2, "gloss": "개인 채무조정 절차(연방파산법 제13장)", "diff": "정기 수입이 있는 개인이 재산을 지키면서 3~5년에 걸쳐 빚을 갚는 절차입니다. 한국의 개인회생과 구조가 비슷하고, 변제기간도 원칙 3년·최장 5년으로 닮았습니다. 'wage earner's plan(급여소득자 계획)'이라고도 부릅니다.", "pron_tip": "thirteen은 끝 음절 -teen에 강세가 옵니다. thirty(ˈθɝː.t̬i)와 혼동하지 않도록 끝을 길게.", "examples": {"easy": {"en": "They chose Chapter 13 to keep their house.", "ko": "그들은 집을 지키려고 Chapter 13을 택했다."}, "practice": {"en": "Under her Chapter 13 plan, she will pay her creditors over five years.", "ko": "Chapter 13 계획에 따라 그녀는 5년에 걸쳐 채권자들에게 변제한다."}, "source": {"en": "may not provide for payments over a period that is longer than 5 years.", "ko": "(계획은) 5년을 넘는 기간에 걸친 변제를 정할 수 없다.", "cite": "11 U.S.C. § 1322(d)", "url": "https://www.law.cornell.edu/uscode/text/11/1322"}}, "grammar": {"axis": "G2", "title": "over five years — 기간은 복수", "wrong": "pay over five year / a five years plan", "right": "pay over five years / a five-year plan", "note": "숫자 뒤 명사는 복수(five years). 다만 하이픈으로 묶어 형용사가 되면 단수(a five-year plan)."}, "collocations": ["file for Chapter 13", "Chapter 13 plan", "wage earner's plan"], "links": [{"label": "LII Wex — Chapter 13 bankruptcy", "url": "https://www.law.cornell.edu/wex/chapter_13_bankruptcy"}, {"label": "U.S. Courts — Chapter 13 Bankruptcy Basics", "url": "https://www.uscourts.gov/court-programs/bankruptcy/bankruptcy-basics/chapter-13-bankruptcy-basics"}]}, {"id": "chapter-15", "hw": "Chapter 15", "ipa": "ˈtʃæp.tɚ ˌfɪfˈtiːn", "stress": "**chap**·ter fif·**teen**", "stars": 1, "gloss": "국제도산(외국 도산절차의 승인·지원, 연방파산법 제15장)", "diff": "외국 법원의 도산절차를 미국 법원이 승인(recognition)하고 지원하는 절차입니다. UNCITRAL 국제도산 모델법을 받아들인 것입니다(§ 1501(a)). 한국도 「채무자 회생 및 파산에 관한 법률」에 국제도산 편(제628조 이하)을 두어 외국도산절차의 승인과 지원을 정합니다.", "examples": {"easy": {"en": "Chapter 15 deals with foreign cases.", "ko": "Chapter 15는 외국 도산 사건을 다룬다."}, "practice": {"en": "The foreign representative filed a petition for recognition of the foreign proceeding.", "ko": "외국 도산절차의 대표자가 그 절차의 승인을 구하는 신청을 했다."}, "source": {"en": "an order recognizing a foreign proceeding shall be entered if", "ko": "다음 요건을 갖추면 외국 도산절차를 승인하는 명령을 하여야 한다", "cite": "11 U.S.C. § 1517(a)", "url": "https://www.law.cornell.edu/uscode/text/11/1517", "glossary": {"foreign proceeding": "외국 도산절차", "recognize": "승인하다"}}}, "box": "승인된 외국절차는 '주된 절차(foreign main proceeding)'와 '종된 절차(foreign nonmain proceeding)'로 나뉩니다. 채무자의 주된 이익 중심지(COMI)가 있는 나라의 절차가 주된 절차입니다.", "grammar": {"axis": "G4", "title": "recognition of A — 무엇의 승인인지는 of", "wrong": "recognition for the foreign proceeding", "right": "recognition of the foreign proceeding / a petition for recognition", "note": "승인의 대상은 of, 신청의 목적은 for. 'a petition for recognition of a foreign proceeding'에 둘이 함께 나옵니다."}, "collocations": ["petition for recognition", "foreign representative (외국도산절차의 대표자)", "foreign main proceeding"], "links": [{"label": "U.S. Courts — Chapter 15 Bankruptcy Basics", "url": "https://www.uscourts.gov/court-programs/bankruptcy/bankruptcy-basics/chapter-15-bankruptcy-basics"}, {"label": "LII — 11 U.S.C. Chapter 15", "url": "https://www.law.cornell.edu/uscode/text/11/chapter-15"}]}, {"id": "automatic-stay", "hw": "automatic stay", "ipa": "ˌɑː.t̬əˈmæt̬.ɪk steɪ", "stress": "au·to·**mat**·ic **stay**", "stars": 3, "false_friend": true, "gloss": "자동정지(신청과 동시에 채권자의 추심·집행이 멈추는 효력)", "diff": "핵심은 '자동'입니다. 미국에서는 신청서를 내는 순간 법원 결정 없이 효력이 생깁니다. 한국 회생절차에서는 강제집행 등을 막는 효과가 회생절차개시결정과 함께 생기고(채무자회생법 제58조), 신청부터 개시결정까지는 법원이 중지명령·포괄적 금지명령을 따로 내야 합니다. 그래서 'Korea also has an automatic stay'라고 하면 틀립니다.", "examples": {"easy": {"en": "The automatic stay stopped the lawsuit.", "ko": "자동정지 때문에 소송이 멈췄다."}, "practice": {"en": "The creditor asked the court for relief from the automatic stay.", "ko": "채권자가 법원에 자동정지 해제를 신청했다."}, "source": {"en": "operates as a stay, applicable to all entities, of— (1) the commencement or continuation, including the issuance or employment of process, of a judicial, administrative, or other action or proceeding against the debtor that was or could have been commenced before the commencement of the case under this title, or to recover a claim against the debtor that arose before the commencement of the case under this title", "ko": "(신청은) 모든 주체에 대하여 다음 각 호의 정지로서 효력을 가진다. (1) 이 편에 따른 사건이 개시되기 전에 개시되었거나 개시될 수 있었던, 채무자를 상대로 한 사법·행정 그 밖의 소송이나 절차, 또는 사건 개시 전에 생긴 채무자에 대한 채권을 회수하기 위한 소송이나 절차의 개시 또는 속행(소송서류의 발부·사용을 포함한다)", "cite": "11 U.S.C. § 362(a)(1)", "url": "https://www.law.cornell.edu/uscode/text/11/362", "glossary": {"operate as": "~로서 효력을 가지다", "entities": "주체(개인·법인·정부 포함)", "commencement or continuation": "개시 또는 속행"}}}, "box": "미국 기업이 Chapter 11을 신청하는 이유 중 하나가 이 효력입니다. 신청 당일부터 신청 전 채권에 관한 소송, 압류, 담보권 실행, 독촉이 원칙적으로 멈춥니다. 다만 형사절차, 부양료 관련 절차 등 § 362(b)가 열거한 예외는 멈추지 않습니다. 채권자가 계속하려면 법원에 relief from stay(정지 해제)를 따로 신청해야 합니다.", "pitfalls": ["stay를 '머무르다'로 읽기 — 법률 영어에서 stay는 '(절차의) 정지'. stay of execution은 집행정지", "automatic stay와 법원이 내리는 injunction(금지명령)을 섞어 쓰기 — 앞의 것은 법률상 당연히 생기는 효력"], "grammar": {"axis": "G4", "title": "relief from the stay — from을 쓴다", "wrong": "relief of the automatic stay", "right": "relief from the automatic stay", "note": "정지에서 '풀려나는' 것이므로 from. 동사로는 lift the stay(정지를 해제하다)."}, "collocations": ["relief from (the) stay", "lift the stay", "violate the automatic stay", "stay of execution"], "links": [{"label": "LII Wex — automatic stay", "url": "https://www.law.cornell.edu/wex/automatic_stay"}]}, {"id": "trustee", "hw": "trustee", "ipa": "ˌtrʌsˈtiː", "stress": "trus·**tee**", "stars": 2, "false_friend": true, "gloss": "(도산) 관재인", "diff": "11장(가족법과 상속)의 trustee는 신탁의 수탁자입니다. 도산에서 trustee는 채무자의 재산(재단)을 관리·환가해 채권자에게 나눠 주는 사람으로, 한국 파산절차의 파산관재인에 가깝습니다. Chapter 7에서는 반드시 선임되고, 일반 Chapter 11에서는 예외적으로만 선임됩니다. 다만 소규모 채무자를 위한 Subchapter V 사건에는 관재인이 관여하도록 따로 정해 두었습니다(§ 1183(a)). 법무부 소속 감독 기관인 United States trustee(연방관재인)와도 구별합니다.", "pron_tip": "강세는 끝 음절 -tee입니다. payee도 같지만, -ee로 끝나는 말이 모두 그렇지는 않습니다(employee의 Cambridge US 대표 표기는 /ɪmˈplɔɪ.iː/).", "examples": {"easy": {"en": "The trustee sold the house.", "ko": "관재인이 그 집을 팔았다."}, "practice": {"en": "The court appointed a trustee because the managers had hidden assets.", "ko": "경영진이 자산을 숨겼기 때문에 법원은 관재인을 선임했다."}, "source": {"en": "the trustee has the burden of proving the avoidability of a transfer under subsection (b) of this section", "ko": "관재인은 (b)항에 따른 이전행위가 부인 대상이라는 점을 증명할 책임을 진다", "cite": "11 U.S.C. § 547(g)", "url": "https://www.law.cornell.edu/uscode/text/11/547", "glossary": {"burden of proving": "증명책임", "avoidability": "부인 가능성(→ preference)"}}}, "grammar": {"axis": "G6", "title": "appoint a trustee — 선임은 appoint", "wrong": "The court appointed trustee.", "right": "The court appointed a trustee.", "note": "법원이 관재인·관리인을 정할 때는 appoint. trustee는 셀 수 있는 명사라 관사가 필요합니다. selected a trustee도 틀린 문장은 아니지만 '골랐다'는 뜻일 뿐, 법률상 선임 행위는 appoint로 씁니다. 명사는 appointment of a trustee."}, "collocations": ["appoint a trustee", "Chapter 7 trustee", "United States trustee (연방관재인)"], "links": [{"label": "LII Wex — trustee", "url": "https://www.law.cornell.edu/wex/trustee"}]}, {"id": "dip", "hw": "debtor in possession (DIP)", "ipa": "ˈdet̬.ɚ ɪn pəˈzeʃ.ən", "stress": "**debt**·or in pos·**ses**·sion", "stars": 2, "gloss": "점유 채무자(관재인 없이 스스로 재산을 관리하며 절차를 밟는 채무자)", "diff": "Chapter 11에서는 기존 경영진이 그대로 회사를 운영하며 관재인의 권한을 행사합니다. 한국 회생절차도 원칙적으로 채무자의 대표자를 관리인으로 선임하고(채무자회생법 제74조 제2항), 관리인을 선임하지 않으면 대표자를 관리인으로 봅니다(같은 조 제4항). 그래서 '관리인 지위의 채무자'라고 옮기기도 합니다. 다만 한국에서는 채무자가 재산을 관리하더라도 법원의 선임이나 법률상 간주로 얻은 '관리인' 지위를 거친다는 점이 다릅니다. 미국 DIP는 별도 지위 부여 없이 채무자 자신이 관재인의 권한을 행사합니다(§ 1101(1), § 1107).", "examples": {"easy": {"en": "The debtor stays in possession.", "ko": "채무자가 계속 재산을 관리한다."}, "practice": {"en": "As debtor in possession, the company kept running its stores during the case.", "ko": "회사는 점유 채무자로서 절차 진행 중에도 매장 영업을 계속했다."}, "source": {"en": "means debtor except when a person that has qualified under section 322 of this title is serving as trustee in the case", "ko": "(점유 채무자란) 채무자를 말한다. 다만 이 편 제322조에 따라 자격을 갖춘 사람이 그 사건의 관재인으로 직무를 수행하는 경우는 제외한다", "cite": "11 U.S.C. § 1101(1) — 'debtor in possession'의 정의", "url": "https://www.law.cornell.edu/uscode/text/11/1101"}}, "grammar": {"axis": "G4", "title": "in possession — '점유 중인' 상태의 in", "wrong": "debtor of possession / debtor on possession", "right": "debtor in possession", "note": "in possession은 '점유하고 있는'이라는 상태 표현입니다. take possession of(점유를 취득하다), in possession of(~을 갖고 있는)도 함께 익혀 둡니다."}, "collocations": ["debtor in possession", "DIP financing", "take possession of"], "links": [{"label": "LII Wex — debtor in possession", "url": "https://www.law.cornell.edu/wex/debtor_in_possession"}]}, {"id": "dip-financing", "hw": "DIP financing", "ipa": "dɪp fəˈnæn.sɪŋ", "stress": "**DIP** fi·**nanc**·ing", "stars": 2, "gloss": "DIP 금융(절차 중인 채무자에게 주는 신규 자금)", "diff": "절차 중인 회사는 보통 조건으로는 새로 돈을 빌리기 어려울 수 있으므로, 법원이 단계적으로 신규 대여금에 관리비용 우선권, 그보다 앞선 우선권이나 담보를 붙여 줄 수 있게 한 제도입니다(§ 364(a)–(d)). 한국 회생절차에서는
