parties agreed.", "ko": "양 당사자가 동의했다."}, "practice": {"en": "One of the parties asked for more time to respond.", "ko": "당사자 중 한쪽이 답변 기한 연장을 요청했다."}, "source": {"en": "An action must be prosecuted in the name of the real party in interest.", "ko": "소송은 실질적 이해당사자의 이름으로 수행되어야 한다.", "cite": "Fed. R. Civ. P. 17(a)(1)", "url": "https://www.law.cornell.edu/rules/frcp/rule_17", "glossary": {"prosecute": "(소송을) 수행하다 — 형사 '기소'만 뜻하지 않는다", "real party in interest": "실질적 이해당사자"}}}, "grammar": {"axis": "G2", "title": "one of + 복수명사", "wrong": "One of the party asked for more time.", "right": "One of the parties asked for more time.", "note": "'여럿 중 하나'이므로 뒤는 반드시 복수. 동사는 one에 맞춰 단수(asks)입니다. one of my friends도 같은 원리."}, "collocations": ["both parties", "third party (제3자)", "opposing party (상대방)", "party to the contract"], "links": [{"label": "LII Wex — party", "url": "https://www.law.cornell.edu/wex/party"}]}, {"id": "plaintiff", "hw": "plaintiff · defendant", "ipa": "ˈpleɪn.t̬ɪf · dɪˈfen.dənt", "stress": "**plain**·tiff · de·**fen**·dant", "stars": 3, "uk": "claimant (원고, 잉글랜드 민사)", "gloss": "원고 · 피고", "examples": {"easy": {"en": "The plaintiff won.", "ko": "원고가 이겼다."}, "practice": {"en": "The plaintiff seeks damages from both defendants.", "ko": "원고는 두 피고 모두에게 손해배상을 구한다."}, "source": {"en": "On or after filing the complaint, the plaintiff may present a summons to the clerk for signature and seal.", "ko": "원고는 소장을 낸 때 또는 그 뒤에 소환장을 법원 사무관에게 제출하여 서명과 날인을 받을 수 있다.", "cite": "Fed. R. Civ. P. 4(b)", "url": "https://www.law.cornell.edu/rules/frcp/rule_4", "glossary": {"clerk": "법원 사무관", "seal": "법원 인장"}}}, "grammar": {"axis": "G1", "title": "사건 속 당사자에는 the", "wrong": "Plaintiff filed a motion.", "right": "The plaintiff filed a motion.", "note": "특정 사건의 원고·피고는 이미 정해진 사람이므로 the. 다만 판결문에서는 이름처럼 쓰여 관사 없이 Plaintiff라고 대문자로 쓰기도 합니다(문체 관행)."}, "collocations": ["co-defendant (공동피고)", "named plaintiff (대표 원고)"], "links": [{"label": "LII Wex — plaintiff", "url": "https://www.law.cornell.edu/wex/plaintiff"}, {"label": "LII Wex — defendant", "url": "https://www.law.cornell.edu/wex/defendant"}]}, {"id": "complaint", "hw": "complaint", "ipa": "kəmˈpleɪnt", "stress": "com·**plaint**", "stars": 3, "false_friend": true, "gloss": "소장", "diff": "일상어로는 '불평'입니다. 형사에서 complaint는 범죄를 고발하는 서면(→ 6장)이라 문맥으로 구별합니다.", "examples": {"easy": {"en": "They filed a complaint yesterday.", "ko": "그들은 어제 소장을 냈다."}, "practice": {"en": "The complaint alleges that the defendant breached the contract.", "ko": "소장은 피고가 계약을 위반했다고 주장한다."}, "source": {"en": "A civil action is commenced by filing a complaint with the court.", "ko": "민사소송은 법원에 소장을 제출함으로써 개시된다.", "cite": "Fed. R. Civ. P. 3", "url": "https://www.law.cornell.edu/rules/frcp/rule_3", "glossary": {"commence": "개시하다(begin의 격식체)"}}}, "grammar": {"axis": "G1", "title": "처음은 a, 다시 말할 때는 the", "wrong": "They filed the complaint. A complaint is 30 pages long.", "right": "They filed a complaint. The complaint is 30 pages long.", "note": "처음 등장하는 것은 a, 이미 말한 '그 소장'은 the. 관사의 가장 기본 원리입니다."}, "collocations": ["file a complaint", "amend the complaint (소장을 변경하다)", "the complaint alleges that ..."], "links": [{"label": "LII Wex — complaint", "url": "https://www.law.cornell.edu/wex/complaint"}]}, {"id": "prayer", "hw": "prayer for relief", "ipa": "prer fɔːr rɪˈliːf", "stress": "**prayer** for re·**lief**", "stars": 2, "false_friend": true, "gloss": "청구취지", "pron_tip": "여기서 prayer는 한 음절 /prer/입니다. '기도하는 사람'이라는 뜻일 때만 두 음절 /ˈpreɪ.ɚ/로 읽습니다.", "diff": "소장 끝에서 '법원에 무엇을 구하는가'를 적는 부분입니다. 한국 소장의 청구취지와 위치·기능이 비슷하지만, 한국처럼 판결 주문 형태로 엄격하게 쓰지는 않습니다.", "examples": {"easy": {"en": "Read the prayer for relief first.", "ko": "청구취지부터 읽어 보세요."}, "practice": {"en": "The prayer for relief asks for $2 million in damages.", "ko": "청구취지는 200만 달러의 손해배상을 구한다."}, "source": {"en": "a demand for the relief sought, which may include relief in the alternative or different types of relief", "ko": "구하는 구제의 요구 — 예비적 구제나 여러 종류의 구제를 포함할 수 있다", "cite": "Fed. R. Civ. P. 8(a)(3)", "url": "https://www.law.cornell.edu/rules/frcp/rule_8", "glossary": {"relief": "구제(판결로 얻으려는 것)", "in the alternative": "예비적으로"}}}, "grammar": {"axis": "G3", "title": "relief는 셀 수 없는 명사", "wrong": "The plaintiff seeks a relief.", "right": "The plaintiff seeks relief.", "note": "relief는 a를 붙이지 않고 복수형도 만들지 않습니다. 종류를 말할 때는 types of relief."}, "collocations": ["seek relief", "grant relief", "injunctive relief (금지명령에 의한 구제)"], "links": [{"label": "LII Wex — prayer for relief", "url": "https://www.law.cornell.edu/wex/prayer_for_relief"}]}, {"id": "file", "hw": "file", "ipa": "faɪl", "stress": "**file**", "stars": 3, "gloss": "(서면을 법원에) 제출하다, (소를) 제기하다", "examples": {"easy": {"en": "I filed the papers today.", "ko": "오늘 서류를 제출했다."}, "practice": {"en": "The defendant filed an answer yesterday.", "ko": "피고는 어제 답변서를 제출했다."}, "source": {"en": "Any paper after the complaint that is required to be served—must be filed no later than a reasonable time after service.", "ko": "소장 이후의 서면으로서 송달해야 하는 것은 송달 후 상당한 기간 안에 법원에 제출해야 한다.", "cite": "Fed. R. Civ. P. 5(d)(1)(A)", "url": "https://www.law.cornell.edu/rules/frcp/rule_5", "glossary": {"paper": "(소송) 서면", "no later than": "늦어도 ~까지", "reasonable time": "상당한 기간"}}}, "grammar": {"axis": "G5", "title": "file suit against — 상대방은 against", "wrong": "They filed suit to the bank.", "right": "They filed suit against the bank. / They filed a lawsuit against the bank.", "note": "소송의 상대방은 against로 잇습니다. suit만 쓸 때는 관사 없이 file suit라고 하는 관용형이 흔하고, file a suit도 씁니다. lawsuit에는 a를 붙입니다. 파산은 file for bankruptcy(→ 13장)."}, "collocations": ["file suit against", "file a motion", "file with the court", "file for bankruptcy"]}, {"id": "summons", "hw": "summons", "ipa": "ˈsʌm.ənz", "stress": "**sum**·mons", "stars": 2, "gloss": "소환장(피고에게 소 제기 사실을 알리고 응소를 명하는 문서)", "pron_tip": "끝의 s까지 단어 본체입니다. 복수형은 summonses로, 끝에 음절 하나(/-ɪz/)가 더 붙습니다.", "examples": {"easy": {"en": "He received a summons.", "ko": "그는 소환장을 받았다."}, "practice": {"en": "The clerk issued two summonses, one for each defendant.", "ko": "사무관은 피고마다 하나씩 소환장 두 통을 발부했다."}, "source": {"en": "A summons must be served with a copy of the complaint.", "ko": "소환장은 소장 사본과 함께 송달되어야 한다.", "cite": "Fed. R. Civ. P. 4(c)(1)", "url": "https://www.law.cornell.edu/rules/frcp/rule_4"}}, "grammar": {"axis": "G2", "title": "summons는 단수다", "wrong": "a summon / two summons", "right": "a summons / two summonses", "note": "s로 끝나지만 단수명사입니다. news·series처럼 겉모양에 속기 쉬운 단어."}, "collocations": ["issue a summons", "serve a summons"], "links": [{"label": "LII Wex — summons", "url": "https://www.law.cornell.edu/wex/summons"}]}, {"id": "serve", "hw": "serve · service of process", "ipa": "sɝːv · ˈsɝː.vɪs əv ˈprɑː.ses", "stress": "**serve** · **ser**·vice of **pro**·cess", "stars": 3, "false_friend": true, "gloss": "송달하다 · 송달", "diff": "한국은 법원이 직권으로 송달하는 것이 원칙이지만, 미국 연방에서는 원고 측이 송달을 책임집니다(Rule 4(c)(1)). 그래서 '송달 대행업자(process server)'라는 직업이 있습니다.", "examples": {"easy": {"en": "We served the defendant.", "ko": "피고에게 송달했다."}, "practice": {"en": "The defendant was served with the summons and complaint on May 3.", "ko": "피고는 5월 3일 소환장과 소장을 송달받았다."}, "source": {"en": "within 21 days after being served with the summons and complaint", "ko": "소환장과 소장을 송달받은 날부터 21일 이내에", "cite": "Fed. R. Civ. P. 12(a)(1)(A)(i)", "url": "https://www.law.cornell.edu/rules/frcp/rule_12"}}, "grammar": {"axis": "G4", "title": "serve A with B / serve B on A", "wrong": "We served the complaint to the defendant.", "right": "We served the defendant with the complaint. / We served the complaint on the defendant.", "note": "사람이 목적어면 with, 서류가 목적어면 on. 수동태는 be served with."}, "collocations": ["process server (송달 대행인)", "proof of service (송달 증명)", "be served with"], "links": [{"label": "LII Wex — service of process", "url": "https://www.law.cornell.edu/wex/service_of_process"}]}, {"id": "answer", "hw": "answer", "ipa": "ˈæn.sɚ", "stress": "**an**·swer", "stars": 3, "gloss": "답변서", "pron_tip": "w는 소리 나지 않습니다.", "examples": {"easy": {"en": "The company filed its answer.", "ko": "회사는 답변서를 냈다."}, "practice": {"en": "In its answer, the defendant denied all the allegations.", "ko": "피고는 답변서에서 주장 사실을 모두 부인했다."}, "source": {"en": "Only these pleadings are allowed: (1) a complaint; (2) an answer to a complaint;", "ko": "허용되는 소송서면은 다음에 한한다. (1) 소장 (2) 소장에 대한 답변서 …", "cite": "Fed. R. Civ. P. 7(a)", "url": "https://www.law.cornell.edu/rules/frcp/rule_7"}}, "grammar": {"axis": "G1", "title": "회사는 it, 소유격은 its", "wrong": "The company filed their answer. / it's answer", "right": "The company filed its answer.", "note": "법인 당사자는 it으로 받는 것이 법률 문서의 기본입니다. it's는 it is의 줄임말이라 소유격이 아닙니다."}, "collocations": ["file an answer", "answer the complaint (동사)", "deny the allegations"], "links": [{"label": "LII Wex — answer", "url": "https://www.law.cornell.edu/wex/answer"}]}, {"id": "counterclaim", "hw": "counterclaim", "ipa": "ˈkaʊn.t̬ɚ.kleɪm", "stress": "**coun**·ter·claim", "stars": 2, "gloss": "반소", "examples": {"easy": {"en": "The defendant filed a counterclaim.", "ko": "피고가 반소를 제기했다."}, "practice": {"en": "The tenant asserted a counterclaim for the unreturned deposit.", "ko": "세입자는 돌려받지 못한 보증금을 이유로 반소를 제기했다."}, "source": {"en": "A pleading must state as a counterclaim any claim that—at the time of its service—the pleader has against an opposing party if the claim: (A) arises out of the transaction or occurrence that is the subject matter of the opposing party's claim; and (B) does not require adding another party over whom the court cannot acquire jurisdiction.", "ko": "소송서면에는, 그 송달 당시 작성자가 상대방에 대하여 가진 청구로서 (A) 상대방 청구의 대상인 거래나 사건에서 생겼고, (B) 법원이 관할권을 얻을 수 없는 다른 당사자를 추가할 필요가 없는 것을 반소로 적어야 한다.", "cite": "Fed. R. Civ. P. 13(a)(1)", "url": "https://www.law.cornell.edu/rules/frcp/rule_13", "glossary": {"compulsory counterclaim": "강제적 반소 — 같은 거래에서 생긴 청구는 원칙적으로 이번에 내지 않으면 나중에 못 낸다(같은 조 (a)(2)에 예외가 있다)", "transaction or occurrence": "거래나 사건"}}}, "box": "한국 반소는 피고의 선택입니다. 미국 연방에서는 같은 거래·사건에서 나온 청구라면 반소로 내야 하고, 내지 않으면 원칙적으로 나중에 별소로 낼 수 없습니다(compulsory counterclaim). 추가 요건과 예외(Rule 13(a)(1)(B), (a)(2))가 있습니다.", "grammar": {"axis": "G6", "title": "assert / bring a counterclaim", "wrong": "The defendant did a counterclaim.", "right": "The defendant asserted a counterclaim.", "note": "청구·항변에는 assert(주장하다)가 자주 짝을 이룹니다. assert a claim, assert a defense."}, "collocations": ["assert a counterclaim", "cross-claim (공동당사자 사이의 청구)"], "links": [{"label": "LII Wex — counterclaim", "url": "https://www.law.cornell.edu/wex/counterclaim"}]}, {"id": "motion", "hw": "motion · move", "ipa": "ˈmoʊ.ʃən · muːv", "stress": "**mo**·tion · **move**", "stars": 3, "false_friend": true, "gloss": "신청 · 신청하다", "diff": "'움직임'이 아니라 법원에 어떤 결정을 구하는 신청입니다. 동사는 move — 'move to dismiss'는 '각하를 신청하다'이지 '움직이다'가 아닙니다.", "examples": {"easy": {"en": "The judge denied the motion.", "ko": "판사는 신청을 기각했다."}, "practice": {"en": "Defense counsel moved for a continuance.", "ko": "피고 대리인은 기일 연기를 신청했다."}, "source": {"en": "A request for a court order must be made by motion.", "ko": "법원의 명령을 구하는 요청은 신청(motion)으로 해야 한다.", "cite": "Fed. R. Civ. P. 7(b)(1)", "url": "https://www.law.cornell.edu/rules/frcp/rule_7", "glossary": {"court order": "법원의 명령·결정", "by motion": "신청의 형식으로"}}}, "grammar": {"axis": "G7", "title": "결과는 수동태로 자주 말한다", "wrong": "The motion denied.", "right": "The motion was denied. / The court denied the motion.", "note": "신청은 스스로 기각하지 않으므로 was denied(수동). 능동으로 쓰려면 주어를 court로."}, "collocations": ["file a motion", "grant / deny a motion", "move to + 동사", "move for + 명사"], "links": [{"label": "LII Wex — motion", "url": "https://www.law.cornell.edu/wex/motion"}]}, {"id": "motion-to-dismiss", "hw": "motion to dismiss", "ipa": "ˈmoʊ.ʃən tə dɪˈsmɪs", "stress": "**mo**·tion to dis·**miss**", "stars": 3, "gloss": "소 각하·기각 신청", "diff": "미국에서는 관할 없음(각하 사유)과 '주장 자체로 청구가 성립하지 않음'(기각 사유)을 모두 motion to dismiss로 다툽니다. 한국의 각하·기각 구별과 1:1로 대응하지 않으므로, 번역할 때는 사유를 보고 고릅니다.", "examples": {"easy": {"en": "They filed a motion to dismiss.", "ko": "그들은 소 각하 신청을 했다."}, "practice": {"en": "The court granted the motion to dismiss for lack of jurisdiction.", "ko": "법원은 관할 없음을 이유로 각하 신청을 받아들였다."}, "source": {"en": "failure to state a claim upon which relief can be granted", "ko": "구제를 인정할 수 있는 청구를 주장하지 못함", "cite": "Fed. R. Civ. P. 12(b)(6)", "url": "https://www.law.cornell.edu/rules/frcp/rule_12", "glossary": {"state a claim": "(사실을 주장하여) 청구를 구성하다"}}}, "box": "변호사들은 조문 번호로 '12(b)(6) motion'이라고 부릅니다. 소장에 적힌 사실을 모두 참으로 보더라도 청구가 성립하지 않는다는 주장이며, 이 장의 「명판결 명문장」(Twombly)이 그 기준을 정했습니다.", "grammar": {"axis": "G5", "title": "throw out — dismiss의 구어", "wrong": "The judge threw away the case.", "right": "The judge threw out the case.", "note": "뉴스에서는 dismiss 대신 throw out을 자주 씁니다. throw away는 '쓰레기로 버리다'라 법원 기사에는 쓰지 않습니다."}, "collocations": ["move to dismiss", "dismiss with / without prejudice (재소 불가 / 가능)", "throw out a case"], "links": [{"label": "LII Wex — motion to dismiss", "url": "https://www.law.cornell.edu/wex/motion_to_dismiss"}]}, {"id": "brief", "hw": "brief", "ipa": "briːf", "stress": "**brief**", "stars": 3, "false_friend": true, "gloss": "준비서면, (상소) 이유서", "examples": {"easy": {"en": "Our brief is due Friday.", "ko": "우리 준비서면은 금요일까지다."}, "practice": {"en": "Both sides filed briefs on the jurisdiction issue.", "ko": "양측은 관할 쟁점에 관해 준비서면을 냈다."}, "source": {"en": "The appellant's brief must contain, under appropriate headings and in the order indicated", "ko": "항소인의 이유서에는 적절한 제목 아래 다음 순서대로 다음 사항을 담아야 한다", "cite": "Fed. R. App. P. 28(a)", "url": "https://www.law.cornell.edu/rules/frap/rule_28", "glossary": {"appellant": "항소인(→ 4장)"}}}, "grammar": {"axis": "G2", "title": "셀 수 있다 — a brief, briefs", "wrong": "Both sides filed brief.", "right": "Both sides filed briefs.", "note": "서면 한 통 한 통을 세므로 복수형이 있습니다. 동사 brief는 '(요점을) 보고하다' — brief the judge."}, "collocations": ["file a brief", "amicus brief (→ 17장)", "opening / reply brief"], "links": [{"label": "LII Wex — brief", "url": "https://www.law.cornell.edu/wex/brief"}]}, {"id": "pleadings", "hw": "pleadings", "ipa": "ˈpliː.dɪŋz", "stress": "**plead**·ings", "stars": 2, "gloss": "소송서면(소장·답변서 등 주장 서면)", "diff": "미국 연방에서 pleadings는 소장·답변서 등 Rule 7(a)가 열거한 것만을 가리킵니다. 신청서(motion)나 준비서면(brief)은 pleadings가 아닙니다.", "examples": {"easy": {"en": "Read the pleadings carefully.", "ko": "소송서면을 꼼꼼히 읽으세요."}, "practice": {"en": "The pleadings include the complaint and the answer.", "ko": "소송서면에는 소장과 답변서가 들어간다."}}, "grammar": {"axis": "G2", "title": "보통 복수로 쓴다", "wrong": "The pleading are closed.", "right": "The pleadings are closed.", "note": "서면 묶음 전체를 말하므로 주로 복수. 동사도 복수(are)."}, "collocations": ["amend the pleadings", "judgment on the pleadings (서면에 의한 판결)"], "links": [{"label": "LII Wex — pleading", "url": "https://www.law.cornell.edu/wex/pleading"}]}, {"id": "discovery", "hw": "discovery", "ipa": "dɪˈskʌv.ɚ.i", "stress": "dis·**cov**·er·y", "stars": 3, "gloss": "증거개시", "diff": "재판 전에 당사자끼리 서로 증거를 요구하고 내보이는 절차입니다. 범위가 매우 넓어 소송비용의 큰 부분을 차지합니다. 현행 한국 민사소송에는 이 같은 포괄적 제도가 없고, 문서제출명령 같은 개별 제도로 대응합니다(→ 「한국이라면?」).", "examples": {"easy": {"en": "Discovery takes a long time.", "ko": "증거개시는 오래 걸린다."}, "practice": {"en": "During discovery, the plaintiff requested ten years of e-mails.", "ko": "증거개시 중에 원고는 10년 치 이메일을 요구했다."}, "source": {"en": "Parties may obtain discovery regarding any nonprivileged matter that is relevant to any party's claim or defense and proportional to the needs of the case", "ko": "당사자는 어느 당사자의 청구나 방어와 관련이 있고 사건의 필요에 비례하는, 특권 대상이 아닌 모든 사항에 관하여 증거개시를 받을 수 있다", "cite": "Fed. R. Civ. P. 26(b)(1)", "url": "https://www.law.cornell.edu/rules/frcp/rule_26", "glossary": {"nonprivileged": "특권(privilege)으로 공개가 보호되지 않는 — 문서·통신에도 적용되며, 증언거부특권은 그 한 예(→ 5장)", "proportional": "비례하는"}}}, "grammar": {"axis": "G3", "title": "절차 이름에는 a를 붙이지 않는다", "wrong": "The parties had a discovery for six months. (절차를 말할 때)", "right": "After discovery, the case settled.", "note": "절차를 가리키는 discovery는 셀 수 없는 명사처럼 써서 a를 붙이지 않고, 일반적으로 말할 때는 관사 없이 씁니다. 특정 사건의 그 단계를 콕 집을 때는 the discovery도 씁니다. trial도 'go to trial', 'at trial'처럼 관사 없이 자주 씁니다."}, "collocations": ["take discovery", "discovery request", "e-discovery (전자 증거개시)"], "links": [{"label": "LII Wex — discovery", "url": "https://www.law.cornell.edu/wex/discovery"}]}, {"id": "deposition", "hw": "deposition · depose", "ipa": "ˌdep.əˈzɪʃ.ən · dɪˈpoʊz", "stress": "dep·o·**si**·tion · de·**pose**", "stars": 3, "gloss": "증언녹취(재판 전 선서 증언) · 증언을 녹취하다", "pron_tip": "명사와 동사의 강세 위치가 다릅니다. 명사는 셋째 음절 -si-, 동사는 둘째 음절 -pose.", "diff": "법정이 아니라 변호사 사무실 회의실에서, 판사 없이 속기사 앞에서 선서하고 답합니다. 기록은 재판에서 증거로 쓰일 수 있습니다.", "examples": {"easy": {"en": "They took his deposition.", "ko": "그들은 그의 증언을 녹취했다."}, "practice": {"en": "The CEO was deposed for seven hours.", "ko": "CEO는 7시간 동안 증언녹취를 받았다."}, "source": {"en": "A party may, by oral questions, depose any person, including a party, without leave of court except as provided in Rule 30(a)(2).", "ko": "당사자는 제30조(a)(2)에서 정한 경우를 제외하고는 법원의 허가 없이 구두 질문으로 당사자를 포함한 누구에게서나 증언을 녹취할 수 있다.", "cite": "Fed. R. Civ. P. 30(a)(1)", "url": "https://www.law.cornell.edu/rules/frcp/rule_30", "glossary": {"leave of court": "법원의 허가"}}}, "grammar": {"axis": "G6", "title": "deposition은 take와 짝", "wrong": "We did a deposition of the witness.", "right": "We took the witness's deposition. / We deposed the witness.", "note": "녹취하는 쪽은 take, 받는 쪽은 give (He gave a deposition)."}, "collocations": ["take a deposition", "give a deposition", "deposition transcript (녹취록)"], "links": [{"label": "LII Wex — deposition", "url": "https://www.law.cornell.edu/wex/deposition"}]}, {"id": "interrogatories", "hw": "interrogatories", "ipa": "ˌɪn.t̬əˈrɑː.ɡəˌtɔːr.iz", "stress": "in·ter·**rog**·a·to·ries", "stars": 2, "gloss": "(증거개시의) 서면 질문", "pron_tip": "6음절 긴 단어지만 주강세는 셋째 음절 -rog- 하나만 기억하면 됩니다. 발음 사전(Cambridge US) 미수록이라 Wiktionary의 미국 발음(단수 /ˌɪntəˈɹɑɡəˌtɔɹi/)과 대조해 적었습니다.", "examples": {"easy": {"en": "Please answer these interrogatories.", "ko": "이 서면 질문에 답해 주십시오."}, "practice": {"en": "The defendant served 25 interrogatories on the plaintiff.", "ko": "피고는 원고에게 서면 질문 25개를 송달했다."}, "source": {"en": "Unless otherwise stipulated or ordered by the court, a party may serve on any other party no more than 25 written interrogatories, including all discrete subparts.", "ko": "당사자 사이에 달리 합의하거나 법원이 달리 명하지 않는 한, 당사자는 다른 당사자에게 별개의 하위 질문을 포함하여 25개 이하의 서면 질문을 송달할 수 있다.", "cite": "Fed. R. Civ. P. 33(a)(1)", "url": "https://www.law.cornell.edu/rules/frcp/rule_33", "glossary": {"stipulate": "(당사자끼리) 합의하다", "discrete subparts": "독립된 하위 질문"}}}, "grammar": {"axis": "G8", "title": "no more than = 이하", "wrong": "no more than 25 = 25개 미만", "right": "no more than 25 = 25개까지(25 포함)", "note": "법조문의 수량 표현. no more than 25 / not more than 25는 '25 이하', fewer than 25는 '25 미만'."}, "collocations": ["serve interrogatories", "answer interrogatories under oath"], "links": [{"label": "LII Wex — interrogatories", "url": "https://www.law.cornell.edu/wex/interrogatories"}]}, {"id": "subpoena", "hw": "subpoena", "ipa": "səˈpiː.nə", "stress": "sub·**poe**·na", "stars": 2, "gloss": "(증인·문서) 소환장 · 소환하다", "pron_tip": "b는 소리 나지 않고, oe는 /iː/ 소리입니다. /səˈpiː.nə/ — 강세는 둘째 음절 poe.", "examples": {"easy": {"en": "She got a subpoena.", "ko": "그녀는 증인 소환장을 받았다."}, "practice": {"en": "The bank was subpoenaed to produce its loan records.", "ko": "은행은 대출 기록을 제출하라는 소환을 받았다."}, "source": {"en": "attend and testify", "ko": "출석하여 증언하라", "cite": "Fed. R. Civ. P. 45(a)(1)(A)(iii)", "url": "https://www.law.cornell.edu/rules/frcp/rule_45"}}, "box": "summons는 피고를 소송에 부르는 문서, subpoena는 증언이나 문서 제출을 명하는 문서입니다. subpoena는 주로 당사자가 아닌 증인이나 문서 소지자에게 쓰지만, 당사자의 증언녹취 출석을 강제할 때도 씁니다(Rule 30(a)(1)). 둘 다 '소환장'으로 옮겨서 헷갈리기 쉽습니다.", "grammar": {"axis": "G7", "title": "동사로도 쓰고, 수동태가 흔하다", "wrong": "The bank was subpoena.", "right": "The bank was subpoenaed.", "note": "동사의 과거분사는 subpoenaed(-aed)."}, "collocations": ["issue a subpoena", "comply with a subpoena", "be subpoenaed to testify"], "links": [{"label": "LII Wex — subpoena", "url": "https://www.law.cornell.edu/wex/subpoena"}]}, {"id": "summary-judgment", "hw": "summary judgment", "ipa": "ˈsʌm.ɚ.i ˈdʒʌdʒ.mənt", "stress": "**sum**·ma·ry **judg**·ment", "stars": 3, "false_friend": true, "gloss": "약식판결(정식 재판 없이 내리는 판결)", "diff": "한국 민사소송에는 딱 맞는 제도가 없습니다. '약식'이라는 번역 때문에 형사 약식명령을 떠올리기 쉽지만 전혀 다른 제도입니다. 증거개시 결과 다툴 사실이 없으면 trial 없이 법률문제만으로 판결합니다.", "examples": {"easy": {"en": "The judge granted summary judgment.", "ko": "판사가 약식판결 신청을 받아들였다."}, "practice": {"en": "We plan to move for summary judgment after discovery closes.", "ko": "증거개시가 끝나면 약식판결을 신청할 계획입니다."}, "source": {"en": "The court shall grant summary judgment if the movant shows that there is no genuine dispute as to any material fact and the movant is entitled to judgment as a matter of law.", "ko": "신청인이 중요한 사실에 관하여 진정한 다툼이 없고 법률문제로서 판결을 받을 자격이 있음을 보이면, 법원은 약식판결을 하여야 한다.", "cite": "Fed. R. Civ. P. 56(a)", "url": "https://www.law.cornell.edu/rules/frcp/rule_56", "glossary": {"movant": "신청인", "genuine dispute": "진정한(실질적인) 다툼", "material fact": "결론을 좌우하는 사실", "as a matter of law": "법률문제로서"}}}, "pitfalls": ["'요약 판결'로 옮기기 — 여기서 summary는 '간이한, 즉결의'", "형사 약식명령을 summary judgment로 옮기기"], "grammar": {"axis": "G1", "title": "grant summary judgment — 관사 없이", "wrong": "The court granted a summary judgment.", "right": "The court granted summary judgment.", "note": "판결 형식의 이름으로 쓸 때는 관사 없이 쓰는 것이 관용입니다. 신청은 move for summary judgment."}, "collocations": ["move for summary judgment", "motion for summary judgment (MSJ)", "grant / deny summary judgment"], "links": [{"label": "LII Wex — summary judgment", "url": "https://www.law.cornell.edu/wex/summary_judgment"}]}, {"id": "default-judgment", "hw": "default judgment", "ipa": "dɪˈfɑːlt ˈdʒʌdʒ.mənt", "stress": "de·**fault** **judg**·ment", "stars": 2, "gloss": "결석판결(피고가 응소하지 않을 때의 판결)", "diff": "한국의 변론 없이 하는 판결(민사소송법 제257조)과 기능이 가깝습니다. 미국은 먼저 사무관이 '결석(default)' 사실을 기록하고, 그다음에 판결(default judgment)로 가는 두 단계입니다.", "examples": {"easy": {"en": "The court entered a default judgment.", "ko": "법원은 결석판결을 했다."}, "practice": {"en": "The plaintiff obtained a default judgment of $50,000.", "ko": "원고는 5만 달러의 결석판결을 받았다."}, "source": {"en": "When a party against whom a judgment for affirmative relief is sought has failed to plead or otherwise defend, and that failure is shown by affidavit or otherwise, the clerk must enter the party's default.", "ko": "적극적 구제를 구하는 판결의 상대방 당사자가 답변하거나 달리 방어하지 않았고 그 사실이 선서진술서 등으로 드러나면, 사무관은 그 당사자의 결석을 기록하여야 한다.", "cite": "Fed. R. Civ. P. 55(a)", "url": "https://www.law.cornell.edu/rules/frcp/rule_55", "glossary": {"affidavit": "선서진술서(→ 17장)", "enter": "(기록에) 등재하다"}}}, "grammar": {"axis": "G5", "title": "show up for — '나타나다'의 기본 구동사", "wrong": "The defendant didn't show up the hearing.", "right": "The defendant didn't show up for the hearing. / The defendant failed to appear.", "note": "show up은 목적어를 바로 받지 않아 for·at으로 잇습니다. 일상에서는 show up, 법률 문장에서는 appear(출석하다)가 더 명확합니다. failure to appear는 불출석."}, "collocations": ["enter default", "obtain a default judgment", "set aside a default (결석을 취소하다)"], "links": [{"label": "LII Wex — default judgment", "url": "https://www.law.cornell.edu/wex/default_judgment"}]}, {"id": "settlement", "hw": "settlement · settle", "ipa": "ˈset̬.əl.mənt · ˈset̬.əl", "stress": "**set**·tle·ment · **set**·tle", "stars": 3, "gloss": "화해 · 화해하다", "examples": {"easy": {"en": "They settled.", "ko": "그들은 화해했다."}, "practice": {"en": "The parties reached a settlement two weeks before trial.", "ko": "당사자들은 재판 2주 전에 화해에 이르렀다."}, "source": {"en": "facilitating settlement", "ko": "화해 촉진", "cite": "Fed. R. Civ. P. 16(a)(5) — 변론준비기일(pretrial conference)의 목적 중 하나", "url": "https://www.law.cornell.edu/rules/frcp/rule_16"}}, "box": "미국 연방규칙은 변론준비기일의 목적으로 '화해 촉진'을 명시합니다. 판사가 화해를 권하는 것은 한국만의 풍경이 아닙니다.", "grammar": {"axis": "G5", "title": "settle out of court", "wrong": "They settled outside the court.", "right": "They settled out of court.", "note": "'재판 밖에서 화해하다'는 관용구 settle out of court. 명사는 out-of-court settlement."}, "collocations": ["reach a settlement", "settle out of court", "settlement conference", "settlement agreement"], "links": [{"label": "LII Wex — settlement", "url": "https://www.law.cornell.edu/wex/settlement"}]}, {"id": "class-action", "hw": "class action", "ipa": "ˌklæs ˈæk.ʃən", "stress": "class **ac**·tion", "stars": 2, "gloss": "집단소송", "diff": "한국에도 증권관련 집단소송법이 있지만 증권 분야에 한정됩니다. 미국 class action은 소비자·고용·독점금지 등 거의 모든 분야에서 쓰입니다.", "examples": {"easy": {"en": "Thousands joined the class action.", "ko": "수천 명이 집단소송에 참여했다."}, "practice": {"en": "She brought a class action on behalf of all the customers.", "ko": "그녀는 모든 고객을 대표해 집단소송을 제기했다."}, "source": {"en": "One or more members of a class may sue or be sued as representative parties on behalf of all members only if", "ko": "집단 구성원 1인 또는 수인은 다음 요건을 갖춘 때에만 전체 구성원을 대표하는 당사자로서 소송을 하거나 당할 수 있다", "cite": "Fed. R. Civ. P. 23(a)", "url": "https://www.law.cornell.edu/rules/frcp/rule_23", "glossary": {"representative parties": "대표 당사자"}}}, "grammar": {"axis": "G4", "title": "on behalf of — ~을 대표하여", "wrong": "on behalf of the all customers", "right": "on behalf of all the customers", "note": "all은 the 앞에 옵니다(all the customers). on behalf of는 법률 영어 최다 빈출 전치사구 중 하나."}, "collocations": ["bring a class action", "class certification (집단 인가)", "opt out (집단에서 빠지다)"], "links": [{"label": "LII Wex — class action", "url": "https://www.law.cornell.edu/wex/class_action"}]}, {"id": "statute-of-limitations", "hw": "statute of limitations", "ipa": "ˌstætʃ.uːt əv lɪm.əˈteɪ.ʃənz", "stress": "stat·ute of lim·i·**ta**·tions", "stars": 3, "gloss": "제소기간(소멸시효)", "pron_tip": "statute(법률) · statue(조각상) · stature(키, 위상)는 철자가 비슷해 자주 헷갈립니다. statute는 /ˈstætʃ.uːt/로 끝에 /t/가 한 번 더 들립니다.", "diff": "영미에서는 '권리가 소멸한다'기보다 '소를 제기할 수 있는 기간이 지났다'는 절차적 장벽으로 이해합니다. 한국의 소멸시효·제척기간과 성격이 꼭 같지는 않습니다.", "examples": {"easy": {"en": "The time limit has passed.", "ko": "기한이 지났다."}, "practice": {"en": "The claim is barred by the statute of limitations.", "ko": "그 청구는 제소기간 도과로 막혀 있다."}, "source": {"en": "may not be commenced later than 4 years after the cause of action accrues", "ko": "청구원인이 발생한 때부터 4년이 지난 뒤에는 제기할 수 없다", "cite": "28 U.S.C. § 1658(a) — 이 조항이 생긴 1990년 뒤에 제정된 연방법상 청구의 일반 기간", "url": "https://www.law.cornell.edu/uscode/text/28/1658", "glossary": {"accrue": "(권리가) 발생하다"}}}, "grammar": {"axis": "G2", "title": "limitations — 복수형 그대로", "wrong": "statute of limitation", "right": "statute of limitations", "note": "미국에서는 복수 limitations가 표준입니다(영국은 단수 limitation도 씀). 동사는 statute에 맞춰 단수: The statute of limitations has run."}, "collocations": ["the statute of limitations has run / expired", "time-barred (기간 도과로 막힌)", "toll the statute (기간 진행을 정지하다)"], "links": [{"label": "LII Wex — statute of limitations", "url": "https://www.law.cornell.edu/wex/statute_of_limitations"}]}], "corners": {"false_friend": {"title": "brief는 짧지 않다", "body": ["brief는 형용사로 '짧은'입니다. 그런데 법정에서 brief는 준비서면이고, 미국 연방항소법원 이유서는 수십 쪽에 이르기도 합니다. 이름과 달리 결코 짧지 않습니다.", "같은 장의 가짜 친구를 모아 보면 이렇습니다."], "table": [["action", "행동", "소송"], ["party", "파티", "당사자"], ["complaint", "불평", "소장"], ["prayer", "기도", "청구취지(prayer for relief)"], ["serve", "서빙하다", "송달하다"], ["motion", "움직임", "신청"], ["brief", "짧은", "준비서면"]], "tip": "외우는 요령: 문장에 court·file·judge가 함께 나오면 일상 뜻을 의심하세요."}, "drama": {"title": "A Civil Action (1998)", "facts": ["1998년 미국 영화. 감독·각본 스티븐 자일리언, 주연 존 트라볼타·로버트 듀발.", "조너선 하의 1995년 논픽션이 원작이고, 1980년대 매사추세츠주 워번(Woburn)의 지하수 오염 소송(Anne Anderson v. Cryovac)이 실화입니다.", "로버트 듀발은 이 영화로 아카데미 남우조연상 후보에 올랐습니다."], "watch": "제목이 곧 이 장의 표제어입니다. 원고 측 변호사가 거대 기업을 상대로 증거개시와 증언녹취에 돈과 시간을 쏟다가 무너져 가는 과정이 그대로 나옵니다. 화해 제안을 받아들일지 고민하는 장면에서 settlement의 무게가 실감 납니다.", "terms": ["civil action", "deposition", "discovery", "settle / settlement", "plaintiff"], "links": [{"label": "Wikipedia — A Civil Action (film)", "url": "https://en.wikipedia.org/wiki/A_Civil_Action_(film)"}, {"label": "YouTube — 공식 예고편 (Paramount Movies Digital)", "url": "https://www.youtube.com/watch?v=Y4WOo8IJzVg"}]}, "quote": {"text": "enough facts to state a claim to relief that is plausible on its face", "ko": "구제를 받을 청구로서 그 자체로 그럴듯한(plausible) 청구를 구성할 만큼의 사실", "case": "Bell Atlantic Corp. v. Twombly, 550 U.S. 544, 570 (2007)", "decided": "2007. 5. 21. 선고", "gloss": {"plausible": "그럴듯한, 개연성 있는", "on its face": "겉보기에, 그 자체로"}, "why": "이 판결은 Conley v. Gibson(1957)의 'no set of facts' 문구를 '은퇴'시키고, 소장 단계의 문턱을 높였습니다. 딱지와 결론(labels and conclusions)만으로는 부족하고, 원고는 청구를 '그럴듯하게' 만드는 사실을 소장에 적어야 합니다. 못 하면 12(b)(6)로 기각됩니다. 이후 미국 연방법원은 이 기준으로 소장을 심사합니다.", "links": [{"label": "LII — Twombly 판결 원문", "url": "https://www.law.cornell.edu/supct/html/05-1126.ZO.html"}, {"label": "Oyez — 구두변론 녹음", "url": "https://www.oyez.org/cases/2006/05-1126"}]}, "korea": {"title": "discovery가 없다면?", "us": "미국에서는 상대방에게 관련 자료를 넓게 요구할 수 있고(Rule 26(b)(1)), 상대방은 원칙적으로 내놓아야 합니다.", "kr": "현행 한국 민사소송에는 이런 포괄적 제도가 없습니다. 대표적 수단은 문서제출명령입니다. 민사소송법 제344조는 '당사자가 소송에서 인용한 문서' 등 일정한 경우 문서를 가진 사람이 제출을 거부하지 못한다고 정합니다. 신청하는 쪽이 원칙적으로 문서를 특정해야 한다는 점이 discovery와 가장 다릅니다(제345조). 다만 신청에 필요하면 법원이 상대방에게 관련 문서의 표시와 취지를 적어 내도록 명할 수 있습니다(제346조 문서목록 제출).", "say": "Korea does not have American-style discovery. Instead, a party can ask the court to order the other side to produce specific documents.", "say_ko": "한국에는 미국식 증거개시가 없습니다. 대신 당사자는 상대방에게 특정 문서를 제출하라고 명해 달라고 법원에 신청할 수 있습니다."}}, "quiz": [{"q": "원고가 소송을 시작하며 내는 서면은?", "options": ["answer", "complaint", "brief", "summons"], "answer": 1, "why": "answer는 피고의 답변서, brief는 준비서면, summons는 법원이 발부하는 소환장입니다."}, {"q": "'serve the defendant'의 뜻은?", "options": ["피고를 대접하다", "피고에게 송달하다", "피고를 변호하다"], "answer": 1, "why": "serve는 법정에서 '송달하다'. 사람이 목적어면 serve A with B."}, {"q": "다음 중 정식 재판(trial) 없이 끝나는 판결은?", "options": ["verdict", "summary judgment", "acquittal"], "answer": 1, "why": "verdict는 배심 평결, acquittal은 형사 무죄 판결입니다(→ 4장·7장)."}, {"q": "문법: 빈칸에 맞는 것은? — One of the ____ asked for more time.", "options": ["party", "parties", "partys"], "answer": 1, "why": "one of 뒤에는 복수명사. party의 복수는 y를 i로 바꿔 parties.", "grammar": "G2"}, {"q": "번역해 보세요: The motion to dismiss was denied.", "options": ["각하 신청이 받아들여졌다.", "각하 신청이 기각되었다.", "각하 신청을 취하했다."], "answer": 1, "why": "deny = 기각하다(받아들이지 않다), grant = 인용하다. was denied는 수동태."}]}, {"chapter": {"num": 4, "title": "민사소송 ②", "subtitle": "재판·판결·상소", "title_en": "Civil Procedure II — Trial, Judgment, and Appeal", "lead": "증거개시라는 터널을 빠져나와도 화해하지 못한 사건은 정식 재판(trial)으로 갑니다. 배심이 평결을 내리고, 판사가 판결을 등록하고, 진 쪽은 항소합니다. 항소법원은 사실을 다시 심리하지 않고 원심에 잘못이 있는지만 봅니다. 이 장은 법정 안의 말과 항소법원의 말을 다룹니다.", "can_say": [{"en": "The jury returned a verdict for the plaintiff.", "ko": "배심은 원고 승소 평결을 내렸습니다."}, {"en": "The defendant was found liable and ordered to pay damages.", "ko": "피고는 책임이 인정되어 손해배상금 지급을 명령받았습니다."}, {"en": "On appeal, the judgment was affirmed.", "ko": "항소심에서 원심 판결이 유지되었습니다."}]}, "entries": [{"id": "trial", "hw": "trial", "ipa": "ˈtraɪ.əl", "stress": "**tri**·al", "stars": 3, "gloss": "정식 재판(사실심리), 공판", "diff": "미국 민사에서 trial은 증거를 법정에 내놓고 사실을 가리는 단 한 번의 집중 심리입니다. 한국처럼 변론기일을 여러 번 여는 구조가 아니라, 며칠에서 몇 주 동안 이어서 엽니다. '재판'으로 옮기면 소송 전체로 읽히기 쉬우니 문맥에 따라 '정식 재판'이나 '공판'을 고릅니다.", "examples": {"easy": {"en": "The case went to trial.", "ko": "그 사건은 정식 재판으로 갔다."}, "practice": {"en": "Trial is set for March 3, and it should last about a week.", "ko": "공판은 3월 3일로 잡혔고 일주일쯤 걸릴 것이다."}, "source": {"en": "The court may, on motion, grant a new trial on all or some of the issues—and to any party", "ko": "법원은 신청에 따라 쟁점의 전부 또는 일부에 관하여, 어느 당사자에게든 새로운 재판(재심리)을 허가할 수 있다", "cite": "Fed. R. Civ. P. 59(a)(1)", "url": "https://www.law.cornell.edu/rules/frcp/rule_59", "glossary": {"new trial": "재심리 — 같은 법원이 사실심리를 처음부터 다시 하는 것. 한국의 재심과 다르다", "on motion": "신청에 따라"}}}, "box": "판결 뒤 28일 안에 진 쪽은 new trial을 신청할 수 있습니다(Rule 59(b)). 평결이 증거에 비추어 크게 어긋나거나 절차에 중대한 잘못이 있을 때 같은 법원이 사실심리를 다시 엽니다. 확정판결을 뒤집는 한국의 재심과는 다른 제도입니다.", "pitfalls": ["new trial을 '재심'으로 옮기기 — 확정 전 같은 심급의 재심리다"], "grammar": {"axis": "G1", "title": "go to trial · at trial — 관사 없이", "wrong": "The case went to the trial.", "right": "The case went to trial. / The witness testified at trial.", "note": "절차 단계로서의 trial은 관사 없이 씁니다(3장 discovery와 같은 원리). 특정 재판을 가리킬 때는 the trial, 한 건을 셀 때는 a trial."}, "collocations": ["go to trial", "at trial", "stand trial (형사, 재판을 받다)", "new trial (재심리)", "pretrial (재판 전의)"], "links": [{"label": "LII Wex — trial", "url": "https://www.law.cornell.edu/wex/trial"}]}, {"id": "bench-jury-trial", "hw": "bench trial · jury trial", "ipa": "bentʃ ˈtraɪ.əl · ˈdʒʊr.i ˈtraɪ.əl", "stress": "**bench** **tri**·al · **ju**·ry **tri**·al", "stars": 2, "gloss": "판사 재판(배심 없는 재판) · 배심 재판", "diff": "bench는 판사석입니다. 배심 없이 판사가 사실까지 판단하면 bench trial이고, 이때 판사는 사실인정과 법률판단을 나누어 적어야 합니다(Rule 52(a)(1)). 한국 민사에는 배심 재판이 없고, 국민참여재판은 형사 사건에만 있습니다.", "examples": {"easy": {"en": "Both sides waived a jury.", "ko": "양측 모두 배심 재판을 포기했다."}, "practice": {"en": "The plaintiff demanded a jury trial, but the defendant preferred a bench trial.", "ko": "원고는 배심 재판을 청구했지만 피고는 판사 재판을 원했다."}, "source": {"en": "The right of trial by jury as declared by the Seventh Amendment to the Constitution—or as provided by a federal statute—is preserved to the parties inviolate.", "ko": "연방헌법 수정 제7조가 선언한, 또는 연방 법률이 정한 배심 재판을 받을 권리는 당사자에게 침해되지 않은 채 보장된다.", "cite": "Fed. R. Civ. P. 38(a)", "url": "https://www.law.cornell.edu/rules/frcp/rule_38", "glossary": {"Seventh Amendment": "수정 제7조 — 연방 민사 배심권 조항", "inviolate": "침해되지 않은, 온전한"}}}, "box": "연방 민사에서 배심권은 자동으로 주어지지 않습니다. 당사자가 마지막 소송서면 뒤 14일 안에 서면으로 청구(demand)해야 하고, 하지 않으면 포기한 것으로 봅니다(Rule 38(b)·(d)).", "grammar": {"axis": "G2", "title": "jury는 한 덩어리 — 단수 취급", "wrong": "The jury are deliberating. (미국식으로는 어색)", "right": "The jury is deliberating. / The jurors are deliberating.", "note": "미국 영어에서 jury는 집합명사로 단수 동사를 받습니다. 배심원 한 사람 한 사람은 juror(복수 jurors). 영국 영어는 복수 동사도 씁니다."}, "collocations": ["demand a jury trial", "waive a jury", "juror (배심원)", "advisory jury (권고적 배심)"], "links": [{"label": "LII Wex — bench trial", "url": "https://www.law.cornell.edu/wex/bench_trial"}, {"label": "LII Wex — jury trial", "url": "https://www.law.cornell.edu/wex/jury_trial"}]}, {"id": "opening-closing", "hw": "opening statement · closing argument", "ipa": "ˈoʊp.nɪŋ ˈsteɪt.mənt · ˈkloʊ.zɪŋ ˈɑːrɡ.jə.mənt", "stress": "**o**·pen·ing **state**·ment · **clos**·ing **ar**·gu·ment", "stars": 2, "uk": "closing speech (잉글랜드에서 함께 쓰임)", "gloss": "모두진술 · 최종변론", "diff": "opening statement는 증거조사 전에 '앞으로 무엇을 증명하겠다'고 배심에게 미리 보여 주는 말입니다. 그래서 argument(논증)가 아니라 statement라고 부르고, 이 단계에서 논쟁하면 상대방이 이의를 제기합니다. 논증은 증거조사가 끝난 뒤 closing argument에서 합니다.", "examples": {"easy": {"en": "The lawyers gave their opening statements.", "ko": "변호사들이 모두진술을 했다."}, "practice": {"en": "In her closing argument, the prosecutor walked the jury through each exhibit.", "ko": "검사는 최종변론에서 배심에게 증거물을 하나하나 짚어 주었다."}}, "box": "법정 드라마의 하이라이트는 대개 closing argument입니다. 미국 연방 민사에서는 보통 입증책임을 지는 원고가 먼저 말하고 마지막 반박도 원고가 합니다. 다만 순서는 법원과 판사에 따라 다릅니다.", "grammar": {"axis": "G6", "title": "statement는 make, argument는 give·deliver", "wrong": "She did her opening statement.", "right": "She made (gave) her opening statement. / He delivered his closing argument.", "note": "'진술을 하다'를 do로 옮기지 않습니다. statement에는 make·give, argument에는 give·deliver·present가 짝입니다."}, "collocations": ["make an opening statement", "deliver a closing argument", "closing (구어, = closing argument)", "summation (최종변론의 다른 이름)"], "links": [{"label": "LII Wex — opening statement", "url": "https://www.law.cornell.edu/wex/opening_statement"}, {"label": "LII Wex — closing argument", "url": "https://www.law.cornell.edu/wex/closing_argument"}]}, {"id": "verdict", "hw": "verdict", "ipa": "ˈvɝː.dɪkt", "stress": "**ver**·dict", "stars": 3, "gloss": "(배심의) 평결", "diff": "평결은 배심이 내리는 사실판단이고, 판결(judgment)은 그 평결을 토대로 법원이 하는 재판입니다. 둘은 다른 단계입니다. 판사 재판(bench trial)에는 평결이 없고 판사의 사실인정(findings of fact)이 그 자리를 채웁니다.", "examples": {"easy": {"en": "The jury reached a verdict.", "ko": "배심이 평결에 이르렀다."}, "practice": {"en": "After two days of deliberation, the jury returned a verdict for the defendant.", "ko": "이틀간 평의한 끝에 배심은 피고 승소 평결을 내렸다."}, "source": {"en": "Unless the parties stipulate otherwise, the verdict must be unanimous and must be returned by a jury of at least 6 members.", "ko": "당사자가 달리 합의하지 않는 한, 평결은 만장일치여야 하고 6명 이상으로 이루어진 배심이 내려야 한다.", "cite": "Fed. R. Civ. P. 48(b)", "url": "https://www.law.cornell.edu/rules/frcp/rule_48", "glossary": {"stipulate": "(당사자끼리) 합의하다", "unanimous": "만장일치의", "return a verdict": "평결을 내리다(법정에 돌려준다는 뜻에서)"}}}, "box": "평결이 나와도 진 쪽에는 기회가 남습니다. 합리적인 배심이라면 그런 평결을 할 수 없다는 이유로 법률문제로서의 판결(judgment as a matter of law)을 신청할 수 있습니다(Rule 50). 예전 이름은 JNOV(평결과 다른 판결)입니다.", "pitfalls": ["verdict를 '판결'로 옮기기 — 판결은 judgment", "형사 무죄 평결은 a verdict of not guilty (→ 7장)"], "grammar": {"axis": "G6", "title": "verdict는 return · reach와 짝", "wrong": "The jury reached to a verdict.", "right": "The jury returned (reached) a verdict.", "note": "reach는 타동사라 to 없이 a verdict를 바로 받습니다. 배심이 평결에 '이르는' 것은 reach, 법정에서 '내놓는' 것은 return이 표준 짝이고, give a verdict는 법률 문장에서 덜 관용적입니다. 판사는 평결을 하지 않고 enter judgment on the verdict(평결에 따라 판결을 등록)합니다."}, "collocations": ["return a verdict", "reach a verdict", "verdict for the plaintiff", "general / special verdict (일반 / 특별 평결)"], "links": [{"label": "LII Wex — verdict", "url": "https://www.law.cornell.edu/wex/verdict"}, {"label": "LII Wex — judgment as a matter of law", "url": "https://www.law.cornell.edu/wex/judgment_as_a_matter_of_law"}]}, {"id": "judgment", "hw": "judgment", "ipa": "ˈdʒʌdʒ.mənt", "stress": "**judg**·ment", "stars": 3, "uk": "judgement (일반 영국 철자. 다만 영국 법원 판결도 judgment로 쓴다)", "gloss": "판결", "pron_tip": "미국 철자는 e 없이 judgment. 발음은 같습니다.", "diff": "미국 연방에서 판결은 원칙적으로 별도 문서(separate document)로 작성하고 사무관이 민사사건부에 등록(entry)합니다. 항소기간 같은 절차상 기간은 등록 시점부터 셉니다. 별도 문서가 필요 없는 재판은 사건부에 기재한 때, 별도 문서가 필요한데 작성하지 않으면 사건부 기재 후 150일이 지난 때 등록된 것으로 봅니다(Rule 58(c)). 판결 '이유'는 보통 opinion이라는 별개 문서에 담깁니다(→ 16장).", "examples": {"easy": {"en": "The court entered judgment yesterday.", "ko": "법원은 어제 판결을 등록했다."}, "practice": {"en": "Judgment was entered for the plaintiff in the amount of $120,000.", "ko": "원고에게 12만 달러를 지급하라는 판결이 등록되었다."}, "source": {"en": "Every judgment and amended judgment must be set out in a separate document, but a separate document is not required for an order disposing of a motion: (1) for judgment under Rule 50(b); … or (5) for relief under Rule 60.", "ko": "모든 판결과 변경된 판결은 별도의 문서로 작성하여야 한다. 다만 (1) 제50조(b)에 따른 판결 신청 … (5) 제60조에 따른 구제 신청을 처리하는 명령에는 별도의 문서가 필요하지 않다.", "cite": "Fed. R. Civ. P. 58(a)", "url": "https://www.law.cornell.edu/rules/frcp/rule_58", "glossary": {"set out": "(문서에) 적어 두다", "amended judgment": "변경된 판결", "dispose of a motion": "신청을 처리하다", "생략 부분": "(2) 사실인정 보충(Rule 52(b)), (3) 변호사 보수(Rule 54), (4) 새 재판·판결 변경(Rule 59) 신청"}}}, "grammar": {"axis": "G7", "title": "판결은 '등록된다' — was entered", "wrong": "Judgment entered for the plaintiff.", "right": "Judgment was entered for the plaintiff.", "note": "판결이 스스로 등록하지 않으므로 수동태(was entered). 판결문에서는 주어를 생략한 'Judgment for plaintiff' 같은 표제식 문구도 보입니다."}, "collocations": ["enter judgment", "judgment for / against", "final judgment (종국판결)", "judgment as a matter of law"], "links": [{"label": "LII Wex — judgment", "url": "https://www.law.cornell.edu/wex/judgment"}, {"label": "LII Wex — final judgment", "url": "https://www.law.cornell.edu/wex/final_judgment"}]}, {"id": "liable", "hw": "liable · liability", "ipa": "ˈlaɪ.ə.bəl · ˌlaɪ.əˈbɪl.ə.t̬i", "stress": "**li**·a·ble · li·a·**bil**·i·ty", "stars": 3, "gloss": "(법적) 책임 있는 · 책임", "pron_tip": "liable은 세 음절(li-a-ble)입니다. 두 음절로 줄이면 libel(명예훼손)과 비슷하게 들립니다.", "diff": "민사에서 '유죄'라는 말은 쓰지 않습니다. 형사는 guilty, 민사는 liable입니다. 뉴스의 'found liable'은 '배상 책임이 인정되었다'로 옮깁니다.", "examples": {"easy": {"en": "The company was found liable.", "ko": "회사의 책임이 인정되었다."}, "practice": {"en": "The jury found the driver liable for the accident but awarded only $5,000.", "ko": "배심은 사고에 대한 운전자의 책임을 인정했지만 5천 달러만 인정했다."}, "source": {"en": "shall be liable to the party injured in an action at law, suit in equity, or other proper proceeding for redress", "ko": "보통법상 소송, 형평법상 소송 그 밖의 적절한 구제 절차에서 피해 당사자에게 책임을 진다", "cite": "42 U.S.C. § 1983", "url": "https://www.law.cornell.edu/uscode/text/42/1983", "glossary": {"action at law / suit in equity": "보통법상 소송 / 형평법상 소송(→ 1장)", "redress": "구제, 시정"}}}, "box": "42 U.S.C. § 1983은 주 공무원이 헌법상 권리를 침해했을 때 개인이 직접 손해배상을 청구할 수 있게 한 조문입니다. 한국 국가배상법과 기능이 겹치지만, 공무원 개인을 피고로 삼는다는 점이 다릅니다.", "pitfalls": ["'He was found guilty' — 민사 판결 기사에 guilty를 쓰지 않는다", "liable to + 동사원형은 '~하기 쉽다'는 일상 용법(liable to break)"], "grammar": {"axis": "G4", "title": "liable for 일, liable to 사람", "wrong": "The company is liable of the damage.", "right": "The company is liable for the damage. / liable to the injured party", "note": "책임의 대상(무엇에 대해)은 for, 책임을 지는 상대(누구에게)는 to. 명사도 같아서 liability for damages."}, "collocations": ["be found liable", "liable for damages", "limited liability (유한책임)", "strict liability (엄격책임, → 9장)", "joint and several liability (연대책임)"], "links": [{"label": "LII Wex — liable", "url": "https://www.law.cornell.edu/wex/liable"}, {"label": "LII Wex — liability", "url": "https://www.law.cornell.edu/wex/liability"}]}, {"id": "damages", "hw": "damages", "ipa": "ˈdæm.ɪ.dʒɪz", "stress": "**dam**·ag·es", "stars": 3, "false_friend": true, "gloss": "손해배상금", "diff": "단수 damage는 '손해·피해' 그 자체이고, 복수 damages는 그 손해를 메우라고 법원이 명하는 '돈'입니다. 한 글자 차이로 뜻이 갈립니다.", "examples": {"easy": {"en": "She won $10,000 in damages.", "ko": "그녀는 1만 달러의 손해배상금을 받아 냈다."}, "practice": {"en": "The fire caused serious damage, and the owner sued for damages.", "ko": "화재로 큰 피해가 났고, 소유자는 손해배상을 청구했다."}, "source": {"en": "Upon finding for the claimant the court shall award the claimant damages adequate to compensate for the infringement", "ko": "청구인 승소로 판단하면 법원은 침해를 전보하기에 충분한 손해배상을 청구인에게 인정하여야 한다", "cite": "35 U.S.C. § 284 (특허침해 손해배상)", "url": "https://www.law.cornell.edu/uscode/text/35/284", "glossary": {"award": "(법원이 배상금을) 인정하다, 지급을 명하다", "compensate": "전보하다, 보상하다"}}}, "box": "같은 조문은 법원이 배상액을 '세 배까지' 늘릴 수 있다고 정합니다(enhanced damages). 손해를 메우는 compensatory damages와 달리, 제재 목적의 punitive damages(징벌적 손해배상)는 주로 주(州) 불법행위법에서 다룹니다(→ 9장).", "pitfalls": ["damages를 '손해들'로 옮기기", "'The damages to the car' — 차량 피해는 damage (to the car)"], "grammar": {"axis": "G3", "title": "damage(손해, 불가산) vs damages(배상금)", "wrong": "The storm caused many damages.", "right": "The storm caused a lot of damage. / The court awarded damages.", "note": "피해를 뜻하는 damage는 셀 수 없는 명사라 many·복수형을 쓰지 않습니다. 배상금 damages는 늘 복수형으로 씁니다."}, "collocations": ["award damages", "sue for damages", "compensatory damages (전보배상)", "punitive damages (징벌적 손해배상)", "treble damages (3배 배상)"], "links": [{"label": "LII Wex — damages", "url": "https://www.law.cornell.edu/wex/damages"}, {"label": "LII Wex — punitive damages", "url": "https://www.law.cornell.edu/wex/punitive_damages"}]}, {"id": "injunction", "hw": "injunction · enjoin", "ipa": "ɪnˈdʒʌŋk.ʃən · ɪnˈdʒɔɪn", "stress": "in·**junc**·tion · en·**join**", "stars": 3, "gloss": "금지명령(작위·부작위 명령) · 금지명령을 내리다", "diff": "돈이 아니라 '하라·하지 말라'를 명하는 구제입니다. 본안 판결로 내리는 permanent injunction과 소송 중 임시로 내리는 preliminary injunction이 있고, 후자는 한국의 가처분과 기능이 비슷합니다. 다만 요건과 절차는 1:1로 대응하지 않습니다.", "examples": {"easy": {"en": "The court issued an injunction.", "ko": "법원은 금지명령을 내렸다."}, "practice": {"en": "The judge enjoined the company from selling the product until trial.", "ko": "판사는 재판 때까지 회사가 그 제품을 팔지 못하도록 금지명령을 내렸다."}, "source": {"en": "Every order granting an injunction and every restraining order must: (A) state the reasons why it issued;", "ko": "금지명령을 내리는 모든 명령과 모든 임시제지명령에는 (A) 그 명령을 발한 이유를 적어야 한다 …", "cite": "Fed. R. Civ. P. 65(d)(1)", "url": "https://www.law.cornell.edu/rules/frcp/rule_65", "glossary": {"restraining order": "임시제지명령(TRO) — 심문 전에 급히 내리는 단기 명령", "issue": "(명령이) 발해지다"}}}, "box": "특허 사건에서 법원이 침해를 인정하고도 금지명령은 거부하는 일이 있습니다. 연방대법원은 eBay v. MercExchange(2006)에서 금지명령을 자동으로 내리지 말고 4요소(회복할 수 없는 손해 등)를 따지라고 했습니다.", "grammar": {"axis": "G4", "title": "enjoin A from -ing · injunction against A", "wrong": "The court enjoined the company to sell the product.", "right": "The court enjoined the company from selling the product.", "note": "'못 하게 하다'이므로 from + 동명사(prevent A from -ing와 같은 틀). 명사로는 an injunction against the company."}, "collocations": ["grant / deny an injunction", "preliminary injunction (예비적 금지명령)", "permanent injunction (영구적 금지명령)", "TRO (temporary restraining order)", "injunctive relief"], "links": [{"label": "LII Wex — injunction", "url": "https://www.law.cornell.edu/wex/injunction"}, {"label": "LII Wex — preliminary injunction", "url": "https://www.law.cornell.edu/wex/preliminary_injunction"}]}, {"id": "relief-remedy", "hw": "relief · remedy", "ipa": "rɪˈliːf · ˈrem.ə.di", "stress": "re·**lief** · **rem**·e·dy", "stars": 2, "gloss": "구제(판결로 얻는 것) · 구제 수단", "diff": "두 단어는 자주 섞어 쓰지만 결이 다릅니다. relief는 당사자가 법원에 '구하는 것'(3장 prayer for relief), remedy는 법이 마련해 둔 '구제 수단의 종류'(손해배상·금지명령·원상회복 등)입니다.", "examples": {"easy": {"en": "Money is not the only remedy.", "ko": "돈만이 구제 수단은 아니다."}, "practice": {"en": "The plaintiff seeks two remedies: damages and an injunction.", "ko": "원고는 손해배상과 금지명령이라는 두 가지 구제를 구한다."}, "source": {"en": "Every other final judgment should grant the relief to which each party is entitled, even if the party has not demanded that relief in its pleadings.", "ko": "그 밖의 모든 종국판결은 당사자가 소송서면에서 구하지 않았더라도 각 당사자가 받을 자격이 있는 구제를 인정하여야 한다.", "cite": "Fed. R. Civ. P. 54(c)", "url": "https://www.law.cornell.edu/rules/frcp/rule_54", "glossary": {"be entitled to": "~을 받을 권리(자격)가 있다", "demand": "(서면에서) 구하다"}}}, "box": "Rule 54(c)는 당사자가 서면에서 구하지 않았더라도 받을 권리가 있는 구제는 인정하라고 정합니다(결석판결은 예외). 새로운 청구를 마음대로 인정한다는 뜻은 아니지만, 소송서면의 구제 요구 문구에 법원이 묶이는 정도가 한국 민사소송법 제203조의 처분권주의(신청하지 않은 사항은 판결하지 못한다)와 다릅니다.", "grammar": {"axis": "G3", "title": "relief는 셀 수 없고, remedy는 셀 수 있다", "wrong": "two reliefs / a relief", "right": "two remedies / two types of relief", "note": "뜻이 비슷해도 셀 수 있는지가 다릅니다. remedy는 a remedy, remedies. relief는 관사 없이 쓰고 종류는 types of relief."}, "collocations": ["seek relief", "grant relief", "legal / equitable remedy (보통법 / 형평법상 구제)", "exhaust remedies (구제 절차를 다 거치다)"], "links": [{"label": "LII Wex — remedy", "url": "https://www.law.cornell.edu/wex/remedy"}, {"label": "LII Wex — relief", "url": "https://www.law.cornell.edu/wex/relief"}]}, {"id": "costs-fees", "hw": "costs · attorney's fees", "ipa": "kɑːsts · əˈtɝː.niz fiːz", "stress": "**costs** · at·**tor**·ney's **fees**", "stars": 2, "gloss": "소송비용 · 변호사 보수", "diff": "미국은 각자 자기 변호사 보수를 부담하는 것이 원칙입니다(American rule). 이긴 쪽이 받는 costs는 인지대·송달료·녹취록 비용 같은 좁은 범위이고, 변호사 보수는 법률이나 계약에 근거가 있거나, 악의적 소송에 대한 법원의 제재(Chambers v. NASCO, 501 U.S. 32 (1991))처럼 특별한 근거가 있어야 받습니다. 패소자가 변호사보수 일부를 부담하는 한국(민사소송법 제109조)과 출발점이 다릅니다.", "examples": {"easy": {"en": "Each side pays its own lawyer.", "ko": "양측은 각자 자기 변호사 비용을 낸다."}, "practice": {"en": "The court awarded costs to the defendant but denied its request for attorney's fees.", "ko": "법원은 피고에게 소송비용은 인정했지만 변호사 보수 청구는 받아들이지 않았다."}, "source": {"en": "Unless a federal statute, these rules, or a court order provides otherwise, costs—other than attorney's fees—should be allowed to the prevailing party.", "ko": "연방 법률, 이 규칙 또는 법원 명령이 달리 정하지 않는 한, 변호사 보수를 제외한 소송비용은 승소 당사자에게 인정되어야 한다.", "cite": "Fed. R. Civ. P. 54(d)(1)", "url": "https://www.law.cornell.edu/rules/frcp/rule_54", "glossary": {"prevailing party": "승소 당사자", "other than": "~을 제외한"}}}, "box": "예외를 정한 법률이 적지 않습니다. 독점금지법(15 U.S.C. § 15)은 이긴 원고에게 3배 배상과 '합리적인 변호사 보수'를 함께 인정하고, 특허법(35 U.S.C. § 285)은 '예외적 사건'에서만 변호사 보수를 이긴 쪽에 넘깁니다.", "grammar": {"axis": "G2", "title": "costs·fees는 복수로 쓴다", "wrong": "The court awarded a costs.", "right": "The court awarded costs. / attorney's fees (attorney fees)", "note": "소송비용 전체를 뜻하는 costs는 복수형으로 굳은 말이라 a를 붙이지 않습니다. 통상 변호사 보수도 fees로 복수. 특정 비용 한 항목이나 한 건의 보수는 단수(a filing fee)도 씁니다. 소유격 attorney's fees와 명사 수식 attorney fees가 모두 쓰입니다."}, "collocations": ["award costs", "tax costs (비용을 확정하다)", "fee-shifting (보수 전가)", "the American rule", "each party bears its own costs"], "links": [{"label": "LII Wex — costs", "url": "https://www.law.cornell.edu/wex/costs"}, {"label": "LII Wex — attorney fees", "url": "https://www.law.cornell.edu/wex/attorney_fees"}]}, {"id": "appeal", "hw": "appeal · appellant · appellee", "ipa": "əˈpiːl · əˈpel.ənt · ˌæp.əˈliː", "stress": "ap·**peal** · ap·**pel**·lant · ap·pel·**lee**", "stars": 3, "gloss": "항소(상소) · 항소인 · 피항소인", "pron_tip": "appellee는 끝음절 -lee에 강세가 옵니다. employee·trainee처럼 -ee로 끝나는 '~받는 사람'은 대개 끝에 강세. appellee는 발음 사전(Cambridge US) 미수록이라 미국 법조 관행 발음으로 적었습니다.", "diff": "미국 연방은 지방법원 → 항소법원 → 연방대법원 구조이고, 항소법원의 관할은 원칙적으로 종국판결(final decision)에 대한 항소입니다(28 U.S.C. § 1291). 연방대법원은 사건을 골라 받는 certiorari로 심리합니다(→ 15장). 한국의 항소·상고처럼 두 번의 상소가 권리로 보장되는 구조가 아닙니다.", "examples": {"easy": {"en": "The defendant will appeal.", "ko": "피고는 항소할 것이다."}, "practice": {"en": "The appellant argues that the jury instructions were wrong.", "ko": "항소인은 배심 설시가 잘못되었다고 주장한다."}, "source": {"en": "In a civil case, except as provided in Rules 4(a)(1)(B), 4(a)(4), and 4(c), the notice of appeal required by Rule 3 must be filed with the district clerk within 30 days after entry of the judgment or order appealed from.", "ko": "민사사건에서는 제4조(a)(1)(B), (a)(4), (c)가 정하는 경우를 제외하고, 제3조가 요구하는 항소장은 항소 대상 판결이나 명령이 등록된 날부터 30일 이내에 지방법원 사무관에게 제출하여야 한다.", "cite": "Fed. R. App. P. 4(a)(1)(A)", "url": "https://www.law.cornell.edu/rules/frap/rule_4", "glossary": {"notice of appeal": "항소장(한두 쪽짜리 통지서. 이유는 나중에 brief로)", "district clerk": "지방법원 사무관"}}}, "box": "항소장은 원심인 지방법원에 냅니다(Rule 3(a)(1)). 한국도 항소장을 제1심 법원에 냅니다(민사소송법 제397조 제1항). 다만 일반적인 민사사건의 기간이 판결 등록 후 30일로, 판결서 송달 후 2주인 한국보다 깁니다. 미국 정부가 당사자인 사건은 60일(Rule 4(a)(1)(B))이고, 판결 뒤 일정한 신청이 있으면 기간이 달라지는(Rule 4(a)(4)) 등 예외가 있습니다.", "grammar": {"axis": "G4", "title": "appeal (from) a judgment · on appeal", "wrong": "The case is in appeal. / He appealed to the judgment.", "right": "The case is on appeal. / He appealed (from) the judgment to the Ninth Circuit.", "note": "'항소심 계속 중'은 on appeal. 미국 영어에서 appeal은 타동사로 판결을 바로 받거나 from을 쓰고, 상급법원은 to로 받습니다."}, "collocations": ["file a notice of appeal", "on appeal", "appeal from a judgment", "appeal as of right (권리로서의 항소)", "interlocutory appeal (중간 항소)"], "links": [{"label": "LII Wex — appeal", "url": "https://www.law.cornell.edu/wex/appeal"}, {"label": "LII Wex — appellant", "url": "https://www.law.cornell.edu/wex/appellant"}, {"label": "LII Wex — appellee", "url": "https://www.law.cornell.edu/wex/appellee"}]}, {"id": "affirm", "hw": "affirm", "ipa": "əˈfɝːm", "stress": "af·**firm**", "stars": 3, "gloss": "(상소심이 원심을) 유지하다 — 한국의 항소기각·상고기각에 해당", "diff": "한국은 '항소를 기각한다'로 상소를 주어로 말하고, 미국은 'affirm the judgment'로 원심 판결을 목적어로 말합니다. 결과는 같아도 문장 구조가 다르니, 번역할 때 '항소기각'과 'affirmed'를 서로 바꿔 끼웁니다.", "examples": {"easy": {"en": "The court of appeals affirmed.", "ko": "항소법원은 원심을 유지했다."}, "practice": {"en": "The Ninth Circuit affirmed the district court's judgment in all respects.", "ko": "제9연방항소법원은 지방법원 판결을 모든 점에서 유지했다."}, "source": {"en": "if a judgment is affirmed, costs are allocated against the appellant", "ko": "원심 판결이 유지되면 소송비용은 항소인이 부담한다", "cite": "Fed. R. App. P. 39(a)(2)", "url": "https://www.law.cornell.edu/rules/frap/rule_39", "glossary": {"allocate against": "(비용을) ~에게 부담시키다"}}}, "pitfalls": ["affirm을 '확인하다'로 옮기기 — 상소심 결론으로는 '원심 유지(항소기각)'", "affirm the appeal — 유지하는 것은 판결이지 항소가 아니다"], "grammar": {"axis": "G7", "title": "The judgment was affirmed.", "wrong": "The judgment affirmed on appeal.", "right": "The judgment was affirmed on appeal.", "note": "판결은 스스로 유지하지 않으므로 수동태. 판결문 결론 문구는 능동으로 We affirm.(→ 16장)"}, "collocations": ["affirm the judgment", "affirmed in part, reversed in part", "We affirm.", "summary affirmance (약식 유지)"], "links": [{"label": "LII Wex — affirm", "url": "https://www.law.cornell.edu/wex/affirm"}]}, {"id": "reverse", "hw": "reverse · reversal", "ipa": "rɪˈvɝːs · rɪˈvɝː.səl", "stress": "re·**verse** · re·**ver**·sal", "stars": 3, "gloss": "(원심을) 파기하다 · 파기", "diff": "원심 판결이 틀렸다고 보아 뒤집는 결론입니다. 미국 항소법원은 파기하면서 스스로 결론을 내리기도 하고, 사건을 원심으로 돌려보내기도 합니다(reverse and remand). 한국 대법원의 파기자판·파기환송과 짝을 지어 기억하면 편합니다.", "examples": {"easy": {"en": "The higher court reversed the decision.", "ko": "상급법원은 그 판단을 파기했다."}, "practice": {"en": "We reverse the judgment of the District Court and remand for a new trial.", "ko": "지방법원 판결을 파기하고 재심리를 위하여 사건을 환송한다."}, "source": {"en": "if a judgment is reversed, costs are allocated against the appellee", "ko": "원심 판결이 파기되면 소송비용은 피항소인이 부담한다", "cite": "Fed. R. App. P. 39(a)(3)", "url": "https://www.law.cornell.edu/rules/frap/rule_39"}}, "grammar": {"axis": "G1", "title": "the judgment of the District Court — of로 한정하면 the", "wrong": "We reverse judgment of District Court.", "right": "We reverse the judgment of the District Court.", "note": "of 이하로 '어느 판결'인지 특정되므로 the. 특정 법원 이름 앞에도 the를 붙입니다(the Ninth Circuit, the Supreme Court)."}, "collocations": ["reverse and remand", "reversed in part", "reversible error (파기 사유가 되는 잘못)", "harmless error (판결에 영향 없는 잘못)"], "links": [{"label": "LII Wex — reversal", "url": "https://www.law.cornell.edu/wex/reversal"}]}, {"id": "remand", "hw": "remand", "ipa": "rɪˈmænd", "stress": "re·**mand**", "stars": 3, "gloss": "(사건을 하급심으로) 환송하다 · 환송", "diff": "상급법원이 원심에 사건을 돌려보내며 추가 심리를 맡기는 것입니다. 형사에서 remand는 영국식으로 '(피고인을) 구금하여 재판에 회부하다'라는 뜻도 있어(remand in custody), 문맥을 봐야 합니다.", "examples": {"easy": {"en": "The case was remanded.", "ko": "사건은 환송되었다."}, "practice": {"en": "The court of appeals remanded the case to the district court for further proceedings.", "ko": "항소법원은 추가 심리를 위하여 사건을 지방법원에 환송했다."}, "source": {"en": "may remand the cause and direct the entry of such appropriate judgment, decree, or order, or require such further proceedings to be had as may be just under the circumstances.", "ko": "사건을 환송하면서 적절한 판결·결정·명령을 하도록 지시하거나, 사정에 비추어 정당한 추가 절차를 거치도록 요구할 수 있다.", "cite": "28 U.S.C. § 2106", "url": "https://www.law.cornell.edu/uscode/text/28/2106", "glossary": {"cause": "사건(case의 격식체)", "decree": "(형평법상) 판결·명령"}}}, "box": "미국에서는 연방법원이 주 법원에서 넘어온 사건을 주 법원으로 돌려보내는 것도 remand라고 합니다(28 U.S.C. § 1447). 상하 심급이 아니라 법원 체계 사이의 이송이라는 점이 다릅니다.", "grammar": {"axis": "G4", "title": "remand A to B for C", "wrong": "remanded the case at the district court", "right": "remanded the case to the district court for further proceedings", "note": "돌려보내는 곳은 to, 목적은 for. 판결문 결론은 짧게 'Reversed and remanded.'"}, "collocations": ["remand for further proceedings", "on remand (환송 후 심리에서)", "reverse and remand", "vacate and remand"], "links": [{"label": "LII Wex — remand", "url": "https://www.law.cornell.edu/wex/remand"}]}, {"id": "vacate", "hw": "vacate", "ipa": "vəˈkeɪt", "stress": "va·**cate**", "stars": 2, "pron_tip": "Cambridge 미국식은 둘째 음절 강세 /vəˈkeɪt/입니다. 미국 법정에서는 첫음절 강세 /ˈveɪ.keɪt/도 흔히 들립니다.", "gloss": "(판결·명령을) 취소하다, 효력을 없애다", "diff": "reverse는 '원심 결론이 틀렸다'는 판단이고, vacate는 원심 판결을 '없던 것으로 하는' 조치입니다. 원심 결론이 옳은지 판단하지 않고 절차상 잘못이나 새 판례를 이유로 다시 판단하라며 vacate and remand하는 일이 많습니다.", "examples": {"easy": {"en": "The order was vacated.", "ko": "그 명령은 취소되었다."}, "practice": {"en": "We vacate the judgment and remand in light of our recent decision.", "ko": "최근 우리 법원 판결에 비추어 원심 판결을 취소하고 사건을 환송한다."}, "source": {"en": "may affirm, modify, vacate, set aside or reverse any judgment, decree, or order of a court lawfully brought before it for review", "ko": "적법하게 심사를 위하여 회부된 법원의 판결·결정·명령을 유지·변경·취소·폐기 또는 파기할 수 있다", "cite": "28 U.S.C. § 2106", "url": "https://www.law.cornell.edu/uscode/text/28/2106", "glossary": {"modify": "변경하다", "set aside": "(판결을) 폐기하다"}}}, "pitfalls": ["일상어 vacate(집·자리를 비우다)로 읽기 — vacate the premises는 '건물을 비우다'"], "grammar": {"axis": "G7", "title": "판결은 vacated된다", "wrong": "The sentence vacated.", "right": "The sentence was vacated.", "note": "판결·명령이 주어이면 수동태. 집을 비우는 일상 뜻일 때는 능동(The tenant vacated the apartment)."}, "collocations": ["vacate and remand", "vacate a judgment", "motion to vacate"], "links": [{"label": "LII Wex — vacate", "url": "https://www.law.cornell.edu/wex/vacate"}]}, {"id": "standard-of-review", "hw": "standard of review", "ipa": "ˈstæn.dɚd əv rɪˈvjuː", "stress": "**stan**·dard of re·**view**", "stars": 2, "gloss": "(상소심의) 심사기준", "diff": "미국 항소법원은 쟁점마다 얼마나 깊이 들여다볼지를 먼저 정합니다. 법률문제는 de novo(새로), 판사의 사실인정은 clearly erroneous(명백한 잘못), 재량 판단은 abuse of discretion(재량 남용)이 대표적입니다. 항소심도 사실을 다시 심리하는 한국 민사 항소심과 가장 크게 다른 부분입니다.", "examples": {"easy": {"en": "What is the standard of review?", "ko": "심사기준이 무엇입니까?"}, "practice": {"en": "The standard of review often decides the appeal before the merits are even reached.", "ko": "본안에 들어가기도 전에 심사기준이 항소의 승패를 가르는 일이 많다."}, "source": {"en": "Findings of fact, whether based on oral or other evidence, must not be set aside unless clearly erroneous, and the reviewing court must give due regard to the trial court's opportunity to judge the witnesses' credibility.", "ko": "사실인정은 구두 증거에 근거한 것이든 다른 증거에 근거한 것이든 명백히 잘못된 경우가 아니면 파기해서는 안 되고, 심사하는 법원은 증인의 신빙성을 판단할 수 있었던 원심 법원의 기회를 존중하여야 한다.", "cite": "Fed. R. Civ. P. 52(a)(6)", "url": "https://www.law.cornell.edu/rules/frcp/rule_52", "glossary": {"clearly erroneous": "명백히 잘못된", "give due regard to": "~을 적절히 존중하다", "credibility": "신빙성"}}}, "box": "항소이유서(brief)에는 쟁점마다 심사기준을 적는 칸이 따로 있습니다(Fed. R. App. P. 28(a)(8)(B)). 이 장의 「명판결 명문장」이 clearly erroneous 기준을 설명한 판결입니다.", "grammar": {"axis": "G2", "title": "복수는 standards of review", "wrong": "Different standard of reviews apply.", "right": "Different standards of review apply.", "note": "'A of B' 꼴 복합명사는 머리명사 A에 -s를 붙입니다. statutes of limitations, courts of appeals도 같은 원리."}, "collocations": ["apply a standard of review", "deferential standard (존중적 기준)", "clearly erroneous", "substantial evidence (실질적 증거 기준)"], "links": [{"label": "LII Wex — standard of review", "url": "https://www.law.cornell.edu/wex/standard_of_review"}, {"label": "LII Wex — clearly erroneous", "url": "https://www.law.cornell.edu/wex/clearly_erroneous"}]}, {"id": "de-novo", "hw": "de novo", "ipa": "ˌdeɪ ˈnoʊ.voʊ", "stress": "de **no**·vo", "stars": 2, "gloss": "새로이(원심 판단에 구애받지 않고)", "diff": "라틴어로 '처음부터'. 상소심이 법률문제를 원심 판단에 얽매이지 않고 스스로 판단할 때 씁니다(de novo review). 라틴어 표현은 17장에서 다시 모아 복습합니다(→ 17장).", "examples": {"easy": {"en": "We review that question de novo.", "ko": "그 문제는 새로이 심사한다."}, "practice": {"en": "Questions of law are reviewed de novo, so the district court's reading of the statute gets no deference.", "ko": "법률문제는 새로이 심사하므로, 지방법원의 법률 해석은 존중받지 못한다."}, "source": {"en": "The district judge must determine de novo any part of the magistrate judge's disposition that has been properly objected to.", "ko": "지방법원 판사는 치안판사의 처분 중 적법하게 이의가 제기된 부분을 새로이 판단하여야 한다.", "cite": "Fed. R. Civ. P. 72(b)(3)", "url": "https://www.law.cornell.edu/rules/frcp/rule_72", "glossary": {"magistrate judge": "치안판사(연방지방법원의 보조 판사)", "disposition": "처분, 처리", "object to": "~에 이의를 제기하다"}}}, "pron_tip": "de는 /deɪ/와 /diː/가 모두 들립니다. 강세는 no에. novo는 발음 사전(Cambridge US) 미수록이라 미국 법조 관행 발음으로 적었습니다.", "grammar": {"axis": "G1", "title": "부사 de novo는 관사 없이, 형용사로는 a de novo review", "wrong": "We review the question a de novo.", "right": "We review the question de novo. / The court conducted a de novo review.", "note": "동사 뒤 부사로 쓸 때는 관사가 붙지 않습니다. 명사 review를 꾸미면 그 review에 관사를 붙입니다."}, "collocations": ["review de novo", "de novo review", "trial de novo (처음부터 다시 하는 재판)"], "links": [{"label": "LII Wex — de novo", "url": "https://www.law.cornell.edu/wex/de_novo"}]}, {"id": "abuse-of-discretion", "hw": "abuse of discretion", "ipa": "əˈbjuːs əv dɪˈskreʃ.ən", "stress": "a·**buse** of dis·**cre**·tion", "stars": 2, "gloss": "재량 남용(가장 존중적인 심사기준)", "pron_tip": "명사 abuse는 끝이 /s/, 동사 abuse는 /z/입니다. 여기서는 명사라 /əˈbjuːs/.", "diff": "증거 채부, 소송 지휘, 금지명령 여부처럼 판사에게 재량이 있는 결정을 심사하는 기준입니다. 항소법원이 자기라면 다르게 판단했을 것이라는 이유만으로는 파기하지 않습니다.", "examples": {"easy": {"en": "The judge did not abuse her discretion.", "ko": "판사는 재량을 남용하지 않았다."}, "practice": {"en": "We review the denial of a continuance for abuse of discretion.", "ko": "기일 연기 신청 기각은 재량 남용 기준으로 심사한다."}, "source": {"en": "We therefore hold that an appellate court should apply an abuse-of-discretion standard in reviewing all aspects of a district court's §285 determination.", "ko": "따라서 우리는 항소법원이 지방법원의 제285조 판단의 모든 측면을 재량 남용 기준으로 심사하여야 한다고 판시한다.", "cite": "Highmark Inc. v. Allcare Health Management System, Inc., 572 U.S. 559 (2014)", "url": "https://www.law.cornell.edu/supremecourt/text/12-1163", "glossary": {"§285": "특허법 제285조 — 예외적 사건의 변호사 보수 전가", "hold": "판시하다(→ 16장 holding)"}}}, "box": "Highmark는 특허 사건의 변호사 보수 결정을 연방순회항소법원(CAFC)이 de novo로 심사하던 관행을 뒤집었습니다. 심사기준 하나가 바뀌면서 지방법원의 판단이 더 오래 버티게 되었습니다.", "grammar": {"axis": "G3", "title": "discretion은 셀 수 없는 명사", "wrong": "an abuse of a discretion / discretions", "right": "an abuse of discretion / within the court's discretion", "note": "재량은 셀 수 없어 a도 복수형도 붙지 않습니다. 남용 한 건은 셀 수 있어 an abuse."}, "collocations": ["review for abuse of discretion", "within the discretion of the court", "abuse its discretion (동사구)", "broad discretion"], "links": [{"label": "LII Wex — abuse of discretion", "url": "https://www.law.cornell.edu/wex/abuse_of_discretion"}]}, {"id": "enforce", "hw": "enforce · enforcement", "ipa": "ɪnˈfɔːrs · ɪnˈfɔːrs.mənt", "stress": "en·**force** · en·**force**·ment", "stars": 2, "gloss": "(판결을) 집행하다 · 집행", "diff": "이겨도 피고가 돈을 내지 않으면 강제집행을 해야 합니다. 미국 연방법원의 금전판결 집행 절차는 원칙적으로 그 법원이 있는 주의 절차를 따릅니다(Rule 69(a)(1)). 그래서 '연방' 판결이라도 집행 방법은 주마다 다릅니다.", "examples": {"easy": {"en": "Winning is easy; enforcing is hard.", "ko": "이기기는 쉽고, 집행은 어렵다."}, "practice": {"en": "The judgment creditor moved to enforce the judgment against the debtor's bank accounts.", "ko": "판결 채권자는 채무자의 은행 계좌에 대해 판결을 집행하겠다고 신청했다."}, "source": {"en": "A money judgment is enforced by a writ of execution, unless the court directs otherwise.", "ko": "금전판결은 법원이 달리 지시하지 않는 한 집행영장으로 집행한다.", "cite": "Fed. R. Civ. P. 69(a)(1)", "url": "https://www.law.cornell.edu/rules/frcp/rule_69", "glossary": {"writ of execution": "집행영장(강제집행 명령서)", "money judgment": "금전판결"}}}, "box": "외국 판결을 미국에서 집행하려면 따로 승인·집행 절차를 거쳐야 합니다. 국제 사건의 판결 집행은 14장에서 다룹니다(→ 14장).", "grammar": {"axis": "G7", "title": "판결은 '집행된다' — is enforced", "wrong": "A money judgment enforces by a writ.", "right": "A money judgment is enforced by a writ of execution.", "note": "판결이 스스로 집행하지 않으므로 수동태. 행위자는 by로 붙이지만, 법조문은 흔히 행위자를 생략합니다."}, "collocations": ["enforce a judgment", "enforcement of judgments", "law enforcement (법 집행 기관, 주로 경찰)", "writ of execution"], "links": [{"label": "LII Wex — execution", "url": "https://www.law.cornell.edu/wex/execution"}, {"label": "LII Wex — writ of execution", "url": "https://www.law.cornell.edu/wex/writ_of_execution"}]}, {"id": "res-judicata", "hw": "res judicata", "ipa": "ˌreɪs ˌdʒuː.dɪˈkɑː.t̬ə", "stress": "res ju·di·**ca**·ta", "stars": 2, "pron_tip": "judicata는 발음 사전(Cambridge US) 미수록이라 미국 법조 관행 발음으로 적었습니다.", "gloss": "기판력(확정판결의 차단 효력)", "diff": "라틴어로 '판결된 일'. 넓게는 claim preclusion(같은 청구의 재소 차단)과 issue preclusion(= collateral estoppel, 쟁점 차단)을 함께 가리키고, 좁게는 claim preclusion만 뜻합니다. 원칙적으로 판결 주문에 포함된 것에 기판력을 인정하는 한국(민사소송법 제216조 제1항. 상계항변 판단은 같은 조 제2항의 예외)과 달리, 미국은 쟁점 차단까지 인정해 범위가 넓습니다. 라틴어 복습은 17장에서 합니다(→ 17장).", "examples": {"easy": {"en": "You cannot sue twice for the same claim.", "ko": "같은 청구로 두 번 소송할 수 없다."}, "practice": {"en": "The second lawsuit was dismissed as barred by res judicata.", "ko": "두 번째 소송은 기판력에 막혀 기각되었다."}, "source": {"en": "The preclusive effect of a judgment is defined by claim preclusion and issue preclusion, which are collectively referred to as \"res judicata.\"", "ko": "판결의 차단 효력은 청구 차단과 쟁점 차단으로 정해지며, 이 둘을 합쳐 '기판력(res judicata)'이라고 부른다.", "cite": "Taylor v. Sturgell, 553 U.S. 880 (2008)", "url": "https://www.law.cornell.edu/supct/html/07-371.ZO.html", "glossary": {"preclusive effect": "차단 효력", "collectively": "합쳐서, 통틀어"}}}, "pitfalls": ["res judicata를 언제나 '기판력'과 같은 범위로 옮기기 — issue preclusion까지 포함하는지 문맥을 본다"], "grammar": {"axis": "G7", "title": "be barred by res judicata", "wrong": "The claim bars by res judicata.", "right": "The claim is barred by res judicata.", "note": "청구가 '막히는' 쪽이므로 수동태. 3장 statute of limitations에서도 같은 틀(is barred by)을 썼습니다."}, "collocations": ["barred by res judicata", "claim preclusion", "issue preclusion", "collateral estoppel"], "links": [{"label": "LII Wex — res judicata", "url": "https://www.law.cornell.edu/wex/res_judicata"}, {"label": "LII Wex — collateral estoppel", "url": "https://www.law.cornell.edu/wex/collateral_estoppel"}]}], "corners": {"false_friend": {"title": "damages는 '손해들'이 아니다", "body": ["damage는 '손해·피해'입니다. 그런데 끝에 s가 붙어 damages가 되면 손해가 여러 개라는 뜻이 아니라, 그 손해를 메우라고 법원이 명하는 '돈', 곧 손해배상금이 됩니다. 'The court awarded damages'를 '법원은 손해들을 인정했다'로 옮기면 틀립니다.", "이 장에는 일상 뜻과 법정 뜻이 갈리는 말이 유난히 많습니다. 특히 상소심 결론을 나타내는 affirm·reverse·vacate는 일상 뜻으로 읽으면 결론이 거꾸로 됩니다."], "table": [["damages", "손해들", "손해배상금"], ["trial", "시험, 시련", "정식 재판(사실심리)"], ["judgment", "판단력", "판결"], ["appeal", "매력, 호소", "항소(상소)"], ["affirm", "단언하다, 확인하다", "원심을 유지하다(항소기각)"], ["vacate", "(자리를) 비우다", "(판결을) 취소하다"], ["costs", "비용 일반", "소송비용(변호사 보수는 빠진다)"]], "tip": "외우는 요령: 항소심 판결 끝 줄에 Affirmed가 보이면 '진 쪽이 계속 졌다', Reversed가 보이면 '뒤집혔다'입니다."}, "drama": {"title": "The Verdict (1982)", "facts": ["1982년 미국 영화. 감독 시드니 루멧, 각본 데이비드 마멧, 주연 폴 뉴먼.", "배리 리드의 1980년 같은 이름 소설이 원작입니다.", "작품상·감독상·남우주연상(뉴먼)·남우조연상(제임스 메이슨)·각색상 등 아카데미상 5개 부문 후보에 올랐습니다."], "watch": "보스턴의 한물간 변호사가 의료과실 손해배상 사건을 맡습니다. 상대방이 내놓은 화해금을 거절하고 정식 재판(trial)을 택하는 장면에서 3장의 settlement와 이 장의 trial이 갈립니다. 증인신문을 거쳐 최종변론(closing argument), 배심 평결(verdict)까지 민사 재판의 순서가 그대로 이어집니다. 제목 자체가 이 장의 표제어입니다.", "terms": ["trial", "jury", "closing argument", "verdict", "damages", "settle / settlement (→ 3장)"], "links": [{"label": "Wikipedia — The Verdict", "url": "https://en.wikipedia.org/wiki/The_Verdict"}, {"label": "평론 — ABA Journal, Richard Brust(편집자)·법률가 12인 심사단, 「The 25 Greatest Legal Movies」(2008) 10위", "url": "https://www.abajournal.com/magazine/article/the_25_greatest_legal_movies"}, {"label": "평론 — ABA Journal, Paul Bergman(UCLA 로스쿨 명예교수), 「The 25 greatest legal movies」(2018) 심사위원 논평 '최고의 반대신문'", "url": "https://www.abajournal.com/magazine/article/best_lawyer_movies"}]}, "quote": {"text": "Where there are two permissible views of the evidence, the factfinder's choice between them cannot be clearly erroneous.", "ko": "증거에 대하여 허용될 수 있는 두 가지 견해가 있을 때, 사실인정자가 그중 하나를 고른 것은 명백한 잘못일 수 없다.", "case": "Anderson v. Bessemer City, 470 U.S. 564 (1985)", "decided": "1985. 3. 19. 선고", "gloss": {"permissible": "허용될 수 있는", "factfinder": "사실인정자(일반적으로 배심 또는 판사. 이 사건에서는 지방법원 판사)", "clearly erroneous": "명백히 잘못된 — Rule 52(a)(6)의 심사기준"}, "why": "연방지방법원 판사는 시 레크리에이션 국장 채용에서 여성 지원자가 성차별을 당했다고 사실인정했고, 항소법원은 그 사실인정이 틀렸다며 뒤집었습니다. 연방대법원은 항소법원이 '자기라면 다르게 보았을 것'이라는 이유로 원심 사실인정을 뒤집을 수 없다고 했습니다. 이 한 문장이 미국 항소심이 판사의 사실인정을 왜 쉽게 뒤집지 않는지를 가장 짧게 설명합니다. 이 기준(Rule 52(a)(6))은 배심 없이 판사가 사실을 인정한 사건에 적용되고, 배심 평결은 별도의 틀로 심사합니다.", "links": [{"label": "LII — Anderson v. Bessemer City 판결 원문", "url": "https://www.law.cornell.edu/supremecourt/text/470/564"}, {"label": "LII Wex — clearly erroneous", "url": "https://www.law.cornell.edu/wex/clearly_erroneous"}]}, "korea": {"title": "항소심은 사실을 다시 보는가?", "us": "미국 연방 항소법원은 원칙적으로 법률심에 가깝습니다. 판사의 사실인정은 명백한 잘못이 없으면 뒤집지 않고(Rule 52(a)(6)), 배심 평결은 더 존중합니다. 일반적인 민사사건에서 항소장은 판결 등록 뒤 30일 안에 냅니다(Fed. R. App. P. 4(a)(1)(A)). 미국 정부가 당사자인 사건(60일) 등 예외가 있습니다.", "kr": "한국 민사소송은 3심 구조입니다. 항소는 제1심 법원이 선고한 종국판결에 대하여 할 수 있고(민사소송법 제390조 제1항), 판결서가 송달된 날부터 2주 안에 해야 합니다(제396조 제1항). 항소심은 사실과 법률을 모두 다시 심리합니다. 상고는 고등법원과 지방법원 합의부가 제2심으로 선고한 종국판결에 대하여 할 수 있고(제422조 제1항), 판결에 영향을 미친 헌법·법률·명령·규칙 위반만 이유로 삼을 수 있습니다(제423조). 원심이 적법하게 확정한 사실은 상고법원을 기속합니다(제432조). 양쪽 당사자가 합의하면 항소를 건너뛰고 제1심 판결에 바로 상고할 수도 있습니다(비약상고, 제390조 제1항 단서·제422조 제2항). 그래서 미국의 '항소'는 한국의 상고와 성격이 더 가깝습니다.", "say": "In Korea, the first appeal normally reviews both facts and law, while an appeal to the Supreme Court of Korea is limited to questions of law.", "say_ko": "한국에서 항소는 보통 사실과 법률을 모두 다시 심리하고, 대법원에 하는 상고는 법률문제로 한정됩니다."}}, "quiz": [{"q": "배심이 내리는 사실판단을 가리키는 말은?", "options": ["judgment", "verdict", "opinion", "remand"], "answer": 1, "why": "verdict는 배심의 평결, judgment는 그 평결을 토대로 법원이 하는 판결입니다."}, {"q": "항소심 판결 끝에 'Affirmed.'라고 적혀 있다. 한국식으로 옮기면?", "options": ["원심 파기", "항소기각(원심 유지)", "사건 환송", "항소 각하"], "answer": 1, "why": "affirm은 원심 판결을 유지하는 것. 한국 판결문으로는 '항소를 기각한다'에 해당합니다."}, {"q": "미국에서 이긴 당사자가 원칙적으로 상대방에게서 받을 수 없는 것은?", "options": ["costs", "attorney's fees", "damages"], "answer": 1, "why": "American rule에 따라 변호사 보수는 각자 부담이 원칙입니다. 법률·계약에 근거가 있거나 악의적 소송에 대한 제재처럼 특별한 근거가 있는 경우에만 상대방에게 넘깁니다."}, {"q": "문법: 빈칸에 맞는 것은? — The storm caused a lot of ____, and the owner sued for ____.", "options": ["damages / damage", "damage / damages", "damages / damages"], "answer": 1, "why": "피해는 셀 수 없는 damage, 배상금은 복수형 damages.", "grammar": "G3"}, {"q": "번역해 보세요: The judgment was reversed and the case was remanded.", "options": ["판결이 유지되고 사건은 종결되었다.", "판결이 파기되고 사건은 환송되었다.", "판결이 취소되고 사건은 각하되었다."], "answer": 1, "why": "reverse = 파기, remand = 환송. 둘 다 수동태(was reversed, was remanded)로 결과를 말합니다."}]}, {"chapter": {"num": 5, "title": "증거와 증인신문", "subtitle": "Objection!", "title_en": "Evidence and Witnesses — Objection!", "lead": "미국 재판의 한가운데는 증인신문입니다. 한쪽 변호사가 묻고, 상대방 변호사는 질문이 규칙에 어긋난다 싶으면 일어나 \"Objection!\"을 외치고, 판사는 그 자리에서 sustained 또는 overruled로 답합니다. 배심원이 무엇을 듣고 무엇을 듣지 못하는지를 정하는 규칙, 곧 증거법이 이 장의 주제입니다.", "can_say": [{"en": "Objection, Your Honor. The question calls for hearsay.", "ko": "이의 있습니다, 재판장님. 그 질문은 전문증거를 구하는 것입니다."}, {"en": "The witness testified under oath that she saw the car.", "ko": "증인은 선서하고 그 차를 보았다고 증언했습니다."}, {"en": "The plaintiff has the burden of proof by a preponderance of the evidence.", "ko": "원고는 증거의 우월로 증명할 책임을 집니다."}]}, "entries": [{"id": "evidence", "hw": "evidence", "ipa": "ˈev.ə.dəns", "stress": "**ev**·i·dence", "stars": 3, "gloss": "증거", "examples": {"easy": {"en": "There is no evidence against him.", "ko": "그에게 불리한 증거는 없다."}, "practice": {"en": "The prosecutor offered three pieces of evidence: a knife, a receipt, and a text message.", "ko": "검사는 칼, 영수증, 문자 메시지라는 증거 세 가지를 제출했다."}, "source": {"en": "Evidence is relevant if: (a) it has any tendency to make a fact more or less probable than it would be without the evidence", "ko": "증거는 다음의 경우 관련성이 있다. (a) 그 증거가 없을 때보다 어떤 사실을 더 개연성 있거나 덜 개연성 있게 만드는 경향이 조금이라도 있고 …", "cite": "Fed. R. Evid. 401(a)", "url": "https://www.law.cornell.edu/rules/fre/rule_401", "glossary": {"tendency": "경향", "probable": "개연성 있는, 있을 법한"}}}, "box": "미국 연방법원의 증거 규칙은 연방증거규칙(Federal Rules of Evidence, FRE)에 모여 있습니다. 1975년에 시행되었고 민사·형사에 함께 적용됩니다. 조문 번호가 짧아서 변호사들은 '403 objection', '803(6) business record'처럼 번호로 부릅니다.", "grammar": {"axis": "G3", "title": "evidence는 셀 수 없다", "wrong": "The police found an evidence. / three evidences", "right": "The police found evidence. / three pieces of evidence", "note": "a를 붙이지 않고 -s도 붙이지 않습니다. 하나하나 셀 때는 a piece of evidence, pieces of evidence."}, "collocations": ["a piece of evidence", "offer / introduce evidence (증거를 제출하다)", "admit evidence (증거로 채택하다)", "in evidence (증거로 채택된)"], "links": [{"label": "LII Wex — evidence", "url": "https://www.law.cornell.edu/wex/evidence"}]}, {"id": "exhibit", "hw": "exhibit", "ipa": "ɪɡˈzɪb.ɪt", "stress": "ex·**hib**·it", "stars": 3, "false_friend": true, "gloss": "증거물, (서증·물증의) 호증", "pron_tip": "h는 소리 나지 않습니다. ex-가 /ɪɡz/로 울리고 강세는 둘째 음절 -hib-.", "diff": "일상어로는 '전시품·전시회'입니다. 법정에서는 번호를 붙여 제출한 문서·물건 하나하나를 가리킵니다. 한국의 '갑 제1호증'이 미국에서는 Plaintiff's Exhibit 1, '을 제1호증'이 Defendant's Exhibit 1(또는 Exhibit A)쯤에 해당합니다.", "examples": {"easy": {"en": "Please look at Exhibit 3.", "ko": "증거 3호를 봐 주십시오."}, "practice": {"en": "Your Honor, I move to admit Plaintiff's Exhibit 12 into evidence.", "ko": "재판장님, 원고 측 증거 12호를 증거로 채택해 주실 것을 신청합니다."}, "source": {"en": "If admitted, the statement may be read into evidence but not received as an exhibit.", "ko": "증거로 채택되면 그 내용은 법정에서 읽어 증거로 할 수 있으나, 증거물로 받아들이지는 않는다.", "cite": "Fed. R. Evid. 803(18) — 전문서적(learned treatise) 예외", "url": "https://www.law.cornell.edu/rules/fre/rule_803", "glossary": {"read into evidence": "(법정에서) 읽어서 증거로 삼다", "learned treatise": "전문 서적·논문"}}}, "box": "전문서적은 낭독만 하고 책 자체는 배심원실에 들여보내지 않습니다. 배심원이 평의 중에 책을 혼자 읽고 엉뚱한 결론을 내지 않게 하려는 것입니다.", "grammar": {"axis": "G1", "title": "번호가 붙으면 관사 없이 대문자", "wrong": "Please look at the exhibit 3.", "right": "Please look at Exhibit 3. / Please look at the exhibit.", "note": "Exhibit 3처럼 번호가 붙으면 이름처럼 쓰여 관사가 빠집니다. Room 5, Chapter 11과 같은 원리. 번호 없이 '그 증거물'이면 the exhibit."}, "collocations": ["mark an exhibit (번호를 붙이다)", "move to admit Exhibit 5", "Plaintiff's / Defendant's Exhibit", "exhibit list (증거 목록)"], "links": [{"label": "LII Wex — exhibit", "url": "https://www.law.cornell.edu/wex/exhibit"}]}, {"id": "witness", "hw": "witness · testify · testimony", "ipa": "ˈwɪt.nəs · ˈtes.tə.faɪ · ˈtes.tə.moʊ.ni", "stress": "**wit**·ness · **tes**·ti·fy · **tes**·ti·mo·ny", "stars": 3, "gloss": "증인 · 증언하다 · 증언", "examples": {"easy": {"en": "The witness was nervous.", "ko": "증인은 긴장해 있었다."}, "practice": {"en": "The neighbor testified against the defendant, and her testimony lasted two hours.", "ko": "이웃은 피고인에게 불리하게 증언했고, 그 증언은 두 시간 동안 이어졌다."}, "source": {"en": "A witness may testify to a matter only if evidence is introduced sufficient to support a finding that the witness has personal knowledge of the matter.", "ko": "증인은 자신이 그 사항을 직접 안다는 사실을 인정할 만한 증거가 제출된 경우에만 그 사항에 관하여 증언할 수 있다.", "cite": "Fed. R. Evid. 602", "url": "https://www.law.cornell.edu/rules/fre/rule_602", "glossary": {"personal knowledge": "직접 경험해서 아는 것", "finding": "(사실의) 인정"}}}, "grammar": {"axis": "G4", "title": "testify against / for / to", "wrong": "She testified the defendant.", "right": "She testified against the defendant. / She testified to what she saw.", "note": "testify는 목적어를 바로 받지 않습니다. 불리하게는 against, 유리하게는 for, 증언 내용은 to 또는 that절."}, "collocations": ["take the stand (증인석에 서다)", "call a witness (증인을 신청·소환하다)", "eyewitness (목격자)", "give testimony", "testify under oath"], "links": [{"label": "LII Wex — witness", "url": "https://www.law.cornell.edu/wex/witness"}, {"label": "LII Wex — testimony", "url": "https://www.law.cornell.edu/wex/testimony"}]}, {"id": "under-oath", "hw": "under oath · swear in", "ipa": "ˈʌn.dɚ oʊθ · swer ɪn", "stress": "**un**·der **oath** · **swear** **in**", "stars": 2, "gloss": "선서하고, 선서한 상태로 · 선서시키다", "pron_tip": "oath의 th는 혀끝을 이 사이에 두는 무성음 /θ/입니다. 복수 oaths는 /oʊðz/로 소리가 바뀝니다.", "diff": "미국 법정에서는 사무관(clerk)이 증인에게 오른손을 들게 하고 선서를 받는 장면이 흔합니다. 종교적 선서를 원하지 않는 사람은 affirmation(확약)으로 대신할 수 있습니다.", "examples": {"easy": {"en": "He lied under oath.", "ko": "그는 선서하고서 거짓말을 했다."}, "practice": {"en": "The clerk swore in the witness before the prosecutor began her questions.", "ko": "검사가 신문을 시작하기 전에 사무관이 증인을 선서시켰다."}, "source": {"en": "Before testifying, a witness must give an oath or affirmation to testify truthfully.", "ko": "증인은 증언하기 전에 진실하게 증언하겠다는 선서 또는 확약을 하여야 한다.", "cite": "Fed. R. Evid. 603", "url": "https://www.law.cornell.edu/rules/fre/rule_603", "glossary": {"affirmation": "확약(신에게 맹세하지 않는 선서)"}}}, "grammar": {"axis": "G5", "title": "swear in — '선서시키다'는 구동사", "wrong": "The clerk swore in him.", "right": "The clerk swore him in. / The clerk swore in the witness. / The witness was sworn in.", "note": "남에게 선서를 시키는 말로는 구동사 swear in이 가장 흔하고, 수동은 be sworn in입니다. 취임 선서도 같은 말입니다. 목적어가 대명사면 반드시 가운데: swear him in. swear 혼자서도 '선서시키다'로 쓰지만(The witness was duly sworn.) 일상에서는 '맹세하다·욕하다' 뜻이 먼저 떠오릅니다."}, "collocations": ["under oath", "take an oath", "be sworn in", "Do you swear to tell the truth?"], "links": [{"label": "LII Wex — oath", "url": "https://www.law.cornell.edu/wex/oath"}]}, {"id": "direct-examination", "hw": "direct examination", "ipa": "dɪˌrekt ɪɡˌzæm.əˈneɪ.ʃən", "stress": "di·rect ex·am·i·**na**·tion", "stars": 3, "gloss": "주신문(증인을 신청한 쪽의 신문)", "diff": "구조는 한국 형사소송의 교호신문(주신문 → 반대신문)과 같습니다. 다만 미국 배심재판에서는 판사가 거의 묻지 않고 양쪽 변호사가 신문을 이끕니다.", "examples": {"easy": {"en": "Direct examination took an hour.", "ko": "주신문은 한 시간 걸렸다."}, "practice": {"en": "On direct, the detective explained how he found the phone.", "ko": "주신문에서 형사는 휴대전화를 어떻게 찾았는지 설명했다."}, "source": {"en": "Leading questions should not be used on direct examination except as necessary to develop the witness's testimony.", "ko": "주신문에서는 증인의 증언을 끌어내는 데 필요한 경우가 아니면 유도신문을 해서는 안 된다.", "cite": "Fed. R. Evid. 611(c)", "url": "https://www.law.cornell.edu/rules/fre/rule_611", "glossary": {"develop": "(증언을) 끌어내다, 전개하다"}}}, "grammar": {"axis": "G1", "title": "on direct / on cross — 관사 없이", "wrong": "On the direct, she said ...", "right": "On direct, she said ... / On cross, she admitted ...", "note": "법정 은어로 examination을 빼고 on direct, on cross라고 말합니다. 이때는 관사를 붙이지 않습니다."}, "collocations": ["on direct", "conduct a direct examination", "redirect (재주신문)"], "links": [{"label": "LII Wex — direct examination", "url": "https://www.law.cornell.edu/wex/direct_examination"}]}, {"id": "cross-examination", "hw": "cross-examination · cross-examine", "ipa": "ˌkrɑːs.ɪɡˌzæm.əˈneɪ.ʃən · ˌkrɑːs.ɪɡˈzæm.ɪn", "stress": "cross-ex·am·i·**na**·tion · cross-ex·**am**·ine", "stars": 3, "gloss": "반대신문 · 반대신문하다", "examples": {"easy": {"en": "Cross-examination starts after lunch.", "ko": "반대신문은 점심 뒤에 시작한다."}, "practice": {"en": "Defense counsel cross-examined the officer about the lighting that night.", "ko": "변호인은 그날 밤 조명 상태에 관해 경찰관을 반대신문했다."}, "source": {"en": "Cross-examination should not go beyond the subject matter of the direct examination and matters affecting the witness's credibility. The court may allow inquiry into additional matters as if on direct examination.", "ko": "반대신문은 주신문의 주제와 증인의 신빙성에 관한 사항을 넘어서는 안 된다. 법원은 그 밖의 사항을 주신문처럼 묻도록 허용할 수 있다.", "cite": "Fed. R. Evid. 611(b)", "url": "https://www.law.cornell.edu/rules/fre/rule_611", "glossary": {"subject matter": "주제, 다루는 대상", "credibility": "신빙성(→ 이 장)"}}}, "box": "반대신문에서는 유도신문이 원칙적으로 허용됩니다(Rule 611(c)(1)). 노련한 변호사는 '예/아니오'로만 답하게 하는 짧은 유도신문을 이어 가며 증인의 말을 한 걸음씩 좁혀 갑니다.", "grammar": {"axis": "G6", "title": "conduct a cross-examination", "wrong": "The lawyer conducted a cross-examine.", "right": "The lawyer conducted a cross-examination. / The lawyer cross-examined the witness.", "note": "명사는 cross-examination, 동사는 cross-examine입니다. 신문을 '하다'는 법률 문장에서 conduct가 표준 짝이고(do a cross-examination은 구어 느낌), 동사 cross-examine 하나로 말하는 편이 더 짧고 흔합니다."}, "collocations": ["cross-examine a witness", "on cross", "recross (재반대신문)", "the right to cross-examine"], "links": [{"label": "LII Wex — cross-examination", "url": "https://www.law.cornell.edu/wex/cross-examination"}]}, {"id": "leading-question", "hw": "leading question", "ipa": "ˌliː.dɪŋ ˈkwes.tʃən", "stress": "lead·ing **ques**·tion", "stars": 2, "gloss": "유도신문(원하는 답을 질문 속에 넣은 질문)", "examples": {"easy": {"en": "That is a leading question.", "ko": "그건 유도신문입니다."}, "practice": {"en": "\"You saw the defendant at 10 p.m., didn't you?\" is a classic leading question.", "ko": "\"피고인을 밤 10시에 보셨지요?\"는 전형적인 유도신문이다."}, "source": {"en": "Ordinarily, the court should allow leading questions: (1) on cross-examination;", "ko": "법원은 통상 다음의 경우 유도신문을 허용하여야 한다. (1) 반대신문에서 …", "cite": "Fed. R. Evid. 611(c)(1)", "url": "https://www.law.cornell.edu/rules/fre/rule_611"}}, "box": "유도신문을 알아보는 손쉬운 표지는 부가의문문(..., didn't you?)과 '~가 맞지요?(Isn't it true that ...?)'입니다. 주신문에서 이런 꼴이 나오면 상대방은 곧바로 \"Objection, leading.\"이라고 일어섭니다.", "grammar": {"axis": "G2", "title": "규칙은 복수로 말한다 — leading questions", "wrong": "The court should allow leading question on cross.", "right": "The court should allow leading questions on cross.", "note": "셀 수 있는 명사를 일반론으로 말할 때는 관사 없는 복수가 기본입니다. 하나를 가리키면 a leading question."}, "collocations": ["ask a leading question", "Objection, leading.", "rephrase the question (질문을 바꾸다)"], "links": [{"label": "LII Wex — leading question", "url": "https://www.law.cornell.edu/wex/leading_question"}]}, {"id": "objection", "hw": "Objection! · object", "ipa": "əbˈdʒek.ʃən · əbˈdʒekt", "stress": "ob·**jec**·tion · ob·**ject**", "stars": 3, "gloss": "이의 있습니다! · 이의를 제기하다", "pron_tip": "동사 object는 강세가 뒤(-ject)에, 명사 object(물체)는 앞(**ob**-)에 옵니다. 법정의 object는 동사이므로 뒤를 세게.", "diff": "미국 법정의 이의는 질문의 부적절함을 알 수 있는 때,
