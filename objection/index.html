— 절차 이름은 관사 없이", "wrong": "At the oral argument of Monday, ...", "right": "At oral argument on Monday, ...", "note": "절차로서의 oral argument는 셀 수 없는 명사처럼 관사 없이 씁니다(hear oral argument). 주장 하나하나는 an argument, arguments."}, "collocations": ["hear oral argument", "at oral argument", "argue the case (사건을 변론하다)", "argued December 1, 2021"], "links": [{"label": "Oyez — Dobbs v. Jackson Women's Health Organization (변론 녹음 · 2022. 6. 24. 선고 · 파기·환송)", "url": "https://www.oyez.org/cases/2021/19-1392"}]}, {"id": "opinions", "hw": "majority / concurring / dissenting opinion", "ipa": "məˈdʒɔː.rə.t̬i · kənˈkɝː.ɪŋ · dɪˈsen.t̬ɪŋ əˈpɪn.jən", "stress": "ma·**jor**·i·ty · con·**cur**·ring · dis·**sent**·ing o·**pin**·ion", "stars": 3, "gloss": "다수의견 / 보충의견(별개의견) / 반대의견", "diff": "concurring opinion은 결론에 찬성하면서 이유를 덧붙이거나 달리하는 의견입니다. 한국 헌법재판소·대법원의 '보충의견'은 다수의견에 가담하면서 덧붙이는 의견이고 '별개의견'은 이유를 달리하는 의견이어서, 하나의 영어 표현이 두 한국어에 걸칩니다. 이유는 다르고 결론만 같으면 concurring in the judgment(→ 16장).", "examples": {"easy": {"en": "Justice Park wrote a dissenting opinion.", "ko": "박 대법관은 반대의견을 썼다."}, "practice": {"en": "The majority opinion was joined by five justices, and two others concurred.", "ko": "다수의견에는 대법관 다섯 명이 가담했고, 다른 두 명은 보충의견을 냈다."}, "source": {"en": "… delivered the opinion of the Court … filed concurring opinions. … filed an opinion concurring in the judgment. … filed a dissenting opinion.", "ko": "… 법원의 의견(다수의견)을 집필했다 … 보충의견을 냈다 … 결론에만 찬성하는 의견을 냈다 … 반대의견을 냈다.", "cite": "Dobbs v. Jackson Women's Health Organization, 597 U.S. 215 (2022), 판결요지(syllabus) 끝의 의견 구성 표시", "url": "https://www.law.cornell.edu/supremecourt/text/19-1392", "glossary": {"deliver the opinion of the Court": "법원의 의견을 집필·선고하다", "file": "(의견을) 내다"}}}, "box": "연방대법원 판결 첫머리에는 누가 어떤 의견을 냈는지가 한 단락으로 정리되어 있습니다. 이 단락만 읽어도 몇 대 몇 판결인지 알 수 있습니다. 반대의견은 흔히 'I respectfully dissent.'로 끝맺습니다.", "grammar": {"axis": "G4", "title": "concur in / dissent from", "wrong": "Justice Lee dissented to the decision.", "right": "Justice Lee dissented from the decision. / concurred in the judgment", "note": "반대는 dissent from, 찬성은 concur in(결론·판결) 또는 concur with(사람·의견). 명사로는 a dissent, a concurrence."}, "collocations": ["write / file a dissent", "join the majority opinion", "concur in the judgment", "I respectfully dissent."], "links": [{"label": "LII Wex — dissenting opinion", "url": "https://www.law.cornell.edu/wex/dissenting_opinion"}, {"label": "LII Wex — concurring opinion", "url": "https://www.law.cornell.edu/wex/concurring_opinion"}]}, {"id": "landmark-case", "hw": "landmark case", "ipa": "ˈlænd.mɑːrk keɪs", "stress": "**land**·mark **case**", "stars": 2, "gloss": "획기적 판례, 기념비적 판결", "examples": {"easy": {"en": "Brown is a landmark case.", "ko": "Brown은 획기적 판례다."}, "practice": {"en": "Loving v. Virginia is one of the landmark cases on marriage.", "ko": "Loving v. Virginia는 혼인에 관한 획기적 판례 중 하나다."}, "source": {"en": "Under our Constitution, the freedom to marry or not marry, a person of another race resides with the individual and cannot be infringed by the State.", "ko": "우리 헌법 아래에서 다른 인종의 사람과 혼인할 자유와 혼인하지 않을 자유는 개인에게 있고, 주(州)가 침해할 수 없다.", "cite": "Loving v. Virginia, 388 U.S. 1, 12 (1967)", "url": "https://www.law.cornell.edu/supremecourt/text/388/1", "glossary": {"reside with": "~에게 있다, 속하다", "infringe": "침해하다"}}}, "box": "Loving 판결(1967. 6. 12. 선고)은 다른 인종 사이의 혼인을 처벌하던 버지니아주 법률을 평등보호·적법절차 조항 위반으로 판단했습니다. 판결문은 이 문장 바로 뒤에 'These convictions must be reversed.'로 끝납니다.", "grammar": {"axis": "G2", "title": "one of the + 최상급·복수", "wrong": "one of the most important case", "right": "one of the most important cases", "note": "landmark case를 소개할 때 자주 쓰는 틀입니다. one of 뒤는 복수, 동사는 one에 맞춰 단수(is)."}, "collocations": ["a landmark decision / ruling", "a landmark civil rights case", "set a precedent (→ 1장)"]}, {"id": "overrule", "hw": "overrule", "ipa": "ˌoʊ.vɚˈruːl", "stress": "o·ver·**rule**", "stars": 2, "false_friend": true, "gloss": "(선례를) 변경하다, 폐기하다", "diff": "같은 단어가 법정에서는 '이의를 기각하다'(Objection overruled → 5장)입니다. 상소심이 하급심 판결을 뒤집는 것은 reverse이고, overrule은 법원이 자기 또는 하급 법원의 과거 판례를 더는 따르지 않겠다고 선언하는 것입니다. 한국의 '판례 변경'에 가깝습니다.", "examples": {"easy": {"en": "The Court overruled an old precedent.", "ko": "연방대법원은 오래된 선례를 변경했다."}, "practice": {"en": "Brown effectively overruled Plessy v. Ferguson in public education.", "ko": "Brown 판결은 공교육 분야에서 Plessy v. Ferguson을 사실상 폐기했다."}, "source": {"en": "Roe and Casey must be overruled, and the authority to regulate abortion must be returned to the people and their elected representatives.", "ko": "Roe와 Casey는 폐기되어야 하고, 낙태를 규율할 권한은 국민과 그들이 선출한 대표에게 돌려주어야 한다.", "cite": "Dobbs v. Jackson Women's Health Organization, 597 U.S. 215 (2022), 다수의견", "url": "https://www.law.cornell.edu/supremecourt/text/19-1392", "glossary": {"Roe and Casey": "Roe v. Wade(1973)와 Planned Parenthood v. Casey(1992)", "elected representatives": "선출된 대표"}}}, "pitfalls": ["overrule과 reverse 혼동 — reverse는 '이 사건의 원심 판결'을, overrule은 '과거의 다른 판례'를 뒤집는다", "법정의 'Overruled.'를 '판례 변경'으로 옮기기"], "grammar": {"axis": "G7", "title": "선례는 수동태로 '폐기된다'", "wrong": "Roe overruled in 2022.", "right": "Roe was overruled in 2022.", "note": "Roe가 스스로 폐기한 것이 아니므로 was overruled. 능동으로 쓰려면 주어를 the Court로: The Court overruled Roe."}, "collocations": ["overrule a precedent", "expressly / implicitly overrule", "reverse (원심 판결을 파기하다)", "Objection overruled (→ 5장)"], "links": [{"label": "LII Wex — overrule", "url": "https://www.law.cornell.edu/wex/overrule"}]}, {"id": "originalism", "hw": "originalism · living constitution", "ipa": "əˈrɪdʒ.ən.əl.ɪ.zəm · ˈlɪv.ɪŋ ˌkɑːn.stəˈtuː.ʃən", "stress": "o·**rig**·i·nal·ism · **liv**·ing con·sti·**tu**·tion", "stars": 1, "pron_tip": "originalism은 발음 사전(Cambridge US) 미수록이라 미국 법조 관행 발음으로 적었습니다.", "gloss": "원의주의(제정 당시의 의미로 해석) · 살아 있는 헌법론(시대 변화에 맞춰 해석)", "diff": "헌법 해석 방법을 두고 미국에서 가장 자주 부딪치는 두 입장입니다. 대법관 지명 청문회에서 거의 빠지지 않고 나오는 질문이기도 합니다. 둘 다 학자와 법관마다 세부 내용이 달라 한 줄 정의로는 다 담기지 않습니다.", "examples": {"easy": {"en": "She is an originalist judge.", "ko": "그녀는 원의주의 성향의 판사다."}, "practice": {"en": "Supporters of a living constitution say the text must adapt to new problems.", "ko": "살아 있는 헌법론 지지자들은 헌법 문언이 새로운 문제에 맞게 적응해야 한다고 말한다."}, "source": {"en": "This provision is made in a constitution, intended to endure for ages to come, and consequently, to be adapted to the various crises of human affairs.", "ko": "이 조항은 앞으로 오랜 세월 지속되도록, 따라서 인간사의 여러 위기에 맞추어 적용되도록 만든 헌법 안에 있다.", "cite": "McCulloch v. Maryland, 17 U.S. 316, 415 (1819)", "url": "https://www.law.cornell.edu/supremecourt/text/17/316", "glossary": {"endure": "지속되다, 견디다", "adapt": "적응시키다, 맞추다", "crises": "crisis의 복수"}}}, "box": "마셜 대법원장은 같은 판결에서 'we must never forget that it is a constitution we are expounding'(우리가 풀이하는 것이 헌법임을 잊어서는 안 된다)이라고도 썼습니다. 살아 있는 헌법론 쪽이 즐겨 인용하는 문장이지만, 마셜 자신을 어느 한 진영에 넣기는 어렵습니다.", "grammar": {"axis": "G1", "title": "a living constitution vs the Constitution", "wrong": "They believe in living constitution.", "right": "They believe in a living constitution. / They read the Constitution as a living document.", "note": "constitution은 셀 수 있는 단수명사라 관사 없이 쓸 수 없습니다. '살아 있는 헌법'이라는 생각을 처음 소개할 때는 a living constitution. 이미 알려진 그 해석 이념이나 특정 헌법을 받을 때는 the living constitution도 맞습니다. 미국 헌법 그 자체는 the Constitution."}, "collocations": ["originalist (원의주의자)", "original public meaning (제정 당시의 공적 의미)", "textualism (문언주의)", "a living document"], "links": [{"label": "LII Wex — originalism", "url": "https://www.law.cornell.edu/wex/originalism"}]}, {"id": "strict-scrutiny", "hw": "strict scrutiny", "ipa": "strɪkt ˈskruː.t̬ən.i", "stress": "**strict** **scru**·ti·ny", "stars": 1, "gloss": "엄격심사", "diff": "법률이 인종처럼 의심스러운 기준(suspect classification)으로 사람을 구별하거나 기본권을 제한하면, 정부가 '불가피한 이익(compelling interest)'과 '그에 꼭 맞게 좁혀진 수단(narrowly tailored)'을 증명해야 합니다. 성별 구별 등에는 그보다 한 단계 낮은 중간심사(intermediate scrutiny — '중요한 정부 목적'과 '실질적 관련', United States v. Virginia, 1996)를 적용하고, 그 밖의 법률은 통상 합리성 심사(rational basis review)를 받습니다. 한국 헌법재판소의 엄격한 비례성 심사와 비슷하지만 단계 구성은 다릅니다.", "examples": {"easy": {"en": "Racial classifications get strict scrutiny.", "ko": "인종에 따른 구별은 엄격심사를 받는다."}, "practice": {"en": "Under strict scrutiny, the government must prove that the law serves a compelling interest.", "ko": "엄격심사에서는 정부가 그 법률이 불가피한 이익에 봉사한다는 것을 증명해야 한다."}, "source": {"en": "That is not to say that all such restrictions are unconstitutional. It is to say that courts must subject them to the most rigid scrutiny.", "ko": "그런 제한이 모두 위헌이라는 말은 아니다. 법원이 그것을 가장 엄격하게 심사해야 한다는 말이다.", "cite": "Korematsu v. United States, 323 U.S. 214, 216 (1944)", "url": "https://www.law.cornell.edu/supremecourt/text/323/214", "glossary": {"subject A to B": "A를 B에 부치다", "rigid": "엄격한"}}}, "box": "역설적이게도 '가장 엄격한 심사'라는 말을 처음 쓴 Korematsu 판결은 일본계 미국인 강제 퇴거 명령을 합헌으로 유지했습니다. 연방대법원은 2018년 Trump v. Hawaii에서 'Korematsu was gravely wrong the day it was decided'라고 밝혔습니다. 심사 기준의 뿌리로는 United States v. Carolene Products(1938)의 각주 4('discrete and insular minorities')가 함께 꼽힙니다.", "grammar": {"axis": "G6", "title": "survive / fail / apply strict scrutiny", "wrong": "The law passed the strict scrutiny.", "right": "The law survived strict scrutiny. / The court applied strict scrutiny.", "note": "심사를 통과하면 survive, 통과 못 하면 fail 또는 cannot withstand. 관사 없이 씁니다."}, "collocations": ["apply strict scrutiny", "survive / withstand strict scrutiny", "compelling governmental interest", "narrowly tailored", "rational basis review (합리성 심사)"], "links": [{"label": "LII Wex — strict scrutiny", "url": "https://www.law.cornell.edu/wex/strict_scrutiny"}, {"label": "LII — Trump v. Hawaii, 585 U.S. 667 (2018)", "url": "https://www.law.cornell.edu/supremecourt/text/17-965"}, {"label": "LII — United States v. Carolene Products Co., 304 U.S. 144 (1938)", "url": "https://www.law.cornell.edu/supremecourt/text/304/144"}]}, {"id": "federalism", "hw": "federalism", "ipa": "ˈfed.ɚ.əl.ɪ.zəm", "stress": "**fed**·er·al·ism", "stars": 1, "gloss": "연방주의", "diff": "연방과 주가 주권을 나눠 가진다는 원리입니다. 법원 구조(연방법원·주법원 이원 체계)에서의 의미는 2장 federalism 항목을 보세요. 헌법에서는 '연방 권한은 헌법이 열거한 것뿐이고 나머지는 주의 것'이라는 형태로 나타납니다.", "examples": {"easy": {"en": "Federalism divides power between two governments.", "ko": "연방주의는 두 정부 사이에 권력을 나눈다."}, "practice": {"en": "The state argued that the federal law violated principles of federalism.", "ko": "주 정부는 그 연방법이 연방주의 원리에 어긋난다고 주장했다."}, "source": {"en": "The powers not delegated to the United States by the Constitution, nor prohibited by it to the states, are reserved to the states respectively, or to the people.", "ko": "헌법이 합중국에 위임하지 않았고 주에 금지하지도 않은 권한은 각 주나 국민에게 유보된다.", "cite": "U.S. Const. amend. X", "url": "https://www.law.cornell.edu/constitution/tenth_amendment", "glossary": {"delegate": "위임하다", "be reserved to": "~에게 유보되다(남겨지다)", "respectively": "각각"}}}, "box": "McCulloch v. Maryland(1819)는 반대 방향의 고전입니다. 헌법에 '은행'이라는 말이 없어도 연방의회는 열거된 권한을 행사하는 데 필요하고 적절한 수단을 고를 수 있다고 보았고, 주가 연방은행에 세금을 매기는 것은 위헌이라고 했습니다(→ unconstitutional).", "grammar": {"axis": "G4", "title": "between A and B — with가 아니라 and", "wrong": "Federalism divides power between the federal government with the states.", "right": "Federalism divides power between the federal government and the states.", "note": "between 뒤에는 A and B. between과 among은 대상의 수만으로 갈리지 않습니다. 셋 이상이라도 하나하나의 관계가 분명하면 between을 씁니다(divided between her three children, Cambridge). 조문의 reserved to the states(주에 유보된다)처럼 권한이 남는 상대 앞에는 to를 씁니다."}, "collocations": ["principles of federalism", "states' rights (주의 권리)", "enumerated powers (열거된 권한)", "the Tenth Amendment"], "links": [{"label": "LII Wex — federalism", "url": "https://www.law.cornell.edu/wex/federalism"}]}], "corners": {"false_friend": {"title": "overrule은 법정과 상고심에서 뜻이 다르다", "body": ["5장에서 판사가 'Overruled.'라고 하면 '이의를 기각합니다'였습니다. 연방대법원 판결에서 'Roe is overruled'라고 하면 '이 판례를 폐기한다'입니다. 같은 단어가 법정에서는 변호사의 이의를, 상고심에서는 과거 판례를 물리칩니다. 어느 쪽이든 원심 판결을 뒤집는 reverse와는 다릅니다.", "amendment도 함정입니다. 일상어로는 '고침'이지만 미국 헌법의 Amendment는 본문을 고치지 않고 끝에 덧붙인 조항입니다. 그래서 '수정헌법 제1조'라는 번역이 붙었습니다.", "이 장의 가짜 친구를 모으면 이렇습니다."], "table": [["overrule", "(윗사람이) 결정을 뒤집다", "① 이의 기각(법정, → 5장) ② 판례 변경"], ["amendment", "고침, 수정", "헌법 끝에 덧붙인 수정조항"], ["bill", "청구서, 법률안", "목록을 적은 문서(Bill of Rights)"], ["province", "지방, 도(道)", "영역, 소관(Marbury의 'the province ... of the judicial department')"], ["opinion", "개인 의견", "판결 이유, 판결문"], ["Court", "법원 일반", "대문자 the Court는 연방대법원"], ["argument", "말다툼", "변론(oral argument)"]], "tip": "판결에서 overrule 뒤에 사건명(Roe, Plessy)이 오면 판례 변경, 법정 대화에서 Objection 뒤에 오면 이의 기각입니다."}, "drama": {"title": "Loving (2016)", "facts": ["2016년 영화. 각본·감독 제프 니컬스, 주연 조엘 에저턴·루스 네가.", "1967년 연방대법원 판결 Loving v. Virginia의 원고 리처드·밀드러드 러빙 부부의 이야기이고, 2011년 다큐멘터리 The Loving Story에서 영감을 받았습니다.", "2016년 칸 영화제 경쟁 부문에 초청되었고, 루스 네가는 아카데미상 후보에 올랐습니다."], "watch": "법정 장면보다 부부의 일상이 중심인 조용한 영화입니다. 그래서 오히려 헌법 소송이 평범한 사람의 삶에서 어떻게 시작되는지가 잘 보입니다. 변호사들이 사건을 '연방대법원까지 갈 수 있다'고 판단하는 장면에서 이 장의 landmark case, unconstitutional, equal protection이 실제 사건의 말로 바뀝니다. 실제 변론 녹음을 Oyez에서 함께 들어 보면 영화와 실제를 비교할 수 있습니다.", "terms": ["landmark case", "equal protection", "due process", "unconstitutional", "oral argument"], "links": [{"label": "Wikipedia — Loving (2016 film)", "url": "https://en.wikipedia.org/wiki/Loving_(2016_film)"}, {"label": "Oyez — Loving v. Virginia (1967. 4. 10. 변론 · 1967. 6. 12. 선고 · 원심 파기)", "url": "https://www.oyez.org/cases/1966/395"}, {"label": "YouTube — 공식 예고편 (Focus Features)", "url": "https://www.youtube.com/watch?v=bQMF5MSohPA"}]}, "quote": {"text": "It is emphatically the province and duty of the judicial department to say what the law is.", "ko": "법이 무엇인지 말하는 것은 분명히 사법부의 영역이자 의무다.", "case": "Marbury v. Madison, 5 U.S. (1 Cranch) 137, 177 (1803)", "decided": "1803. 2. 24. 선고", "gloss": {"emphatically": "단호히, 분명히", "province": "영역, 소관 — '지방'이 아니다", "judicial department": "사법부"}, "why": "미국 헌법에는 법원이 법률의 위헌 여부를 판단할 수 있다는 명문 조항이 없습니다. 마셜 대법원장은 헌법과 충돌하는 법률은 법이 아니고, 둘이 충돌할 때 어느 쪽을 적용할지 정하는 일은 사건을 재판하는 법원의 몫이라는 논리로 위헌법률심사(judicial review)의 기초를 놓았습니다. 정작 이 사건에서 마버리는 임명장을 받지 못했습니다. 법원이 자기 권한을 넓힌 법률 조항(1789년 법원조직법 제13조)을 위헌으로 보아 스스로 관할을 부정했기 때문입니다.", "links": [{"label": "LII — Marbury v. Madison 판결 원문", "url": "https://www.law.cornell.edu/supremecourt/text/5/137"}, {"label": "Wikipedia — Marbury v. Madison", "url": "https://en.wikipedia.org/wiki/Marbury_v._Madison"}]}, "korea": {"title": "법률이 위헌이라고 생각되면, 누가 판단하나", "us": "미국에는 헌법재판소가 없습니다. 연방법원이든 주법원이든 사건을 재판하는 법원이 그 자리에서 법률의 위헌 여부를 판단하고, 위헌이면 그 사건에 적용하지 않습니다(분산형 사법심사). 최종 판단은 상소를 거쳐 연방대법원이 하고, 그 판단은 선례로서 다른 법원을 구속합니다.", "kr": "한국은 판단하는 기관이 따로 있습니다(집중형). 헌법 제107조 제1항은 '법률이 헌법에 위반되는 여부가 재판의 전제가 된 경우에는 법원은 헌법재판소에 제청하여 그 심판에 의하여 재판한다'고 정하고, 제111조 제1항 제1호는 '법원의 제청에 의한 법률의 위헌여부 심판'을 헌법재판소 관장 사항으로 둡니다. 법원은 직권이나 당사자 신청으로 제청하고(헌법재판소법 제41조 제1항), 대법원 외의 법원은 대법원을 거쳐야 합니다(같은 조 제5항). 위헌결정은 법원과 국가기관을 기속하고, 위헌으로 결정된 법률 조항은 결정이 있는 날부터 효력을 잃습니다(같은 법 제47조 제1항·제2항, 형벌 조항은 소급 — 제3항). 반면 명령·규칙·처분의 위헌·위법은 대법원이 최종적으로 심사합니다(헌법 제107조 제2항).", "say": "In Korea, ordinary courts cannot strike down a statute. If a case turns on whether a statute is constitutional, the court refers the question to the Constitutional Court of Korea.", "say_ko": "한국에서는 일반 법원이 법률을 위헌으로 무효화할 수 없습니다. 법률의 위헌 여부가 재판의 전제가 되면, 법원은 그 문제를 헌법재판소에 제청합니다."}}, "quiz": [{"q": "미국 헌법에서 the First Amendment가 가리키는 것은?", "options": ["1차 개헌으로 바뀐 헌법 본문", "헌법 끝에 덧붙은 첫 번째 수정조항", "헌법 제1조(Article I)"], "answer": 1, "why": "미국은 본문을 고치지 않고 수정조항을 덧붙입니다. 헌법 제1조(의회)는 Article I입니다."}, {"q": "연방대법원이 과거 판례를 더는 따르지 않겠다고 선언하는 동사는?", "options": ["reverse", "overrule", "sustain", "remand"], "answer": 1, "why": "reverse는 이 사건의 원심 판결을 파기하는 것, remand는 환송, sustain은 법정에서 이의를 받아들이는 것입니다(→ 5장)."}, {"q": "'The Court denied cert.'의 뜻은?", "options": ["연방대법원이 원심 판결을 확정했다(지지했다)", "연방대법원이 상고허가를 거부했다", "연방대법원이 원심 판결을 파기했다"], "answer": 1, "why": "cert는 certiorari(상고허가). 상고허가를 거부해도 원심 판결에 찬성한다는 뜻은 아닙니다."}, {"q": "문법: 빈칸에 맞는 것은? — The statute violates ____ First Amendment.", "options": ["a", "the", "(관사 없음)"], "answer": 1, "why": "서수로 특정한 조항에는 the. the Constitution, the Court도 같은 원리입니다.", "grammar": "G1"}, {"q": "번역해 보세요: The Court struck down the law as unconstitutional.", "options": ["연방대법원은 그 법률을 합헌으로 유지했다.", "연방대법원은 그 법률을 위헌으로 무효화했다.", "연방대법원은 그 법률의 심리를 거부했다."], "answer": 1, "why": "strike down은 위헌으로 무효화하다. 합헌으로 유지하는 것은 uphold입니다."}]}, {"chapter": {"num": 16, "title": "판결문 읽는 법", "subtitle": "holding, dicta, We affirm", "title_en": "Reading a Judicial Opinion — Holding, Dicta, and \"We Affirm\"", "lead": "미국 판결문은 한국 판결서와 순서가 반대입니다. 한국 판결서는 주문을 먼저 쓰고 이유를 뒤에 붙이지만, 미국 연방대법원 판결은 사건 표시와 판결요지 다음에 긴 이유가 이어지고, 결론(disposition)은 맨 끝 한두 문장에 나옵니다. 이 장은 그 순서대로 판결문 한 편을 따라 읽는 데 필요한 말을 다룹니다.", "can_say": [{"en": "The holding of the case is narrow, and the rest is dicta.", "ko": "이 사건의 판시사항은 좁고, 나머지는 방론입니다."}, {"en": "The judgment of the Court of Appeals was affirmed.", "ko": "항소법원의 판결은 유지되었습니다."}, {"en": "Justice Kagan delivered the opinion of the Court.", "ko": "케이건 대법관이 법정의견을 집필했습니다."}]}, "entries": [{"id": "opinion", "hw": "opinion", "ipa": "əˈpɪn.jən", "stress": "o·**pin**·ion", "stars": 3, "false_friend": true, "gloss": "판결문(판결 이유를 적은 문서), 재판관의 의견", "diff": "일상어로는 '의견'이지만 판결문 맥락에서는 법원이 결론과 이유를 적은 문서 자체를 가리킵니다. the opinion of the Court는 '법원의 견해' 정도가 아니라 구속력 있는 법정의견입니다. 결론만 적은 판결(judgment, → 4장)과 이유를 적은 opinion이 별개 문서라는 점이 한국 판결서와 다릅니다.", "examples": {"easy": {"en": "The opinion is forty pages long.", "ko": "그 판결문은 40쪽이다."}, "practice": {"en": "Judge Han read the opinion twice before the conference.", "ko": "한 판사는 합의 전에 그 판결문을 두 번 읽었다."}, "source": {"en": "This opinion is subject to formal revision before publication in the preliminary print of the United States Reports.", "ko": "이 판결문은 미국 판례집(United States Reports) 예비판에 실리기 전에 형식적 수정을 거칠 수 있다.", "cite": "Kimble v. Marvel Entertainment, LLC, 576 U.S. 446 (2015) — 판결문 첫머리의 NOTICE", "url": "https://www.law.cornell.edu/supremecourt/text/13-720", "glossary": {"formal revision": "형식적 수정(오탈자·인용 표기 등)", "preliminary print": "예비판(정식 합본 전의 소책자)"}}}, "box": "실습 — Kimble v. Marvel(2015) 첫 쪽 해부. LII 판결 페이지를 위에서부터 내려가면 ① 사건 표시(caption): KIMBLE et al. v. MARVEL ENTERTAINMENT, LLC, No. 13-720, 제9순회구 항소법원 판결에 대한 상고허가(certiorari), 변론 2015. 3. 31., 선고 2015. 6. 22. ② 판결요지(syllabus): '판결요지는 법정의견의 일부가 아니다'라는 안내문 뒤에 사실관계와 Held: Stare decisis requires this Court to adhere to Brulotte가 나오고, 원심 표시 727 F. 3d 856, affirmed로 결론을 미리 알려 줍니다. ③ 의견 구성: Kagan, J., delivered the opinion of the Court ... Alito, J., filed a dissenting opinion — 누가 다수의견을 쓰고 누가 가담·반대했는지. ④ 법정의견 본문: 다시 사건 표시를 적은 뒤 Justice Kagan delivered the opinion of the Court로 시작해 I~V부로 이유를 전개합니다. ⑤ 결론(disposition): 맨 끝 두 문장 the judgment of the Court of Appeals is affirmed. It is so ordered. 그 뒤에 반대의견이 이어집니다. 한국 판결서와 비교하면 주문(⑤)이 맨 뒤에 있다는 점이 가장 크게 다릅니다.", "grammar": {"axis": "G1", "title": "the opinion of the Court", "wrong": "Justice Kagan delivered opinion of Court.", "right": "Justice Kagan delivered the opinion of the Court.", "note": "이 사건의 '그' 판결문, '그' 법원이므로 둘 다 the. 연방대법원을 가리키는 Court는 대문자로 씁니다."}, "collocations": ["write / deliver an opinion", "the opinion of the Court (법정의견)", "slip opinion (선고 당일 낱장 판결문)", "unpublished opinion (비공간 판결)"], "links": [{"label": "LII Wex — opinion", "url": "https://www.law.cornell.edu/wex/opinion"}]}, {"id": "syllabus", "hw": "syllabus", "ipa": "ˈsɪl.ə.bəs", "stress": "**syl**·la·bus", "stars": 2, "false_friend": true, "gloss": "판결요지(판결문 앞에 붙는 요약)", "diff": "학교에서는 '강의계획서'입니다. 연방대법원 판결에서는 판결문 앞에 붙는 요약을 뜻하는데, 대법관이 아니라 판례담당관(Reporter of Decisions)이 씁니다. 한국 판례공보의 판시사항·판결요지처럼 편하게 읽을 수 있지만, 법원의 판단 자체는 아니라는 점을 판결문 스스로 밝혀 둡니다.", "examples": {"easy": {"en": "Read the syllabus first.", "ko": "판결요지부터 읽으세요."}, "practice": {"en": "The syllabus is helpful, but always quote the opinion itself.", "ko": "판결요지는 도움이 되지만, 인용은 늘 판결문 본문에서 하세요."}, "source": {"en": "The syllabus constitutes no part of the opinion of the Court but has been prepared by the Reporter of Decisions for the convenience of the reader.", "ko": "판결요지는 법정의견의 일부가 아니며, 독자의 편의를 위해 판례담당관이 작성한 것이다.", "cite": "Kimble v. Marvel Entertainment, LLC, 576 U.S. 446 (2015) — Syllabus 첫머리 안내문(United States v. Detroit Timber & Lumber Co., 200 U.S. 321, 337 인용)", "url": "https://www.law.cornell.edu/supremecourt/text/13-720", "glossary": {"constitute": "구성하다, ~이 되다", "Reporter of Decisions": "판례담당관(연방대법원 판례집 편찬 책임자)"}}}, "box": "이 안내문이 인용하는 1906년 Detroit Timber 판결은 이렇게 말합니다. \"the headnote is not the work of the court, nor does it state its decision\" — 요지(headnote)는 법원의 작품이 아니고 법원의 결정을 진술하지도 않는다. 그래서 미국 법률가는 판결요지를 인용하지 않고 본문을 인용합니다.", "grammar": {"axis": "G2", "title": "syllabus의 복수형", "wrong": "Both syllabus summarize the holding.", "right": "Both syllabi summarize the holding. / Both syllabuses ...", "note": "라틴어식 복수 syllabi와 영어식 syllabuses를 함께 씁니다. 단수 syllabus에 Both를 붙이면 틀립니다(라틴어 복수 → 17장)."}, "collocations": ["the syllabus of the case", "headnote (판례집 요지, 민간 출판사가 붙인 것 포함)", "Held: (요지의 결론 표시)"], "links": [{"label": "LII Wex — headnote", "url": "https://www.law.cornell.edu/wex/headnote"}, {"label": "LII — United States v. Detroit Timber & Lumber Co. 판결 원문", "url": "https://www.law.cornell.edu/supremecourt/text/200/321"}]}, {"id": "caption", "hw": "caption", "ipa": "ˈkæp.ʃən", "stress": "**cap**·tion", "stars": 1, "gloss": "사건 표시(법원명·당사자·사건번호를 적은 머리 부분)", "diff": "사진 밑 설명글이 아니라 서면·판결문 맨 위의 사건 표시입니다. 한국 판결서의 '사건·원고·피고' 표시 부분에 해당합니다.", "examples": {"easy": {"en": "Check the caption for the case number.", "ko": "사건번호는 사건 표시 부분에서 확인하세요."}, "practice": {"en": "The case is captioned Kimble v. Marvel Entertainment, LLC.", "ko": "사건 표시는 Kimble v. Marvel Entertainment, LLC로 되어 있다."}, "source": {"en": "Every pleading must have a caption with the court's name, a title, a file number, and a Rule 7(a) designation.", "ko": "모든 소송 서면에는 법원명, 사건명, 사건번호, 제7조(a)에 따른 서면 종류 표시를 담은 사건 표시가 있어야 한다.", "cite": "Fed. R. Civ. P. 10(a)", "url": "https://www.law.cornell.edu/rules/frcp/rule_10", "glossary": {"pleading": "소송 서면(→ 3장)", "file number": "사건번호", "designation": "(서면 종류의) 표시"}}}, "grammar": {"axis": "G7", "title": "be captioned — 사건명이 ~로 되어 있다", "wrong": "The case captions Kimble v. Marvel.", "right": "The case is captioned Kimble v. Marvel.", "note": "사건이 스스로 이름을 붙이지 않으므로 수동태 is captioned. 명사로는 the caption reads ...라고도 합니다."}, "collocations": ["case caption", "be captioned A v. B", "the caption reads ..."], "links": [{"label": "LII Wex — caption", "url": "https://www.law.cornell.edu/wex/caption"}]}, {"id": "versus", "hw": "v.", "ipa": "viː · ˈvɝː.səs", "stress": "**v.** (vee) · **ver**·sus", "stars": 3, "uk": "잉글랜드의 전통적 법정 낭독 관행에서는 민사 Smith v Jones를 'Smith and Jones'로, 형사 R v Smith를 'the Crown against Smith'로 읽고 'versus'라고는 읽지 않는다고 합니다(2차 자료: Wikipedia — Case citation, Pronunciation of case titles; 영국 법학 입문 블로그 James Thomas 2022). 많은 영연방 국가가 이를 따르지만, 스코틀랜드는 민사 사건도 against로 읽는 등 예외가 있습니다.", "gloss": "대(對) — 사건명에서 원고(상소인)와 피고(피상소인) 사이에 쓴다", "pron_tip": "미국에서는 v.를 그대로 vee라고 읽거나 versus라고 읽습니다. 판결문에서는 마침표를 찍은 v.를 쓰고, vs.는 잘 쓰지 않습니다. Cambridge 사전은 사건명에 쓰는 v(also v.)를 전치사로 싣고 미국 발음을 /viː/로 적습니다.", "diff": "연방대법원 사건명은 대개 상고인(petitioner)이 앞에 옵니다. 그래서 1심의 피고가 앞에 나오는 경우도 있습니다. 한국처럼 사건번호로 부르지 않고 당사자 이름으로 부르는 것이 관행입니다.", "examples": {"easy": {"en": "Have you read Marbury v. Madison?", "ko": "Marbury v. Madison 판결 읽어 봤어요?"}, "practice": {"en": "In Kimble, the Court refused to overrule Brulotte.", "ko": "Kimble 판결에서 연방대법원은 Brulotte 판결을 변경하지 않았다."}, "source": {"en": "In Brulotte v. Thys Co. … this Court held that a patent holder cannot charge royalties for the use of his invention after its patent term has expired.", "ko": "Brulotte v. Thys Co. 판결에서 이 법원은 특허권자가 특허 존속기간이 끝난 뒤의 발명 사용에 대해 실시료를 받을 수 없다고 판시했다.", "cite": "Kimble v. Marvel Entertainment, LLC, 576 U.S. 446 (2015) — 법정의견 첫 문장", "url": "https://www.law.cornell.edu/supremecourt/text/13-720", "glossary": {"royalties": "실시료", "patent term": "특허 존속기간"}}}, "grammar": {"axis": "G1", "title": "사건명은 고유명사 — 관사 없이", "wrong": "In the Brulotte v. Thys, the Court held ...", "right": "In Brulotte v. Thys, the Court held ... / the Brulotte rule", "note": "사건명 자체에는 the를 붙이지 않습니다. 사건명을 형용사처럼 앞에 두고 명사를 꾸미면 the Brulotte rule, the Kimble decision처럼 the가 붙습니다."}, "collocations": ["A v. B", "in Kimble (사건명 줄여 부르기 — 보통 첫 당사자)", "et al. (외)"], "links": [{"label": "Wikipedia — Case citation (Pronunciation of case titles)", "url": "https://en.wikipedia.org/wiki/Case_citation"}, {"label": "James Thomas — How to read a case title (2022, 영국 법학 입문 블로그)", "url": "https://mcdreeamiemusings.com/blog/2022/1/28/what-i-wish-id-known-before-studying-law-1-how-to-read-a-case-title"}, {"label": "LII Wex — v.", "url": "https://www.law.cornell.edu/wex/v."}, {"label": "Cambridge Dictionary — v (also v.), 전치사 AGAINST", "url": "https://dictionary.cambridge.org/dictionary/english/v"}]}, {"id": "holding", "hw": "holding", "ipa": "ˈhoʊl.dɪŋ", "stress": "**hold**·ing", "stars": 3, "gloss": "판시사항(사건 해결에 필요한 법적 판단), 판결의 구속력 있는 부분", "diff": "선례로서 뒤의 법원을 구속하는 것은 holding뿐이고, 나머지 말은 dicta(→ 다음 항목)입니다. 한국 판례공보의 '판시사항'은 편집자가 뽑은 쟁점 목록이라, 구속력의 범위를 가리키는 holding과 꼭 같은 개념은 아닙니다.", "examples": {"easy": {"en": "What is the holding of this case?", "ko": "이 사건의 판시사항은 무엇인가?"}, "practice": {"en": "Counsel, your reading of the holding is too broad.", "ko": "변호인, 판시사항을 너무 넓게 읽고 있습니다."}, "source": {"en": "When an opinion issues for the Court, it is not only the result, but also those portions of the opinion necessary to that result by which we are bound.", "ko": "법정의견이 나오면, 우리를 구속하는 것은 결론만이 아니라 그 결론에 필요한 판결문의 부분들이기도 하다.", "cite": "Seminole Tribe of Fla. v. Florida, 517 U.S. 44, 67 (1996)", "url": "https://www.law.cornell.edu/supct/html/94-12.ZO.html", "glossary": {"issue": "(판결이) 나오다, 선고되다", "be bound by": "~에 구속되다"}}}, "box": "연방대법원 판결요지에는 Held: 라는 표시가 있습니다. Kimble 판결요지는 \"Held : Stare decisis requires this Court to adhere to Brulotte.\"로 시작합니다. 동사 hold(판시하다)의 과거형 held가 곧 holding의 출발점입니다.", "grammar": {"axis": "G2", "title": "holding은 셀 수 있는 명사", "wrong": "The opinion has two holding.", "right": "The opinion has two holdings.", "note": "판단 하나하나가 holding이므로 a holding, holdings로 셉니다. 동사로는 The Court held that ...(판시했다)."}, "collocations": ["The Court held that ...", "a narrow / broad holding", "read the holding narrowly", "extend the holding to ..."], "links": [{"label": "LII Wex — holding", "url": "https://www.law.cornell.edu/wex/holding"}]}, {"id": "dicta", "hw": "dicta · obiter dictum", "ipa": "ˈdɪk.tə · ˌoʊ.bɪ.t̬ɚ ˈdɪk.təm", "stress": "**dic**·ta · **o**·bi·ter **dic**·tum", "stars": 2, "pron_tip": "obiter는 발음 사전(Cambridge US) 미수록이라 미국 법조 관행 발음으로 적었습니다.", "gloss": "방론(판결 결론에 필요하지 않은 언급)", "diff": "obiter dictum은 '지나가며 한 말'이라는 라틴어이고, 줄여서 dictum, 복수는 dicta입니다. 존중은 받지만 뒤의 법원을 구속하지 않습니다. 한국에서도 '방론'이라는 말을 쓰지만, 선례구속 원칙이 없는 한국에서는 holding과 dicta를 가르는 실익이 미국만큼 크지 않습니다.", "examples": {"easy": {"en": "That sentence is just dicta.", "ko": "그 문장은 방론일 뿐이다."}, "practice": {"en": "The prosecutor relied on dicta, not on the holding.", "ko": "검사는 판시사항이 아니라 방론에 기댔다."}, "source": {"en": "we are not bound to follow our dicta in a prior case in which the point now at issue was not fully debated", "ko": "지금 문제 된 논점이 충분히 다투어지지 않았던 앞선 사건에서 우리가 한 방론을 우리가 따라야 할 의무는 없다", "cite": "Central Va. Community College v. Katz, 546 U.S. 356, 363 (2006)", "url": "https://www.law.cornell.edu/supct/html/04-885.ZO.html", "glossary": {"at issue": "쟁점이 된", "fully debated": "충분히 논쟁된(당사자들이 다툰)"}}}, "grammar": {"axis": "G2", "title": "dictum은 단수, dicta는 복수", "wrong": "This is a dicta.", "right": "This is a dictum. / These are dicta.", "note": "라틴어 중성명사의 복수 -a입니다(datum → data와 같다). 실무에서는 dicta를 집합적으로 쓰는 일이 많지만 a dicta는 틀립니다."}, "collocations": ["mere dicta", "obiter dicta", "in dicta (방론에서)", "dicta are not binding"], "links": [{"label": "LII Wex — dicta", "url": "https://www.law.cornell.edu/wex/dicta"}, {"label": "LII Wex — obiter dictum", "url": "https://www.law.cornell.edu/wex/obiter_dictum"}]}, {"id": "ratio-decidendi", "hw": "ratio decidendi", "ipa": "ˌreɪ.ʃi.oʊ ˌdes.ɪˈden.di", "stress": "**ra**·ti·o de·ci·**den**·di", "stars": 1, "pron_tip": "decidendi는 발음 사전(Cambridge US) 미수록이라 미국 법조 관행 발음으로 적었습니다.", "uk": "영국·영연방에서 주로 쓰는 말. 미국에서는 holding이라고 합니다.", "gloss": "판결이유의 핵심(결론을 이끈 법적 근거)", "diff": "영국 판결 강의에서는 ratio(줄여서)와 obiter를 짝으로 가르칩니다. 미국 판결문에서는 거의 쓰지 않고 holding이 같은 자리를 차지합니다. 발음은 사람마다 조금씩 다릅니다.", "examples": {"easy": {"en": "Find the ratio of the case.", "ko": "그 사건의 판결이유 핵심을 찾으세요."}, "practice": {"en": "In English law, only the ratio decidendi binds lower courts.", "ko": "잉글랜드법에서는 판결이유의 핵심만 하급심을 구속한다."}}, "grammar": {"axis": "G1", "title": "the ratio of the case", "wrong": "Ratio of Donoghue v Stevenson is famous.", "right": "The ratio of Donoghue v Stevenson is famous.", "note": "특정 사건의 '그' 핵심이므로 the. 사건명 자체에는 관사를 붙이지 않는 점(→ v. 항목)과 함께 기억하세요."}, "collocations": ["ratio and obiter", "the ratio of the case", "binding ratio"], "links": [{"label": "LII Wex — ratio decidendi", "url": "https://www.law.cornell.edu/wex/ratio_decidendi"}]}, {"id": "reasoning", "hw": "reasoning", "ipa": "ˈriː.zən.ɪŋ", "stress": "**rea**·son·ing", "stars": 2, "gloss": "(판결의) 이유, 논증", "diff": "한국 판결서의 '이유'는 문서의 한 부분 이름이지만, reasoning은 결론에 이르는 논리 그 자체를 말합니다. 판결문의 부분 이름으로는 opinion이 이유 전체를 담습니다.", "examples": {"easy": {"en": "I agree with the reasoning.", "ko": "그 논증에 동의한다."}, "practice": {"en": "The dissent attacked the majority's reasoning, not its result.", "ko": "반대의견은 다수의견의 결론이 아니라 논증을 공격했다."}, "source": {"en": "Kimble's reasoning may give Congress cause to upset Brulotte … but does not warrant this Court's doing so.", "ko": "Kimble의 논증은 의회가 Brulotte 판결을 뒤집을 이유는 될 수 있어도, 이 법원이 그렇게 할 근거는 되지 못한다.", "cite": "Kimble v. Marvel Entertainment, LLC, 576 U.S. 446 (2015)", "url": "https://www.law.cornell.edu/supremecourt/text/13-720", "glossary": {"upset": "(판례를) 뒤집다", "warrant": "정당화하다"}}}, "grammar": {"axis": "G3", "title": "reasoning은 셀 수 없다", "wrong": "The Court gave three reasonings.", "right": "The Court gave three reasons. / The Court's reasoning was ...", "note": "논증 전체를 뜻하는 reasoning은 a도 복수도 쓰지 않습니다. 셀 때는 reasons(이유 하나하나)를 씁니다."}, "collocations": ["the Court's reasoning", "the same reasoning applies", "flawed / persuasive reasoning", "line of reasoning"]}, {"id": "per-curiam", "hw": "per curiam", "ipa": "ˌpɝː ˈkjʊr.i.æm", "stress": "per **cu**·ri·am", "stars": 1, "pron_tip": "curiam은 발음 사전(Cambridge US) 미수록이라 미국 법조 관행 발음으로 적었습니다.", "gloss": "법원 명의의 판결(집필 법관 이름 없이 나오는 판결)", "diff": "라틴어로 '법원에 의하여'입니다. 집필자 이름 없이 법원 전체 명의로 내는 짧은 판결에 많이 씁니다. 한국 판결서는 원래 개별 집필자를 표시하지 않으므로, 이 구분 자체가 미국식입니다.", "examples": {"easy": {"en": "The decision was per curiam.", "ko": "그 판결은 법원 명의로 나왔다."}, "practice": {"en": "The court of appeals affirmed in a short per curiam opinion.", "ko": "항소법원은 짧은 법원 명의 판결로 원심판결을 유지했다."}, "source": {"en": "The Federal Circuit granted rehearing en banc, vacated the panel opinion, and affirmed the judgment of the District Court in a one-paragraph per curiam opinion.", "ko": "연방순회항소법원은 전원합의체 재심리를 받아들여 합의부 판결을 취소하고, 한 문단짜리 법원 명의 판결로 지방법원 판결을 유지했다.", "cite": "Alice Corp. v. CLS Bank Int'l, 573 U.S. 208 (2014)", "url": "https://www.law.cornell.edu/supremecourt/text/13-298", "glossary": {"rehearing en banc": "전원합의체 재심리(→ 2장)", "vacate": "취소하다(→ 4장)"}}}, "grammar": {"axis": "G7", "title": "be decided per curiam", "wrong": "The case decided per curiam.", "right": "The case was decided per curiam.", "note": "사건은 '결정되는' 대상이므로 수동태. per curiam은 부사처럼 동사 뒤에, 형용사처럼 opinion 앞에 모두 씁니다."}, "collocations": ["a per curiam opinion", "decided per curiam", "summary per curiam reversal"], "links": [{"label": "LII Wex — per curiam", "url": "https://www.law.cornell.edu/wex/per_curiam"}]}, {"id": "so-ordered", "hw": "It is so ordered.", "ipa": "ɪt ɪz soʊ ˈɔːr.dɚd", "stress": "it is **so** **or**·dered", "stars": 2, "gloss": "이와 같이 명한다(판결 맨 끝의 정형 문구)", "diff": "연방대법원 법정의견은 결론 문장 바로 다음에 이 한 줄로 끝납니다. 한국 판결서에서 주문이 맨 앞에 오는 것과 달리 결론이 맨 뒤에 있다는 표시이기도 합니다.", "examples": {"easy": {"en": "The opinion ends with \"It is so ordered.\"", "ko": "그 판결문은 \"이와 같이 명한다\"로 끝난다."}, "practice": {"en": "The motion is granted. It is so ordered.", "ko": "신청을 인용한다. 이와 같이 명한다."}, "source": {"en": "For the reasons stated, the judgment of the Court of Appeals is affirmed. It is so ordered.", "ko": "위와 같은 이유로 항소법원의 판결을 유지한다. 이와 같이 명한다.", "cite": "Kimble v. Marvel Entertainment, LLC, 576 U.S. 446 (2015) — 법정의견 마지막 두 문장", "url": "https://www.law.cornell.edu/supremecourt/text/13-720", "glossary": {"for the reasons stated": "위에서 말한 이유로", "is affirmed": "유지된다(원판결 유지)"}}}, "grammar": {"axis": "G7", "title": "결론 문장은 수동태 현재형", "wrong": "The judgment of the Court of Appeals affirms.", "right": "The judgment of the Court of Appeals is affirmed.", "note": "판결은 '유지되거나 파기되는' 대상이므로 is affirmed / is reversed. 선고와 동시에 효력이 생긴다는 뜻으로 현재형을 씁니다."}, "collocations": ["It is so ordered.", "SO ORDERED. (하급심 명령문 끝)", "the judgment is affirmed / reversed"]}, {"id": "we-affirm", "hw": "We affirm. · We reverse and remand.", "ipa": "wiː əˈfɝːm · wiː rɪˈvɝːs ənd rɪˈmænd", "stress": "we af·**firm** · we re·**verse** and re·**mand**", "stars": 3, "gloss": "원심판결을 유지한다 · 원심판결을 파기하고 환송한다(결론 정형 문구)", "diff": "affirm·reverse·remand 각각의 뜻은 4장에서 다뤘습니다. 판결문에서는 이 동사들이 'we + 현재형'의 짧은 문장으로 결론을 선언합니다. 한국 대법원 판결의 '상고를 기각한다', '원심판결을 파기하고, 사건을 ○○법원에 환송한다'에 대응하지만, 1:1은 아닙니다. 미국 상급법원은 판결(judgment)을 affirm하고, 한국 상고심은 상고를 기각합니다.", "examples": {"easy": {"en": "We affirm.", "ko": "원심판결을 유지한다."}, "practice": {"en": "We reverse and remand for further proceedings.", "ko": "원심을 파기하고, 추가 심리를 위해 사건을 환송한다."}, "source": {"en": "Because inter partes review does not violate Article III or the Seventh Amendment … we affirm the judgment of the Court of Appeals.", "ko": "당사자계 재심사는 헌법 제3조나 수정헌법 제7조에 위반되지 않으므로, 우리는 항소법원의 판결을 유지한다.", "cite": "Oil States Energy Services, LLC v. Greene's Energy Group, LLC, 584 U.S. 325 (2018) — 법정의견 마지막 문장", "url": "https://www.law.cornell.edu/supremecourt/text/16-712", "glossary": {"inter partes review": "(특허) 당사자계 재심사", "Article III": "연방헌법 제3조(사법권)"}}}, "box": "결론 문장의 모양은 판결마다 조금씩 다릅니다. eBay v. MercExchange(2006)는 \"we vacate the judgment of the Court of Appeals, and remand for further proceedings consistent with this opinion\"으로, Twombly(2007)는 \"is reversed, and the cause is remanded for further proceedings consistent with this opinion\"처럼 수동태로 끝납니다. 능동(we affirm)이든 수동(is affirmed)이든 뜻은 같습니다.", "grammar": {"axis": "G7", "title": "능동 we affirm ↔ 수동 is affirmed", "wrong": "The judgment is affirm.", "right": "We affirm the judgment. / The judgment is affirmed.", "note": "능동이면 주어가 we(법원), 수동이면 주어가 judgment. 수동태에서는 반드시 과거분사(affirmed·reversed·remanded)를 씁니다."}, "collocations": ["affirm in part and reverse in part", "remand for further proceedings", "consistent with this opinion", "vacate and remand"], "links": [{"label": "LII Wex — affirm", "url": "https://www.law.cornell.edu/wex/affirm"}, {"label": "LII Wex — remand", "url": "https://www.law.cornell.edu/wex/remand"}, {"label": "LII Wex — disposition", "url": "https://www.law.cornell.edu/wex/disposition"}]}, {"id": "citation", "hw": "citation · cite", "ipa": "saɪˈteɪ.ʃən · saɪt", "stress": "ci·**ta**·tion · **cite**", "stars": 2, "gloss": "인용(인용 표기) · 인용하다", "pron_tip": "cite는 sight·site와 소리가 같습니다.", "diff": "citation에는 '교통 위반 딱지·소환장'이라는 뜻도 있습니다. 판결문 맥락에서는 선례·법령의 인용 표기를 가리킵니다.", "examples": {"easy": {"en": "Please add a citation here.", "ko": "여기에 인용 표기를 넣어 주세요."}, "practice": {"en": "The brief cites Kimble for the role of stare decisis.", "ko": "그 준비서면은 선례구속의 역할에 관해 Kimble 판결을 인용한다."}, "source": {"en": "But Nagler gave no explanation for citing Theatre Enterprises", "ko": "그러나 Nagler 판결은 Theatre Enterprises 판결을 인용한 이유를 전혀 설명하지 않았다", "cite": "Bell Atlantic Corp. v. Twombly, 550 U.S. 544 (2007)", "url": "https://www.law.cornell.edu/supct/html/05-1126.ZO.html", "glossary": {"give no explanation for": "~에 대해 설명하지 않다"}}}, "grammar": {"axis": "G4", "title": "cite A for B — B라는 명제의 근거로 A를 인용하다", "wrong": "The brief cites Kimble about stare decisis.", "right": "The brief cites Kimble for the role of stare decisis.", "note": "인용하는 이유(명제)는 for로 잇습니다. cite A as authority(A를 근거로 인용하다)도 자주 씁니다."}, "collocations": ["cite A for the proposition that ...", "(citation omitted) (인용 생략)", "pin cite (쪽 번호까지 적는 인용)", "cite as authority"], "links": [{"label": "LII Wex — citation", "url": "https://www.law.cornell.edu/wex/citation"}]}, {"id": "reporters", "hw": "U.S. · F.3d · F. Supp.", "ipa": "ˌjuːˈes · ˌef ˈθɝːd · ˌef ˈsʌp", "stress": "**U**.**S**. · **F**.**3d** · **F**. **Supp**.", "stars": 2, "false_friend": true, "gloss": "판례집 약어 — 연방대법원(United States Reports) · 연방항소법원(Federal Reporter, 제3시리즈 F.3d) · 연방지방법원(Federal Supplement)", "pron_tip": "소리 내어 읽을 때는 379 U.S. 29를 'three seventy-nine U.S. twenty-nine', 727 F.3d 856을 'seven twenty-seven F third eight fifty-six'처럼 읽습니다. Supp.은 발음 사전(Cambridge US) 미수록이라 미국 법조 관행 발음으로 적었습니다.", "diff": "여기서 reporter는 기자가 아니라 판례집입니다. 법정 속기사 court reporter(→ 2장), 판례담당관 Reporter of Decisions와 함께 세 뜻을 구별하세요. 인용은 '권 번호 + 판례집 약어 + 시작 쪽'의 순서입니다. 한국처럼 법원과 선고일·사건번호로 특정하지 않습니다.", "examples": {"easy": {"en": "The case is reported at 379 U.S. 29.", "ko": "그 사건은 미국 판례집 379권 29쪽에 실려 있다."}, "practice": {"en": "Look it up in F. Supp. 2d, not in F.3d.", "ko": "F.3d(항소법원)가 아니라 F. Supp. 2d(지방법원)에서 찾아보세요."}, "source": {"en": "692 F. Supp. 2d 1156, 1161 (Ariz. 2010). The Court of Appeals for the Ninth Circuit affirmed", "ko": "연방지방법원 판례집 제2시리즈(F. Supp. 2d) 692권 1156쪽(인용 쪽 1161, 애리조나 지방법원 2010년). 제9순회구 항소법원은 이를 유지했다", "cite": "Kimble v. Marvel Entertainment, LLC, 576 U.S. 446 (2015)", "url": "https://www.law.cornell.edu/supremecourt/text/13-720", "glossary": {"1161": "실제로 인용하는 쪽(pin cite)", "(Ariz. 2010)": "선고 법원(애리조나 연방지방법원)과 연도"}}}, "grammar": {"axis": "G1", "title": "the United States Reports", "wrong": "It was published in United States Reports.", "right": "It was published in the United States Reports.", "note": "복수형 고유명사인 간행물 이름에는 the를 붙입니다(the Federal Reporter도 같다). 약어 U.S.로 쓸 때는 관사를 쓰지 않습니다."}, "collocations": ["be reported at 576 U.S. 446", "official reporter (공식 판례집)", "slip op. (판례집 수록 전 판결문)", "pin cite"]}, {"id": "id-supra", "hw": "Id. · supra · infra", "ipa": "ɪd · ˈsuː.prə · ˈɪn.frə", "stress": "**Id**. · **su**·pra · **in**·fra", "stars": 2, "gloss": "같은 곳(바로 앞 인용과 같은 자료) · 앞에서 · 뒤에서", "pron_tip": "Id.는 idem의 약자로, 소리 내어 읽을 때는 보통 /ɪd/(id)라고 합니다. 글자로는 이탤릭으로 씁니다. infra는 발음 사전(Cambridge US) 미수록이라 미국 법조 관행 발음으로 적었습니다.", "diff": "Id.는 '바로 앞의 인용과 같은 자료', supra는 '앞에서 이미 인용한 자료', infra는 '뒤에 나올 부분'입니다. 한국 논문의 '위의 글'·'앞의 책'과 쓰임이 비슷하지만, 미국 판결문에서는 같은 쪽 안에서도 줄곧 씁니다.", "examples": {"easy": {"en": "Id. means the same source as before.", "ko": "Id.는 바로 앞과 같은 출처라는 뜻이다."}, "practice": {"en": "See supra, at 3; see also Appendix A, infra.", "ko": "앞의 3쪽 참조. 아울러 뒤의 부록 A도 참조."}, "source": {"en": "Id., at 256 … See supra, at 3–4", "ko": "같은 판결(바로 앞에 인용한 Scott Paper 판결) 256쪽 … 앞의 3–4쪽 참조", "cite": "Kimble v. Marvel Entertainment, LLC, 576 U.S. 446 (2015) — 여기서 Id.는 바로 앞에 인용된 Scott Paper Co. v. Marcalus Mfg. Co., 326 U.S. 249 (1945)를 받는다", "url": "https://www.law.cornell.edu/supremecourt/text/13-720", "glossary": {"at": "(쪽 번호 앞) ~면에"}}}, "grammar": {"axis": "G4", "title": "쪽 번호 앞의 at", "wrong": "Id., in 256.", "right": "Id., at 256.", "note": "인용에서 특정 쪽을 가리킬 때는 at을 씁니다. 연방대법원 판결문은 Id., at 256처럼 쉼표를 찍습니다(인용 양식에 따라 쉼표 없이 쓰기도 합니다)."}, "collocations": ["Id., at 256", "supra note 10", "infra Part III", "Ibid. (같은 자료, 같은 쪽)"], "links": [{"label": "LII Wex — supra", "url": "https://www.law.cornell.edu/wex/supra"}, {"label": "LII Wex — infra", "url": "https://www.law.cornell.edu/wex/infra"}]}, {"id": "signals", "hw": "cf. · see also · but see", "ipa": "ˌsiːˈef · siː ˈɑːl.soʊ · bʌt siː", "stress": "**cf**. · see **al**·so · but **see**", "stars": 1, "gloss": "인용 신호 — 비교하라 · 아울러 참조 · 반대 취지 참조", "diff": "인용 앞에 붙어 '이 자료가 본문 주장과 어떤 관계인가'를 알리는 말입니다(signal). LII Wex는 cf.를 '다른 주장이지만 비교해 볼 만한 자료'로 설명합니다. see also는 추가로 뒷받침하는 자료, but see는 반대 취지 자료입니다. 순서와 세부 규칙은 Bluebook을 따르는데, 이 책에서는 정의만 다룹니다.", "examples": {"easy": {"en": "Cf. means \"compare.\"", "ko": "Cf.는 '비교하라'는 뜻이다."}, "practice": {"en": "See Kimble, 576 U.S. 446; but see the dissent.", "ko": "Kimble 판결 참조. 다만 반대의견은 반대 취지."}, "source": {"en": "Cf. S. Lee and S. Ditko, Amazing Fantasy No. 15: \"Spider-Man,\" p. 13 (1962)", "ko": "비교: 스탠 리·스티브 딧코, 『어메이징 판타지』 제15호 「스파이더맨」 13쪽(1962)", "cite": "Kimble v. Marvel Entertainment, LLC, 576 U.S. 446 (2015) — LII slip opinion 판 기준(정식 판례집 수록본 576 U.S. 465는 만화 인용 문구·면수가 일부 다름)", "url": "https://www.law.cornell.edu/supremecourt/text/13-720", "glossary": {"Cf.": "라틴어 confer(비교하라)의 약자"}}}, "box": "Kimble 사건은 스파이더맨 장난감 특허를 둘러싼 분쟁이었습니다. 케이건 대법관은 선례를 변경할 권한은 아껴 써야 한다고 말한 뒤 Cf. 신호로 만화 원작의 '큰 힘에는 큰 책임이 따른다'를 인용했습니다. 인용 신호가 판결문의 농담에도 쓰인다는 사례입니다.", "grammar": {"axis": "G4", "title": "compare A with B", "wrong": "Compare this case to compare that case.", "right": "Compare this case with that one.", "note": "cf.의 뜻 compare는 with(또는 to)로 비교 대상을 잇습니다. 문장 안에서 cf.를 쓰면 'compare' 한 단어로 읽습니다."}, "collocations": ["Cf. (비교)", "See also (아울러 참조)", "But see (반대 취지)", "See, e.g., (예컨대 참조)"], "links": [{"label": "LII Wex — cf.", "url": "https://www.law.cornell.edu/wex/cf."}, {"label": "LII Wex — signal", "url": "https://www.law.cornell.edu/wex/signal"}]}, {"id": "footnote", "hw": "footnote", "ipa": "ˈfʊt.noʊt", "stress": "**foot**·note", "stars": 1, "gloss": "각주", "diff": "미국 판결문의 각주에는 인용만이 아니라 실질 논증이 들어가기도 합니다. 그래서 판결을 읽을 때 각주를 건너뛰면 안 됩니다.", "examples": {"easy": {"en": "Read footnote 3 carefully.", "ko": "각주 3을 꼼꼼히 읽으세요."}, "practice": {"en": "The judge answered the dissent in a footnote.", "ko": "그 판사는 반대의견에 대한 답을 각주에 적었다."}}, "grammar": {"axis": "G1", "title": "번호가 붙으면 관사 없이", "wrong": "See the footnote 3.", "right": "See footnote 3. / See the footnote below.", "note": "footnote 3, page 10, Rule 56처럼 번호가 이름 구실을 하면 관사를 쓰지 않습니다. 번호 없이 가리키면 the footnote."}, "collocations": ["in footnote 3 / in n. 3", "(footnote omitted) (각주 생략)", "drop a footnote (각주를 달다)"]}, {"id": "concur-judgment", "hw": "concur in the judgment", "ipa": "kənˈkɝː ɪn ðə ˈdʒʌdʒ.mənt", "stress": "con·**cur** in the **judg**·ment", "stars": 1, "gloss": "결론에만 찬성하다(이유는 달리하다)", "diff": "다수의견에 가담하면서 덧붙이는 보충의견(concurring opinion, → 15장)과 달리, 결론에는 찬성하되 다수의견의 이유에는 가담하지 않는다는 뜻입니다. 한국 대법원 판결의 '별개의견'에 가깝지만, 별개의견의 범위가 꼭 같지는 않습니다.", "examples": {"easy": {"en": "She concurred in the judgment only.", "ko": "그녀는 결론에만 찬성했다."}, "practice": {"en": "Two justices concurred in the judgment but rejected the majority's test.", "ko": "대법관 두 명은 결론에는 찬성했지만 다수의견의 판단기준은 거부했다."}, "source": {"en": "Stevens, J., filed an opinion concurring in the judgment, in which Ginsburg, Breyer, and Sotomayor, JJ., joined.", "ko": "스티븐스 대법관이 결론에만 찬성하는 의견을 냈고, 긴즈버그·브라이어·소토마요르 대법관이 이에 가담했다.", "cite": "Bilski v. Kappos, 561 U.S. 593 (2010) — 판결요지 끝의 의견 구성 표시", "url": "https://www.law.cornell.edu/supct/html/08-964.ZS.html", "glossary": {"J.": "Justice(대법관)", "JJ.": "Justices(대법관들)", "join": "(의견에) 가담하다"}}}, "grammar": {"axis": "G4", "title": "concur in (사항) / concur with (사람)", "wrong": "Justice Stevens concurred with the judgment.", "right": "Justice Stevens concurred in the judgment.", "note": "찬성하는 대상이 결론·판결이면 in, 사람·의견이면 with(I concur with Justice Kagan)를 주로 씁니다."}, "collocations": ["concurring in the judgment", "concurring in part and dissenting in part", "join the opinion in full"], "links": [{"label": "LII Wex — concurring opinion", "url": "https://www.law.cornell.edu/wex/concurring_opinion"}]}, {"id": "delivered", "hw": "Justice Kennedy delivered the opinion of the Court.", "ipa": "ˈdʒʌs.tɪs ˈken.ə.di dɪˈlɪv.ɚd ðiː əˈpɪn.jən əv ðə kɔːrt", "stress": "**Jus**·tice **Ken**·ne·dy de·**liv**·ered the o·**pin**·ion of the **Court**", "stars": 2, "gloss": "케네디 대법관이 법정의견을 집필·선고했다(집필 대법관 표시)", "diff": "법정의견 맨 앞에 붙는 정형 문구로, 다수의견을 쓴 대법관을 밝힙니다. 판결요지 끝에는 Kennedy, J., delivered the opinion of the Court처럼 줄여서 쓰고, 누가 가담했고 누가 반대의견을 냈는지도 함께 적습니다.", "examples": {"easy": {"en": "Who delivered the opinion?", "ko": "누가 법정의견을 집필했나요?"}, "practice": {"en": "Justice Kennedy delivered the opinion of the Court, and four justices dissented.", "ko": "케네디 대법관이 법정의견을 집필했고, 대법관 네 명은 반대했다."}, "source": {"en": "Justice Kennedy delivered the opinion of the Court. The Constitution promises liberty to all within its reach", "ko": "케네디 대법관이 법정의견을 집필했다. 헌법은 그 미치는 범위 안의 모든 사람에게 자유를 약속한다", "cite": "Obergefell v. Hodges, 576 U.S. 644 (2015) — 법정의견 첫머리", "url": "https://www.law.cornell.edu/supremecourt/text/14-556", "glossary": {"within its reach": "그 효력이 미치는 범위 안에"}}}, "grammar": {"axis": "G6", "title": "deliver an opinion — 판결문은 deliver한다", "wrong": "Justice Kennedy said the opinion of the Court.", "right": "Justice Kennedy delivered the opinion of the Court.", "note": "법정의견을 '집필·선고하다'는 deliver. 소수의견은 file(filed a dissenting opinion), 의견을 쓰다는 write an opinion."}, "collocations": ["deliver the opinion of the Court", "file a dissenting opinion", "join an opinion", "announce the judgment of the Court (다수 의견이 없을 때)"]}], "corners": {"false_friend": {"title": "opinion은 '의견'이 아니다", "body": ["the opinion of the Court를 '법원의 의견'으로 옮기면 가벼운 견해처럼 들립니다. 실제로는 선례로서 뒤의 법원을 구속하는 법정의견이고, 문서로는 판결문 그 자체입니다.", "reporter도 함정입니다. 2장의 court reporter는 법정 속기사, 판례집 이름의 Reporter(Federal Reporter)는 판례집, Reporter of Decisions는 판결요지를 쓰는 판례담당관입니다. 셋 다 기자가 아닙니다."], "table": [["opinion", "의견", "판결문, 법정의견"], ["syllabus", "강의계획서", "판결요지"], ["reporter", "기자", "판례집 / 판례담당관 (court reporter는 속기사)"], ["holding", "보유(지분 보유)", "판시사항"], ["caption", "자막, 사진 설명", "사건 표시"], ["citation", "교통위반 딱지, 표창", "인용 표기"]], "tip": "판결문에서 opinion·holding이 나오면 일상 뜻을 일단 지우고 읽으세요."}, "drama": {"title": "On the Basis of Sex (2018)", "facts": ["2018년 미국 영화. 감독 미미 레더, 각본 대니얼 스티플먼(긴즈버그의 실제 조카), 주연 펠리시티 존스(루스 베이더 긴즈버그 역)·아미 해머(마틴 긴즈버그 역). 포커스 피처스 배급.", "훗날 연방대법관이 되는 루스 베이더 긴즈버그의 하버드 로스쿨 시절과 초기 사건을 그립니다. 중심 사건은 남편 마틴과 함께 맡은 조세 사건 Moritz v. Commissioner입니다.", "결혼한 적 없는 남성 찰스 모리츠가 어머니 간병인 비용을 공제받지 못하자 긴즈버그 부부가 제10연방항소법원에 항소했습니다. 법원은 1972. 11. 22. 만장일치로 조세법원 판결을 뒤집었고, 그 판결이 Moritz v. Commissioner, 469 F.2d 466 (10th Cir. 1972)입니다."], "watch": "판결문을 읽고 쓰는 일이 영화의 뼈대입니다. 법학도 루스는 선례를 들어(citing precedent) 학장에게 청원하고, 모리츠 사건에서는 항소이유서(brief)를 써서 ACLU를 설득합니다. 정부 측 변호사가 컴퓨터 검색으로 연방법전에서 성별을 구분하는 조항을 모두 찾아내는 장면은 법률 검색의 원형이고, 후반부 구두변론(oral argument)에서는 판사가 질문을 던지고 루스가 답합니다. 끝 자막이 알리는 '항소법원이 조세법원 판결을 뒤집었다'가 이 장의 We reverse이고, 실제 판결은 Reed v. Reed를 인용(cite)해 성별 구분을 무효로 보았습니다. 사건명·판결집 권·쪽·법원·연도로 이루어진 469 F.2d 466 (10th Cir. 1972)를 이 장의 인용 표기법으로 읽어 보세요.", "terms": ["cite / citing precedent", "brief", "oral argument", "reverse (→ We reverse.)", "F.2d (연방항소법원 판결집)"], "links": [{"label": "Wikipedia — On the Basis of Sex", "url": "https://en.wikipedia.org/wiki/On_the_Basis_of_Sex"}, {"label": "Wikipedia — Moritz v. Commissioner", "url": "https://en.wikipedia.org/wiki/Moritz_v._Commissioner"}, {"label": "YouTube — 공식 예고편 (Focus Features)", "url": "https://www.youtube.com/watch?v=28dHbIR_NB4"}]}, "quote": {"text": "It is a maxim not to be disregarded, that general expressions, in every opinion, are to be taken in connection with the case in which those expressions are used.", "ko": "모든 판결문의 일반적 표현은 그 표현이 쓰인 사건과 연관 지어 이해해야 한다는 것은 가볍게 여겨서는 안 될 준칙이다.", "case": "Cohens v. Virginia, 19 U.S. (6 Wheat.) 264, 399 (1821)", "decided": "1821. 3. 3. 선고", "gloss": {"maxim": "준칙, 격언", "disregard": "무시하다", "in connection with": "~와 연관 지어"}, "why": "마셜 대법원장은 바로 이어서 '사건을 넘어서는 말은 존중받을 수 있으나, 그 논점이 정면으로 문제 된 뒤의 사건에서 판결을 지배해서는 안 된다'고 덧붙입니다. holding과 dicta를 가르는 고전적 근거로, 185년 뒤 Central Va. Community College v. Katz(2006)도 이 대목을 인용해 '우리의 방론에 구속되지 않는다'고 했습니다. 판결문의 한 문장을 떼어 일반 명제로 쓰기 전에 그 사건의 사실부터 보라는 말입니다.", "links": [{"label": "LII — Cohens v. Virginia 판결 원문", "url": "https://www.law.cornell.edu/supremecourt/text/19/264"}, {"label": "LII — Central Va. Community College v. Katz 판결 원문", "url": "https://www.law.cornell.edu/supct/html/04-885.ZO.html"}]}, "korea": {"title": "주문이 먼저냐, 이유가 먼저냐", "us": "미국 연방대법원 판결은 사건 표시 → 판결요지 → 법정의견(이유) → 결론(It is so ordered) 순서이고, 다수의견 뒤에 보충·반대의견이 각자 이름을 걸고 붙습니다. 판결(judgment)과 이유를 적은 opinion이 별개 문서라는 점도 다릅니다.", "kr": "한국 민사소송법 제208조 제1항은 판결서에 당사자와 법정대리인, 주문, 청구의 취지 및 상소의 취지, 이유, 변론을 종결한 날짜, 법원을 적고 판결한 법관이 서명날인하도록 정합니다. 실무상 주문이 이유보다 앞에 오고, 같은 조 제2항은 이유에 '주문이 정당하다는 것을 인정할 수 있을 정도로' 판단을 표시하라고 합니다. 소수의견은 법원조직법 제15조가 대법원 재판서에만 '합의에 관여한 모든 대법관의 의견을 표시'하도록 정하고 있어, 하급심 판결서에는 나오지 않습니다.", "say": "In a Korean judgment, the disposition comes first and the reasons follow. Only the Supreme Court of Korea must state the opinion of every Justice who took part in the decision.", "say_ko": "한국 판결서에서는 주문이 먼저 나오고 이유가 뒤따릅니다. 합의에 관여한 모든 대법관의 의견을 표시해야 하는 것은 대법원뿐입니다."}}, "quiz": [{"q": "미국 판결문에서 'the opinion of the Court'의 뜻으로 가장 알맞은 것은?", "options": ["법원의 개인적 견해", "법정의견(구속력 있는 판결 이유)", "법원에 대한 여론"], "answer": 1, "why": "opinion은 판결문 맥락에서 법원이 결론과 이유를 적은 문서입니다. 법정의견은 선례로서 구속력을 가집니다."}, {"q": "판결요지(syllabus)에 대해 맞는 설명은?", "options": ["대법관이 직접 쓴 판결의 일부다", "판례담당관이 독자의 편의를 위해 쓴 것으로, 법정의견의 일부가 아니다", "하급심 판결의 요약이다"], "answer": 1, "why": "판결 페이지의 안내문: \"The syllabus constitutes no part of the opinion of the Court but has been prepared by the Reporter of Decisions for the convenience of the reader.\""}, {"q": "뒤의 법원을 구속하지 않는, 판결 결론에 필요 없는 언급은?", "options": ["holding", "dicta", "disposition", "caption"], "answer": 1, "why": "dicta(단수 dictum)는 방론입니다. 구속력이 있는 것은 holding입니다."}, {"q": "문법: 빈칸에 맞는 것은? — The judgment of the Court of Appeals is ____. It is so ordered.", "options": ["affirm", "affirms", "affirmed", "affirming"], "answer": 2, "why": "판결은 유지되는 대상이므로 수동태 be + 과거분사(is affirmed). 능동으로 쓰면 We affirm the judgment.", "grammar": "G7"}, {"q": "번역해 보세요: We reverse and remand for further proceedings.", "options": ["원심판결을 유지하고 추가 심리를 명한다.", "원심을 파기하고, 추가 심리를 위해 사건을 환송한다.", "상고를 기각하고 소송비용은 상고인이 부담한다."], "answer": 1, "why": "reverse = 파기, remand = 환송. affirm(원판결 유지)과 짝을 이루는 정형 결론 문구입니다(→ 4장)."}]}, {"chapter": {"num": 17, "title": "라틴어 법률 표현", "subtitle": "", "title_en": "Latin in the Law — Bona Fide to Voir Dire", "lead": "미국 법정의 라틴어는 고전 라틴어 발음이 아니라 영어식으로 읽습니다. voir dire처럼 프랑스어에서 온 말도 섞여 있습니다. 이 장은 판결문과 법정에서 자주 나오는 라틴어 표현을 뜻과 함께 미국 법조인이 실제로 읽는 소리로 익힙니다. 앞 장에서 만난 라틴어(stare decisis·res judicata 등)는 장 끝 퀴즈에서 복습합니다.", "can_say": [{"en": "The plaintiff made a prima facie case of discrimination.", "ko": "원고는 차별에 관한 일응의 증명을 했습니다."}, {"en": "The court raised the issue sua sponte.", "ko": "법원은 그 쟁점을 직권으로 제기했습니다."}, {"en": "The judge reviewed the documents in camera.", "ko": "판사는 그 문서를 비공개로(판사실에서) 검토했습니다."}]}, "entries": [{"id": "bona-fide", "hw": "bona fide", "ipa": "ˌboʊ.nə ˈfaɪ.di", "stress": "bo·na **fi**·de", "stars": 3, "gloss": "선의의, 진정한(속임 없는)", "pron_tip": "Cambridge US 표기는 끝의 e까지 읽는 /ˈfaɪ.di/입니다. e를 빼고 /ˈfaɪd/로 읽는 소리도 Cambridge US에 함께 실려 있습니다.", "diff": "한국 민법의 '선의'는 '어떤 사정을 모름'이라는 좁은 기술 용어입니다. bona fide는 '속임 없는, 진짜인'이라는 뜻까지 넓게 써서 bona fide offer(진지한 제안), bona fide intention(진정한 의사)이라고도 합니다. bona fide purchaser(선의의 매수인)는 → 10장.", "examples": {"easy": {"en": "Is this a bona fide offer?", "ko": "이것이 진지한 제안입니까?"}, "practice": {"en": "The buyer was a bona fide purchaser who knew nothing about the fraud.", "ko": "매수인은 사기에 관해 아무것도 몰랐던 선의의 매수인이었다."}, "source": {"en": "A person who has a bona fide intention, under circumstances showing the good faith of such person, to use a trademark in commerce may request registration of its trademark on the principal register", "ko": "그 사람의 성실함을 보여 주는 사정 아래에서 상표를 거래에 사용할 진정한 의사를 가진 사람은 그 상표를 주등록부에 등록해 달라고 신청할 수 있다", "cite": "15 U.S.C. § 1051(b)(1) — 사용 의사(intent-to-use)에 의한 상표 출원", "url": "https://www.law.cornell.edu/uscode/text/15/1051", "glossary": {"good faith": "선의, 성실(bona fide의 영어 번역어)", "in commerce": "(연방이 규율하는) 거래에서", "principal register": "주등록부"}}}, "box": "미국 상표법은 실제로 쓰고 있는 상표를 등록해 주는 사용주의가 기본입니다. 이 조항은 아직 쓰기 전이라도 '진정한 사용 의사'가 있으면 출원할 수 있게 합니다. bona fide가 그 의사가 진짜인지 거르는 문턱입니다.", "grammar": {"axis": "G1", "title": "bona fide는 명사 앞, 관사는 그 앞에", "wrong": "He made an offer bona fide.", "right": "He made a bona fide offer.", "note": "형용사로 명사 바로 앞에 두고, 관사는 bona fide 앞에 씁니다. b는 자음이라 a. 부사로 말하려면 영어 in good faith를 씁니다(act in good faith)."}, "collocations": ["bona fide purchaser (→ 10장)", "bona fide intention to use", "in good faith (부사구)", "bona fides (명사 — 진정성, 자격)"], "links": [{"label": "LII Wex — bona fide", "url": "https://www.law.cornell.edu/wex/bona_fide"}]}, {"id": "de-facto", "hw": "de facto · de jure", "ipa": "ˌdɪ ˈfæk.toʊ · ˌdɪː ˈʒʊr.i", "stress": "de **fac**·to · de **ju**·re", "stars": 3, "gloss": "사실상(의) · 법률상(의)", "pron_tip": "Cambridge US는 de facto의 de를 /dɪ/와 /deɪ/ 둘 다 싣습니다. de jure의 j는 Cambridge US 표기로 /ʒ/입니다.", "examples": {"easy": {"en": "He is the de facto leader.", "ko": "그가 사실상의 지도자다."}, "practice": {"en": "The policy created de facto segregation, not de jure segregation.", "ko": "그 정책은 법률상의 분리가 아니라 사실상의 분리를 낳았다."}, "source": {"en": "We emphasize that the differentiating factor between de jure segregation and so-called de facto segregation … is purpose or intent to segregate.", "ko": "법률상 분리와 이른바 사실상 분리를 가르는 요소는 … 분리하려는 목적 또는 의도라는 점을 강조한다.", "cite": "Keyes v. School District No. 1, 413 U.S. 189, 208 (1973)", "url": "https://www.law.cornell.edu/supremecourt/text/413/189", "glossary": {"segregation": "(인종) 분리", "so-called": "이른바", "differentiating factor": "구별 기준"}}}, "box": "미국 학교 인종분리 소송에서 법령이나 교육당국의 정책으로 만든 분리는 de jure, 거주지 분포처럼 정책 없이 생긴 분리는 de facto라고 불렀습니다. Keyes 판결은 둘을 가르는 기준을 '분리하려는 의도'로 잡았습니다.", "grammar": {"axis": "G1", "title": "a de facto + 명사", "wrong": "The rule works as de facto ban.", "right": "The rule works as a de facto ban.", "note": "de facto가 형용사로 명사 앞에 오면 관사는 de facto 앞에 붙습니다(a de facto ban, the de facto CEO). 셀 수 있는 단수명사이면 관사를 빼지 않습니다."}, "collocations": ["de facto standard (사실상 표준)", "a de facto ban", "de jure segregation", "de facto / de jure discrimination"], "links": [{"label": "LII Wex — de facto", "url": "https://www.law.cornell.edu/wex/de_facto"}, {"label": "LII Wex — de jure", "url": "https://www.law.cornell.edu/wex/de_jure"}]}, {"id": "prima-facie", "hw": "prima facie", "ipa": "ˌpraɪ.mə ˈfeɪ.ʃi", "stress": "pri·ma **fa**·cie", "stars": 3, "gloss": "일응의, 일견(반증이 없으면 그대로 인정되는)", "pron_tip": "facie의 c는 /ʃ/ 소리이고 끝의 e도 /i/로 읽습니다. prima의 i는 /aɪ/입니다(Cambridge US).", "diff": "한국 법률가에게 익숙한 '일응의 추정'과 가깝습니다. prima facie case는 '상대방이 반박하지 않으면 이길 만큼의 증명'이고, 이것이 갖춰지면 반박할 부담이 상대방에게 넘어갑니다.", "examples": {"easy": {"en": "She has a prima facie case.", "ko": "그녀는 일응의 증명을 갖췄다."}, "practice": {"en": "Once the plaintiff makes a prima facie showing, the burden shifts to the employer.", "ko": "원고가 일응의 증명을 하면 증명의 부담은 고용주에게 넘어간다."}, "source": {"en": "The complainant in a Title VII trial must carry the initial burden under the statute of establishing a prima facie case of racial discrimination.", "ko": "민권법 제7편에 따른 재판에서 청구인은 인종차별에 관한 일응의 증명을 해야 하는 최초의 부담을 진다.", "cite": "McDonnell Douglas Corp. v. Green, 411 U.S. 792, 802 (1973)", "url": "https://www.law.cornell.edu/supremecourt/text/411/792", "glossary": {"Title VII": "1964년 민권법 제7편(고용차별 금지)", "complainant": "청구인", "initial burden": "최초의 (증명) 부담"}}}, "box": "판결은 이 증명을 네 요소로 할 수 있다고 했습니다. 원고가 소수 인종에 속할 것, 자격을 갖춰 지원했을 것, 거절당했을 것, 그 뒤에도 그 자리가 비어 있었을 것. 미국 고용차별 소송에서 지금도 쓰는 틀입니다.", "grammar": {"axis": "G2", "title": "criterion(단수) · criteria(복수)", "wrong": "The court applied a four-part criteria.", "right": "The court applied four criteria. / The first criterion is membership in a minority.", "note": "그리스어에서 온 복수형입니다. criteria를 단수처럼 쓰지 않습니다. data(단수 datum)는 단수 취급도 쓰이지만 격식 문서에서는 The data show처럼 복수로 받는 편이 안전합니다."}, "collocations": ["make out / establish a prima facie case", "prima facie evidence (일응의 증거)", "prima facie showing"], "links": [{"label": "LII Wex — prima facie", "url": "https://www.law.cornell.edu/wex/prima_facie"}]}, {"id": "pro-se", "hw": "pro se", "ipa": "ˌproʊ ˈseɪ", "stress": "pro **se**", "stars": 2, "uk": "litigant in person (본인소송 당사자)", "gloss": "(변호사 없이) 본인이 직접 — 본인소송", "pron_tip": "Cambridge 미수록이라 미국 법조 관행 발음으로 적었습니다. se를 /seɪ/로 읽으며, /siː/로 읽는 사람도 있습니다.", "diff": "미국 법원은 pro se 당사자의 서면을 변호사가 쓴 서면보다 너그럽게 읽어야 한다는 원칙을 세워 두었습니다(아래 원문).", "examples": {"easy": {"en": "He appeared pro se.", "ko": "그는 변호사 없이 직접 출석했다."}, "practice": {"en": "The court gave the pro se plaintiff more time to fix his complaint.", "ko": "법원은 본인소송 원고에게 소장을 고칠 시간을 더 주었다."}, "source": {"en": "a pro se complaint, however inartfully pleaded, must be held to less stringent standards than formal pleadings drafted by lawyers", "ko": "본인이 작성한 소장은 아무리 서툴게 쓰였더라도 변호사가 작성한 정식 서면보다 덜 엄격한 기준으로 판단해야 한다", "cite": "Erickson v. Pardus, 551 U.S. 89, 94 (2007) (per curiam) — Estelle v. Gamble 판결을 인용한 부분", "url": "https://www.law.cornell.edu/supct/html/06-7317.ZPC.html", "glossary": {"inartfully": "서툴게", "stringent": "엄격한", "pleadings": "소송서면(→ 3장)"}}}, "grammar": {"axis": "G2", "title": "pro se는 변하지 않는다 — 복수는 명사에", "wrong": "Two pro ses filed the motion.", "right": "Two pro se litigants filed the motion.", "note": "라틴어 수식어는 복수형을 만들지 않습니다. 복수 표시는 뒤의 명사(litigants, plaintiffs)에 붙입니다."}, "collocations": ["appear pro se", "proceed pro se", "pro se litigant", "🇬🇧 litigant in person"], "links": [{"label": "LII Wex — pro se", "url": "https://www.law.cornell.edu/wex/pro_se"}]}, {"id": "pro-bono", "hw": "pro bono", "ipa": "ˌproʊ ˈboʊ.noʊ", "stress": "pro **bo**·no", "stars": 2, "gloss": "무료 법률봉사(공익을 위한 무보수 변론)", "diff": "pro bono publico(공익을 위하여)의 줄임말입니다. pro se(본인소송)와 철자가 비슷하지만 뜻은 전혀 다릅니다. pro bono는 변호사가 보수 없이 맡는 일, pro se는 변호사 없이 하는 소송입니다.", "examples": {"easy": {"en": "She does pro bono work every year.", "ko": "그녀는 해마다 무료 법률봉사를 한다."}, "practice": {"en": "Our firm took the asylum case pro bono.", "ko": "우리 사무소는 그 난민 사건을 무보수로 맡았다."}}, "grammar": {"axis": "G3", "title": "pro bono work는 셀 수 없다", "wrong": "She did a pro bono work.", "right": "She did pro bono work. / She took a pro bono case.", "note": "work(일)는 불가산명사라 a를 붙이지 않습니다. 사건 하나하나를 셀 때는 case나 matter를 씁니다."}, "collocations": ["do pro bono work", "take a case pro bono", "pro bono counsel"], "links": [{"label": "LII Wex — pro bono", "url": "https://www.law.cornell.edu/wex/pro_bono"}]}, {"id": "sua-sponte", "hw": "sua sponte", "ipa": "ˌsuː.ə ˈspɑːn.teɪ", "stress": "su·a **spon**·te", "stars": 2, "gloss": "직권으로(당사자의 신청 없이)", "pron_tip": "Cambridge 미수록이라 미국 법조 관행 발음으로 적었습니다. sponte 끝의 e를 /eɪ/로 읽으며, /i/로 읽기도 합니다.", "diff": "한국의 '직권'과 기능은 같습니다. 다만 당사자주의가 강한 미국에서는 법원이 스스로 쟁점을 꺼냈다는 사실을 판결문에 sua sponte라고 굳이 밝혀 둡니다.", "examples": {"easy": {"en": "The court acted sua sponte.", "ko": "법원은 직권으로 판단했다."}, "practice": {"en": "The district court dismissed the petition sua sponte as untimely.", "ko": "연방지방법원은 기간 도과를 이유로 그 청구를 직권으로 각하했다."}, "source": {"en": "courts are under no obligation to raise the time bar sua sponte", "ko": "법원은 기간 도과를 직권으로 문제 삼을 의무가 없다", "cite": "Day v. McDonough, 547 U.S. 198 (2006)", "url": "https://www.law.cornell.edu/supct/html/04-1324.ZO.html", "glossary": {"time bar": "기간 도과에 따른 차단", "be under no obligation to": "~할 의무가 없다"}}}, "grammar": {"axis": "G4", "title": "on its own — sua sponte를 영어로 풀 때", "wrong": "The court struck the defense by its own motion.", "right": "The court struck the defense on its own motion.", "note": "직권은 전치사 on으로 풉니다(on its own motion, on its own initiative). 연방민사소송규칙 12(f)도 'The court may act: (1) on its own'이라고 씁니다."}, "collocations": ["raise an issue sua sponte", "dismiss sua sponte", "on its own motion"], "links": [{"label": "LII Wex — sua sponte", "url": "https://www.law.cornell.edu/wex/sua_sponte"}]}, {"id": "inter-alia", "hw": "inter alia", "ipa": "ˌɪn.tɚ ˈeɪ.li.ə", "stress": "in·ter **a**·li·a", "stars": 2, "gloss": "여러 가지 중에서도(일부만 들자면)", "pron_tip": "alia의 첫 a는 /eɪ/로 읽습니다(Cambridge US).", "examples": {"easy": {"en": "The contract covers, inter alia, price and delivery.", "ko": "계약은 여러 사항 가운데 가격과 인도 조건도 다룬다."}, "practice": {"en": "The complaint alleges, inter alia, fraud and breach of contract.", "ko": "소장은 여러 주장 가운데 사기와 계약 위반을 주장한다."}}, "pitfalls": ["'특히'로 옮겨 강조처럼 읽기 — '여러 가지 중 일부만 들면'이라는 뜻이다", "열거한 것이 전부라고 읽기 — 다른 것도 있다는 표시다"], "grammar": {"axis": "G2", "title": "among other things — 뒤는 복수", "wrong": "The court held, among other thing, that the claim was late.", "right": "The court held, among other things, that the claim was late.", "note": "inter alia를 영어로 풀면 among other things. 이 고정 표현에서는 things를 복수로 씁니다. other 자체는 the other party(단수), other information(불가산)처럼 다른 명사와도 어울리므로 '늘 복수'가 아니라 이 표현의 형태로 외웁니다."}, "collocations": ["alleges, inter alia, …", "among other things", "including (조문식 표현)"], "links": [{"label": "LII Wex — inter alia", "url": "https://www.law.cornell.edu/wex/inter_alia"}]}, {"id": "ex-parte", "hw": "ex parte", "ipa": "ˌeks ˈpɑːr.t̬i", "stress": "ex **par**·te", "stars": 2, "gloss": "일방적(인) — 상대방 없이, 상대방에게 알리지 않고", "pron_tip": "Cambridge는 뜻풀이(비즈니스 영어 사전)는 싣지만 US 발음 기호는 제시하지 않고, Wiktionary 영어 항목에도 발음 기호가 없습니다(2026-10-04 확인). 그래서 미국 법조 관행 발음으로 적었습니다. parte를 /ˈpɑːr.t̬i/로 읽으며, /ˈpɑːr.teɪ/로 읽기도 합니다.", "diff": "쓰임이 둘입니다. ① 상대방에게 알리지 않고 하는 신청·결정(ex parte TRO 등) — 한국의 무심문 보전처분과 자리가 비슷합니다. ② 판사와 한쪽 당사자만의 접촉(ex parte communication) — 원칙적으로 금지됩니다.", "examples": {"easy": {"en": "The judge granted an ex parte order.", "ko": "판사는 상대방 없이 명령을 발령했다."}, "practice": {"en": "Counsel must not have ex parte contact with the judge about the case.", "ko": "대리인은 사건에 관하여 상대방 없이 판사와 접촉해서는 안 된다."}, "source": {"en": "the court may, upon ex parte application but only in extraordinary circumstances, issue an order providing for the seizure of property necessary to prevent the propagation or dissemination of the trade secret", "ko": "법원은 상대방 없는 일방 신청에 따라, 다만 예외적인 사정이 있을 때에만, 영업비밀의 전파·유포를 막는 데 필요한 재산의 압류를 명할 수 있다", "cite": "18 U.S.C. § 1836(b)(2)(A)(i) — 영업비밀보호법(DTSA)의 민사 압류", "url": "https://www.law.cornell.edu/uscode/text/18/1836", "glossary": {"seizure": "압류", "propagation or dissemination": "전파·유포", "extraordinary circumstances": "예외적 사정"}}}, "grammar": {"axis": "G1", "title": "an ex parte — 관사는 소리를 따른다", "wrong": "a ex parte motion", "right": "an ex parte motion", "note": "ex는 모음 소리 /e/로 시작하므로 an입니다. 관사는 철자가 아니라 첫소리를 따릅니다(an MRI, a unanimous verdict)."}, "collocations": ["ex parte application / motion", "ex parte communication", "on an ex parte basis"], "links": [{"label": "LII Wex — ex parte", "url": "https://www.law.cornell.edu/wex/ex_parte"}]}, {"id": "in-camera", "hw": "in camera", "ipa": "ˌɪn ˈkæm.rə", "stress": "in **cam**·er·a", "stars": 2, "false_friend": true, "gloss": "비공개로(판사실에서)", "pron_tip": "camera와 같은 /ˈkæm.rə/ — 가운데 e는 소리 내지 않는 것이 Cambridge US 표기입니다.", "diff": "camera는 라틴어로 '방'입니다. 사진기 camera도 '어두운 방(camera obscura)'에서 온 말입니다. in camera review는 판사가 문서를 판사실에서 혼자 열람해 공개 여부를 정하는 절차이고, 촬영과는 관계가 없습니다.", "examples": {"easy": {"en": "The judge read the files in camera.", "ko": "판사는 그 서류를 비공개로 읽었다."}, "practice": {"en": "The court reviewed the privileged documents in camera before ruling.", "ko": "법원은 결정하기 전에 특권 대상 문서를 비공개로 검토했다."}, "source": {"en": "Before admitting evidence under this rule, the court must conduct an in camera hearing and give the victim and parties a right to attend and be heard.", "ko": "이 조에 따라 증거를 채택하기 전에 법원은 비공개 심리를 열고 피해자와 당사자에게 참석하여 의견을 말할 권리를 주어야 한다.", "cite": "Fed. R. Evid. 412(c)(2)", "url": "https://www.law.cornell.edu/rules/fre/rule_412", "glossary": {"admit": "(증거로) 채택하다", "be heard": "의견을 진술하다"}}}, "box": "연방증거규칙 제412조는 성범죄 사건에서 피해자의 과거 성적 행동에 관한 증거를 원칙적으로 막는 규정(rape shield rule)입니다. 예외로 받아들이려면 먼저 비공개 심리를 거쳐야 합니다.", "pitfalls": ["'카메라 앞에서'로 옮기기 — 정반대로 '비공개로'다", "in camera를 법정 촬영 허용으로 오해하기"], "grammar": {"axis": "G1", "title": "in camera에는 관사가 없다", "wrong": "The judge reviewed the files in the camera.", "right": "The judge reviewed the files in camera.", "note": "라틴어 관용구라 the를 넣지 않습니다. in the camera라고 하면 '사진기 안에'가 됩니다. 반대말은 in open court(→ 2장)."}, "collocations": ["in camera review / inspection", "in camera hearing", "in open court (반대)"], "links": [{"label": "LII Wex — in camera", "url": "https://www.law.cornell.edu/wex/in_camera"}]}, {"id": "amicus-curiae", "hw": "amicus curiae", "ipa": "ˌæm.ɪ.kəs ˈkjʊr.i.aɪ", "stress": "am·i·cus **cu**·ri·ae", "stars": 2, "gloss": "법정 조언자(당사자가 아니면서 의견서를 내는 제3자)", "pron_tip": "Cambridge의 amicus 항목에 결합형 amicus curiae가 US /ˌæm.ɪ.kəs ˈkjʊr.i.aɪ/로 실려 있습니다. 주강세는 cu-이고, 결합형에서 am-은 부강세입니다(amicus 단독으로는 /ˈæm.ɪ.kəs/). 복수 amici curiae는 /ˌæm.ɪ.ki ˈkjʊr.i.aɪ/.", "diff": "한국에도 대법원이 공익 관련 사건에서 국가기관·공공단체 등에게서 참고인 의견서를 받는 제도가 있습니다(민사소송규칙 제134조의2). 미국 연방항소법원과 연방대법원에서는 이해관계 있는 단체가 스스로 amicus brief를 내는 것이 규칙으로 정해져 있습니다.", "examples": {"easy": {"en": "Ten groups filed amicus briefs.", "ko": "열 개 단체가 법정 조언자 의견서를 냈다."}, "practice": {"en": "The United States filed a brief as amicus curiae supporting the petitioner.", "ko": "미국 정부는 상고인을 지지하는 법정 조언자 의견서를 냈다."}, "source": {"en": "Any other amicus curiae may file a brief only by leave of court or if the brief states that all parties have consented to its filing", "ko": "그 밖의 법정 조언자는 법원의 허가를 받거나 모든 당사자가 제출에 동의했다고 의견서에 적은 경우에만 의견서를 낼 수 있다", "cite": "Fed. R. App. P. 29(a)(2)", "url": "https://www.law.cornell.edu/rules/frap/rule_29", "glossary": {"leave of court": "법원의 허가", "consent to": "~에 동의하다"}}}, "grammar": {"axis": "G2", "title": "복수는 amici curiae", "wrong": "Two amicus curiaes filed briefs.", "right": "Two amici curiae filed briefs. / Two amicus briefs were filed.", "note": "라틴어 복수로 amicus가 amici가 되고, curiae(법원의)는 그대로입니다. 복잡하면 amicus brief(s)로 피해 갑니다. dictum → dicta(→ 16장)도 같은 계열의 복수입니다."}, "collocations": ["file an amicus brief", "amici (복수, 줄임말)", "brief of amici curiae in support of petitioner"], "links": [{"label": "LII Wex — amicus curiae", "url": "https://www.law.cornell.edu/wex/amicus_curiae"}]}, {"id": "per-se", "hw": "per se", "ipa": "ˌpɝː ˈseɪ", "stress": "per **se**", "stars": 2, "false_friend": true, "gloss": "그 자체로, 당연히(다른 사정을 따지지 않고)", "diff": "일상 영어의 per se는 'not ... per se(그 자체로는 아니다)'처럼 가볍게 씁니다. 법률 영어의 per se rule은 '그 행위만으로 곧 위법'이라는 당연위법 원칙으로, 독점금지법에서 합리의 원칙(rule of reason)과 짝을 이룹니다.", "examples": {"easy": {"en": "Price-fixing is illegal per se.", "ko": "가격 담합은 그 자체로 위법이다."}, "practice": {"en": "The court declined to apply the per se rule and used the rule of reason.", "ko": "법원은 당연위법 원칙을 적용하지 않고 합리의 원칙을 썼다."}, "source": {"en": "We granted certiorari to determine whether vertical minimum resale price maintenance agreements should continue to be treated as per se unlawful.", "ko": "우리는 수직적 최저 재판매가격 유지 약정을 계속 당연위법으로 다루어야 하는지 판단하기 위하여 상고를 허가하였다.", "cite": "Leegin Creative Leather Products, Inc. v. PSKS, Inc., 551 U.S. 877 (2007)", "url": "https://www.law.cornell.edu/supct/html/06-480.ZO.html", "glossary": {"certiorari": "상고허가(→ 15장)", "resale price maintenance": "재판매가격 유지", "vertical": "수직적(제조사와 판매점 사이)"}}}, "box": "연방대법원은 이 판결에서 최저 재판매가격 유지를 당연위법으로 본 Dr. Miles 판결(1911)의 법리를 변경하고, 합리의 원칙으로 판단하게 했습니다.", "pitfalls": ["per say로 적기 — 소리대로 적은 오기", "not ... per se를 '결코 아니다'로 강하게 옮기기 — '그 자체로는 아니다'"], "grammar": {"axis": "G1", "title": "법리 이름 앞의 the", "wrong": "The court applied per se rule.", "right": "The court applied the per se rule.", "note": "특정 법리를 가리킬 때는 the를 붙입니다(the per se rule, the rule of reason). 술어로 쓸 때는 관사 없이 illegal per se."}, "collocations": ["illegal per se / per se illegal", "the per se rule", "negligence per se (법규 위반 자체로 인정되는 과실)"], "links": [{"label": "LII Wex — per se", "url": "https://www.law.cornell.edu/wex/per_se"}]}, {"id": "quid-pro-quo", "hw": "quid pro quo", "ipa": "ˌkwɪd proʊ ˈkwoʊ", "stress": "quid pro **quo**", "stars": 2, "gloss": "대가(무엇을 주고 무엇을 받는 교환)", "diff": "계약법에서는 약인(consideration, → 8장)과 비슷한 교환의 뜻이지만, 뉴스에서는 주로 부정한 교환을 가리킵니다. 뇌물죄의 대가관계, 직장 내 성희롱의 대가형(quid pro quo harassment)이 그 예입니다.", "examples": {"easy": {"en": "There was no quid pro quo.", "ko": "대가 관계는 없었다."}, "practice": {"en": "Prosecutors must prove a quid pro quo between the payment and the official act.", "ko": "검사는 돈의 지급과 직무 행위 사이의 대가 관계를 증명해야 한다."}}, "grammar": {"axis": "G6", "title": "demand / offer a quid pro quo", "wrong": "He did a quid pro quo.", "right": "He demanded a quid pro quo.", "note": "요구는 demand, 제안은 offer, 증명은 prove. 하나의 거래로 세어 a quid pro quo라고 합니다(부정문은 관용적으로 no quid pro quo)."}, "collocations": ["demand a quid pro quo", "no quid pro quo", "quid pro quo harassment (대가형 성희롱)"], "links": [{"label": "LII Wex — quid pro quo", "url": "https://www.law.cornell.edu/wex/quid_pro_quo"}]}, {"id": "ultra-vires", "hw": "ultra vires", "ipa": "ˌʌl.trə ˈvaɪ.riːz", "stress": "ul·tra **vi**·res", "stars": 1, "gloss": "권한 밖의(권한을 넘은)", "pron_tip": "Cambridge는 뜻풀이(비즈니스 영어 사전)는 싣지만 US 발음 기호는 제시하지 않고, Wiktionary 영어 항목에도 발음 기호가 없습니다(2026-10-04 확인). 그래서 미국 법조 관행 발음으로 적었습니다. vires를 /ˈvaɪ.riːz/로 읽으며, /ˈviː.reɪz/로 읽기도 합니다.", "diff": "회사가 정관의 목적 범위를 벗어난 행위, 행정기관이 수권 법률의 범위를 넘은 규칙 제정을 가리킵니다. 한국 회사법의 '목적 범위 외 행위' 논의와 연결됩니다.", "examples": {"easy": {"en": "The agency acted ultra vires.", "ko": "그 기관은 권한 밖의 행위를 했다."}, "practice": {"en": "The shareholders argued that the contract was ultra vires and void.", "ko": "주주들은 그 계약이 권한 밖의 행위라 무효라고 주장했다."}}, "grammar": {"axis": "G4", "title": "beyond — 범위를 넘어서", "wrong": "The agency acted over its powers.", "right": "The agency acted beyond its powers. / The agency exceeded its authority.", "note": "ultra vires를 영어로 풀면 beyond the powers. exceed는 타동사라 전치사 없이 씁니다(✗ exceed over)."}, "collocations": ["act ultra vires", "ultra vires act", "exceed its authority"], "links": [{"label": "LII Wex — ultra vires", "url": "https://www.law.cornell.edu/wex/ultra_vires"}]}, {"id": "voir-dire", "hw": "voir dire", "ipa": "vwɑːr ˈdɪr", "stress": "voir **dire**", "stars": 2, "gloss": "배심원 선정 심문(배심원 후보자에 대한 질문 절차)", "pron_tip": "Cambridge 미수록이라 미국 법조 관행 발음 /vwɑːr ˈdɪr/로 적었습니다. 법률 프랑스어(Law French)에서 온 말로 '진실을 말하다'라는 뜻입니다. /vɔːr ˈdaɪr/처럼 읽는 소리도 있습니다.", "diff": "한국 국민참여재판에도 같은 자리의 절차가 있습니다. 법원이 배심원후보자에게 질문하고, 불공평한 판단을 할 우려가 있으면 직권 또는 기피신청으로 불선정결정을 합니다(국민의 형사재판 참여에 관한 법률 제28조). 영미에서 voir dire는 증인의 자격을 따지는 예비 심문을 뜻하기도 합니다.", "examples": {"easy": {"en": "Voir dire took two days.", "ko": "배심원 선정 심문에 이틀이 걸렸다."}, "practice": {"en": "During voir dire, two jurors were excused for cause.", "ko": "배심원 선정 심문 중에 후보자 두 명이 이유부 기피로 배제되었다."}, "source": {"en": "the Committee deleted the language that authorized the defendant to conduct voir dire of prospective jurors.", "ko": "위원회는 피고인이 배심원 후보자에 대한 선정 심문을 직접 할 수 있게 했던 문언을 삭제하였다.", "cite": "Fed. R. Crim. P. 24, Committee Notes on Rules—2002", "url": "https://www.law.cornell.edu/rules/frcrmp/rule_24", "glossary": {"prospective jurors": "배심원 후보자", "conduct": "(절차를) 진행하다"}}}, "box": "연방형사소송규칙 제24조 본문은 voir dire라는 말 대신 'examine prospective jurors(배심원 후보자를 신문하다)'라고 씁니다. 위 원문은 그 조문을 고친 위원회의 주석입니다. 규칙 정비는 조문을 쉬운 영어로 바꾸는 방향이고, 라틴어·프랑스어는 주석과 실무 용어로 남았습니다.", "grammar": {"axis": "G7", "title": "배심원 후보가 빠지는 결과는 수동태", "wrong": "Two jurors excused for cause.", "right": "Two jurors were excused for cause.", "note": "후보자는 스스로 빠지는 것이 아니라 법원이 배제하므로 be excused, be struck(수동). 능동으로 쓰려면 주어를 the judge로."}, "collocations": ["conduct voir dire", "during voir dire", "challenge for cause (이유부 기피)", "peremptory challenge (무이유부 기피)"], "links": [{"label": "LII Wex — voir dire", "url": "https://www.law.cornell.edu/wex/voir_dire"}]}, {"id": "subpoena-duces-tecum", "hw": "subpoena duces tecum", "ipa": "səˈpiː.nə ˌduː.siːz ˈtiː.kəm", "stress": "sub·**poe**·na du·ces **te**·cum", "stars": 1, "gloss": "문서제출 소환장(서류·물건을 가지고 나오라는 소환장)", "pron_tip": "subpoena는 Cambridge US /səˈpiː.nə/(→ 3장). duces tecum은 Cambridge 미수록이라 미국 법조 관행 발음으로 적었고, 뜻은 '가지고 오라'입니다.", "diff": "현행 연방민사소송규칙 제45조 본문은 이 라틴어를 쓰지 않고 'produce designated documents(지정된 문서를 제출하라)'처럼 풀어 씁니다. 라틴어 이름은 1937년 제정 당시의 주석에 남아 있습니다(아래 원문).", "examples": {"easy": {"en": "The bank received a subpoena duces tecum.", "ko": "은행은 문서제출 소환장을 받았다."}, "practice": {"en": "The subpoena duces tecum ordered the company to bring its 2024 emails.", "ko": "문서제출 소환장은 회사에 2024년 이메일을 가지고 나오라고 명했다."}, "source": {"en": "This rule applies to subpoenas ad testificandum and duces tecum issued by the district courts for attendance at a hearing or a trial, or to take depositions.", "ko": "이 조는 심리기일이나 재판에 출석하게 하거나 증언녹취를 하기 위하여 연방지방법원이 발부하는 증인 소환장과 문서제출 소환장에 적용된다.", "cite": "Fed. R. Civ. P. 45, Notes of Advisory Committee on Rules—1937", "url": "https://www.law.cornell.edu/rules/frcp/rule_45", "glossary": {"ad testificandum": "증언하러 — 증인 소환장", "deposition": "증언녹취(→ 3장)"}}}, "grammar": {"axis": "G2", "title": "복수 s는 중심 명사에", "wrong": "The court issued two subpoena duces tecums.", "right": "The court issued two subpoenas duces tecum.", "note": "복수 표시는 중심 명사 subpoena에 붙고 라틴어 수식어는 그대로입니다. attorneys general, courts-martial과 같은 원리입니다."}, "collocations": ["issue a subpoena duces tecum", "subpoena ad testificandum (증인 소환장)", "→ 3장 subpoena"], "links": [{"label": "LII Wex — subpoena duces tecum", "url": "https://www.law.cornell.edu/wex/subpoena_duces_tecum"}]}, {"id": "affidavit", "hw": "affidavit", "ipa": "ˌæf.əˈdeɪ.vɪt", "stress": "af·fi·**da**·vit", "stars": 2, "gloss": "선서진술서", "pron_tip": "주강세는 셋째 음절 -da-, 첫 음절 af-에는 부강세가 있습니다(Cambridge US /ˌæf.əˈdeɪ.vɪt/).", "diff": "공증인 등 앞에서 선서하고 서명하는 서면 진술입니다. 연방 사건에서는 '위증의 벌을 감수한다'는 문구를 넣은 선서 없는 진술서(declaration)로 대신할 수 있습니다(28 U.S.C. § 1746). 한국의 진술서·사실확인서는 거짓이어도 위증죄가 되지 않는다는 점에서 무게가 다릅니다.", "examples": {"easy": {"en": "She signed an affidavit.", "ko": "그녀는 선서진술서에 서명했다."}, "practice": {"en": "The motion is supported by the affidavit of the company's CFO.", "ko": "그 신청은 회사 최고재무책임자의 선서진술서로 뒷받침된다."}, "source": {"en": "An affidavit or declaration used to support or oppose a motion must be made on personal knowledge, set out facts that would be admissible in evidence, and show that the affiant or declarant is competent to testify on the matters stated.", "ko": "신청을 뒷받침하거나 다투는 데 쓰는 선서진술서나 진술서는 직접 경험한 지식에 근거하고, 증거능력이 있을 사실을 적고, 진술인이 그 사항에 관하여 증언할 능력이 있음을 보여야 한다.", "cite": "Fed. R. Civ. P. 56(c)(4)", "url": "https://www.law.cornell.edu/rules/frcp/rule_56", "glossary": {"personal knowledge": "직접 경험해 아는 것", "affiant / declarant": "(선서)진술인", "admissible": "증거능력 있는(→ 5장)"}}}, "grammar": {"axis": "G6", "title": "swear / sign / file an affidavit", "wrong": "She did an affidavit.", "right": "She swore an affidavit. / She signed an affidavit.", "note": "선서하는 것은 swear(swore, sworn), 제출은 file 또는 submit. 진술서 '안에서' 말할 때는 in her affidavit."}, "collocations": ["sworn affidavit", "file / submit an affidavit", "declaration under penalty of perjury"], "links": [{"label": "LII Wex — affidavit", "url": "https://www.law.cornell.edu/wex/affidavit"}, {"label": "LII — 28 U.S.C. § 1746", "url": "https://www.law.cornell.edu/uscode/text/28/1746"}]}, {"id": "eg-ie", "hw": "e.g. · i.e. · et al.", "ipa": "iːˈdʒiː · ˌaɪˈiː · et ˈæl", "stress": "e.**g.** · i.**e.** · et **al.**", "stars": 3, "false_friend": true, "gloss": "예컨대 · 즉(다시 말해) · 외(그 밖의 사람들)", "pron_tip": "보통 글자 이름 그대로 읽습니다(Cambridge US). 소리 내어 읽을 때는 for example, that is로 바꿔 말해도 됩니다.", "diff": "e.g.(exempli gratia)는 여러 예 가운데 일부를 드는 말이고, i.e.(id est)는 앞말을 다시 정확히 말하는 말입니다. 바꿔 쓰면 뜻이 달라집니다. et al.(et alii)은 당사자·저자가 여럿일 때 첫 이름 뒤에 붙입니다.", "examples": {"easy": {"en": "Bring an ID, e.g., a passport.", "ko": "신분증, 예컨대 여권을 가져오세요."}, "practice": {"en": "The judge may let the lawyers, i.e., defense counsel and the prosecutor, question prospective jurors.", "ko": "판사는 양쪽 법률가, 즉 변호인과 검사가 배심원 후보자에게 질문하게 할 수 있다."}, "source": {"en": "Amended Rule 24(a) refers only to attorneys for the parties, i.e., the defense counsel and the attorney for the government", "ko": "개정 규칙 제24조(a)는 당사자의 변호사, 즉 변호인과 정부 측 검사만을 언급한다", "cite": "Fed. R. Crim. P. 24, Committee Notes on Rules—2002", "url": "https://www.law.cornell.edu/rules/frcrmp/rule_24", "glossary": {"attorney for the government": "정부 측 변호사 — 연방 형사사건의 검사"}}}, "pitfalls": ["e.g.를 '즉'으로, i.e.를 '예컨대'로 옮기기", "et. al.처럼 et 뒤에 점 찍기 — 줄임말은 al.뿐이다", "위 원문처럼 미국 법률 문서는 i.e. 뒤에 쉼표를 찍는다"], "grammar": {"axis": "G8", "title": "조문에서는 e.g. 대신 including", "wrong": "Penalties, i.e., fines, may apply. (벌금 하나뿐이라는 뜻)", "right": "Penalties, including fines, may apply.", "note": "i.e.는 '곧 그것'이라는 한정이라 열거가 닫힙니다. 예시로 열어 두려면 조문·계약서에서는 including(…을 포함하여)으로 풀어 쓰는 편이 안전합니다."}, "collocations": ["e.g., …", "i.e., …", "Smith et al.", "including but not limited to"], "links": [{"label": "LII Wex — e.g.", "url": "https://www.law.cornell.edu/wex/e.g."}, {"label": "LII Wex — i.e.", "url": "https://www.law.cornell.edu/wex/i.e."}, {"label": "LII Wex — et al.", "url": "https://www.law.cornell.edu/wex/et_al"}]}, {"id": "ad-hoc", "hw": "ad hoc", "ipa": "ˌæd ˈhɑːk", "stress": "ad **hoc**", "stars": 1, "gloss": "임시의, 특정 목적을 위한", "diff": "국제분쟁에서 자주 만납니다. ad hoc arbitration은 중재기관 없이 당사자가 직접 꾸리는 임의중재(기관중재와 대비, → 14장), judge ad hoc은 국제사법재판소(ICJ)에서 사건마다 당사국이 지명하는 특임재판관입니다.", "examples": {"easy": {"en": "They formed an ad hoc committee.", "ko": "그들은 임시 위원회를 꾸렸다."}, "practice": {"en": "The parties chose ad hoc arbitration under the UNCITRAL Rules.", "ko": "당사자들은 UNCITRAL 규칙에 따른 임의중재를 택했다."}}, "grammar": {"axis": "G1", "title": "ad hoc 앞의 관사는 an", "wrong": "They formed a ad hoc committee.", "right": "They formed an ad hoc committee. / They chose ad hoc arbitration.", "note": "ad는 모음 소리로 시작하므로 an. 절차 일반을 말할 때는 ad hoc arbitration처럼 관사 없이 쓰는 것이 흔하고, 개별 절차 한 건을 셀 때는 an ad hoc arbitration도 씁니다(→ 3장 discovery)."}, "collocations": ["ad hoc committee", "ad hoc arbitration (임의중재)", "judge ad hoc (ICJ 특임재판관)"], "links": [{"label": "LII Wex — ad hoc", "url": "https://www.law.cornell.edu/wex/ad_hoc"}]}, {"id": "mutatis-mutandis", "hw": "mutatis mutandis", "ipa": "mjuːˌtɑː.t̬ɪs mjuːˈtæn.dɪs", "stress": "mu·**ta**·tis mu·**tan**·dis", "stars": 1, "gloss": "필요한 변경을 가하여(준용)", "pron_tip": "강세가 둘입니다(-ta-, -tan-). Cambridge US는 mu를 /mjuː/로 적습니다.", "diff": "한국 법령의 '준용한다'에 해당합니다. 미국 연방 조문보다는 조약과 국제계약서에서 만나게 됩니다.", "examples": {"easy": {"en": "The same rules apply mutatis mutandis.", "ko": "같은 규칙이 준용된다."}, "practice": {"en": "Article 5 applies mutatis mutandis to the seller's obligations.", "ko": "제5조는 매도인의 의무에 준용된다."}}, "grammar": {"axis": "G2", "title": "rules는 복수 — 동사도 복수", "wrong": "The same rules applies mutatis mutandis.", "right": "The same rules apply mutatis mutandis. / The rule applies mutatis mutandis.", "note": "주어가 복수(rules)면 동사에 -s를 붙이지 않습니다. mutatis mutandis의 관용 영어 번역은 with the necessary changes (made)로 복수입니다. 다만 바꿀 것이 하나뿐인 문맥이라면 with the necessary change(단수)도 틀린 영어는 아닙니다 — 덜 흔한 형태일 뿐입니다."}, "collocations": ["apply mutatis mutandis", "with the necessary changes", "준용한다 = shall apply mutatis mutandis"]}], "corners": {"false_friend": {"title": "in camera에는 카메라가 없다", "body": ["in camera를 '카메라 앞에서'로 읽으면 정반대가 됩니다. 라틴어 camera는 '방'이고, in camera는 판사실에서 비공개로 한다는 뜻입니다. 공개 법정은 in open court(→ 2장)입니다.", "라틴어 표현은 아는 영어 단어처럼 보여서 더 속기 쉽습니다. 이 장에서 헷갈리기 쉬운 것을 모았습니다."], "table": [["in camera", "카메라로, 촬영하며", "비공개로(판사실에서)"], ["per se", "(말버릇) 그 자체로는", "곧바로 위법 — per se rule(당연위법)"], ["e.g.", "(흔한 오독) 즉 — 일상 영어에서도 '예컨대'", "예컨대 — 일부만 예시"], ["i.e.", "(흔한 오독) 예컨대 — 일상 영어에서도 '즉'", "즉 — 그것뿐"], ["pro se", "(흔한 오독) 프로(전문가)가", "변호사 없이 본인이"], ["bona fide", "진짜의, 가짜가 아닌(a bona fide offer)", "선의의 — 한국 법률 용어 '선의(善意)=모름'으로 옮기지만 원뜻은 '성실한·진정한'(bona fide purchaser)"]], "tip": "e.g.는 example의 e, i.e.는 in essence의 i로 기억하면 덜 헷갈립니다(어원이 아니라 암기 요령입니다)."}, "drama": {"title": "Runaway Jury (2003)", "facts": ["2003년 미국 법정 스릴러. 감독 게리 플레더, 출연 존 쿠삭·진 해크먼·더스틴 호프먼·레이철 와이즈.", "존 그리셤의 1996년 소설 『The Runaway Jury』가 원작입니다.", "뉴올리언스 총격 사건 희생자의 아내가 총기 회사를 상대로 낸 소송이 무대입니다."], "watch": "영화 전체가 voir dire(배심원 선정 심문)에서 시작합니다. 피고 측 배심 컨설턴트가 후보자들의 뒷조사를 해서 법정 안의 변호사에게 실시간으로 넘기는 장면에서, 미국 배심재판에서 배심원을 고르는 일이 얼마나 큰 싸움인지 보입니다. 영화의 불법 감시는 극적 장치이고, 실제 voir dire는 법정에서 공개 질문으로 진행됩니다.", "terms": ["voir dire", "juror / jury pool", "jury consultant", "be excused", "verdict (→ 4장)"], "links": [{"label": "Wikipedia — Runaway Jury", "url": "https://en.wikipedia.org/wiki/Runaway_Jury"}, {"label": "평론 — Picturing Justice(USF 로스쿨 후원 법·대중문화 온라인 저널), J. Howard Sundermann Jr.(오하이오주 제1지구 항소법원 판사), 「Runaway Jury」(2003)", "url": "https://cap-press.com/sites/pj/runawayjury_sundermann.htm"}]}, "quote": {"text": "Stare decisis is not an inexorable command; rather, it \"is a principle of policy and not a mechanical formula of adherence to the latest decision.\"", "ko": "선례구속은 거스를 수 없는 명령이 아니다. 그것은 '정책의 원리이지, 가장 최근 판결을 기계적으로 따르라는 공식이 아니다.'", "case": "Payne v. Tennessee, 501 U.S. 808, 828 (1991)", "decided": "1991. 6. 27. 선고", "gloss": {"stare decisis": "선례구속(→ 1장)", "inexorable": "거스를 수 없는", "adherence": "고수, 충실히 따름", "mechanical formula": "기계적 공식"}, "why": "렌퀴스트 대법원장이 쓴 다수의견입니다. 연방대법원은 이 판결에서 사형 양형 단계의 피해자 영향 진술을 막았던 Booth v. Maryland(1987)와 South Carolina v. Gathers(
