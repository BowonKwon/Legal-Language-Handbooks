 a reasonable doubt", "ipa": "biˈjɑːnd ə ˈriː.zən.ə.bəl daʊt", "stress": "be·**yond** a **rea**·son·a·ble **doubt**", "stars": 3, "gloss": "합리적 의심의 여지 없이(형사 유죄 증명의 기준)", "pron_tip": "doubt의 b는 소리 나지 않습니다. /daʊt/.", "diff": "민사의 증명 기준인 preponderance of the evidence(증거의 우월)보다 훨씬 높은 기준입니다. 한국 형사소송법 제307조 제2항도 '합리적인 의심이 없는 정도의 증명'을 요구합니다.", "examples": {"easy": {"en": "Guilt must be proven beyond a reasonable doubt.", "ko": "유죄는 합리적 의심의 여지 없이 증명되어야 한다."}, "practice": {"en": "If you have a reasonable doubt, you must find the defendant not guilty.", "ko": "합리적 의심이 있다면 피고인에게 무죄 평결을 해야 합니다."}, "source": {"en": "the Due Process Clause protects the accused against conviction except upon proof beyond a reasonable doubt of every fact necessary to constitute the crime with which he is charged.", "ko": "적법절차 조항은 피고인이 기소된 범죄를 구성하는 데 필요한 모든 사실이 합리적 의심의 여지 없이 증명되지 않는 한 유죄 판결을 받지 않도록 보호한다.", "cite": "In re Winship, 397 U.S. 358 (1970)", "url": "https://www.law.cornell.edu/supremecourt/text/397/358", "glossary": {"Due Process Clause": "적법절차 조항", "constitute": "구성하다"}}}, "pitfalls": ["'합리적인 의심을 넘어서'로 직역하기 — 뜻은 '합리적 의심이 남지 않을 만큼'", "reasonable을 '적당한'으로 옮기기"], "grammar": {"axis": "G1", "title": "고정 표현 속의 a", "wrong": "beyond reasonable doubt (미국 법정)", "right": "beyond a reasonable doubt", "note": "미국에서는 a를 넣는 형태가 표준입니다. 영국 판결문에는 a 없는 beyond reasonable doubt도 보입니다."}, "collocations": ["prove beyond a reasonable doubt", "reasonable-doubt standard", "raise a reasonable doubt (합리적 의심을 불러일으키다)"], "links": [{"label": "LII Wex — beyond a reasonable doubt", "url": "https://www.law.cornell.edu/wex/beyond_a_reasonable_doubt"}]}, {"id": "felony-misdemeanor", "hw": "felony · misdemeanor", "ipa": "ˈfel.ə.ni · ˌmɪs.dɪˈmiː.nɚ", "stress": "**fel**·o·ny · mis·de·**mea**·nor", "stars": 3, "uk": "misdemeanour (영국 철자)", "gloss": "중범죄 · 경범죄", "diff": "연방법은 법정형(구금형)의 상한으로 가릅니다. 1년을 넘으면 felony, 5일 초과 1년 이하면 misdemeanor, 5일 이하이거나 구금형이 없으면 infraction(위반행위)입니다(18 U.S.C. § 3559(a), 범죄를 정한 조문이 등급을 따로 정하지 않은 경우). 한국 형법에는 이런 2분류가 없으므로 '중범죄·경범죄'로 옮기되 기준이 법정형이라는 점을 함께 적습니다.", "examples": {"easy": {"en": "Theft can be a felony.", "ko": "절도는 중범죄일 수 있다."}, "practice": {"en": "One of the charges is a felony, and the other two are misdemeanors.", "ko": "공소사실 중 하나는 중범죄이고 나머지 둘은 경범죄다."}, "source": {"en": "less than five years but more than one year, as a Class E felony; (6) one year or less but more than six months, as a Class A misdemeanor;", "ko": "5년 미만 1년 초과이면 E급 중범죄로, (6) 1년 이하 6개월 초과이면 A급 경범죄로 [분류한다]", "cite": "18 U.S.C. § 3559(a)(5)–(6)", "url": "https://www.law.cornell.edu/uscode/text/18/3559", "glossary": {"Class E felony": "E급 중범죄(A~E 다섯 등급 중 가장 가벼움)", "more than / less than": "초과 / 미만"}}}, "grammar": {"axis": "G2", "title": "one of the + 복수, 동사는 단수", "wrong": "One of the charge are a felony.", "right": "One of the charges is a felony.", "note": "여럿 중 하나이므로 charges(복수), 주어는 one이므로 is(단수). felony의 복수는 felonies."}, "collocations": ["commit a felony", "be charged with a misdemeanor", "felony conviction", "convicted felon (중범죄 전과자)"], "links": [{"label": "LII Wex — felony", "url": "https://www.law.cornell.edu/wex/felony"}, {"label": "LII Wex — misdemeanor", "url": "https://www.law.cornell.edu/wex/misdemeanor"}]}, {"id": "mens-rea", "hw": "mens rea · actus reus", "ipa": "ˌmenz ˈriː.ə · ˌæk.təs ˈreɪ.əs", "stress": "mens **re**·a · ac·tus **re**·us", "stars": 2, "gloss": "범의(범죄의 정신적 요소) · 범죄행위(범죄의 객관적 요소)", "diff": "라틴어로 '죄 있는 마음'과 '죄 있는 행위'입니다. 영미 형법은 범죄를 이 둘로 나누어 분석하며, 한국 형법학의 고의·과실(주관적 구성요건)과 실행행위(객관적 구성요건)에 대략 대응하지만 체계가 같지는 않습니다. 라틴어 표현은 17장에서 다시 복습합니다(→ 17장).", "examples": {"easy": {"en": "There was no mens rea.", "ko": "범의가 없었다."}, "practice": {"en": "The prosecution must prove that he acted with intent to kill.", "ko": "검찰은 그가 살해할 의도를 가지고 행동했음을 증명해야 한다."}}, "pitfalls": ["mens를 '남성(men)'으로 읽기 — 라틴어 mens는 '마음'"], "grammar": {"axis": "G4", "title": "with intent to + 동사", "wrong": "He acted by intent to kill.", "right": "He acted with intent to kill.", "note": "의도를 '가지고'는 with. Lafler 사건(→ 「명판결 명문장」)의 죄명도 assault with intent to murder였습니다."}, "collocations": ["with intent to", "criminal intent", "guilty mind (mens rea의 영어 풀이)"], "links": [{"label": "LII Wex — mens rea", "url": "https://www.law.cornell.edu/wex/mens_rea"}, {"label": "LII Wex — actus reus", "url": "https://www.law.cornell.edu/wex/actus_reus"}]}, {"id": "self-defense", "hw": "self-defense", "ipa": "ˌself.dɪˈfens", "stress": "self-de·**fense**", "stars": 2, "uk": "self-defence (영국 철자)", "gloss": "정당방위", "diff": "요건은 주마다 다릅니다. 안전하게 피할 수 있으면 치명적 무력을 쓰기 전에 먼저 물러나야 한다는 duty to retreat 법을 둔 주는 약 3분의 1입니다(LII Wex의 대략값, 2026년 5월 검토 기준인 2차 자료). 그런 주에도 자기 집·직장·차 안에서는 물러날 의무가 없다는 예외(castle doctrine 등)가 있고, 반대로 물러날 수 있어도 방어를 허용하는 stand-your-ground 법리를 택한 주들이 있습니다. 한국 형법 제21조의 정당방위와 요건 구조가 다릅니다.", "examples": {"easy": {"en": "She said it was self-defense.", "ko": "그녀는 정당방위였다고 말했다."}, "practice": {"en": "The defense argued that the defendant acted in self-defense.", "ko": "변호인은 피고인이 정당방위로 행동했다고 주장했다."}}, "grammar": {"axis": "G4", "title": "in self-defense — 관사 없이 in", "wrong": "He acted for a self-defense.", "right": "He acted in self-defense.", "note": "'정당방위로'는 in self-defense가 고정 표현입니다. 주장한다는 claim self-defense."}, "collocations": ["act in self-defense", "claim self-defense", "duty to retreat (물러설 의무)", "stand-your-ground law"], "links": [{"label": "LII Wex — self-defense", "url": "https://www.law.cornell.edu/wex/self-defense"}, {"label": "LII Wex — duty to retreat", "url": "https://www.law.cornell.edu/wex/duty_to_retreat"}]}, {"id": "acquit", "hw": "acquit · acquittal", "ipa": "əˈkwɪt · əˈkwɪt̬.əl", "stress": "ac·**quit** · ac·**quit**·tal", "stars": 3, "gloss": "무죄를 선고하다 · 무죄 (평결·판결)", "pron_tip": "c는 소리 나지 않고 qu가 /kw/입니다. 강세는 둘째 음절 -quit.", "examples": {"easy": {"en": "The jury acquitted him.", "ko": "배심은 그에게 무죄 평결을 했다."}, "practice": {"en": "She was acquitted of all charges after a two-week trial.", "ko": "그녀는 2주간의 재판 끝에 모든 공소사실에 대해 무죄를 선고받았다."}, "source": {"en": "the court on the defendant's motion must enter a judgment of acquittal of any offense for which the evidence is insufficient to sustain a conviction.", "ko": "법원은 피고인의 신청에 따라, 증거가 유죄 판결을 유지하기에 부족한 범죄에 대하여 무죄 판결을 하여야 한다.", "cite": "Fed. R. Crim. P. 29(a)", "url": "https://www.law.cornell.edu/rules/frcrmp/rule_29", "glossary": {"sustain": "(판결을) 유지하다, 뒷받침하다", "judgment of acquittal": "(증거 부족을 이유로) 판사가 내리는 무죄 판결. 이 조항은 배심에 넘기기 전 단계이고, 배심이 유죄 평결을 한 뒤에도 할 수 있다(Rule 29(c)(2))"}}}, "box": "미국에서 무죄 평결이 나오면 검사는 상소할 수 없습니다(→ 이 장 double jeopardy). 한국은 검사가 무죄 판결에 항소할 수 있다는 점이 크게 다릅니다.", "grammar": {"axis": "G7", "title": "be acquitted of + 죄명", "wrong": "She was acquitted from all charges.", "right": "She was acquitted of all charges.", "note": "무죄를 선고받은 죄목은 of로 받습니다. 유죄도 같은 짝입니다(be convicted of)."}, "collocations": ["be acquitted of", "win an acquittal", "motion for a judgment of acquittal"], "links": [{"label": "LII Wex — acquittal", "url": "https://www.law.cornell.edu/wex/acquittal"}]}, {"id": "convict", "hw": "convict · conviction", "ipa": "kənˈvɪkt · ˈkɑːn.vɪkt · kənˈvɪk.ʃən", "stress": "con·**vict** (동사) · **con**·vict (명사) · con·**vic**·tion", "stars": 3, "false_friend": true, "gloss": "유죄 판결을 하다 · 기결수(명사) · 유죄 판결", "pron_tip": "동사는 뒤에, 명사는 앞에 강세가 옵니다. record(명사 REC-ord / 동사 re-CORD)와 같은 원리입니다.", "diff": "명사 convict는 '유죄 판결'이 아니라 '복역 중인 기결수·전과자'라는 사람입니다. 유죄 판결은 conviction. conviction은 일상어로 '확신, 신념'이라 문맥으로 가립니다.", "examples": {"easy": {"en": "He was convicted of robbery.", "ko": "그는 강도죄로 유죄 판결을 받았다."}, "practice": {"en": "The appeals court reversed the conviction because of an error in the jury instructions.", "ko": "항소법원은 배심 설시의 잘못을 이유로 유죄 판결을 파기했다."}, "source": {"en": "In the judgment of conviction, the court must set forth the plea, the jury verdict or the court's findings, the adjudication, and the sentence.", "ko": "유죄 판결서에 법원은 답변, 배심 평결 또는 법원의 사실인정, 판정 및 형을 적어야 한다.", "cite": "Fed. R. Crim. P. 32(k)(1)", "url": "https://www.law.cornell.edu/rules/frcrmp/rule_32", "glossary": {"set forth": "기재하다", "adjudication": "판정(유무죄 결론)"}}}, "pitfalls": ["'an escaped convict'를 '탈출한 유죄 판결'로 옮기기 — '탈옥수'", "'his conviction'을 문맥 없이 '그의 신념'으로 옮기기"], "grammar": {"axis": "G7", "title": "be convicted of + 죄명", "wrong": "He was convicted for robbery.", "right": "He was convicted of robbery.", "note": "죄명은 of가 표준입니다. 'conviction for robbery'처럼 명사 뒤에서는 for도 씁니다."}, "collocations": ["be convicted of", "prior conviction (전과)", "overturn / reverse a conviction", "wrongful conviction (오판)"], "links": [{"label": "LII Wex — conviction", "url": "https://www.law.cornell.edu/wex/conviction"}]}, {"id": "hung-jury", "hw": "hung jury · mistrial", "ipa": "ˌhʌŋ ˈdʒʊr.i · ˈmɪs.traɪ.əl", "stress": "hung **ju**·ry · **mis**·tri·al", "stars": 2, "gloss": "평결불능 배심 · 심리무효(재판을 무효로 끝냄)", "diff": "연방 형사 평결은 만장일치여야 합니다(Rule 31(a)). 배심이 끝내 의견을 모으지 못하면(hung jury) 판사는 mistrial을 선언하고, 검사는 다시 재판할 수 있습니다. mistrial은 '오심'이 아닙니다.", "examples": {"easy": {"en": "The jury was hung.", "ko": "배심은 평결에 이르지 못했다."}, "practice": {"en": "After four days of deliberations, the judge declared a mistrial.", "ko": "나흘간의 평의 끝에 판사는 심리무효를 선언했다."}, "source": {"en": "If the jury cannot agree on a verdict on one or more counts, the court may declare a mistrial on those counts. The government may retry any defendant on any count on which the jury could not agree.", "ko": "배심이 하나 이상의 죄목에 대해 평결에 합의하지 못하면 법원은 그 죄목에 대해 심리무효를 선언할 수 있다. 검찰은 배심이 합의하지 못한 죄목에 대해 피고인을 다시 재판할 수 있다.", "cite": "Fed. R. Crim. P. 31(b)(3)", "url": "https://www.law.cornell.edu/rules/frcrmp/rule_31", "glossary": {"count": "(공소사실의) 죄목", "retry": "다시 재판하다"}}}, "pitfalls": ["mistrial을 '오심'으로 옮기기 — 판결이 틀린 것이 아니라 재판이 결론 없이 끝난 것"], "grammar": {"axis": "G6", "title": "declare a mistrial", "wrong": "The judge made a mistrial.", "right": "The judge declared a mistrial.", "note": "심리무효는 판사가 '선언'하므로 declare와 짝을 이룹니다. 평결은 reach / return a verdict."}, "collocations": ["declare a mistrial", "move for a mistrial", "deadlocked jury (= hung jury)"], "links": [{"label": "LII Wex — hung jury", "url": "https://www.law.cornell.edu/wex/hung_jury"}, {"label": "LII Wex — mistrial", "url": "https://www.law.cornell.edu/wex/mistrial"}]}, {"id": "double-jeopardy", "hw": "double jeopardy", "ipa": "ˌdʌb.əl ˈdʒep.ɚ.di", "stress": "dou·ble **jeop**·ar·dy", "stars": 2, "gloss": "이중위험 금지(같은 범죄로 두 번 재판받지 않을 권리)", "pron_tip": "jeopardy의 o는 소리 나지 않습니다. /ˈdʒep.ɚ.di/ — jep으로 시작합니다.", "diff": "한국 헌법 제13조 제1항의 일사부재리와 비슷하지만 범위가 다릅니다. 미국에서는 배심이 무죄 평결을 하면 검사가 상소할 수 없습니다. 한국은 판결이 확정되기 전이면 검사가 무죄 판결에 상소할 수 있습니다.", "examples": {"easy": {"en": "Double jeopardy protects him.", "ko": "이중위험 금지가 그를 보호한다."}, "practice": {"en": "Because he was acquitted, double jeopardy bars a second prosecution for the same crime.", "ko": "그가 무죄 판결을 받았으므로 같은 범죄로 다시 기소하는 것은 이중위험 금지에 막힌다."}, "source": {"en": "nor shall any person be subject for the same offense to be twice put in jeopardy of life or limb;", "ko": "누구든지 같은 범죄로 생명이나 신체에 대한 위험에 두 번 처해지지 아니한다", "cite": "U.S. Const. amend. V", "url": "https://www.law.cornell.edu/constitution/fifth_amendment", "glossary": {"jeopardy": "위험(처벌받을 위험)", "life or limb": "생명이나 신체(옛 표현)"}}}, "grammar": {"axis": "G3", "title": "jeopardy는 셀 수 없다", "wrong": "a double jeopardy / jeopardies", "right": "Double jeopardy bars the retrial.", "note": "원칙의 이름으로 쓰므로 관사 없이 씁니다. 동사 bar는 '막다' — be barred by double jeopardy."}, "collocations": ["Double Jeopardy Clause", "be barred by double jeopardy", "put in jeopardy"], "links": [{"label": "LII Wex — double jeopardy", "url": "https://www.law.cornell.edu/wex/double_jeopardy"}]}, {"id": "sentence", "hw": "sentence · sentencing", "ipa": "ˈsen.təns · ˈsen.tən.sɪŋ", "stress": "**sen**·tence · **sen**·tenc·ing", "stars": 3, "false_friend": true, "gloss": "형, 형을 선고하다 · 양형(형을 정하는 절차)", "diff": "일상어로는 '문장'입니다. 미국에서는 유죄 평결(또는 유죄 답변) 뒤에 날짜를 따로 잡아 sentencing hearing(양형 기일)을 엽니다. 한국처럼 유무죄와 형을 한 판결에서 함께 선고하는 구조와 다릅니다.", "examples": {"easy": {"en": "He got a long sentence.", "ko": "그는 무거운 형을 받았다."}, "practice": {"en": "One of the defendants was sentenced to five years in prison.", "ko": "피고인 중 한 명은 징역 5년을 선고받았다."}, "source": {"en": "The court shall impose a sentence sufficient, but not greater than necessary, to comply with the purposes set forth in paragraph (2) of this subsection.", "ko": "법원은 이 항 제2호에 정한 목적을 이루기에 충분하되 필요한 정도를 넘지 않는 형을 선고하여야 한다.", "cite": "18 U.S.C. § 3553(a)", "url": "https://www.law.cornell.edu/uscode/text/18/3553", "glossary": {"impose a sentence": "형을 선고하다(과하다)", "not greater than necessary": "필요한 정도를 넘지 않는"}}}, "box": "미국 연방 판사가 형을 정할 때 가장 먼저 인용하는 조문이 18 U.S.C. § 3553(a)입니다. '충분하되 필요 이상은 아닌(sufficient, but not greater than necessary)' 형이라는 구절은 이른바 절약 조항(parsimony clause)으로 불립니다.", "grammar": {"axis": "G7", "title": "be sentenced to + 형", "wrong": "He sentenced five years.", "right": "He was sentenced to five years in prison.", "note": "형은 받는 것이므로 수동태, 형량은 to로 잇습니다. 능동이면 The judge sentenced him to five years."}, "collocations": ["be sentenced to", "impose a sentence", "serve a sentence (복역하다)", "sentencing hearing (양형 기일)"], "links": [{"label": "LII Wex — sentence", "url": "https://www.law.cornell.edu/wex/sentence"}, {"label": "LII Wex — sentencing", "url": "https://www.law.cornell.edu/wex/sentencing"}]}, {"id": "sentencing-guidelines", "hw": "sentencing guidelines", "ipa": "ˈsen.tən.sɪŋ ˈɡaɪd.laɪnz", "stress": "**sen**·tenc·ing **guide**·lines", "stars": 2, "gloss": "양형기준", "diff": "연방 양형기준은 미국 양형위원회(U.S. Sentencing Commission)가 만듭니다. 연방대법원은 United States v. Booker(2005)에서 이 기준을 '권고적(advisory)'이라고 했습니다. 판사는 고려해야 하지만 구속되지는 않습니다. 한국 양형기준도 구속력이 없다는 점에서 닮았습니다(→ 「한국이라면?」).", "examples": {"easy": {"en": "The guidelines are only advisory.", "ko": "양형기준은 권고일 뿐이다."}, "practice": {"en": "The guidelines recommended 46 to 57 months, but the judge imposed a lower sentence.", "ko": "양형기준은 46~57개월을 권고했지만 판사는 그보다 낮은 형을 선고했다."}, "source": {"en": "the kinds of sentence and the sentencing range established for— (A) the applicable category of offense committed by the applicable category of defendant as set forth in the guidelines—", "ko": "해당 피고인 유형이 저지른 해당 범죄 유형에 대하여 양형기준이 정한 형의 종류와 형량 범위", "cite": "18 U.S.C. § 3553(a)(4) — 양형 때 고려할 사항의 하나", "url": "https://www.law.cornell.edu/uscode/text/18/3553", "glossary": {"sentencing range": "권고 형량 범위"}}}, "grammar": {"axis": "G2", "title": "guidelines는 복수로 쓴다", "wrong": "The sentencing guidelines is advisory.", "right": "The sentencing guidelines are advisory.", "note": "연방 양형기준 체계 전체는 복수 guidelines로 말하고, 주어가 복수이니 동사도 are. 기준 하나를 가리킬 때는 단수 guideline도 됩니다(a guideline, the applicable guideline)."}, "collocations": ["guidelines range (권고 형량 범위)", "depart from the guidelines (기준을 벗어나다)", "U.S. Sentencing Commission"], "links": [{"label": "LII Wex — federal sentencing guidelines", "url": "https://www.law.cornell.edu/wex/federal_sentencing_guidelines"}, {"label": "U.S. Sentencing Commission — Guidelines", "url": "https://www.ussc.gov/guidelines"}]}, {"id": "probation-parole", "hw": "probation · parole", "ipa": "proʊˈbeɪ.ʃən · pəˈroʊl", "stress": "pro·**ba**·tion · pa·**role**", "stars": 3, "gloss": "보호관찰(형 대신 사회 안에서 감독받는 것) · 가석방(복역 중 조건부로 풀려나는 것)", "diff": "둘 다 감독관이 붙지만 시점이 다릅니다. probation은 교도소에 가는 대신 선고되는 형이고, parole은 교도소에서 일부를 복역한 뒤 풀려나는 것입니다. 미국 연방에서는 probation이 독립한 형의 한 종류입니다(18 U.S.C. § 3561). 한국의 '보호관찰'은 집행유예·가석방 등에 붙는 처분이라 1:1로 맞지 않습니다.", "examples": {"easy": {"en": "He is on probation.", "ko": "그는 보호관찰 중이다."}, "practice": {"en": "She was released on parole after serving six years of a ten-year sentence.", "ko": "그녀는 징역 10년 중 6년을 복역한 뒤 가석방되었다."}, "source": {"en": "A defendant who has been found guilty of an offense may be sentenced to a term of probation unless—", "ko": "범죄에 대하여 유죄로 인정된 피고인에게는 다음 경우가 아니면 보호관찰형을 선고할 수 있다.", "cite": "18 U.S.C. § 3561(a)", "url": "https://www.law.cornell.edu/uscode/text/18/3561", "glossary": {"a term of probation": "보호관찰 기간(형)"}}}, "box": "연방에서는 복역 뒤 감독 제도로 supervised release(18 U.S.C. § 3583)를 둡니다. 가석방(parole) 제도의 존재와 요건은 주마다 다릅니다.", "pitfalls": ["probation을 '가석방'으로 옮기기 — 가석방은 parole", "probation을 '집행유예'와 같다고 보기 — 미국 연방에서는 그 자체가 형이다"], "grammar": {"axis": "G4", "title": "on probation · on parole", "wrong": "He is in probation.", "right": "He is on probation.", "note": "감독받는 '상태'는 on으로 말합니다. be placed on probation(보호관찰에 처해지다), violate probation(준수사항을 어기다)."}, "collocations": ["be placed on probation", "violate probation / parole", "probation officer", "parole board (가석방 심사위원회)"], "links": [{"label": "LII Wex — probation", "url": "https://www.law.cornell.edu/wex/probation"}, {"label": "LII Wex — parole", "url": "https://www.law.cornell.edu/wex/parole"}]}, {"id": "suspended-sentence", "hw": "suspended sentence", "ipa": "səˌspen.dɪd ˈsen.təns", "stress": "sus·pend·ed **sen**·tence", "stars": 2, "gloss": "집행유예(형을 선고하되 집행을 미룸)", "diff": "판결에서 징역형을 선고하되 일정 기간 조건을 지키면 집행하지 않는 제도로, 구조는 한국 집행유예와 같습니다. 한국도 주문에서 「피고인을 징역 1년에 처한다. 다만 이 판결 확정일부터 2년간 위 형의 집행을 유예한다」처럼 형을 먼저 선고하고 집행만 미루며(형법 제62조 제1항 — 3년 이하 징역·금고 또는 500만원 이하 벌금을 선고할 경우 1년 이상 5년 이하 유예), 유예기간이 지나면 형 선고의 효력이 사라지고(제65조), 보호관찰·사회봉사를 붙일 수 있습니다(제62조의2). 미국에서는 이 구조가 여러 주법에 있지만 **연방법에는 없습니다.** 18 U.S.C. § 3561(a)는 probation을 선고된 징역형의 집행을 미루는 것이 아니라 그 자체로 하나의 형(sentence of probation)으로 규정하고, 중범죄 1년 이상 5년 이하 등 기간을 정합니다(같은 조 (c)). 그래서 연방 사건을 옮길 때 suspended sentence는 쓰지 않고 probation이라고 하며(→ probation), 한국 집행유예를 영어로 설명할 때는 suspended sentence가 가장 가깝습니다(→ 「한국이라면?」).", "examples": {"easy": {"en": "He got a suspended sentence.", "ko": "그는 집행유예를 받았다."}, "practice": {"en": "Her two-year sentence was suspended on condition that she stay out of trouble.", "ko": "그녀의 징역 2년형은 말썽을 일으키지 않는다는 조건으로 집행이 유예되었다."}, "source": {"en": "A defendant who has been found guilty of an offense may be sentenced to a term of probation unless", "ko": "범죄로 유죄가 인정된 피고인에게는 다음의 경우를 제외하고 보호관찰형을 선고할 수 있다 — (이하 (1)~(3)은 조문 요약) (1) A급·B급 중범죄로 피고인이 개인인 경우 (2) 보호관찰이 명시적으로 배제된 범죄 (3) 같은 때에 경미범죄가 아닌 범죄로 구금형이 함께 선고되는 경우", "cite": "18 U.S.C. § 3561(a) — 제목이 Sentence of probation(보호관찰형)이다", "url": "https://www.law.cornell.edu/uscode/text/18/3561", "glossary": {"term of probation": "보호관찰 기간", "Class A or Class B felony": "A급·B급 중범죄(18 U.S.C. § 3559 등급)"}}}, "grammar": {"axis": "G7", "title": "The sentence was suspended.", "wrong": "Her sentence suspended.", "right": "Her sentence was suspended.", "note": "형은 판사가 유예하는 대상이므로 수동태. 형용사로는 a suspended sentence."}, "collocations": ["receive a suspended sentence", "suspend a sentence", "revoke a suspended sentence (집행유예를 취소하다)"], "links": [{"label": "LII Wex — suspended sentence", "url": "https://www.law.cornell.edu/wex/suspended_sentence"}]}, {"id": "restitution", "hw": "restitution", "ipa": "ˌres.təˈtuː.ʃən", "stress": "res·ti·**tu**·tion", "stars": 2, "gloss": "(형사) 피해 배상 명령", "diff": "형사판결의 일부로 피고인에게 피해자의 손해를 갚게 하는 것입니다. 연방에서는 일정한 범죄에 대해 법원이 반드시 명해야 합니다(18 U.S.C. § 3663A). 한국의 배상명령(소송촉진 등에 관한 특례법 제25조)과 기능이 비슷하지만, 한국은 법원이 명할 수 있다는 재량 규정입니다.", "examples": {"easy": {"en": "He must pay restitution.", "ko": "그는 피해 배상금을 내야 한다."}, "practice": {"en": "The court ordered the defendant to pay $40,000 in restitution to the victims.", "ko": "법원은 피고인에게 피해자들에게 4만 달러를 배상하라고 명했다."}, "source": {"en": "the court shall order, in addition to, or in the case of a misdemeanor, in addition to or in lieu of, any other penalty authorized by law, that the defendant make restitution to the victim of the offense", "ko": "법원은 법이 허용하는 다른 형벌에 더하여(경범죄의 경우에는 더하여 또는 그에 갈음하여) 피고인이 범죄 피해자에게 배상하도록 명하여야 한다", "cite": "18 U.S.C. § 3663A(a)(1)", "url": "https://www.law.cornell.edu/uscode/text/18/3663A", "glossary": {"in lieu of": "~에 갈음하여, ~ 대신"}}}, "grammar": {"axis": "G3", "title": "restitution은 셀 수 없다", "wrong": "He paid a restitution of $40,000.", "right": "He paid $40,000 in restitution.", "note": "a를 붙이지 않습니다. 금액은 '$40,000 in restitution'으로 앞에 둡니다. make restitution(배상하다)도 관사 없이."}, "collocations": ["order restitution", "make restitution", "pay $… in restitution", "restitution order"], "links": [{"label": "LII Wex — restitution", "url": "https://www.law.cornell.edu/wex/restitution"}]}, {"id": "fine", "hw": "fine", "ipa": "faɪn", "stress": "**fine**", "stars": 2, "false_friend": true, "gloss": "벌금 · 벌금을 부과하다", "diff": "일상어로는 '좋은, 괜찮은'입니다. 형사 벌금뿐 아니라 행정상 금전 제재(한국의 과태료에 가까운 것)에도 fine을 쓰므로, 번역할 때는 근거 법령을 보고 고릅니다.", "examples": {"easy": {"en": "She paid a fine.", "ko": "그녀는 벌금을 냈다."}, "practice": {"en": "The company was fined $2 million for price-fixing.", "ko": "회사는 가격담합으로 벌금 200만 달러를 부과받았다."}, "source": {"en": "A defendant who has been found guilty of an offense may be sentenced to pay a fine.", "ko": "범죄에 대하여 유죄로 인정된 피고인에게는 벌금형을 선고할 수 있다.", "cite": "18 U.S.C. § 3571(a)", "url": "https://www.law.cornell.edu/uscode/text/18/3571"}}, "pitfalls": ["'The fine was fine.'(벌금은 적당했다)처럼 한 문장에 두 뜻이 나오면 문맥으로 가린다"], "grammar": {"axis": "G1", "title": "a fine of + 금액", "wrong": "He paid fine of $500.", "right": "He paid a fine of $500.", "note": "벌금 한 건은 셀 수 있으므로 a. 동사로 쓰면 He was fined $500(수동태)."}, "collocations": ["pay a fine", "impose a fine", "be fined $…", "a fine of $…"], "links": [{"label": "LII Wex — fine", "url": "https://www.law.cornell.edu/wex/fine"}]}, {"id": "capital-punishment", "hw": "capital punishment · death penalty", "ipa": "ˌkæp.ɪ.t̬əl ˈpʌn.ɪʃ.mənt · ˈdeθ ˌpen.əl.t̬i", "stress": "cap·i·tal **pun**·ish·ment · **death** pen·al·ty", "stars": 2, "gloss": "사형", "diff": "capital은 라틴어 caput(머리)에서 온 말로 '사형에 해당하는'이라는 뜻입니다. capital case(사형 사건), capital murder(사형 대상 살인)처럼 씁니다. 미국은 연방과 주마다 사형 존폐가 다릅니다.", "examples": {"easy": {"en": "Some states have abolished the death penalty.", "ko": "일부 주는 사형을 폐지했다."}, "practice": {"en": "The prosecution announced that it would seek the death penalty.", "ko": "검찰은 사형을 구형하겠다고 밝혔다."}, "source": {"en": "Whoever is guilty of murder in the first degree shall be punished by death or by imprisonment for life;", "ko": "1급 살인을 범한 사람은 사형 또는 종신형에 처한다.", "cite": "18 U.S.C. § 1111(b)", "url": "https://www.law.cornell.edu/uscode/text/18/1111", "glossary": {"murder in the first degree": "1급 살인(계획적 살인 등)"}}}, "pitfalls": ["capital을 '수도'나 '자본'으로 읽기"], "grammar": {"axis": "G1", "title": "the death penalty — 제도 이름에는 the", "wrong": "They abolished death penalty.", "right": "They abolished the death penalty.", "note": "제도로서의 사형은 the death penalty. capital punishment는 관사 없이 씁니다."}, "collocations": ["seek the death penalty", "abolish the death penalty", "capital case", "death row (사형수 수감동)"], "links": [{"label": "LII Wex — capital punishment", "url": "https://www.law.cornell.edu/wex/capital_punishment"}]}, {"id": "life-imprisonment", "hw": "life imprisonment", "ipa": "ˌlaɪf ɪmˈprɪz.ən.mənt", "stress": "life im·**pris**·on·ment", "stars": 2, "gloss": "종신형, 무기징역", "diff": "미국에는 가석방 가능성이 없는 종신형(life without parole)이 따로 있습니다. 한국 무기징역은 20년이 지나면 가석방 대상이 될 수 있어(형법 제72조 제1항) 그대로 옮기면 뜻이 달라질 수 있습니다.", "examples": {"easy": {"en": "He got life in prison.", "ko": "그는 종신형을 받았다."}, "practice": {"en": "He received two consecutive life sentences without the possibility of parole.", "ko": "그는 가석방 없는 종신형 두 개를 연속으로 선고받았다."}, "source": {"en": "life imprisonment, or if the maximum penalty is death, as a Class A felony;", "ko": "[법정형 상한이] 종신형이거나 사형이면 A급 중범죄로 [분류한다]", "cite": "18 U.S.C. § 3559(a)(1)", "url": "https://www.law.cornell.edu/uscode/text/18/3559"}}, "grammar": {"axis": "G2", "title": "life sentence는 셀 수 있다", "wrong": "two consecutive life sentence", "right": "two consecutive life sentences", "note": "형 하나하나를 세므로 복수형이 됩니다. 반면 life imprisonment는 셀 수 없어 a를 붙이지 않습니다."}, "collocations": ["life in prison", "life without parole (LWOP)", "consecutive / concurrent sentences (연속 / 동시 집행되는 형)"]}, {"id": "victim-impact-statement", "hw": "victim impact statement", "ipa": "ˈvɪk.təm ˈɪm.pækt ˈsteɪt.mənt", "stress": "**vic**·tim **im**·pact **state**·ment", "stars": 1, "gloss": "피해자 영향 진술(범죄가 피해자에게 끼친 영향을 양형 단계에서 진술하는 것)", "diff": "연방법은 범죄피해자에게 양형 등 공개 절차에서 진술할 권리를 줍니다(18 U.S.C. § 3771(a)(4)). 판사도 양형 전에 출석한 피해자의 말을 들어야 합니다(Fed. R. Crim. P. 32(i)(4)(B)). 한국 헌법 제27조 제5항의 피해자 진술권과 취지가 통합니다.", "examples": {"easy": {"en": "Her mother read a statement in court.", "ko": "그녀의 어머니가 법정에서 진술서를 읽었다."}, "practice": {"en": "One of the victims gave a victim impact statement at the sentencing hearing.", "ko": "피해자 중 한 명이 양형 기일에서 피해자 영향 진술을 했다."}, "source": {"en": "The right to be reasonably heard at any public proceeding in the district court involving release, plea, sentencing, or any parole proceeding.", "ko": "석방, 답변, 양형에 관한 지방법원의 모든 공개 절차 또는 모든 가석방 절차에서 합리적으로 진술할 권리", "cite": "18 U.S.C. § 3771(a)(4) — 범죄피해자의 권리", "url": "https://www.law.cornell.edu/uscode/text/18/3771", "glossary": {"be heard": "진술하다, 의견을 말하다"}}}, "grammar": {"axis": "G2", "title": "one of the victims", "wrong": "One of the victim gave a statement.", "right": "One of the victims gave a statement.", "note": "one of 뒤에는 복수명사가 옵니다. 이 장의 one of the defendants, one of the charges와 같은 틀입니다."}, "collocations": ["give / deliver a victim impact statement", "victims' rights", "the right to be heard"], "links": [{"label": "LII — 18 U.S.C. § 3771", "url": "https://www.law.cornell.edu/uscode/text/18/3771"}]}, {"id": "habeas-corpus", "hw": "habeas corpus", "ipa": "ˌheɪ.bi.əs ˈkɔːr.pəs", "stress": "ha·be·as **cor**·pus", "stars": 2, "gloss": "인신보호영장(구금이 위법하다며 석방을 구하는 절차)", "diff": "미국에서는 확정된 형사 유죄 판결에 대해서도 헌법 위반을 이유로 연방법원에 habeas를 청구할 수 있습니다(28 U.S.C. § 2254). 한국 인신보호법은 형사절차로 구속된 사람과 수형자를 대상에서 뺍니다(제2조 제1항 단서). 같은 이름으로 옮겨도 쓰임이 다릅니다. 라틴어 표현은 17장에서 복습합니다(→ 17장).", "examples": {"easy": {"en": "He filed a habeas petition.", "ko": "그는 인신보호 청원을 냈다."}, "practice": {"en": "The prisoner filed a petition for a writ of habeas corpus in federal court.", "ko": "수형자는 연방법원에 인신보호영장을 청구했다."}, "source": {"en": "shall entertain an application for a writ of habeas corpus in behalf of a person in custody pursuant to the judgment of a State court only on the ground that he is in custody in violation of the Constitution or laws or treaties of the United States.", "ko": "주 법원 판결에 따라 구금된 사람을 위한 인신보호영장 청구는 그가 미국 헌법이나 법률 또는 조약을 위반하여 구금되어 있다는 이유가 있을 때에만 심리한다.", "cite": "28 U.S.C. § 2254(a)", "url": "https://www.law.cornell.edu/uscode/text/28/2254", "glossary": {"entertain": "(청구를) 심리하다 — '즐겁게 하다'가 아니다", "in custody": "구금된"}}}, "grammar": {"axis": "G6", "title": "file a petition for a writ of habeas corpus", "wrong": "He made a habeas corpus.", "right": "He filed a petition for a writ of habeas corpus.", "note": "청원은 file, 법원의 결정은 grant / deny. 줄여서 habeas petition이라고도 합니다."}, "collocations": ["petition for a writ of habeas corpus", "grant habeas relief", "federal habeas review"], "links": [{"label": "LII Wex — habeas corpus", "url": "https://www.law.cornell.edu/wex/habeas_corpus"}]}], "corners": {"false_friend": {"title": "sentence는 문장이 아니다", "body": ["영어 시간에 sentence는 '문장'이었습니다. 법정에서 The judge handed down a sentence는 '판사가 문장을 건넸다'가 아니라 '형을 선고했다'입니다. 문법책의 '문장 성분'과 판결문의 '형의 종류'가 같은 단어입니다.", "convict도 함정입니다. 동사는 '유죄 판결을 하다'이지만 명사 convict는 판결이 아니라 사람, 곧 기결수입니다. 유죄 판결은 conviction이고, 이 말은 일상어로 '확신'이기도 합니다.", "이 장의 가짜 친구를 모으면 이렇습니다."], "table": [["sentence", "문장", "형, 형을 선고하다"], ["convict (명사)", "—(동사 convince와 헷갈리기 쉬움)", "기결수, 복역자"], ["conviction", "확신, 신념", "유죄 판결"], ["fine", "좋은, 괜찮은", "벌금"], ["capital", "수도, 자본", "사형에 해당하는(capital case)"], ["entertain", "즐겁게 하다", "(청구를) 심리하다"]], "tip": "외우는 요령: 문장에 jury·judge·prison이 함께 나오면 sentence는 '형', fine은 '벌금'부터 의심하세요."}, "drama": {"title": "12 Angry Men (1957)", "facts": ["1957년 미국 영화. 시드니 루멧의 장편 감독 데뷔작이고, 레지널드 로즈가 1954년 자신의 TV 드라마 대본을 각색했습니다. 헨리 폰다가 주연과 공동 제작을 맡았습니다.", "아버지를 살해한 혐의로 기소된 18세 소년의 재판이 끝난 뒤, 배심원 12명이 평의실에서 토론하는 과정이 영화의 거의 전부입니다.", "제30회 아카데미 시상식에서 작품상·감독상·각색상 후보에 올랐습니다."], "watch": "판사는 배심에게 합리적 의심(reasonable doubt)이 있으면 무죄(not guilty) 평결을 해야 한다고 설시합니다. 첫 예비 투표에서 11명이 유죄에 표를 던지고 8번 배심원 한 사람만 '토론부터 하자'며 버팁니다. 평결은 만장일치여야 하므로(→ hung jury) 한 사람의 의심이 방 전체를 멈춰 세웁니다. 증언 하나하나에 의심을 쌓아 가는 장면이 곧 beyond a reasonable doubt라는 기준의 해설입니다.", "terms": ["reasonable doubt", "not guilty", "verdict", "unanimous", "jury / juror", "deliberate (평의하다)"], "links": [{"label": "Wikipedia — 12 Angry Men (1957 film)", "url": "https://en.wikipedia.org/wiki/12_Angry_Men_(1957_film)"}, {"label": "YouTube — 공식 예고편 (Amazon MGM Studios)", "url": "https://www.youtube.com/watch?v=TEN-2uTi2c0"}]}, "quote": {"text": "criminal justice today is for the most part a system of pleas, not a system of trials", "ko": "오늘날 형사사법은 대체로 재판의 체계가 아니라 유죄 답변의 체계다", "case": "Lafler v. Cooper, 566 U.S. 156 (2012)", "decided": "2012. 3. 21. 선고", "gloss": {"for the most part": "대체로, 대부분", "plea": "(유죄) 답변 — 여기서는 유죄협상으로 끝나는 사건"}, "why": "피고인은 변호인의 잘못된 조언(피해자가 허리 아래를 맞았으니 살인 의도는 증명되지 않는다)을 믿고 51~85개월 형을 권고받는 유죄협상을 거절했다가, 재판에서 유죄가 되어 185~360개월 형을 받았습니다. 공정한 재판을 받았으니 문제없다는 주장에 대해 케네디 대법관은 5 대 4 법정의견에서 이 문장을 썼습니다. 바로 뒤에서 연방 유죄 판결의 97%, 주 유죄 판결의 94%가 유죄 답변의 결과라고 적었습니다. 그래서 변호인의 조력을 받을 권리는 유죄협상 단계에도 미친다는 결론이 나왔습니다.", "links": [{"label": "LII — Lafler v. Cooper 판결 원문", "url": "https://www.law.cornell.edu/supremecourt/text/10-209"}, {"label": "Oyez — 사건 개요·구두변론", "url": "https://www.oyez.org/cases/2011/10-209"}]}, "korea": {"title": "한국의 양형기준은?", "us": "미국 연방 양형기준은 미국 양형위원회가 만들고, United States v. Booker(2005) 이후 권고적입니다. 판사는 기준을 고려하되 벗어날 수 있고, 벗어나면 이유를 설명해야 합니다(18 U.S.C. § 3553(c)).", "kr": "한국은 대법원에 양형위원회를 두어 양형기준을 정합니다(법원조직법 제81조의2). 법관은 형을 정할 때 양형기준을 '존중하여야' 하지만 양형기준은 '법적 구속력을 갖지 아니한다'(제81조의7 제1항). 기준을 벗어나면 판결서에 양형의 이유를 적어야 합니다(같은 조 제2항, 약식절차·즉결심판은 제외). 구속력은 없되 이유 기재로 통제한다는 구조가 미국 연방과 닮았습니다.", "say": "The Sentencing Commission of Korea sets sentencing guidelines. They are not legally binding, but a judge who departs from them must state the reasons in the judgment, except in summary proceedings.", "say_ko": "한국은 양형위원회가 양형기준을 정합니다. 양형기준에 법적 구속력은 없지만, 기준을 벗어나는 판사는 판결서에 그 이유를 적어야 합니다(약식절차·즉결심판은 예외)."}}, "quiz": [{"q": "교도소에서 형의 일부를 복역한 뒤 조건부로 풀려나는 것은?", "options": ["probation", "parole", "acquittal", "restitution"], "answer": 1, "why": "probation은 교도소 대신 선고되는 보호관찰, parole은 복역 뒤의 가석방입니다. acquittal은 무죄, restitution은 피해 배상입니다."}, {"q": "'He is an escaped convict.'에서 convict의 뜻은?", "options": ["유죄 판결", "기결수", "확신"], "answer": 1, "why": "명사 convict는 사람(기결수)입니다. escaped convict는 탈옥수. 유죄 판결은 conviction."}, {"q": "배심이 평결에 이르지 못해 판사가 재판을 결론 없이 끝내는 것은?", "options": ["acquittal", "mistrial", "conviction", "sentencing"], "answer": 1, "why": "hung jury(평결불능)이면 판사가 mistrial을 선언하고, 검사는 다시 재판할 수 있습니다(Fed. R. Crim. P. 31(b)(3)). mistrial은 '오심'이 아닙니다."}, {"q": "문법: 빈칸에 맞는 것은? — One of the defendants was sentenced ____ ten years in prison.", "options": ["for", "to", "at"], "answer": 1, "why": "형량은 be sentenced to로 잇습니다. 형은 받는 것이므로 수동태(was sentenced)이고, one of 뒤의 defendants는 복수입니다.", "grammar": "G4"}, {"q": "번역해 보세요: She was acquitted of all charges.", "options": ["그녀는 모든 공소사실에 대해 유죄 판결을 받았다.", "그녀는 모든 공소사실에 대해 무죄를 선고받았다.", "그녀는 모든 혐의를 인정했다."], "answer": 1, "why": "acquit = 무죄를 선고하다, be acquitted of + 죄명. 유죄는 be convicted of, 혐의 인정은 plead guilty."}]}, {"chapter": {"num": 8, "title": "계약", "subtitle": "shall의 무게", "title_en": "Contracts — The Weight of Shall", "lead": "영미 계약법은 청약과 승낙, 그리고 약인(consideration)에서 출발합니다. 계약서를 펴면 shall·may·must가 문장마다 나오고, 이 조동사 하나가 의무인지 재량인지를 가릅니다. 이 장은 계약이 맺어지고, 깨지고, 구제받는 과정의 말을 다룹니다.", "can_say": [{"en": "The parties entered into a contract last year.", "ko": "당사자들은 작년에 계약을 체결했습니다."}, {"en": "The seller breached the contract by delivering late.", "ko": "매도인은 늦게 인도하여 계약을 위반했습니다."}, {"en": "Under the contract, the buyer shall pay within 30 days.", "ko": "계약에 따르면 매수인은 30일 안에 대금을 지급해야 합니다."}]}, "entries": [{"id": "contract", "hw": "contract · agreement", "ipa": "ˈkɑːn.trækt · əˈɡriː.mənt", "stress": "**con**·tract · a·**gree**·ment", "stars": 3, "gloss": "계약 · 합의(계약)", "pron_tip": "명사 contract는 첫음절 강세(CON-tract)입니다. 동사로 '계약하다·수축하다'라고 쓸 때는 둘째 음절에 강세를 두는 경우가 많습니다.", "diff": "일상에서는 둘을 섞어 씁니다. UCC는 agreement를 '당사자 사이의 사실상 합의', contract를 '그 합의에서 생기는 법적 의무 전체'로 나눕니다(§ 1-201(b)(3)·(12)). 한국어로는 보통 둘 다 '계약'으로 옮깁니다.", "examples": {"easy": {"en": "We signed a contract last week.", "ko": "우리는 지난주에 계약서에 서명했다."}, "practice": {"en": "The two companies entered into a supply agreement in 2024.", "ko": "두 회사는 2024년에 공급계약을 체결했다."}, "source": {"en": "means the total legal obligation that results from the parties' agreement as determined by the Uniform Commercial Code as supplemented by any other applicable laws", "ko": "(계약이란) 당사자의 합의에서 생기는 법적 의무 전체로서, 통일상법전과 그 밖의 적용 법률에 따라 정해지는 것을 말한다", "cite": "U.C.C. § 1-201(b)(12)", "url": "https://www.law.cornell.edu/ucc/1/1-201", "glossary": {"as supplemented by": "~로 보충되는", "obligation": "의무, 채무"}}}, "grammar": {"axis": "G6", "title": "계약은 enter into와 짝을 이룬다", "wrong": "The parties made into a contract.", "right": "The parties entered into a contract.", "note": "'체결하다'는 enter into(격식), sign, conclude. make a contract도 되지만 계약서 문구에는 enter into가 자주 나옵니다. into를 빠뜨린 enter a contract는 어색하게 들립니다."}, "collocations": ["enter into a contract", "breach a contract", "under the contract (계약에 따라)", "written / oral contract"], "links": [{"label": "LII Wex — contract", "url": "https://www.law.cornell.edu/wex/contract"}, {"label": "LII Wex — agreement", "url": "https://www.law.cornell.edu/wex/agreement"}]}, {"id": "ucc", "hw": "UCC Article 2 · sale of goods", "ipa": "ˌjuː.siːˈsiː ˈɑːr.t̬ɪ.kəl tuː · seɪl əv ɡʊdz", "stress": "U·C·**C** **Ar**·ti·cle **two** · **sale** of **goods**", "stars": 2, "pron_tip": "UCC는 발음 사전(Cambridge US) 미수록이라 미국 법조 관행 발음으로 적었습니다.", "gloss": "통일상법전 제2편 · 물품매매", "diff": "UCC는 연방법이 아닙니다. 민간 단체(ULC·ALI)가 만든 모범 법안을 각 주가 받아들인 주법이고, Wex에 따르면 모든 주와 컬럼비아 특별구가 어떤 형태로든 채택했습니다. 제2편은 물품(goods) 매매에만 적용되고, 용역·부동산 계약은 판례법(common law)이 다룹니다.", "examples": {"easy": {"en": "A used car counts as goods.", "ko": "중고차는 물품에 해당한다."}, "practice": {"en": "Because the deal is a sale of goods, the UCC governs the dispute.", "ko": "이 거래는 물품매매이므로 분쟁에는 UCC가 적용된다."}, "source": {"en": "Unless the context otherwise requires, this Article applies to transactions in goods", "ko": "문맥상 달리 보아야 하는 경우가 아니면, 이 편은 물품 거래에 적용된다", "cite": "U.C.C. § 2-102", "url": "https://www.law.cornell.edu/ucc/2/2-102", "glossary": {"unless the context otherwise requires": "문맥상 달리 보아야 할 경우가 아니면(정의 조항의 단골 문구)"}}}, "pitfalls": ["물품 하나를 a good이라고 쓰기 — goods(물품)는 늘 복수형, 하나는 an item·a product"], "grammar": {"axis": "G1", "title": "법전에는 the, 편 번호에는 관사 없음", "wrong": "UCC applies. / the Article 2", "right": "The UCC applies. / Article 2 of the UCC", "note": "고유한 법전·법률 이름에는 the(the UCC, the Sherman Act). 번호가 붙은 편·조는 이름처럼 관사 없이 씁니다(Article 2, Section 2-201)."}, "collocations": ["governed by the UCC", "merchant (상인 — UCC에 특칙이 있다)", "goods (물품, 늘 복수)"], "links": [{"label": "LII Wex — Uniform Commercial Code", "url": "https://www.law.cornell.edu/wex/uniform_commercial_code"}, {"label": "LII — UCC Article 2", "url": "https://www.law.cornell.edu/ucc/2"}]}, {"id": "offer", "hw": "offer · acceptance", "ipa": "ˈɑː.fɚ · əkˈsep.təns", "stress": "**of**·fer · ac·**cep**·tance", "stars": 3, "gloss": "청약 · 승낙", "diff": "판례법에는 승낙이 청약 내용과 똑같아야 한다는 '거울상 원칙(mirror image rule)'이 있었고, Wex에 따르면 UCC가 적용되는 물품매매에는 이 원칙이 적용되지 않습니다. 한국 민법은 조건을 붙이거나 변경을 가한 승낙을 청약 거절과 새 청약으로 봅니다(제534조). 비슷하지만 같은 제도는 아닙니다.", "examples": {"easy": {"en": "She accepted the offer.", "ko": "그녀는 청약을 승낙했다."}, "practice": {"en": "The buyer made an offer by e-mail, and the seller accepted it the next day.", "ko": "매수인이 이메일로 청약을 했고, 매도인은 다음 날 승낙했다."}, "source": {"en": "Unless otherwise unambiguously indicated by the language or circumstances (a) an offer to make a contract shall be construed as inviting acceptance in any manner and by any medium reasonable in the circumstances", "ko": "문언이나 사정에서 달리 명확하게 나타나지 않는 한, (a) 계약 체결의 청약은 그 상황에서 합리적인 모든 방법과 수단에 의한 승낙을 유인하는 것으로 해석된다", "cite": "U.C.C. § 2-206(1)(a)", "url": "https://www.law.cornell.edu/ucc/2/2-206", "glossary": {"construe": "해석하다", "medium": "(전달) 수단 — 우편·이메일 등"}}}, "grammar": {"axis": "G6", "title": "make / accept / reject an offer", "wrong": "The buyer did an offer.", "right": "The buyer made an offer. The seller accepted (rejected) it.", "note": "청약을 '하다'는 make. 철회는 revoke(withdraw) an offer. 동사 offer도 그대로 씁니다(offer to sell)."}, "collocations": ["make an offer", "accept / reject an offer", "revoke an offer (청약을 철회하다)", "counteroffer (반대청약)"], "links": [{"label": "LII Wex — offer", "url": "https://www.law.cornell.edu/wex/offer"}, {"label": "LII Wex — acceptance", "url": "https://www.law.cornell.edu/wex/acceptance"}, {"label": "LII Wex — mirror image rule", "url": "https://www.law.cornell.edu/wex/mirror_image_rule"}]}, {"id": "consideration", "hw": "consideration", "ipa": "kənˌsɪd.əˈreɪ.ʃən", "stress": "con·sid·er·**a**·tion", "stars": 3, "false_friend": true, "gloss": "약인(約因) — 계약이 구속력을 갖게 하는 대가", "diff": "영미 판례법에서는 서로 무언가를 주고받아야(대가 교환) 약속이 계약으로 강제됩니다. 한국 민법에는 이 요건이 없습니다. 증여처럼 대가 없는 계약도 의사표시와 승낙만으로 효력이 생깁니다(제554조).", "examples": {"easy": {"en": "There was no consideration for the promise.", "ko": "그 약속에는 약인이 없었다."}, "practice": {"en": "In consideration of $10,000, the seller agrees to transfer the software license.", "ko": "1만 달러를 대가로 매도인은 소프트웨어 라이선스를 이전하기로 한다."}, "source": {"en": "An agreement modifying a contract within this Article needs no consideration to be binding.", "ko": "이 편이 적용되는 계약을 변경하는 합의는 약인 없이도 구속력이 있다.", "cite": "U.C.C. § 2-209(1)", "url": "https://www.law.cornell.edu/ucc/2/2-209", "glossary": {"modify": "변경하다", "binding": "구속력 있는"}}}, "box": "판례법에서는 이미 맺은 계약의 내용을 바꾸는 합의에도 새 약인이 필요하다는 원칙(pre-existing duty rule)이 있었습니다. UCC § 2-209(1)은 물품매매에서 이 요건을 없앴습니다. 조문 한 줄이 판례법 원칙을 고쳐 쓴 예입니다.", "grammar": {"axis": "G4", "title": "in consideration of — '~을 대가로'", "wrong": "For consideration with $100, ...", "right": "In consideration of $100, ...", "note": "계약서 첫머리의 단골 문구입니다. in consideration of A = A를 대가로. 일상어 take ~ into consideration(고려하다)과 헷갈리지 않게 합니다."}, "collocations": ["in consideration of", "for good and valuable consideration (계약서 상투 문구)", "lack of consideration (약인 흠결)"], "links": [{"label": "LII Wex — consideration", "url": "https://www.law.cornell.edu/wex/consideration"}]}, {"id": "counterparty", "hw": "counterparty", "ipa": "ˈkaʊn.t̬ɚˌpɑːr.t̬i", "stress": "**coun**·ter·par·ty", "stars": 2, "pron_tip": "counterparty는 발음 사전(Cambridge US) 미수록이라 미국 법조 관행 발음으로 적었습니다.", "gloss": "(계약의) 상대방, 거래 상대방", "diff": "party(당사자) 자체는 3장에서 다뤘습니다. counterparty는 '내 쪽에서 본 상대 당사자'로, 금융·M&A 계약에서 자주 씁니다. 소송의 상대방은 opposing party라고 합니다.", "examples": {"easy": {"en": "Our counterparty wants more time.", "ko": "상대방이 시간을 더 달라고 한다."}, "practice": {"en": "Both counterparties must sign the amendment before it takes effect.", "ko": "변경 계약은 양쪽 상대방이 모두 서명해야 효력이 생긴다."}}, "grammar": {"axis": "G2", "title": "-y로 끝나면 복수는 -ies", "wrong": "two counterpartys / one of the counterparty", "right": "two counterparties / one of the counterparties", "note": "자음 + y는 y를 i로 바꾸고 -es. one of 뒤에는 복수(→ 3장 party)."}, "collocations": ["counterparty risk (거래 상대방 위험)", "party to the contract (→ 3장)", "opposing party (소송 상대방)"]}, {"id": "breach", "hw": "breach", "ipa": "briːtʃ", "stress": "**breach**", "stars": 3, "gloss": "(계약·의무의) 위반 · 위반하다", "pron_tip": "breach(위반)와 breech(포신의 약실, 둔위)는 발음이 같습니다. 철자로만 구별합니다.", "examples": {"easy": {"en": "The seller breached the contract.", "ko": "매도인이 계약을 위반했다."}, "practice": {"en": "The company is in breach of its payment obligations.", "ko": "회사는 대금 지급 의무를 위반한 상태다."}, "source": {"en": "No delegation of performance relieves the party delegating of any duty to perform or any liability for breach.", "ko": "이행을 위임하였다고 하여 위임한 당사자가 이행 의무나 위반 책임을 면하지 않는다.", "cite": "U.C.C. § 2-210(1)", "url": "https://www.law.cornell.edu/ucc/2/2-210", "glossary": {"delegation": "(의무 이행의) 위임", "relieve A of B": "A에게서 B를 면하게 하다"}}}, "grammar": {"axis": "G4", "title": "be in breach of — 상태는 전치사 in", "wrong": "The company is on breach of the contract.", "right": "The company is in breach of the contract.", "note": "동사로는 breach the contract(목적어 바로). '위반 상태에 있다'는 be in breach of. 명사구 breach of contract는 관용적으로 관사 없이 씁니다."}, "collocations": ["breach of contract", "be in breach of", "cure a breach (위반을 치유하다)", "anticipatory breach (이행기 전 이행거절)"], "links": [{"label": "LII Wex — breach of contract", "url": "https://www.law.cornell.edu/wex/breach_of_contract"}]}, {"id": "material-breach", "hw": "material breach", "ipa": "məˈtɪr.i.əl briːtʃ", "stress": "ma·**te**·ri·al **breach**", "stars": 2, "false_friend": true, "gloss": "중대한 위반(계약 목적을 해칠 정도의 위반)", "diff": "material은 '재료·물질'이 아니라 '중요한, 실질적인'입니다. 위반이 중대하면 상대방은 자기 이행을 멈추고 계약을 끝낼 수 있고, 사소한 위반이면 손해배상만 구할 수 있다는 구별에 쓰입니다. 한국 민법의 해제 요건(제544조의 최고 후 해제 등)과는 짜임이 달라 1:1로 옮기지 않습니다.", "examples": {"easy": {"en": "Late payment was a material breach.", "ko": "대금 지연은 중대한 위반이었다."}, "practice": {"en": "Either party may terminate this Agreement if the other commits a material breach.", "ko": "상대방이 중대한 위반을 하면 어느 당사자든 이 계약을 해지할 수 있다."}, "source": {"en": "Whenever non-conformity or default with respect to one or more installments substantially impairs the value of the whole contract there is a breach of the whole.", "ko": "하나 이상의 분할 인도분에 관한 부적합이나 불이행이 계약 전체의 가치를 실질적으로 해치면 계약 전체의 위반이 된다.", "cite": "U.C.C. § 2-612(3)", "url": "https://www.law.cornell.edu/ucc/2/2-612", "glossary": {"installment": "분할 인도분", "substantially impair": "실질적으로 해치다 — material의 UCC식 표현"}}}, "grammar": {"axis": "G1", "title": "처음 말하는 위반은 a material breach", "wrong": "He committed material breach. The material breach of a contract ...", "right": "He committed a material breach of the contract.", "note": "위반 한 건은 셀 수 있으므로 a. 뒤의 contract는 이미 말한 '그 계약'이라 the."}, "collocations": ["commit a material breach", "material breach of the contract", "minor breach (경미한 위반)", "material adverse change (중대한 부정적 변화)"], "links": [{"label": "LII Wex — breach of contract", "url": "https://www.law.cornell.edu/wex/breach_of_contract"}]}, {"id": "remedy", "hw": "remedy · expectation damages", "ipa": "ˈrem.ə.di · ˌek.spekˈteɪ.ʃən ˈdæm.ɪ.dʒɪz", "stress": "**rem**·e·dy · ex·pec·**ta**·tion **dam**·a·ges", "stars": 2, "gloss": "구제(수단) · 이행이익 배상", "diff": "remedy는 위반을 당한 쪽이 법원에서 얻을 수 있는 것(손해배상, 특정이행 등)을 묶어 부르는 말입니다. 기본은 이행이익(expectation) 배상으로, 계약이 지켜졌더라면 놓였을 상태로 돌려놓는 것이 목표입니다(→ 「명판결 명문장」 Hawkins v. McGee).", "examples": {"easy": {"en": "Money is the usual remedy.", "ko": "보통의 구제 수단은 돈이다."}, "practice": {"en": "The court awarded expectation damages of $80,000.", "ko": "법원은 8만 달러의 이행이익 배상을 명했다."}, "source": {"en": "in a proper case obtain specific performance or replevy the goods as provided in this Article", "ko": "적절한 경우에는 이 편에서 정한 대로 특정이행을 받거나 물품의 인도를 청구할 수 있다", "cite": "U.C.C. § 2-711(2)(b)", "url": "https://www.law.cornell.edu/ucc/2/2-711", "glossary": {"replevy": "(점유 회복을 위해) 동산 인도를 청구하다"}}}, "grammar": {"axis": "G3", "title": "damage(손해)와 damages(배상금)", "wrong": "The court awarded a damage of $80,000.", "right": "The court awarded damages of $80,000.", "note": "법원이 인정하는 금전 배상은 늘 복수형 damages. 단수 damage는 셀 수 없는 '손해·손상'으로, 물건의 손상뿐 아니라 평판·사업상의 손해에도 씁니다(→ 4장·9장)."}, "collocations": ["seek a remedy", "award damages", "expectation / reliance / restitution (이행이익 / 신뢰이익 / 원상회복)", "cover (대체 구매 — UCC § 2-712)"], "links": [{"label": "LII Wex — remedy", "url": "https://www.law.cornell.edu/wex/remedy"}, {"label": "LII Wex — expectation damages", "url": "https://www.law.cornell.edu/wex/expectation_damages"}]}, {"id": "specific-performance", "hw": "specific performance", "ipa": "spəˈsɪf.ɪk pɚˈfɔːr.məns", "stress": "spe·**cif**·ic per·**for**·mance", "stars": 2, "gloss": "특정이행(계약 내용 그대로의 이행을 명하는 구제)", "diff": "영미법에서 특정이행은 형평법(equity)상의 예외적 구제입니다. 금전 배상으로 부족할 때, 예컨대 부동산이나 하나뿐인 물건일 때 인정됩니다(Wex). 한국 민법은 강제이행 청구를 채권자의 일반적 권리로 둡니다(제389조). 원칙과 예외가 거꾸로입니다.", "examples": {"easy": {"en": "The buyer asked for specific performance.", "ko": "매수인은 특정이행을 청구했다."}, "practice": {"en": "Specific performance was granted because the painting was one of a kind.", "ko": "그 그림은 세상에 하나뿐이어서 특정이행이 인정되었다."}, "source": {"en": "Specific performance may be decreed where the goods are unique or in other proper circumstances.", "ko": "물품이 유일한 것이거나 그 밖의 적절한 사정이 있으면 특정이행을 명할 수 있다.", "cite": "U.C.C. § 2-716(1)", "url": "https://www.law.cornell.edu/ucc/2/2-716", "glossary": {"decree": "(형평법상) 명하다, 판결하다", "unique": "유일한, 대체할 수 없는"}}}, "grammar": {"axis": "G7", "title": "구제는 수동태로 '인정된다'", "wrong": "Specific performance granted.", "right": "Specific performance was granted. / The court granted specific performance.", "note": "구제는 법원이 주는 것이므로 주어로 쓰면 수동태(be granted / be decreed). 조문에서는 may be decreed처럼 조동사와 함께 나옵니다."}, "collocations": ["seek / grant specific performance", "decree of specific performance", "injunction (금지명령)"], "links": [{"label": "LII Wex — specific performance", "url": "https://www.law.cornell.edu/wex/specific_performance"}]}, {"id": "shall", "hw": "shall · may · must", "ipa": "ʃæl · meɪ · mʌst", "stress": "**shall** · **may** · **must**", "stars": 3, "gloss": "~하여야 한다(의무) · ~할 수 있다(재량·권한) · ~하여야 한다(의무)", "diff": "계약서·법조문에서 shall은 전통적으로 의무를 나타냅니다. 그러나 문맥에 따라 '~할 수 있다'나 단순 미래로도 읽혀 다툼이 생깁니다. 그래서 연방민사소송규칙은 2007년 문체 개정에서 shall을 must·may·should로 바꿨습니다(아래 원문). 계약서에는 지금도 shall이 많이 쓰입니다.", "examples": {"easy": {"en": "The buyer shall pay within 30 days.", "ko": "매수인은 30일 안에 대금을 지급하여야 한다."}, "practice": {"en": "The seller must deliver the goods, and the buyer may inspect them before payment.", "ko": "매도인은 물품을 인도하여야 하고, 매수인은 대금 지급 전에 물품을 검사할 수 있다."}, "source": {"en": "For example, the word \"shall\" can mean \"must,\" \"may,\" or something else, depending on context. … The restyled rules replace \"shall\" with \"must,\" \"may,\" or \"should,\" depending on which one the context and established interpretation make correct in each rule.", "ko": "예컨대 shall이라는 말은 문맥에 따라 must도, may도, 그 밖의 다른 뜻도 될 수 있다. … 새 문체의 규칙은 문맥과 확립된 해석에 비추어 조문마다 맞는 말을 골라 shall을 must, may 또는 should로 바꾼다.", "cite": "Fed. R. Civ. P. 1, Committee Notes on Rules—2007 Amendment", "url": "https://www.law.cornell.edu/rules/frcp/rule_1", "glossary": {"restyled": "문체를 다듬어 다시 쓴", "established interpretation": "확립된 해석"}}}, "box": "같은 위원회 주석은 shall이 '일상 영어나 명료하게 쓴 영어에서는 더 이상 일반적으로 쓰이지 않는다'는 점도 이유로 듭니다. 이 장의 제목 「shall의 무게」가 여기서 나왔습니다. 계약서를 읽을 때는 shall이 누구의 의무를 말하는지, 주어부터 확인하세요.", "pitfalls": ["may not을 '~하지 않을 수도 있다'로 읽기 — 대개 '~해서는 안 된다'(금지), 금지를 분명히 하려면 must not", "shall을 미래 시제(~할 것이다)로 옮기기 — 의무가 사라진다"], "grammar": {"axis": "G8", "title": "의무는 shall/must, 재량은 may", "wrong": "The tenant may pay rent on the first day of each month. (의무를 뜻할 때)", "right": "The tenant must (shall) pay rent on the first day of each month.", "note": "may는 권한·재량이라 의무 조항에 쓰면 '안 내도 된다'로 읽힙니다. 조동사 뒤에는 동사원형(shall pays ✗)."}, "collocations": ["shall not (~하여서는 아니 된다)", "may, but need not (할 수 있으나 하지 않아도 된다)", "must not (금지)"], "links": [{"label": "LII Wex — shall", "url": "https://www.law.cornell.edu/wex/shall"}, {"label": "LII Wex — may", "url": "https://www.law.cornell.edu/wex/may"}]}, {"id": "hereby", "hw": "hereby · herein · whereas", "ipa": "ˌhɪrˈbaɪ · ˌhɪrˈrɪn · werˈæz", "stress": "here·**by** · here·**in** · where·**as**", "stars": 2, "gloss": "이로써 · 이 계약(문서)에서 · ~이므로(전문의 사실 기재)", "diff": "here-가 붙은 말은 '이 문서'를 가리킵니다(herein = in this agreement, hereto = to this agreement). whereas는 일상에서는 '~인 반면'이지만, 계약서 첫머리 전문(recitals)에서는 '~이므로, ~인 사정에서'라는 배경 사실을 줄줄이 적는 말입니다.", "examples": {"easy": {"en": "I hereby resign.", "ko": "이로써 사임합니다."}, "practice": {"en": "WHEREAS, the Seller owns the patent; and WHEREAS, the Buyer wishes to acquire it, the parties hereby agree as follows.", "ko": "매도인은 특허권을 보유하고 있고 매수인은 이를 취득하기를 원하므로, 당사자들은 이에 다음과 같이 합의한다."}}, "pitfalls": ["whereas 전문(recitals)에 의무를 적기 — 전문은 사정 설명일 뿐 의무를 만들지 않는다고 보는 것이 보통, 의무는 본문 조항에", "단순 설명문에 hereby 붙이기 — 그 문장 자체로 행위가 이루어질 때만(I hereby assign …), 아니면 군더더기"], "grammar": {"axis": "G8", "title": "hereby — 말하는 순간 행위가 이루어진다", "wrong": "The Seller will hereby transfer the shares next month.", "right": "The Seller hereby transfers the shares to the Buyer.", "note": "hereby는 '이 말(문서)로써' 행위가 이루어진다는 표시(Cambridge: with these words or with this action)라 보통 현재 시제와 씁니다. 다음 달에 할 일을 적는 문장에 붙이면 '지금 이 문서로'라는 뜻과 부딪칩니다."}, "collocations": ["hereby agree / assign / certify", "herein (이 계약에서)", "hereto (이 계약에)", "the parties hereto (이 계약의 당사자들)", "NOW, THEREFORE (전문 끝, 본문 시작)"]}, {"id": "reps-warranties", "hw": "representations and warranties", "ipa": "ˌrep.rɪ.zenˈteɪ.ʃənz ən ˈwɔːr.ən.t̬iz", "stress": "rep·re·sen·**ta**·tions and **war**·ran·ties", "stars": 2, "gloss": "진술 및 보장", "diff": "M&A·투자 계약에서 '이 회사에는 소송이 없다' 같은 사실을 한쪽이 확인해 주는 조항입니다. representation은 계약 시점의 사실 진술, warranty는 그 사실이 맞다는 약속이라고 구별하는 설명이 있으나, 실무에서는 한 묶음으로 씁니다. 한국 M&A 계약에서도 '진술 및 보장'이라는 번역어가 그대로 쓰입니다.", "examples": {"easy": {"en": "The seller gave several warranties.", "ko": "매도인은 몇 가지 보장을 했다."}, "practice": {"en": "The Buyer may claim indemnification if any of the Seller's representations and warranties is untrue.", "ko": "매도인의 진술 및 보장 중 어느 하나라도 사실과 다르면 매수인은 손해보전을 청구할 수 있다."}, "source": {"en": "Any affirmation of fact or promise made by the seller to the buyer which relates to the goods and becomes part of the basis of the bargain creates an express warranty that the goods shall conform to the affirmation or promise.", "ko": "매도인이 매수인에게 한 물품에 관한 사실의 확언이나 약속으로서 거래의 기초 일부가 된 것은, 물품이 그 확언이나 약속에 부합한다는 명시적 보증을 만든다.", "cite": "U.C.C. § 2-313(1)(a)", "url": "https://www.law.cornell.edu/ucc/2/2-313", "glossary": {"affirmation of fact": "사실의 확언", "basis of the bargain": "거래의 기초", "express warranty": "명시적 보증"}}}, "grammar": {"axis": "G2", "title": "조항 묶음은 복수 — 동사도 복수", "wrong": "The Seller's representations and warranties is true.", "right": "The Seller's representations and warranties are true.", "note": "여러 진술·보장 조항의 묶음을 가리킬 때는 두 명사를 모두 복수로 쓰고, 주어가 복수이니 동사도 are. 줄여서 reps and warranties 또는 R&W라고도 합니다."}, "collocations": ["make representations and warranties", "breach of warranty (보증 위반)", "express / implied warranty (명시적 / 묵시적 보증)"], "links": [{"label": "LII Wex — warranty", "url": "https://www.law.cornell.edu/wex/warranty"}]}, {"id": "indemnify", "hw": "indemnify · indemnification", "ipa": "ɪnˈdem.nə.faɪ · ɪnˌdem.nə.fəˈkeɪ.ʃən", "stress": "in·**dem**·ni·fy · in·dem·ni·fi·**ca**·tion", "stars": 2, "gloss": "(손해를) 보전하다, 면책하다 · 손해보전, 면책", "diff": "한쪽이 입을 손해를 다른 쪽이 대신 떠안겠다는 약속입니다. 보험이 가장 흔한 예입니다(Wex). '면책'으로 옮기면 책임이 없어진다는 뜻으로 오해되기 쉬워, 실무에서는 '손해보전'이나 '면책 및 손해보전'으로 풀어 옮기기도 합니다.", "examples": {"easy": {"en": "The seller will indemnify the buyer.", "ko": "매도인이 매수인의 손해를 보전한다."}, "practice": {"en": "The Licensee shall indemnify the Licensor against all third-party claims arising from its use of the software.", "ko": "실시권자는 소프트웨어 사용으로 생기는 모든 제3자 청구에 대하여 실시허락자의 손해를 보전하여야 한다."}}, "grammar": {"axis": "G4", "title": "indemnify A against / for B", "wrong": "The seller shall indemnify to the buyer from losses.", "right": "The seller shall indemnify the buyer against (for) losses.", "note": "보호받는 사람은 바로 목적어, 손해는 against 또는 for. 짝꿍 문구 hold harmless(손해를 입히지 않게 하다)와 함께 indemnify and hold harmless로 자주 씁니다."}, "collocations": ["indemnify and hold harmless", "indemnification clause", "indemnitor / indemnitee (보전의무자 / 보전받는 자)"], "links": [{"label": "LII Wex — indemnify", "url": "https://www.law.cornell.edu/wex/indemnify"}, {"label": "LII Wex — indemnity", "url": "https://www.law.cornell.edu/wex/indemnity"}]}, {"id": "force-majeure", "hw": "force majeure", "ipa": "ˌfɔːrs.mɑːˈʒɝː", "stress": "force ma·**jeure**", "stars": 2, "gloss": "불가항력(조항)", "pron_tip": "프랑스어에서 온 말이라 majeure의 j를 /ʒ/(vision의 s 소리)로 읽고, 강세는 끝 음절 -jeure에 옵니다. Cambridge 발음 페이지에 복합 표제어 force majeure의 US 발음이 실려 있습니다.", "diff": "계약서에 '천재지변·전쟁·파업 등으로 이행하지 못하면 책임을 지지 않는다'고 적는 조항입니다. Wex에 따르면 법원은 경기 침체를 대체로 불가항력으로 보지 않고, 뉴욕주처럼 조항에 적힌 사건만 인정하는 곳도 있습니다. 조항이 없을 때 UCC는 '이행 불능에 가까운 사정(impracticability)'으로 따로 판단합니다. 이 면책도 자동이 아니어서, 매도인이 더 큰 의무를 떠안지 않았어야 하고, 생산력 일부만 영향을 받으면 고객들에게 공정하게 배분하고 매수인에게 적시에 통지해야 합니다(§ 2-615 본문·(b)·(c)).", "examples": {"easy": {"en": "The flood was a force majeure event.", "ko": "그 홍수는 불가항력 사유였다."}, "practice": {"en": "The supplier invoked the force majeure clause after the port was closed.", "ko": "항구가 폐쇄되자 공급자는 불가항력 조항을 원용했다."}, "source": {"en": "Except so far as a seller may have assumed a greater obligation and subject to the preceding section on substituted performance: (a) Delay in delivery or non-delivery in whole or in part by a seller who complies with paragraphs (b) and (c) is not a breach of his duty under a contract for sale if performance as agreed has been made impracticable by the occurrence of a contingency the non-occurrence of which was a basic assumption on which the contract was made …", "ko": "매도인이 더 큰 의무를 떠안은 경우를 제외하고, 앞 조의 대체이행 규정에 따르는 것을 전제로, (a) (b)항과 (c)항을 지킨 매도인의 인도 지연이나 전부 또는 일부 불인도는, 계약 체결의 기본 전제였던 사정, 즉 일어나지 않으리라 여겼던 우발 사태가 일어나 약정대로의 이행이 실행 곤란하게 된 경우에는 매매계약상 의무 위반이 아니다 …", "cite": "U.C.C. § 2-615 본문·(a)", "url": "https://www.law.cornell.edu/ucc/2/2-615", "glossary": {"impracticable": "실행 곤란한", "contingency": "우발 사태", "basic assumption": "기본 전제"}}}, "grammar": {"axis": "G6", "title": "조항은 invoke(원용하다)와 짝", "wrong": "The supplier invoked to the force majeure clause.", "right": "The supplier invoked the force majeure clause.", "note": "계약 조항·권리를 '내세우다'는 invoke이고, 목적어를 바로 받습니다(invoke to ✗). use a force majeure clause라고도 하지만 invoke가 원용 행위를 더 분명히 말합니다. rely on도 씁니다. force majeure는 명사 앞에서 형용사처럼 씁니다(a force majeure event)."}, "collocations": ["force majeure clause / event", "invoke force majeure", "act of God (천재지변)", "beyond the reasonable control of (합리적 통제를 벗어난)"], "links": [{"label": "LII Wex — force majeure", "url": "https://www.law.cornell.edu/wex/force_majeure"}]}, {"id": "governing-law", "hw": "governing law", "ipa": "ˈɡʌv.ɚ.nɪŋ lɑː", "stress": "**gov**·ern·ing **law**", "stars": 3, "gloss": "준거법(계약에 적용할 법)", "diff": "국제 계약은 어느 나라(미국이면 어느 주) 법을 따를지 정해 둡니다. 한국 국제사법도 계약은 당사자가 선택한 법에 따른다고 정합니다(제45조 제1항). 준거법(어느 법을 적용하나)과 관할(어느 법원에서 재판하나)은 별개이니 따로 정해야 합니다(→ 14장).", "examples": {"easy": {"en": "New York law is the governing law.", "ko": "준거법은 뉴욕주법이다."}, "practice": {"en": "This Agreement shall be governed by the laws of the State of New York.", "ko": "이 계약은 뉴욕주법에 따라 규율된다."}, "source": {"en": "when a transaction bears a reasonable relation to this state and also to another state or nation the parties may agree that the law either of this state or of such other state or nation shall govern their rights and duties", "ko": "거래가 이 주와 다른 주 또는 국가 모두에 합리적인 관련이 있으면, 당사자는 이 주의 법이나 그 다른 주 또는 국가의 법 중 하나가 자신들의 권리와 의무를 규율하도록 합의할 수 있다", "cite": "U.C.C. § 1-301(a)", "url": "https://www.law.cornell.edu/ucc/1/1-301", "glossary": {"bear a reasonable relation to": "~와 합리적인 관련이 있다", "govern": "규율하다"}}}, "grammar": {"axis": "G1", "title": "the laws of the State of New York", "wrong": "governed by laws of State of New York", "right": "governed by the laws of the State of New York", "note": "특정 주의 법 전체를 가리키므로 the laws, 주 이름이 of로 이어지면 the State of. 짧게는 무관사로 New York law라고 합니다."}, "collocations": ["be governed by", "governing law clause", "choice of law (→ 14장)", "without regard to its conflict of laws principles (저촉규범은 제외하고)"], "links": [{"label": "LII Wex — governing law", "url": "https://www.law.cornell.edu/wex/governing_law"}]}, {"id": "arbitration-clause", "hw": "arbitration clause", "ipa": "ˌɑːr.bəˈtreɪ.ʃən klɑːz", "stress": "ar·bi·**tra**·tion **clause**", "stars": 2, "gloss": "중재조항", "diff": "분쟁을 법원이 아니라 중재인에게 맡기기로 미리 정한 조항입니다. 미국 연방중재법(FAA) 제2조는 서면 중재조항을 '유효하고 철회할 수 없으며 집행할 수 있다'고 정합니다. 예외는 일반 계약법상 취소 사유가 있는 경우와, 2022년 개정(Pub. L. 117–90)으로 더해진 '제4장에서 달리 정한 경우'입니다. 한국에서는 중재법이 중재합의를 다룹니다(→ 14장).", "examples": {"easy": {"en": "The contract has an arbitration clause.", "ko": "그 계약에는 중재조항이 있다."}, "practice": {"en": "Under the arbitration clause, any dispute shall be settled by arbitration in Singapore.", "ko": "중재조항에 따라 모든 분쟁은 싱가포르에서 중재로 해결한다."}, "source": {"en": "A written provision in any maritime transaction or a contract evidencing a transaction involving commerce to settle by arbitration a controversy thereafter arising out of such contract or transaction … shall be valid, irrevocable, and enforceable, save upon such grounds as exist at law or in equity for the revocation of any contract or as otherwise provided in chapter 4.", "ko": "해사 거래나 통상과 관련된 거래를 증명하는 계약에서, 그 계약이나 거래에서 장래 생기는 분쟁을 중재로 해결하기로 한 서면 조항은 … 유효하고 철회할 수 없으며 집행할 수 있다. 다만 보통법이나 형평법상 계약 취소 사유가 있는 경우 또는 제4장에서 달리 정한 경우에는 그러하지 아니하다.", "cite": "9 U.S.C. § 2", "url": "https://www.law.cornell.edu/uscode/text/9/2", "glossary": {"irrevocable": "철회할 수 없는", "save upon": "~의 경우를 제외하고", "revocation": "취소, 철회"}}}, "grammar": {"axis": "G6", "title": "분쟁은 settle / resolve by arbitration", "wrong": "The dispute shall be done by arbitration.", "right": "The dispute shall be settled (resolved) by arbitration.", "note": "분쟁을 '해결하다'는 settle, resolve. 중재에 '회부하다'는 submit (refer) a dispute to arbitration."}, "collocations": ["settle by arbitration", "submit to arbitration", "arbitral award (중재판정)", "seat of arbitration (중재지 → 14장)"], "links": [{"label": "LII Wex — arbitration", "url": "https://www.law.cornell.edu/wex/arbitration"}]}, {"id": "terminate", "hw": "terminate · termination", "ipa": "ˈtɝː.mə.neɪt · ˌtɝː.məˈneɪ.ʃən", "stress": "**ter**·mi·nate · ter·mi·**na**·tion", "stars": 2, "gloss": "(계약을) 끝내다, 해지하다 · 해지, 종료", "diff": "UCC는 위반이 아닌 사유(약정이나 법률이 준 권한)로 끝내는 것을 termination, 상대방의 위반을 이유로 끝내는 것을 cancellation이라 구별합니다(§ 2-106(3)·(4)). 한국 민법의 해지(장래효)·해제(소급효)와는 기준이 다르므로 번역할 때 사유와 효과를 함께 봅니다(→ 「한국이라면?」).", "examples": {"easy": {"en": "She terminated the lease.", "ko": "그녀는 임대차계약을 해지했다."}, "practice": {"en": "Either party may terminate this Agreement on 60 days' written notice.", "ko": "어느 당사자든 60일 전에 서면으로 통지하여 이 계약을 해지할 수 있다."}, "source": {"en": "Termination of a contract by one party except on the happening of an agreed event requires that reasonable notification be received by the other party", "ko": "약정한 사유가 생긴 경우가 아니면, 한쪽 당사자가 계약을 종료하려면 상대방이 합리적인 통지를 받아야 한다", "cite": "U.C.C. § 2-309(3)", "url": "https://www.law.cornell.edu/ucc/2/2-309", "glossary": {"notification": "통지", "agreed event": "약정한 사유"}}}, "grammar": {"axis": "G7", "title": "능동·수동·자동사 세 가지", "wrong": "The contract terminated by the seller.", "right": "The contract was terminated by the seller. / The contract terminates on December 31.", "note": "누가 끝냈는지 말하면 수동태 was terminated by. 기한이 되어 저절로 끝나면 자동사 terminates(주어가 contract)."}, "collocations": ["terminate for cause / for convenience (사유 해지 / 임의 해지)", "notice of termination", "early termination"], "links": [{"label": "LII — U.C.C. § 2-106 (termination · cancellation 정의)", "url": "https://www.law.cornell.edu/ucc/2/2-106"}]}, {"id": "assignment", "hw": "assignment · assign", "ipa": "əˈsaɪn.mənt · əˈsaɪn", "stress": "as·**sign**·ment · as·**sign**", "stars": 1, "false_friend": true, "gloss": "(권리·계약상 지위의) 양도 · 양도하다", "pron_tip": "g는 소리 나지 않습니다. assignee(양수인)·assignor(양도인)처럼 형태가 바뀌어도 g는 묵음입니다.", "diff": "학교에서는 '과제', 회사에서는 '배정·업무'지만 계약서에서는 권리의 양도입니다. 미국 계약법은 권리의 양도(assignment)와 의무 이행의 위임(delegation)을 나눠 말합니다.", "examples": {"easy": {"en": "She assigned her rights to her sister.", "ko": "그녀는 자기 권리를 여동생에게 양도했다."}, "practice": {"en": "Neither party may assign this Agreement without the other party's prior written consent.", "ko": "어느 당사자도 상대방의 사전 서면 동의 없이 이 계약을 양도할 수 없다."}, "source": {"en": "Unless otherwise agreed all rights of either seller or buyer can be assigned except where the assignment would materially change the duty of the other party, or increase materially the burden or risk imposed on him by his contract … or impair materially his chance of obtaining return performance.", "ko": "달리 약정하지 않았으면 매도인과 매수인의 모든 권리는 양도할 수 있다. 다만 그 양도로 상대방의 의무가 실질적으로 바뀌거나, 계약상 상대방이 지는 부담이나 위험이 실질적으로 늘거나, 상대방이 반대급부를 받을 가능성이 실질적으로 줄어드는 경우는 그러하지 아니하다.", "cite": "U.C.C. § 2-210(2)", "url": "https://www.law.cornell.edu/ucc/2/2-210", "glossary": {"unless otherwise agreed": "달리 약정하지 않았으면"}}}, "grammar": {"axis": "G4", "title": "assign A to B", "wrong": "She assigned her sister her rights to.", "right": "She assigned her rights to her sister.", "note": "양도하는 것(권리)이 목적어, 받는 사람은 to. 수동태는 The rights were assigned to her sister."}, "collocations": ["assign rights to", "assignor / assignee (양도인 / 양수인)", "anti-assignment clause (양도금지 조항)", "delegate duties (의무를 위임하다)"], "links": [{"label": "LII Wex — assignment", "url": "https://www.law.cornell.edu/wex/assignment"}]}, {"id": "execute", "hw": "execute · execution", "ipa": "ˈek.sə.kjuːt · ˌek.səˈkjuː.ʃən", "stress": "**ex**·e·cute · ex·e·**cu**·tion", "stars": 2, "false_friend": true, "gloss": "(계약서에) 서명하다, 체결하다 · 서명·체결", "diff": "뉴스에서는 '처형하다'로 먼저 만나지만, 계약서에서는 서명·교부 같은 형식 요건을 갖추어 문서를 유효하게 만드는 것입니다. Wex는 판결을 '집행하다'라는 뜻도 함께 듭니다. 문맥이 계약이면 거의 '서명'입니다.", "examples": {"easy": {"en": "Both sides executed the agreement today.", "ko": "양측은 오늘 계약서에 서명했다."}, "practice": {"en": "This Agreement may be executed in counterparts, each of which shall be deemed an original.", "ko": "이 계약서는 여러 통으로 나누어 서명할 수 있고, 각 통은 원본으로 본다."}}, "grammar": {"axis": "G7", "title": "계약서는 '서명된다' — was executed", "wrong": "The Agreement executed on May 1, 2026.", "right": "The Agreement was executed on May 1, 2026.", "note": "계약서는 스스로 서명하지 않으므로 수동태. 계약서 끝 서명란 위의 IN WITNESS WHEREOF, the parties have executed this Agreement …도 함께 외워 둡니다."}, "collocations": ["execute an agreement", "execution date (서명일)", "duly executed (적법하게 서명된)", "execute in counterparts (여러 통으로 서명하다)"], "links": [{"label": "LII Wex — execute", "url": "https://www.law.cornell.edu/wex/execute"}]}, {"id": "instrument", "hw": "instrument", "ipa": "ˈɪn.strə.mənt", "stress": "**in**·stru·ment", "stars": 1, "false_friend": true, "gloss": "(법률) 증서, 문서", "diff": "악기나 도구가 아니라 법률행위를 기록한 서면입니다. Wex는 계약서·유언장·약속어음·부동산 증서(deed)를 예로 듭니다. UCC에서 negotiable instrument는 '유통증권(어음·수표)'입니다.", "examples": {"easy": {"en": "A deed is a legal instrument.", "ko": "부동산 증서는 법률 문서다."}, "practice": {"en": "The instruments were signed and delivered at closing.", "ko": "증서들은 거래 종결 때 서명·교부되었다."}}, "grammar": {"axis": "G2", "title": "셀 수 있는 명사 — instruments", "wrong": "All instrument must be signed.", "right": "All instruments must be signed.", "note": "문서 한 통 한 통을 세므로 all 뒤에는 복수. written instrument(서면 증서)처럼 앞에 형용사를 붙이기도 합니다."}, "collocations": ["written instrument", "negotiable instrument (유통증권)", "execute an instrument"], "links": [{"label": "LII Wex — instrument", "url": "https://www.law.cornell.edu/wex/instrument"}]}, {"id": "boilerplate", "hw": "boilerplate", "ipa": "ˈbɔɪ.lɚ.pleɪt", "stress": "**boil**·er·plate", "stars": 1, "gloss": "정형 조항, 상투 문구", "diff": "준거법·통지·분리가능성(severability)·완전합의(entire agreement) 조항처럼 계약서 끝에 거의 같은 모양으로 붙는 조항들입니다. Wex에 따르면 협상한 증거가 없으면 정형 조항은 그것을 제시한 쪽에 불리하게 해석됩니다.", "examples": {"easy": {"en": "Most of page 12 is boilerplate.", "ko": "12쪽은 거의 다 정형 조항이다."}, "practice": {"en": "Don't skip the boilerplate; the notice clause sets a 10-day deadline.", "ko": "정형 조항이라고 건너뛰지 마세요. 통지 조항에 10일 기한이 있습니다."}}, "grammar": {"axis": "G3", "title": "boilerplate는 셀 수 없다", "wrong": "The contract has many boilerplates.", "right": "The contract has a lot of boilerplate. / boilerplate clauses", "note": "문구 덩어리 전체를 가리키는 불가산명사입니다. 조항 하나하나를 세려면 boilerplate clause(s)."}, "collocations": ["boilerplate clause / language", "standard terms", "entire agreement clause (완전합의 조항)"], "links": [{"label": "LII Wex — boilerplate", "url": "https://www.law.cornell.edu/wex/boilerplate"}]}, {"id": "null-and-void", "hw": "null and void", "ipa": "ˌnʌl ənd ˈvɔɪd", "stress": "null and **void**", "stars": 2, "gloss": "무효(인)", "diff": "null과 void는 둘 다 '무효'입니다. 같은 뜻의 말을 겹쳐 쓰는 영미 법률 문체의 버릇으로, terms and conditions, cease and desist도 같은 짝입니다. Wex는 void를 '처음부터 법적 효력이 없는 것'으로 풀고 voidable(취소할 수 있는)과 대비시킵니다.", "examples": {"easy": {"en": "The old contract is null and void.", "ko": "옛 계약은 무효다."}, "practice": {"en": "Any assignment in violation of this Section shall be null and void.", "ko": "이 조항을 위반한 양도는 무효로 한다."}}, "pitfalls": ["void(무효)와 voidable(취소할 수 있는) 섞기 — voidable 계약은 취소되기 전까지 유효"], "grammar": {"axis": "G8", "title": "조문의 짝말 — 뜻이 같은 단어 둘", "wrong": "The clause is null or void.", "right": "The clause is null and void.", "note": "관용 짝말이라 and로 고정합니다. 뜻을 더하지 않으므로 직접 쓸 때는 void 하나로도 충분합니다."}, "collocations": ["null and void", "void ab initio (처음부터 무효 → 17장)", "voidable (취소할 수 있는)", "render void (무효로 만들다)"], "links": [{"label": "LII Wex — void", "url": "https://www.law.cornell.edu/wex/void"}]}, {"id": "statute-of-frauds", "hw": "statute of frauds", "ipa": "ˈstætʃ.uːt əv frɑːdz", "stress": "**stat**·ute of **frauds**", "stars": 1, "false_friend": true, "gloss": "사기방지법(일정 계약의 서면 요건)", "diff": "이름과 달리 사기죄를 처벌하는 법이 아닙니다. 일정한 계약은 서면과 서명이 있어야 강제할 수 있다는 규칙의 이름입니다. Wex는 토지 거래, 1년 안에 이행할 수 없는 계약, 500달러 이상의 물품매매를 대표 예로 듭니다. 한국 민법은 계약에 서면을 원칙적으로 요구하지 않습니다.", "examples": {"easy": {"en": "An oral land sale fails the statute of frauds.", "ko": "구두 토지 매매는 서면 요건을 충족하지 못한다."}, "practice": {"en": "The defendant raised the statute of frauds because the deal was never put in writing.", "ko": "거래가 서면으로 작성된 적이 없어 피고는 서면 요건(사기방지법)을 항변으로 내세웠다."}, "source": {"en": "Except as otherwise provided in this section a contract for the sale of goods for the price of $500 or more is not enforceable by way of action or defense unless there is some writing sufficient to indicate that a contract for sale has been made between the parties and signed by the party against whom enforcement is sought or by his authorized agent or broker.", "ko": "이 조에서 달리 정한 경우를 제외하고, 대금 500달러 이상의 물품매매 계약은, 당사자 사이에 매매계약이 체결되었음을 보여 주기에 충분하고 강제를 당하는 당사자나 그 권한 있는 대리인·중개인이 서명한 서면이 없으면 소나 항변으로 강제할 수 없다.", "cite": "U.C.C. § 2-201(1)", "url": "https://www.law.cornell.edu/ucc/2/2-201", "glossary": {"enforceable": "강제할 수 있는", "by way of action or defense": "소(청구)로든 항변으로든"}}}, "grammar": {"axis": "G1", "title": "규칙 이름에는 the", "wrong": "Defendant raised statute of frauds.", "right": "The defendant raised the statute of frauds.", "note": "특정 규칙을 가리키므로 the statute of frauds. the parol evidence rule, the mailbox rule도 같습니다."}, "collocations": ["raise the statute of frauds (항변하다)", "satisfy the statute of frauds", "in writing (서면으로)"], "links": [{"label": "LII Wex — statute of frauds", "url": "https://www.law.cornell.edu/wex/statute_of_frauds"}]}], "corners": {"false_friend": {"title": "consideration은 '고려'가 아니다", "body": ["consideration을 '고려'로 읽으면 계약서 첫 줄부터 틀립니다. In consideration of the mutual promises herein은 '본 계약의 상호 약속을 고려하여'가 아니라 '본 계약의 상호 약속을 대가로'입니다. 영미법에서 약인(consideration)은 약속이 계약으로 강제되기 위한 요건이고, 한국 민법에는 대응하는 요건이 없습니다.", "계약서에서 자주 만나는 가짜 친구를 모아 보면 이렇습니다."], "table": [["consideration", "고려, 배려", "약인(대가)"], ["execute", "처형하다, 실행하다", "(계약서에) 서명하다"], ["instrument", "악기, 도구", "증서, 법률 문서"], ["assignment", "과제, 배정", "(권리의) 양도"], ["material", "재료, 물질", "중대한, 실질적인(material breach)"], ["statute of frauds", "사기 처벌법?", "서면 요건 규칙"]], "tip": "외우는 요령: 문장에 agreement·party·hereby가 함께 나오면 일상 뜻을 의심하세요."}, "drama": {"title": "The Merchant of Venice (2004)", "facts": ["2004년 영화. 감독 마이클 래드퍼드, 샤일록 역 알 파치노, 안토니오 역 제러미 아이언스, 포셔 역 린 콜린스.", "셰익스피어 희곡이 원작입니다. 안토니오는 돈을 빌리면서 갚지 못하면 살 1파운드를 내주겠다는 증서(bond)에 서명합니다.", "법정 장면에서 포셔는 증서가 살만 허락하고 피는 허락하지 않는다는 점을 짚어 안토니오를 구합니다."], "watch": "이 장의 말이 그대로 나옵니다. 증서(bond·instrument)에 서명하고(execute), 기한을 넘겨 위반이 생기고(breach), 채권자는 약정대로의 이행을 고집합니다(특정이행의 극단적 모습). '계약서 문언을 한 글자씩 읽는다'는 태도가 어디까지 갈 수 있는지 보여 주는 장면입니다.", "terms": ["bond", "forfeit (몰수되다)", "execute", "breach", "specific performance"], "links": [{"label": "Wikipedia — The Merchant of Venice (2004 film)", "url": "https://en.wikipedia.org/wiki/The_Merchant_of_Venice_(2004_film)"}, {"label": "평론(희곡의 법정 장면) — Law & Liberty, Mark L. Movsesian(세인트존스대 로스쿨 교수), 「Reading Law with The Merchant of Venice」(2021)", "url": "https://lawliberty.org/reading-law-with-the-merchant-of-venice/"}]}, "quote": {"text": "The purpose of the law is to \"put the plaintiff in as good a position as he would have been in had the defendant kept his contract.\"", "ko": "법의 목적은 '피고가 계약을 지켰더라면 원고가 놓였을 상태와 같은 좋은 상태에 원고를 놓는 것'이다.", "case": "Hawkins v. McGee, 84 N.H. 114, 146 A. 641 (1929)", "decided": "1929. 6. 4. 선고 (뉴햄프셔주 대법원)", "gloss": {"as good a position as": "~만큼 좋은 상태", "had the defendant kept": "if the defendant had kept의 도치 — 피고가 지켰더라면", "kept his contract": "계약을 지켰다"}, "why": "의사가 소년의 흉터 난 손을 '100퍼센트 좋은 손(a hundred per cent good hand)'으로 만들어 주겠다고 장담했다가 수술이 실패한 사건입니다. 법원은 배상액을 '고통과 손이 나빠진 정도'가 아니라 '약속한 손과 실제 손의 차이'로 재야 한다며 다시 재판하라고 했습니다. 이행이익 배상의 원리를 보여 주는 사건이며, 'hairy hand' 사건이라는 별명으로 더 잘 알려져 있습니다. 인용문의 따옴표 안은 법원이 Williston의 계약법 교과서를 인용한 부분입니다.", "links": [{"label": "Caselaw Access Project — Hawkins v. McGee 판결 원문", "url": "https://static.case.law/nh/84/html/0114-01.html"}, {"label": "Wikipedia — Hawkins v. McGee", "url": "https://en.wikipedia.org/wiki/Hawkins_v._McGee"}]}, "korea": {"title": "termination은 해지일까 해제일까?", "us": "UCC는 계약을 끝내는 사유로 나눕니다. 약정이나 법률이 준 권한으로 끝내면 termination, 상대방의 위반을 이유로 끝내면 cancellation입니다(§ 2-106(3)·(4)). 어느 쪽이든 아직 이행하지 않은 의무는 소멸합니다.", "kr": "한국 민법은 효과로 나눕니다. 해제는 계약을 처음부터 없던 것으로 돌려 각 당사자가 원상회복 의무를 지고(제548조 제1항), 해지는 계약이 장래에 대하여 효력을 잃습니다(제550조). 해제·해지는 상대방에 대한 의사표시로 하고 철회하지 못하며(제543조), 이행지체가 있으면 상당한 기간을 정해 최고한 뒤 해제할 수 있습니다(제544조). 그래서 영문 계약서의 terminate를 무조건 '해지'로 옮기면 틀릴 수 있습니다.", "say": "Under Korean law, rescission unwinds the contract from the beginning, while termination ends it only for the future.", "say_ko": "한국법에서 해제는 계약을 처음부터 되돌리고, 해지는 장래에 대해서만 계약을 끝냅니다."}}, "quiz": [{"q": "계약서의 'In consideration of $5,000'에서 consideration의 뜻은?", "options": ["고려", "약인(대가)", "배려"], "answer": 1, "why": "계약서에서 consideration은 약인, 곧 약속의 대가입니다. in consideration of = ~을 대가로."}, {"q": "'The parties executed the agreement.'의 뜻은?", "options": ["당사자들이 계약을 파기했다.", "당사자들이 계약서에 서명했다.", "당사자들이 계약 위반자를 처벌했다."], "answer": 1, "why": "계약 문맥의 execute는 서명·체결입니다. '처형하다'는 형사 문맥의 뜻입니다."}, {"q": "계약에 적용할 법을 정한 조항은?", "options": ["force majeure clause", "arbitration clause", "governing law clause", "indemnification clause"], "answer": 2, "why": "force majeure는 불가항력, arbitration은 중재, indemnification은 손해보전 조항입니다."}, {"q": "문법: 의무를 나타내도록 빈칸을 채우세요 — The buyer ____ pay within 30 days.", "options": ["may", "must", "might"], "answer": 1, "why": "의무는 must(또는 shall). may는 재량·권한이라 '지급하지 않아도 된다'로 읽힙니다.", "grammar": "G8"}, {"q": "번역해 보세요: The seller is in breach of the contract.", "options": ["매도인은 계약을 위반한 상태다.", "매도인은 계약을 해지했다.", "매도인은 계약을 체결하는 중이다."], "answer": 0, "why": "be in breach of = ~을 위반한 상태에 있다. 해지는 terminate, 체결은 enter into."}]}, {"chapter": {"num": 9, "title": "불법행위와 손해배상", "subtitle": "", "title_en": "Torts and Damages", "lead": "계약은 당사자가 스스로 정한 의무를 다루고, 불법행위법(tort law)은 약속이 없어도 누구나 남에게 지는 의무를 다룹니다. 미국에서 불법행위법은 대부분 주(州)법이고 판례로 자랐습니다. 이 장은 과실(negligence)의 네 요소에서 시작해 징벌적 손해배상까지, 사고 소송에서 오가는 말을 모았습니다.", "can_say": [{"en": "The driver owed a duty of care to other people on the road.", "ko": "그 운전자는 도로 위의 다른 사람들에게 주의의무를 지고 있었습니다."}, {"en": "The jury found that the hospital was negligent.", "ko": "배심은 병원에 과실이 있다고 판단했습니다."}, {"en": "In Korea, punitive damages are available only under specific statutes.", "ko": "한국에서 징벌적 손해배상은 특정 법률에서만 인정됩니다."}]}, "entries": [{"id": "tort", "hw": "tort · tortfeasor", "ipa": "ˈtɔːrt · ˈtɔːrtˌfiː.zɚ", "stress": "**tort** · **tort**·fea·sor", "stars": 3, "gloss": "불법행위 · 불법행위자(가해자)", "pron_tip": "tort는 한 음절이고 끝 t까지 분명히 냅니다. 케이크 torte와 소리가 같아 말장난 소재가 됩니다. tortfeasor는 Cambridge에 표제어가 없어 보조 사전 Wiktionary의 미국식(GA) 표기 /ˈtɔɹtˌfiːzɚ/와 대조해 적었습니다.", "diff": "프랑스어에서 온 말로 원뜻은 '비틀린 것(wrong)'입니다. 계약 위반이 아닌 사적 침해 전반을 가리키며, 한국 민법 제750조의 불법행위와 넓게 겹칩니다. 다만 미국에서는 주마다 법이 다르고 판례로 자랐다는 점이 다릅니다.", "examples": {"easy": {"en": "Negligence is a kind of tort.", "ko": "과실 불법행위는 불법행위의 한 종류다."}, "practice": {"en": "The tortfeasor must pay for the harm he caused.", "ko": "가해자는 자신이 끼친 손해를 배상해야 한다."}, "source": {"en": "The United States shall be liable, respecting the provisions of this title relating to tort claims, in the same manner and to the same extent as a private individual under like circumstances", "ko": "합중국은 이 편의 불법행위 청구에 관한 규정에 관하여, 같은 상황에 있는 사인과 같은 방식·같은 범위에서 책임을 진다", "cite": "28 U.S.C. § 2674 (Federal Tort Claims Act)", "url": "https://www.law.cornell.edu/uscode/text/28/2674", "glossary": {"tort claims": "불법행위 청구", "private individual": "사인(私人)", "under like circumstances": "같은 상황에서"}}}, "box": "연방불법행위청구법(FTCA)은 국가가 원칙적으로 소추되지 않는다는 주권면책(sovereign immunity)을 일부 풀어, 공무원의 불법행위에 대해 연방정부가 사인처럼 책임지게 한 법입니다. 같은 조문 뒷부분은 국가가 판결 전 이자와 징벌적 손해배상은 지지 않는다고 정합니다. 한국의 국가배상법과 기능이 비슷합니다. 다만 미국은 소를 내기 전에 해당 행정청에 청구를 먼저 내야 하고(28 U.S.C. § 2675(a)), 한국은 배상심의회 신청 없이 바로 소를 낼 수 있습니다(국가배상법 제9조).", "grammar": {"axis": "G6", "title": "tort는 commit과 짝을 이룬다", "wrong": "He did a tort against his neighbor.", "right": "He committed a tort against his neighbor.", "note": "불법행위·범죄·잘못은 commit이 짝입니다(commit a crime, commit fraud). 셀 수 있는 명사라 a tort, torts."}, "collocations": ["commit a tort", "tort claim", "tort law", "joint tortfeasors (공동불법행위자)"], "links": [{"label": "LII Wex — tort", "url": "https://www.law.cornell.edu/wex/tort"}, {"label": "LII Wex — tortfeasor", "url": "https://www.law.cornell.edu/wex/tortfeasor"}, {"label": "LII — 28 U.S.C. § 2675 (행정 청구 선행)", "url": "https://www.law.cornell.edu/uscode/text/28/2675"}]}, {"id": "negligence", "hw": "negligence · negligent", "ipa": "ˈneɡ.lə.dʒəns · ˈneɡ.lə.dʒənt", "stress": "**neg**·li·gence · **neg**·li·gent", "stars": 3, "gloss": "과실 · 과실 있는", "diff": "미국 불법행위법에서 negligence는 네 요소로 나눠 따집니다. 주의의무(duty), 의무 위반(breach), 인과관계(causation), 손해(damages)입니다. 한국에서 고의·과실을 책임의 요건으로 보는 것과 달리, 영미에서 negligence는 그 자체가 하나의 불법행위 유형(소송 원인)입니다.", "examples": {"easy": {"en": "The accident was caused by negligence.", "ko": "사고는 과실로 일어났다."}, "practice": {"en": "The plaintiff must prove that the driver was negligent.", "ko": "원고는 운전자에게 과실이 있었음을 증명해야 한다."}, "source": {"en": "caused by the negligent or wrongful act or omission of any employee of the Government while acting within the scope of his office or employment", "ko": "정부 피용자가 그 직무 또는 고용의 범위 안에서 행동하던 중 저지른 과실 있는 또는 위법한 작위·부작위로 인하여 생긴", "cite": "28 U.S.C. § 1346(b)(1) (Federal Tort Claims Act)", "url": "https://www.law.cornell.edu/uscode/text/28/1346", "glossary": {"wrongful": "위법한", "act or omission": "작위 또는 부작위", "scope of employment": "고용(직무)의 범위"}}}, "pitfalls": ["negligence를 '태만·게으름'으로 옮기기 — 법률 문장에서는 '과실'", "형용사 negligent와 negligible(무시해도 될 만한)을 혼동하기"], "grammar": {"axis": "G3", "title": "negligence는 셀 수 없는 명사", "wrong": "The driver committed a negligence.", "right": "The driver was negligent. / The accident was caused by negligence.", "note": "negligence에는 a를 붙이지 않고 복수형도 쓰지 않습니다. 사람을 말할 때는 형용사 negligent가 자연스럽습니다. 하나하나의 행위를 말하려면 a negligent act."}, "collocations": ["gross negligence (중과실)", "be negligent in ~ing", "negligence claim", "prove negligence"], "links": [{"label": "LII Wex — negligence", "url": "https://www.law.cornell.edu/wex/negligence"}]}, {"id": "duty-of-care", "hw": "duty of care", "ipa": "ˈduː.t̬i əv ker", "stress": "**du**·ty of **care**", "stars": 3, "gloss": "주의의무", "diff": "과실 책임의 첫 관문입니다. 피고가 원고에게 애초에 주의의무를 지고 있지 않았다면, 아무리 부주의했어도 negligence는 성립하지 않습니다. 누구에게 의무를 지는지는 이 장의 「명판결 명문장」(Palsgraf)이 다룬 바로 그 문제입니다.", "examples": {"easy": {"en": "Doctors owe patients a duty of care.", "ko": "의사는 환자에게 주의의무를 진다."}, "practice": {"en": "The store breached its duty of care by leaving the wet floor unmarked.", "ko": "그 상점은 젖은 바닥에 아무 표시도 하지 않아 주의의무를 위반했다."}, "source": {"en": "the orbit of the danger as disclosed to the eye of reasonable vigilance would be the orbit of the duty", "ko": "합리적으로 주의하는 눈에 드러나는 위험의 궤도가 곧 의무의 궤도가 될 것이다", "cite": "Palsgraf v. Long Island R.R. Co., 248 N.Y. 339, 343 (1928) (Cardozo, C.J.)", "url": "https://www.nycourts.gov/reporter/archives/palsgraf_lirr.htm", "glossary": {"orbit": "궤도, 미치는 범위", "vigilance": "경계, 주의"}}}, "grammar": {"axis": "G6", "title": "duty는 owe와 짝을 이룬다", "wrong": "The driver has a duty of care for pedestrians.", "right": "The driver owes a duty of care to pedestrians.", "note": "틀린 곳은 for입니다. 의무의 상대는 to로 받습니다. have a duty of care to A도 정상이고, 법률 영어에서 가장 흔한 짝은 owe입니다. owe A a duty / owe a duty to A 두 형태가 다 쓰입니다. 위반은 breach a duty."}, "collocations": ["owe a duty of care to", "breach a duty of care", "standard of care (주의의 정도)", "fiduciary duty (신인의무 → 12장)"], "links": [{"label": "LII Wex — duty of care", "url": "https://www.law.cornell.edu/wex/duty_of_care"}]}, {"id": "reasonable-person", "hw": "reasonable person", "ipa": "ˈriː.zən.ə.bəl ˈpɝː.sən", "stress": "**rea**·son·a·ble **per**·son", "stars": 2, "gloss": "합리적 일반인(과실 판단의 기준이 되는 가상의 사람)", "diff": "피고가 '같은 상황에서 합리적인 사람이라면 했을 주의'를 기울였는지로 과실을 판단합니다. 한국의 '사회평균인'·'선량한 관리자'와 겹치지만 1:1은 아닙니다. 옛 판결은 reasonable man이라고 썼고, 지금은 성 중립적인 reasonable person이 표준입니다.", "examples": {"easy": {"en": "Would a reasonable person do that?", "ko": "합리적인 사람이라면 그렇게 했을까?"}, "practice": {"en": "A reasonable person would have slowed down in the heavy rain.", "ko": "합리적인 사람이라면 폭우 속에서 속도를 줄였을 것이다."}}, "grammar": {"axis": "G1", "title": "기준으로서의 가상 인물에는 the", "wrong": "Reasonable person standard is objective.", "right": "The reasonable person standard is objective.", "note": "특정인이 아니라 '그 기준 인물'을 가리킬 때는 the를 붙입니다. 예문처럼 '어떤 합리적인 사람이라면'은 a reasonable person."}, "collocations": ["the reasonable person standard", "a reasonable person would have ...", "reasonable care (상당한 주의)"], "links": [{"label": "LII Wex — reasonable person", "url": "https://www.law.cornell.edu/wex/reasonable_person"}]}, {"id": "causation", "hw": "causation · proximate cause", "ipa": "kɑːˈzeɪ.ʃən · ˈprɑːk.sə.mət kɑːz", "stress": "cau·**sa**·tion · **prox**·i·mate **cause**", "stars": 2, "gloss": "인과관계 · 법적 인과관계(근인)", "diff": "영미법은 인과관계를 두 단계로 봅니다. '그 행위가 없었다면 손해도 없었을까'(cause in fact, but-for 기준)를 먼저 묻고, 그다음 법이 책임을 지울 만큼 가까운 원인인지(proximate cause)를 묻습니다. 한국의 상당인과관계와 기능이 비슷하지만 판단 틀이 같지는 않습니다.", "examples": {"easy": {"en": "The plaintiff must prove causation.", "ko": "원고는 인과관계를 증명해야 한다."}, "practice": {"en": "The defense argued that the storm, not the repair work, was the proximate cause of the flood.", "ko": "피고 측은 홍수의 법적 원인이 수리 공사가 아니라 폭풍이었다고 주장했다."}, "source": {"en": "What we do mean by the word \"proximate\" is, that because of convenience, of public policy, of a rough sense of justice, the law arbitrarily declines to trace a series of events beyond a certain point.", "ko": "'근접한(proximate)'이라는 말로 우리가 실제로 뜻하는 바는, 편의와 공공정책과 대략적인 정의감 때문에 법이 일정한 지점을 넘어서는 사건의 연쇄를 자의적으로 추적하지 않는다는 것이다.", "cite": "Palsgraf v. Long Island R.R. Co., 248 N.Y. 339, 352 (1928) (Andrews, J., 반대의견)", "url": "https://www.nycourts.gov/reporter/archives/palsgraf_lirr.htm", "glossary": {"arbitrarily": "자의적으로", "trace": "추적하다"}}}, "box": "Palsgraf 사건에서 다수의견(Cardozo)은 철도회사가 멀리 있던 원고에게 의무를 지지 않았다며 원고 패소로 뒤집었습니다. 반대의견(Andrews)은 문제를 proximate cause로 보고 따졌는데, 원고의 부상이 과실의 근접한 결과가 아니라고 법률상 단정할 수 없다며 원고 승소 판결을 유지해야 한다고 했습니다(248 N.Y. 356). 같은 사실관계를 duty의 문제로 볼지 proximate cause의 문제로 볼지에 따라 논리의 길도 결론도 달라집니다.", "grammar": {"axis": "G1", "title": "결과의 원인은 the proximate cause", "wrong": "The storm was proximate cause of the flood.", "right": "The storm was the proximate cause of the flood.", "note": "of 뒤 결과에 대한 '바로 그 원인'이므로 the. 원인이 여럿일 수 있다는 뜻이면 a proximate cause. 일반 개념으로서의 causation은 관사 없이 씁니다."}, "collocations": ["prove causation", "but-for cause (사실적 인과관계)", "the proximate cause of", "intervening cause (개입 원인)"], "links": [{"label": "LII Wex — proximate cause", "url": "https://www.law.cornell.edu/wex/proximate_cause"}]}, {"id": "strict-liability", "hw": "strict liability", "ipa": "strɪkt ˌlaɪ.əˈbɪl.ə.t̬i", "stress": "**strict** li·a·**bil**·i·ty", "stars": 2, "gloss": "엄격책임(과실을 묻지 않는 책임, 무과실책임)", "diff": "피고가 아무리 조심했어도 책임을 지는 경우입니다. 폭발물 사용 같은 비정상적으로 위험한 활동(abnormally dangerous activities), 맹수 사육, 결함 제조물이 전형입니다. 한국어로는 '무과실책임'이 가장 가깝습니다. '엄격한 책임'이라고 옮기면 '책임을 엄하게 묻는다'로 오해되기 쉽습니다.", "examples": {"easy": {"en": "Strict liability does not require fault.", "ko": "엄격책임은 과실을 요구하지 않는다."}, "practice": {"en": "Courts may impose strict liability for harm caused by blasting.", "ko": "법원은 발파로 생긴 손해에 무과실책임을 지울 수 있다."}}, "grammar": {"axis": "G6", "title": "책임은 impose와 짝을 이룬다", "wrong": "The court gave strict liability to the company.", "right": "The court imposed strict liability on the company.", "note": "책임·의무·제재를 '지우다'는 impose A on B. 반대로 책임을 '지다'는 bear liability, be held liable."}, "collocations": ["impose strict liability on", "be strictly liable for", "liability without fault"], "links":
