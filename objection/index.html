<style>
/* Layout: a yellow legal pad — each entry is a sheet with the red margin rule; tools sit above like a clipboard clip. */

}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #141826; --sheet: #1b2033; --ink: #ece6c8; --muted: #a9a389; --rule: #2a3452;
  --margin: #e0685c; --accent: #93b6ea; --gram: #8fd0ad; --gram-bg: #1d3328; --chip: #2b3150; --line: #313a58;

:root[data-theme="dark"] {

  --margin: #e0685c; --accent: #93b6ea; --gram: #8fd0ad; --gram-bg: #1d3328; --chip: #2b3150; --line: #313a58;
  color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: var(--s0); line-height: 1.65; }
.wrap { max-width: 860px; margin: 0 auto; padding-inline: 16px; padding-block: 0 64px; }
a { color: var(--accent); text-underline-offset: 2px }
button, input, select { font: inherit; color: inherit }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }

/* masthead */
.mast { padding-block: 28px 18px; background-image: repeating-linear-gradient(to bottom, transparent 0 31px, var(--rule) 31px 32px); border-bottom: 2px solid var(--margin); }
.mast .stamp { display: inline-block; font-family: var(--f-display); font-weight: 700; font-size: var(--s4); line-height: 1; color: var(--margin); transform: rotate(-3deg); border: 3px solid var(--margin); border-radius: 6px; padding: 6px 14px 2px; letter-spacing: .01em; background: var(--paper); }

.tools { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); border-bottom: 1px solid var(--line); padding-block: 10px; margin-top: 22px; display: grid; gap: 8px }

.uk { font-size: var(--s-1); color: var(--muted) }

.box h4, .gram h4 { margin: 0 0 4px; font-size: var(--s-1); letter-spacing: .04em }
.gram { margin: 12px 0 0; background: var(--gram-bg); border-radius: 4px; padding: 10px 12px; font-size: .9375rem }
.gram h4 { color: var(--gram) }

.corner { margin-top: 28px; background: var(--sheet); border: 2px solid var(--ink); border-radius: 4px; padding: 16px 18px; min-width: 0 }

.toc { margin-top: 18px; background: var(--sheet); border: 1px solid var(--line); border-radius: 4px; padding: 8px 14px }

}
@media (prefers-reduced-motion: reduce) { * { transition: none !important } }

/* print / PDF */
.print .tools, .print .say, .print .fc, .print [data-screen] { display: none !important }
.print body { background: #fff; color: #111 }
.print .list { display: block } .print .sheet { margin-bottom: 14px }
.print body { font-size: 13px }

</style>

aw.cornell.edu/wex/civil_law"}]}, {"id": "statute", "hw": "statute", "ipa": "ˈstætʃ.uːt", "stress": "**stat**·ute", "stars": 3, "gloss": "제정법, 법률(의회가 만든 법)", "pron_tip": "statue(조각상)와 철자가 비슷합니다. statute는 끝이 /-uːt/로 t가 한 번 더 들립니다(→ 3장 statute of limitations).", "diff": "영미에서는 법을 크게 '판례법(case law)'과 '제정법(statute)'으로 나눕니다. 한국에서 '법률'이라고 할 때의 감각에 가장 가깝지만, 영미에서는 statute가 판례법이라는 바탕 위에 덧붙는 예외처럼 이해되던 역사가 있습니다.", "examples": {"easy": {"en": "Congress passed a new statute.", "ko": "의회가 새 법률을 통과시켰다."}, "practice": {"en": "The statute does not define the word 'employee'.", "ko": "그 법률은 '근로자'라는 낱말을 정의하지 않는다."}, "source": {"en": "The repeal of any statute shall not have the effect to release or extinguish any penalty, forfeiture, or liability incurred under such statute, unless the repealing Act shall so expressly provide", "ko": "어느 법률을 폐지하더라도 그 법률에 따라 이미 생긴 형벌·몰수·책임이 면제되거나 소멸하지 않는다. 다만 폐지하는 법률이 명시적으로 그렇게 정한 경우에는 그러하지 아니하다", "cite": "1 U.S.C. § 109", "url": "https://www.law.cornell.edu/uscode/text/1/109", "glossary": {"repeal": "폐지", "extinguish": "소멸시키다", "forfeiture": "몰수, 박탈", "incur": "(책임을) 지게 되다"}}}, "grammar": {"axis": "G3", "title": "law는 불가산, a law는 법률 한 건", "wrong": "Congress passed new law. / She studies a law in college.", "right": "Congress passed a new law. / She studies law in college.", "note": "법 일반(법학, 법질서)을 말하는 law는 셀 수 없어 관사 없이 씁니다. 의회가 만든 법률 한 건은 a law, laws로 셉니다. 격식 있는 문장에서는 a law 대신 a statute를 씁니다."}, "collocations": ["enact / pass a statute", "under the statute (그 법률에 따라)", "statutory (형용사: 법률상의)"], "links": [{"label": "LII Wex — statute", "url": "https://www.law.cornell.edu/wex/statute"}]}, {"id": "precedent", "hw": "precedent", "ipa": "ˈpres.ə.dent", "stress": "**prec**·e·dent", "stars": 3, "gloss": "선례(先例), 판례", "pron_tip": "강세는 첫 음절 prec-입니다. 형용사 precedent(앞서는)는 둘째 음절에 강세를 두기도 하지만 법률 영어에서는 거의 명사로 만납니다. president(대통령)와 소리가 비슷하니 문맥으로 구별합니다.", "diff": "영미에서 precedent는 다음 법원이 따라야 하는 '법원(法源)'입니다. 한국에서도 대법원 판례가 실무를 이끌지만 법률상 구속력은 해당 사건에 한정됩니다(→ 「한국이라면?」).", "examples": {"easy": {"en": "This case set a precedent.", "ko": "이 사건이 선례를 남겼다."}, "practice": {"en": "Judge Park found no precedent directly on point.", "ko": "박 판사는 쟁점에 딱 맞는 선례를 찾지 못했다."}, "source": {"en": "Overruling precedent is never a small matter.", "ko": "선례를 폐기하는 것은 결코 작은 일이 아니다.", "cite": "Kimble v. Marvel Entertainment, LLC, 576 U.S. 446 (2015)", "url": "https://www.law.cornell.edu/supremecourt/text/13-720", "glossary": {"overrule": "(선례를) 폐기하다 — 상급법원이 하급심 판결을 뒤집는 reverse와 구별"}}}, "grammar": {"axis": "G3", "title": "a precedent(한 건) / precedent(선례 전체)", "wrong": "Overruling a precedents is rare.", "right": "This case set a precedent. / Overruling precedent is never a small matter.", "note": "판결 하나를 가리키면 셀 수 있습니다(a precedent, precedents). 선례라는 법원(法源) 일반을 말할 때는 관사 없이 셀 수 없는 명사처럼 씁니다."}, "collocations": ["set a precedent (선례를 남기다)", "follow / overrule precedent", "binding precedent", "on point (쟁점에 딱 맞는)"], "links": [{"label": "LII Wex — precedent", "url": "https://www.law.cornell.edu/wex/precedent"}]}, {"id": "stare-decisis", "hw": "stare decisis", "ipa": "ˌstɑːr.i dɪˈsaɪ.sɪs", "stress": "**sta**·re de·**ci**·sis", "stars": 2, "gloss": "선례구속의 원칙", "pron_tip": "decisis의 강세는 둘째 음절 -ci-이고 /saɪ/로 읽습니다. stare의 첫 모음은 /ɑː/ 외에 /e/로 읽는 사람도 있습니다.", "diff": "라틴어 'stare decisis et non quieta movere'(결정된 것을 지키고 안정된 것을 흔들지 말라)를 줄인 말입니다. 라틴어 표현은 17장에서 다시 다룹니다.", "examples": {"easy": {"en": "Stare decisis means following past decisions.", "ko": "선례구속은 과거 판결을 따른다는 뜻이다."}, "practice": {"en": "The dissent argued that stare decisis should not save a wrong decision.", "ko": "반대의견은 선례구속 원칙이 잘못된 판결을 구해서는 안 된다고 주장했다."}, "source": {"en": "the idea that today's Court should stand by yesterday's decisions", "ko": "오늘의 법원이 어제의 판결을 지켜야 한다는 생각", "cite": "Kimble v. Marvel Entertainment, LLC, 576 U.S. 446 (2015) — stare decisis를 풀어 쓴 구절", "url": "https://www.law.cornell.edu/supremecourt/text/13-720", "glossary": {"stand by": "고수하다, 지키다"}}}, "grammar": {"axis": "G2", "title": "라틴어 원칙 이름은 단수 취급", "wrong": "Stare decisis are important.", "right": "Stare decisis is important.", "note": "겉모양이 두 단어여도 원칙 하나의 이름이므로 동사는 단수(is)입니다. 관사도 붙이지 않습니다."}, "collocations": ["the doctrine of stare decisis", "adhere to stare decisis", "under stare decisis"], "links": [{"label": "LII Wex — stare decisis", "url": "https://www.law.cornell.edu/wex/stare_decisis"}]}, {"id": "authority", "hw": "binding / persuasive authority", "ipa": "ˈbaɪn.dɪŋ · pɚˈsweɪ.sɪv əˈθɔːr.ə.t̬i", "stress": "**bind**·ing · per·**sua**·sive au·**thor**·i·ty", "stars": 2, "gloss": "구속력 있는 근거(선례) / 참고적 근거(선례)", "diff": "같은 관할의 상급법원 판결은 binding authority라 반드시 따라야 하고, 다른 주·다른 순회구의 판결이나 학설은 persuasive authority라 참고만 합니다. 한국 판결문이 외국 판례를 참고하는 것은 후자에 가깝습니다.", "examples": {"easy": {"en": "That decision is binding on us.", "ko": "그 판결은 우리를 구속한다."}, "practice": {"en": "Counsel cited a Texas case, but it is only persuasive authority here.", "ko": "변호인이 텍사스주 판결을 인용했지만 여기서는 참고적 근거일 뿐이다."}}, "grammar": {"axis": "G3", "title": "근거라는 뜻의 authority는 불가산", "wrong": "The brief cites many authority.", "right": "The brief cites little authority. / The brief cites many authorities.", "note": "'법적 근거' 전체를 말할 때는 셀 수 없는 명사로 씁니다(little authority). 판결·조문 하나하나를 가리킬 때는 셀 수 있어 a persuasive authority, authorities도 씁니다. many 뒤에 단수 authority만 두는 것이 틀린 형태입니다."}, "collocations": ["binding on (~을 구속하는)", "cite authority", "mandatory authority (= binding authority)"], "links": [{"label": "LII Wex — mandatory authority", "url": "https://www.law.cornell.edu/wex/mandatory_authority"}, {"label": "LII Wex — persuasive authority", "url": "https://www.law.cornell.edu/wex/persuasive_authority"}]}, {"id": "jurisdiction", "hw": "jurisdiction", "ipa": "ˌdʒʊr.ɪsˈdɪk.ʃən", "stress": "ju·ris·**dic**·tion", "stars": 3, "gloss": "① 관할(권) ② 법역(같은 법이 적용되는 지역)", "diff": "한국어 '관할'보다 넓습니다. 법원이 사건을 재판할 권한(subject-matter jurisdiction), 사람에 대한 재판권(personal jurisdiction)에 더해, '뉴욕주'·'캘리포니아주'처럼 독자적인 법을 가진 지역 자체를 a jurisdiction이라고 부릅니다. 미국은 연방과 50개 주가 각각 하나의 법역입니다.", "examples": {"easy": {"en": "This court has no jurisdiction.", "ko": "이 법원에는 관할권이 없다."}, "practice": {"en": "In some jurisdictions, the rule is different.", "ko": "어떤 주(법역)에서는 그 규칙이 다르다."}, "source": {"en": "In all cases affecting ambassadors, other public ministers and consuls, and those in which a state shall be party, the Supreme Court shall have original jurisdiction.", "ko": "대사·그 밖의 외교사절·영사에 관한 모든 사건과 주가 당사자인 사건에서는 연방대법원이 제1심 관할권을 가진다.", "cite": "U.S. Const. art. III, § 2, cl. 2 (LII 표기)", "url": "https://www.law.cornell.edu/constitution/articleiii", "glossary": {"original jurisdiction": "제1심 관할 — 같은 조의 appellate jurisdiction(상소 관할)과 짝", "consul": "영사"}}}, "grammar": {"axis": "G4", "title": "jurisdiction over + 사건·사람", "wrong": "The court has jurisdiction about this case.", "right": "The court has jurisdiction over this case.", "note": "관할이 '미치는 대상'에는 over를 씁니다. '~하는 관할'은 jurisdiction to hear the case처럼 to부정사로 잇습니다."}, "collocations": ["have / lack jurisdiction over", "subject-matter jurisdiction", "personal jurisdiction", "in this jurisdiction (이 법역에서는)"], "links": [{"label": "LII Wex — jurisdiction", "url": "https://www.law.cornell.edu/wex/jurisdiction"}]}, {"id": "federal-state", "hw": "federal / state", "ipa": "ˈfed.ɚ.əl · steɪt", "stress": "**fed**·er·al · **state**", "stars": 3, "false_friend": true, "gloss": "연방(의) / 주(州)", "diff": "미국 영어에서 state는 대개 '국가'가 아니라 '주'입니다. 주마다 헌법·법원·민법·형법이 따로 있고, 연방법은 헌법이 연방에 맡긴 영역에서만 적용됩니다. 법원 구조는 2장에서 자세히 봅니다.", "examples": {"easy": {"en": "Is this a federal or state case?", "ko": "이건 연방 사건인가, 주 사건인가?"}, "practice": {"en": "The prosecutor charged him under state law, not federal law.", "ko": "검사는 그를 연방법이 아니라 주법에 따라 기소했다."}, "source": {"en": "Except in matters governed by the Federal Constitution or by acts of Congress, the law to be applied in any case is the law of the state. … There is no federal general common law.", "ko": "연방헌법이나 연방의회 법률이 규율하는 사항을 제외하면, 어느 사건에서든 적용할 법은 주법이다. … 연방의 일반 보통법이란 없다.", "cite": "Erie Railroad Co. v. Tompkins, 304 U.S. 64, 78 (1938)", "url": "https://www.law.cornell.edu/supremecourt/text/304/64", "glossary": {"acts of Congress": "연방의회 법률", "general common law": "(주를 넘어서는) 일반 보통법"}}}, "box": "Erie 판결은 연방법원이 주민 간 사건을 재판할 때 연방법원 나름의 '일반 보통법'을 만들어 쓰던 관행을 끝냈습니다. 그 뒤로 연방법원도 주법이 규율하는 청구에서는 그 주의 실체법(판례 포함)을 적용합니다. 다만 절차는 연방민사소송규칙 같은 연방 절차법을 따릅니다. 미국 로스쿨 1학년이 반드시 배우는 판결입니다.", "grammar": {"axis": "G1", "title": "the federal government, the States", "wrong": "Federal government sued state of Texas.", "right": "The federal government sued the State of Texas.", "note": "하나뿐인 연방정부는 the federal government. 특정 주를 정식 이름으로 부를 때도 the State of ~입니다. 일반명사 state law, federal law는 관사 없이 씁니다."}, "collocations": ["federal court / state court", "federal law / state law", "at the federal level", "federal question (→ 2장)"], "links": [{"label": "LII Wex — federalism", "url": "https://www.law.cornell.edu/wex/federalism"}]}, {"id": "equity", "hw": "equity", "ipa": "ˈek.wə.t̬i", "stress": "**eq**·ui·ty", "stars": 2, "false_friend": true, "gloss": "형평법(衡平法)", "diff": "영국에서 보통법 법원이 돈 배상밖에 못 해 주던 한계를 메우려고, 대법관(Lord Chancellor) 법원이 '형평'에 따라 금지명령·특정이행 같은 구제를 준 데서 생긴 법체계입니다. 한국어 '형평'(공평함)과 뿌리는 같지만 법률 영어에서는 이 별도 체계를 가리킵니다. 회사법의 equity(지분)는 12장에서 다룹니다.", "examples": {"easy": {"en": "Equity can order a party to act.", "ko": "형평법은 당사자에게 어떤 행위를 명할 수 있다."}, "practice": {"en": "The judge, not the jury, decides whether to grant an injunction.", "ko": "금지명령을 내릴지는 배심이 아니라 판사가 정한다."}}, "grammar": {"axis": "G4", "title": "at law / in equity", "wrong": "a remedy on equity / a remedy in law", "right": "a remedy in equity / a remedy at law", "note": "보통법상은 at law, 형평법상은 in equity가 굳은 짝입니다. 헌법 제3조의 'cases, in law and equity'처럼 둘을 묶을 때는 in을 함께 쓰기도 합니다."}, "collocations": ["courts of equity", "equitable remedy (형평법상 구제)", "at law and in equity"], "links": [{"label": "LII Wex — equity", "url": "https://www.law.cornell.edu/wex/equity"}]}, {"id": "case-law", "hw": "case law", "ipa": "ˈkeɪs ˌlɑː", "stress": "**case** law", "stars": 2, "gloss": "판례법", "diff": "법원 판결이 쌓여 이루는 법입니다. common law와 거의 같은 뜻으로 쓰이지만, common law가 체계(법계)까지 가리키는 데 비해 case law는 '판결로 이루어진 법'이라는 출처에 초점이 있습니다. statutory law(제정법)와 짝입니다.", "examples": {"easy": {"en": "Lawyers read case law every day.", "ko": "변호사들은 매일 판례법을 읽는다."}, "practice": {"en": "There is little case law on AI-generated works.", "ko": "AI 생성물에 관한 판례법은 거의 없다."}}, "grammar": {"axis": "G3", "title": "case law는 불가산", "wrong": "a case law / many case laws", "right": "case law / much case law / a case (판결 한 건)", "note": "판결의 총체를 뜻하므로 셀 수 없습니다. 판결 하나를 말하려면 a case 또는 a decision. 양은 little / much로 말합니다."}, "collocations": ["under case law", "a body of case law (판례의 집적)", "statutory law vs. case law"], "links": [{"label": "LII Wex — case law", "url": "https://www.law.cornell.edu/wex/case_law"}]}, {"id": "case", "hw": "case", "ipa": "keɪs", "stress": "**case**", "stars": 3, "false_friend": true, "gloss": "① 사건 ② 판결(판례) ③ (한쪽의) 주장·입증", "diff": "일상어로는 '상자', '경우'입니다. 법정에서는 사건 그 자체, 그 사건의 판결, 한쪽이 쌓아 올린 주장 전체를 모두 case라고 합니다. 'The prosecution rests its case'는 '검찰 측 입증을 마칩니다'입니다(→ 「가짜 친구」).", "examples": {"easy": {"en": "The judge heard the case.", "ko": "판사가 그 사건을 심리했다."}, "practice": {"en": "Ms. Lee, a defense attorney, thinks the prosecution has a weak case.", "ko": "변호인 이 변호사는 검찰 측 입증이 약하다고 본다."}, "source": {"en": "The judicial power shall extend to all cases, in law and equity, arising under this Constitution, the laws of the United States, and treaties made, or which shall be made, under their authority", "ko": "사법권은 이 헌법, 미국 법률, 그 권한에 따라 체결되었거나 체결될 조약에 따라 발생하는 보통법상·형평법상의 모든 사건에 미친다", "cite": "U.S. Const. art. III, § 2, cl. 1 (LII 표기)", "url": "https://www.law.cornell.edu/constitution/articleiii", "glossary": {"judicial power": "사법권", "arising under": "~에 근거하여 발생하는", "in law and equity": "보통법상·형평법상"}}}, "box": "연방법원은 이 조항 때문에 '사건(cases)과 분쟁(controversies)'만 재판합니다. 구체적 분쟁 없이 법률이 위헌인지 묻는 추상적 심사는 연방법원이 하지 않습니다. 이 점도 한국 헌법재판소와 다릅니다.", "grammar": {"axis": "G2", "title": "one of the cases — 복수 뒤에 단수 동사", "wrong": "One of the case were dismissed.", "right": "One of the cases was dismissed.", "note": "one of 뒤 명사는 복수(cases), 동사는 주어 one에 맞춰 단수(was)입니다."}, "collocations": ["hear / decide a case", "win / lose a case", "make a case for (~을 주장하다)", "rest one's case (입증을 마치다)", "case number (사건번호)"], "links": [{"label": "LII Wex — case", "url": "https://www.law.cornell.edu/wex/case"}]}, {"id": "regulation", "hw": "regulation", "ipa": "ˌreɡ.jəˈleɪ.ʃən", "stress": "reg·u·**la**·tion", "stars": 2, "gloss": "(행정기관이 만든) 규정(연방규정 등)", "diff": "의회가 법률로 권한을 주면 연방 행정기관이 regulation을 만들고, 이것이 연방규정집(Code of Federal Regulations, CFR)에 실립니다. 한국의 시행령·시행규칙에 가깝지만 제정 절차(공고·의견 제출)가 달라 1:1로 대응하지는 않습니다. 일상어로는 '규제'라는 뜻도 됩니다.", "examples": {"easy": {"en": "The agency issued new regulations.", "ko": "그 기관은 새 규정을 발표했다."}, "practice": {"en": "Under federal regulations, the company must report the data every year.", "ko": "연방 규정에 따라 회사는 그 자료를 매년 보고해야 한다."}}, "grammar": {"axis": "G2", "title": "규정 묶음은 보통 복수", "wrong": "The agency issued new regulation.", "right": "The agency issued new regulations. / a regulation (규정 한 조항)", "note": "구체적 규정을 가리킬 때는 셀 수 있는 명사라서 복수 regulations를 주로 씁니다. 관사 없는 regulation은 '규제'라는 추상명사(government regulation)입니다."}, "collocations": ["issue / promulgate regulations", "federal regulations", "comply with regulations"], "links": [{"label": "LII Wex — regulation", "url": "https://www.law.cornell.edu/wex/regulation"}]}, {"id": "code", "hw": "code", "ipa": "koʊd", "stress": "**code**", "stars": 2, "false_friend": true, "gloss": "법전 (예: United States Code)", "diff": "일상어로는 '암호', '프로그램 코드', '복장 규정'입니다. 법률 영어에서는 법률을 주제별로 모아 놓은 법전입니다. 미국 연방법률은 United States Code(U.S.C.)에 54개 편(title)으로 정리되어 있습니다. 대륙법의 '민법전'처럼 체계 전체를 처음부터 설계한 법전과는 성격이 다르고, 이미 만든 법률을 모아 편집한 것에 가깝습니다.", "examples": {"easy": {"en": "Look it up in the Code.", "ko": "법전에서 찾아보세요."}, "practice": {"en": "Patent law is in Title 35 of the U.S. Code.", "ko": "특허법은 미국 연방법전 제35편에 있다."}, "source": {"en": "whenever titles of such Code shall have been enacted into positive law the text thereof shall be legal evidence of the laws therein contained", "ko": "그 법전의 편이 실정법으로 제정된 때에는 그 본문이 거기 담긴 법률의 법적 증거가 된다", "cite": "1 U.S.C. § 204(a)", "url": "https://www.law.cornell.edu/uscode/text/1/204", "glossary": {"positive law": "실정법", "title": "(법전의) 편", "therein": "그 안에"}}}, "box": "U.S. Code의 모든 편이 그 자체로 법률인 것은 아닙니다. 의회가 편 전체를 실정법으로 다시 제정한 편(positive law title)만 본문이 곧 법이고, 나머지는 원래 법률을 편집해 실어 둔 '추정적 증거(prima facie evidence)'입니다.", "grammar": {"axis": "G1", "title": "the U.S. Code — 하나뿐인 법전에는 the", "wrong": "It is in U.S. Code.", "right": "It is in the U.S. Code. / 35 U.S.C. § 101", "note": "특정 법전 이름 앞에는 the. 다만 조문 인용 형식(35 U.S.C. § 101)에서는 관사를 쓰지 않습니다."}, "collocations": ["the U.S. Code", "Title 35 of the U.S. Code", "codify (법전화하다)", "Code of Federal Regulations (CFR)"], "links": [{"label": "LII Wex — code", "url": "https://www.law.cornell.edu/wex/code"}]}, {"id": "legislature", "hw": "legislature / Congress", "ipa": "ˈledʒ.ə.slə.tʃɚ · ˈkɑːŋ.ɡres", "stress": "**leg**·is·la·ture · **Con**·gress", "stars": 2, "uk": "Parliament (영국 의회)", "gloss": "입법부(의회) / 미국 연방의회", "diff": "legislature는 입법부 일반입니다. 미국 연방의회는 Congress, 주의회는 state legislature라고 부릅니다(주마다 General Assembly 등 이름이 다릅니다). 한국 국회는 영문 공식 명칭이 National Assembly입니다.", "examples": {"easy": {"en": "Congress makes federal laws.", "ko": "연방의회가 연방법을 만든다."}, "practice": {"en": "The state legislature amended the statute last year.", "ko": "주의회는 작년에 그 법률을 개정했다."}, "source": {"en": "All legislative powers herein granted shall be vested in a Congress of the United States, which shall consist of a Senate and House of Representatives.", "ko": "이 헌법이 부여하는 모든 입법권은 상원과 하원으로 구성되는 미국 연방의회에 속한다.", "cite": "U.S. Const. art. I, § 1 (LII 표기)", "url": "https://www.law.cornell.edu/constitution/articlei", "glossary": {"herein granted": "이 헌법이 부여하는", "be vested in": "~에 속하다, 귀속되다"}}}, "grammar": {"axis": "G1", "title": "Congress는 보통 관사 없이", "wrong": "The bill passed the Congress yesterday. (일상 문장)", "right": "The bill passed Congress yesterday. / the state legislature", "note": "미국 연방의회 Congress는 고유명사처럼 관사 없이 쓰는 것이 일상적입니다(헌법 원문처럼 격식체에서는 the Congress도 보입니다). legislature는 보통명사라 the/a가 붙습니다."}, "collocations": ["act of Congress (연방법률)", "member of Congress", "state legislature", "legislative history (입법 경위)"], "links": [{"label": "LII Wex — legislature", "url": "https://www.law.cornell.edu/wex/legislature"}, {"label": "LII Wex — Congress", "url": "https://www.law.cornell.edu/wex/congress"}]}, {"id": "enact", "hw": "enact / repeal / amend", "ipa": "ɪˈnækt · rɪˈpiːl · əˈmend", "stress": "en·**act** · re·**peal** · a·**mend**", "stars": 2, "gloss": "(법률을) 제정하다 / 폐지하다 / 개정하다", "pron_tip": "세 단어 모두 둘째 음절에 강세가 있습니다.", "examples": {"easy": {"en": "The law was repealed in 2020.", "ko": "그 법률은 2020년에 폐지되었다."}, "practice": {"en": "The statute was enacted in 1990 and amended twice.", "ko": "그 법률은 1990년에 제정되어 두 번 개정되었다."}}, "grammar": {"axis": "G7", "title": "법률의 운명은 수동태로", "wrong": "The statute enacted in 1990.", "right": "The statute was enacted in 1990.", "note": "법률은 스스로 제정하지 않으므로 was enacted(수동). 능동으로 쓰려면 주어를 Congress로 둡니다(Congress enacted the statute)."}, "collocations": ["enact a statute", "repeal a law", "amend the Constitution", "amendment (개정; 헌법의 수정 조항)"], "links": [{"label": "LII Wex — repeal", "url": "https://www.law.cornell.edu/wex/repeal"}, {"label": "LII Wex — amend", "url": "https://www.law.cornell.edu/wex/amend"}]}, {"id": "rule-of-law", "hw": "the rule of law", "ipa": "ðə ˌruːl əv ˈlɑː", "stress": "the **rule** of **law**", "stars": 2, "gloss": "법치주의, 법의 지배", "diff": "권력도 미리 정해진 법에 따라야 한다는 원칙입니다. 한국어 '법치'가 '법으로 다스린다(rule by law)'로 오해될 때가 있는데, rule of law는 통치자도 법 아래에 있다는 쪽에 무게가 있습니다.", "examples": {"easy": {"en": "Courts protect the rule of law.", "ko": "법원은 법치주의를 지킨다."}, "practice": {"en": "Judge Kim said that predictable rulings support the rule of law.", "ko": "김 판사는 예측 가능한 판결이 법치주의를 떠받친다고 말했다."}, "source": {"en": "a foundation stone of the rule of law", "ko": "법치주의의 주춧돌", "cite": "Kimble v. Marvel Entertainment, LLC, 576 U.S. 446 (2015) — 선례구속을 가리켜(Michigan v. Bay Mills Indian Community 인용)", "url": "https://www.law.cornell.edu/supremecourt/text/13-720", "glossary": {"foundation stone": "주춧돌, 초석"}}}, "grammar": {"axis": "G1", "title": "항상 the rule of law", "wrong": "Rule of law is important.", "right": "The rule of law is important.", "note": "하나의 정해진 원칙 이름이라 the를 붙입니다. 같은 모양의 a rule of law는 '법규칙 하나'라는 다른 뜻입니다."}, "collocations": ["uphold the rule of law", "undermine the rule of law", "rule by law (법에 의한 통치 — 구별)"]}, {"id": "legal-system", "hw": "legal system", "ipa": "ˈliː.ɡəl ˈsɪs.təm", "stress": "**le**·gal **sys**·tem", "stars": 1, "gloss": "법제도, 법체계", "examples": {"easy": {"en": "Every country has its own legal system.", "ko": "나라마다 고유한 법제도가 있다."}, "practice": {"en": "Under the Korean legal system, a judge decides most cases without a jury.", "ko": "한국 법제도에서는 판사가 대부분의 사건을 배심 없이 재판한다."}}, "grammar": {"axis": "G4", "title": "under the ~ legal system", "wrong": "In the Korean legal system rules, ...", "right": "Under the Korean legal system, ...", "note": "'~ 법제도상', '~ 법에 따르면'은 under를 씁니다. under Korean law, under the statute도 같은 짝입니다."}, "collocations": ["adversarial legal system (당사자주의)", "under Korean law", "a common law / civil law legal system"]}, {"id": "attorney", "hw": "attorney / lawyer / counsel", "ipa": "əˈtɝː.ni · ˈlɔɪ.jɚ · ˈkaʊn.səl", "stress": "at·**tor**·ney · **law**·yer · **coun**·sel", "stars": 3, "uk": "solicitor (사무 변호사) · barrister (법정 변호사)", "gloss": "변호사 (쓰임 차이)", "diff": "lawyer는 가장 넓고 일상적인 말입니다. attorney(attorney at law)는 의뢰인을 대리하는 변호사로 미국에서 격식 있게 씁니다. counsel은 '사건을 맡은 변호인'이라는 역할에 초점이 있어 법정에서 'Counsel, please approach'처럼 부릅니다. 영국은 의뢰인 상담·서류 위주의 solicitor와 법정 변론 위주의 barrister로 나뉩니다.", "examples": {"easy": {"en": "She hired a lawyer.", "ko": "그녀는 변호사를 선임했다."}, "practice": {"en": "Defense counsel asked the judge for a short recess.", "ko": "변호인은 판사에게 잠시 휴정을 요청했다."}, "source": {"en": "any person haled into court, who is too poor to hire a lawyer, cannot be assured a fair trial unless counsel is provided for him.", "ko": "법정에 불려 나온 사람이 너무 가난해 변호사를 선임할 수 없다면, 변호인이 선정되지 않는 한 공정한 재판을 보장받을 수 없다.", "cite": "Gideon v. Wainwright, 372 U.S. 335, 344 (1963)", "url": "https://www.law.cornell.edu/supremecourt/text/372/335", "glossary": {"haled into court": "법정에 끌려 나온", "be assured": "보장받다"}}}, "box": "Gideon 판결은 같은 문장 안에서 '돈 내고 사는' lawyer와 '국가가 붙여 주는' counsel을 나란히 씁니다. 수정헌법 제6조의 'assistance of counsel'(변호인의 조력)이 이 판결로 가난한 형사 피고인에게까지 넓혀졌습니다.", "grammar": {"axis": "G2", "title": "counsel은 복수형을 만들지 않는다", "wrong": "Both counsels objected.", "right": "Both counsel objected. / Both attorneys objected.", "note": "변호인이라는 뜻의 counsel은 한 명이든 여러 명이든 counsel입니다. 셀 때는 attorneys나 lawyers로 바꾸면 자연스럽습니다."}, "collocations": ["hire / retain a lawyer", "defense counsel / counsel for the plaintiff", "right to counsel (변호인의 조력을 받을 권리)", "district attorney (지방검사, → 6장)"], "links": [{"label": "LII Wex — attorney", "url": "https://www.law.cornell.edu/wex/attorney"}, {"label": "LII Wex — counsel", "url": "https://www.law.cornell.edu/wex/counsel"}]}], "corners": {"false_friend": {"title": "case는 상자가 아니다", "body": ["case는 일상에서 '상자'(a pencil case)나 '경우'(in that case)입니다. 법정에서는 사건이고, 판결이고, 한쪽이 쌓아 온 주장 전체입니다. 'Is this a federal case?'는 '연방 사건이냐'이고, 'She has a strong case'는 '그녀의 주장이 탄탄하다'입니다.", "구어의 'Don't make a federal case out of it'은 '별것 아닌 일을 크게 만들지 마라'라는 관용구입니다. 연방법원까지 갈 일이냐는 뜻에서 나왔습니다.", "이 장의 가짜 친구를 모아 보면 이렇습니다."], "table": [["case", "상자, 경우", "사건, 판결, 주장"], ["civil law", "시민의 법?", "대륙법(계) / 민사법"], ["state", "국가", "(미국의) 주"], ["code", "암호, 코드", "법전"], ["equity", "공평함, (회사) 지분", "형평법"], ["counsel", "조언", "변호인"]], "tip": "court·judge·statute가 같은 문장에 보이면 case를 '경우'로 읽지 말고 먼저 '사건'으로 넣어 보세요."}, "drama": {"title": "The Paper Chase (1973)", "facts": ["1973년 미국 영화. 감독·각본 제임스 브리지스, 주연 티머시 보텀스·린지 와그너·존 하우스먼.", "존 제이 오즈번 주니어의 1971년 소설이 원작입니다. 하버드 로스쿨 1학년생 하트가 계약법 교수 킹스필드의 수업에서 버텨 내는 이야기입니다.", "존 하우스먼은 킹스필드 교수 역으로 아카데미 남우조연상을 받았습니다."], "watch": "첫 수업에서 킹스필드는 강의 대신 학생을 지명해 판결에 관해 질문을 퍼붓습니다(소크라테스식 문답법). 영미 로스쿨이 법을 조문이 아니라 판결(case)로 가르친다는 이 장의 요지를 화면으로 보여 줍니다.", "terms": ["case", "precedent", "Socratic method", "contract law", "law school"], "links": [{"label": "Wikipedia — The Paper Chase (film)", "url": "https://en.wikipedia.org/wiki/The_Paper_Chase_(film)"}, {"label": "YouTube — 공식 예고편 (20th Century Studios)", "url": "https://www.youtube.com/watch?v=wGUfvZU4wiE"}]}, "quote": {"text": "Stare decisis is the preferred course because it promotes the evenhanded, predictable, and consistent development of legal principles, fosters reliance on judicial decisions, and contributes to the actual and perceived integrity of the judicial process.", "ko": "선례구속이 바람직한 길인 까닭은, 그것이 법원칙을 공평하고 예측 가능하며 일관되게 발전시키고, 사법 판단에 대한 신뢰를 키우며, 사법 과정이 실제로도 겉보기에도 공정하다는 데 기여하기 때문이다.", "case": "Payne v. Tennessee, 501 U.S. 808, 827 (1991)", "decided": "1991. 6. 27. 선고", "gloss": {"evenhanded": "공평한", "foster": "키우다, 북돋우다", "reliance": "신뢰, 의존", "integrity": "온전함, 공정성"}, "why": "선례를 왜 따라야 하는지를 한 문장에 담아 이후 판결이 거듭 인용합니다. 다만 Payne 판결 자신은 바로 이 문장 다음에서 선례구속이 '움직일 수 없는 명령(inexorable command)'은 아니라고 하면서 1987년·1989년의 선례 둘(Booth·Gathers)을 폐기했습니다. 선례를 존중하자는 문장이 선례를 뒤집는 판결 안에 있다는 점이 이 문장을 더 유명하게 만들었습니다.", "links": [{"label": "LII — Payne 판결 원문", "url": "https://www.law.cornell.edu/supremecourt/text/501/808"}, {"label": "Oyez — 사건 개요", "url": "https://www.oyez.org/cases/1990/90-5721"}]}, "korea": {"title": "한국 판사는 대법원 판례를 따라야 할까?", "us": "미국에서는 같은 관할의 상급법원 판결이 이후의 모든 사건에서 하급법원을 구속합니다(binding precedent). 하급법원이 선례가 틀렸다고 생각해도 따라야 하고, 선례를 바꿀 수 있는 것은 그 선례를 만든 법원이나 그 상급법원뿐입니다.", "kr": "한국 헌법 제103조는 '법관은 헌법과 법률에 의하여 그 양심에 따라 독립하여 심판한다'고 정합니다. 법원조직법 제8조가 정한 상급심 판단의 기속력은 '해당 사건에 관하여' 하급심에 미칠 뿐, 다른 사건에는 미치지 않습니다. 그래도 하급심이 대법원 판례와 다르게 판단하면 상고심에서 파기될 가능성이 커서 실무는 대법원 판례를 따르는 편입니다. 대법원이 종전 판례를 바꾸려면 대법관 전원의 3분의 2 이상으로 구성된 합의체에서 재판해야 합니다(같은 법 제7조 제1항 제3호).", "say": "In Korea, a Supreme Court decision binds lower courts only in the same case. In practice, however, lower courts usually follow it.", "say_ko": "한국에서 대법원 판결은 같은 사건에서만 하급법원을 구속합니다. 그러나 실제로는 하급법원이 대체로 대법원 판례를 따릅니다."}}, "quiz": [{"q": "'Korea is a civil law country.'의 뜻으로 맞는 것은?", "options": ["한국은 민사소송이 많은 나라다.", "한국은 대륙법계 국가다.", "한국은 시민의 권리를 중시하는 나라다."], "answer": 1, "why": "common law와 대비되는 civil law는 대륙법(계)입니다. criminal law와 대비될 때만 '민사법'입니다."}, {"q": "미국 법률가가 'a state'라고 하면 보통 가리키는 것은?", "options": ["국가", "주(州)", "상태"], "answer": 1, "why": "미국 영어에서 state는 대개 주입니다. 연방은 federal로 구별합니다."}, {"q": "같은 관할의 상급법원이 내려 하급법원이 반드시 따라야 하는 선례는?", "options": ["persuasive authority", "binding authority", "dicta"], "answer": 1, "why": "binding(mandatory) authority는 따라야 하고, persuasive authority는 참고만 합니다. dicta(방론)는 16장에서 다룹니다."}, {"q": "문법: 처음 언급하는, 아직 특정되지 않은 법률 한 건을 말한다면 빈칸에 맞는 것은? — Congress passed ____ new law last year.", "options": ["a", "the", "(관사 없음)"], "answer": 0, "why": "처음 말하는 법률 한 건은 셀 수 있는 a law입니다. 관사 없는 law는 '법 일반'(She studies law)입니다.", "grammar": "G3"}, {"q": "번역해 보세요: Overruling precedent is never a small matter.", "options": ["선례를 따르는 것은 결코 사소한 일이 아니다.", "선례를 폐기하는 것은 결코 작은 일이 아니다.", "선례가 없는 사건은 결코 작은 사건이 아니다."], "answer": 1, "why": "overrule은 (선례를) 폐기하다. Kimble v. Marvel(2015)의 문장입니다."}]}, {"chapter": {"num": 2, "title": "법원 지도와 법정의 사람들", "subtitle": "연방제와 영미 법원 구조", "title_en": "The Court Map and the People in the Courtroom — Federalism and Anglo-American Courts", "lead": "미국에는 법원 체계가 둘 있습니다. 연방법원은 94개 지방법원(district court) → 13개 항소법원(court of appeals) → 연방대법원의 세 층입니다. 50개 주는 저마다 1심과 주 대법원을 따로 두고, 많은 주가 그 사이에 중간 항소심을 둡니다. 잉글랜드·웨일스는 하나의 체계 안에서 민사는 High Court, 형사는 Crown Court를 거쳐 Court of Appeal과 영국 대법원(UK Supreme Court)으로 올라갑니다. 이 장의 앞부분은 이 지도를, 뒷부분은 그 법정 안에서 일하는 사람들의 이름을 다룹니다.", "can_say": [{"en": "The case was filed in federal district court, not in state court.", "ko": "그 사건은 주법원이 아니라 연방지방법원에 제기되었습니다."}, {"en": "The court of appeals affirmed, and the Supreme Court denied review.", "ko": "항소법원은 원심을 유지했고, 연방대법원은 상고를 받아들이지 않았습니다."}, {"en": "Your Honor, may I approach the bench?", "ko": "재판장님, 판사석으로 가도 되겠습니까?"}]}, "entries": [{"id": "federalism", "hw": "federalism · dual court system", "ipa": "ˈfed.ɚ.əl.ɪ.zəm · ˈduː.əl ˈkɔːrt ˌsɪs.təm", "stress": "**fed**·er·al·ism · **du**·al **court** sys·tem", "stars": 3, "gloss": "연방주의 · (연방·주) 이원적 법원 체계", "diff": "한국 법원은 하나의 체계입니다. 미국은 연방법원과 주법원이 위아래가 아니라 나란히 서 있고, 주법원 판결이 연방대법원으로 가는 길은 연방법 문제가 걸린 경우로 좁습니다.", "examples": {"easy": {"en": "The United States has two court systems.", "ko": "미국에는 법원 체계가 둘 있다."}, "practice": {"en": "Under federalism, a contract dispute between neighbors stays in state court.", "ko": "연방주의 아래에서 이웃 간의 계약 분쟁은 주법원에 남는다."}, "source": {"en": "It should never be forgotten that this slogan, 'Our Federalism,' born in the early struggling days of our Union of States, occupies a highly important place in our Nation's history and its future.", "ko": "'우리의 연방주의'라는 이 표어가, 주들의 연합이 고투하던 초창기에 태어나 이 나라의 역사와 미래에서 매우 중요한 자리를 차지한다는 점을 결코 잊어서는 안 된다.", "cite": "Younger v. Harris, 401 U.S. 37, 45 (1971)", "url": "https://www.law.cornell.edu/supremecourt/text/401/37", "glossary": {"slogan": "표어", "Union of States": "주들의 연합(미합중국)"}}}, "box": "Younger 판결은 연방법원이 진행 중인 주 형사재판에 원칙적으로 끼어들지 말라고 했습니다(Younger abstention). 반대 방향도 있습니다. 연방대법원은 Tafflin v. Levitt(1990)에서 주법원도 연방법 사건을 재판할 권한이 있다고 했습니다(→ state court). 두 체계는 서로 존중하며 겹쳐 돌아갑니다.", "grammar": {"axis": "G1", "title": "추상명사 federalism에는 관사가 없다", "wrong": "The federalism divides power between two governments.", "right": "Federalism divides power between the federal government and the states.", "note": "제도·사상 이름(federalism, democracy)은 관사 없이 씁니다. 반면 정해진 대상인 the federal government, the states에는 the."}, "collocations": ["dual sovereignty (이중 주권)", "federal court / state court", "the federal system"], "links": [{"label": "LII Wex — federalism", "url": "https://www.law.cornell.edu/wex/federalism"}, {"label": "LII Wex — federal courts", "url": "https://www.law.cornell.edu/wex/federal_courts"}]}, {"id": "us-district-court", "hw": "U.S. District Court", "ipa": "ˌjuːˈes ˌdɪs.trɪkt ˈkɔːrt", "stress": "U.**S.** dis·trict **court**", "stars": 3, "gloss": "연방지방법원(연방 1심 법원)", "diff": "연방 사법구(judicial district)는 94개입니다. 주마다 적어도 하나가 있고, 큰 주는 여럿으로 나뉩니다. 한국 지방법원처럼 지역 이름을 붙여 부릅니다.", "examples": {"easy": {"en": "She works at a federal district court.", "ko": "그녀는 연방지방법원에서 일한다."}, "practice": {"en": "The suit was filed in the U.S. District Court for the Southern District of New York.", "ko": "소송은 뉴욕남부 연방지방법원에 제기되었다."}, "source": {"en": "There shall be in each judicial district a district court which shall be a court of record known as the United States District Court for the district.", "ko": "각 사법구에 기록법원인 지방법원을 두며, 이를 그 사법구의 미합중국 지방법원이라 한다.", "cite": "28 U.S.C. § 132(a)", "url": "https://www.law.cornell.edu/uscode/text/28/132", "glossary": {"judicial district": "사법구(법원 관할 구역)", "court of record": "기록법원(재판 기록을 공식 보존하는 법원)"}}}, "box": "연방법원 행정처 사이트(uscourts.gov)는 연방 사법구를 94개로 적습니다. 사건 표시에는 S.D.N.Y.(뉴욕남부), N.D. Cal.(캘리포니아북부)처럼 약어를 씁니다.", "grammar": {"axis": "G1", "title": "the ... for the ... 구조", "wrong": "U.S. District Court for Northern District of California", "right": "the U.S. District Court for the Northern District of California", "note": "법원 정식 명칭과 사법구 이름 앞에 각각 the를 붙입니다. of/for로 범위가 정해지는 고유 명칭의 공통 원리입니다."}, "collocations": ["the Southern District of New York (S.D.N.Y.)", "district judge", "file in district court"], "links": [{"label": "U.S. Courts — About U.S. District Courts", "url": "https://www.uscourts.gov/about-federal-courts/court-role-and-structure/about-us-district-courts"}, {"label": "LII Wex — district court", "url": "https://www.law.cornell.edu/wex/district_court"}]}, {"id": "us-court-of-appeals", "hw": "U.S. Court of Appeals · circuit", "ipa": "ˌjuːˈes ˌkɔːrt əv əˈpiːlz · ˈsɝː.kɪt", "stress": "U.**S.** court of ap·**peals** · **cir**·cuit", "stars": 3, "gloss": "연방항소법원 · 순회구(항소법원의 관할 구역)", "diff": "연방 순회구는 13개입니다. 12개는 지역 순회구(제1~11순회구와 D.C. 순회구)이고, 나머지 하나가 전국을 관할하는 연방순회구입니다. circuit이라는 이름은 옛날 판사들이 구역을 돌며(ride circuit) 재판하던 데서 왔습니다.", "examples": {"easy": {"en": "The Ninth Circuit sits in San Francisco.", "ko": "제9순회구 항소법원은 샌프란시스코에 있다."}, "practice": {"en": "The defendant appealed to the U.S. Court of Appeals for the Second Circuit.", "ko": "피고는 제2순회구 연방항소법원에 항소했다."}, "source": {"en": "There shall be in each circuit a court of appeals, which shall be a court of record, known as the United States Court of Appeals for the circuit.", "ko": "각 순회구에 기록법원인 항소법원을 두며, 이를 그 순회구의 미합중국 항소법원이라 한다.", "cite": "28 U.S.C. § 43(a)", "url": "https://www.law.cornell.edu/uscode/text/28/43"}}, "box": "uscourts.gov에 따르면 연방대법원이 구두변론을 여는 사건은 한 해 100건이 안 됩니다. 그래서 연방 사건은 항소법원에서 사실상 끝나는 일이 많고, 항소법원 판결은 그 순회구 안의 하급법원을 구속합니다.", "pitfalls": ["circuit court를 '순회재판소'로 옮기기 — 연방에서는 그냥 '항소법원'", "일부 주는 1심 법원 이름이 circuit court다(예: 메릴랜드). 연방항소법원과 혼동하지 않는다"], "grammar": {"axis": "G2", "title": "복수형은 courts of appeals", "wrong": "two court of appeals", "right": "two courts of appeals", "note": "복수의 s는 머리명사 court에 붙습니다. 미국 연방 명칭은 appeals도 복수형 그대로입니다. 잉글랜드는 단수 Court of Appeal(→ uk-courts)."}, "collocations": ["the Ninth Circuit", "circuit judge", "ride circuit (순회 재판하다, 역사적 표현)"], "links": [{"label": "U.S. Courts — About the U.S. Courts of Appeals", "url": "https://www.uscourts.gov/about-federal-courts/court-role-and-structure/about-us-courts-appeals"}, {"label": "LII Wex — circuit court", "url": "https://www.law.cornell.edu/wex/circuit_court"}]}, {"id": "federal-circuit", "hw": "the Federal Circuit", "ipa": "ðə ˈfed.ɚ.əl ˈsɝː.kɪt", "stress": "the **Fed**·er·al **Cir**·cuit", "stars": 2, "gloss": "연방순회항소법원(CAFC)", "diff": "지역이 아니라 사건 종류로 관할이 정해지는 항소법원입니다. 전국의 특허 사건 항소, 연방청구법원·국제무역법원 사건의 항소를 맡습니다(28 U.S.C. § 1295). 한국에서 특허 침해 항소를 특허법원(IP High Court of Korea)이 모아 맡는 것과 발상이 비슷합니다.", "examples": {"easy": {"en": "Patent appeals go to the Federal Circuit.", "ko": "특허 항소 사건은 연방순회항소법원으로 간다."}, "practice": {"en": "The Federal Circuit reversed the district court's claim construction.", "ko": "연방순회항소법원은 지방법원의 청구항 해석을 파기했다."}}, "grammar": {"axis": "G1", "title": "순회구 이름에는 the", "wrong": "He clerked for Federal Circuit.", "right": "He clerked for the Federal Circuit. / ... for the Ninth Circuit.", "note": "법원을 순회구 이름으로 줄여 부를 때도 the를 붙입니다. 약칭도 the CAFC."}, "collocations": ["Court of Appeals for the Federal Circuit (CAFC)", "exclusive jurisdiction over patent appeals"], "links": [{"label": "U.S. Court of Appeals for the Federal Circuit (공식)", "url": "https://www.cafc.uscourts.gov/"}, {"label": "LII Wex — U.S. Court of Appeals for the Federal Circuit", "url": "https://www.law.cornell.edu/wex/u.s._court_of_appeals_for_the_federal_circuit"}]}, {"id": "circuit-split", "hw": "circuit split", "ipa": "ˈsɝː.kɪt ˌsplɪt", "stress": "**cir**·cuit split", "stars": 2, "gloss": "순회구 간 견해 대립", "diff": "같은 연방법을 두고 항소법원끼리 결론이 갈린 상태입니다. 한국은 대법원이 사건을 받아 정리하지만, 미국에서는 연방대법원이 상고를 허가해 주어야 비로소 정리됩니다.", "examples": {"easy": {"en": "There is a circuit split on this issue.", "ko": "이 쟁점에 순회구 간 견해 대립이 있다."}, "practice": {"en": "The petition argues that the decision deepens a circuit split.", "ko": "상고허가 신청서는 그 판결이 순회구 간 대립을 더 깊게 한다고 주장한다."}}, "box": "연방대법원규칙 제10조는 상고허가 사유의 첫째로 '어느 항소법원이 같은 중요 쟁점에 관하여 다른 항소법원의 판결과 충돌하는 판결을 한 경우'를 듭니다. circuit split은 이를 줄여 부르는 실무 용어입니다.", "grammar": {"axis": "G4", "title": "split on 쟁점", "wrong": "a circuit split of this issue", "right": "a circuit split on this issue among the five circuits", "note": "쟁점은 on(over도 씀)으로 잇고, of는 쓰지 않습니다. 여러 순회구 사이는 among이 흔하지만, 각각을 따로 떠올리면 셋 이상이라도 between을 씁니다. resolve a circuit split(대립을 정리하다)도 함께 외웁니다."}, "collocations": ["resolve a circuit split", "deepen / widen a split", "grant certiorari to resolve the split"], "links": [{"label": "LII Wex — circuit split", "url": "https://www.law.cornell.edu/wex/circuit_split"}, {"label": "LII — Supreme Court Rule 10", "url": "https://www.law.cornell.edu/rules/supct/rule_10"}]}, {"id": "federal-question", "hw": "federal question · diversity jurisdiction", "ipa": "ˈfed.ɚ.əl ˈkwes.tʃən · dɪˈvɝː.sə.t̬i ˌdʒʊr.ɪsˈdɪk.ʃən", "stress": "**fed**·er·al **ques**·tion · di·**ver**·si·ty ju·ris·**dic**·tion", "stars": 2, "gloss": "연방문제 관할 · 주(州) 간 시민 관할(다른 주 시민 사이의 사건 관할)", "diff": "연방지방법원에 민사사건을 가져가는 대표적인 두 갈래 길입니다. ① 연방헌법·연방법률·조약에 근거한 사건(28 U.S.C. § 1331), ② 서로 다른 주의 시민 사이 사건으로 소가가 75,000달러를 넘는 경우(§ 1332(a)). ②는 원고와 피고가 같은 주 주민이 하나도 없어야 합니다(complete diversity). 이 밖에 해사사건(§ 1333)처럼 법률이 따로 정한 연방 관할도 있습니다.", "examples": {"easy": {"en": "This case raises a federal question.", "ko": "이 사건에는 연방법 문제가 걸려 있다."}, "practice": {"en": "The plaintiff relies on diversity jurisdiction because the parties are citizens of different states.", "ko": "당사자들이 서로 다른 주의 시민이므로 원고는 주 간 시민 관할을 근거로 든다."}}, "grammar": {"axis": "G4", "title": "arise under — '~에 근거하여 발생하다'", "wrong": "claims arising from federal law (관할 요건을 말할 때)", "right": "claims arising under federal law", "note": "§ 1331의 문언이 arising under입니다. 관할 요건을 말할 때는 이 전치사를 그대로 씁니다."}, "collocations": ["arising under federal law", "complete diversity (완전한 당사자 다양성)", "amount in controversy (소가)"], "links": [{"label": "LII — 28 U.S.C. § 1331", "url": "https://www.law.cornell.edu/uscode/text/28/1331"}, {"label": "LII — 28 U.S.C. § 1332", "url": "https://www.law.cornell.edu/uscode/text/28/1332"}, {"label": "LII Wex — diversity jurisdiction", "url": "https://www.law.cornell.edu/wex/diversity_jurisdiction"}]}, {"id": "state-court", "hw": "state court · state supreme court", "ipa": "ˌsteɪt ˈkɔːrt · ˌsteɪt suːˌpriːm ˈkɔːrt", "stress": "state **court** · state su·preme **court**", "stars": 3, "gloss": "주법원 · 주 대법원(주의 최고법원)", "diff": "uscourts.gov는 민사·형사 사건의 대다수(the vast majority)가 주법원에 제기된다고 적습니다. 주 최고법원의 이름은 주마다 달라서, 뉴욕주의 최고법원은 Court of Appeals입니다(→ 이 장의 「가짜 친구」).", "examples": {"easy": {"en": "Most traffic cases go to state court.", "ko": "교통 사건은 대개 주법원으로 간다."}, "practice": {"en": "The California Supreme Court will hear the case next month.", "ko": "캘리포니아주 대법원이 다음 달 그 사건을 심리한다."}, "source": {"en": "Under this system of dual sovereignty, we have consistently held that state courts have inherent authority, and are thus presumptively competent, to adjudicate claims arising under the laws of the United States.", "ko": "이러한 이중 주권 체계 아래에서, 우리는 주법원이 고유한 권한을 가지며 따라서 미합중국 법률에 근거한 청구를 재판할 권한이 있다고 추정된다고 일관되게 판시해 왔다.", "cite": "Tafflin v. Levitt, 493 U.S. 455, 458 (1990)", "url": "https://www.law.cornell.edu/supremecourt/text/493/455", "glossary": {"dual sovereignty": "이중 주권", "presumptively competent": "권한이 있다고 추정되는", "adjudicate": "재판하다"}}}, "grammar": {"axis": "G4", "title": "in state court — 무관사 관용", "wrong": "Contract cases are usually filed in the state court. (일반론일 때)", "right": "Contract cases are usually filed in state court. / ... in federal court.", "note": "특정 법원이 아니라 '주법원 쪽'을 말할 때는 관사 없이 in state court, in federal court라고 합니다. 특정 법원을 가리키면 the state court."}, "collocations": ["in state court / in federal court", "state court of last resort (주 최종심 법원)", "the highest court of a State"], "links": [{"label": "LII Wex — state court", "url": "https://www.law.cornell.edu/wex/state_court"}, {"label": "LII Wex — state supreme court", "url": "https://www.law.cornell.edu/wex/state_supreme_court"}]}, {"id": "intermediate-appellate-court", "hw": "intermediate appellate court", "ipa": "ˌɪn.t̬ɚˈmiː.di.ət əˈpel.ət ˌkɔːrt", "stress": "in·ter·**me**·di·ate ap·**pel**·late court", "stars": 2, "gloss": "중간 항소법원(1심과 최고법원 사이의 항소심)", "diff": "한국의 고등법원·지방법원 항소부에 해당하는 층입니다. 이름은 주마다 다릅니다(Court of Appeals, Appellate Division 등). 이 층 없이 주 대법원이 바로 항소를 받는 주도 있습니다.", "examples": {"easy": {"en": "She lost at trial and appealed.", "ko": "그녀는 1심에서 지고 항소했다."}, "practice": {"en": "The intermediate appellate court affirmed, so the defendant sought review in the state supreme court.", "ko": "중간 항소법원이 원심을 유지하자, 피고는 주 대법원에 상고를 신청했다."}}, "grammar": {"axis": "G4", "title": "appeal to 상급법원 / from 원판결", "wrong": "He appealed the higher court against the judgment.", "right": "He appealed the judgment to the court of appeals. / an appeal from the district court", "note": "가는 곳은 to, 불복 대상은 from. 미국 영어는 appeal the judgment처럼 타동사로도 씁니다(영국은 appeal against)."}, "collocations": ["appeal to / appeal from", "appellate court", "court of last resort (최종심)"], "links": [{"label": "LII Wex — appellate court", "url": "https://www.law.cornell.edu/wex/appellate_court"}]}, {"id": "en-banc", "hw": "en banc", "ipa": "ɑːn ˈbɑːŋk", "stress": "en **banc**", "stars": 2, "gloss": "전원합의체로(항소법원 현직 판사들이 함께)", "pron_tip": "프랑스어에서 온 말입니다. en은 /ɑːn/, banc의 c는 /k/로 소리 냅니다. banc은 발음 사전(Cambridge US) 미수록이라 미국 법조 관행 발음으로 적었습니다.", "diff": "연방항소법원은 보통 3인 합의부(panel)로 재판하고(28 U.S.C. § 46(c)), 중요 사건이나 판결 통일이 필요할 때만 원칙적으로 현직(regular active service) 판사 전원이 다시 심리합니다. 법률에 따라 일부 판사만으로 전원합의체를 꾸리는 법원도 있고, senior 판사가 참여할 수 있는 예외도 있습니다. 한국 대법원 전원합의체와 닮았지만, 미국에서는 항소법원 단계의 제도입니다.", "examples": {"easy": {"en": "All the judges heard the case en banc.", "ko": "판사 전원이 전원합의체로 그 사건을 심리했다."}, "practice": {"en": "The Ninth Circuit granted rehearing en banc and vacated the panel opinion.", "ko": "제9순회구는 전원합의체 재심리를 받아들이고 합의부 판결을 취소했다."}}, "grammar": {"axis": "G6", "title": "sit en banc / rehear en banc", "wrong": "The court made en banc.", "right": "The court sat en banc. / The court reheard the case en banc.", "note": "en banc는 부사처럼 동사 뒤에 붙습니다. 명사 앞에 오면 en banc review, the en banc court처럼 형용사가 됩니다."}, "collocations": ["rehearing en banc", "sit en banc", "the en banc court"], "links": [{"label": "LII Wex — en banc", "url": "https://www.law.cornell.edu/wex/en_banc"}]}, {"id": "ny-supreme-court", "hw": "New York Supreme Court", "ipa": "ˌnuː ˈjɔːrk suːˌpriːm ˈkɔːrt", "stress": "New **York** su·preme **court**", "stars": 1, "false_friend": true, "gloss": "뉴욕주 1심 법원(일반 관할 법원)", "diff": "이름은 Supreme이지만 뉴욕주의 최고법원이 아닙니다. 뉴욕주 헌법 제6조 제7항은 Supreme Court에 법과 형평의 일반 1심 관할(general original jurisdiction in law and equity)을 주고, 최고법원은 같은 조 제2항의 Court of Appeals(법원장 chief judge 1명과 배석판사 associate judges 6명, 임기 14년)입니다. 그 사이에서 Supreme Court의 Appellate Division이 항소심을 맡는데, 주를 4개 사법부(judicial departments)로 나누어 제1·2부에는 7명, 제3·4부에는 5명의 Supreme Court 판사를 배치합니다(제4항).", "examples": {"easy": {"en": "The trial was held in New York Supreme Court.", "ko": "재판은 뉴욕주 1심 법원에서 열렸다."}, "practice": {"en": "The New York Court of Appeals, the state's highest court, reversed the Appellate Division.", "ko": "뉴욕주 최고법원인 Court of Appeals가 항소부 판결을 파기했다."}}, "pitfalls": ["New York Supreme Court를 '뉴욕주 대법원'으로 옮기기", "New York Court of Appeals를 연방항소법원과 혼동하기"], "grammar": {"axis": "G1", "title": "고유 명칭 the Court of Appeals vs 일반명사 a court of appeals", "wrong": "New York's highest court is a Court of Appeals.", "right": "New York's highest court is the Court of Appeals.", "note": "하나뿐인 특정 법원의 이름은 대문자 + the. 여러 개 중 하나를 일반적으로 말할 때만 a court of appeals."}, "collocations": ["the Appellate Division", "the New York Court of Appeals", "the state's highest court"], "links": [{"label": "Wikipedia — New York Supreme Court", "url": "https://en.wikipedia.org/wiki/New_York_Supreme_Court"}, {"label": "Wikipedia — New York Court of Appeals", "url": "https://en.wikipedia.org/wiki/New_York_Court_of_Appeals"}]}, {"id": "uk-courts", "hw": "High Court · Court of Appeal · Crown Court", "ipa": "ˌhaɪ ˈkɔːrt · ˌkɔːrt əv əˈpiːl · ˌkraʊn ˈkɔːrt", "stress": "High **Court** · Court of Ap·**peal** · Crown **Court**", "stars": 2, "uk": "잉글랜드·웨일스 법원 이름", "gloss": "고등법원(중요 민사 1심) · 항소법원 · 형사법원(중죄 1심)", "diff": "잉글랜드·웨일스의 High Court는 한국 고등법원과 달리 주로 큰 민사사건의 1심입니다(King's Bench·Chancery·Family 부). 중죄 형사사건은 Crown Court에서 배심재판을 받고, 그 위에 Court of Appeal(민사부·형사부)이 있습니다. 작은 민사는 County Court, 경미한 형사는 Magistrates' court가 맡습니다.", "examples": {"easy": {"en": "The trial took place in the Crown Court.", "ko": "재판은 형사법원에서 열렸다."}, "practice": {"en": "The claim was issued in the High Court, and the Court of Appeal later dismissed the appeal.", "ko": "청구는 고등법원에 제기되었고, 이후 항소법원은 항소를 기각했다."}}, "pitfalls": ["High Court를 한국 '고등법원(항소심)'으로 등치하기", "잉글랜드는 단수 Court of Appeal — 미국식 Court of Appeals와 섞어 쓰지 않는다"], "grammar": {"axis": "G4", "title": "in the High Court / at 지명 Crown Court", "wrong": "The case was heard at High Court.", "right": "The case was heard in the High Court. / He was tried at Southwark Crown Court.", "note": "법원 이름은 in the ~. 특정 장소의 법원 건물을 말할 때는 at을 많이 씁니다."}, "collocations": ["the King's Bench Division", "the Court of Appeal (Criminal Division)", "trial in the Crown Court"], "links": [{"label": "Judiciary UK — High Court", "url": "https://www.judiciary.uk/courts-and-tribunals/high-court/"}, {"label": "Judiciary UK — Court of Appeal", "url": "https://www.judiciary.uk/courts-and-tribunals/court-of-appeal-home/"}, {"label": "Judiciary UK — Crown Court", "url": "https://www.judiciary.uk/courts-and-tribunals/crown-court/"}]}, {"id": "uk-supreme-court", "hw": "UK Supreme Court", "ipa": "ˌjuːˈkeɪ suːˌpriːm ˈkɔːrt", "stress": "U·**K** su·preme **court**", "stars": 2, "uk": "the Supreme Court of the United Kingdom", "gloss": "영국 대법원(2009. 10. 1. 설립)", "diff": "그 전에는 상원(House of Lords)이 최종심이었습니다. 2005년 헌법개혁법(Constitutional Reform Act 2005) 제23조가 대법원을 두었고, 시행령(SI 2009/1604)에 따라 그 조문이 2009. 10. 1. 시행되었습니다. 최종심을 의회 밖으로 옮긴 개혁입니다.", "examples": {"easy": {"en": "The UK Supreme Court opened in 2009.", "ko": "영국 대법원은 2009년에 문을 열었다."}, "practice": {"en": "Before 2009, final appeals went to the House of Lords.", "ko": "2009년 전에는 최종 상고가 상원으로 갔다."}}, "grammar": {"axis": "G1", "title": "기관명에는 the", "wrong": "Appeal was heard by Supreme Court.", "right": "The appeal was heard by the Supreme Court.", "note": "하나뿐인 기관(the Supreme Court, the House of Lords)에는 the. 특정 사건의 항소(the appeal)도 the."}, "collocations": ["the House of Lords", "Justices of the Supreme Court", "permission to appeal (상고허가)"], "links": [{"label": "legislation.gov.uk — Constitutional Reform Act 2005, s. 23", "url": "https://www.legislation.gov.uk/ukpga/2005/4/section/23"}, {"label": "legislation.gov.uk — SI 2009/1604 제2조(시행일)", "url": "https://www.legislation.gov.uk/uksi/2009/1604/article/2/made"}, {"label": "UK Supreme Court — 건물과 설립 연혁", "url": "https://www.supremecourt.uk/about-the-building/history"}]}, {"id": "court", "hw": "court", "ipa": "kɔːrt", "stress": "**court**", "stars": 3, "gloss": "법원, 재판부, (판결문에서) 이 법원", "diff": "판결문에서 the Court(대문자)는 대개 그 판결을 쓰는 법원 자신을, the court below는 원심을 가리킵니다. 한국어 '법원'보다 '재판부'에 가깝게 쓰일 때가 많습니다.", "examples": {"easy": {"en": "We will see you in court.", "ko": "법정에서 봅시다."}, "practice": {"en": "The court granted the motion, and the defendant appealed.", "ko": "재판부는 그 신청을 받아들였고, 피고는 항소했다."}, "source": {"en": "The judicial power of the United States, shall be vested in one Supreme Court, and in such inferior courts as the Congress may from time to time ordain and establish.", "ko": "미합중국의 사법권은 하나의 대법원과, 연방의회가 수시로 제정·설치하는 하급법원에 속한다.", "cite": "U.S. Const. art. III, § 1", "url": "https://www.law.cornell.edu/constitution/articleiii", "glossary": {"vest": "(권한을) 부여하다, ~에 속하게 하다", "inferior courts": "하급법원", "ordain and establish": "제정하여 설치하다"}}}, "box": "연방헌법이 직접 만든 법원은 연방대법원 하나뿐입니다. 지방법원·항소법원은 모두 이 조문에 따라 의회가 법률(28 U.S.C.)로 만든 '하급법원'입니다.", "grammar": {"axis": "G1", "title": "go to court / in court — 관사 없는 관용구", "wrong": "They decided to go to the court. (소송을 한다는 뜻일 때)", "right": "They decided to go to court. / She testified in court.", "note": "'소송하다·법정에서'라는 기능을 말하면 관사 없이 go to court, in court. 건물이나 특정 재판부를 가리키면 the court."}, "collocations": ["go to court", "in court / out of court", "the court below (원심)", "take A to court"], "links": [{"label": "LII Wex — court", "url": "https://www.law.cornell.edu/wex/court"}]}, {"id": "trial-court", "hw": "trial court · appellate court", "ipa": "ˈtraɪ.əl ˌkɔːrt · əˈpel.ət ˌkɔːrt", "stress": "**tri**·al court · ap·**pel**·late court", "stars": 3, "gloss": "1심 법원(사실심) · 상소 법원", "diff": "trial court는 증인을 듣고 사실을 정하는 법원이고, appellate court는 기록을 보고 법률 적용이 옳았는지를 심사합니다. uscourts.gov는 항소법원이 사건을 다시 재판하거나 새 증거를 듣지 않고, 배심도 없다고 설명합니다. 한국 항소심이 속심으로 사실심리를 이어 가는 것과 다른 점입니다.", "examples": {"easy": {"en": "The trial court heard ten witnesses.", "ko": "1심 법원은 증인 열 명을 신문했다."}, "practice": {"en": "On appeal, the appellate court reviews the record, not new evidence.", "ko": "항소심에서 상소 법원은 새 증거가 아니라 기록을 심사한다."}, "source": {"en": "Findings of fact, whether based on oral or other evidence, must not be set aside unless clearly erroneous, and the reviewing court must give due regard to the trial court's opportunity to judge the witnesses' credibility.", "ko": "사실인정은 구두 증거에 기초한 것이든 다른 증거에 기초한 것이든 명백히 잘못된 것이 아니면 파기되어서는 안 되며, 심사하는 법원은 증인의 신빙성을 판단할 수 있었던 1심 법원의 기회를 충분히 존중하여야 한다.", "cite": "Fed. R. Civ. P. 52(a)(6)", "url": "https://www.law.cornell.edu/rules/frcp/rule_52", "glossary": {"set aside": "파기하다", "clearly erroneous": "명백히 잘못된(심사기준 → 4장)", "due regard": "마땅한 존중"}}}, "grammar": {"axis": "G4", "title": "at trial / on appeal", "wrong": "In the trial, he lost. In the appeal, he won.", "right": "He lost at trial but won on appeal.", "note": "절차 단계를 말할 때 관용 전치사가 정해져 있습니다. 1심 재판 단계는 at trial, 항소 단계는 on appeal(관사 없음)."}, "collocations": ["at trial", "on appeal", "the reviewing court (심사 법원)", "lower court (하급심)"], "links": [{"label": "LII Wex — trial court", "url": "https://www.law.cornell.edu/wex/trial_court"}, {"label": "LII Wex — appellate court", "url": "https://www.law.cornell.edu/wex/appellate_court"}]}, {"id": "district-court", "hw": "district court · court of appeals", "ipa": "ˌdɪs.trɪkt ˈkɔːrt · ˌkɔːrt əv əˈpiːlz", "stress": "dis·trict **court** · court of ap·**peals**", "stars": 3, "gloss": "지방법원(1심) · 항소법원", "diff": "연방 정식 명칭(→ us-district-court, us-court-of-appeals)과 별개로, 판결문·기사에서는 소문자 일반명사로 짧게 the district court, the court of appeals라고 부릅니다. 주법원 체계에서도 같은 이름을 쓰는 주가 있어 문맥으로 연방인지 주인지 가립니다.", "examples": {"easy": {"en": "The district court ruled for the plaintiff.", "ko": "지방법원은 원고 승소 판결을 했다."}, "practice": {"en": "The court of appeals reversed the district court and remanded the case.", "ko": "항소법원은 지방법원 판결을 파기하고 사건을 환송했다."  그중 6명으로 정족수를 이룬다.", "cite": "28 U.S.C. § 1", "url": "https://www.law.cornell.edu/uscode/text/28/1", "glossary": {"associate justice": "(대법원장이 아닌) 대법관", "quorum": "정족수"}}}, "grammar": {"axis": "G1", "title": "the Supreme Court — 하나뿐인 기관", "wrong": "Supreme Court denied review.", "right": "The Supreme Court denied review.", "note": "특정 국가의 하나뿐인 최고법원은 the를 붙여 대문자로 씁니다. 주 대법원도 the California Supreme Court."}, "collocations": ["the Supreme Court of the United States", "take a case to the Supreme Court", "deny certiorari"], "links": [{"label": "LII Wex — Supreme Court", "url": "https://www.law.cornell.edu/wex/supreme_court"}]}, {"id": "judge", "hw": "judge · justice", "ipa": "dʒʌdʒ · ˈdʒʌs.tɪs", "stress": "**judge** · **jus**·tice", "stars": 3, "gloss": "판사 · 대법관(연방대법원과 일부 주 최고법원 판사)", "diff": "연방대법원 판사는 Justice, 그 아래 법원 판사는 Judge입니다. 다만 뉴욕주처럼 1심(Supreme Court) 판사를 Justice라고 부르는 곳도 있어 이름만 보고 등급을 단정할 수 없습니다. 소문자 justice는 '정의'입니다.", "examples": {"easy": {"en": "Judge Park will hear the case.", "ko": "박 판사가 그 사건을 맡는다."}, "practice": {"en": "Justice Lee wrote the majority opinion.", "ko": "이 대법관이 다수의견을 집필했다."}, "source": {"en": "Each justice or judge of the United States shall take the following oath or affirmation before performing the duties of his office", "ko": "미합중국의 각 대법관 또는 판사는 직무를 수행하기 전에 다음과 같이 선서 또는 확약을 하여야 한다", "cite": "28 U.S.C. § 453", "url": "https://www.law.cornell.edu/uscode/text/28/453", "glossary": {"oath or affirmation": "선서 또는 (종교적 표현을 뺀) 확약"}}}, "box": "이어지는 선서문은 '사람을 가리지 않고 정의를 행하며, 가난한 이와 부자에게 똑같은 권리를 주겠다'는 내용입니다. 한 조문 안에 justice가 '대법관'과 '정의' 두 뜻으로 함께 나옵니다.", "grammar": {"axis": "G4", "title": "before the judge — 판사 앞에서", "wrong": "The case is in front of Judge Kim's court.", "right": "The case is pending before Judge Kim. / He appeared before the judge.", "note": "판사·법원 앞에 사건이 걸려 있거나 출석할 때는 before. 직함 + 성(Judge Kim)에는 관사를 붙이지 않습니다."}, "collocations": ["appear before the judge", "presiding judge (재판장)", "the trial judge", "Justice + 성"], "links": [{"label": "LII Wex — judge", "url": "https://www.law.cornell.edu/wex/judge"}, {"label": "LII Wex — justice", "url": "https://www.law.cornell.edu/wex/justice"}]}, {"id": "magistrate-judge", "hw": "magistrate judge", "ipa": "ˈmædʒ.ə.streɪt ˌdʒʌdʒ", "stress": "**mag**·is·trate judge", "stars": 1, "gloss": "연방 치안판사(지방법원 보조 판사)", "diff": "연방지방법원 판사가 임명하는 임기제 판사로, 영장·초기 심리·증거개시 분쟁 등을 맡고 당사자가 동의하면 민사 본안도 재판합니다(28 U.S.C. § 636). 종신직 district judge와 신분이 다릅니다. 한국에 딱 맞는 직위는 없습니다.", "examples": {"easy": {"en": "A magistrate judge signed the warrant.", "ko": "치안판사가 영장에 서명했다."}, "practice": {"en": "The discovery dispute was referred to the magistrate judge.", "ko": "증거개시 분쟁은 치안판사에게 회부되었다."}}, "grammar": {"axis": "G4", "title": "refer A to B — B에게 회부하다", "wrong": "The matter was referred for the magistrate judge.", "right": "The matter was referred to the magistrate judge.", "note": "사건을 다른 판사·기관에 넘길 때는 refer ... to. 명사는 referral."}, "collocations": ["refer to a magistrate judge", "report and recommendation (R&R, 보고 및 권고)"], "links": [{"label": "LII Wex — magistrate", "url": "https://www.law.cornell.edu/wex/magistrate"}, {"label": "LII — 28 U.S.C. § 636", "url": "https://www.law.cornell.edu/uscode/text/28/636"}]}, {"id": "chief-justice", "hw": "chief judge · Chief Justice", "ipa": "ˌtʃiːf ˈdʒʌdʒ · ˌtʃiːf ˈdʒʌs.tɪs", "stress": "chief **judge** · Chief **Jus**·tice", "stars": 2, "gloss": "(하급법원) 법원장 · 연방대법원장", "diff": "연방 지방법원·항소법원의 chief judge는 행정 책임자로, 법정 요건(64세 이하, 그 법원 재직 1년 이상, 법원장 경력 없음)을 갖춘 현직 판사 가운데 임명이 가장 앞선 판사가 7년 임기로 맡습니다(28 U.S.C. §§ 45(a), 136(a)). 연방대법원장의 공식 직함은 Chief Justice of the United States입니다(28 U.S.C. § 1).", "examples": {"easy": {"en": "The Chief Justice spoke first.", "ko": "대법원장이 먼저 말했다."}, "practice": {"en": "The chief judge assigned the case to a three-judge panel.", "ko": "법원장이 그 사건을 3인 합의부에 배당했다."}}, "grammar": {"axis": "G1", "title": "the Chief Justice / Chief Justice + 이름", "wrong": "The Chief Justice Roberts", "right": "the Chief Justice / Chief Justice Roberts", "note": "직함만 쓰면 the, 직함 바로 뒤에 이름이 오면 관사를 뺍니다. Judge Kim, President Lee와 같은 원리."}, "collocations": ["Chief Justice of the United States", "chief judge of the circuit", "Associate Justice"], "links": [{"label": "LII Wex — Chief Justice", "url": "https://www.law.cornell.edu/wex/chief_justice"}]}, {"id": "bench", "hw": "bench", "ipa": "bentʃ", "stress": "**bench**", "stars": 2, "false_friend": true, "gloss": "판사석, 법관(직), 법관 전체", "diff": "공원 벤치가 아니라 법정 앞쪽의 높은 판사석입니다. 거기서 뜻이 넓어져 '법관이라는 직업'(join the bench = 판사가 되다), '판사 재판'(bench trial → 4장)까지 가리킵니다.", "examples": {"easy": {"en": "The judge stepped down from the bench.", "ko": "판사가 판사석에서 내려왔다."}, "practice": {"en": "Counsel, please approach the bench.", "ko": "변호인들은 판사석 앞으로 나오십시오."}}, "grammar": {"axis": "G4", "title": "on the bench / approach the bench", "wrong": "She has been in the bench for ten years.", "right": "She has been on the bench for ten years.", "note": "판사로 재직 중이라는 뜻은 on the bench. 판사석으로 다가가는 것은 approach the bench(전치사 없이 타동사)."}, "collocations": ["approach the bench", "on the bench (판사로 재직 중)", "bench trial", "bench and bar (법조계)"], "links": [{"label": "LII Wex — bench", "url": "https://www.law.cornell.edu/wex/bench"}]}, {"id": "bar", "hw": "bar", "ipa": "bɑːr", "stress": "**bar**", "stars": 2, "false_friend": true, "gloss": "변호사단(변호사 사회), 변호사 자격", "diff": "옛 영국 법정에서 판사석과 방청석을 가르던 난간(bar)에서 온 말입니다. 난간 안으로 들어갈 수 있는 사람, 곧 변호사 전체를 뜻하게 되었습니다. 한국어 '변호사회'와 '변호사 자격'을 함께 담습니다.", "examples": {"easy": {"en": "He passed the bar last year.", "ko": "그는 작년에 변호사시험에 합격했다."}, "practice": {"en": "She was admitted to the New York bar in 2020.", "ko": "그녀는 2020년에 뉴욕주 변호사 자격을 얻었다."}}, "pitfalls": ["the bar를 '술집'으로 읽기", "bar exam을 '바 시험'으로 옮기기 — 변호사시험"], "grammar": {"axis": "G4", "title": "be admitted to the bar", "wrong": "She was admitted in the bar.", "right": "She was admitted to the bar. / She is a member of the bar.", "note": "변호사 자격을 얻다는 admitted to. 관사 the를 붙이는 것도 함께 외웁니다."}, "collocations": ["pass the bar (exam)", "be admitted to the bar", "bar association (변호사회)"], "links": [{"label": "LII Wex — bar", "url": "https://www.law.cornell.edu/wex/bar"}]}, {"id": "your-honor", "hw": "Your Honor", "ipa": "jʊr ˈɑː.nɚ", "stress": "your **hon**·or", "stars": 3, "uk": "My Lord / My Lady (잉글랜드 고등법원 이상), Your Honour (영국 철자)", "gloss": "재판장님(판사를 부르는 호칭)", "pron_tip": "honor의 h는 소리 나지 않습니다. /ˈɑː.nɚ/로 모음부터 시작합니다.", "examples": {"easy": {"en": "Yes, Your Honor.", "ko": "네, 재판장님."}, "practice": {"en": "Your Honor, the defense asks for a short recess.", "ko": "재판장님, 변호인 측은 잠시 휴정을 요청합니다."}, "source": {"en": "Wait a minute, Your Honor.", "ko": "잠깐만요, 재판장님.", "cite": "Mayberry v. Pennsylvania, 400 U.S. 455 (1971) (판결이 인용한 재판 기록)", "url": "https://www.law.cornell.edu/supremecourt/text/400/455"}}, "box": "Mayberry 판결은 재판 중 판사를 모욕한 피고인에게 그 판사가 직접 법정모욕죄로 중형을 선고한 사건입니다. 연방대법원은 모욕을 당한 판사가 아닌 다른 판사가 법정모욕 사건을 맡아야 한다고 했습니다. 판결이 인용한 기록 속에서 피고인은 판사를 거칠게 비난하면서도 호칭만은 Your Honor로 부릅니다.", "grammar": {"axis": "G1", "title": "호칭에는 관사가 없다", "wrong": "Yes, the Your Honor. / Thank you, the judge.", "right": "Yes, Your Honor. / Thank you, Your Honor.", "note": "부르는 말(호칭)에는 관사를 붙이지 않습니다. 판사를 3인칭으로 가리킬 때는 the judge 또는 the Court."}, "collocations": ["May it please the Court (상급심 변론 첫마디)", "Your Honor, I object.", "with respect, Your Honor"], "links": [{"label": "LII Wex — Your Honor", "url": "https://www.law.cornell.edu/wex/your_honor"}]}, {"id": "chambers", "hw": "chambers", "ipa": "ˈtʃeɪm.bɚz", "stress": "**cham**·bers", "stars": 2, "false_friend": true, "gloss": "판사실(판사 집무실)", "diff": "'방들'이라는 뜻이 아니라 판사 한 사람의 집무실과 그 직원을 함께 가리킵니다. in chambers는 '공개 법정이 아니라 판사실에서'라는 뜻이고, 라틴어로는 in camera(→ 17장)입니다.", "examples": {"easy": {"en": "The judge is in chambers.", "ko": "판사는 판사실에 있다."}, "practice": {"en": "The lawyers met with the judge in chambers before the hearing.", "ko": "변호사들은 기일 전에 판사실에서 판사와 만났다."}, "source": {"en": "Any other act or proceeding may be done or conducted by a judge in chambers, without the attendance of the clerk or other court official, and anywhere inside or outside the district.", "ko": "그 밖의 행위나 절차는 법원 사무관이나 다른 법원 공무원의 참여 없이 판사실에서 판사가 할 수 있으며, 사법구 안팎 어디에서든 할 수 있다.", "cite": "Fed. R. Civ. P. 77(b)", "url": "https://www.law.cornell.edu/rules/frcp/rule_77"}}, "grammar": {"axis": "G2", "title": "chambers는 늘 -s 형태", "wrong": "The judge's chamber is on the third floor. (판사실의 뜻일 때)", "right": "The judge's chambers are on the third floor.", "note": "판사실은 방이 하나여도 chambers로 씁니다. 동사도 복수(are)가 자연스럽습니다. in chambers에는 관사가 없습니다."}, "collocations": ["in chambers", "judge's chambers", "a conference in chambers"], "links": [{"label": "LII Wex — chambers", "url": "https://www.law.cornell.edu/wex/chambers"}]}, {"id": "law-clerk", "hw": "law clerk", "ipa": "ˈlɑː ˌklɝːk", "stress": "**law** clerk", "stars": 2, "gloss": "재판연구원(로클럭, 판사 개인 연구원)", "diff": "미국 law clerk는 로스쿨 졸업생이 판사 한 명 밑에서 1~2년 판결 초안·조사를 돕는 자리입니다. 한국 재판연구원(로클럭)과 이름이 같고 하는 일도 비슷하지만, 미국은 판사 개인이 뽑고 판사실에 속한다는 점이 다릅니다.", "examples": {"easy": {"en": "My law clerk drafted the memo.", "ko": "내 로클럭이 메모 초안을 썼다."}, "practice": {"en": "After law school, she clerked for a federal judge for a year.", "ko": "로스쿨을 마친 뒤 그녀는 1년 동안 연방판사의 로클럭으로 일했다."}}, "grammar": {"axis": "G4", "title": "clerk for 판사 (동사)", "wrong": "She clerked to Judge Moore.", "right": "She clerked for Judge Moore. / She was a law clerk to Judge Moore.", "note": "동사 clerk는 for를 씁니다. 명사로 쓰면 law clerk to 판사."}, "collocations": ["clerk for a judge", "clerkship (로클럭 근무)"], "links": [{"label": "LII Wex — clerk", "url": "https://www.law.cornell.edu/wex/clerk"}]}, {"id": "court-clerk", "hw": "court clerk", "ipa": "ˈkɔːrt ˌklɝːk", "stress": "**court** clerk", "stars": 2, "gloss": "법원 사무관(법원 서기, 사무국)", "diff": "clerk of court는 서류 접수·기록 보관·소환장 발부를 맡는 사무국과 그 책임자입니다. 판사 개인의 연구원인 law clerk와 이름이 비슷하지만 하는 일이 전혀 다릅니다. 한국 법원 참여사무관·접수계를 함께 떠올리면 가깝습니다.", "examples": {"easy": {"en": "Ask the clerk for a copy.", "ko": "사무관에게 사본을 달라고 하세요."}, "practice": {"en": "The complaint must be filed with the clerk of court by 5 p.m.", "ko": "소장은 오후 5시까지 법원 사무국에 제출해야 한다."}, "source": {"en": "Each district court may appoint a clerk who shall be subject to removal by the court.", "ko": "각 지방법원은 사무관을 임명할 수 있으며, 그 사무관은 법원이 해임할 수 있다.", "cite": "28 U.S.C. § 751(a)", "url": "https://www.law.cornell.edu/uscode/text/28/751"}}, "grammar": {"axis": "G4", "title": "file with the clerk", "wrong": "File the answer to the clerk.", "right": "File the answer with the clerk.", "note": "서면을 법원·사무국에 '제출하다'는 file ... with. 3장 file with the court와 같은 구조입니다."}, "collocations": ["clerk of court", "clerk's office", "deputy clerk (사무관보)"], "links": [{"label": "LII Wex — clerk", "url": "https://www.law.cornell.edu/wex/clerk"}]}, {"id": "bailiff", "hw": "bailiff", "ipa": "ˈbeɪ.lɪf", "stress": "**bai**·liff", "stars": 1, "gloss": "법정 경위", "diff": "법정 질서 유지, 배심원 안내, 피고인 호송 등을 맡습니다. 연방법원에서는 이 일을 대개 연방보안관실(U.S. Marshals Service)이 맡고, bailiff라는 직함은 주법원에서 더 자주 보입니다. 영국에서 bailiff는 주로 집행관을 뜻합니다.", "examples": {"easy": {"en": "The bailiff called the next case.", "ko": "경위가 다음 사건을 호명했다."}, "practice": {"en": "The bailiff escorted the jurors back to the jury room.", "ko": "경위가 배심원들을 배심원실로 다시 안내했다."}}, "grammar": {"axis": "G1", "title": "그 법정의 경위는 the bailiff", "wrong": "A bailiff asked everyone to stand. (앞에서 이미 등장한 그 경위를 다시 가리킬 때)", "right": "The bailiff asked everyone to stand.", "note": "그 장면에서 이미 특정된 경위·판사·사무관은 the로 씁니다. 처음 한 사람을 소개할 때는 a bailiff도 씁니다."}, "collocations": ["court officer (뉴욕 등의 명칭)", "escort the defendant"], "links": [{"label": "LII Wex — bailiff", "url": "https://www.law.cornell.edu/wex/bailiff"}]}, {"id": "court-reporter", "hw": "court reporter", "ipa": "ˈkɔːrt rɪˌpɔːr.t̬ɚ", "stress": "**court** re·por·ter", "stars": 1, "false_friend": true, "gloss": "법정 속기사", "diff": "기자가 아니라 법정에서 오간 말을 글자 그대로 기록하는 속기사입니다. 연방지방법원은 법률상 속기사를 두어야 하고(28 U.S.C. § 753(a)), 그 기록이 항소심 기록(transcript)이 됩니다. 판례집도 reporter라고 부르니(→ 16장) 세 뜻을 구별합니다.", "examples": {"easy": {"en": "The court reporter typed every word.", "ko": "법정 속기사가 모든 말을 받아 적었다."}, "practice": {"en": "Could the court reporter please read back the last question?", "ko": "속기사께서 마지막 질문을 다시 읽어 주시겠습니까?"}, "source": {"en": "Each district court of the United States … shall appoint one or more court reporters.", "ko": "미합중국의 각 지방법원은 … 1명 이상의 법정 속기사를 임명하여야 한다.", "cite": "28 U.S.C. § 753(a)", "url": "https://www.law.cornell.edu/uscode/text/28/753"}}, "grammar": {"axis": "G5", "title": "read back — 다시 읽어 주다", "wrong": "Please read again the question.", "right": "Please read back the question. / Please read the question back.", "note": "속기 기록을 소리 내어 다시 읽는 것은 구동사 read back. 목적어가 대명사면 read it back."}, "collocations": ["read back", "transcript (속기록)", "stenographer (속기사)"], "links": [{"label": "LII Wex — court reporter", "url": "https://www.law.cornell.edu/wex/court_reporter"}]}, {"id": "jury", "hw": "jury · juror", "ipa": "ˈdʒʊr.i · ˈdʒʊr.ɚ", "stress": "**ju**·ry · **ju**·ror", "stars": 3, "gloss": "배심(배심원단) · 배심원(한 사람)", "diff": "jury는 배심원 여럿이 이룬 한 단체, juror는 그 구성원 한 사람입니다. 미국 연방헌법은 형사재판을 배심으로 하도록 정합니다(제3조, 수정헌법 제6조). 한국 국민참여재판의 배심원 평결은 법원을 구속하지 않는 권고적 효력만 있다는 점이 크게 다릅니다(국민의 형사재판 참여에 관한 법률 제46조 제5항).", "examples": {"easy": {"en": "The jury found him not guilty.", "ko": "배심은 그에게 무죄 평결을 내렸다."}, "practice": {"en": "One of the jurors was excused because she knew the victim.", "ko": "배심원 한 명이 피해자를 안다는 이유로 배제되었다."}, "source": {"en": "The trial of all crimes, except in cases of impeachment, shall be by jury", "ko": "탄핵 사건을 제외한 모든 범죄의 재판은 배심에 의한다", "cite": "U.S. Const. art. III, § 2, cl. 3", "url": "https://www.law.cornell.edu/constitution/articleiii", "glossary": {"impeachment": "탄핵"}}}, "grammar": {"axis": "G2", "title": "jury는 하나, jurors는 여럿", "wrong": "Twelve juries heard the case.", "right": "Twelve jurors heard the case. / The jury has reached a verdict.", "note": "jury는 배심원단 전체를 가리키는 단수명사입니다(미국 영어는 동사도 대개 단수). 사람 수를 셀 때는 jurors."}, "collocations": ["jury trial", "serve on a jury", "jury duty (배심 의무)", "the jury is out (평의 중)"], "links": [{"label": "LII Wex — jury", "url": "https://www.law.cornell.edu/wex/jury"}, {"label": "LII Wex — juror", "url": "https://www.law.cornell.edu/wex/juror"}]}, {"id": "panel", "hw": "panel", "ipa": "ˈpæn.əl", "stress": "**pan**·el", "stars": 2, "gloss": "합의부(항소법원의 3인 재판부)", "diff": "연방항소법원은 판사 3명으로 된 panel이 사건을 맡습니다. 한국 합의부와 구성 인원은 같지만, 한국처럼 1심 합의부가 따로 있는 것은 아니고 연방지방법원은 원칙적으로 판사 한 명이 재판합니다(→ 이 장의 「한국이라면?」). 배심원 후보 명단도 jury panel이라 부릅니다.", "examples": {"easy": {"en": "A panel of three judges heard the appeal.", "ko": "판사 3명의 합의부가 항소를 심리했다."}, "practice": {"en": "The panel split 2–1, and the dissenting judge wrote a sharp opinion.", "ko": "합의부는 2 대 1로 갈렸고, 반대 판사는 날 선 반대의견을 썼다."}, "source": {"en": "In each circuit the court may authorize the hearing and determination of cases and controversies by separate panels, each consisting of three judges", "ko": "각 순회구에서 법원은 각각 판사 3명으로 구성되는 개별 합의부가 사건과 분쟁을 심리하고 판단하도록 할 수 있다", "cite": "28 U.S.C. § 46(b)", "url": "https://www.law.cornell.edu/uscode/text/28/46", "glossary": {"cases and controversies": "사건과 분쟁(헌법 제3조의 사법 대상)"}}}, "grammar": {"axis": "G2", "title": "a panel of + 복수명사", "wrong": "a panel of three judge", "right": "a panel of three judges", "note": "of 뒤에 구성원을 셀 때는 복수명사. panel 자체는 단수라 The panel was divided."}, "collocations": ["three-judge panel", "panel opinion", "the panel split 2–1"], "links": [{"label": "LII Wex — panel", "url": "https://www.law.cornell.edu/wex/panel"}]}, {"id": "docket", "hw": "docket", "ipa": "ˈdɑː.kɪt", "stress": "**dock**·et", "stars": 2, "gloss": "사건부(사건 기록 목록), 담당 사건 목록", "diff": "한 사건에 제출된 서면과 명령을 날짜순으로 적은 목록이자, 판사·법원이 맡은 사건 전체입니다. 연방법원 전자 사건부는 PACER로 열람합니다. 사건번호는 docket number라고 합니다.", "examples": {"easy": {"en": "The judge has a busy docket.", "ko": "그 판사는 맡은 사건이 많다."}, "practice": {"en": "The order was entered on the docket yesterday.", "ko": "그 명령은 어제 사건부에 기재되었다."}}, "grammar": {"axis": "G4", "title": "on the docket", "wrong": "The case is in the docket.", "right": "The case is on the docket. / entered on the docket", "note": "목록·일정표에 올라 있다는 뜻은 on(on the list, on the calendar와 같은 원리)."}, "collocations": ["docket number (사건번호)", "docket entry", "a crowded docket"], "links": [{"label": "LII Wex — docket", "url": "https://www.law.cornell.edu/wex/docket"}]}, {"id": "hearing", "hw": "hearing", "ipa": "ˈhɪr.ɪŋ", "stress": "**hear**·ing", "stars": 3, "false_friend": true, "gloss": "심리, 기일(신청 등에 관한 심문·변론 기일)", "diff": "일상어로는 '청력'이지만 법정에서는 판사 앞에서 양측 말을 듣는 기일입니다. 증인과 배심이 나오는 trial과 달리 신청(motion)이나 절차 문제를 다루는 짧은 기일을 가리키는 일이 많습니다. 의회 청문회도 hearing입니다.", "examples": {"easy": {"en": "The hearing starts at ten.", "ko": "기일은 10시에 시작한다."}, "practice": {"en": "The court scheduled a hearing on the motion to dismiss for next Friday.", "ko": "법원은 각하 신청에 관한 기일을 다음 주 금요일로 지정했다."}, "source": {"en": "But no hearing—other than one ex parte—may be conducted outside the district unless all the affected parties consent.", "ko": "다만 일방 심리를 제외한 어떠한 기일도 관련 당사자 전원이 동의하지 않는 한 사법구 밖에서 열 수 없다.", "cite": "Fed. R. Civ. P. 77(b)", "url": "https://www.law.cornell.edu/rules/frcp/rule_77", "glossary": {"ex parte": "일방의(상대방 없이 하는, → 17장)"}}}, "grammar": {"axis": "G6", "title": "hold / schedule a hearing", "wrong": "The court opened a hearing on the motion.", "right": "The court held a hearing on the motion.", "note": "기일을 '열다'는 hold, '지정하다'는 schedule 또는 set. 무엇에 관한 기일인지는 on으로 잇습니다."}, "collocations": ["hold a hearing", "hearing on the motion", "evidentiary hearing (증거조사 기일)", "congressional hearing (청문회)"], "links": [{"label": "LII Wex — hearing", "url": "https://www.law.cornell.edu/wex/hearing"}]}, {"id": "courtroom", "hw": "courtroom", "ipa": "ˈkɔːrt.ruːm", "stress": "**court**·room", "stars": 2, "gloss": "법정(재판이 열리는 방)", "diff": "court가 기관·재판부라면 courtroom은 물리적 공간입니다. 법원 건물은 courthouse라고 합니다.", "examples": {"easy": {"en": "The courtroom was full.", "ko": "법정은 꽉 찼다."}, "practice": {"en": "The trial will be held in Courtroom 5 on the third floor.", "ko": "재판은 3층 제5법정에서 열린다."}, "source": {"en": "Every trial on the merits must be conducted in open court and, so far as convenient, in a regular courtroom.", "ko": "본안에 관한 모든 재판은 공개 법정에서, 가능한 한 정규 법정에서 진행되어야 한다.", "cite": "Fed. R. Civ. P. 77(b)", "url": "https://www.law.cornell.edu/rules/frcp/rule_77", "glossary": {"on the merits": "본안에 관한"}}}, "grammar": {"axis": "G1", "title": "the courtroom / Courtroom 5", "wrong": "The trial is in the Courtroom 5.", "right": "The trial is in Courtroom 5. / Please leave the courtroom.", "note": "번호가 붙은 이름(Courtroom 5, Room 302)에는 관사가 없습니다. 장면 속 그 법정은 the courtroom."}, "collocations": ["courthouse (법원 청사)", "courtroom etiquette (법정 예절)"], "links": [{"label": "LII Wex — open court", "url": "https://www.law.cornell.edu/wex/open_court"}]}, {"id": "in-open-court", "hw": "in open court", "ipa": "ɪn ˈoʊ.pən ˈkɔːrt", "stress": "in **o**·pen **court**", "stars": 2, "gloss": "공개 법정에서", "diff": "판사실(in chambers)과 짝을 이루는 말입니다. 증인신문과 판결 선고처럼 공개가 원칙인 절차에 붙습니다. 한국 헌법 제109조의 재판 공개 원칙과 같은 방향입니다.", "examples": {"easy": {"en": "The verdict was read in open court.", "ko": "평결은 공개 법정에서 낭독되었다."}, "practice": {"en": "The defendant entered a guilty plea in open court.", "ko": "피고인은 공개 법정에서 유죄를 인정했다."}, "source": {"en": "At trial, the witnesses' testimony must be taken in open court unless a federal statute … or other rules adopted by the Supreme Court provide otherwise.", "ko": "재판에서 증인의 증언은 공개 법정에서 들어야 한다. 다만 연방 법률 … 또는 연방대법원이 채택한 그 밖의 규칙이 달리 정하는 경우에는 그러하지 아니하다.", "cite": "Fed. R. Civ. P. 43(a)", "url": "https://www.law.cornell.edu/rules/frcp/rule_43", "glossary": {"take testimony": "증언을 듣다(증인을 신문하다)"}}}, "grammar": {"axis": "G4", "title": "in open court — 무관사 관용", "wrong": "in the open court", "right": "in open court / in chambers", "note": "in court와 마찬가지로 관사 없이 굳은 표현입니다. 반대말 in chambers도 관사가 없습니다."}, "collocations": ["in open court ↔ in chambers", "announce in open court", "plead guilty in open court"], "links": [{"label": "LII Wex — open court", "url": "https://www.law.cornell.edu/wex/open_court"}]}, {"id": "all-rise", "hw": "All rise.", "ipa": "ˌɑːl ˈraɪz", "stress": "all **rise**", "stars": 2, "gloss": "모두 일어서 주십시오(판사 입정 때의 구호)", "diff": "판사가 입정하거나 퇴정할 때 경위나 사무관이 외칩니다. 판사가 앉으면 Please be seated(앉으십시오)가 이어집니다. 한국 법정의 '모두 일어서 주십시오'와 같은 순간입니다.", "examples": {"easy": {"en": "All rise. Court is now in session.", "ko": "모두 일어서 주십시오. 지금부터 개정합니다."}, "practice": {"en": "All rise for the Honorable Judge Rivera. You may be seated.", "ko": "리베라 판사님 입정하십니다, 모두 일어서 주십시오. 앉으셔도 됩니다."}}, "box": "연방대법원에서는 대법원 의전·경호 책임자(Marshal)가 Oyez(들으시오)를 세 번 외치며 개정을 알립니다. 중세 법정의 프랑스어 구호가 남은 것입니다.", "grammar": {"axis": "G5", "title": "rise와 raise / be seated", "wrong": "All raise.", "right": "All rise. / Please be seated.", "note": "rise(일어서다)는 목적어를 받지 않고, raise(올리다)는 목적어가 있어야 합니다(raise your hand). 앉으라고 할 때 Please sit.도 틀린 말은 아니지만, 법정에서는 더 격식 있는 be seated를 씁니다."}, "collocations": ["Please be seated.", "Court is in session (개정)", "Court is adjourned (폐정)"]}], "corners": {"false_friend": {"title": "New York Supreme Court는 뉴욕주 대법원이 아니다", "body": ["뉴욕주 헌법은 Supreme Court에 일반 1심 관할을 주고(제6조 제7항), 최고법원은 Court of Appeals로 정합니다(같은 조 제2항). 그래서 뉴욕주에서는 '대법원(Supreme)'이 1심이고 '항소법원(Court of Appeals)'이 최종심입니다. 연방 체계와 이름 순서가 거꾸로입니다.", "같은 장의 가짜 친구를 모아 보면 이렇습니다."], "table": [["New York Supreme Court", "뉴욕주 대법원", "뉴욕주 1심 법원"], ["bench", "긴 의자", "판사석, 법관직"], ["bar", "술집, 막대", "변호사단, 변호사 자격"], ["chambers", "방들", "판사실"], ["court reporter", "법원 출입 기자", "법정 속기사"], ["hearing", "청력", "기일, 심리"]], "tip": "주법원 이름은 주마다 제각각입니다. 기사에서 Supreme Court가 나오면 연방인지 어느 주인지부터 확인하세요."}, "drama": {"title": "Night Court (1984–1992)", "facts": ["미국 NBC 시트콤. 1984. 1. 4. 첫 방송, 1992. 5. 31. 종영, 9시즌 193편.", "맨해튼 형사법원의 야간 법정이 무대입니다. 젊은 판사 해리 스톤(해리 앤더슨)을 중심으로 검사(assistant district attorney), 국선변호인(public defender), 법원 사무관(court clerk), 경위(bailiff)가 고정 배역입니다.", "2023년 같은 제목의 속편이 NBC에서 다시 만들어졌습니다."], "watch": "이 장 2-B의 사람들이 한 무대에 다 나옵니다. 경위가 All rise를 외치고, 판사가 판사석(bench)에서 사건을 부르고, 사무관이 사건부(docket)를 넘깁니다. 줄거리보다 누가 법정의 어느 자리에 서는지를 보며 이름을 맞혀 보세요. 코미디라 실제 법정 절차와 다른 장면이 많습니다.", "terms": ["judge", "bailiff", "court clerk", "public defender", "All rise."], "links": [{"label": "Wikipedia — Night Court", "url": "https://en.wikipedia.org/wiki/Night_Court"}, {"label": "YouTube — 공식 미리보기 클립 (Warner Bros. Classics)", "url": "https://www.youtube.com/watch?v=oRCM17HiOds"}]}, "quote": {"text": "We are not final because we are infallible, but we are infallible only because we are final.", "ko": "우리가 최종이라서 틀리지 않는 것이지, 틀리지 않아서 최종인 것이 아니다.", "case": "Brown v. Allen, 344 U.S. 443, 540 (1953) (Jackson, J., concurring in the result)", "decided": "1953. 2. 9. 선고", "gloss": {"final": "최종의(더 이상 불복할 수 없는)", "infallible": "오류가 없는", "concurring in the result": "결론에만 찬성하는 의견(→ 16장)"}, "why": "로버트 잭슨 대법관이 주법원 유죄판결을 연방 인신보호영장으로 다시 다투는 문제를 두고 쓴 보충의견입니다. 바로 앞 문장에서 '더 높은 대법원이 있다면 우리 판결도 상당수 파기될 것'이라고 말합니다. 최고법원의 권위가 정답이어서가 아니라 마지막이어서 나온다는 고백이라, 법원 계층을 설명할 때마다 인용됩니다.", "links": [{"label": "LII — Brown v. Allen 판결 원문", "url": "https://www.law.cornell.edu/supremecourt/text/344/443"}]}, "korea": {"title": "panel이 합의부라면, 한국 1심은?", "us": "미국 연방은 1심 지방법원을 원칙적으로 판사 한 명이 재판하고, 항소법원에서 3인 panel이 재판합니다(28 U.S.C. § 46). 판사 3명이 함께 하는 것은 상소심의 모습입니다.", "kr": "한국은 1심에도 합의부가 있습니다. 법원조직법 제7조 제4항은 지방법원의 심판권을 단독판사가 행사한다고 정하면서, 제5항에서 합의심판을 하여야 하는 경우 판사 3명으로 구성된 합의부가 행사한다고 정합니다. 사형·무기 또는 단기 1년 이상 징역에 해당하는 형사사건 등이 지방법원 합의부 사건입니다(제32조 제1항). 고등법원·특허법원은 판사 3명의 합의부가 심판합니다(제7조 제3항).", "say": "In Korea, serious cases are heard at first instance by a panel of three judges, while other cases are heard by a single judge.", "say_ko": "한국에서는 중대한 사건은 1심부터 판사 3명의 합의부가 심리하고, 그 밖의 사건은 단독판사가 심리합니다."}}, "quiz": [{"q": "미국 연방 법원 체계에서 1심 법원은?", "options": ["U.S. Court of Appeals", "U.S. District Court", "the Federal Circuit", "Supreme Court"], "answer": 1, "why": "연방 1심은 94개 지방법원(district court)입니다. Court of Appeals와 Federal Circuit은 항소법원입니다."}, {"q": "New York Supreme Court는 어떤 법원인가?", "options": ["뉴욕주 최고법원", "뉴욕주 1심 법원", "연방대법원의 뉴욕 지부"], "answer": 1, "why": "뉴욕주에서는 Supreme Court가 1심이고, 최고법원은 Court of Appeals입니다."}, {"q": "판사를 직접 부를 때 쓰는 말은?", "options": ["Your Honor", "Mr. Court", "Your Justice"], "answer": 0, "why": "미국 법정의 호칭은 Your Honor. 잉글랜드 고등법원 이상에서는 My Lord / My Lady."}, {"q": "문법: '소송을 하기로 했다'라는 관용적 의미라면 빈칸에 맞는 것은? — They decided to go to ____ over the dispute.", "options": ["a court", "the court", "court"], "answer": 2, "why": "'소송을 하다'라는 기능을 말하는 go to court는 관사 없이 쓰는 관용구입니다(G1).", "grammar": "G1"}, {"q": "번역해 보세요: The case is pending before a panel of three judges.", "options": ["그 사건은 판사 3명의 합의부에 계속 중이다.", "그 사건은 판사 3명이 이미 판결했다.", "그 사건은 배심원 3명이 심리 중이다."], "answer": 0, "why": "pending before = ~에 계속 중인, panel = 합의부. a panel of 뒤에는 복수명사 judges."}]}, {"chapter": {"num": 3, "title": "민사소송 ①", "subtitle": "소 제기부터 변론 전까지", "title_en": "Civil Procedure I — From Complaint to Pretrial", "lead": "미국 민사소송은 소장을 내는 데서 시작해 증거개시(discovery)라는 긴 터널을 지납니다. 대부분은 그 터널 안에서 화해나 약식판결로 끝나고, 정식 재판(trial)까지 가는 사건은 드뭅니다. 이 장은 그 터널 입구부터 출구까지의 말을 다룹니다.", "can_say": [{"en": "The plaintiff filed a complaint against two companies.", "ko": "원고는 두 회사를 상대로 소장을 냈습니다."}, {"en": "The defendants moved to dismiss the case.", "ko": "피고들은 소 각하(기각)를 신청했습니다."}, {"en": "The parties settled out of court after discovery.", "ko": "당사자들은 증거개시가 끝난 뒤 법정 밖에서 화해했습니다."}]}, "entries": [{"id": "lawsuit", "hw": "lawsuit · sue", "ipa": "ˈlɑː.suːt · suː", "stress": "**law**·suit · **sue**", "stars": 3, "gloss": "소송 · (~를 상대로) 소송을 걸다", "examples": {"easy": {"en": "She sued her landlord.", "ko": "그녀는 집주인을 상대로 소송을 걸었다."}, "practice": {"en": "The company filed a lawsuit against its former CEO for breach of contract.", "ko": "회사는 계약 위반을 이유로 전 CEO를 상대로 소송을 제기했다."}, "source": {"en": "a partnership or other unincorporated association with no such capacity under that state's law may sue or be sued in its common name to enforce a substantive right existing under the United States Constitution or laws", "ko": "그 주법상 그러한 능력이 없는 조합이나 그 밖의 법인 아닌 사단도 미국 헌법이나 연방법률에 근거한 실체적 권리를 행사하기 위해서라면 그 통칭으로 소송을 하거나 소송을 당할 수 있다", "cite": "Fed. R. Civ. P. 17(b)(3)(A)", "url": "https://www.law.cornell.edu/rules/frcp/rule_17", "glossary": {"sue or be sued": "소송을 하거나 당하다 — 당사자능력을 말하는 정형구", "unincorporated association": "법인 아닌 사단", "common name": "통칭(단체가 평소 쓰는 이름)"}}}, "grammar": {"axis": "G4", "title": "sue는 사람을 바로 목적어로 받는다", "wrong": "She sued to her landlord.", "right": "She sued her landlord for failing to return her security deposit.", "note": "sue A for B — A(상대방)를 B(이유·금액)로 제소하다. 명사로 쓸 때는 file a lawsuit against A."}, "collocations": ["file a lawsuit against", "sue A for B", "take A to court (구어)", "drop a lawsuit (소를 취하하다)"], "links": [{"label": "LII Wex — lawsuit", "url": "https://www.law.cornell.edu/wex/lawsuit"}]}, {"id": "action", "hw": "action", "ipa": "ˈæk.ʃən", "stress": "**ac**·tion", "stars": 2, "false_friend": true, "gloss": "소송", "diff": "일상어 '행동'과 같은 단어지만 법률 영어에서는 '소송' 그 자체를 가리킵니다. civil action은 민사소송, class action은 집단소송입니다.", "examples": {"easy": {"en": "He brought an action for damages.", "ko": "그는 손해배상 소송을 제기했다."}, "practice": {"en": "This action arises out of a car accident in 2024.", "ko": "이 소송은 2024년 교통사고에서 비롯되었다."}, "source": {"en": "There is one form of action—the civil action.", "ko": "소송의 형식은 하나, 곧 민사소송뿐이다.", "cite": "Fed. R. Civ. P. 2", "url": "https://www.law.cornell.edu/rules/frcp/rule_2", "glossary": {"form of action": "소송 형식(옛 영국법의 소권 유형)"}}}, "box": "연방민사소송규칙 제2조는 한 줄짜리 조문입니다. 옛 영국 보통법에는 소송 유형(form of action)이 수십 가지였고, 유형을 잘못 고르면 그것만으로 졌습니다. 이 조문이 그 시대를 끝냈다는 선언입니다.", "grammar": {"axis": "G6", "title": "action은 bring과 짝을 이룬다", "wrong": "He made an action against the city.", "right": "He brought an action against the city.", "note": "소송을 '제기하다'는 bring 또는 file. make an action은 쓰지 않습니다."}, "collocations": ["bring an action", "civil action", "cause of action (청구원인)"]}, {"id": "party", "hw": "party", "ipa": "ˈpɑːr.t̬i", "stress": "**par**·ty", "stars": 3, "false_friend": true, "gloss": "당사자", "examples": {"easy": {"en": "Both
