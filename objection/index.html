1989)를 몇 년 만에 변경했습니다. 따옴표 안은 Helvering v. Hallock(1940)을 인용한 부분입니다. 1장에서 배운 stare decisis가 어떤 때 물러서는지를 보여 주는 문장입니다.", "links": [{"label": "LII — Payne v. Tennessee 판결 원문", "url": "https://www.law.cornell.edu/supremecourt/text/501/808"}, {"label": "Oyez — 사건 개요·구두변론", "url": "https://www.oyez.org/cases/1990/90-5721"}]}, "korea": {"title": "라틴어 대신 한자어 — 기판력·석명·직권", "us": "영미 법률가는 개념 하나를 라틴어 두세 단어로 압축합니다. res judicata(→ 4장)는 확정판결의 구속력, sua sponte는 법원이 신청 없이 스스로 나서는 것입니다.", "kr": "한국 법률 용어에서는 같은 자리를 한자어가 맡습니다. 檢事·辯護士·後見人 같은 말의 상당수는 근대 일본이 서양 법 개념의 번역어로 굳힌 한자어가 중국·한국으로 퍼진 것이라고 설명되지만, 낱말마다 유래가 달라 한 묶음으로 단정할 수는 없습니다. 기판력(既判力)은 민사소송법 제216조 제1항('확정판결은 주문에 포함된 것에 한하여 기판력을 가진다')에, 석명(釋明)은 제136조 제1항('재판장은 소송관계를 분명하게 하기 위하여 당사자에게 사실상 또는 법률상 사항에 대하여 질문할 수 있고, 증명을 하도록 촉구할 수 있다')에 나옵니다. 직권은 sua sponte와 기능이 같습니다. 석명권에는 딱 맞는 라틴어가 없어서 영어로는 풀어 말해야 합니다.", "say": "In Korea, the presiding judge may question the parties to clarify their claims and urge them to submit proof. We call this the court's power of clarification.", "say_ko": "한국에서는 재판장이 주장을 분명히 하도록 당사자에게 질문하고 증명을 촉구할 수 있습니다. 이것을 법원의 석명권이라고 합니다."}}, "quiz": [{"q": "'The judge reviewed the files in camera.'의 뜻은?", "options": ["판사는 서류를 촬영하며 검토했다.", "판사는 서류를 비공개로(판사실에서) 검토했다.", "판사는 서류를 공개 법정에서 검토했다."], "answer": 1, "why": "camera는 라틴어로 '방'. 공개 법정은 in open court(→ 2장)입니다."}, {"q": "확정판결이 난 청구를 같은 당사자가 다시 소송하지 못하게 하는 원칙은?", "options": ["stare decisis", "res judicata", "habeas corpus"], "answer": 1, "why": "→ 4장 res judicata(기판력). stare decisis(→ 1장)는 선례구속, habeas corpus(→ 7장)는 인신보호영장입니다."}, {"q": "연방대법원에 심리를 신청하는 서면은 petition for a writ of ____.", "options": ["mens rea", "certiorari", "de novo"], "answer": 1, "why": "→ 15장 certiorari(상고허가). mens rea(→ 7장)는 범의, de novo(→ 4장)는 '처음부터 새로' 심사하는 기준입니다."}, {"q": "문법: 빈칸에 맞는 것은? — Several ____ curiae filed briefs supporting the petitioner.", "options": ["amicus", "amici", "amicuses"], "answer": 1, "why": "라틴어 복수로 amicus가 amici가 됩니다. curiae는 그대로. criterion → criteria, dictum → dicta(→ 16장)도 같은 계열입니다.", "grammar": "G2"}, {"q": "번역해 보세요: The court denied habeas corpus relief.", "options": ["법원은 인신보호 구제를 거부했다.", "법원은 상고를 허가하지 않았다.", "법원은 보석 신청을 기각했다."], "answer": 0, "why": "→ 7장 habeas corpus(인신보호영장). 상고허가는 certiorari(→ 15장), 보석은 bail(→ 6장)입니다."}]}, {"chapter": {"num": 18, "title": "지식재산 한눈에", "subtitle": "", "title_en": "Intellectual Property at a Glance", "lead": "미국 지식재산법은 크게 넷입니다. 발명을 지키는 특허(patent), 표현을 지키는 저작권(copyright), 출처 표지를 지키는 상표(trademark), 비밀로 유지한 정보를 지키는 영업비밀(trade secret)입니다. 특허·저작권은 연방헌법이 의회에 직접 권한을 준 분야라 연방법이 중심이고, 영업비밀은 주법과 연방법이 함께 작동합니다. 이 장은 네 제도의 기본 말과, 그것을 침해했을 때 쓰는 말을 다룹니다.", "can_say": [{"en": "The company filed a patent application with the USPTO.", "ko": "그 회사는 미국 특허상표청에 특허출원을 했습니다."}, {"en": "The court found that the defendant infringed the patent.", "ko": "법원은 피고가 그 특허를 침해했다고 판단했습니다."}, {"en": "Copyright protects expression, not ideas.", "ko": "저작권은 아이디어가 아니라 표현을 보호합니다."}]}, "entries": [{"id": "intellectual-property", "hw": "intellectual property (IP)", "ipa": "ˌɪn.t̬əlˈek.tʃu.əl ˈprɑː.pɚ.t̬i", "stress": "in·tel·**lec**·tu·al **prop**·er·ty", "stars": 3, "gloss": "지식재산", "diff": "한국은 특허·상표·디자인을 한 부처(지식재산처)가 맡고 저작권은 문화체육관광부가 맡습니다. 미국도 특허·상표는 USPTO, 저작권은 의회도서관 소속 저작권청(Copyright Office)으로 나뉩니다. 영업비밀은 등록 제도 자체가 없습니다.", "examples": {"easy": {"en": "IP covers patents, copyrights, and trademarks.", "ko": "지식재산에는 특허·저작권·상표가 들어간다."}, "practice": {"en": "The startup's main asset is its intellectual property, not its equipment.", "ko": "그 스타트업의 주된 자산은 설비가 아니라 지식재산이다."}, "source": {"en": "To promote the progress of science and useful arts, by securing for limited times to authors and inventors the exclusive right to their respective writings and discoveries", "ko": "저작자와 발명자에게 각자의 저술과 발견에 대한 배타적 권리를 일정 기간 보장함으로써 과학과 유용한 기예의 발전을 촉진하는 것", "cite": "U.S. Const. art. I, § 8, cl. 8 — 의회의 권한 목록 가운데 한 줄", "url": "https://www.law.cornell.edu/constitution/articlei", "glossary": {"useful arts": "유용한 기예(오늘날의 기술)", "for limited times": "일정 기간 동안 — 권리에 존속기간이 있는 이유", "exclusive right": "배타적 권리"}}}, "box": "특허와 저작권의 근거가 연방헌법에 한 줄로 들어 있습니다. 이 조항을 흔히 IP Clause 또는 Copyright and Patent Clause라고 부릅니다. 상표는 이 조항이 아니라 주(州) 사이의 거래를 규율하는 통상조항(Commerce Clause)에 기대므로 근거가 다릅니다.", "grammar": {"axis": "G3", "title": "intellectual property는 셀 수 없다", "wrong": "The company owns many intellectual properties.", "right": "The company owns a lot of intellectual property. / The company owns many IP rights.", "note": "제도·재산 전체를 가리키므로 a를 붙이지 않고 복수형도 만들지 않습니다. 하나하나 셀 때는 IP rights, IP assets처럼 셀 수 있는 명사를 붙입니다."}, "collocations": ["IP rights", "IP litigation (지식재산 소송)", "protect intellectual property", "IP portfolio (보유 지식재산 묶음)"], "links": [{"label": "LII Wex — intellectual property", "url": "https://www.law.cornell.edu/wex/intellectual_property"}]}, {"id": "patent", "hw": "patent · patentee", "ipa": "ˈpæt.ənt · ˌpæt.ənˈtiː", "stress": "**pat**·ent · pat·en·**tee**", "stars": 3, "gloss": "특허(권) · 특허권자", "pron_tip": "미국식 첫 음절은 /pæt/입니다(영국식은 /peɪt/로도 읽음). patentee는 끝음절 -tee에 강세가 갑니다(employee·trustee와 같은 꼴).", "diff": "미국의 일반 발명특허(utility patent) 존속기간은 원칙적으로 출원일부터 20년입니다(35 U.S.C. § 154(a)(2)). 디자인특허(design patent)는 등록일부터 15년입니다(§ 173). 한국도 특허권 설정등록일부터 출원일 후 20년까지라서 큰 틀은 같습니다.", "examples": {"easy": {"en": "She got a patent for her new lock.", "ko": "그녀는 새 자물쇠로 특허를 받았다."}, "practice": {"en": "Our client filed a patent application last March, and it is still pending.", "ko": "우리 의뢰인은 지난 3월에 특허출원을 했고, 아직 심사 중이다."}, "source": {"en": "Whoever invents or discovers any new and useful process … may obtain a patent therefor, subject to the conditions and requirements of this title.", "ko": "새롭고 유용한 방법 … 을 발명하거나 발견한 자는 누구든지 이 편의 조건과 요건에 따라 그에 대한 특허를 받을 수 있다.", "cite": "35 U.S.C. § 101 — 특허 대상(patentable subject matter)", "url": "https://www.law.cornell.edu/uscode/text/35/101", "glossary": {"therefor": "그것에 대하여(therefore '그러므로'와 다른 낱말)", "this title": "이 편(미국법전 제35편 = 특허법)"}}}, "box": "§ 101의 생략 부분은 'machine, manufacture, or composition of matter'(기계·제조물·조성물)입니다. 2014년 Alice 판결은 이 조문을 해석하면서, 추상적 아이디어를 일반 컴퓨터로 실행하는 것만으로는 특허 대상이 되지 않는다고 했습니다. 소프트웨어·영업방법 특허 분쟁은 지금도 이 한 줄을 두고 다툽니다.", "grammar": {"axis": "G6", "title": "특허출원은 file a patent application", "wrong": "She applied a patent.", "right": "She filed a patent application. / She applied for a patent.", "note": "실무에서 출원은 file과 짝입니다. apply를 쓰면 반드시 for가 붙습니다(apply for a patent). make an application도 틀린 영어는 아니고 조문에도 나오지만(35 U.S.C. § 111(a)(1) 'An application for patent shall be made'), 덜 흔한 형태입니다. 특허청이 특허를 내주는 것은 grant 또는 issue a patent."}, "collocations": ["file a patent application", "apply for a patent", "grant / issue a patent", "patent pending (출원 중)", "patent holder (= patentee)"], "links": [{"label": "LII Wex — patent", "url": "https://www.law.cornell.edu/wex/patent"}]}, {"id": "claim", "hw": "claim", "ipa": "kleɪm", "stress": "**claim**", "stars": 2, "false_friend": true, "gloss": "(특허) 청구항", "diff": "민사소송에서 claim은 '청구'(→ 3장), 도산에서는 '채권'(→ 13장)입니다. 특허에서는 특허권의 범위를 문장으로 적은 '청구항'을 가리킵니다. 침해 여부도 무효 여부도 명세서 전체가 아니라 청구항 하나하나를 기준으로 판단합니다.", "examples": {"easy": {"en": "Claim 1 is very broad.", "ko": "청구항 1은 매우 넓다."}, "practice": {"en": "The defendant argues that all of the asserted claims are invalid.", "ko": "피고는 원고가 주장하는 청구항 모두가 무효라고 주장한다."}, "source": {"en": "The specification shall conclude with one or more claims particularly pointing out and distinctly claiming the subject matter which the inventor or a joint inventor regards as the invention.", "ko": "명세서는 발명자 또는 공동발명자가 발명으로 여기는 대상을 특정하여 지적하고 명확하게 청구하는 하나 이상의 청구항으로 끝맺어야 한다.", "cite": "35 U.S.C. § 112(b)", "url": "https://www.law.cornell.edu/uscode/text/35/112", "glossary": {"specification": "명세서", "particularly pointing out": "특정하여 지적하는", "distinctly claiming": "명확하게 청구하는"}}}, "box": "청구항에는 다른 청구항을 인용하지 않는 독립항(independent claim)과, 앞 청구항을 인용해 한정을 더하는 종속항(dependent claim)이 있습니다(§ 112(c)). 청구항의 뜻을 법원이 확정하는 절차를 claim construction이라 하고, 미국 특허소송의 승패가 여기서 갈리는 일이 많습니다.", "grammar": {"axis": "G2", "title": "one or more + 복수명사", "wrong": "one or more claim", "right": "one or more claims", "note": "one or more는 '하나 이상'이지만 뒤 명사는 복수로 씁니다. 동사도 복수에 맞춥니다: One or more claims are invalid."}, "collocations": ["independent / dependent claim (독립항 / 종속항)", "asserted claims (침해 주장된 청구항)", "claim construction (청구항 해석)", "claims 1-5 (청구항 1 내지 5)"], "links": [{"label": "LII Wex — patent claim", "url": "https://www.law.cornell.edu/wex/patent_claim"}]}, {"id": "prior-art", "hw": "prior art", "ipa": "praɪr ɑːrt", "stress": "**prior** **art**", "stars": 2, "false_friend": true, "gloss": "선행기술", "diff": "art는 '예술'이 아니라 '기술'입니다. 헌법의 useful arts, 진보성 판단의 person having ordinary skill in the art(통상의 기술자)에 나오는 art도 같은 뜻입니다.", "examples": {"easy": {"en": "The examiner found prior art.", "ko": "심사관이 선행기술을 찾아냈다."}, "practice": {"en": "The prior art discloses every element of claim 3, so the claim is anticipated.", "ko": "선행기술이 청구항 3의 구성요소를 모두 개시하므로, 그 청구항은 신규성이 없다."}, "source": {"en": "the claimed invention was patented, described in a printed publication, or in public use, on sale, or otherwise available to the public before the effective filing date of the claimed invention", "ko": "청구된 발명이 그 유효출원일 전에 특허되었거나, 간행물에 기재되었거나, 공연히 실시되거나 판매되었거나, 그 밖의 방법으로 공중이 이용할 수 있었던 경우", "cite": "35 U.S.C. § 102(a)(1) — 신규성(novelty) 상실 사유", "url": "https://www.law.cornell.edu/uscode/text/35/102", "glossary": {"printed publication": "간행물", "in public use": "공연히 실시된", "effective filing date": "유효출원일(우선일 포함)"}}}, "box": "선행기술 하나가 청구항의 구성요소를 모두 담고 있으면 신규성이 없고(anticipation, § 102), 여러 선행기술을 합쳐야 이를 수 있으면 진보성(자명성)을 따집니다(§ 103, → obviousness).", "grammar": {"axis": "G1", "title": "일반론은 무관사, 이 사건의 선행기술은 the", "wrong": "A prior art shows the same device.", "right": "Prior art can come from anywhere. / The prior art shows the same device.", "note": "prior art는 셀 수 없어 a를 붙이지 않습니다. 이 사건에서 이미 거론된 선행기술 전체는 the prior art — § 103도 'the prior art'라고 씁니다. 하나씩 셀 때는 a prior art reference."}, "collocations": ["prior art reference (선행문헌)", "search the prior art", "anticipate (신규성을 깨다)", "the prior art discloses ..."], "links": [{"label": "LII Wex — prior art", "url": "https://www.law.cornell.edu/wex/prior_art"}]}, {"id": "obviousness", "hw": "obviousness · obvious", "ipa": "ˈɑːb.vi.əs.nəs · ˈɑːb.vi.əs", "stress": "**ob**·vi·ous·ness · **ob**·vi·ous", "stars": 2, "pron_tip": "obviousness는 발음 사전(Cambridge US) 미수록이라 미국 법조 관행 발음으로 적었습니다.", "gloss": "자명성(진보성 결여) · 자명한", "diff": "한국 특허법은 '쉽게 발명할 수 있으면' 특허를 받을 수 없다고 하고(진보성), 미국은 '자명하면(obvious)' 받을 수 없다고 합니다. 방향이 반대라서 nonobviousness가 한국의 '진보성'에 가깝고, obviousness는 '진보성 부정'에 해당합니다. 두 기준이 완전히 같다고 단정하지는 않습니다.", "examples": {"easy": {"en": "The invention was obvious.", "ko": "그 발명은 자명했다(진보성이 없었다)."}, "practice": {"en": "The examiner rejected the claims as obvious over two prior art references.", "ko": "심사관은 선행문헌 두 개에 비추어 청구항들이 자명하다며 거절했다."}, "source": {"en": "if the differences between the claimed invention and the prior art are such that the claimed invention as a whole would have been obvious before the effective filing date of the claimed invention to a person having ordinary skill in the art to which the claimed invention pertains", "ko": "청구된 발명과 선행기술의 차이가, 청구된 발명 전체로 보아 그 유효출원일 전에 그 발명이 속하는 기술분야에서 통상의 기술을 가진 사람에게 자명하였을 정도라면", "cite": "35 U.S.C. § 103", "url": "https://www.law.cornell.edu/uscode/text/35/103", "glossary": {"as a whole": "전체로서", "a person having ordinary skill in the art": "통상의 기술자(PHOSITA)", "pertain to": "~에 속하다"}}}, "box": "2007년 KSR v. Teleflex 판결은 '선행기술을 결합하라는 가르침·암시·동기(TSM)'를 요구하던 연방순회항소법원의 엄격한 기준을 버리고, 통상의 기술자의 상식과 창의력까지 고려하라고 했습니다(→ 「명판결 명문장」).", "grammar": {"axis": "G4", "title": "obvious to 사람 / obvious over 선행기술", "wrong": "obvious for a person skilled in the art", "right": "obvious to a person skilled in the art / obvious over Smith and Lee", "note": "누구에게 자명한가는 to, 무엇에 비추어 자명한가는 over를 씁니다. over 뒤에는 선행문헌의 이름(발명자 성)이 흔히 옵니다."}, "collocations": ["obvious over A in view of B (A에 B를 결합하면 자명)", "obviousness rejection", "obvious to try", "nonobviousness (비자명성 = 진보성)"], "links": [{"label": "LII Wex — nonobviousness", "url": "https://www.law.cornell.edu/wex/nonobviousness"}]}, {"id": "copyright", "hw": "copyright", "ipa": "ˈkɑː.pi.raɪt", "stress": "**cop**·y·right", "stars": 3, "gloss": "저작권", "pron_tip": "철자는 right(권리)입니다. write(쓰다)와 헷갈려 copywrite라고 쓰면 오기입니다. copywriter(광고 문안 작가)는 전혀 다른 말입니다.", "diff": "미국 저작권은 창작과 고정(fixation)으로 생깁니다. 등록은 권리 발생 요건이 아니지만, 미국 저작물로 침해소송을 내려면 원칙적으로 등록(또는 사전등록)이 먼저 있어야 합니다(17 U.S.C. § 411(a)). 한국은 등록 없이도 소를 낼 수 있습니다.", "examples": {"easy": {"en": "Who owns the copyright in this song?", "ko": "이 노래의 저작권은 누구에게 있나요?"}, "practice": {"en": "The publisher holds the copyright in the novel until 2090.", "ko": "그 출판사는 2090년까지 그 소설의 저작권을 가진다."}, "source": {"en": "Copyright protection subsists, in accordance with this title, in original works of authorship fixed in any tangible medium of expression", "ko": "저작권 보호는 이 편에 따라, 유형의 표현 매체에 고정된 독창적 저작물에 존재한다", "cite": "17 U.S.C. § 102(a)", "url": "https://www.law.cornell.edu/uscode/text/17/102", "glossary": {"subsist": "존재하다, 성립하다", "original": "독창적인(창작성 있는)", "work of authorship": "저작물", "fixed in a tangible medium": "유형물에 고정된"}}}, "box": "같은 조 (b)항은 저작권이 '아이디어, 절차, 방법, 체계, 작동 방법, 개념, 원리, 발견'에는 미치지 않는다고 정합니다. 아이디어·표현 이분법(idea-expression dichotomy)의 조문 근거입니다. 존속기간은 원칙적으로 저작자 생존 기간과 사후 70년입니다(§ 302(a)).", "grammar": {"axis": "G4", "title": "copyright in a work", "wrong": "the copyright of this song", "right": "the copyright in this song", "note": "'~에 대한 저작권'은 in이 표준입니다. 일상 글에서는 on도 보이지만 법률 문서는 in을 씁니다. 권리를 가진 사람 쪽은 the copyright owner, the copyright holder."}, "collocations": ["own / hold the copyright in", "copyright owner / holder", "copyright infringement", "public domain (저작권 소멸·공유 영역)"], "links": [{"label": "LII Wex — copyright", "url": "https://www.law.cornell.edu/wex/copyright"}]}, {"id": "fair-use", "hw": "fair use", "ipa": "fer juːs", "stress": "**fair** **use**", "stars": 2, "gloss": "공정이용", "pron_tip": "명사 use는 끝소리가 /s/입니다. 동사 use(/juːz/)와 다르게 읽습니다.", "diff": "미국 공정이용은 네 가지 요소를 종합하는 일반 조항입니다(§ 107). 한국 저작권법도 공정이용 일반 조항(제35조의5)을 두고 고려 요소도 넷으로 비슷합니다. 다만 제23조부터 제35조의4까지의 개별 제한 규정(인용·교육 목적 이용 등)에 해당하지 않는 경우에 적용되는 보충 조항이라, 운용 방식까지 같다고 볼 수는 없습니다.", "examples": {"easy": {"en": "Quoting a few lines can be fair use.", "ko": "몇 줄 인용하는 것은 공정이용일 수 있다."}, "practice": {"en": "The court held that the parody was a fair use of the original song.", "ko": "법원은 그 패러디가 원곡의 공정이용에 해당한다고 판단했다."}, "source": {"en": "the fair use of a copyrighted work … for purposes such as criticism, comment, news reporting, teaching (including multiple copies for classroom use), scholarship, or research, is not an infringement of copyright", "ko": "비평, 논평, 보도, 교육(수업용 복수 복제 포함), 학문 또는 연구와 같은 목적을 위한 저작물의 공정이용은 … 저작권 침해가 아니다", "cite": "17 U.S.C. § 107", "url": "https://www.law.cornell.edu/uscode/text/17/107", "glossary": {"copyrighted work": "저작권 있는 저작물", "such as": "~와 같은(예시 열거 — 이 목적들에 한정되지 않는다)"}}}, "box": "§ 107이 드는 네 요소는 ① 이용의 목적과 성격 ② 저작물의 성질 ③ 이용한 부분의 양과 비중 ④ 시장에 미치는 영향입니다. 1994년 Campbell v. Acuff-Rose는 2 Live Crew의 'Pretty Woman' 패러디를, 2021년 Google v. Oracle은 Java API 선언 코드 복제를 각각 공정이용 쪽으로 판단했습니다.", "grammar": {"axis": "G1", "title": "법리는 fair use, 구체적 이용 하나는 a fair use", "wrong": "The fair use is an important doctrine.", "right": "Fair use is an important doctrine. / The copying was fair use of the song. / The copying was a fair use of the song.", "note": "제도·법리 이름일 때는 관사 없이 씁니다(Cambridge는 fair use를 불가산 [U]로 싣습니다). 특정 이용 행위 하나를 평가할 때는 관사 없이 fair use라고 해도 되고, § 107처럼 'is a fair use'라고 a를 붙여도 됩니다."}, "collocations": ["fair use defense (공정이용 항변)", "the four fair use factors", "transformative use (변형적 이용)", "qualify as fair use"], "links": [{"label": "LII Wex — fair use", "url": "https://www.law.cornell.edu/wex/fair_use"}]}, {"id": "trademark", "hw": "trademark", "ipa": "ˈtreɪd.mɑːrk", "stress": "**trade**·mark", "stars": 3, "gloss": "상표", "diff": "미국은 사용주의 국가입니다. 상거래에서 실제로 쓰면 등록하지 않아도 보통법상 권리가 생기고, 연방 등록에도 사용(또는 진정한 사용 의사)이 필요합니다. 한국은 사용하지 않아도 등록으로 권리가 생기는 등록주의라 출발점이 다릅니다. 상표권은 설정등록으로 발생하고(상표법 제82조 제1항), 같은 상표를 두고 출원이 겹치면 원칙적으로 먼저 출원한 사람만 등록받을 수 있습니다(선출원, 제35조 제1항).", "examples": {"easy": {"en": "The apple logo is a famous trademark.", "ko": "그 사과 로고는 유명한 상표다."}, "practice": {"en": "The company registered its trademark in the United States and Korea.", "ko": "그 회사는 미국과 한국에서 상표를 등록했다."}, "source": {"en": "includes any word, name, symbol, or device, or any combination thereof … to identify and distinguish his or her goods, including a unique product, from those manufactured or sold by others and to indicate the source of the goods, even if that source is unknown", "ko": "(상표란) 단어, 명칭, 기호, 도안 또는 그 결합으로서 … 자기의 상품(독특한 제품을 포함한다)을 타인이 제조·판매하는 상품과 식별·구별하고, 그 출처가 알려져 있지 않더라도 상품의 출처를 표시하기 위한 것을 포함한다", "cite": "15 U.S.C. § 1127 — 랜햄법(Lanham Act)의 정의 조항", "url": "https://www.law.cornell.edu/uscode/text/15/1127", "glossary": {"device": "도안, 표장(여기서는 '장치'가 아니다)", "distinguish": "구별하다", "indicate the source": "출처를 표시하다"}}}, "box": "연방 상표법은 1946년에 만든 Lanham Act입니다. 상품에 쓰는 표장이 trademark, 서비스에 쓰는 표장이 service mark이고, 둘을 묶어 mark라고 부릅니다. 등록 상표에는 ®, 미등록 상표에는 ™를 붙이는 관행이 있습니다.", "grammar": {"axis": "G6", "title": "상표는 register와 짝", "wrong": "The company enrolled its trademark.", "right": "The company registered its trademark. / The company applied to register the mark.", "note": "등록하다는 register, 명사는 registration입니다. 특허는 grant/issue(부여), 상표는 register(등록)로 동사가 갈립니다."}, "collocations": ["register a trademark", "trademark registration", "trademark infringement", "likelihood of confusion (혼동 가능성)"], "links": [{"label": "LII Wex — trademark", "url": "https://www.law.cornell.edu/wex/trademark"}, {"label": "LII Wex — Lanham Act", "url": "https://www.law.cornell.edu/wex/lanham_act"}]}, {"id": "trade-secret", "hw": "trade secret", "ipa": "ˌtreɪd ˈsiː.krət", "stress": "trade **se**·cret", "stars": 2, "gloss": "영업비밀", "diff": "특허는 기술을 공개하는 대가로 20년 독점을 받고, 영업비밀은 공개하지 않는 대신 비밀이 지켜지는 한 기간 제한 없이 보호됩니다. 미국은 주법과 2016년 연방 영업비밀보호법(DTSA)이 함께 작동합니다. 한국의 대응 법률은 「부정경쟁방지 및 영업비밀보호에 관한 법률」입니다.", "examples": {"easy": {"en": "The recipe is a trade secret.", "ko": "그 조리법은 영업비밀이다."}, "practice": {"en": "A former engineer allegedly took several trade secrets to a competitor.", "ko": "전직 엔지니어가 영업비밀 여러 건을 경쟁사로 가져갔다는 혐의를 받고 있다."}, "source": {"en": "the owner thereof has taken reasonable measures to keep such information secret; and (B) the information derives independent economic value, actual or potential, from not being generally known to, and not being readily ascertainable through proper means by, another person who can obtain economic value from the disclosure or use of the information", "ko": "(A) 보유자가 그 정보를 비밀로 유지하기 위하여 합리적인 조치를 하였고, (B) 그 정보가 그 공개나 사용으로 경제적 가치를 얻을 수 있는 다른 사람에게 일반적으로 알려져 있지 않고 정당한 수단으로 쉽게 알아낼 수도 없다는 점에서 현실적 또는 잠재적인 독립된 경제적 가치를 가질 것", "cite": "18 U.S.C. § 1839(3) — 연방법상 영업비밀의 두 요건", "url": "https://www.law.cornell.edu/uscode/text/18/1839", "glossary": {"reasonable measures": "합리적인 조치(비밀관리성)", "independent economic value": "독립된 경제적 가치(경제적 유용성)", "generally known": "일반적으로 알려진(비공지성)", "readily ascertainable through proper means": "정당한 수단으로 쉽게 알아낼 수 있는"}}}, "box": "영업비밀을 부정한 수단으로 얻거나 쓰는 것을 misappropriation(부정취득·부정사용)이라 합니다. DTSA는 영업비밀을 침해당한 보유자가 연방법원에 민사소송을 낼 수 있게 했습니다(18 U.S.C. § 1836(b)(1)).", "grammar": {"axis": "G2", "title": "trade secret은 셀 수 있다", "wrong": "He stole many trade secret.", "right": "He stole many trade secrets. / one of the company's trade secrets", "note": "정보 하나하나를 세므로 a trade secret, trade secrets. one of 뒤에는 복수를 씁니다."}, "collocations": ["misappropriate a trade secret", "misappropriation of trade secrets", "keep ... a trade secret", "non-disclosure agreement (NDA, 비밀유지계약)"], "links": [{"label": "LII Wex — trade secret", "url": "https://www.law.cornell.edu/wex/trade_secret"}]}, {"id": "infringe", "hw": "infringe · infringement", "ipa": "ɪnˈfrɪndʒ · ɪnˈfrɪndʒ.mənt", "stress": "in·**fringe** · in·**fringe**·ment", "stars": 3, "gloss": "침해하다 · 침해", "pron_tip": "강세는 둘째 음절 -fringe-에 있습니다. g는 /dʒ/로, '그'가 아니라 '쥐'에 가깝습니다.", "examples": {"easy": {"en": "Their phone infringes our patent.", "ko": "그들의 휴대전화는 우리 특허를 침해한다."}, "practice": {"en": "The jury found that the defendant willfully infringed two of the plaintiff's patents.", "ko": "배심은 피고가 원고의 특허 두 건을 고의로 침해했다고 평결했다."}, "source": {"en": "whoever without authority makes, uses, offers to sell, or sells any patented invention, within the United States or imports into the United States any patented invention during the term of the patent therefor, infringes the patent", "ko": "권한 없이 특허발명을 미국 안에서 생산·사용·판매청약·판매하거나, 그 특허의 존속기간 중에 특허발명을 미국으로 수입하는 자는 누구든지 그 특허를 침해한다", "cite": "35 U.S.C. § 271(a) — 직접침해", "url": "https://www.law.cornell.edu/uscode/text/35/271", "glossary": {"without authority": "권한 없이(실시허락 없이)", "offer to sell": "판매를 청약하다", "term": "존속기간"}}}, "box": "§ 271(b)는 침해를 적극적으로 유도한 자도 침해자로 책임진다고 정합니다(induced infringement, 유도침해). 저작권 침해는 17 U.S.C. § 501, 상표 침해는 15 U.S.C. § 1114가 근거입니다.", "pitfalls": ["infringe를 '위반하다(violate)'로만 옮기기 — 지식재산에서는 '침해하다'", "infringement를 셀 때: 침해 행위 하나는 an infringement, 법리·현상은 무관사 infringement"], "grammar": {"axis": "G4", "title": "infringe the patent — 전치사 없이", "wrong": "The product infringes to the patent.", "right": "The product infringes the patent.", "note": "법령·판결문은 타동사로 infringe the patent라고 씁니다(§ 271(a)). infringe to는 쓰지 않습니다. infringe on / upon도 사전에 오른 영어 용법이고(Cambridge, '권리·자유를 침범하다') 틀린 것은 아니지만, 특허 서면에서는 조문과 같은 직접 목적어 형태를 권합니다."}, "collocations": ["infringe a patent / copyright / trademark", "patent infringement suit", "willful infringement (고의 침해)", "non-infringement (비침해)"], "links": [{"label": "LII Wex — infringement", "url": "https://www.law.cornell.edu/wex/infringement"}, {"label": "LII Wex — patent infringement", "url": "https://www.law.cornell.edu/wex/patent_infringement"}]}, {"id": "license", "hw": "license · royalty", "ipa": "ˈlaɪ.səns · ˈrɔɪ.əl.t̬i", "stress": "**li**·cense · **roy**·al·ty", "stars": 2, "uk": "licence (명사 철자; 동사는 영국에서도 license)", "gloss": "실시허락·이용허락(라이선스) · 실시료·사용료(로열티)", "diff": "한국 특허법은 실시권을 전용실시권과 통상실시권으로 나누고, 저작권법은 '이용허락', 상표법은 '사용권'이라고 부릅니다. 영어는 모두 license 하나로 말하고, 독점 여부는 exclusive / non-exclusive로 붙여 구별합니다.", "examples": {"easy": {"en": "We pay royalties for the software.", "ko": "우리는 그 소프트웨어에 사용료를 낸다."}, "practice": {"en": "The patentee granted a non-exclusive license in exchange for a 3% royalty.", "ko": "특허권자는 3% 실시료를 받는 조건으로 통상실시권을 허락했다."}, "source": {"en": "the court shall award the claimant damages adequate to compensate for the infringement, but in no event less than a reasonable royalty for the use made of the invention by the infringer", "ko": "법원은 청구인에게 침해를 보상하기에 충분한 손해배상을 명하여야 하되, 어떠한 경우에도 침해자가 그 발명을 실시한 데 대한 합리적인 실시료보다 적어서는 안 된다", "cite": "35 U.S.C. § 284 — 특허침해 손해배상", "url": "https://www.law.cornell.edu/uscode/text/35/284", "glossary": {"claimant": "청구인(여기서는 특허권자인 원고)", "in no event less than": "어떠한 경우에도 ~보다 적지 않게", "reasonable royalty": "합리적 실시료"}}}, "box": "§ 284는 손해배상의 바닥을 '합리적 실시료'로 정합니다. 같은 조는 법원이 손해액을 3배까지 늘릴 수 있다고도 정합니다(increase the damages up to three times). 한국 특허법은 고의 침해에 손해액의 5배까지 정할 수 있게 합니다(제128조 제8항).", "grammar": {"axis": "G6", "title": "license는 grant / take와 짝", "wrong": "The company gave a license permission to us.", "right": "The company granted us a license. / We took a license under the patent.", "note": "허락하는 쪽은 grant a license, 받는 쪽은 take(obtain) a license. '특허에 대한 실시권'은 a license under the patent처럼 under를 씁니다."}, "collocations": ["grant / take a license", "exclusive / non-exclusive license", "licensor / licensee (허락자 / 실시권자)", "pay royalties", "royalty rate (실시료율)"], "links": [{"label": "LII Wex — license", "url": "https://www.law.cornell.edu/wex/license"}, {"label": "LII Wex — royalty", "url": "https://www.law.cornell.edu/wex/royalty"}]}, {"id": "uspto", "hw": "USPTO", "ipa": "ˌjuː.es.piː.tiːˈoʊ", "stress": "U·S·P·T·**O**", "stars": 1, "gloss": "미국 특허상표청(United States Patent and Trademark Office)", "pron_tip": "한 글자씩 읽고 마지막 O에 강세를 둡니다. 낱말처럼 붙여 읽지 않습니다. USPTO는 발음 사전(Cambridge US) 미수록이라 미국 법조 관행 발음으로 적었습니다.", "diff": "상무부 소속 기관이고 특허와 상표를 함께 맡습니다. 저작권은 맡지 않습니다(→ intellectual property). 심판 기구로 특허심판부(PTAB)와 상표심판부(TTAB)가 있고, PTAB 결정에 대한 항소는 연방순회항소법원(Federal Circuit)이 전속관할합니다(28 U.S.C. § 1295(a)(4)(A), 35 U.S.C. § 141). 다만 거절결정 불복심판에서 진 출원인은 항소 대신 버지니아 동부 연방지방법원에 민사소송을 낼 수도 있습니다(35 U.S.C. § 145).", "examples": {"easy": {"en": "The USPTO granted the patent.", "ko": "미국 특허상표청이 특허를 부여했다."}, "practice": {"en": "We filed the application with the USPTO, and an examiner has issued a rejection.", "ko": "우리는 미국 특허상표청에 출원했고, 심사관이 거절이유를 통지했다."}, "source": {"en": "shall be responsible for the granting and issuing of patents and the registration of trademarks", "ko": "특허의 부여와 발급, 그리고 상표의 등록을 담당한다", "cite": "35 U.S.C. § 2(a)(1)", "url": "https://www.law.cornell.edu/uscode/text/35/2"}}, "grammar": {"axis": "G1", "title": "기관 약칭에는 the", "wrong": "We filed it with USPTO.", "right": "We filed it with the USPTO.", "note": "글자 하나씩 읽는 기관 약칭(the USPTO, the FBI, the EU)에는 the를 붙입니다. NASA처럼 낱말로 읽는 약칭은 보통 관사 없이 씁니다."}, "collocations": ["file with the USPTO", "patent examiner (심사관)", "office action (거절이유통지 등 심사 통지)", "PTAB (특허심판부)"], "links": [{"label": "LII Wex — USPTO", "url": "https://www.law.cornell.edu/wex/uspto"}, {"label": "USPTO — Patent basics", "url": "https://www.uspto.gov/patents/basics"}]}], "corners": {"false_friend": {"title": "claim은 세 번 변신한다", "body": ["claim의 일상 뜻은 '주장하다'입니다. 법정에서는 장마다 다른 옷을 입습니다. 민사소송의 claim은 '청구'(3장), 도산의 claim은 '채권'(13장), 특허의 claim은 '청구항'입니다.", "특허 문서에서 claim은 문장 하나하나를 셉니다. 'claim 1 is invalid'는 '청구가 무효'가 아니라 '청구항 1이 무효'라는 뜻입니다. 같은 문서 안에서 동사 claim(청구하다)과 명사 claim(청구항)이 함께 나오기도 합니다(§ 112(b)의 'claims … distinctly claiming').", "이 장의 다른 가짜 친구도 함께 봅니다."], "table": [["claim", "주장(하다)", "청구항(특허) — 3장 청구, 13장 채권"], ["art", "예술", "기술(prior art, useful arts)"], ["device", "장치", "도안·표장(상표 정의 조항에서)"], ["use", "사용", "이용(fair use), 실시(특허 'uses')"], ["license", "면허증", "실시허락·이용허락"]], "tip": "특허 문서에서 숫자가 붙은 claim(claim 1, claims 3-5)은 언제나 청구항입니다."}, "drama": {"title": "Flash of Genius (2008)", "facts": ["2008년 미국 영화. 감독 마크 에이브러햄(Marc Abraham), 주연 그렉 키니어(Greg Kinnear).", "존 시브룩(John Seabrook)이 1993년 『뉴요커』에 쓴 기사가 원작입니다. 간헐식 와이퍼를 발명해 특허를 받은 로버트 컨스(Robert Kearns)가 포드를 상대로 벌인 특허침해 소송이 실화입니다.", "포드 사건은 1978년에 시작해 1990년에 끝났습니다. 배심은 520만 달러를 평결했고, 포드는 다시 재판하는 대신 1,020만 달러를 지급하기로 했습니다. 컨스는 뒤이은 크라이슬러 사건에서 대부분 스스로 변론했습니다."], "watch": "대기업이 발명가의 아이디어를 가져다 쓰고, 발명가는 화해금을 거절한 채 법정에서 'infringe'를 인정받으려 합니다. 제목의 flash of genius(천재의 번뜩임)는 1941년부터 1952년까지 쓰인 특허 판단 기준을 가리키는 말입니다. 1952년 특허법은 § 103 끝에 'Patentability shall not be negated by the manner in which the invention was made.'(발명이 이루어진 방식으로 특허성이 부정되지 않는다)라는 문장을 넣어 그 기준을 걷어냈습니다.", "terms": ["patent", "infringe / infringement", "license", "settlement (→ 3장)", "jury verdict (→ 4장)"], "links": [{"label": "Wikipedia — Flash of Genius (film)", "url": "https://en.wikipedia.org/wiki/Flash_of_Genius_(film)"}, {"label": "Wikipedia — Robert Kearns", "url": "https://en.wikipedia.org/wiki/Robert_Kearns"}, {"label": "YouTube — 공식 예고편 (StudiocanalUK, 영국 배급사)", "url": "https://www.youtube.com/watch?v=HXuAtKKb9gw"}]}, "quote": {"text": "A person of ordinary skill is also a person of ordinary creativity, not an automaton.", "ko": "통상의 기술자는 통상의 창의력을 가진 사람이기도 하며, 자동 기계가 아니다.", "case": "KSR Int'l Co. v. Teleflex Inc., 550 U.S. 398, 421 (2007)", "decided": "2007. 4. 30. 선고", "gloss": {"a person of ordinary skill": "통상의 기술자", "creativity": "창의력", "automaton": "자동 기계, 시키는 대로만 움직이는 존재"}, "why": "연방순회항소법원은 선행기술들을 결합하라는 가르침·암시·동기(TSM)를 찾을 때 공개된 문헌과 특허의 명시적 내용에 치우쳐 TSM 기준을 경직되게 적용했습니다. 연방대법원은 만장일치로 그런 형식적 적용을 배척하고(TSM이라는 통찰 자체를 버린 것은 아닙니다), 통상의 기술자는 문헌에 적힌 것만 기계적으로 따르는 사람이 아니라고 했습니다.", "links": [{"label": "LII — KSR 판결 원문", "url": "https://www.law.cornell.edu/supct/html/04-1350.ZO.html"}, {"label": "Oyez — KSR v. Teleflex", "url": "https://www.oyez.org/cases/2006/04-1350"}]}, "korea": {"title": "특허 사건은 어디로 가나?", "us": "미국에서는 USPTO 특허심판부(PTAB)의 결정도, 연방지방법원의 특허침해 판결도 연방순회항소법원(Federal Circuit)으로 항소합니다(28 U.S.C. § 1295(a)(1), (a)(4)(A)). 거절결정에 불복하는 출원인에게는 버지니아 동부 연방지방법원 민사소송이라는 다른 길도 있습니다(35 U.S.C. § 145).", "kr": "한국에서는 특허심판원의 심결에 대한 소가 특허법원의 전속관할입니다(특허법 제186조 제1항). 특허법원은 이 심결취소소송을 제1심으로 심판하고, 특허권 등 침해소송의 항소사건도 맡습니다(법원조직법 제28조의4 제1호·제2호, 민사소송법 제24조 제2항·제3항). 심결취소와 침해 항소를 한 법원에 모은 점에서 Federal Circuit과 닮았지만, 특허법원은 고등법원급 법원이고 그 판결에는 대법원에 상고할 수 있습니다(특허법 제186조 제8항).", "say": "In Korea, an appeal from a decision of the Board goes exclusively to the IP High Court of Korea, which also hears appeals in patent infringement cases.", "say_ko": "한국에서는 특허심판원 심결에 대한 불복은 특허법원의 전속관할이고, 특허법원은 특허침해 사건의 항소도 심리합니다."}}, "quiz": [{"q": "특허 문서에서 'Claim 1 is invalid.'의 claim은?", "options": ["청구(소송상)", "채권", "청구항", "주장"], "answer": 2, "why": "특허에서 숫자가 붙은 claim은 청구항입니다. 민사소송의 청구는 3장, 도산의 채권은 13장."}, {"q": "'prior art'의 뜻은?", "options": ["옛 예술 작품", "선행기술", "우선권", "선사용권"], "answer": 1, "why": "여기서 art는 '기술'입니다. 우선권은 priority, 선사용권은 prior user right."}, {"q": "다음 중 미국에서 USPTO가 맡지 않는 것은?", "options": ["특허 부여", "상표 등록", "저작권 등록"], "answer": 2, "why": "35 U.S.C. § 2(a)(1)에 따라 USPTO는 특허와 상표를 맡습니다. 저작권은 의회도서관 소속 저작권청(Copyright Office) 소관입니다."}, {"q": "문법: 빈칸에 맞는 것은? — The company ____ a patent application last year.", "options": ["applied", "applying", "filed", "did"], "answer": 2, "why": "특허출원은 file a patent application. apply를 쓰려면 apply for a patent. applying은 동사 자리에 올 수 없고, do는 application과 짝을 이루지 않습니다.", "grammar": "G6"}, {"q": "번역해 보세요: The court held that the defendant infringed the patent.", "options": ["법원은 피고가 그 특허를 침해했다고 판단했다.", "법원은 피고가 그 특허를 출원했다고 판단했다.", "법원은 피고의 특허가 무효라고 판단했다."], "answer": 0, "why": "infringe = 침해하다. 특허를 침해할 때는 전치사 없이 infringe the patent라고 씁니다."}]}, {"chapter": {"num": 19, "title": "법률가의 실전 영어", "subtitle": "자기소개·질문·한국 제도 설명", "title_en": "Practical English for Lawyers — Introductions, Questions, and Explaining the Korean System", "lead": "국제회의에서 필요한 말은 생각보다 적습니다. 나를 소개하는 두 문장, 발표자에게 묻는 한 문장, 한국 법원을 설명하는 세 문장이면 첫 대화는 시작됩니다. 이 장은 단어가 아니라 그 문장들을 장면별로 모았습니다.", "can_say": [{"en": "I'm a judge at a district court in Korea, and I mainly handle civil cases.", "ko": "저는 한국의 지방법원 판사이고, 주로 민사사건을 담당합니다."}, {"en": "Thank you for the great presentation. I have a short question.", "ko": "훌륭한 발표 감사합니다. 짧은 질문이 하나 있습니다."}, {"en": "Korea has a three-tier court system, with the Supreme Court at the top.", "ko": "한국은 3심제이고, 맨 위에 대법원이 있습니다."}]}, "entries": [{"id": "intro-self", "hw": "I'm a judge at a district court in Korea.", "ipa": "dʒʌdʒ · ˈdɪs.trɪkt", "stress": "**judge** · **dis**·trict", "stars": 3, "gloss": "자기소개 — 소속과 직업 말하기", "pron_tip": "I'm a judge는 /aɪm ə dʒʌdʒ/ 세 마디가 한 덩어리로 붙습니다. district court는 district의 끝 t가 거의 들리지 않고 court로 바로 넘어갑니다.", "diff": "영어 자기소개는 이름 → 직업 → 소속 순으로 짧게 끝냅니다. 직급(부장판사·차장검사)은 처음부터 말하지 않아도 됩니다. 꼭 밝히려면 a presiding judge(재판장)처럼 하는 일로 풀어 말하는 편이 통합니다.", "examples": {"easy": {"en": "I'm a prosecutor in Seoul.", "ko": "저는 서울에서 일하는 검사입니다."}, "practice": {"en": "Hi, I'm Jiwoo Han. I'm a litigator at a law firm in Busan, and I mostly work on patent cases.", "ko": "안녕하세요, 한지우입니다. 부산의 한 로펌에서 송무를 맡고 있고, 주로 특허 사건을 합니다."}, "source": {"en": "My name is John Roll. I am a district judge in Arizona.", "ko": "저는 존 롤입니다. 애리조나주의 연방지방법원 판사입니다.", "cite": "U.S. Senate Committee on the Judiciary, Immigration Litigation Reduction, April 3, 2006 (전사) — John M. Roll 판사 진술", "url": "https://www.govinfo.gov/content/pkg/CHRG-109shrg28339/html/CHRG-109shrg28339.htm", "glossary": {"district judge": "(연방)지방법원 판사"}}}, "pitfalls": ["I'm judge. — 관사가 빠지면 '판사라는 직함'만 남아 어색, 직업 앞에는 a", "I'm working in court. — in court는 '법정에 (서) 있다', 근무처는 at a court"], "grammar": {"axis": "G1", "title": "직업 앞에는 a, 처음 말하는 기관에도 a", "wrong": "I'm judge at district court in Korea.", "right": "I'm a judge at a district court in Korea.", "note": "직업은 셀 수 있는 명사라 a를 붙입니다. 듣는 사람이 아직 모르는 법원이면 a district court, 이름을 대면 관사 없이 Seoul Central District Court."}, "collocations": ["I work as a prosecutor in Daegu.", "I'm a litigator at a law firm in Seoul.", "I'm in-house counsel at a tech company. (사내 변호사)", "I sit on the IP High Court of Korea. (판사, 격식체)"], "links": [{"label": "LII Wex — judge", "url": "https://www.law.cornell.edu/wex/judge"}]}, {"id": "intro-docket", "hw": "I mainly handle civil cases.", "ipa": "ˈsɪv.əl · ˈdɑː.kɪt", "stress": "**civ**·il · **dock**·et", "stars": 3, "gloss": "담당 분야 — 맡은 사건 종류 말하기", "pron_tip": "civil의 끝 l은 혀끝을 윗잇몸에 대고 끝냅니다. 뒤에 모음을 덧붙여 늘이지 않습니다. docket의 o는 미국식으로 입을 크게 벌린 /ɑː/입니다.", "examples": {"easy": {"en": "I handle criminal cases.", "ko": "저는 형사사건을 맡고 있습니다."}, "practice": {"en": "My docket is mostly criminal, but I also hear some juvenile cases.", "ko": "제 담당 사건은 대부분 형사이고, 소년사건도 일부 맡습니다."}, "source": {"en": "I handle mostly criminal--my docket is mostly criminal, but I've also handled civil cases and divorce cases, juvenile cases.", "ko": "저는 주로 형사를, 그러니까 제 담당 사건은 대부분 형사이지만, 민사사건과 이혼사건, 소년사건도 맡아 왔습니다.", "cite": "U.S. Senate Committee on the Judiciary, Confirmation Hearings on Federal Appointments, June 8, 2011 (전사) — Susan O. Hickey 지명자 답변", "url": "https://www.govinfo.gov/content/pkg/CHRG-112shrg76350/html/CHRG-112shrg76350.htm", "glossary": {"docket": "담당 사건(목록)", "--": "말하다 고쳐 말한 자리(전사 기호)"}}}, "grammar": {"axis": "G2", "title": "종류를 말할 때 사건은 복수", "wrong": "I mainly handle civil case.", "right": "I mainly handle civil cases.", "note": "'민사사건을 한다'는 사건 여러 건을 가리키므로 cases. 한 건을 말할 때만 a civil case입니다."}, "collocations": ["My docket is mostly criminal.", "I focus on IP litigation.", "I prosecute financial crimes. (검사)", "I represent mainly corporate clients. (변호사)"], "links": [{"label": "LII Wex — docket", "url": "https://www.law.cornell.edu/wex/docket"}]}, {"id": "intro-career", "hw": "I've been on the bench for ten years.", "ipa": "bentʃ · jɪrz", "stress": "**bench** · **years**", "stars": 2, "gloss": "경력 — 몇 년째 일하고 있는지 말하기", "pron_tip": "I've been은 /aɪv bɪn/으로 짧게. been을 /biːn/으로 길게 끌지 않는 것이 미국식 리듬입니다. years는 y 소리로 시작해 ears와 다릅니다.", "diff": "on the bench는 '판사로 재직 중'이라는 관용구입니다. 변호사는 I've practiced law for ten years, 검사는 I've been a prosecutor for ten years라고 합니다.", "examples": {"easy": {"en": "I've been a judge for ten years.", "ko": "판사로 일한 지 10년 됐습니다."}, "practice": {"en": "I joined the prosecution service in 2015, so this is my eleventh year.", "ko": "2015년에 검사로 임용되었으니 올해로 11년째입니다."}}, "pitfalls": ["I've been a judge since ten years. — since 뒤에는 시점(2015), for 뒤에는 기간(ten years)"], "grammar": {"axis": "G2", "title": "기간의 숫자 뒤 명사는 복수", "wrong": "I've practiced law for ten year.", "right": "I've practiced law for ten years.", "note": "two 이상이면 복수. 형용사로 쓸 때만 단수입니다: a ten-year career(10년 경력)."}, "collocations": ["I've practiced law for twelve years.", "I've been a prosecutor since 2014.", "I was appointed to the bench in 2016.", "I have a fifteen-year career in litigation."]}, {"id": "q-start", "hw": "Thank you for the great presentation. I have a short question.", "ipa": "ˌprez.ənˈteɪ.ʃən · ˈkwes.tʃən", "stress": "pres·en·**ta**·tion · **ques**·tion", "stars": 3, "gloss": "질문 시작 — 감사 한마디 뒤 바로 질문", "pron_tip": "질문 첫 문장은 천천히, 두 문장으로 끊어 말합니다. Thank you for the가 /θæŋk.jə.fɚ.ðə/로 이어지고, 강세는 great와 presentation의 ta에 옵니다.", "box": "국제회의 질의응답은 보통 한 사람에 질문 하나입니다. 자기 이름과 소속을 한 줄로 밝히고(My name is ..., from ...), 감사 한마디 뒤 곧장 질문으로 들어가면 됩니다. 긴 서론은 사회자가 끊는 일도 있습니다.", "examples": {"easy": {"en": "Thank you. I have one question.", "ko": "감사합니다. 질문이 하나 있습니다."}, "practice": {"en": "Thank you for a very clear talk. I'm Sora Park, a prosecutor from Korea. My question is about remote testimony.", "ko": "명쾌한 발표 감사합니다. 한국 검사 박소라입니다. 원격 증언에 관해 여쭙겠습니다."}, "source": {"en": "I want to thank you for your testimony. I have a question directed to both of you, and I would like for you to just individually answer it.", "ko": "진술해 주셔서 감사합니다. 두 분 모두께 드릴 질문이 하나 있는데, 각자 따로 답해 주셨으면 합니다.", "cite": "U.S. Senate Committee on the Judiciary, Subcommittee on Privacy, Technology and the Law, Protecting Mobile Privacy: Your Smartphones, Tablets, Cell Phones and Your Privacy, May 10, 2011 (전사) — 소위원회 간사(Ranking Member) Tom Coburn 상원의원이 증인들에게 한 질의. 법정이 아니라 의회 청문회 발화다", "url": "https://www.govinfo.gov/content/pkg/CHRG-112shrg86775/html/CHRG-112shrg86775.htm", "glossary": {"testimony": "(청문회) 진술", "directed to": "~에게 하는"}}}, "grammar": {"axis": "G4", "title": "Thank you for 뒤에는 명사 또는 -ing", "wrong": "Thank you for invite me.", "right": "Thank you for inviting me. / Thank you for the invitation.", "note": "for는 전치사라 동사 원형이 올 수 없습니다. 동사를 쓰려면 -ing로 바꿉니다."}, "collocations": ["Thank you for a fascinating talk.", "My question is for Professor Lee.", "I have a quick follow-up question.", "Let me ask a short question about ..."]}, {"id": "q-clarify", "hw": "Could you say a little more about that point?", "ipa": "kʊd · pɔɪnt", "stress": "**could** · **point**", "stars": 3, "gloss": "확인 질문 — 더 설명해 달라고 하기", "pron_tip": "Could you는 /kʊ.dʒə/로 붙습니다. d와 y가 만나 j 소리가 나는 연음입니다. 문장 끝 point에서 억양을 올리면 부드러운 부탁이 됩니다.", "examples": {"easy": {"en": "Could you explain that again?", "ko": "그 부분을 다시 설명해 주시겠어요?"}, "practice": {"en": "If I understood correctly, the court can appoint its own expert. Could you say a little more about how often that happens?", "ko": "제가 제대로 이해했다면 법원이 직접 감정인을 지정할 수 있다는 말씀인데, 그런 일이 얼마나 자주 있는지 조금 더 말씀해 주시겠습니까?"}, "source": {"en": "Mr. Abramowitz, could you say a little more about the brokers and in what industries these brokers tend to operate", "ko": "에이브러머위츠 씨, 그 브로커들에 대해, 그리고 그들이 주로 어떤 업종에서 활동하는지 조금 더 말씀해 주시겠습니까", "cite": "U.S. Senate Committee on Foreign Relations, The Next Ten Years in the Fight Against Human Trafficking: Attacking the Problem with the Right Tools, July 17, 2012 (전사) — 위원장 질의", "url": "https://www.govinfo.gov/content/pkg/CHRG-112shrg76692/html/CHRG-112shrg76692.htm", "glossary": {"broker": "(인력) 중개업자", "tend to": "주로 ~하는 경향이 있다"}}}, "grammar": {"axis": "G4", "title": "say more about — 전치사 about을 빼지 않는다", "wrong": "Could you explain about that point?", "right": "Could you explain that point? / Could you say more about that point?", "note": "explain·discuss는 목적어를 바로 받고 about을 붙이지 않습니다. say more·talk는 about이 필요합니다."}, "collocations": ["If I understood correctly, ...", "Could you give an example?", "What do you mean by 'proportionate'?", "Could you clarify the second point?"]}, {"id": "q-repeat", "hw": "Sorry, could you repeat the last part?", "ipa": "rɪˈpiːt · pɑːrt", "stress": "re·**peat** · **part**", "stars": 3, "gloss": "못 알아들었을 때 — 다시 말해 달라고 하기", "pron_tip": "last part는 last의 t가 거의 사라져 /læs pɑːrt/처럼 들립니다. Sorry는 끝을 올려 말하면 '네?'에 가까운 되물음이 됩니다.", "diff": "Pardon?만 쓰면 짧아서 어디를 못 들었는지 상대가 모릅니다. 못 들은 부분(the last part, the number)을 짚어 주면 한 번에 해결됩니다.", "examples": {"easy": {"en": "Sorry, could you say that again?", "ko": "죄송하지만 다시 한번 말씀해 주시겠어요?"}, "practice": {"en": "Sorry, the audio cut out for a moment. Could you repeat the last part, after the case name?", "ko": "죄송합니다, 잠깐 소리가 끊겼습니다. 사건명 다음 부분을 다시 말씀해 주시겠어요?"}, "source": {"en": "I'm sorry, Senator, could you repeat the last part of your question?", "ko": "죄송합니다, 의원님, 질문의 마지막 부분을 다시 말씀해 주시겠습니까?", "cite": "U.S. Senate Select Committee on Intelligence, Nomination of Shannon Corless to Be Assistant Secretary for Intelligence and Analysis, U.S. Department of the Treasury, November 30, 2021 (전사) — Corless 지명자 답변", "url": "https://www.govinfo.gov/content/pkg/CHRG-117shrg46623/html/CHRG-117shrg46623.htm", "glossary": {"Senator": "(호칭) 상원의원님"}}}, "grammar": {"axis": "G1", "title": "the last part — 정해진 '그' 부분에는 the", "wrong": "Could you repeat last part?", "right": "Could you repeat the last part?", "note": "상대가 방금 한 말의 정해진 '마지막 부분'이므로 the last part. last·first·same 앞에는 이렇게 the가 오는 일이 많지만 늘 그런 것은 아닙니다 — my first question, a first attempt처럼 다른 한정사도 오고, last week·last year 같은 시간 표현은 관사 없이 씁니다."}, "collocations": ["Could you speak a little more slowly?", "Sorry, I didn't catch the name of the case.", "Could you spell that, please?", "Did you say fifteen or fifty?"]}, {"id": "opinion", "hw": "From a Korean perspective, this approach seems quite efficient.", "ipa": "pɚˈspek.tɪv · ɪˈfɪʃ.ənt", "stress": "per·**spec**·tive · ef·**fi**·cient", "stars": 2, "gloss": "의견 말하기 — 관점과 경험을 밝히고 말하기", "pron_tip": "perspective의 첫 음절은 약하게 /pɚ/, 강세는 spec. efficient도 첫 e가 약한 /ɪ/이고 fi에 힘이 실립니다.", "examples": {"easy": {"en": "In my experience, it works well.", "ko": "제 경험으로는 잘 돌아갑니다."}, "practice": {"en": "In my experience as a defense lawyer, early disclosure of evidence saves a lot of court time.", "ko": "변호인으로 일해 본 경험으로는 증거를 일찍 공개하면 재판 시간이 크게 줄어듭니다."}}, "grammar": {"axis": "G4", "title": "관점은 from, 경험은 in", "wrong": "In Korean perspective, ... / From my experience as judge, ...", "right": "From a Korean perspective, ... / In my experience as a judge, ...", "note": "from a ~ perspective, in my experience가 굳은 짝입니다. 둘 다 명사 앞의 한정사 — 관사 a 또는 소유 한정사 my — 를 빼지 않습니다."}, "collocations": ["In my experience, ...", "Speaking as a trial judge, ...", "In Korea, we tend to ...", "As far as I know, ..."]}, {"id": "kr-courts", "hw": "Korea has a three-tier court system, with the Supreme Court at the top.", "ipa": "tɪr · ˈsɪs.təm", "stress": "**tier** · **sys**·tem", "stars": 3, "gloss": "한국 법원 구조 — 3심제 설명하기", "pron_tip": "tier는 한 음절 /tɪr/로 tear(눈물)와 같은 소리입니다. three-tier는 두 단어 모두 힘을 주되 tier를 조금 더 세게 말합니다.", "diff": "헌법 제101조 제2항은 '대법원과 각급법원'이라고만 정하고 '3심'이라는 말은 쓰지 않습니다. 3심 구조는 법원조직법의 관할 규정(제1심 → 항소심 → 대법원)에서 나옵니다. 특허 사건처럼 특허심판원 심결을 특허법원이 처음 심리하는 예도 있어 모든 사건이 같은 경로를 밟지는 않습니다.", "examples": {"easy": {"en": "Korea has three levels of courts.", "ko": "한국 법원은 세 단계로 되어 있습니다."}, "practice": {"en": "Cases start in a district court, go to a high court or an appellate panel of the district court on appeal, and can finally reach the Supreme Court of Korea.", "ko": "사건은 지방법원에서 시작해 항소하면 고등법원이나 지방법원 항소부로 가고, 마지막으로 대법원까지 갈 수 있습니다."}, "source": {"en": "The courts shall be composed of the Supreme Court, which is the highest court of the State, and other courts at specified levels.", "ko": "법원은 최고법원인 대법원과 각급법원으로 조직된다.", "cite": "대한민국헌법 제101조 제2항 (영문은 한국법제연구원 KLRI 번역)", "url": "https://elaw.klri.re.kr/kor_service/lawViewMultiContent.do?hseq=1", "glossary": {"courts at specified levels": "각급법원", "the highest court of the State": "최고법원"}}}, "box": "영문 번역은 한국법제연구원(KLRI)이 제공하는 참고용이고, 효력이 있는 것은 한국어 원문입니다. 국제회의에서는 공식 명칭 Supreme Court of Korea, IP High Court of Korea를 그대로 쓰면 됩니다.", "grammar": {"axis": "G1", "title": "체계를 처음 소개할 때 a, 유일한 기관은 the", "wrong": "Korea has three-tier court system, with Supreme Court at the top.", "right": "Korea has a three-tier court system, with the Supreme Court at the top.", "note": "three-tier court system은 셀 수 있는 명사구라 a. 나라에 하나뿐인 대법원은 the Supreme Court."}, "collocations": ["Appeals from a district court panel go to a high court.", "The Supreme Court of Korea is the court of last resort.", "Patent appeals go to the IP High Court of Korea.", "The Supreme Court mainly reviews questions of law."], "links": [{"label": "LII Wex — appellate court", "url": "https://www.law.cornell.edu/wex/appellate_court"}]}, {"id": "kr-panel", "hw": "Serious cases are heard by a panel of three judges.", "ipa": "ˈsɪr.i.əs · ˈpæn.əl", "stress": "**se**·ri·ous · **pan**·el", "stars": 3, "gloss": "합의부·단독 — 재판부 구성 설명하기", "pron_tip": "panel은 /ˈpæn.əl/ 두 음절이고 강세는 앞. 끝 l은 짧게 닫습니다. heard by a는 /hɝːd.baɪ.ə/로 이어집니다.", "diff": "지방법원 제1심은 단독판사가 원칙이고(법원조직법 제7조 제4항), 합의심판을 해야 하는 사건만 판사 3명의 합의부가 맡습니다(같은 조 제5항). 어떤 사건이 합의부로 가는지는 같은 법 제32조가 정합니다(형사는 사형·무기 또는 단기 1년 이상의 징역·금고에 해당하는 사건 등, 민사는 대법원규칙). 미국 연방 지방법원은 판사 한 명이 재판하고, 3인 재판부(panel)는 주로 항소법원에서 씁니다.", "examples": {"easy": {"en": "Minor cases are heard by a single judge.", "ko": "가벼운 사건은 단독판사가 재판합니다."}, "practice": {"en": "In district courts, cases are tried by a single judge as a rule, but serious criminal cases go to a three-judge panel.", "ko": "지방법원 사건은 단독판사가 재판하는 것이 원칙이지만, 중한 형사사건은 판사 3명의 합의부로 갑니다."}, "source": {"en": "Where a collegiate judgment is required in a district court, family court, bankruptcy court, the branch court of a district court and family court, or a family branch court, it shall be performed by a collegiate panel composed of three judges.", "ko": "지방법원ㆍ가정법원ㆍ회생법원과 지방법원 및 가정법원의 지원, 가정지원에서 합의심판을 하여야 하는 경우에는 판사 3명으로 구성된 합의부에서 심판권을 행사한다.", "cite": "법원조직법 제7조 제5항 (영문은 한국법제연구원 KLRI 번역)", "url": "https://elaw.klri.re.kr/kor_service/lawViewMultiContent.do?hseq=55374", "glossary": {"collegiate panel": "합의부", "bankruptcy court": "회생법원(KLRI 번역어)"}}}, "grammar": {"axis": "G2", "title": "a panel of three judges — 단위 명사 + of + 복수", "wrong": "a panel of three judge", "right": "a panel of three judges / a three-judge panel", "note": "of 뒤 셋은 복수 judges. 하이픈으로 묶어 형용사로 쓸 때만 단수(three-judge)입니다."}, "collocations": ["a single judge (단독판사)", "a three-judge panel", "the presiding judge (재판장)", "Appeals are heard by a panel at the high court."]}, {"id": "kr-jury", "hw": "Korea has a jury system, but the jury's verdict is only advisory.", "ipa": "ˈdʒʊr.i · ədˈvaɪ.zɚ.i", "stress": "**ju**·ry · ad·**vi**·so·ry", "stars": 3, "gloss": "배심 — 국민참여재판 설명하기", "pron_tip": "jury는 /ˈdʒʊr.i/로 두 음절. advisory는 vi에 강세가 오고 끝 -sory는 약하게 /zɚ.i/로 흘립니다.", "diff": "국민참여재판(2008년 시행)은 법원조직법 제32조 제1항의 합의부 관할 형사사건 등이 대상이고(국민의 형사재판 참여에 관한 법률 제5조 제1항), 피고인이 원하지 않으면 열리지 않습니다(같은 조 제2항). 배심원의 평결과 양형 의견은 법원을 기속하지 않습니다(제46조 제5항). 평결과 다른 판결을 선고할 때는 재판장이 피고인에게 그 이유를 설명해야 합니다(제48조 제4항). 미국에서는 배심 평결이 원칙적으로 사실인정을 확정하고, 판사는 법률이 정한 요건이 있을 때에만 평결을 배제할 수 있습니다(유죄 평결 뒤 무죄판결 — Fed. R. Crim. P. 29(c), 민사 평결 뒤 법률문제 판결 — Fed. R. Civ. P. 50(b)). 이 점이 가장 크게 다릅니다.", "examples": {"easy": {"en": "The judges are not bound by the verdict.", "ko": "판사는 평결에 구속되지 않습니다."}, "practice": {"en": "Jury trials in Korea happen only when the defendant asks for one, and the court can depart from the jury's verdict.", "ko": "한국의 국민참여재판은 피고인이 원할 때만 열리고, 법원은 배심원 평결과 다르게 판결할 수 있습니다."}, "source": {"en": "No verdict and opinions under paragraphs (2) through (4) shall be binding on the court.", "ko": "제2항부터 제4항까지의 평결과 의견은 법원을 기속하지 아니한다.", "cite": "국민의 형사재판 참여에 관한 법률 제46조 제5항 (영문은 한국법제연구원 KLRI 번역)", "url": "https://elaw.klri.re.kr/kor_service/lawViewMultiContent.do?hseq=46745", "glossary": {"binding on": "~을 기속하는(구속하는)", "verdict": "평결"}}}, "grammar": {"axis": "G7", "title": "구속되지 않는다 — be bound by", "wrong": "The court does not bind by the verdict.", "right": "The court is not bound by the verdict.", "note": "법원이 '구속을 받는' 쪽이므로 수동태 be bound by. 능동으로 쓰면 The verdict does not bind the court."}, "collocations": ["The verdict is not binding on the court.", "The defendant can opt for a jury trial.", "The jury also gives an opinion on sentencing.", "The judge must explain why the judgment differs from the verdict."], "links": [{"label": "LII Wex — jury", "url": "https://www.law.cornell.edu/wex/jury"}]}, {"id": "kr-ccourt", "hw": "Constitutional review of statutes is done by a separate Constitutional Court.", "ipa": "ˌkɑːn.stəˈtuː.ʃən.əl · ˈsep.ɚ.ət", "stress": "con·sti·**tu**·tion·al · **sep**·a·rate", "stars": 3, "gloss": "헌법재판소 — 위헌심사 기관 설명하기", "pron_tip": "constitutional은 다섯 음절이고 강세는 tu. 미국식은 /tuː/라 영국식 /tjuː/보다 소리가 단순합니다. separate는 형용사일 때 끝이 /ət/로 약합니다(동사는 /eɪt/).", "diff": "미국은 일반 법원, 최종적으로 연방대법원이 위헌심사를 합니다. 한국은 헌법 제111조가 법원의 제청에 의한 법률의 위헌여부 심판, 탄핵, 정당해산, 권한쟁의, 헌법소원을 헌법재판소에 맡깁니다. 다만 명령·규칙·처분이 헌법이나 법률에 위반되는지가 재판의 전제가 되면 대법원이 최종적으로 심사합니다(헌법 제107조 제2항). 이 문형의 constitutional review는 법률의 위헌심사를 가리킵니다. 외국 법률가에게 한국 사법제도를 소개할 때 대법원과 헌법재판소를 나란히 최고 사법기관으로 드는 것은 이 역할 분담 때문입니다.", "examples": {"easy": {"en": "Korea has a separate Constitutional Court.", "ko": "한국에는 별도의 헌법재판소가 있습니다."}, "practice": {"en": "If the outcome of a case depends on whether a statute is constitutional, the court refers the question to the Constitutional Court of Korea.", "ko": "법률의 위헌 여부가 재판의 전제가 되면 법원은 헌법재판소에 위헌법률심판을 제청합니다."}, "source": {"en": "The Constitutional Court shall have jurisdiction over the following matters: 1. The constitutionality of a law upon the request of the courts", "ko": "헌법재판소는 다음 사항을 관장한다. 1. 법원의 제청에 의한 법률의 위헌여부 심판", "cite": "대한민국헌법 제111조 제1항 제1호 (영문은 한국법제연구원 KLRI 번역)", "url": "https://elaw.klri.re.kr/kor_service/lawViewMultiContent.do?hseq=1", "glossary": {"jurisdiction": "관할(권)", "upon the request of the courts": "법원의 제청에 의한"}}}, "grammar": {"axis": "G1", "title": "고유 기관명에는 the", "wrong": "The case went to Constitutional Court of Korea.", "right": "The case went to the Constitutional Court of Korea.", "note": "Court가 들어간 공식 기관명은 the와 함께 씁니다(the Supreme Court of Korea). 처음 '그런 법원이 따로 있다'고 소개할 때만 a separate Constitutional Court."}, "collocations": ["The Constitutional Court of Korea has nine Justices.", "file a constitutional complaint (헌법소원을 청구하다)", "The court referred the statute to the Constitutional Court.", "The Court struck down the provision."], "links": [{"label": "LII Wex — judicial review", "url": "https://www.law.cornell.edu/wex/judicial_review"}]}, {"id": "kr-prosecution", "hw": "In Korea, as a rule, only prosecutors can bring criminal charges.", "ipa": "ˈprɑː.sə.kjuː.t̬ɚz · ˈtʃɑːr.dʒɪz", "stress": "**pros**·e·cu·tors · **charg**·es", "stars": 3, "gloss": "검찰 — 검사의 기소 독점 설명하기", "pron_tip": "prosecutor는 첫 음절 pros에 강세. 미국식으로 cu 뒤의 t가 부드러운 /t̬/가 됩니다. charges의 -es는 /ɪz/로 한 음절을 더 만듭니다.", "diff": "형사소송법 제246조는 '공소는 검사가 제기하여 수행한다'고 정합니다. 미국도 기소는 원칙적으로 검사가 하지만, 연방 중죄는 대배심 기소(indictment)를 거쳐야 하는 등 경로가 다릅니다(→ 6장). 예외로 경미한 사건의 즉결심판은 경찰서장이 청구합니다(즉결심판에 관한 절차법 제3조 제1항). 2026. 10. 2. 시행 공소청법에 따라 검찰청은 공소청(대검찰청→공소청, 고등검찰청→광역공소청, 지방검찰청→지방공소청)으로 재편되어 검사의 사무를 맡고(공소청법 제2조, 제3조 제1항), 검사·검찰총장이라는 명칭은 헌법상 명칭이라 유지됩니다(헌법 제12조 제3항, 제89조 제16호, 공소청법 제6조). 형사소송법 제246조는 그 뒤에도 그대로입니다(2026. 10. 4. 확인).", "examples": {"easy": {"en": "As a rule, only prosecutors can indict people.", "ko": "원칙적으로 기소는 검사만 할 수 있습니다."}, "practice": {"en": "The police investigate, but the decision to indict belongs to the prosecutor, who can also decide not to prosecute.", "ko": "수사는 경찰이 하지만 기소 여부는 검사가 정하고, 검사는 기소하지 않기로 할 수도 있습니다."}, "source": {"en": "A public prosecution shall be instituted and executed by a prosecutor.", "ko": "공소는 검사가 제기하여 수행한다.", "cite": "형사소송법 제246조 (영문은 한국법제연구원 KLRI 번역)", "url": "https://elaw.klri.re.kr/kor_service/lawViewMultiContent.do?hseq=55949", "glossary": {"public prosecution": "공소", "institute": "(소를) 제기하다"}}}, "grammar": {"axis": "G2", "title": "일반론의 직업은 복수 무관사", "wrong": "In Korea, as a rule, only the prosecutor can bring criminal charge.", "right": "In Korea, as a rule, only prosecutors can bring criminal charges.", "note": "'검사라는 직업 일반'을 말할 때는 관사 없는 복수 prosecutors. charge도 '공소사실'들을 가리키면 복수 charges."}, "collocations": ["bring charges against (기소하다)", "decide not to prosecute (불기소하다)", "The prosecutor dropped the charges.", "Prosecutors have broad discretion to charge."], "links": [{"label": "LII Wex — prosecutor", "url": "https://www.law.cornell.edu/wex/prosecutor"}]}, {"id": "email-open", "hw": "Thank you for your kind invitation to the conference.", "ipa": "ˌɪn.vəˈteɪ.ʃən · ˈkɑːn.fɚ.əns", "stress": "in·vi·**ta**·tion · **con**·fer·ence", "stars": 2, "gloss": "이메일 시작 — 인사와 감사로 열기", "pron_tip": "invitation은 ta에, conference는 첫 음절 con에 강세가 옵니다. 미국식 conference는 가운데 모음이 거의 사라져 세 음절보다 짧게 들립니다.", "diff": "I hope this email finds you well.은 널리 쓰이지만 상투적이라고 보는 사람도 있습니다. 처음 연락하는 상대에게는 감사할 일(초청·회신)로 바로 여는 편이 무난합니다.", "examples": {"easy": {"en": "Thank you for your quick reply.", "ko": "빠른 회신 감사합니다."}, "practice": {"en": "Dear Professor Allen, thank you for your kind invitation to speak at the Seoul IP Forum. I would be glad to join the panel on AI and copyright.", "ko": "앨런 교수님, 서울 IP 포럼 발표에 초청해 주셔서 감사합니다. AI와 저작권 패널에 기꺼이 참여하겠습니다."}}, "grammar": {"axis": "G4", "title": "invitation to + 행사 / to + 동사", "wrong": "Thank you for your invitation for the conference.", "right": "Thank you for your invitation to the conference. / ... your invitation to speak.", "note": "invitation은 to와 짝입니다. 행사 이름이 오면 to the conference, 할 일이 오면 to speak."}, "collocations": ["I hope this email finds you well.", "Thank you for getting back to me.", "It was a pleasure to hear from you.", "I am writing to ask about ..."]}, {"id": "email-request", "hw": "I would appreciate it if you could send me the slides.", "ipa": "əˈpriː.ʃi.eɪt · slaɪdz", "stress": "ap·**pre**·ci·ate · **slides**", "stars": 2, "gloss": "이메일 부탁 — 정중하게 요청하기", "pron_tip": "appreciate의 강세는 pre. 가운데 ci는 /ʃi/이고, /priː.ʃi/를 끊지 않고 이어 붙입니다. I would는 말할 때 I'd로 줄여도 됩니다.", "examples": {"easy": {"en": "Could you send me the slides?", "ko": "발표 자료를 보내 주시겠어요?"}, "practice": {"en": "I would appreciate it if you could share the draft by Friday, so that our judges can review it before the meeting.", "ko": "회의 전에 저희 판사들이 검토할 수 있도록 금요일까지 초안을 공유해 주시면 감사하겠습니다."}}, "grammar": {"axis": "G6", "title": "appreciate it if — 빈자리를 it이 채운다", "wrong": "I would appreciate if you could send me the slides.", "right": "I would appreciate it if you could send me the slides.", "note": "appreciate는 목적어가 꼭 있어야 하는 동사라 if절 앞에 it을 둡니다. 명사를 쓰면 I would appreciate your help."}, "collocations": ["Could you possibly ...?", "I was wondering if you could ...", "It would be very helpful if ...", "I would be grateful for any comments."]}, {"id": "email-close", "hw": "Please let me know if you need anything else.", "ipa": "noʊ · els", "stress": "**know** · **else**", "stars": 2, "gloss": "이메일 마무리 — 추가 요청을 열어 두고 맺기", "pron_tip": "let me는 /lem.i/처럼 t가 거의 사라집니다. anything의 끝소리는 g가 아니라 /ŋ/ 하나이고(Cambridge US /ˈen.i.θɪŋ/), 이 /ŋ/이 else의 첫 모음에 바로 이어져 /ˌen.i.θɪŋ.els/처럼 들립니다.", "examples": {"easy": {"en": "Let me know if you have questions.", "ko": "궁금한 점이 있으면 알려 주세요."}, "practice": {"en": "Please let me know if you need any further information. I look forward to seeing you in Singapore. Best regards, Minseo Yoon", "ko": "더 필요한 자료가 있으면 알려 주십시오. 싱가포르에서 뵙기를 기대합니다. 윤민서 드림"}}, "grammar": {"axis": "G5", "title": "회신을 청하는 구동사 get back to", "wrong": "Please get back me by Monday.", "right": "Please get back to me by Monday. / Please let me know if you need anything.", "note": "get back to(~에게 회신하다)는 동사+부사+전치사가 한 덩어리인 구동사라 to를 빼지 않습니다. let me know는 구동사가 아니라 let + 목적어 + 동사원형의 사역 구조입니다. 그래서 let 뒤에는 to를 넣지 않습니다(✗ let me to know)."}, "collocations": ["I look forward to hearing from you.", "Feel free to reach out if ...", "Please get back to me by Monday.", "Best regards, / Kind regards,"]}, {"id": "networking", "hw": "It was a pleasure meeting you. Let's keep in touch.", "ipa": "ˈpleʒ.ɚ · tʌtʃ", "stress": "**pleas**·ure · **touch**", "stars": 2, "gloss": "식사·교류 — 헤어질 때 인사", "pron_tip": "pleasure의 s는 /ʒ/(measure의 그 소리)입니다. keep in touch는 /kiː.pɪn.tʌtʃ/로 세 단어가 붙습니다.", "examples": {"easy": {"en": "Nice to meet you.", "ko": "만나서 반갑습니다."}, "practice": {"en": "It was a pleasure talking with you about mediation. Here's my card. Let's keep in touch, and please let me know if you visit Seoul.", "ko": "조정 이야기를 나눌 수 있어 즐거웠습니다. 제 명함입니다. 계속 연락하시고, 서울에 오시면 꼭 알려 주세요."}}, "grammar": {"axis": "G5", "title": "keep in touch — 연락을 이어 가다", "wrong": "Let's keep contact.", "right": "Let's keep in touch. / Let's stay in touch.", "note": "touch는 여기서 '연락'이고 in과 붙어 다닙니다. 이미 끊긴 연락을 다시 하는 것은 get back in touch."}, "collocations": ["Here's my card.", "I enjoyed our conversation.", "Let's catch up at the next conference.", "Please say hello to Judge Rivera for me."]}, {"id": "talk-open", "hw": "Today I'd like to talk about online dispute resolution in Korea.", "ipa": "dɪˈspjuːt · ˌrez.əˈluː.ʃən", "stress": "dis·**pute** · res·o·**lu**·tion", "stars": 2, "gloss": "발표 시작 — 주제 소개하기", "pron_tip": "dispute는 둘째 음절 pute에 강세를 둡니다(명사로 첫 음절에 두는 발음도 있습니다). resolution은 lu에 강세. I'd like to는 /aɪd.laɪk.tə/로 to를 약하게.", "examples": {"easy": {"en": "Today I'll talk about patent damages.", "ko": "오늘은 특허 손해배상에 대해 말씀드리겠습니다."}, "practice": {"en": "Good morning. Today I'd like to talk about how Korean courts handle electronic evidence. I'll cover three points and leave ten minutes for questions.", "ko": "안녕하십니까. 오늘은 한국 법원이 전자증거를 어떻게 다루는지 말씀드리겠습니다. 세 가지를 다루고 질문 시간을 10분 남기겠습니다."}}, "grammar": {"axis": "G4", "title": "talk about는 about, discuss는 about 없이", "wrong": "Today I'd like to discuss about online dispute resolution.", "right": "Today I'd like to discuss online dispute resolution. / ... to talk about online dispute resolution.", "note": "discuss는 '~에 대해 논의하다'를 한 단어로 담아 about을 붙이지 않습니다. talk·speak는 about이 필요합니다."}, "collocations": ["My talk has three parts.", "Let me start with a short case.", "I'll focus on recent Supreme Court decisions.", "I'll leave some time for questions."]}, {"id": "talk-transition", "hw": "Let me move on to the next issue.", "ipa": "muːv · ˈɪʃ.uː", "stress": "**move** · **is**·sue", "stars": 1, "gloss": "발표 전환 — 다음 주제로 넘어가기", "pron_tip": "move on to는 /muː.vɑːn.tə/로 이어집니다. issue는 미국식 /ˈɪʃ.uː/이고 s를 /s/로 읽지 않습니다.", "examples": {"easy": {"en": "Now, let's move on.", "ko": "이제 넘어가겠습니다."}, "practice": {"en": "That covers the facts of the case. Let me move on to the court's reasoning, which is where it gets interesting.", "ko": "사안의 사실관계는 여기까지입니다. 이제 법원의 판단 이유로 넘어가겠습니다. 흥미로운 부분은 여기서부터입니다."}}, "grammar": {"axis": "G5", "title": "move on to — 구동사 + 전치사", "wrong": "Let me move to on the next issue.", "right": "Let me move on to the next issue.", "note": "move on(넘어가다)이 한 덩어리이고, 넘어갈 곳은 그 뒤에 to로 붙입니다. 순서를 바꾸지 않습니다."}, "collocations": ["Turning now to ...", "That brings me to my second point.", "Let me go back to the first case.", "Before I move on, ..."]}, {"id": "talk-time", "hw": "Due to time constraints, I'll skip the details.", "ipa": "kənˈstreɪnts · dɪˈteɪlz", "stress": "con·**straints** · de·**tails**", "stars": 1, "gloss": "시간 부족 — 내용을 건너뛸 때", "pron_tip": "constraints는 끝에 자음 /nts/가 몰려 있습니다. 모음을 끼워 넣지 말고 짧게 닫습니다. details는 tail에 강세를 두는 /dɪˈteɪlz/가 사전의 첫 발음이고, de에 두는 /ˈdiː.teɪlz/도 함께 쓰입니다.", "examples": {"easy": {"en": "I don't have much time, so I'll be brief.", "ko": "시간이 많지 않아 짧게 말씀드리겠습니다."}, "practice": {"en": "Due to time constraints, I'll skip the statistics, but they are in the handout and I'm happy to discuss them afterwards.", "ko": "시간 관계상 통계는 건너뛰겠습니다. 배포 자료에 있으니 끝난 뒤 말씀 나누면 좋겠습니다."}}, "grammar": {"axis": "G3", "title": "time은 셀 수 없다 — much time", "wrong": "I don't have many times.", "right": "I don't have much time.", "note": "'시간 여유'의 time은 불가산이라 much·a little과 씁니다. times는 '~번, ~배'(three times)라는 다른 뜻입니다."}, "collocations": ["I'm running out of time.", "In the interest of time, ...", "I'll be brief.", "The details are in the handout."]}, {"id": "polite-disagree", "hw": "I see your point, but I wonder if the rule works in every case.", "ipa": "ˈwʌn.dɚ · ruːl", "stress": "**won**·der · **rule**", "stars": 2, "gloss": "정중한 반론 — 동의한 뒤 의문 제기하기", "pron_tip": "wonder는 /ˈwʌn.dɚ/로 wander(돌아다니다, /ˈwɑːn.dɚ/)와 모음이 다릅니다. I see your point에서 point를 가장 세게 말하면 동의가 진심으로 들립니다.", "examples": {"easy": {"en": "I see your point, but I'm not sure.", "ko": "무슨 말씀인지 알겠지만 확신이 서지 않습니다."}, "practice": {"en": "I see your point about efficiency, but I wonder if a strict deadline might be unfair to self-represented parties.", "ko": "효율성에 관한 말씀은 이해합니다만, 엄격한 기한이 본인소송 당사자에게 불리하지 않을까 하는 의문이 듭니다."}}, "grammar": {"axis": "G6", "title": "point와 짝 동사 — see / make / raise", "wrong": "You did a good point.", "right": "You made a good point. / I see your point.", "note": "논점을 '말하다'는 make a point, '제기하다'는 raise a point, '이해하다'는 see your point. do와는 짝짓지 않습니다."}, "collocations": ["That's a fair point, but ...", "I'm not entirely convinced that ...", "With respect, I'd see it a little differently.", "Could the same rule apply to criminal cases?"]}], "corners": {"false_friend": {"title": "lawyer·attorney·counsel — 나를 뭐라고 소개할까", "body": ["셋 다 '변호사'로 옮기지만 쓰는 자리가 다릅니다. lawyer는 법률가를 두루 가리키는 가장 넓은 말이라 자기소개에 무난합니다. attorney는 의뢰인을 대리할 자격을 강조하는 미국식 말이고, counsel은 특정 사건에서 누군가를 대리하는 변호사를 가리킬 때 씁니다(counsel for the defendant). counsel은 보통 a를 붙이지 않습니다.", "Judge Kim은 주로 남이 부르는 호칭입니다. 처음 만난 사람에게는 I'm Hana Kim. I'm a judge at ...처럼 이름과 직업·소속을 함께 밝히는 편이 정보가 많고 무난합니다. 다만 직함+성의 자기소개가 틀린 것은 아닙니다. 회의를 주재하는 판사가 'I am Judge Scirica'라고 자기를 소개한 공식 기록도 있습니다(미국 연방법원 Judicial Conduct and Disability Rules 개정 공청회 전사, 2014. 10. 30., 3쪽). Your Honor도 법정에서 판사를 부를 때 쓰는 말이라 회의장 복도에서는 거의 쓰지 않습니다.", "이 장의 문형에 숨어 있는 가짜 친구를 모으면 이렇습니다."], "table": [["counsel", "조언, 상담", "(사건의) 변호인·소송대리인"], ["bench", "긴 의자", "법관석, 법관직(on the bench)"], ["bar", "술집, 막대", "변호사 단체·변호사 자격(the bar)"], ["panel", "판, 토론 패널", "재판부(three-judge panel)"], ["docket", "꼬리표, 내용 적은 쪽지", "사건부, 담당 사건 목록"], ["chambers", "방들", "판사실(in chambers)"]], "tip": "국제회의 명찰에는 직함 대신 소속을 적는 일이 많습니다. 대화에서는 Please call me Hana.라고 이름을 먼저 열어 두면 호칭 고민이 줄어듭니다."}, "drama": {"title": "상황극: 세션 후 질문", "facts": ["가상 장면입니다. 국제 법관 회의의 '법정 기술' 세션이 끝나고 질의응답 시간이 열렸습니다.", "등장인물: 사회자(Moderator), 발표자 Dr. Ellen Price(가상 인물, 영국 법원 행정 연구자), 질문자 Judge Daeho Lim(가상 인물, 한국 지방법원 판사).", "이 장의 문형 다섯 개(질문 시작·확인 질문·못 알아들었을 때·의견 말하기·마무리 인사)가 차례로 나옵니다."], "watch": "Moderator: We have time for one more question. Yes, the gentleman in the second row. / Judge Lim: Thank you. I'm Daeho Lim, a judge at a district court in Korea. Thank you for the great presentation. I have a short question. / Dr. Price: Of course. / Judge Lim: If I understood correctly, remote hearings are now the default for case management conferences. Could you say a little more about how you handle self-represented parties? / Dr. Price: Good question. We offer a 'hearing room' at the courthouse for people without a stable connection, and staff help them log in. / Judge Lim: Sorry, could you repeat the last part? / Dr. Price: Court staff help them log in. / Judge Lim: I see. From a Korean perspective, that seems very practical. Thank you. / Moderator: Thank you both. Let's give our speakers a hand.", "terms": ["Thank you for the great presentation.", "If I understood correctly, ...", "Could you say a little more about ...?", "Sorry, could you repeat the last part?", "From a Korean perspective, ...", "self-represented party (본인소송 당사자)"], "links": []}, "quote": {"text": "The opinion of the world community, while not controlling our outcome, does provide respected and significant confirmation for our own conclusions.", "ko": "국제사회의 견해는 우리 결론을 좌우하지는 않지만, 우리 결론을 존중받을 만하고 의미 있게 뒷받침해 준다.", "case": "Roper v. Simmons, 543 U.S. 551 (2005)", "decided" const VOICE_HINT = '기기에 영어 음성이 없어 소리가 나지 않습니다. Windows는 언어 설정에서 영어 음성을 추가하고, iPhone·Android는 보통 기본으로 들어 있습니다.';

function voiceNote(msg) {
  if (voiceNoted || PRINT) return; voiceNoted = true;
  const n = document.createElement('div'); n.className = 'voice-note'; n.setAttribute('role', 'status');
  n.innerHTML = `<span>${esc(msg)}</span><button type="button" aria-label="안내 닫기">×</button>`;
  n.querySelector('button').onclick = () => n.remove();
  document.body.appendChild(n); setTimeout(() => n.remove(), 15000);
}
function speak(text) {
  if (!('speechSynthesis' in window) || typeof SpeechSynthesisUtterance === 'undefined') { voiceNote('이 브라우저는 소리 읽기(음성 합성)를 지원하지 않습니다. ' + VOICE_HINT); return }
  try {
    const vs = speechSynthesis.getVoices();
    const v = vs.find(v => v.lang === 'en-US') || vs.find(v => /^en[-_]/i.test(v.lang));
    if (vs.length && !v) voiceNote(VOICE_HINT);
    if (!vs.length) setTimeout(() => { if (!speechSynthesis.getVoices().length) voiceNote('기기에 설치된 음성이 없어 소리가 나지 않습니다. ' + VOICE_HINT) }, 800);
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US'; u.rate = 0.9;
    if (v) u.voice = v;
    u.onerror = ev => { if (ev.error !== 'interrupted' && ev.error !== 'canceled') voiceNote(VOICE_HINT) };
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  } catch (e) { voiceNote(VOICE_HINT) }
}

    ${e.box ? `<div class="box"><h4>영미법 상식</h4>${esc(e.box)}</div>` : ''}
    ${g ? `<div class="gram"><h4>문법 한 스푼 · ${esc(GRAM[g.axis] || g.axis)}</h4><div><strong>${esc(g.title)}</strong></div>
      <div class="pair"><span class="x">✗</span><span class="xs">${esc(g.wrong)}</span><span class="o">✓</span><span>${esc(g.right)}</span></div>
      <div>${esc(g.note)}</div></div>` : ''}
    ${e.pitfalls ? `<ul class="pit">${e.pitfalls.map(p => `<li>${esc(p)}</li>`).join('')}</ul>` : ''}
    ${e.collocations ? `<div class="col" aria-label="같이 쓰는 표현">${e.collocations.map(c => `<span>${esc(c)}</span>`).join('')}</div>` : ''}
    ${e.links ? `<div class="links">${e.links.map(l => `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)} ↗</a>`).join('')}</div>` : ''}
  </article>`;
}

function cornersHTML(c) {
  const k = c.corners || {};
  let h = '';
  if (k.false_friend) {
    const f = k.false_friend;
    h += `<section class="corner"><div class="tag">가짜 친구</div><h3>${esc(f.title)}</h3>
      ${f.body.map(p => `<p>${esc(p)}</p>`).join('')}
      <div class="tbl"><table><thead><tr><th>단어</th><th>일상 뜻</th><th>법정에서</th></tr></thead><tbody>
      ${f.table.map(r => `<tr><td>${esc(r[0])}</td><td class="no">${esc(r[1])}</td><td>${esc(r[2])}</td></tr>`).join('')}</tbody></table></div>
      <p>${esc(f.tip)}</p></section>`;
  }
  if (k.quote) {
    const q = k.quote;
    h += `<section class="corner"><div class="tag">명판결 명문장</div>
      <p class="quote">“${esc(q.text)}”</p><div class="ko">${esc(q.ko)}</div>
      <p class="cite" style="margin-top:6px">— <i>${esc(q.case)}</i> · ${esc(q.decided)}</p>
      <div class="gl">${Object.entries(q.gloss).map(([a, b]) => `<span><b>${esc(a)}</b> ${esc(b)}</span>`).join('')}</div>
      <p><strong>왜 유명한가</strong> ${esc(q.why)}</p>
      <div class="links">${q.links.map(l => `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)} ↗</a>`).join('')}</div></section>`;
  }
  if (k.drama) {
    const d = k.drama;
    h += `<section class="corner"><div class="tag">법정 드라마로 배우기</div><h3>${esc(d.title)}</h3>
      <ul class="pit">${d.facts.map(f => `<li>${esc(f)}</li>`).join('')}</ul>
      <p><strong>이렇게 보세요</strong> ${esc(d.watch)}</p>
      <div class="col">${d.terms.map(t => `<span>${esc(t)}</span>`).join('')}</div>
      <div class="links">${d.links.map(l => `<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)} ↗</a>`).join('')}</div></section>`;
  }
  if (k.korea) {
    const r = k.korea;
    h += `<section class="corner"><div class="tag">한국이라면?</div><h3>${esc(r.title)}</h3>
      <p><strong>미국</strong> ${esc(r.us)}</p><p><strong>한국</strong> ${esc(r.kr)}</p>
      <div class="say-box"><div class="e">${esc(r.say)}</div><div class="ko">${esc(r.say_ko)}</div></div></section>`;
  }
  return h;
}

function chapterHead(c) {
  const m = c.chapter;
  return `<section class="chap"><div class="no">Chapter ${m.num}</div><h1>${esc(m.title)} — ${esc(m.subtitle)}</h1>
    <p class="en">${esc(m.title_en)}</p><p class="lead">${esc(m.lead)}</p>
    <div class="cansay"><h2>이 장을 마치면 이렇게 말할 수 있습니다</h2><ol>
    ${m.can_say.map(s => `<li><span class="e">${esc(s.en)}</span> ${sayBtn(s.en)}<span class="k ko">${esc(s.ko)}</span></li>`).join('')}</ol></div></section>`;
}

function filtered(c) {
  const q = state.q.trim().toLowerCase();
  return c.entries.filter(e => {
    if (state.stars && e.stars < state.stars) return false;
    if (state.gram && (!e.grammar || e.grammar.axis !== state.gram)) return false;
    if (state.ff && !e.false_friend) return false;
    if (q) {
      const hay = [e.hw, e.gloss, e.diff, e.examples?.easy?.en, e.examples?.practice?.en, ...(e.collocations || [])].join(' ').toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}

function toolsHTML() {
  const t = (m, l) => `<button class="tab" role="tab" aria-selected="${state.mode === m}" data-mode="${m}">${l}</button>`;
  return `<div class="tools" data-screen>
    <div class="row"><div class="tabs" role="tablist">${t('read', '읽기')}${t('cards', '플래시카드')}${t('quiz', '퀴즈')}</div>
    <select id="chsel" aria-label="장 선택" style="margin-left:auto">${TOC.map(x => `<option value="${x.num}"${x.num === C.chapter.num ? ' selected' : ''}${READY.has(x.num) ? '' : ' disabled'}>${x.num}장 ${esc(x.title)}${READY.has(x.num) ? '' : ' (준비 중)'}</option>`).join('')}</select></div>
    ${state.mode === 'read' ? `<div class="row">
      <input type="search" id="q" placeholder="영어·한국어로 찾기" value="${esc(state.q)}" aria-label="표현 찾기">
      <select id="stars" aria-label="중요도"><option value="0">모든 중요도</option><option value="3"${state.stars == 3 ? ' selected' : ''}>★★★만</option><option value="2"${state.stars == 2 ? ' selected' : ''}>★★ 이상</option></select>
      <select id="gram" aria-label="문법 주제"><option value="">모든 문법</option>${Object.entries(GRAM).map(([k, v]) => `<option value="${k}"${state.gram === k ? ' selected' : ''}>${v}</option>`).join('')}</select>
    </div>
    <div class="row">
      <label class="tog"><input type="checkbox" id="ff"${state.ff ? ' checked' : ''}> 가짜 친구만</label>
      <label class="tog"><input type="checkbox" id="hideko"${state.hideKo ? ' checked' : ''}> 한국어 가리기 (눌러서 보기)</label>
      <span class="count" id="count"></span>
    </div>` : ''}
  </div>`;
}

function renderRead(c) {
  const list = filtered(c);
  const filteredNow = state.q || state.stars || state.gram || state.ff;
  return `<div class="list">${list.map(entryHTML).join('') || '<p>조건에 맞는 표현이 없습니다. 필터를 풀어 보세요.</p>'}</div>
    ${filteredNow ? '' : cornersHTML(c)}`;
}

function renderCards(c) {
  const known = new Set(store.get('known', []));
  const deck = c.entries.filter(e => !known.has(e.id));
  if (!deck.length) return `<div class="fc"><p>이 장의 카드를 모두 외웠습니다.</p><button class="btn" id="resetcards">처음부터 다시</button></div>`;
  const i = Math.min(state.ci || 0, deck.length - 1);
  const e = deck[i];
  const back = state.flip;
  return `<div class="fc">
    <div class="prog">남은 카드 ${deck.length}장 · 외운 카드 ${known.size}장</div>
    <div class="card" id="card" role="button" tabindex="0" aria-label="카드 뒤집기">
      ${back ? `<div style="text-align:center"><div class="gloss" style="margin:0">${esc(e.gloss)}</div>
        <p class="stress" style="margin:6px 0">${md(e.stress)}</p>
        <div style="font-family:var(--f-display)">${esc(e.examples.easy.en)}</div><div class="ko">${esc(e.examples.easy.ko)}</div></div>`
      : `<div class="front">${esc(e.hw)}</div><div class="hint">눌러서 뒤집기</div>`}
    </div>
    <div class="fcbtns">${sayBtn(spoken(e.hw))}
      <button class="btn" id="again">아직 몰라요</button>
      <button class="btn pri" id="know">외웠어요</button></div>
  </div>`;
}

function renderQuiz(c) {
  const ans = state.ans || {};
  const done = Object.keys(ans).length;
  const score = c.quiz.filter((q, i) => ans[i] === q.answer).length;
  return `<div class="quiz">${c.quiz.map((q, i) => {
    const a = ans[i];
    return `<div class="qi"><p class="qq">${i + 1}. ${esc(q.q)}${q.grammar ? `<span class="gtag">문법</span>` : ''}</p>
      <div class="opts">${q.options.map((o, j) => {
        let cls = 'opt';
        if (a != null) { if (j === q.answer) cls += ' right'; else if (j === a) cls += ' wrong'; }
        return `<button class="${cls}" data-q="${i}" data-o="${j}"${a != null ? ' disabled' : ''}>${esc(o)}</button>`;
      }).join('')}</div>
      ${a != null ? `<p class="why">${a === q.answer ? '정답입니다. ' : '정답은 ' + esc(q.options[q.answer]) + '. '}${esc(q.why)}</p>` : ''}</div>`;
  }).join('')}
  <div class="row"><span class="score">${done} / ${c.quiz.length} 풀이 · ${score}개 정답</span>${done ? '<button class="btn" id="retry">다시 풀기</button>' : ''}</div></div>`;
}

function printAnswers(c) {
  return `<section class="answers"><h2>${c.chapter.num}장 퀴즈 정답</h2><ol>${c.quiz.map(q => `<li>${esc(q.options[q.answer])} — ${esc(q.why)}</li>`).join('')}</ol></section>`;
}
function printQuiz(c) {
  return `<section class="corner"><div class="tag">장 끝 퀴즈</div><ol>${c.quiz.map(q => `<li><p>${esc(q.q)}</p><p>${q.options.map((o, j) => `(${'abcd'[j]}) ${esc(o)}`).join('&nbsp;&nbsp; ')}</p></li>`).join('')}</ol></section>`;
}

const TOC = META.toc;
const READY = new Set(DATA.map(c => c.chapter.num));
const tocTitle = t => t.title + (t.subtitle ? ' — ' + t.subtitle : '');
function curNum() {
  const m = location.hash.match(/^#ch(\d+)$/);
  if (m && TOC.some(t => t.num === +m[1])) return +m[1];
  return DATA[0].chapter.num;
}
function tocHTML(cur, open) {
  return `<details class="toc" data-screen${open ? ' open' : ''}><summary>차례 · 전체 ${TOC.length}장 (${READY.size}장 공개)</summary><ol class="tocl">
    ${TOC.map(t => `<li class="${t.num === cur ? 'cur' : ''}"><span class="n">${t.num}</span>${READY.has(t.num)
      ? `<a href="#ch${t.num}">${esc(tocTitle(t))}</a>`
      : `<span class="soon">${esc(tocTitle(t))}<small>준비 중</small></span>`}</li>`).join('')}</ol></details>`;
}
function chnavHTML(cur) {
  const i = TOC.findIndex(t => t.num === cur);
  const cell = (t, cls, lab) => !t ? '' : READY.has(t.num)
    ? `<a class="${cls}" href="#ch${t.num}"><span class="lab">${lab}</span><span class="t">${t.num}장 ${esc(t.title)}</span></a>`
    : `<span class="${cls}"><span class="lab">${lab} · 준비 중</span><span class="t">${t.num}장 ${esc(t.title)}</span></span>`;
  return `<nav class="chnav" aria-label="장 이동">${cell(TOC[i - 1], 'prev', '← 이전 장')}${cell(TOC[i + 1], 'next', '다음 장 →')}</nav>`;
}
function printTOC() {
  return `<section class="printtoc"><h1>차례</h1><ol>${TOC.map(t => READY.has(t.num)
    ? `<li><a href="#ch${t.num}">${t.num}장 ${esc(tocTitle(t))}</a></li>`
    : `<li class="soon">${t.num}장 ${esc(tocTitle(t))} (준비 중)</li>`).join('')}</ol></section>`;
}
let C = DATA[0];
function render() {
  const n = curNum();
  if (!PRINT && C.chapter.num !== n) { state.ans = {}; state.ci = 0; state.flip = false; }
  document.getElementById('app').classList.toggle('hideko', state.hideKo && !PRINT);
  if (PRINT) {
    root.innerHTML = printTOC() + DATA.map(c => { C = c; return `<div id="ch${c.chapter.num}">${chapterHead(c)}<div class="list">${c.entries.map(entryHTML).join('')}</div>${cornersHTML(c)}${printQuiz(c)}${printAnswers(c)}</div>` }).join('');
    return;
  }
  const c = DATA.find(x => x.chapter.num === n);
  if (!c) {
    const t = TOC.find(x => x.num === n);
    root.innerHTML = tocHTML(n, true) + `<section class="soonpage"><div class="no" style="font-family:var(--f-display);font-style:italic;color:var(--margin)">Chapter ${n}</div><h1 style="margin:2px 0">${esc(tocTitle(t))}</h1><p>이 장은 준비 중입니다. 차례에서 공개된 장을 골라 주세요.</p></section>` + chnavHTML(n);
    return;
  }
  C = c;
  let body = tocHTML(n, false) + chapterHead(c) + toolsHTML();
  if (state.mode === 'cards') body += renderCards(c);
  else if (state.mode === 'quiz') body += renderQuiz(c);
  else body += renderRead(c);
  root.innerHTML = body + chnavHTML(n);
  const cnt = document.getElementById('count');
  if (cnt) cnt.textContent = `${filtered(c).length} / ${c.entries.length}개 표현`;
  bind();
}
window.addEventListener('hashchange', () => { render(); window.scrollTo(0, 0) });

function bind() {
  root.querySelectorAll('[data-say]').forEach(b => b.onclick = ev => { ev.stopPropagation(); speak(b.dataset.say) });
  root.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => { state.mode = b.dataset.mode; store.set('mode', state.mode); render() });
  const q = document.getElementById('q');
  if (q) q.oninput = () => { state.q = q.value; const pos = q.selectionStart; render(); const n = document.getElementById('q'); n.focus(); n.setSelectionRange(pos, pos) };
  const cs = document.getElementById('chsel'); if (cs) cs.onchange = () => { location.hash = 'ch' + cs.value };
  const s = document.getElementById('stars'); if (s) s.onchange = () => { state.stars = +s.value; render() };
  const g = document.getElementById('gram'); if (g) g.onchange = () => { state.gram = g.value; render() };
  const ff = document.getElementById('ff'); if (ff) ff.onchange = () => { state.ff = ff.checked; render() };
  const hk = document.getElementById('hideko'); if (hk) hk.onchange = () => { state.hideKo = hk.checked; store.set('hideKo', state.hideKo); render() };
  root.querySelectorAll('.ko, .gloss-ko').forEach(el => el.onclick = () => el.classList.toggle('peek'));
  const card = document.getElementById('card');
  if (card) { const f = () => { state.flip = !state.flip; render() }; card.onclick = f; card.onkeydown = ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); f() } } }
  const deckIds = () => { const k = new Set(store.get('known', [])); return C.entries.filter(e => !k.has(e.id)) };
  const know = document.getElementById('know');
  if (know) know.onclick = () => { const d = deckIds(); const e = d[Math.min(state.ci || 0, d.length - 1)]; const k = store.get('known', []); k.push(e.id); store.set('known', k); state.flip = false; render() };
  const again = document.getElementById('again');
  if (again) again.onclick = () => { const d = deckIds(); state.ci = ((state.ci || 0) + 1) % d.length; state.flip = false; render() };
  const rc = document.getElementById('resetcards'); if (rc) rc.onclick = () => { store.set('known', []); state.ci = 0; render() };
  root.querySelectorAll('.opt').forEach(b => b.onclick = () => { state.ans = { ...(state.ans || {}), [b.dataset.q]: +b.dataset.o }; render() });
  const rt = document.getElementById('retry'); if (rt) rt.onclick = () => { state.ans = {}; render() };
}
render();
</script>

</body></html>
